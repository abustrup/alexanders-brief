jordskælvskatastrofen","sourceUrl":"https://www.cbsnews.com/news/7-1-magnitude-earthquake-venezuela-tsunami-advisory-puerto-rico-virgin-islands/"}},{"id":"story-ebola-update-20260620","eventKey":"bundibugyo-ebola-drc-uganda-2026","materialFacts":["DR Congo har nu 933 bekræftede tilfælde og 245 dødsfald","Africa CDC følger 35.000 mistænkte kontakter","Uganda har registreret 19 tilfælde og to dødsfald"],"section":"Sundhed","headline":"Mourners bury a 6-month-old Ebola victim in the Congo outbreak’s 3rd orphanage death","primarySourceUrl":"https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e","subheadline":"Bundibugyo-udbruddet er vokset til 933 bekræftede tilfælde, og kontaktsporingen omfatter 35.000 mennesker","body":["DR Congos sundhedsminister oplyser nu 933 bekræftede tilfælde og 245 dødsfald. Mere end 90 procent ligger i Ituri. Uganda har 19 tilfælde og to dødsfald, mens Africa CDC følger 35.000 mistænkte kontakter.","Tallene er væsentligt højere end i gårsdagens brief. Konflikt, modstand mod sikre begravelser og mangel på beskyttelsesudstyr hæmmer responsen. Varianten har ingen godkendt specifik vaccine eller behandling, og manglende tidlig testning lod smitten brede sig."],"whyItMatters":"35.000 kontakter gør udbruddet til et logistisk problem. Hver forsinket test øger behovet for personale, isolation og grænsekoordination.","analysis":"Acceleration under svag statskapacitet er nøglesignalet. Gratis behandling og højere bonus kan hjælpe bemandingen, men løser ikke mistillid og usikkerhed.","image":{"url":"https://dims.apnews.com/dims4/default/9bcc5e5/2147483647/strip/true/crop/6434x4287+0+1/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2Ff3%2Fad%2F5bc5c1d30109dd0710913a0f83ca%2Fa7cbd0bf2ddb471281a6392537f4b1a1","credit":"AP Photo/Moses Sawasawa","alt":"Begravelse af et seks måneder gammelt Ebola-offer i Bunia","sourceUrl":"https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e"},"topics":["global sundhed","Ebola","beredskab","bioteknologi"],"entities":["DR Congo","Uganda","WHO","Africa CDC"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":94,"decisionValue":82,"novelty":90,"sourceQuality":93,"personalRelevance":70,"contrast":84},"claims":[{"text":"DR Congo har 933 bekræftede tilfælde og 245 dødsfald.","sourceUrls":["https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e","https://www.dr.dk/nyheder/seneste/250-personer-er-doede-af-ebola-i-dr-congo"],"confidence":"high"},{"text":"Africa CDC følger 35.000 mistænkte kontakter, og Uganda har 19 tilfælde og to dødsfald.","sourceUrls":["https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e"],"confidence":"high"},{"text":"Udbruddet skyldes Bundibugyo Ebola-virus.","sourceUrls":["https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON602"],"confidence":"high"}],"sources":[{"title":"Mourners bury a 6-month-old Ebola victim in the Congo outbreak’s 3rd orphanage death","publisher":"Associated Press","url":"https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e","publishedAt":"2026-06-19T18:14:48Z","kind":"reporting"},{"title":"245 personer er døde af Ebola i DR Congo","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/250-personer-er-doede-af-ebola-i-dr-congo","publishedAt":"2026-06-20T02:08:41Z","kind":"reporting"},{"title":"Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo & Uganda","publisher":"WHO","url":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON602","publishedAt":"2026-05-17T00:00:00Z","kind":"primary"}]},{"id":"bf-20251214-1","eventKey":"bondi-beach-hanukkah-attack","materialFacts":["15 mennesker dræbt og omkring 40 såret ved Archer Park, Bondi Beach, den 14. december 2025.","Gerningsmændene var Sajid Akram (50, indisk statsborger og australsk permanent opholdstilladelse) og hans søn Naveed Akram (24, australsk statsborger).","Sajid blev dræbt af politiet på stedet; Naveed blev anholdt og sigtet for 15 drab og 44 andre forhold.","Premierminister Albanese kaldte angrebet 'en handling af rent ondskab, antisemitisme og terrorisme'."],"section":"Verden","headline":"Terrorangreb mod Hanukkah-fejring på Bondi Beach dræber 15","primarySourceUrl":"https://en.wikipedia.org/wiki/2025_Bondi_Beach_shooting","subheadline":"To bevæbnede mænd, far og søn, åbnede ild mod en jødisk højtidsfejring i Sydney i et angreb beskrevet som antisemitisk og inspireret af Islamisk Stat.","body":["Søndag aften den 14. december åbnede Sajid Akram og hans søn Naveed Akram ild mod omkring 1.000 mennesker, der fejrede Hanukkah ved Archer Park på Bondi Beach. 15 mennesker blev dræbt og omkring 40 såret. Ofrenes alder spændte fra 10 til 87 år.","Politiet skød den ældre gerningsmand, Sajid, mens sønnen Naveed blev såret og anholdt og senere sigtet for 15 drab. Blandt de dræbte var en Holocaust-overlever, en 10-årig pige og en Chabad-rabbiner, og ofrene talte franske, slovakiske og israelske statsborgere.","Premierminister Anthony Albanese kaldte angrebet 'en handling af rent ondskab, en handling af antisemitisme og terrorisme på vores kyster' og sagde, det var bevidst rettet mod det jødiske samfund."],"whyItMatters":"Det er et af de dødeligste terrorangreb i Australiens nyere historie og det blodigste antisemitiske angreb i landet i årtier. Det rammer midt i en global bølge af antisemitisk vold efter Gaza-krigen og rejser akutte spørgsmål om radikalisering, våbenlovgivning og beskyttelse af jødiske samfund i Vesten.","analysis":"Angrebet kombinerer to bekymrende tendenser: IS-inspireret terror og stigende antisemitisme. At gerningsmændene var en far og søn med lovligt registrerede våben, gør sagen særligt ubehagelig for australske myndigheder, der nu står med både en efterretningsfiasko og en retssag mod den overlevende gerningsmand. Politisk vil det presse debatten om våbenkontrol og overvågning af radikalisering.","topics":["terror","geopolitik","antisemitisme"],"entities":["Bondi Beach","Sydney","Australien","Anthony Albanese","Islamisk Stat","Sajid Akram","Naveed Akram"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":96,"decisionValue":60,"novelty":70,"sourceQuality":80,"personalRelevance":40,"contrast":50},"claims":[{"text":"15 mennesker dræbt og omkring 40 såret ved Archer Park, Bondi Beach, den 14. december 2025.","sourceUrls":["https://en.wikipedia.org/wiki/2025_Bondi_Beach_shooting","https://www.aljazeera.com/news/2025/12/15/bondi-beach-attack-what-do-we-know-about-the-victims-suspects","https://www.nbcnews.com/world/australia/bondi-beach-shooting-victims-australia-hanukkah-attack-rcna249203"],"confidence":"medium"}],"sources":[{"title":"2025 Bondi Beach shooting","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/2025_Bondi_Beach_shooting","publishedAt":"2025-12-15T00:00:00.000Z","kind":"reporting"},{"title":"Bondi Beach shooting: What do we know about the victims, suspects?","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2025/12/15/bondi-beach-attack-what-do-we-know-about-the-victims-suspects","publishedAt":"2025-12-15T00:00:00.000Z","kind":"reporting"},{"title":"What we know about the victims of the Bondi Beach shooting in Australia","publisher":"NBC News","url":"https://www.nbcnews.com/world/australia/bondi-beach-shooting-victims-australia-hanukkah-attack-rcna249203","publishedAt":"2025-12-15T00:00:00.000Z","kind":"reporting"}]},{"id":"bf-20260228-decapitation","eventKey":"khamenei-killed","materialFacts":["Det israelske luftvåben indledte kl. 06:45 UTC en bølge af decapiteringsangreb","Irans øverste leder Ali Khamenei og flere højtstående embedsmænd blev dræbt","Embedsmændene deltog i tre møder på Khameneis residens, da angrebene ramte"],"section":"Verden","headline":"Irans øverste leder Khamenei dræbt i israelske angreb","primarySourceUrl":"https://en.wikipedia.org/wiki/Timeline_of_the_2026_Iran_war","subheadline":"En bølge af decapiteringsangreb rammer Irans ledelse i krigens første timer","body":["Kort efter de første angreb indledte det israelske luftvåben kl. 06:45 UTC en hidtil uset bølge af decapiteringsangreb. Irans øverste leder Ali Khamenei og flere højtstående embedsmænd blev dræbt, mens de deltog i møder på hans residens.","At ramme statens øverste ledelse i de første timer er et bevidst forsøg på at lamme Irans kommando og kontrol — men efterlader også et farligt magttomrum i et land i krig."],"whyItMatters":"Drabet på en stats øverste leder er en ekstraordinær optrapning, der gør forløbet uforudsigeligt og hæver risikoen for en bredere regional krig.","analysis":"Decapiteringsstrategien kan svække en modstanders evne til at koordinere modangreb på kort sigt, men historisk fører den sjældent til hurtig kapitulation; et magttomrum kan i stedet sprede konflikten og besværliggøre enhver senere forhandlet afslutning.","topics":["geopolitik","iran","konflikt"],"entities":["Iran","Israel","Ali Khamenei"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":95,"decisionValue":70,"novelty":88,"sourceQuality":80,"personalRelevance":45,"contrast":60},"claims":[{"text":"Ali Khamenei og flere højtstående embedsmænd blev dræbt i israelske decapiteringsangreb 28. februar 2026","sourceUrls":["https://en.wikipedia.org/wiki/Timeline_of_the_2026_Iran_war"],"confidence":"high"}],"sources":[{"title":"Timeline of the 2026 Iran war","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/Timeline_of_the_2026_Iran_war","publishedAt":"2026-02-28T09:30:00.000Z","kind":"reporting"},{"title":"2026 Iran war","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/2026_Iran_war","publishedAt":"2026-02-28T10:00:00.000Z","kind":"reporting"}]},{"id":"bf-20251013-1","eventKey":"gaza-hostage-release-final-living","materialFacts":["Hamas frigav den 13. oktober 2025 de sidste 20 levende israelske gidsler efter godt to års fangenskab.","Overdragelsen skete via Den Internationale Røde Kors-komité som led i første fase af våbenhvileaftalen.","Hamas afleverede samme dag kun fire af de 28 afdøde gidsler.","Frigivelsen var en del af Trumps 20-punktsplan for at afslutte krigen i Gaza."],"section":"Verden","headline":"De sidste 20 levende gidsler er hjemme: Gaza-aftalens første fase træder i kraft","primarySourceUrl":"https://www.npr.org/2025/10/13/g-s1-93207/hamas-releasing-israeli-hostages","subheadline":"To år efter Hamas' angreb den 7. oktober 2023 overdrog bevægelsen alle resterende levende israelske gidsler til Røde Kors og Israel.","body":["Mandag den 13. oktober frigav Hamas de sidste 20 levende israelske gidsler, der havde været holdt fanget i godt to år. Overdragelsen skete via Røde Kors som led i første fase af våbenhvileaftalen, der byggede på Donald Trumps 20-punktsplan for Gaza.","Frigivelsen udløste følelsesladede scener i Israel, hvor familier havde ventet siden angrebet den 7. oktober 2023. Hamas afleverede samtidig kun fire af de 28 afdøde gidsler, hvilket efterlod spørgsmålet om de øvrige omkomnes jordiske rester uafklaret.","Gidselløsladelsen var koblet til en samtidig israelsk frigivelse af palæstinensiske fanger og dannede rammen om en dag, hvor Trump både besøgte Israel og deltog i et internationalt topmøde i Egypten."],"whyItMatters":"Hjemkomsten af de sidste levende gidsler markerede det mest håndgribelige vendepunkt i krigen siden oktober 2023 og var forudsætningen for, at våbenhvilen og den bredere fredsplan overhovedet kunne tage form.","analysis":"Dagen blev iscenesat som et historisk gennembrud, men aftalen efterlod de tungeste spørgsmål ubesvarede: afvæbning af Hamas, Gazas fremtidige styre og de afdøde gidslers rester. Frigivelsen gav momentum, men holdbarheden af våbenhvilen afhang af de næste, langt vanskeligere faser.","topics":["geopolitik","mellemøsten","konflikt"],"entities":["Hamas","Israel","Donald Trump","Røde Kors","Gaza"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":96,"decisionValue":60,"novelty":70,"sourceQuality":80,"personalRelevance":40,"contrast":50},"claims":[{"text":"Hamas frigav den 13. oktober 2025 de sidste 20 levende israelske gidsler efter godt to års fangenskab.","sourceUrls":["https://www.npr.org/2025/10/13/g-s1-93207/hamas-releasing-israeli-hostages","https://www.pbs.org/newshour/world/living-hostages-and-palestinian-prisoners-released-as-part-of-gaza-ceasefire"],"confidence":"medium"}],"sources":[{"title":"Israeli hostages freed, hundreds of Palestinians released, as Trump hails 'historic dawn'","publisher":"NPR","url":"https://www.npr.org/2025/10/13/g-s1-93207/hamas-releasing-israeli-hostages","publishedAt":"2025-10-13T08:00:00.000Z","kind":"reporting"},{"title":"Living hostages and Palestinian prisoners released as part of Gaza ceasefire","publisher":"PBS News","url":"https://www.pbs.org/newshour/world/living-hostages-and-palestinian-prisoners-released-as-part-of-gaza-ceasefire","publishedAt":"2025-10-13T10:00:00.000Z","kind":"reporting"}]},{"id":"bf-20250815-1","eventKey":"trump-putin-alaska-summit","materialFacts":["Topmødet fandt sted 15. august 2025 på Joint Base Elmendorf-Richardson i Anchorage, Alaska.","Trump og Putin talte i knap tre timer og forlod mødet uden våbenhvile eller aftale om Ukraine.","Ukraines præsident Zelenskyj deltog ikke i topmødet.","Trump oplyste, at han ville mødes med Zelenskyj i Det Hvide Hus den følgende mandag."],"section":"Verden","headline":"Trump og Putin mødtes i Alaska – men forlod topmødet uden aftale om Ukraine","primarySourceUrl":"https://www.aljazeera.com/news/2025/8/16/no-deal-at-trump-putin-meeting-key-takeaways-from-alaska-summit","subheadline":"Næsten tre timers samtaler i Anchorage endte uden våbenhvile; Trump talte om 'fremskridt', mens lægen på Ukraines side fortsat var fraværende.","body":["USA's præsident Donald Trump og Ruslands præsident Vladimir Putin mødtes 15. august på Joint Base Elmendorf-Richardson nær Anchorage i Alaska. Det var Putins første besøg på amerikansk jord i omkring et årti, og hovedemnet var krigen i Ukraine.","Efter knap tre timers samtaler trådte de to ledere frem til en fælles pressekonference uden at annoncere en våbenhvile eller en aftale. Trump talte om 'store fremskridt', mens Putin kaldte forhandlingerne 'grundige' og 'nyttige'. Ukraines præsident Volodymyr Zelenskyj var ikke inviteret.","Trump signalerede efterfølgende, at byrden nu lå hos Ukraine for at afgive territorium, og oplyste, at han ville mødes med Zelenskyj i Det Hvide Hus den følgende mandag for at drøfte vejen videre."],"whyItMatters":"Mødet var det første topmøde mellem en amerikansk og en russisk præsident siden Ruslands fuldskala-invasion i 2022 og placerede spørgsmålet om territorielle indrømmelser i centrum af enhver fremtidig fredsplan – uden Ukraine ved bordet.","analysis":"Fraværet af en aftale var i sig selv et resultat: optikken af Putin modtaget på amerikansk jord styrkede Kreml diplomatisk, mens presset for territorielle indrømmelser flyttede over på Kyiv. Det efterfølgende møde i Det Hvide Hus blev dermed reelt en test af, hvor langt Washington ville gå i at binde Ukraine til betingelser forhandlet over hovedet på landet.","topics":["geopolitik","ukrainekrigen","diplomati"],"entities":["Donald Trump","Vladimir Putin","Volodymyr Zelenskyj","USA","Rusland","Ukraine","Alaska"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":96,"decisionValue":60,"novelty":70,"sourceQuality":80,"personalRelevance":40,"contrast":50},"claims":[{"text":"Topmødet fandt sted 15. august 2025 på Joint Base Elmendorf-Richardson i Anchorage, Alaska.","sourceUrls":["https://www.aljazeera.com/news/2025/8/16/no-deal-at-trump-putin-meeting-key-takeaways-from-alaska-summit","https://en.wikipedia.org/wiki/2025_Russia%E2%80%93United_States_summit","https://www.cnn.com/politics/live-news/trump-putin-meeting-news-08-15-25"],"confidence":"medium"}],"sources":[{"title":"'No deal' at Trump-Putin meeting: Key takeaways from Alaska summit","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2025/8/16/no-deal-at-trump-putin-meeting-key-takeaways-from-alaska-summit","publishedAt":"2025-08-16T00:00:00.000Z","kind":"reporting"},{"title":"2025 Russia–United States summit","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/2025_Russia%E2%80%93United_States_summit","publishedAt":"2025-08-15T00:00:00.000Z","kind":"reporting"},{"title":"August 15, 2025: Trump-Putin summit ends without concrete deal","publisher":"CNN","url":"https://www.cnn.com/politics/live-news/trump-putin-meeting-news-08-15-25","publishedAt":"2025-08-15T00:00:00.000Z","kind":"reporting"}]},{"id":"bf-20260517-1","eventKey":"who-ebola-bundibugyo-pheic-drc-uganda","materialFacts":["WHO erklærede PHEIC den 17. maj 2026 for Ebola forårsaget af Bundibugyo-virus.","Pr. 16. maj: otte bekræftede tilfælde, 246 mistænkte tilfælde og 80 mistænkte dødsfald.","To bekræftede tilfælde, heraf et dødsfald, i Kampala, Uganda, blandt rejsende fra Congo.","Der findes ingen godkendt vaccine eller specifik behandling mod Bundibugyo-varianten."],"section":"Verden","headline":"WHO erklærer Ebola-udbrud i Congo og Uganda for global sundhedskrise","primarySourceUrl":"https://www.who.int/news/item/17-05-2026-epidemic-of-ebola-disease-in-the-democratic-republic-of-the-congo-and-uganda-determined-a-public-health-emergency-of-international-concern","subheadline":"Generaldirektør Tedros udløser den højeste alarm, PHEIC, efter at den sjældne Bundibugyo-variant spredte sig over grænsen til Ugandas hovedstad.","body":["WHO's generaldirektør Tedros Adhanom Ghebreyesus erklærede søndag den 17. maj 2026 udbruddet af Ebola forårsaget af Bundibugyo-virus i Den Demokratiske Republik Congo og Uganda for en folkesundhedsmæssig krisesituation af international betydning (PHEIC) — organisationens højeste alarmniveau.","Pr. 16. maj var der registreret otte laboratoriebekræftede tilfælde, 246 mistænkte tilfælde og 80 mistænkte dødsfald, hovedsageligt i Ituri-provinsen i det østlige Congo. To bekræftede tilfælde, heraf et dødsfald, blev konstateret i Kampala blandt rejsende fra Congo.","Tedros begrundede beslutningen med stigende smittetal, grænseoverskridende spredning og betydelig usikkerhed om udbruddets reelle omfang. Der findes ingen godkendt vaccine eller specifik behandling mod Bundibugyo-varianten."],"whyItMatters":"En PHEIC er WHO's stærkeste signal og udløser international koordinering, finansiering og rejseovervågning. At smitten allerede har nået en millionby som Kampala — kombineret med fraværet af en godkendt vaccine mod netop denne Ebola-variant — gør udbruddet til en akut grænseoverskridende trussel midt i en humanitær krise i det østlige Congo.","analysis":"Erklæringen kom usædvanligt hurtigt: WHO blev først alarmeret 5. maj, og varianten blev bekræftet 15. maj. Den hurtige optrapning afspejler erfaringerne fra tidligere Ebola-udbrud, hvor forsinket respons kostede liv. Den afgørende variabel bliver, om sundhedsvæsenet kan inddæmme smitten i byområder med stor befolkningsmobilitet og et stort net af uformelle klinikker.","topics":["sundhed","afrika","epidemi"],"entities":["WHO","Tedros Adhanom Ghebreyesus","Den Demokratiske Republik Congo","Uganda","Kampala"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":92,"decisionValue":60,"novelty":70,"sourceQuality":80,"personalRelevance":40,"contrast":50},"claims":[{"text":"WHO erklærede PHEIC den 17. maj 2026 for Ebola forårsaget af Bundibugyo-virus.","sourceUrls":["https://www.who.int/news/item/17-05-2026-epidemic-of-ebola-disease-in-the-democratic-republic-of-the-congo-and-uganda-determined-a-public-health-emergency-of-international-concern","https://news.un.org/en/story/2026/05/1167531"],"confidence":"medium"}],"sources":[{"title":"Epidemic of Ebola Disease caused by Bundibugyo virus in the Democratic Republic of the Congo and Uganda determined a public health emergency of international concern","publisher":"World Health Organization","url":"https://www.who.int/news/item/17-05-2026-epidemic-of-ebola-disease-in-the-democratic-republic-of-the-congo-and-uganda-determined-a-public-health-emergency-of-international-concern","publishedAt":"2026-05-17T18:00:00.000Z","kind":"reporting"},{"title":"Ebola outbreak in Central Africa declared a 'Public Health Emergency of International Concern'","publisher":"UN News","url":"https://news.un.org/en/story/2026/05/1167531","publishedAt":"2026-05-17T20:00:00.000Z","kind":"reporting"}]},{"id":"story-cuba-reforms-20260620","eventKey":"cuba-176-market-reforms-2026","materialFacts":["Cuba har vedtaget en pakke med 176 økonomiske tiltag","Pakken åbner for privat bankdrift, direkte handel og diaspora-investeringer","Myndighederne advarer om langsom implementering og fortsatte sanktionsbarrierer"],"section":"Økonomi","headline":"Cuba pushes through sweeping free-market reforms in biggest economic shift since the revolution","primarySourceUrl":"https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795","subheadline":"176 tiltag udfordrer statens handelsmonopol, men amerikanske sanktioner og cubansk bureaukrati kan bremse effekten","body":["Cuba har vedtaget 176 tiltag med private banker, direkte import og eksport, friere ansættelser og investeringer fra cubanere i udlandet. Observatører kalder det øens største markedsskifte siden revolutionen.","Reformen følger fem års forværring og lange strømafbrydelser. Regeringen advarer om langsom implementering. Uden adgang til dollarbetalinger, brændstof og kapital kan flere elementer forblive juridiske muligheder uden volumen."],"whyItMatters":"Cuba flytter grænsen for privat koordinering. Det kan ændre ejerskab, prissignaler og diasporakapital i en statsstyret økonomi.","analysis":"Pakken ligner en kontrolleret kinesisk-vietnamesisk åbning uden samme kapitaladgang. Testen er, om banker får licenser, virksomheder får valuta, og staten afgiver kontrol.","counterpoint":"Tidligere reformer er strandet i bureaukrati, mens sanktioner fortsat begrænser finansiering og energi.","image":{"url":"https://dims.apnews.com/dims4/default/c3aae9d/2147483647/strip/true/crop/4001x2666+0+1/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2F98%2Fe5%2Fb17b08a1412831c025d3c442d2cc%2F79ab658237c14220a7add2ec1f59188c","credit":"Kilde: Associated Press","alt":"Cubanske parlamentarikere under behandlingen af den økonomiske reformpakke","sourceUrl":"https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795"},"topics":["økonomi","Latinamerika","reformer","geopolitik"],"entities":["Cuba","Miguel Díaz-Canel","USA"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":91,"decisionValue":80,"novelty":96,"sourceQuality":90,"personalRelevance":45,"contrast":98},"claims":[{"text":"Cuba har vedtaget 176 økonomiske tiltag med privat bankdrift, direkte handel, friere ansættelser og diaspora-investeringer.","sourceUrls":["https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795","https://elpais.com/us/2026-06-19/cuba-se-abre-al-capitalismo-y-aprueba-su-mayor-reforma-en-decadas-banca-privada-mercado-de-cambios-y-fin-de-los-subsidios.html"],"confidence":"high"},{"text":"Cubanske myndigheder advarer om langsom implementering, og amerikanske sanktioner begrænser kapital- og energiadgang.","sourceUrls":["https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795"],"confidence":"high"}],"sources":[{"title":"Cuba pushes through sweeping free-market reforms in biggest economic shift since the revolution","publisher":"Associated Press","url":"https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795","publishedAt":"2026-06-19T22:56:22Z","kind":"reporting"},{"title":"Cuba se abre al capitalismo y aprueba su mayor reforma en décadas: banca privada, mercado de cambios y fin de los subsidios","publisher":"El País","url":"https://elpais.com/us/2026-06-19/cuba-se-abre-al-capitalismo-y-aprueba-su-mayor-reforma-en-decadas-banca-privada-mercado-de-cambios-y-fin-de-los-subsidios.html","publishedAt":"2026-06-19T16:36:23Z","kind":"reporting"}]},{"id":"bf-20260301-2","eventKey":"iran-retaliation-strikes","materialFacts":["US Central Command bekraeftede tre amerikanske soldater draebt og fem saaret i et iransk missilangreb 1. marts 2026.","Iranske angreb ramte maal i Bahrain, Oman, UAE og Cypern, herunder RAF Akrotiri-basen.","Ni mennesker blev draebt og 49 saaret i et missilangreb paa en synagoge i Beit Shemesh i Israel.","Den amerikanske flaade saenkede den iranske Moudge-klasse fregat IRIS Jamaran."],"section":"Verden","headline":"Iran svarer igen: missiler og droner rammer amerikanske og israelske maal i flere lande","primarySourceUrl":"https://en.wikipedia.org/wiki/Portal:Current_events/2026_March_1","subheadline":"Tre amerikanske soldater draebt, en synagoge i Israel ramt, og Revolutionsgarden lover haevn","body":["Som svar paa drabet paa Khamenei indledte Iran den 1. marts 2026 en omfattende gengaeldelsesbolge mod amerikanske og israelske maal. US Central Command bekraeftede, at tre amerikanske soldater blev draebt og fem haardt saaret i et iransk missilangreb.","Iranske droner og missiler ramte maal i Bahrain, Oman, De Forenede Arabiske Emirater og Cypern, herunder den britiske RAF Akrotiri-base. I Israel blev ni mennesker draebt og 49 saaret i et angreb paa en synagoge i Beit Shemesh.","Revolutionsgarden (IRGC) lovede haevn og haevdede at have ramt 27 baser med amerikanske tropper samt israelske militaere maal. Det amerikanske flaade saenkede til gengaeld den iranske fregat IRIS Jamaran."],"whyItMatters":"Gengaeldelsen viste, at krigen ikke var et begraenset luftangreb, men en regional konflikt, der trak Golfstaterne, Storbritannien og NATO-installationer direkte ind i skudlinjen. Amerikanske tab paa jorden hojnede den indenrigspolitiske indsats i Washington og oegede risikoen for, at konflikten kunne glide ud af kontrol.","analysis":"Mons treden af angreb paa tvaers af mindst fem lande demonstrerede Irans evne til at ramme bredt, selv efter tabet af sin oberste leder. For Golfstaterne, der husede de ramte baser, blev neutralitet pludselig umulig. Den hurtige amerikanske gengaeldelse til sos signalerede, at Washington ikke ville lade tabene staa ubesvarede - en dynamik, der pegede mod yderligere optrapning snarere end de-eskalation.","topics":["mellemosten","konflikt","geopolitik"],"entities":["Iran","USA","Israel","Revolutionsgarden","Bahrain","Cypern"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":90,"decisionValue":60,"novelty":70,"sourceQuality":80,"personalRelevance":40,"contrast":50},"claims":[{"text":"US Central Command bekraeftede tre amerikanske soldater draebt og fem saaret i et iransk missilangreb 1. marts 2026.","sourceUrls":["https://en.wikipedia.org/wiki/Portal:Current_events/2026_March_1","https://www.aljazeera.com/news/2026/3/1/iran-begins-40-day-mourning-after-khamenei-killed-in-us-israeli-attack"],"confidence":"medium"}],"sources":[{"title":"Portal:Current events/2026 March 1","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/Portal:Current_events/2026_March_1","publishedAt":"2026-03-01T23:00:00.000Z","kind":"reporting"},{"title":"Iran begins 40-day mourning after Khamenei killed in US-Israeli attack","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/3/1/iran-begins-40-day-mourning-after-khamenei-killed-in-us-israeli-attack","publishedAt":"2026-03-01T10:00:00.000Z","kind":"reporting"}]},{"id":"bf-20260228-retaliation","eventKey":"iran-missile-retaliation","materialFacts":["Iran begyndte kl. 09:05 UTC at affyre ballistiske missiler mod Israel og flere golfstater","Det israelske forsvar anslog, at Iran havde affyret omkring 170 ballistiske missiler"],"section":"Verden","headline":"Iran svarer igen med omkring 170 ballistiske missiler","primarySourceUrl":"https://en.wikipedia.org/wiki/Timeline_of_the_2026_Iran_war","subheadline":"Teheran retter sit modangreb mod Israel og flere golfstater","body":["Iran indledte kl. 09:05 UTC sit modangreb og affyrede ballistiske missiler mod Israel og flere golfstater. Det israelske forsvar anslog, at omkring 170 ballistiske missiler var blevet affyret.","Modangrebet udvider konflikten ud over Iran og Israel og sætter golfstaterne — og dermed verdens vigtigste energirute — i skudlinjen fra krigens første dag."],"whyItMatters":"Når missiler rammer golfstaterne, er hele regionens energiinfrastruktur og søfart i fare, med globale følger for forsyning og priser.","analysis":"Et modangreb af denne størrelse fra dag ét signalerer, at Irans missilarsenal ikke blev neutraliseret trods de indledende angreb. Det gør en hurtig afslutning mindre sandsynlig og trækker golfstaterne ind som direkte parter.","topics":["geopolitik","iran","konflikt"],"entities":["Iran","Israel","golfstaterne"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":90,"decisionValue":68,"novelty":80,"sourceQuality":78,"personalRelevance":45,"contrast":50},"claims":[{"text":"Iran affyrede ca. 170 ballistiske missiler mod Israel og golfstater som modsvar 28. februar 2026","sourceUrls":["https://en.wikipedia.org/wiki/Timeline_of_the_2026_Iran_war"],"confidence":"high"}],"sources":[{"title":"Timeline of the 2026 Iran war","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/Timeline_of_the_2026_Iran_war","publishedAt":"2026-02-28T11:00:00.000Z","kind":"reporting"},{"title":"List of attacks during the 2026 Iran war","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/List_of_attacks_during_the_2026_Iran_war","publishedAt":"2026-02-28T12:00:00.000Z","kind":"reporting"}]},{"id":"bf-20260623-iran","eventKey":"us-iran-nuclear-deal","materialFacts":["USA's vicepræsident JD Vance meldte om markant fremgang i atomforhandlingerne med Iran","Forhandlingerne i Schweiz involverede mæglere fra Qatar og Pakistan","Iran indvilligede i at lade atominspektører vende tilbage til landet","Parterne enedes om en køreplan mod en endelig aftale inden for 60 dage","USA fastholder, at Iran har accepteret at lade FN-inspektører vende tilbage — trods iranske benægtelser","Parterne henviser til et aftalememorandum om at ophæve blokaden og genåbne Hormuzstrædet","Iran lukkede ifølge egne udmeldinger strædet igen med henvisning til israelske angreb i Libanon","Et 60-dages forhandlingsvindue om atomprogrammet løber fortsat"],"section":"Verden","headline":"Iran-aftalen knager: uenighed om inspektører og Hormuzstrædet","primarySourceUrl":"https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis","subheadline":"Washington og Teheran er uenige om, hvad der blev aftalt, mens israelske angreb i Libanon presser våbenhvilen","body":["Dagen efter meldingerne om fremgang i Schweiz trækker den amerikansk-iranske aftale i flere retninger. USA fastholder, at Iran har accepteret at lade FN-inspektører vende tilbage, mens Teheran benægter at have givet et sådant tilsagn.","Parterne henviser til et aftalememorandum, hvor USA ophæver blokaden af iranske havne, mens Iran genåbner Hormuzstrædet i en periode. Men Iran har ifølge egne udmeldinger lukket strædet igen med henvisning til fortsatte israelske angreb i det sydlige Libanon, som Teheran kalder et brud på aftalen.","Et 60-dages vindue til at forhandle om atomprogrammet løber fortsat, men de modstridende udlægninger viser, hvor skrøbelig nedtrapningen er."],"whyItMatters":"Hvis våbenhvilen brydes, kan det igen lukke Hormuzstrædet, presse oliepriserne og trække konflikten i Libanon med ind i en bredere optrapning.","analysis":"Mønstret gentager sig: hver delaftale afhænger af forhold, parterne ikke fuldt kontrollerer — her Israels handlinger i Libanon. Uenigheden om inspektører er ikke et teknisk detaljespørgsmål, men kernen i, om verifikation overhovedet kan bære en endelig aftale.","topics":["geopolitik","iran","usa"],"entities":["USA","Iran","Israel","Libanon"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":62,"novelty":66,"sourceQuality":80,"personalRelevance":48,"contrast":58},"claims":[{"text":"USA fastholder iransk tilsagn om inspektører, mens Iran benægter og melder strædet lukket igen","sourceUrls":["https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis","https://www.pbs.org/newshour/show/june-23-2026-pbs-news-hour-full-episode"],"confidence":"medium"}],"sources":[{"title":"2026 Strait of Hormuz crisis","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis","publishedAt":"2026-06-23T08:00:00.000Z","kind":"reporting"},{"title":"June 23, 2026 - PBS News Hour full episode","publisher":"PBS NewsHour","url":"https://www.pbs.org/newshour/show/june-23-2026-pbs-news-hour-full-episode","publishedAt":"2026-06-23T22:00:00.000Z","kind":"reporting"}]},{"id":"story-us-iran-hormuz-20260628","eventKey":"us-iran-strikes-hormuz-bahrain-kuwait-2026-06","materialFacts":["Irans Revolutionsgarde affyrede missiler og droner mod den amerikanske base Ali Al Salem i Kuwait og mod 5. flådes hovedkvarter i Bahrain","USA bombede for anden dag i træk iranske mål ved Sirik, Bandar-e Lengeh og Qeshm","Ingen amerikanske tab er meldt, mens olieprisen samtidig faldt til det laveste siden februar"],"section":"Sikkerhed","headline":"Iran war day 121: Iran attacks Bahrain, Kuwait as US strikes near Hormuz","primarySourceUrl":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz","subheadline":"Iran ramte amerikanske baser i Golfen, efter at USA for anden dag bombede mål nær Hormuzstrædet","body":["USA og Iran eskalerede voldsomt i weekenden. Irans Revolutionsgarde affyrede missiler og droner mod den amerikanske base Ali Al Salem i Kuwait og mod USA's 5. flådes hovedkvarter i Bahrain. Bahrain aktiverede luftalarmer, og Kuwait sit luftforsvar. USA meldte ingen tab.","Angrebene fulgte, efter at USA for anden dag bombede iranske mål ved Sirik, Bandar-e Lengeh og Qeshm. Udløseren var ifølge centralkommandoen et iransk droneangreb mod et handelsskib nær Hormuzstrædet."],"whyItMatters":"Direkte iranske angreb på amerikanske baser i Golfen er en markant eskalation af en ellers skrøbelig våbenhvile. Golfstaterne huser tusindvis af amerikanske soldater.","analysis":"Markederne reagerede modsat: Trods angrebene faldt Brent fredag til omkring 72 dollar – det laveste siden 27. februar – fordi trafikken gennem Hormuz blev genoptaget. For dansk inflation betyder strædets åbenhed mere end antallet af angreb.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/1/16/Strait_of_Hormuz_and_Musandam_Peninsula_%28MODIS_2018-12-10%29.jpg","credit":"Foto: NASA/Wikimedia Commons","alt":"Satellitbillede af Hormuzstrædet og Musandam-halvøen","sourceUrl":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"},"topics":["sikkerhed","Mellemøsten","energi","geopolitik"],"entities":["USA","Iran","Bahrain","Kuwait","IRGC","Hormuzstrædet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":62,"novelty":64,"sourceQuality":76,"personalRelevance":40,"contrast":66},"claims":[{"text":"IRGC angreb den amerikanske base Ali Al Salem i Kuwait og 5. flådes hovedkvarter i Bahrain med missiler og droner.","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"],"confidence":"high"},{"text":"USA bombede for anden dag i træk iranske mål ved Sirik, Bandar-e Lengeh og Qeshm.","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"],"confidence":"high"},{"text":"Brent faldt til omkring 72 dollar, det laveste siden 27. februar, da trafikken gennem Hormuz blev genoptaget.","sourceUrls":["https://www.cnbc.com/2026/06/27/tanker-struck-in-strait-of-hormuz-as-us-iran-tensions-escalate.html"],"confidence":"medium"}],"sources":[{"title":"Iran war day 121: Iran attacks Bahrain, Kuwait as US strikes near Hormuz","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz","publishedAt":"2026-06-28T04:00:00Z","kind":"reporting"},{"title":"Tanker struck in Strait of Hormuz as U.S.-Iran tensions escalate","publisher":"CNBC","url":"https://www.cnbc.com/2026/06/27/tanker-struck-in-strait-of-hormuz-as-us-iran-tensions-escalate.html","publishedAt":"2026-06-27T12:00:00Z","kind":"reporting"}]},{"id":"bf-20260622-starmer","eventKey":"uk-starmer-resignation","materialFacts":["Keir Starmer meddelte mandag 22. juni 2026 sin afgang som premierminister og Labour-leder","Det bliver Storbritanniens syvende regeringschef på et årti","Greater Manchester-borgmester Andy Burnham peges på som favorit til at overtage","Nomineringer til ledervalget åbner 9. juli; Starmer bliver siddende indtil valget er afgjort"],"section":"Verden","headline":"Starmer trækker sig som britisk premierminister","primarySourceUrl":"https://www.cnn.com/2026/06/22/world/live-news/keir-starmer-uk-pm","subheadline":"Måneders pres fra egne rækker og Reform UK's fremmarch vælter Labour-lederen mindre end to år inde i mandatet","body":["Keir Starmer meddelte mandag, at han træder tilbage som premierminister og leder af Labour. Beslutningen følger måneders pres fra Labour-parlamentarikere og ministre, der har været stadig mere bekymrede for partiets valgudsigter efter elendige lokalvalg i maj og det højrenationale Reform UK's hurtige fremmarch.","Starmer vandt stort ved valget i 2024 på et løfte om stabilitet efter de konservatives kaos, men kaster nu håndklædet i ringen mindre end to år inde i regeringsperioden. Analytikere venter, at afgangen baner vej for Greater Manchester-borgmester Andy Burnham; tidligere sundhedsminister Wes Streeting har meddelt, at han bakker Burnham op og dermed trækker sig som mulig rival.","Starmer har bedt Labours hovedbestyrelse om at fastlægge tidsplanen for valget af en efterfølger. Nomineringer åbner 9. juli, og processen skal være afsluttet inden sommerferien. Indtil da forbliver Starmer i embedet."],"whyItMatters":"En af EU's vigtigste nabolande får sin syvende regeringschef på ti år midt i en højredrejning, der kan ændre britisk politik og forholdet til kontinentet.","analysis":"Skiftet handler mindre om én fejl end om en akkumuleret tillidskrise: et stort flertal uden tydeligt projekt, der eroderede, da Reform UK satte dagsordenen. En Burnham-ledelse vil blive læst som et venstresving i stil og retorik, men de strukturelle problemer — vækst, velfærdsfinansiering, migration — venter uændret på efterfølgeren.","topics":["britisk politik","europa"],"entities":["Keir Starmer","Labour","Andy Burnham","Reform UK"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":60,"novelty":80,"sourceQuality":90,"personalRelevance":55,"contrast":50},"claims":[{"text":"Starmer meddelte 22. juni 2026 sin afgang som premierminister og Labour-leder","sourceUrls":["https://www.cnn.com/2026/06/22/world/live-news/keir-starmer-uk-pm","https://www.npr.org/2026/06/22/nx-s1-5866231/keir-starmer-resigns"],"confidence":"high"},{"text":"Andy Burnham peges på som favorit til at efterfølge Starmer","sourceUrls":["https://www.aljazeera.com/news/2026/6/22/why-has-keir-starmer-resigned-as-uk-prime-minister-and-who-will-take-over"],"confidence":"medium"}],"sources":[{"title":"June 22, 2026: Keir Starmer resignation, UK to get sixth PM in seven years, as Andy Burnham likely to replace him","publisher":"CNN","url":"https://www.cnn.com/2026/06/22/world/live-news/keir-starmer-uk-pm","publishedAt":"2026-06-22T11:00:00.000Z","kind":"reporting"},{"title":"Keir Starmer has resigned, paving way for a 7th U.K. prime minister in 10 years","publisher":"NPR","url":"https://www.npr.org/2026/06/22/nx-s1-5866231/keir-starmer-resigns","publishedAt":"2026-06-22T12:30:00.000Z","kind":"reporting"},{"title":"Why has Keir Starmer resigned as UK prime minister, and who will take over?","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/22/why-has-keir-starmer-resigned-as-uk-prime-minister-and-who-will-take-over","publishedAt":"2026-06-22T14:00:00.000Z","kind":"analysis"}]},{"id":"story-ukraine-moscow-refinery-20260619","eventKey":"ukraine-moscow-refinery-strike-2026-06-18","materialFacts":["Gazproms store olieraffinaderi i det sydøstlige Moskva blev ramt for anden gang på en uge","Rusland oplyser at have nedskudt 555 ukrainske droner, heraf 180 med kurs mod Moskva","Angrebet er blandt krigens største langtrækkende natangreb mod den russiske hovedstad"],"section":"Udland","headline":"Stort olieraffinaderi i Moskva ramt af angreb for anden gang i denne uge","primarySourceUrl":"https://www.dr.dk/nyheder/seneste/stort-olieraffinaderi-i-moskva-ramt-af-angreb-anden-gang-i-denne-uge","subheadline":"Et af krigens største natangreb mod hovedstaden sætter brand i russisk raffinaderikapacitet","body":["Ukraine ramte natten til torsdag Gazproms store olieraffinaderi i det sydøstlige Moskva — cirka 15 kilometer fra Kreml — for anden gang på en uge. Russiske myndigheder oplyste at have nedskudt 555 ukrainske droner, heraf 180 med kurs mod hovedstaden.","Det er ifølge internationale medier blandt krigens største langtrækkende natangreb mod Moskva. Rusland fortsatte samtidig sine egne natlige angreb mod Ukraine, og Kyiv havde ved DR's dækning endnu ikke kommenteret aktionen."],"whyItMatters":"Krigen flytter sig fra frontlinjen til Ruslands energiinfrastruktur og hovedstad. Gentagne træf mod raffinaderikapacitet presser russisk brændstofforsyning og prestige.","analysis":"Tallene er russiske myndighedstal uden uafhængig verifikation. Men selv et forsvar, der nedskyder hundredvis af droner, røber, at angrebene nu rammer i en skala, der tvinger Rusland til at bruge luftforsvar langt fra fronten.","topics":["krig","Ukraine","energi","droner"],"entities":["Ukraine","Rusland","Moskva","Gazprom"],"isLead":false,"isOutsideProfile":false,"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/0w3dadbu/20260618-065257-7-1920x1082web.jpg","credit":"© Social Media/Reuters/Ritzau Scanpix","alt":"Røg stiger op fra et olieraffinaderi i Moskva efter et ukrainsk droneangreb","sourceUrl":"https://www.dr.dk/nyheder/seneste/stort-olieraffinaderi-i-moskva-ramt-af-angreb-anden-gang-i-denne-uge"},"scores":{"importance":88,"decisionValue":72,"novelty":84,"sourceQuality":86,"personalRelevance":60,"contrast":80},"claims":[{"text":"Rusland oplyser at have nedskudt 555 ukrainske droner, heraf 180 med kurs mod Moskva.","sourceUrls":["https://www.dr.dk/nyheder/seneste/stort-olieraffinaderi-i-moskva-ramt-af-angreb-anden-gang-i-denne-uge","https://www.nbcnews.com/world/russia/moscow-refinery-attack-ukrainian-drones-hit-kapotnya-russia-trump-war-rcna350665"],"confidence":"high"},{"text":"Gazproms store raffinaderi i det sydøstlige Moskva blev ramt for anden gang på en uge.","sourceUrls":["https://www.dr.dk/nyheder/seneste/stort-olieraffinaderi-i-moskva-ramt-af-angreb-anden-gang-i-denne-uge"],"confidence":"high"},{"text":"Angrebet er blandt krigens største langtrækkende natangreb mod Moskva.","sourceUrls":["https://www.nbcnews.com/world/russia/moscow-refinery-attack-ukrainian-drones-hit-kapotnya-russia-trump-war-rcna350665"],"confidence":"medium"}],"sources":[{"title":"Stort olieraffinaderi i Moskva ramt af angreb for anden gang i denne uge","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/stort-olieraffinaderi-i-moskva-ramt-af-angreb-anden-gang-i-denne-uge","publishedAt":"2026-06-18T05:25:00Z","kind":"reporting"},{"title":"Moscow refinery ablaze as Ukraine launches biggest attack on Russian capital in years","publisher":"NBC News","url":"https://www.nbcnews.com/world/russia/moscow-refinery-attack-ukrainian-drones-hit-kapotnya-russia-trump-war-rcna350665","publishedAt":"2026-06-18T00:00:00Z","kind":"reporting"}]},{"id":"story-europe-heat-deaths-20260629","eventKey":"europe-heatwave-deaths-attribution-2026-06","materialFacts":["WHO opgør mere end 1.300 ekstra dødsfald i Europa siden 21. juni under hedebølgen","Frankrig tegner sig for ca. 1.000 ekstra dødsfald siden 24. juni, 85 procent blandt 65+; Spanien melder over 400 mulige","World Weather Attribution finder, at fossil opvarmning gjorde dagvarmen ca. 10 gange og nattevarmen over 100 gange mere sandsynlig end i 2003"],"section":"Klima","headline":"Europe sees more than 1,300 excess deaths amid brutal heatwave, WHO says","primarySourceUrl":"https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave","subheadline":"Hedebølgen, der satte dansk varmerekord, har kostet over 1.300 europæere livet – og forskere kæder den direkte til fossil opvarmning","body":["Den hedebølge, der i weekenden gav Danmark sin varmeste dag nogensinde, kostede liv i resten af Europa. WHO opgør over 1.300 ekstra dødsfald siden 21. juni – Frankrig alene omkring 1.000, og Spanien knytter over 400 mulige dødsfald til varmen.","Nye rekorder faldt: Storbritannien målte 37,3 grader i Suffolk, sin varmeste junidag nogensinde, og Tyskland passerede 40 grader. World Weather Attribution konkluderer, at menneskeskabt opvarmning er årsagen."],"whyItMatters":"Tallene flytter historien fra rekordkuriosa til folkesundhed: det er de varme nætter, ikke middagsvarmen, der dræber, fordi kroppen ikke når at køle af.","analysis":"Attributionsstudiet sætter tal på ansvaret: dagvarmen var cirka 10 og nattevarmen over 100 gange mere sandsynlig end for 20 år siden – et signal om infrastruktur bygget til et koldere klima.","image":{"url":"https://images.euronews.com/articles/stories/09/81/62/69/1536x864_cmsv2_38208c5d-8609-5ca5-b634-d9279147394a-9816269.jpg","credit":"Kilde: Euronews","alt":"Mennesker søger skygge og vand under den europæiske hedebølge","sourceUrl":"https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave"},"topics":["klima","hedebølge","sundhed","Europa"],"entities":["WHO","Frankrig","Spanien","Storbritannien","World Weather Attribution"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":86,"decisionValue":56,"novelty":66,"sourceQuality":80,"personalRelevance":55,"contrast":62},"claims":[{"text":"WHO opgør mere end 1.300 ekstra dødsfald i Europa siden 21. juni; Frankrig ca. 1.000 siden 24. juni (85 pct. 65+).","sourceUrls":["https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave"],"confidence":"high"},{"text":"Storbritannien satte junirekord med 37,3 grader i Suffolk, og Tyskland passerede 40 grader.","sourceUrls":["https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave"],"confidence":"high"},{"text":"Dagvarmen var ca. 10 gange og nattevarmen over 100 gange mere sandsynlig end i 2003 pga. fossil opvarmning.","sourceUrls":["https://www.worldweatherattribution.org/fossil-fuel-emissions-have-rapidly-worsened-european-heatwaves-in-just-a-few-decades/"],"confidence":"high"}],"sources":[{"title":"Europe sees more than 1,300 excess deaths amid brutal heatwave, WHO says","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave","publishedAt":"2026-06-28T07:32:00Z","kind":"reporting"},{"title":"Fossil fuel emissions have rapidly worsened European heatwaves in just a few decades","publisher":"World Weather Attribution","url":"https://www.worldweatherattribution.org/fossil-fuel-emissions-have-rapidly-worsened-european-heatwaves-in-just-a-few-decades/","publishedAt":"2026-06-26T06:00:00Z","kind":"analysis"}]},{"id":"story-gpt56-sol-20260627","eventKey":"openai-gpt56-sol-preview-2026","materialFacts":["OpenAI offentliggjorde 26. juni en preview af GPT-5.6 i tre modeller: Sol, Terra og Luna","Sol topper coding, biologi og cybersikkerhed og lanceres som begrænset preview til betroede partnere delt med myndighederne","Adgangen styres med konto-review og misbrugsklassifikatorer på grund af dual-use-risiko"],"section":"Teknologi","headline":"OpenAI launches GPT-5.6 Sol preview for select partners","primarySourceUrl":"https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/","subheadline":"En ny frontier-familie på tre modeller kommer først ud bag en kontrolleret adgangsmur","body":["OpenAI offentliggjorde 26. juni en preview af GPT-5.6 – ikke én model, men tre: flagskibet Sol, det billigere Terra og den hurtige Luna. Sol er bygget til coding, biologi og cybersikkerhed og introducerer en 'max reasoning effort' og en 'ultra mode' med underagenter.","Lanceringen sker som en begrænset preview til betroede partnere, hvis deltagelse OpenAI har delt med myndighederne, før bredere adgang i ChatGPT og API om få uger. På grund af dual-use-risiko styres adgangen med konto-review, misbrugsklassifikatorer og differentierede niveauer – og kan give blokerede eller forsinkede svar i følsomme cyber-sammenhænge."],"whyItMatters":"GPT-5.6 viser to ting på én gang: kapaciteten rykker fortsat hurtigt i coding, biologi og cyber, mens adgangen reguleres som en kontrolleret ressource – samme trusted-access-logik, der ramte Anthropics modeller i juni.","analysis":"Den graduerede pris fra Luna til Sol er lige så vigtig som topmodellen: konkurrencen handler nu om pris per opgave, ikke kun ren ydeevne. For EIFO og Europa understreger det afhængigheden af få amerikanske udbydere, der sætter både kapabilitets- og adgangsvilkår.","counterpoint":"De fremhævede benchmark- og ydelsestal er OpenAIs egne og endnu ikke uafhængigt efterprøvet.","topics":["AI","teknologisk suverænitet","cybersikkerhed","regulering"],"entities":["OpenAI","GPT-5.6 Sol","ChatGPT"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":82,"novelty":84,"sourceQuality":80,"personalRelevance":92,"contrast":60},"claims":[{"text":"OpenAI offentliggjorde 26. juni 2026 en preview af GPT-5.6 i tre modeller (Sol, Terra, Luna), med Sol stærkest i coding, biologi og cybersikkerhed","sourceUrls":["https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/","https://deploymentsafety.openai.com/gpt-5-6-preview"],"confidence":"high"},{"text":"Udrulningen starter som begrænset preview til betroede partnere delt med myndighederne, med konto-review og misbrugsklassifikatorer på grund af dual-use-risiko","sourceUrls":["https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/"],"confidence":"medium"}],"sources":[{"title":"OpenAI launches GPT-5.6 Sol preview for select partners","publisher":"TestingCatalog","url":"https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/","publishedAt":"2026-06-26T15:00:00Z","kind":"reporting"},{"title":"GPT-5.6 Preview System Card","publisher":"OpenAI","url":"https://deploymentsafety.openai.com/gpt-5-6-preview","publishedAt":"2026-06-26T14:00:00Z","kind":"primary"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/OpenAI_Logo.svg/500px-OpenAI_Logo.svg.png","credit":"Foto: Wikimedia Commons","alt":"OpenAI-logo – illustration til lanceringen af GPT-5.6","sourceUrl":"https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/"}},{"id":"story-hormuz-us-iran-20260621","eventKey":"hormuz-us-iran-open-closed-dispute-june-2026","materialFacts":["Iran hævder at have lukket Hormuzstrædet","CENTCOM oplyser, at 55 skibe passerede med over 17 mio. tønder olie","BBC Verify bekræfter mindst fem tankere gennem strædet"],"section":"Udland","headline":"Modstridende meldinger fra USA og Iran: Er Hormuzstrædet åbent eller lukket?","primarySourceUrl":"https://www.dr.dk/nyheder/udland/modstridende-meldinger-fra-usa-og-iran-er-hormuzstraedet-aabent-eller-lukket","subheadline":"Iran hævder at have lukket verdens vigtigste oliestræde; amerikansk militær og BBC Verify siger, at skibene fortsat sejler","body":["Iran hævder at have lukket Hormuzstrædet som svar på israelske angreb i Libanon og kalder det et brud på en våbenhvile, USA stiltiende accepterer. Påstanden modsiges direkte af amerikansk militær.","U.S. Central Command oplyser, at 55 skibe samme dag passerede strædet med mere end 17 millioner tønder olie. BBC Verify bekræfter, at mindst fem tankere kom igennem, mens nogle skibe vendte om. Nye forhandlinger mellem Iran og USA er sat til Schweiz."],"whyItMatters":"Omkring en femtedel af verdens olie passerer Hormuz. Selv usikkerhed om en lukning kan flytte priser og forsikringsrater og teste den skrøbelige amerikansk-iranske ramme.","analysis":"Kernen er en fortolkningskamp: Iran bruger ordet »lukket« politisk, mens skibsfartsdata fortæller en anden historie. CENTCOM-tallet er en partsoplysning. Så længe trafikken fortsætter, er markedseffekten begrænset, men gentagne udmeldinger kan i sig selv hæve risikopræmien.","topics":["energi","geopolitik","Iran","skibsfart"],"entities":["USA","Iran","U.S. Central Command","Hormuzstrædet"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":86,"decisionValue":76,"novelty":70,"sourceQuality":78,"personalRelevance":40,"contrast":72},"claims":[{"text":"U.S. Central Command oplyser, at 55 skibe passerede strædet med mere end 17 millioner tønder olie","sourceUrls":["https://www.dr.dk/nyheder/udland/modstridende-meldinger-fra-usa-og-iran-er-hormuzstraedet-aabent-eller-lukket"],"confidence":"medium"},{"text":"BBC Verify bekræfter, at mindst fem tankere passerede, mens nogle skibe vendte om","sourceUrls":["https://www.dr.dk/nyheder/udland/modstridende-meldinger-fra-usa-og-iran-er-hormuzstraedet-aabent-eller-lukket"],"confidence":"medium"}],"sources":[{"title":"Modstridende meldinger fra USA og Iran: Er Hormuzstrædet åbent eller lukket?","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/modstridende-meldinger-fra-usa-og-iran-er-hormuzstraedet-aabent-eller-lukket","publishedAt":"2026-06-19T20:07:00Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/vfgnwnnm/20260522-110137-2.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Billede til artikel om Hormuzstrædet og olietankere","sourceUrl":"https://www.dr.dk/nyheder/udland/modstridende-meldinger-fra-usa-og-iran-er-hormuzstraedet-aabent-eller-lukket"}},{"id":"story-mflusiva-20260620","eventKey":"fda-panel-mflusiva-recommendation-2026","materialFacts":["FDA's rådgiverpanel anbefalede enstemmigt mFlusiva til voksne over 50","Et studie med 40.000 deltagere viste cirka 27 procent færre influenzatilfælde end en rutinevaccine","FDA træffer forventeligt endelig beslutning senest i begyndelsen af august"],"section":"Bioteknologi","headline":"FDA panel backs first-of-its-kind flu vaccine using mRNA technology","primarySourceUrl":"https://apnews.com/article/moderna-flu-vaccine-mrna-fda-advisers-mflusiva-488c68fe39244ca5ebad441a815b4ba2","subheadline":"Moderna rykker mRNA fra pandemi til sæsoninfluenza, men FDA kræver flere data fra skrøbelige ældre","body":["FDA's rådgiverpanel vurderer enstemmigt, at fordelene ved Modernas mFlusiva opvejer risiciene for voksne over 50. I et studie med 40.000 deltagere reducerede vaccinen influenzatilfælde med cirka 27 procent mod en almindelig vaccine.","Moderna søger fuld godkendelse for 50 til 64-årige og foreløbig tilladelse over 65, mens flere data indsamles. Vaccinen gav flere kortvarige reaktioner, men ingen større sikkerhedssignaler. FDA afgør sagen senest i begyndelsen af august."],"whyItMatters":"mRNA's fordel er hastighed. Influenzastammer vælges måneder før sæsonen, og sen mutation kan give et dårligt vaccinematch.","analysis":"Værdien ligger i platformen mere end i de 27 procent alene. En godkendelse giver Moderna et tilbagevendende marked og myndighederne fleksibel kapacitet.","counterpoint":"Anbefalingen er ikke en godkendelse, og data for skrøbelige ældre er begrænsede.","image":{"url":"https://dims.apnews.com/dims4/default/7f206d7/2147483647/strip/true/crop/3938x2624+363+0/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2Fe6%2F82%2F4846afa28dc094b77f7ba5eb3510%2F07c265f5417d45c5856dec636c1d4623","credit":"AP Photo/Bill Sikes, File","alt":"Skilt ved en Moderna-bygning i Cambridge i Massachusetts","sourceUrl":"https://apnews.com/article/moderna-flu-vaccine-mrna-fda-advisers-mflusiva-488c68fe39244ca5ebad441a815b4ba2"},"topics":["bioteknologi","vacciner","regulering","sundhed"],"entities":["FDA","Moderna","mFlusiva"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":82,"novelty":93,"sourceQuality":95,"personalRelevance":82,"contrast":78},"claims":[{"text":"FDA's rådgiverpanel stemte enstemmigt for at fordelene ved mFlusiva opvejer risiciene for begge aldersgrupper over 50.","sourceUrls":["https://apnews.com/article/moderna-flu-vaccine-mrna-fda-advisers-mflusiva-488c68fe39244ca5ebad441a815b4ba2","https://www.fda.gov/advisory-committees/advisory-committee-calendar/vaccines-and-related-biological-products-advisory-committee-june-18-2026-meeting-announcement"],"confidence":"high"},{"text":"I et studie med 40.000 deltagere reducerede mFlusiva influenzatilfælde med cirka 27 procent mod en rutinevaccine.","sourceUrls":["https://apnews.com/article/moderna-flu-vaccine-mrna-fda-advisers-mflusiva-488c68fe39244ca5ebad441a815b4ba2"],"confidence":"high"},{"text":"FDA forventes at træffe endelig beslutning senest i begyndelsen af august.","sourceUrls":["https://apnews.com/article/moderna-flu-vaccine-mrna-fda-advisers-mflusiva-488c68fe39244ca5ebad441a815b4ba2"],"confidence":"high"}],"sources":[{"title":"FDA panel backs first-of-its-kind flu vaccine using mRNA technology","publisher":"Associated Press","url":"https://apnews.com/article/moderna-flu-vaccine-mrna-fda-advisers-mflusiva-488c68fe39244ca5ebad441a815b4ba2","publishedAt":"2026-06-18T11:10:08Z","kind":"reporting"},{"title":"Vaccines and Related Biological Products Advisory Committee June 18, 2026 Meeting Announcement - 06/18/2026","publisher":"U.S. Food and Drug Administration","url":"https://www.fda.gov/advisory-committees/advisory-committee-calendar/vaccines-and-related-biological-products-advisory-committee-june-18-2026-meeting-announcement","publishedAt":"2026-06-18T00:00:00Z","kind":"primary"}]},{"id":"story-dk-drone-report-20260619","eventKey":"dk-drone-evaluation-report-2026","materialFacts":["Forsvarets evaluering konkluderer, at der i flere tilfælde var tale om droner over danske lokaliteter i efteråret 2025","Forsvarsminister Jeppe Bruus erkender, at evnen til at opdage og håndtere droner kunne være bedre","Cirka 200 særskilte luftobservationer blev indrapporteret mellem 22. september og 6. oktober 2025"],"section":"Sikkerhed","headline":"Rapport bekræfter dronehændelser, siger minister","primarySourceUrl":"https://nyheder.tv2.dk/politik/2026-06-19-rapport-bekraefter-dronehaendelser-siger-minister","subheadline":"Forsvarets længe ventede evaluering fastslår droner over Danmark, men ikke hvem der stod bag","body":["Forsvarets længe ventede evaluering af luftrumshændelserne i efteråret 2025 er afleveret. Konklusionen er klar: I flere tilfælde var der tale om droner over danske lokaliteter. Forsvarsminister Jeppe Bruus præsenterede dele af rapporten, efter at forligskredsen havde set en klassificeret version.","Mellem 22. september og 6. oktober 2025 indløb omkring 200 særskilte luftobservationer, blandt andet under et EU-topmøde i København. Bruus erkender, at evnen til at opdage og håndtere droner 'kunne være bedre', og at man i intet tilfælde fysisk fik fat i en drone."],"whyItMatters":"For en lille stat handler dronesagen mindre om enkelthændelser end om beredskab: Kan myndighederne se og reagere på det, der bevæger sig i luftrummet? Erkendelsen af et kapacitetshul rammer direkte ind i forsvarsforliget.","analysis":"Det interessante er afstanden mellem konstatering og handlekraft: Rapporten bekræfter droner, men kan hverken udpege en afsender eller fremvise en nedtaget drone. Uden attribution er respons svær at kalibrere, og sagen flytter fokus fra våbensystemer til detektion og datadeling.","counterpoint":"Rapporten siger intet om, hvor dronerne kom fra, og flere af de oprindelige meldinger var af varierende kvalitet.","topics":["forsvar","sikkerhed","hybridtrussel","beredskab"],"entities":["Forsvaret","Jeppe Bruus","Michael Hyldgaard","Danmark"],"isLead":false,"isOutsideProfile":false,"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/rn4hbdzg/20250922-211948-l.jpg","credit":"© Steven Knap, Ritzau Scanpix","alt":"Politiet til stede ved Københavns Lufthavn under meldinger om droner i efteråret 2025","sourceUrl":"https://www.dr.dk/nyheder/indland/dokumenter-afsloerer-nye-oplysninger-om-mulige-droner-over-danmark"},"scores":{"importance":86,"decisionValue":70,"novelty":88,"sourceQuality":90,"personalRelevance":84,"contrast":68},"claims":[{"text":"Forsvarets evaluering konkluderer, at der i flere tilfælde var tale om droner over danske lokaliteter i efteråret 2025.","sourceUrls":["https://nyheder.tv2.dk/politik/2026-06-19-rapport-bekraefter-dronehaendelser-siger-minister","https://www.forsvaret.dk/da/nyheder/2026/evaluering-af-forsvarets-indsats-ifm.-luftobservationer-i-efteraret-2025"],"confidence":"high"},{"text":"Cirka 200 særskilte luftobservationer blev indrapporteret mellem 22. september og 6. oktober 2025.","sourceUrls":["https://nyheder.tv2.dk/politik/2026-06-19-rapport-bekraefter-dronehaendelser-siger-minister"],"confidence":"high"},{"text":"Forsvarsminister Jeppe Bruus erkender, at Forsvarets evne til at opdage og håndtere droner kunne være bedre.","sourceUrls":["https://nyheder.tv2.dk/politik/2026-06-19-rapport-bekraefter-dronehaendelser-siger-minister"],"confidence":"high"},{"text":"Rapporten giver ikke svar på, hvor dronerne kom fra.","sourceUrls":["https://tidende.dk/forsvar/rapport-giver-ikke-svar-paa-h
