  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.edition-tab,
.layout-tab {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.feed-card-body { padding: 16px 16px 18px; }
.feed-pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 9px;
}
.feed-pill {
  display: inline-block;
  padding: 3px 10px;

  <script>globalThis.__BRIEF_DATA__ = {"schemaVersion":1,"kind":"weekly","runId":"2026-W26-weekly-v1","weekId":"2026-W26","weekStart":"2026-06-22","weekEnd":"2026-06-28","generatedAt":"2026-06-29T05:14:00Z","readingMinutes":18,"title":"Ugen: Talentkrig i AI, dansk varmerekord og forsvarskapital","dek":"En uge hvor frontier-AI’s kapløb om mennesker, chips og modeladgang spidsede til, mens en europæisk hedebølge satte dansk varmerekord og Golfen igen eskalerede.","profileWeights":{"importance":25,"decisionValue":20,"novelty":15,"sourceQuality":15,"personalRelevance":15,"contrast":10},"stories":[{"id":"story-deepmind-talent-exodus-w26","eventKey":"google-deepmind-talent-exodus-2026-06","section":"AI","isLead":true,"isOutsideProfile":false,"headline":"Loss of top AI talent leaves some questioning if Google DeepMind can stay at AI’s forefront","primarySourceUrl":"https://fortune.com/2026/06/23/google-deepmind-ai-researcher-departures-raise-doubts-about-ability-to-win-the-ai-race-shazeer-jumper-eye-on-ai/","subheadline":"Noam Shazeer og Nobelpris-modtager John Jumper er blandt mindst seks DeepMind-forskere, der på en uge skiftede til OpenAI, Anthropic og Meta — og Alphabet-aktien faldt.","materialFacts":["Gemini-medstifter Noam Shazeer forlod Google for OpenAI, mens AlphaFold-forskeren og keminobelpristager John Jumper skiftede til Anthropic inden for samme uge","Mindst seks seniorforskere — heriblandt Jonas Adler og Alexander Pritzel — forlod Google DeepMind til OpenAI, Anthropic og Meta i ugen op til 28. juni 2026","Alphabet-aktien faldt omkring 5-6 procent mandag 22. juni, da det andet store AI-navn på kort tid blev meldt på vej væk"],"body":["Google DeepMind mistede i ugen op til 28. juni mindst seks seniorforskere til de nærmeste rivaler. Mest opsigtsvækkende skiftede Gemini-medstifter Noam Shazeer til OpenAI, og John Jumper, der i 2024 fik Nobelprisen i kemi for AlphaFold, gik til Anthropic. Også Jonas Adler og Alexander Pritzel, der har bidraget til Gemini, er på vej til Anthropic.","Afgangene faldt sammen med, at Alphabet-aktien mandag 22. juni faldt i omegnen af 5-6 procent. Flere medier koblede kursfaldet til bekymring for, om Google kan fastholde sine topfolk, mens Anthropic og OpenAI nærmer sig børsnoteringer og kan tilbyde før-IPO-aktier, som en børsnoteret koncern strukturelt har svært ved at matche.","Google har tidligere mistet og generhvervet talent i bølger, men koncentrationen af tunge navne på så kort tid er usædvanlig og rammer netop de laboratorier, der definerer frontier-modellerne."],"whyItMatters":"Talent er den knappeste ressource i AI-kapløbet. Når de mennesker, der byggede Transformer-arkitekturen og AlphaFold, flytter samlet til konkurrenterne, flytter en del af den reelle kapacitet med — og markedet prissætter det med det samme.","analysis":"Mønstret peger på en strukturel ulempe for et børsnoteret selskab: pre-IPO-equity hos Anthropic og OpenAI er et rekrutteringsvåben, Alphabet vanskeligt kan kopiere. For en investoranalytiker er signalet mindre 'Google er færdig' og mere, at frontier-AI’s værdiskabelse i stigende grad bindes til enkeltpersoner og deres optioner, ikke kun til compute og data.","counterpoint":"Google DeepMind har stadig en af verdens dybeste forskerstabe og fuld adgang til Alphabets compute; enkeltafgange har før vist sig at være cykliske snarere end strukturelle, og koncernen har generhvervet talent tidligere (bl.a. Shazeer selv i 2024).","topics":["AI","teknologisk suverænitet","venturekapital","talent"],"entities":["Google DeepMind","Noam Shazeer","John Jumper","Anthropic","OpenAI","Alphabet","Meta"],"scores":{"importance":82,"decisionValue":70,"novelty":78,"sourceQuality":80,"personalRelevance":88,"contrast":74},"claims":[{"text":"Noam Shazeer skiftede til OpenAI og John Jumper til Anthropic inden for samme uge","sourceUrls":["https://fortune.com/2026/06/23/google-deepmind-ai-researcher-departures-raise-doubts-about-ability-to-win-the-ai-race-shazeer-jumper-eye-on-ai/","https://www.axios.com/2026/06/23/ai-lab-agi-google-deepmind-departures"],"confidence":"high"},{"text":"Mindst seks DeepMind-forskere forlod Google til OpenAI, Anthropic og Meta i ugen","sourceUrls":["https://www.techtimes.com/articles/319219/20260628/google-deepminds-coding-pivot-lost-six-researchers-meta-openai-anthropic.htm"],"confidence":"medium"},{"text":"Alphabet-aktien faldt omkring 5-6 procent 22. juni i forbindelse med afgangene","sourceUrls":["https://qz.com/alphabet-stock-google-ai-researchers-openai-anthropic-062226","https://www.axios.com/2026/06/23/ai-lab-agi-google-deepmind-departures"],"confidence":"medium"}],"sources":[{"title":"Loss of top AI talent leaves some questioning if Google DeepMind can stay at AI’s forefront","publisher":"Fortune","url":"https://fortune.com/2026/06/23/google-deepmind-ai-researcher-departures-raise-doubts-about-ability-to-win-the-ai-race-shazeer-jumper-eye-on-ai/","publishedAt":"2026-06-23T18:42:00Z","kind":"reporting"},{"title":"Google DeepMind loses star power","publisher":"Axios","url":"https://www.axios.com/2026/06/23/ai-lab-agi-google-deepmind-departures","publishedAt":"2026-06-23T13:00:00Z","kind":"reporting"},{"title":"Alphabet stock slides as Google loses two top AI researchers","publisher":"Quartz","url":"https://qz.com/alphabet-stock-google-ai-researchers-openai-anthropic-062226","publishedAt":"2026-06-22T19:00:00Z","kind":"reporting"},{"title":"Google DeepMind’s Coding Pivot Lost Six Researchers to Meta, OpenAI, and Anthropic","publisher":"Tech Times","url":"https://www.techtimes.com/articles/319219/20260628/google-deepminds-coding-pivot-lost-six-researchers-meta-openai-anthropic.htm","publishedAt":"2026-06-28T14:00:00Z","kind":"reporting"}]},{"id":"story-stark-defence-500m-w26","eventKey":"stark-defence-500m-raise-2026-06","section":"Forsvar & venture","isLead":true,"isOutsideProfile":false,"headline":"Drones startup Stark confirms €500m raise backed by Sequoia and Founders Fund","primarySourceUrl":"https://sifted.eu/articles/stark-defence-drones-funding-round-confirms","subheadline":"Den tyske dronevirksomhed Stark rejser 500 mio. euro i en runde ledet af Sequoia og Founders Fund — en af ugens største europæiske forsvars-venture-handler.","materialFacts":["Stark, en tysk forsvars-tech-virksomhed grundlagt i 2024 og baseret i Berlin, bekræftede 23. juni en runde på 500 mio. euro","Runden er ledet af Sequoia Capital og Founders Fund med deltagelse af bl.a. NATO Innovation Fund","Virksomheden bygger loitering munitions (angrebsdroner) og AI-styret kommando- og kontrolsoftware; vurderingen er rapporteret til over 3,5 mia. euro"],"body":["Den tyske forsvars-tech-virksomhed Stark bekræftede 23. juni en kapitalrejsning på 500 mio. euro. Runden er ifølge Sifted ledet af Sequoia Capital og Founders Fund, med NATO Innovation Fund blandt de øvrige investorer. Stark blev grundlagt i 2024, er baseret i Berlin og udvikler loitering munitions — angrebsdroner — samt AI-assisteret kommando- og kontrolsoftware.","Handlen er en af ugens største europæiske forsvars-venture-runder og indskriver sig i en bredere optrapning af privat kapital til europæisk forsvars- og dual-use-teknologi. Stark er på under to år vokset til en rapporteret værdiansættelse over 3,5 mia. euro.","Runden falder i en periode, hvor europæiske stater og fonde søger at opbygge en hjemlig forsvarsindustriel base, og hvor amerikanske topinvestorer som Sequoia og Founders Fund i stigende grad allokerer til europæisk forsvar."],"whyItMatters":"For en investor i transformative teknologier markerer runden, at europæisk forsvars-tech nu tiltrækker amerikansk venture i milliardklassen — et skift fra statslig til blandet finansiering af kontinentets sikkerhed, med direkte relevans for dual-use-porteføljer.","analysis":"Sequoias og Founders Funds lederskab signalerer, at forsvar ikke længere er et nicheområde, venture undgår af ESG-hensyn, men en vækstkategori. Spørgsmålet for kapitalallokatorer er, om de høje værdiansættelser (over 3,5 mia. euro på under to år) afspejler holdbar ordreindgang eller en momentumdrevet genopdagelse af sektoren.","topics":["forsvar","venturekapital","deeptech","droner","Europa","defence-tech"],"entities":["Stark","Sequoia Capital","Founders Fund","NATO Innovation Fund","Tyskland"],"scores":{"importance":76,"decisionValue":82,"novelty":74,"sourceQuality":78,"personalRelevance":92,"contrast":60},"claims":[{"text":"Stark bekræftede 23. juni en runde på 500 mio. euro ledet af Sequoia og Founders Fund","sourceUrls":["https://sifted.eu/articles/stark-defence-drones-funding-round-confirms","https://tech.eu/2026/06/23/stark-bags-eur500-million-in-new-funding/"],"confidence":"high"},{"text":"Stark er en tysk virksomhed grundlagt i 2024, baseret i Berlin, der bygger loitering munitions","sourceUrls":["https://sifted.eu/articles/stark-defence-drones-funding-round-confirms"],"confidence":"medium"}],"sources":[{"title":"Drones startup Stark confirms €500m raise backed by Sequoia and Founders Fund","publisher":"Sifted","url":"https://sifted.eu/articles/stark-defence-drones-funding-round-confirms","publishedAt":"2026-06-23T12:00:00Z","kind":"reporting"},{"title":"Stark bags €500M in new funding","publisher":"Tech.eu","url":"https://tech.eu/2026/06/23/stark-bags-eur500-million-in-new-funding/","publishedAt":"2026-06-23T13:00:00Z","kind":"reporting"}]},{"id":"story-dk-heat-record-37c-w26","eventKey":"dk-all-time-heat-record-37c-2026-06","section":"Klima & vejr","isLead":true,"isOutsideProfile":true,"headline":"Varme og uvejr: Ny dansk varmerekord sat i både Ødum og Odense","primarySourceUrl":"https://www.dmi.dk/nyheder/2026/varme-og-uvejr-ny-dansk-varmerekord-sat-i-baade-oedum-og-odense","subheadline":"DMI målte 37,0 grader lørdag 27. juni i Beldringe og Ødum — den højeste temperatur i dansk vejrhistorie, mens en europæisk hedebølge pressede kontinentet.","materialFacts":["DMI registrerede 37,0 grader lørdag 27. juni 2026 i Beldringe nord for Odense og i Ødum nord for Aarhus","Rekorden slår den tidligere danske varmerekord på 36,4 grader fra Holstebro 10. august 1975","Rekorden faldt under en fastlåst vejrsituation, der trak meget varm luft op over Europa fra Sahara"],"body":["Danmarks Meteorologiske Institut målte lørdag 27. juni 37,0 grader i både Beldringe nord for Odense og Ødum nord for Aarhus. Det er den højeste temperatur i dansk vejrhistorie og slår den tidligere rekord på 36,4 grader, der blev sat i Holstebro 10. august 1975.","Rekorden faldt midt i en europæisk hedebølge, hvor en fastlåst vejrsituation i ugevis havde trukket meget varm luft op fra Sahara over først Spanien og Frankrig og siden Danmark. Lørdagen blev dermed den varmeste dag, der er målt herhjemme, siden de systematiske målinger begyndte i 1874.","DMI ledsagede varmen med varsler om kraftigt uvejr, da den ustabile, varme luftmasse også gav risiko for voldsom regn og torden."],"whyItMatters":"En national alle-tiders-rekord, der overgår 1975-mærket med 0,6 grad, er et konkret, lokalt aftryk af et varmere klima og rejser umiddelbare spørgsmål om sundhedsberedskab, infrastruktur og energiforbrug under ekstrem varme.","analysis":"Enkeltrekorder beviser ikke i sig selv en trend, men rækkefølgen — Spaniens og Frankrigs rekorder få dage før, nu Danmarks — passer til klimamodellernes forventning om hyppigere og kraftigere hedebølger i Nordeuropa. For beslutningstagere flytter det varme­beredskab fra et sydeuropæisk til et dansk anliggende.","topics":["klima","vejr","Danmark","katastrofe"],"entities":["DMI","Beldringe","Ødum","Holstebro","Danmark"],"scores":{"importance":80,"decisionValue":55,"novelty":70,"sourceQuality":95,"personalRelevance":40,"contrast":78},"claims":[{"text":"DMI målte 37,0 grader 27. juni 2026 i Beldringe og Ødum, ny dansk varmerekord","sourceUrls":["https://www.dmi.dk/nyheder/2026/varme-og-uvejr-ny-dansk-varmerekord-sat-i-baade-oedum-og-odense","https://www.dr.dk/nyheder/vejret/37-0-grader-gav-ny-dansk-varmerekord"],"confidence":"high"},{"text":"Den tidligere rekord var 36,4 grader fra Holstebro 10. august 1975","sourceUrls":["https://www.dr.dk/nyheder/vejret/37-0-grader-gav-ny-dansk-varmerekord"],"confidence":"high"}],"sources":[{"title":"Varme og uvejr: Ny dansk varmerekord sat i både Ødum og Odense","publisher":"DMI","url":"https://www.dmi.dk/nyheder/2026/varme-og-uvejr-ny-dansk-varmerekord-sat-i-baade-oedum-og-odense","publishedAt":"2026-06-27T16:00:00Z","kind":"primary"},{"title":"37,0 grader gav ny dansk varmerekord","publisher":"DR","url":"https://www.dr.dk/nyheder/vejret/37-0-grader-gav-ny-dansk-varmerekord","publishedAt":"2026-06-27T17:30:00Z","kind":"reporting"}]},{"id":"story-us-iran-gulf-strikes-w26","eventKey":"us-iran-gulf-strikes-2026-06","section":"Geopolitik","isLead":true,"isOutsideProfile":false,"headline":"Iran and US trade attacks as Strait of Hormuz ceasefire falters","primarySourceUrl":"https://www.aljazeera.com/news/2026/6/28/iran-attacks-kuwait-and-bahrain-in-response-to-us-strikes","subheadline":"Irans Revolutionsgarde affyrede 28. juni missiler og droner mod amerikanske baser i Kuwait og Bahrain, mens en skrøbelig våbenhvile om Hormuzstrædet vaklede.","materialFacts":["Irans Revolutionsgarde (IRGC) affyrede 28. juni ballistiske missiler og droner mod den amerikanske base Ali Al Salem i Kuwait og mod den 5. flådes hovedkvarter i Bahrain","Iran beskrev angrebet som svar på tidligere amerikanske angreb mod fem iranske mål","Amerikanske myndigheder meldte om ingen tab eller større skader på amerikanske faciliteter; Bahrain fordømte angrebet som en krænkelse af landets suverænitet"],"body":["Irans Revolutionsgarde affyrede søndag 28. juni ballistiske missiler og droner mod den amerikanske luftbase Ali Al Salem i Kuwait og mod den amerikanske 5. flådes hovedkvarter i Bahrain. Iran beskrev angrebet som et svar på tidligere amerikanske angreb mod fem iranske mål, og spændingen kom oven på en strid om passage gennem Hormuzstrædet.","Amerikanske myndigheder oplyste, at der ikke var tab eller større materielle skader på de amerikanske faciliteter. Bahrain fordømte angrebet som en krænkelse af landets suverænitet og advarede om, at det undergravede forsøg på at deeskalere.","Iransk statsmedie hævdede, at de ramte faciliteter var 'ødelagt' — en påstand, der ikke er bekræftet af uafhængige kilder, og som står i kontrast til den amerikanske melding om begrænset skade."],"whyItMatters":"Direkte iranske angreb på amerikanske baser i Golfen trækker konflikten ud over Iran og Israel og truer både olietransport gennem Hormuz og en netop indgået, skrøbelig våbenhvile — med potentiale til at flytte energipriser og risikopræmier globalt.","analysis":"Mønstret — afmålte angreb mod militære mål med forhåndsvarsel og uden amerikanske tab — ligner tidligere iranske eskalationer, der signalerer styrke uden at fremtvinge fuld krig. Risikoen er fejlberegning: når begge sider veksler mellem angreb og forhandling, kan en enkelt hændelse med tab tippe balancen.","counterpoint":"Flere regionale aktører fremstiller angrebet som primært symbolsk og rettet mod at redde forhandlingspositionen indenrigspolitisk; i det lys er eskalationen reel, men kalibreret, ikke optakt til total krig.","topics":["geopolitik","Mellemøsten","sikkerhed","energi","USA","Iran"],"entities":["Iran","USA","IRGC","Kuwait","Bahrain","Hormuzstrædet"],"scores":{"importance":90,"decisionValue":72,"novelty":75,"sourceQuality":80,"personalRelevance":45,"contrast":80},"claims":[{"text":"IRGC affyrede 28. juni missiler og droner mod Ali Al Salem i Kuwait og 5. flådes HQ i Bahrain","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-attacks-kuwait-and-bahrain-in-response-to-us-strikes","https://www.pbs.org/newshour/world/iran-attacks-bahrain-and-kuwait-following-u-s-strikes-and-threatens-to-halt-talks"],"confidence":"high"},{"text":"USA meldte om ingen tab eller større skader; Bahrain fordømte angrebet","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-attacks-kuwait-and-bahrain-in-response-to-us-strikes"],"co kken af AI-selskaber, der reducerer afhængigheden af Nvidia ved at designe egne inferens-chips sammen med en etableret halvlederpartner."],"whyItMatters":"Egne inferens-chips er nøglen til at sænke de løbende omkostninger ved at drive AI i stor skala. Lykkes besparelsen, ændrer det enhedsøkonomien for hele AI-industrien og svækker Nvidias prissætningsmagt.","analysis":"De angivne 50 procents besparelse er en leverandørpåstand, ikke en uafhængigt verificeret måling, og bør læses med forbehold. Men retningen er klar: de største AI-aktører internaliserer hardware for at kontrollere både omkostninger og forsyning — en vertikal integration, der på sigt kan omfordele værdi fra GPU-leverandører til model­ejerne.","topics":["AI","halvledere","deeptech","teknologisk suverænitet"],"entities":["OpenAI","Broadcom","Hock Tan","Nvidia"],"scores":{"importance":72,"decisionValue":68,"novelty":80,"sourceQuality":78,"personalRelevance":85,"contrast":66},"claims":[{"text":"OpenAI og Broadcom præsenterede 24. juni Jalapeño, OpenAIs første egenudviklede inferens-chip","sourceUrls":["https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/","https://venturebeat.com/infrastructure/openai-unveils-first-custom-ai-inference-chip-jalapeno-with-broadcom-and-its-development-was-sped-up-with-openais-own-models"],"confidence":"high"},{"text":"Broadcoms ledelse angav ca. 50 procents lavere omkostninger vs. typiske AI-GPU'er (leverandørpåstand)","sourceUrls":["https://venturebeat.com/infrastructure/openai-unveils-first-custom-ai-inference-chip-jalapeno-with-broadcom-and-its-development-was-sped-up-with-openais-own-models"],"confidence":"medium"}],"sources":[{"title":"OpenAI unveils its first custom chip, built by Broadcom","publisher":"TechCrunch","url":"https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/","publishedAt":"2026-06-24T21:54:00Z","kind":"reporting"},{"title":"OpenAI unveils first custom AI inference chip, Jalapeño, le":false,"headline":"Hospitals struggle as European heatwave moves east","primarySourceUrl":"https://www.euronews.com/my-europe/2026/06/26/hospitals-struggle-as-european-heatwave-moves-east","subheadline":"Den europæiske hedebølge pressede hospitaler i Frankrig, Storbritannien og Spanien og rykkede østpå mod Tyskland og Polen.","materialFacts":["Franske akutmodtagelser rapporterede en kraftig stigning i varmerelaterede besøg, og Paris nåede ifølge politichefen et 'mætningspunkt' på hospitalerne","Spaniens dødelighedsovervågning MoMo koblede 212 dødsfald til varmen i perioden 21.-24. juni","Mindst 101 millioner europæere oplevede temperaturer over 35 grader, mens hedebølgen rykkede østpå mod Tyskland og Polen"],"body":["Den vedvarende hedebølge satte i ugen pres på sundhedsvæsenet i flere europæiske lande. I Frankrig meldte akutmodtagelser om markant flere varmerelaterede besøg, og Paris’ politichef talte om et 'mætningspunkt' på hospitalerne. I Storbritannien rapporterede Londons ambulancetjeneste rekordmange livstruende nødopkald på en enkelt dag.","Spaniens dødelighedsovervågning MoMo koblede 212 dødsfald til varmen mellem 21. og 24. juni. Ifølge opgørelser oplevede mindst 101 millioner europæere temperaturer over 35 grader, da varmen kulminerede.","Sidst på ugen rykkede hedebølgen østpå, og Tyskland og Polen udstedte varsler, samtidig med at den nåede sit danske toppunkt med en national varmerekord."],"whyItMatters":"Hedebølgens dødelighed og pres på akutberedskabet viser, at ekstrem varme allerede er en folkesundhedskrise i Europa — ikke en fremtidig risiko — og at sundhedssystemer må dimensioneres efter et varmere klima.","analysis":"Dødstallene er foreløbige og baseret på statistisk overdødelighed, ikke individuelle dødsattester, så de er forbundet med usikkerhed. Men retningen er entydig: kapacitetsproblemerne flytter nordpå, og varmeberedskab bliver et planlægningsparameter også uden for Sydeuropa.","topics":["klima","global sundhed","Europa","katastrofe"], at han træder tilbage inden for uger og udskriver nyvalg","Beslutningen kommer efter cirka 18 måneders studenterledede antikorruptionsprotester udløst af en togstationsulykke i Novi Sad i november 2024, der dræbte 16 mennesker","Under den serbiske forfatning skal valg afholdes inden for 90 dage efter en præsidents tilbagetræden"],"body":["Serbiens præsident Aleksandar Vučić bebudede lørdag 27. juni i Beograd, at han vil træde tilbage inden for få uger og udskrive nyvalg. 'Jeg vil kun være præsident i et par uger, og så træder jeg tilbage,' lød meldingen ifølge Al Jazeera.","Udmeldingen kommer efter omkring 18 måneders studenterledede antikorruptionsprotester, der blev udløst af sammenstyrtningen af et togstationstag i Novi Sad i november 2024, hvor 16 mennesker omkom. Vučić's mandat løber ellers til midten af 2027.","Ifølge den serbiske forfatning skal der afholdes valg inden for 90 dage efter en præsidents tilbagetræden, hvilket kan udløse en hurtig og uforudsigelig valgkamp."],"whyItMatters":"Et magtskifte i Serbien påvirker stabiliteten på Vestbalkan og EU's udvidelsespolitik. At en stærk, langtidssiddende leder bøjer sig for en vedvarende protestbevægelse, er en sjælden og potentielt skelsættende begivenhed i regionen.","analysis":"Et bebudet, men endnu ikke effektueret, exit giver Vučić tid til at forme valgvilkårene. Om tilbagetrækningen reelt afgiver magt eller blot er en taktisk nulstilling, afgøres af, hvor frit og hvornår valget afholdes — og af, om protestbevægelsen kan omsætte gadepres til en organiseret politisk kraft.","topics":["geopolitik","Europa","politik","reformer"],"entities":["Aleksandar Vučić","Serbien","Novi Sad","Beograd"],"scores":{"importance":74,"decisionValue":50,"novelty":76,"sourceQuality":82,"personalRelevance":40,"contrast":78},"claims":[{"text":"Vučić bebudede 27. juni at træde tilbage inden for uger og udskrive nyvalg","sourceUrls":["https://www.aljazeera.com/news/2026/6/27/serbias-president-aleksandar-vucic-says-will-resign-within-weeks"],"confidence":"high"},{"text":"Protesterne udsprang af togstationsulykken i Novi Sad i november 2024, der dræbte 16","sourceUrls":["https://www.aljazeera.com/news/2026/6/27/serbias-president-aleksandar-vucic-says-will-resign-within-weeks"],"confidence":"high"}],"sources":[{"title":"Serbia’s President Aleksandar Vucic says will resign within ‘weeks’","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/27/serbias-president-aleksandar-vucic-says-will-resign-within-weeks","publishedAt":"2026-06-27T12:00:00Z","kind":"reporting"}]},{"id":"story-russia-hybrid-baltics-w26","eventKey":"russia-hybrid-provocation-baltics-poland-2026-06","section":"Sikkerhed","isLead":false,"isOutsideProfile":false,"headline":"Latvia warns that Russia is planning hybrid attacks on the Baltics and Poland but says full-scale war is not imminent","primarySourceUrl":"https://meduza.io/en/feature/2026/06/23/latvia-warns-that-russia-is-planning-hybrid-attacks-on-the-baltics-and-poland-but-says-full-scale-war-is-not-imminent","subheadline":"Letlands efterretningstjeneste advarede om, at Rusland forbereder hybride angreb mod Baltikum og Polen — men vurderede, at fuldskala krig ikke er nært forestående.","materialFacts":["Letlands efterretningstjeneste advarede ~22.-23. juni om, at Rusland forbereder militære eller hybride provokationer mod Baltikum eller Polen","Tjenesten vurderede samtidig, at der aktuelt ikke er nogen militære trusler mod Letland","Rusland vurderes at mangle kapacitet til konventionel krig og at skulle bruge tre til fem år på at genopbygge tilstrækkelig militær styrke, selv hvis krigen i Ukraine ophørte"],"body":["Letlands efterretningstjeneste advarede omkring 22.-23. juni om, at Rusland kan forberede militære eller hybride provokationer — herunder droner, missiler eller andre hybride operationer — mod de baltiske lande eller Polen. Formålet skulle ifølge tjenesten være at sende et signal om at stoppe støtten til Ukraine.","Samtidig understregede tjenesten, at der aktuelt ikke er nogen direkte militære trusler mod Letland. Rusland vurderes at mangle kapacitet til en konventionel krig mod NATO og at ville skulle bruge tre til fem år på at genopbygge tilstrækkelig militær styrke, selv hvis kampene i Ukraine ophørte med det samme.","Vurderingen indskriver sig i en bredere nordeuropæisk bekymring for hybride trusler mod den østlige flanke."],"whyItMatters":"En kalibreret trusselsvurdering fra en frontlinjestat hjælper med at adskille reel risiko fra alarmisme: faren er hybrid og kortsigtet, mens en konventionel krig ligger år ude — en sondring, der bør forme både beredskab og investering i forsvar.","analysis":"Det interessante er nøgternheden: tjenesten nedtoner krigsfrygt og peger i stedet på provokationer under tærsklen for artikel 5. For NATO er udfordringen netop denne gråzone, hvor droner og sabotage er svære at tilskrive og besvare uden at eskalere.","topics":["sikkerhed","NATO","Rusland","hybridtrussel","Europa","infrastruktur"],"entities":["Letland","Rusland","NATO","Baltikum","Polen"],"scores":{"importance":76,"decisionValue":60,"novelty":58,"sourceQuality":75,"personalRelevance":60,"contrast":55},"claims":[{"text":"Letlands efterretningstjeneste advarede om russiske hybride provokationer mod Baltikum/Polen, men så ingen aktuel militær trussel mod Letland","sourceUrls":["https://meduza.io/en/feature/2026/06/23/latvia-warns-that-russia-is-planning-hybrid-attacks-on-the-baltics-and-poland-but-says-full-scale-war-is-not-imminent","https://www.foxnews.com/world/russia-preparing-hybrid-attacks-natos-eastern-flank-intelligence-warns"],"confidence":"high"},{"text":"Rusland vurderes at skulle bruge 3-5 år på at genopbygge kapacitet til konventionel krig","sourceUrls":["https://www.foxnews.com/world/russia-preparing-hybrid-attacks-natos-eastern-flank-intelligence-warns"],"confidence":"medium"}],"sources":[{"title":"Latvia warns that Russia is planning hybrid attacks on the Baltics and Poland but says full-scale war is not imminent","publisher":"Meduza","url":"https://meduza.io/en/feature/2026/06/23/latvia-warns-that-russia-is-planning-hybrid-attacks-on-the-baltics-and-poland-but-says-full-scale-war-is-not-imminent","publishedAt":"2026-06-23T12:00:00Z","kind":"reporting"},{"title":"Russia preparing hybrid attacks on NATO’s eastern flank, intelligence warns","publisher":"Fox News","url":"https://www.foxnews.com/world/russia-preparing-hybrid-attacks-natos-eastern-flank-intelligence-warns","publishedAt":"2026-06-22T20:59:00Z","kind":"reporting"}]},{"id":"story-greenland-faroe-foreign-policy-w26","eventKey":"greenland-faroe-foreign-policy-autonomy-2026-06","section":"Rigsfællesskab","isLead":false,"isOutsideProfile":false,"headline":"Grønland og Færøerne vil gå solo på udenrigspolitikken","primarySourceUrl":"https://www.dr.dk/nyheder/indland/groenland/groenland-og-faeroeerne-vil-gaa-solo-paa-udenrigspolitikken","subheadline":"Grønland og Færøerne ønsker øget og mere ligeværdig udenrigspolitisk kompetence i rigsfællesskabet, og regeringen signalerer vilje til at se på det.","materialFacts":["Grønland og Færøerne ønsker større egen kompetence på udenrigspolitikken inden for rigsfællesskabet","Grønlands formand Jens-Frederik Nielsen og det færøske lagmandskontor ved Beinir Johannesen ser positivt på, at regeringen vil undersøge mere ligeværdighed","Begge ønsker bl.a. selvstændig deltagelse i internationale organisationer; en dansk dom fra september 2025 fastslog, at Færøerne kan tiltræde WTO selvstændigt"],"body":["Grønland og Færøerne ønsker øget og mere ligeværdig udenrigspolitisk kompetence inden for rigsfællesskabet, og den danske regering signalerer vilje til at undersøge mulighederne. Grønlands formand Jens-Frederik Nielsen peger på, at de to rigsdele i dag ikke har fuld myndighed på udenrigsområdet.","Også det færøske lagmandskontor ved Beinir Johannesen udtrykker tilfredshed og henviser til politisk enighed på Færøerne om at gå videre i dialog med statsministeren. Begge rigsdele ønsker blandt andet selvstændig deltagelse i internationale organisationer.","En dom fra Højesteret i september 2025 fastslog, at Færøerne kan tiltræde WTO selvstændigt uden at bryde grundloven — et juridisk holdepunkt for ønsket om mere udenrigspolitisk råderum."],"whyItMatters":"Spørgsmålet om udenrigspolitisk kompetence går til kernen af rigsfællesskabets fremtid og er skærpet af stormagtsinteressen for Arktis og Grønland. En forskydning af kompetence vil ændre, hvem der taler for riget i internationale fora.","analysis":"Sagen er mindre en akut konflikt end en langsom forfatningsmæssig forhandling, hvor Arktis’ geopolitiske vægt giver Nuuk og Tórshavn forhandlingskraft. For København er udfordringen at imødekomme ligeværdighed uden at fragmentere rigets udenrigspolitiske stemme i en tid med pres på Grønland.","topics":["rigsfællesskab","udenrigspolitik","Arktis","Grønland","indland"],"entities":["Grønland","Færøerne","Jens-Frederik Nielsen","Beinir Johannesen","Danmark"],"scores":{"importance":70,"decisionValue":62,"novelty":72,"sourceQuality":85,"personalRelevance":66,"contrast":70},"claims":[{"text":"Grønland og Færøerne ønsker større udenrigspolitisk kompetence, og regeringen vil undersøge det","sourceUrls":["https://www.dr.dk/nyheder/indland/groenland/groenland-og-faeroeerne-vil-gaa-solo-paa-udenrigspolitikken","https://www.sermitsiaq.ag/samfund/ny-regering-et-ligevaerdigt-rigsfaellesskab/2390171"],"confidence":"high"},{"text":"En dansk højesteretsdom fra september 2025 fastslog, at Færøerne kan tiltræde WTO selvstændigt","sourceUrls":["https://www.dr.dk/nyheder/indland/groenland/groenland-og-faeroeerne-vil-gaa-solo-paa-udenrigspolitikken"],"confidence":"medium"}],"sources":[{"title":"Grønland og Færøerne vil gå solo på udenrigspolitikken","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/groenland/groenland-og-faeroeerne-vil-gaa-solo-paa-udenrigspolitikken","publishedAt":"2026-06-28T05:00:00Z","kind":"reporting"},{"title":"Ny regering: Et ligeværdigt ,"whyItMatters":"Et opkøb på over 11 mia. dollar i forskningsværktøjer og diagnostik signalerer fornyet konsolidering i life science-værktøjsmarkedet — et investeringsfelt, hvor europæiske koncerner buder aggressivt på amerikanske aktiver.","analysis":"Den høje præmie afspejler både Bio-Technes position i voksende multiomics-segmenter og Mercks behov for at geninvestere efter års organisk vækst. For sektoren er handlen et signal om, at kapital igen flyder mod 'spader og skovle' — værktøjerne bag biotek — snarere end mod enkeltlægemidler.","topics":["bioteknologi","erhverv","opkøb","life science","Europa"],"entities":["Merck KGaA","Bio-Techne","Darmstadt","Sigma-Aldrich"],"scores":{"importance":72,"decisionValue":66,"novelty":64,"sourceQuality":90,"personalRelevance":58,"contrast":55},"claims":[{"text":"Merck KGaA køber Bio-Techne for 73 dollar/aktie, ca. 11,3 mia. dollar, annonceret 25. juni","sourceUrls":["https://investors.bio-techne.com/press-releases/detail/535/merck-kgaa-darmstadt-germany-agrees-to-acquire","https://www.cnbc.com/2026/06/25/germanys-merck-kgaa-to-buy-bio-techne.html"],"confidence":"high"},{"text":"Buddet er ca. 36 procents præmie; det er Mercks største opkøb siden Sigma-Aldrich i 2014","sourceUrls":["https://investors.bio-techne.com/press-releases/detail/535/merck-kgaa-darmstadt-germany-agrees-to-acquire"],"confidence":"medium"}],"sources":[{"title":"Merck KGaA, Darmstadt, Germany, Agrees to Acquire Bio-Techne, Strengthening Leadership Position in Fast-Growing Life Sciences Markets","publisher":"Bio-Techne","url":"https://investors.bio-techne.com/press-releases/detail/535/merck-kgaa-darmstadt-germany-agrees-to-acquire","publishedAt":"2026-06-25T11:00:00Z","kind":"primary"},{"title":"Germany’s Merck boosts life sciences business with $11 billion Bio-Techne deal","publisher":"CNBC","url":"https://www.cnbc.com/2026/06/25/germanys-merck-kgaa-to-buy-bio-techne.html","publishedAt":"2026-06-25T13:00:00Z","kind":"reporting"}]},{"id":"story-viking-textile-soeften-w26","eventKey":"dk-viking-textile-soeften-2026-06","section":"Kultur & historie","isLead":false,"isOutsideProfile":true,"headline":"Moesgaard finder stor produktionsplads fra vikingetiden nord for Aarhus","primarySourceUrl":"https://moesgaardmuseum.dk/nyheder/fund-af-stort-produktionsmiljoe-fra-vikingetiden-nord-for-aarhus/","subheadline":"Arkæologer fra Moesgaard Museum har fundet en cirka 100.000 kvadratmeter stor tekstilproduktionsplads fra vikingetiden ved Søften nord for Aarhus.","materialFacts":["Moesgaard Museum har fundet en cirka 100.000 kvadratmeter stor specialiseret tekstilproduktionsplads ved Søften omkring 10 km nord for Aarhus","Udgravningen rummer 82 grubehuse samt fund som tenvægte, vævevægte, sølvfragmenter, mønter og perler, der peger på produktion og fjernhandel","Pladsen dateres til sen jernalder og tidlig vikingetid (cirka 600-950) og leverede formentlig til handelsbyen Aros (det tidlige Aarhus)"],"body":["Arkæologer fra Moesgaard Museum har ved Søften omkring 10 km nord for Aarhus afdækket en usædvanlig stor, specialiseret tekstilproduktionsplads fra vikingetiden på cirka 100.000 kvadratmeter. Udgravningen blev gennemført fra august 2025 til juni 2026.","På stedet er fundet 82 grubehuse — nedgravede værkstedshuse — samt tenvægte, vævevægte, sølvfragmenter, mønter og perler. Fundene dækker hele tekstilproduktionens kæde og vidner om handelsforbindelser over lange afstande.","Pladsen dateres til sen jernalder og tidlig vikingetid, cirka 600-950, og leverede formentlig tekstiler til den fremvoksende handelsby Aros, det tidlige Aarhus. Fundet nuancerer billedet af vikingetiden som en organiseret produktions- og handelsøkonomi."],"whyItMatters":"Fundet udvider forståelsen af vikingetidens økonomi fra plyndring til organiseret, specialiseret produktion og fjernhandel — en påmindelse om, at det førmoderne Danmark var dybere integreret i datidens netværk, end stereotypen tilsiger.","analysis":"En produktionsplads af denne størrelse antyder
