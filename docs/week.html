  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;

55},"claims":[{"text":"EU-Kommissionen godkendte 15. juli 2026 en oral udgave af Wegovy med 25 mg semaglutid som den første GLP-1-vægttabspille i hele EU, samtidig med en ny 7,2 mg-pen.","sourceUrls":["https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu"],"confidence":"high"}],"sources":[{"title":"Novo Nordisk får grønt lys til vægttabspille i EU","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu","publishedAt":"2026-07-15T12:00:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/oujpen2a/317.png?im=AspectCrop%3D%28700%2C394%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%28700%2C394%29","credit":"Kilde: DR","alt":"Novo Nordisks vægttabsmiddel Wegovy – EU godkender nu en oral pilleudgave","sourceUrl":"https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu"}},{"id":"story-eu-missilforsvar-20260714","eventKey":"european-missile-defense-coalition-2026","materialFacts":["Danmark tilslutter sig en koalition af ti lande (Frankrig, Tyskland, Italien, Nederlandene, Norge, Spanien, Sverige, Storbritannien og Ukraine), der vil opbygge et integreret europæisk forsvar mod ballistiske missiler, præsenteret mandag i Paris under Mette Frederiksens besøg hos Emmanuel Macron","Danmarks bidrag er radarsystemer; radarvirksomheden Weibel Scientific fra Allerød deltog i mødet i Paris og skal være med til at udvikle systemet","Frederiksen forventer, at projektet går i gang inden udgangen af 2026, og erklærer som mål, at Europa selv skal producere kapaciteter frem for at være afhængig af USA","Ukraine tiltænkes en nøglerolle i arkitekturen"],"section":"Forsvar","headline":"Danmark går sammen med en række lande om at opbygge europæisk missilforsvar","primarySourceUrl":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","subheadline":"Ti lande – med Ukraine i en nøglerolle – vil bygge et fælles værn mod ballistiske missiler. Danmark bidrager med radarteknologi, og Weibel Scientific var med i Paris.","body":["Danmark tilslutter sig en koalition af ti lande, der vil opbygge et integreret europæisk forsvar mod ballistiske missiler. Beslutningen blev præsenteret mandag i Paris under Mette Frederiksens besøg hos Emmanuel Macron, og kredsen tæller også Tyskland, Storbritannien, Italien, Nederlandene, Norge, Spanien og Sverige – samt Ukraine i en nøglerolle.","Det danske bidrag er radarsystemer, og Allerød-virksomheden Weibel Scientific deltog i mødet i Paris og skal være med til at udvikle systemet. Statsministeren forventer, at projektet går i gang allerede i 2026, og formulerede målet direkte: Europa skal selv kunne producere de kapaciteter, som kontinentet i dag køber i USA."],"whyItMatters":"Missilforsvar er et af de områder, hvor Europas afhængighed af amerikansk teknologi er størst; en fælles arkitektur flytter efterspørgsel og udviklingsmidler til europæiske – herunder danske – leverandører.","analysis":"For dansk forsvarsindustri er signalværdien betydelig: Får Weibel en rolle i radarlaget af et europæisk missilskjold, rykker Danmark fra kunde til systemleverandør. Finansiering og kommandostruktur er endnu ikke offentliggjort – og det er erfaringsmæssigt dér, fælleseuropæiske forsvarsprojekter forsinkes.","topics":["forsvar","missilforsvar","teknologisk suverænitet","Europa"],"entities":["Danmark","Mette Frederiksen","Weibel Scientific","Frankrig","Ukraine"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":70,"novelty":78,"sourceQuality":85,"personalRelevance":90,"contrast":55},"claims":[{"text":"Danmark indgår i en koalition af ti lande – heriblandt Frankrig, Tyskland, Storbritannien og Ukraine – der vil opbygge et integreret europæisk missilforsvar, annonceret i Paris mandag den 13. juli 2026.","sourceUrls":["https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","https://www.euronews.com/my-europe/2026/07/13/nine-european-countries-and-ukraine-form-anti-ballistic-missile-coalition"],"confidence":"high"},{"text":"Danmarks bidrag er radarsystemer, og Weibel Scientific deltog i mødet i Paris; Mette Frederiksen forventer, at projektet starter i 2026.","sourceUrls":["https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar"],"confidence":"high"}],"sources":[{"title":"Danmark går sammen med en række lande om at opbygge europæisk missilforsvar","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","publishedAt":"2026-07-13T18:40:00.000Z","kind":"reporting"},{"title":"Nine European countries and Ukraine form anti-ballistic missile coalition","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/07/13/nine-european-countries-and-ukraine-form-anti-ballistic-missile-coalition","publishedAt":"2026-07-13T16:31:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/mmolxrv3/20260713-173821-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: DR","alt":"Mette Frederiksen ved mødet i Paris, hvor ti lande præsenterede planen om et fælles europæisk missilforsvar","sourceUrl":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar"}},{"id":"story-lindsey-graham-death-20260713","eventKey":"lindsey-graham-death-2026-07","materialFacts":["US Senator Lindsey Graham (Republican, South Carolina) died at age 71 on the night of Saturday, July 11, 2026, hours after returning from a trip to Ukraine where he had met President Volodymyr Zelenskyy; his office said he died from a 'brief and sudden illness.'","The preliminary cause of death, per medical examiner findings released July 12, 2026, is aortic dissection (a tear/rupture of the aortic wall) due to arteriosclerotic cardiovascular disease; EMS responded to a cardiac-arrest call at his Capitol Hill home.","Graham was first elected to the US Senate in 2002 (serving since 2003), had recently won his Republican primary, and was seeking a fifth term in the November 3, 2026 election.","Under South Carolina law, Republican Governor Henry McMaster appoints an interim replacement, who would serve until January 3, 2027."],"section":"Politik","headline":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","primarySourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","subheadline":"Den mangeårige republikanske senator fra South Carolina døde natten til søndag, kort efter en rejse til Ukraine.","body":["Senator Lindsey Graham (R-South Carolina) døde 71 år gammel natten til søndag den 11. juli, timer efter et besøg hos præsident Zelenskyj i Ukraine. Retsmedicinernes foreløbige konklusion 12. juli peger på en aortadissektion som følge af åreforkalkning efter et hjertestop i hjemmet.","Graham blev valgt til Senatet i 2002 og stillede op til en femte periode 3. november. Efter South Carolinas lov udpeger guvernør Henry McMaster (R) nu en midlertidig afløser frem til 3. januar 2027, hvorefter pladsen besættes ved midtvejsvalget."],"whyItMatters":"Grahams død fjerner en af Trumps mest markante udenrigspolitiske allierede i Senatet og udløser et opgør om en sikker republikansk plads.","analysis":"Med en snæver magtbalance kan selv én tom plads påvirke afstemninger, og nomineringskampen tester Trump-fløjens styrke i South Carolina.","topics":["politik","USA","Senatet","valg"],"entities":["Lindsey Graham","USA","South Carolina","Henry McMaster","Donald Trump"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":45,"novelty":88,"sourceQuality":88,"personalRelevance":40,"contrast":55},"claims":[{"text":"US Senator Lindsey Graham (R-South Carolina) died at 71 on the night of Saturday, July 11, 2026, confirmed by his office and multiple independent outlets.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies"],"confidence":"high"},{"text":"Preliminary medical examiner findings give the cause of death as aortic dissection due to arteriosclerotic cardiovascular disease.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/"],"confidence":"high"},{"text":"Graham died hours after returning from a trip to Ukraine and had been seeking a fifth Senate term in the November 3, 2026 election.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"],"confidence":"high"}],"sources":[{"title":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","publisher":"CBS News","url":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","publishedAt":"2026-07-13T00:51:00.000Z","kind":"reporting"},{"title":"Lindsey Graham dies of aortic dissection, preliminary medical report says","publisher":"The Washington Post","url":"https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"},{"title":"Sen. Lindsey Graham of South Carolina, Trump ally, dies at 71","publisher":"NPR","url":"https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"}],"image":{"url":"https://assets2.cbsnewsstatic.com/hub/i/r/2026/07/12/b382a83e-fc49-460b-9f9a-8c8e3539c038/thumbnail/620x413/92887803139a33088d75d95a066274f3/gettyimages-2259262756.jpg","credit":"Kilde: CBS News / Getty Images","alt":"Portræt i forbindelse med senator Lindsey Grahams død","sourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"}},{"id":"story-france-assisted-dying-20260716","eventKey":"france-assisted-dying-law-final-adoption-2026-07","materialFacts":["Frankrigs Nationalforsamling vedtog 15. juli 2026 den endelige tekst til en lov om aktiv dødshjælp efter årelang politisk strid","Loven gør det under nærmere betingelser muligt for voksne med en alvorlig og uhelbredelig lidelse at få hjælp til at dø","Spørgsmålet har delt både partier, lægestand og kirke i Frankrig"],"section":"Udland","headline":"French Parliament approves landmark assisted-dying bill","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/15/french-parliament-approves-landmark-assisted-dying-bill","subheadline":"Efter årelang strid tillader Frankrig nu aktiv dødshjælp under betingelser.","body":["Frankrigs Nationalforsamling vedtog 15. juli 2026 den endelige tekst til en lov om aktiv dødshjælp efter årelang strid. Loven gør det under nærmere betingelser muligt for voksne med en alvorlig, uhelbredelig lidelse at få hjælp til at dø.","Vedtagelsen afslutter en af de mest følelsesladede processer i nyere fransk politik, hvor spørgsmålet har delt partier, lægestand og kirke. Modstandere advarer om pres på sårbare patienter; tilhængere fremhæver retten til en værdig død."],"whyItMatters":"Frankrig slutter sig til en mindre gruppe europæiske lande, der tillader en form for aktiv dødshjælp, og flytter en central etisk grænse i et af EU's største lande.","analysis":"Loven viser, hvordan et sekulært samfund gradvist omdefinerer forholdet mellem individuel autonomi og statens beskyttelse af livet. Den reelle prøve bliver implementeringen: sikkerhedsmekanismer, der forhindrer misbrug uden at gøre retten illusorisk.","topics":["etik","Frankrig","sundhed","lovgivning"],"entities":["Frankrig","Nationalforsamlingen","aktiv dødshjælp"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":82,"decisionValue":66,"novelty":74,"sourceQuality":84,"personalRelevance":58,"contrast":78},"claims":[{"text":"Frankrigs Nationalforsamling vedtog 15. juli 2026 den endelige tekst til en lov, der under betingelser tillader aktiv dødshjælp for voksne med en alvorlig og uhelbredelig lidelse.","sourceUrls":["https://www.aljazeera.com/news/2026/7/15/french-parliament-approves-landmark-assisted-dying-bill","https://www.france24.com/en/france/20260715-france-expected-to-pass-final-vote-on-assisted-dying-after-years-of-debate"],"confidence":"high"}],"sources":[{"title":"French Parliament approves landmark assisted-dying bill","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/15/french-parliament-approves-landmark-assisted-dying-bill","publishedAt":"2026-07-15T16:00:00.000Z","kind":"reporting"},{"title":"France expected to pass final vote on assisted dying after years of debate","publisher":"France 24","url":"https://www.france24.com/en/france/20260715-france-expected-to-pass-final-vote-on-assisted-dying-after-years-of-debate","publishedAt":"2026-07-15T09:00:00.000Z","kind":"reporting"}],"image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/07/afp_6a57d9416c2b-1784142145.jpg?resize=1920%2C1440","credit":"Foto: AFP/Al Jazeera","alt":"Frankrigs Nationalforsamling – parlamentet vedtager lov om aktiv dødshjælp","sourceUrl":"https://www.aljazeera.com/news/2026/7/15/french-parliament-approves-landmark-assisted-dying-bill"}},{"id":"story-rockwool-akzonobel-russia-20260716","eventKey":"rockwool-akzonobel-russia-seizure-microcompany-2026-07","materialFacts":["En lille Moskva-baseret virksomhed, SC Razvitie Stroitelnykh Aktivov, samler kontrollen over vestlige industrigiganters russiske aktiver","I januar 2026 overførte den russiske stat kontrollen med Rockwools fire russiske fabrikker til selskabet; i juli 2026 fulgte et Putin-dekret om AkzoNobels (Sadolin) russiske aktiviteter","Rockwools topchef Jes Munk Hansen kalder det tyveri; de overtagne fabrikker har ifølge DR leveret materialer til det russiske militær"],"section":"Erhverv","headline":"Putin 'stjal' danske milliardfabrikker: Nu overtager lille hemmeligt selskab også hollandsk malergigant","primarySourceUrl":"https://www.dr.dk/nyheder/penge/putin-stjal-danske-milliardfabrikker-nu-overtager-lille-hemmeligt-selskab-ogsaa-hollandsk","subheadline":"Samme uigennemsigtige Moskva-selskab samler nu både Rockwools og AkzoNobels russiske aktiver.","body":["En lille, ukendt Moskva-virksomhed, SC Razvitie Stroitelnykh Aktivov, samler kontrollen over vestlige industrigiganters russiske aktiver. I januar 2026 overførte den russiske stat kontrollen med danske Rockwools fire russiske fabrikker til selskabet, der ledes af Timur Amirov.","I juli 2026 placerede et Putin-dekret hollandske AkzoNobels russiske aktiviteter (Sadolin) under samme selskab. Rockwool-chef Jes Munk Hansen kalder det tyveri; fabrikkerne har ifølge DR leveret materialer til det russiske militær."],"whyItMatters":"Sagen viser den voksende pris, danske og europæiske industrivirksomheder betaler for produktion i Rusland – ekspropriationen er nu systematiseret gennem én struktur.","analysis":"Præcedensen er farligere end tabet: en skabelon, hvor Kreml samler beslaglagte vestlige aktiver på få hænder i krigsøkonomiens tjeneste. Det gør en ordnet exit fra Rusland stort set umulig for de tilbageværende.","topics":["Rusland","ekspropriation","erhverv","geopolitik"],"entities":["Rockwool","AkzoNobel","Vladimir Putin","Jes Munk Hansen","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":70,"novelty":80,"sourceQuality":82,"personalRelevance":72,"contrast":78},"claims":[{"text":"Den russiske stat overførte i januar 2026 kontrollen med Rockwools fire russiske fabrikker til Moskva-selskabet SC Razvitie Stroitelnykh Aktivov, og et Putin-dekret i juli 2026 placerede AkzoNobels russiske aktiviteter under samme selskab.","sourceUrls":["https://www.dr.dk/nyheder/penge/putin-stjal-danske-milliardfabrikker-nu-overtager-lille-hemmeligt-selskab-ogsaa-hollandsk"],"confidence":"high"}],"sources":[{"title":"Putin 'stjal' danske milliardfabrikker: Nu overtager lille hemmeligt selskab også hollandsk malergigant","publisher":"DR","url":"https://www.dr.dk/nyheder/penge/putin-stjal-danske-milliardfabrikker-nu-overtager-lille-hemmeligt-selskab-ogsaa-hollandsk","publishedAt":"2026-07-15T05:00:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/554n4bbp/20221123-125021-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Rockwool-produktion – russiske myndigheder har overtaget selskabets fabrikker i Rusland","sourceUrl":"https://www.dr.dk/nyheder/penge/putin-stjal-danske-milliardfabrikker-nu-overtager-lille-hemmeligt-selskab-ogsaa-hollandsk"}},{"id":"us-venture-h1-2026-ai-concentration-20260710","eventKey":"us-venture-h1-2026-ai-concentration","materialFacts":["Amerikansk venturekapital nåede 412,7 mia. dollar i første halvår af 2026 — knap 30 procent mere end hele 2025 tilsammen (PitchBook)","AI-selskaber lagde beslag på 355,9 mia. dollar, svarende til omkring 86 procent af hver venturedollar i perioden","Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital"],"section":"Marked","headline":"PitchBook: US venture funding hits $412.7B in first half as AI deals dominate","primarySourceUrl":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/","subheadline":"Venturekapitalen satte halvårsrekord — men næsten hver eneste dollar samlede sig om kunstig intelligens og de allerstørste runder.","body":["Amerikansk venturekapital nåede 412,7 mia. dollar i første halvår af 2026 — knap 30 procent mere end hele 2025 tilsammen, viser tal fra PitchBook. Men kapitalen samler sig: AI-selskaber tog 355,9 mia. dollar, omkring 86 procent af hver venturedollar i perioden.","Koncentrationen gælder også rundestørrelsen. Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital, mens de tidlige, brede væddemål måtte deles om resten. USA trækker næsten hele læsset."],"whyItMatters":"Når 86 procent af pengene ligger i store AI-runder, er markedet ekstremt eksponeret mod én tese og mod få meget store selskaber.","analysis":"Det er ikke et bredt opsving, men en satsning på, at agentisk AI og infrastruktur tjener de enorme runder hjem — og det efterlader seed, ikke-AI og Europa relativt kapitalfattige.","counterpoint":"PitchBook måler dollar, ikke afkast. Koncentrationen kan lige så vel afspejle, at de bedste muligheder faktisk ligger i AI, som at markedet overopheder.","image":{"url":"https://d15shllkswkct0.cloudfront.net/wp-content/blogs.dir/1/files/2020/10/sandhillroad.jpg","credit":"Kilde: SiliconANGLE","alt":"Sand Hill Road, det traditionelle centrum for amerikansk venturekapital","sourceUrl":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"},"topics":["venturekapital","marked","ai","koncentration","usa"],"entities":["PitchBook","USA","kunstig intelligens"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":88,"novelty":72,"sourceQuality":80,"personalRelevance":90,"contrast":58},"claims":[{"text":"Amerikansk venturekapital nåede 412,7 mia. dollar i H1 2026, og AI-selskaber tog 355,9 mia. dollar (ca. 86 procent).","sourceUrls":["https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"],"confidence":"high"},{"text":"Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital.","sourceUrls":["https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"],"confidence":"high"}],"sources":[{"title":"PitchBook: US venture funding hits $412.7B in first half as AI deals dominate","publisher":"SiliconANGLE","url":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/","publishedAt":"2026-07-09T04:01:00.000Z","kind":"reporting"}]},{"id":"khamenei-burial-mashhad-succession-20260711","eventKey":"khamenei-burial-mashhad-succession","materialFacts":["IRNA meldte tidligt fredag 10. juli, at Khamenei og fire familiemedlemmer er begravet ved Imam Reza-helligdommen i Mashhad","Begravelsen afsluttede en uges processioner gennem Teheran, Qom og de irakiske helligbyer Najaf og Karbala","Den udpegede efterfølger Mojtaba Khamenei har ikke vist sig offentligt siden angrebet 28. februar; iflg. Reuters-citerede kilder i Teheran blev han vansiret og skærmes af sikkerhedstjenesterne"],"section":"Geopolitik","headline":"Slain Supreme Leader Ali Khamenei buried at Iran’s holiest shrine","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies","subheadline":"Efter en uges processioner er Khamenei begravet i Mashhad — men Irans udpegede efterfølger er stadig ikke set offentligt siden angrebet i februar.","body":["Irans statslige nyhedsbureau IRNA meldte tidligt fredag, at ayatollah Ali Khamenei og fire familiemedlemmer er begravet ved Imam Reza-helligdommen i Mashhad, Irans helligste shiamuslimske sted, efter en uges processioner gennem Teheran, Qom, Najaf og Karbala.","Khamenei blev dræbt 28. februar i et amerikansk-israelsk luftangreb i Teheran — begivenheden, der udløste krigen. Efterfølgeren, sønnen Mojtaba, er ikke set offentligt siden; ifølge kilder i Teheran citeret af Reuters blev han vansiret og skærmes af sikkerhedstjenesterne. Oplysningen er ikke uafhængigt bekræftet."],"whyItMatters":"Uden en synlig øverste leder er det uklart, hvem der kan forpligte Iran i forhandlingerne om våbenhvile, sanktioner og uran.","analysis":"Magttomrummet gør Teherans signaler — fra Oman-forhandlinger til 'slyngel-elementer' — svære at læse som forpligtende; det er en selvstændig risiko oven i selve krigen.","image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/07/AFP__20260709__B9RE94Y__v1__HighRes__IranUsIsraelWarFuneral-1783648635.jpg?resize=1920%2C1440","credit":"Foto: AFP via Al Jazeera","alt":"Sørgeoptog under begravelsesceremonierne for Ali Khamenei","sourceUrl":"https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies"},"topics":["geopolitik","iran","mellemøsten","succession"],"entities":["Ali Khamenei","Mojtaba Khamenei","Iran","IRNA","Mashhad"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":48,"novelty":62,"sourceQuality":80,"personalRelevance":45,"contrast":55},"claims":[{"text":"Khamenei blev dræbt 28. februar 2026 i et amerikansk-israelsk luftangreb i Teheran, der udløste krigen; han og fire familiemedlemmer blev begravet ved Imam Reza-helligdommen i Mashhad, meldt af IRNA tidligt fredag 10. juli, efter en uges processioner.","sourceUrls":["https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies","https://www.haaretz.com/middle-east-news/iran/2026-07-09/ty-article/iran-buries-slain-leader-khamenei-after-days-long-funeral-procession/0000019f-4717-dc56-adff-6f77415d0000"],"confidence":"high"},{"text":"Mojtaba Khamenei er ikke set offentligt siden 28. februar og blev ifølge kilder i Teheran citeret af Reuters vansiret i angrebet; oplysningen er ikke uafhængigt bekræftet.","sourceUrls":["https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies","https://www.haaretz.com/middle-east-news/iran/2026-07-09/ty-article/iran-buries-slain-leader-khamenei-after-days-long-funeral-procession/0000019f-4717-dc56-adff-6f77415d0000"],"confidence":"low"}],"sources":[{"title":"Slain Supreme Leader Ali Khamenei buried at Iran’s holiest shrine","publisher":"Al Jazeera","url":"https:/ på for amerikanske fabrikker — han er 'allerede i samtaler med Samsung og SK Hynix'."],"whyItMatters":"SK Hynix sidder på ca. 56 pct. af HBM-markedet — hukommelsen bag Nvidias AI-acceleratorer; noteringen er en direkte temperaturmåling på AI-efterspørgslen.","analysis":"Rekorden landede i samme uge som chip-udsalget: Fysiske flaskehalse som HBM prissættes stadig aggressivt, mens tvivlen samler sig om softwarelaget. Aktien er steget 634 pct. på et år — skuffer AI-capex, står nykommeren forrest i faldet.","image":{"url":"https://techcrunch.com/wp-content/uploads/2026/07/SK-Hynix.jpg?resize=1200,675","credit":"Kilde: TechCrunch","alt":"SK Hynix-logo og chipproduktion","sourceUrl":"https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/"},"topics":["marked","halvledere","ai","sydkorea","usa"],"entities":["SK Hynix","Nasdaq","Samsung","Howard Lutnick","Sydkorea","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":76,"novelty":85,"sourceQuality":85,"personalRelevance":92,"contrast":62},"claims":[{"text":"SK Hynix rejste 26,5 mia. dollar — største udenlandske USA-notering nogensinde; 177,9 mio. ADS'er til 149 dollar, ca. 7x overtegnet, åbnede ca. 14 pct. over kursen.","sourceUrls":["https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/","https://www.cnn.com/2026/07/10/business/sk-hynix-us-listing-ai-chip-boom-intl-hnk"],"confidence":"high"},{"text":"Provenuet investeres i Sydkorea (Yongin, Cheongju, EUV); SK Hynix har ca. 56 pct. af HBM-markedet; Lutnick er i samtaler med Samsung og SK Hynix om amerikanske fabrikker.","sourceUrls":["https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/"],"confidence":"high"},{"text":"SK Hynix-aktien er steget 634 pct. over 12 måneder, og selskabets markedsværdi passerede 1.000 mia. dollar i maj 2026.","sourceUrls":["https://finance.yahoo.com/markets/stocks/articles/sk-hynix-nasdaq-debut-26-113118390.html"],"confidence":"medium"}],"sources":[{"title":"SK Hynix raises $26.5B in the biggest foreign IPO in US history, is urged to build new US fabs","publisher":"TechCrunch","url":"https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/","publishedAt":"2026-07-10T17:17:00.000Z","kind":"reporting"},{"title":"SK Hynix's blockbuster US listing shows the AI chip boom is far from over","publisher":"CNN","url":"https://www.cnn.com/2026/07/10/business/sk-hynix-us-listing-ai-chip-boom-intl-hnk","publishedAt":"2026-07-10T12:00:00.000Z","kind":"reporting"},{"title":"SK Hynix Nasdaq debut: $26.5 billion ADR listing sets record","publisher":"Quartz (via Yahoo Finance)","url":"https://finance.yahoo.com/markets/stocks/articles/sk-hynix-nasdaq-debut-26-113118390.html","publishedAt":"2026-07-10T11:31:00.000Z","kind":"reporting"}]},{"id":"story-dk-drone-antidrone-20260716","eventKey":"denmark-drone-antidrone-expedited-procurement-2026-07","materialFacts":["Regeringen har fået Folketingets opbakning (via Finansudvalget) til at fremskynde indkøb af flere droner og af antidrone-kapaciteter til forsvaret","Beslutningen følger en periode med gentagne uidentificerede droneobservationer over dansk territorium og kritisk infrastruktur","Købene skal ske ad en hasteprocedure, så kapaciteterne kan være på plads hurtigere end normalt"],"section":"Forsvar","headline":"Regeringen begynder yderligere indkøb af dronesystemer","primarySourceUrl":"https://www.kristeligt-dagblad.dk/danmark/regeringen-begynder-yderligere-indkoeb-af-dronesystemer","subheadline":"Folketinget bakker op om hasteindkøb af både droner og antidrone-værn.","body":["Regeringen har fået Folketingets opbakning – via en aktstykke-godkendelse i Finansudvalget – til at fremskynde indkøb af flere droner og antidrone-kapaciteter til forsvaret. Beslutningen følger gentagne uidentificerede droneobservationer over dansk territorium og kritisk infrastruktur.","Købene sker ad en hasteprocedure, så kapaciteterne er på plads hurtigere end ved normale anskaffelser. Både overvågningsdroner og systemer til at opdage og nedkæmpe fjendtlige droner indgår."],"whyItMatters":"Droner er blevet centrale i europæisk sikkerhed efter krigen i Ukraine, og Danmark har oplevet flere krænkelser af luftrummet omkring lufthavne og militære anlæg. Hurtigere indkøb signalerer, at truslen behandles som akut.","analysis":"Hasteindkøb giver fart, men også risiko for at binde sig til umodne systemer i et marked, der ændrer sig fra måned til måned. Prøven bliver, om Danmark køber hyldevarer eller bygger egen kapacitet.","topics":["forsvar","droner","sikkerhed","indkøb"],"entities":["Forsvaret","Folketinget","Finansudvalget","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":80,"novelty":72,"sourceQuality":82,"personalRelevance":86,"contrast":62},"claims":[{"text":"Regeringen har fået Folketingets opbakning til at fremskynde indkøb af yderligere droner og antidrone-kapaciteter til det danske forsvar.","sourceUrls":["https://www.kristeligt-dagblad.dk/danmark/regeringen-begynder-yderligere-indkoeb-af-dronesystemer","https://www.forsvaret.dk/da/nyheder/2026/regeringen-har-faet-folketingets-opbakning-til-at-ko-be-yderligere-droner-og-antidrone-kapaciteter/"],"confidence":"high"}],"sources":[{"title":"Regeringen begynder yderligere indkøb af dronesystemer","publisher":"Kristeligt Dagblad","url":"https://www.kristeligt-dagblad.dk/danmark/regeringen-begynder-yderligere-indkoeb-af-dronesystemer","publishedAt":"2026-07-15T10:33:00.000Z","kind":"reporting"},{"title":"Regeringen har fået Folketingets opbakning til at købe yderligere droner og antidrone-kapaciteter","publisher":"Forsvaret","url":"https://www.forsvaret.dk/da/nyheder/2026/regeringen-har-faet-folketingets-opbakning-til-at-ko-be-yderligere-droner-og-anti t ansvarliggørelse: EU sætter navn på enkeltpersoner bag et angreb på et dansk vandværk og fastslår russisk statsstøtte.","analysis":"Sanktioner mod navngivne hackere har begrænset praktisk effekt – de rejser sjældent til EU – men de har signalværdi: Vesten kan identificere gerningsmændene. Angrebet indgår i en bredere EU-britisk pakke mod russisk cyberspionage.","topics":["cybersikkerhed","sanktioner","Rusland","kritisk infrastruktur"],"entities":["EU","Køge","Z-Pentest","GRU","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":74,"novelty":82,"sourceQuality":84,"personalRelevance":80,"contrast":72},"claims":[{"text":"EU indførte sanktioner mod ni personer og fire enheder efter et cyberangreb i december 2024 på Tureby-Alkestrup Vandværk syd for Køge og udpegede den 42-årige russer Yuliya Vladimirovna Pankratova som leder af Z-Pentest, der knyttes til GRU.","sourceUrls":["https://www.dr.dk/nyheder/politik/cyberangreb-mod-vandvaerk-ved-koege-udloeser-eu-sanktioner-mod-42-aarig-russisk-kvinde-og","https://www.france24.com/en/europe/20260713-eu-and-uk-slap-sanctions-on-russian-spies-and-hackers-over-cyberattacks"],"confidence":"high"}],"sources":[{"title":"Cyberangreb mod vandværk ved Køge udløser EU-sanktioner mod 42-årig russisk kvinde og hackergruppe","publisher":"DR","url":"https://www.dr.dk/nyheder/politik/cyberangreb-mod-vandvaerk-ved-koege-udloeser-eu-sanktioner-mod-42-aarig-russisk-kvinde-og","publishedAt":"2026-07-14T14:00:00.000Z","kind":"reporting"},{"title":"EU and UK slap sanctions on Russian spies and hackers over cyberattacks","publisher":"France 24","url":"https://www.france24.com/en/europe/20260713-eu-and-uk-slap-sanctions-on-russian-spies-and-hackers-over-cyberattacks","publishedAt":"2026-07-13T18:00:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/zbydx4js/20251218-190042-l_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C6       toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
