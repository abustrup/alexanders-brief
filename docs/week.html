  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.feed-card-body { padding: 16px 16px 18px; }

imod på tre af fire punkter, men den principielt tungeste gik hans vej: med 6-3 omstødte retten Humphrey's Executor-præcedensen fra 1935 og fastslog, at præsidenten kan fyre ledere i uafhængige forbundsmyndigheder uden grund. Retten stadfæstede fyringen af FTC-kommissær Rebecca Slaughter.","I en separat 5-4-afgørelse blokerede retten fyringen af centralbankdirektør Lisa Cook og skar en undtagelse ud for Federal Reserve. Chief Justice John Roberts skrev, at »the appearance of independence is key to the Federal Reserve's design«."],"whyItMatters":"Humphrey's Executor har i næsten et århundrede skærmet uafhængige regulatorer mod politisk kontrol; dommen flytter magt til Det Hvide Hus.","analysis":"Fed-undtagelsen er det mest markedsrelevante: centralbankens uafhængighed behandles nu som et forfatningsmæssigt særtilfælde, mens resten af apparatet trækkes mod tættere præsidentiel styring.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/USSupremeCourtWestFacade.JPG/1280px-USSupremeCourtWestFacade.JPG","credit":"Foto: Wikimedia Commons","alt":"USA's højesteretsbygning i Washington D.C.","sourceUrl":"https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know"},"topics":["usa","højesteret","magtdeling","federal-reserve","regulering"],"entities":["U.S. Supreme Court","Donald Trump","Rebecca Slaughter","Lisa Cook","Federal Reserve","John Roberts"],"isLead":true,"isOutsideProfile":true,"scores":{"importance":90,"decisionValue":78,"novelty":82,"sourceQuality":78,"personalRelevance":60,"contrast":72},"claims":[{"text":"Højesteret omstødte med 6-3 Humphrey's Executor og udvidede præsidentens fyringsret over uafhængige myndigheder.","sourceUrls":["https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know"],"confidence":"high"},{"text":"En separat 5-4-afgørelse blokerede fyringen af Fed-direktør Lisa Cook og beskyttede centralbankens uafhængighed.","sourceUrls":["https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know"],"confidence":"high"}],"sources":[{"title":"US Supreme Court hands Trump 3-1 defeat in key rulings: What we know","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know","publishedAt":"2026-06-30T00:00:00Z","kind":"reporting"}]},{"id":"story-quantum-systems-series-d-20260703","eventKey":"quantum-systems-series-d","materialFacts":["Series D på cirka 1,2 mia. dollar til en værdiansættelse på 8 mia. dollar (op fra ca. 3 mia. euro i nov. 2025).","Ledet af Blackstone (US), Advent (US), Airbus (Frankrig) og Noteus (Europa); Bond, Fidelity og Elephant Lake deltog.","Ifølge selskabet Europas største forsvarsteknologiske finansieringsrunde til dato; HQ i München, Tyskland."],"headline":"Quantum Systems raises $1.2BN at $8BN valuation","primarySourceUrl":"https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","subheadline":"Blackstone, Advent og Airbus fordobler Quantum Systems til 8 mia. dollar i Europas største forsvarsteknologiske runde — medstifter lufter Stark-fusion og humanoider.","body":["Den tyske dronegigant Quantum Systems fra München har lukket en Series D på cirka 1,2 mia. dollar til en værdiansættelse på 8 mia. dollar — ifølge selskabet den største forsvarsteknologiske runde i Europa til dato og mere end en fordobling fra 3 mia. euro i november 2025.","Runden er ledet af amerikanske Blackstone og Advent, franske Airbus og europæiske Noteus, med Bond, Fidelity og Elephant Lake som deltagere. Quantum, der laver autonome luft-, land- og søbaserede droner, kalder sig profitabelt og har nu over 1,2 mia. dollar i »dry powder« til ekspansion, opkøb og opskalering af produktionen."],"whyItMatters":"Runden viser, at europæisk forsvarsteknologi nu tiltrækker amerikansk storkapital i milliardklassen — Blackstone og Advent side om side med Airbus — mens Europa opruster.","analysis":"Fordoblingen på under otte måneder afspejler både reel indtjening og skarp konkurrence om europæisk autonomi. Medstifter Florian Seibel peger nu på robotter og humanoider som næste skridt.","topics":["forsvarsteknologi","venturekapital","droner","deeptech","europæisk suverænitet","autonome systemer"],"entities":["Quantum Systems","Florian Seibel","Blackstone","Advent International","Airbus","Noteus","Stark","München","Tyskland","EIFO"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":78,"novelty":72,"sourceQuality":82,"personalRelevance":92,"contrast":55},"claims":[{"text":"Quantum Systems rejste cirka 1,2 mia. dollar i en Series D til en værdiansættelse på 8 mia. dollar, mere end en fordobling fra 3 mia. euro i november 2025.","sourceUrls":["https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark"],"confidence":"high"},{"text":"Runden blev ledet i fællesskab af Blackstone, Advent, Airbus og Noteus, med Bond, Fidelity og Elephant Lake blandt deltagerne.","sourceUrls":["https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/"],"confidence":"high"},{"text":"Medstifter Florian Seibel luftede en mulig fusion med den bevæbnede dronemager Stark, som Stark afviste, og nævnte robotter og humanoider som næste skridt.","sourceUrls":["https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark","https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/"],"confidence":"high"},{"text":"Selskabet kalder sig profitabelt og siger nu at have over 1,2 mia. dollar i »dry powder« til ekspansion, opkøb og produktion.","sourceUrls":["https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/"],"confidence":"high"}],"sources":[{"title":"Quantum Systems raises $1.2BN at $8BN valuation","publisher":"Tech.eu","url":"https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","publishedAt":"2026-07-02T00:00:00Z","kind":"reporting"},{"title":"Drone maker Quantum Systems raises $1.2bn, eyes humanoids","publisher":"Sifted","url":"https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark","publishedAt":"2026-07-02T00:00:00Z","kind":"reporting"},{"title":"Quantum Systems Raises $1.2Bn Series D to Accelerate Growth and Scale Software-Defined Autonomous Systems Across Air, Land and Sea","publisher":"Quantum Systems","url":"https://quantum-systems.com/us/news/quantum-systems-raises-1-2bn-series-d-to-accelerate-growth-and-scale-software-defined-autonomous-systems-across-air-land-and-sea/","publishedAt":"2026-07-02T00:00:00Z","kind":"primary"},{"title":"Quantum Systems More Than Doubles Valuation to $8 Billion in New Round","publisher":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-07-02/quantum-systems-more-than-doubles-valuation-to-8-billion-in-new-round","publishedAt":"2026-07-02T00:00:00Z","kind":"reporting"}],"counterpoint":"Stark afviser kategorisk en fusion (»Der er ingen planer om at fusionere med Quantum Systems«), og Quantum siger selv, der ingen køreplan er — så Seibels sammenlægningstanke er indtil videre spekulation, ikke en aftale.","primaryExcerpt":{"quote":"We are profitable, deployed around the world and with the latest financing round we now have more than $1.2Bn of dry powder to execute.","sourceUrl":"https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","sourceTitle":"Quantum Systems raises $1.2BN at $8BN valuation"},"image":{"url":"https://images.sifted.eu/wp-content/uploads/2025/05/13133934/QS_Florian-Seibel-1-e1756712413500.png?w=1110&h=876&q=75&fit=crop&auto=compress,format","credit":"Sifted / Quantum Systems","alt":"Quantum Systems-medstifter Florian Seibel, hvis selskab rejste 1,2 mia. dollar til en værdiansættelse på 8 mia. dollar.","sourceUrl":"https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark"},"section":"Forsvarsteknologi & kapital"},{"id":"deepseek-in-house-ai-chip-july-2026-story","eventKey":"deepseek-in-house-ai-chip-july-2026","materialFacts":["The chip DeepSeek is developing is designed for inference (running trained models) rather than for training new models.","DeepSeek is Hangzhou-based.","The in-house chip could reduce DeepSeek's reliance on Nvidia and Huawei chips.","The effort remains at an early stage, with DeepSeek reaching out to external partners (chip-design, foundry and memory firms)."],"section":"Teknologi","headline":"Exclusive-China's DeepSeek developing its own AI chip, sources say","primarySourceUrl":"https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/","subheadline":"Reuters: Kinas DeepSeek udvikler sin egen inferens-chip for at mindske afhængigheden af Nvidia og Huawei.","body":["Kinesiske DeepSeek udvikler sin egen AI-chip, skriver Reuters. Chippen er designet til inferens — at køre færdigtrænede modeller — ikke til træning, og målet er at mindske afhængigheden af Nvidia og Huawei.","Arbejdet er tidligt: DeepSeek er i dialog med chipdesign-, støberi- og hukommelsesfirmaer og har ansat flere chipdesignere. Det sker, samtidig med at Hangzhou-selskabet efter planen rejser sin første eksterne kapital på cirka 7 mia. dollar til en værdi på 52-59 mia. dollar."],"whyItMatters":"For DeepSeek er egen silicium et forsøg på at slippe fri af amerikanske eksportrestriktioner og Nvidias priser — samme vertikale integration nu på den kinesiske side.","analysis":"En inferens-chip er lettere at bygge end en trænings-chip, så ambitionen er realistisk, men usikker: kinesisk produktion er stadig bundet af SMIC's kapacitet. Lykkes det, bliver Kina mindre sårbar over for at få lukket for Nvidia.","topics":["ai","halvledere","teknologisk suverænitet","kina","nvidia"],"entities":["DeepSeek","Nvidia","Huawei","Reuters","SMIC","Kina"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":82,"novelty":86,"sourceQuality":82,"personalRelevance":92,"contrast":74},"claims":[{"text":"Exclusive-China's DeepSeek developing its own AI chip, sources say","sourceUrls":["https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"],"confidence":"high"},{"text":"The chip DeepSeek is developing is designed for inference (running trained models) rather than for training new models.","sourceUrls":["https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"],"confidence":"high"},{"text":"DeepSeek is Hangzhou-based.","sourceUrls":["https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"],"confidence":"high"}],"sources":[{"title":"Exclusive-China's DeepSeek developing its own AI chip, sources say","publisher":"Reuters (via KELO-AM)","url":"https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/","publishedAt":"2026-07-07T10:34:00.000Z","kind":"reporting"},{"title":"DeepSeek's AI chip plans","publisher":"Semafor","url":"https://www.semafor.com/article/07/07/2026/deepseeks-ai-chip-plans","publishedAt":"2026-07-07T23:38:00.000Z","kind":"analysis"},{"title":"Chinese AI Startup DeepSeek Developing Own AI Chip, Reuters Says","publisher":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-07-07/chinese-ai-startup-deepseek-developing-own-ai-chip-reuters-says","publishedAt":"2026-07-07T00:00:00.000Z","kind":"reporting"}],"image":{"url":"https://storage.googleapis.com/media.mwcradio.com/mimesis/2026-07/07/2026-07-07T103437Z_2_LYNXMPEM660IJ_RTROPTP_3_DEEPSEEK-CHINA.JPG","credit":"Reuters","alt":"The DeepSeek logo, representing the Hangzhou-based Chinese AI startup now developing its own inference chip.","sourceUrl":"https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"}},{"id":"marine-le-pen-2027-candidacy-appeal-conviction-july-2026-story","eventKey":"marine-le-pen-2027-candidacy-appeal-conviction-july-2026","materialFacts":["Marine Le Pen declared on 2026-07-07 (Tuesday), via French TV channel TF1, that she will run in the 2027 French presidential election.","On 2026-07-07 a French appeals court (Paris) ruled on her embezzlement case (misuse of EU funds to pay National Rally assistants); the guilty conviction was upheld/confirmed on appeal, not overturned.","The appeals court structured the ineligibility (éligibilité) ban as 45 months with 30 months suspended; because roughly 15 months were already effectively counted, the ban does not bar her from the 2027 race, so she remains legally eligible to run.","She also received a three-year prison sentence (two years suspended, one year to be served under home detention with an electronic ankle monitor) and a 100,000-euro fine."],"section":"Verden","headline":"Marine Le Pen stiller op til næste præsidentvalg","primarySourceUrl":"https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg","subheadline":"En appeldomstol stadfæster Le Pens dom for misbrug af EU-midler — men lader hende alligevel stille op i 2027.","body":["Marine Le Pen meddelte 7. juli på TV1, at hun stiller op til det franske præsidentvalg i 2027. Samme dag stadfæstede en appeldomstol i Paris hendes dom for misbrug af EU-midler til aflønning af partiassistenter.","Domstolen strukturerede dog uvalgbarheden (45 måneder, heraf 30 betingede), så den ikke spærrer hende fra valget. Hun fik tre års fængsel — to betingede, ét med fodlænke — og en bøde på 100.000 euro, men appellerer nu til kassationsdomstolen, hvilket suspenderer straffen."],"whyItMatters":"Sagen er en prøve på balancen mellem retsstat og folkestyre: en domstol fastholder dommen mod en topkandidat, men afmåler sanktionen, så vælgerne alligevel får hende på stemmesedlen.","analysis":"Konstruktionen — dom stadfæstet, men uvalgbarhed gjort virkningsløs — vil blive læst som en tilbageholdenhed med at lade domstolene afgøre et valg. Den endelige afklaring ligger nu hos kassationsdomstolen.","topics":["politik","frankrig","retsstat","valg","europa"],"entities":["Marine Le Pen","Rassemblement National","Frankrig","EU","Kassationsdomstolen"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":84,"decisionValue":70,"novelty":74,"sourceQuality":86,"personalRelevance":46,"contrast":80},"claims":[{"text":"Marine Le Pen stiller op til næste præsidentvalg","sourceUrls":["https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg"],"confidence":"high"},{"text":"Marine Le Pen declared on 2026-07-07 (Tuesday), via French TV channel TF1, that she will run in the 2027 French presidential election.","sourceUrls":["https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg"],"confidence":"high"},{"text":"On 2026-07-07 a French appeals court (Paris) ruled on her embezzlement case (misuse of EU funds to pay National Rally assistants); the guilty conviction was upheld/confirmed on appeal, not overturned.","sourceUrls":["https://www.cnn.com/2026/07/07/europe/marine-le-pen-france-court-ruling-intl"],"confidence":"high"}],"sources":[{"title":"Marine Le Pen stiller op til næste præsidentvalg","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg","publishedAt":"2026-07-07T19:14:15.000Z","kind":"reporting"},{"title":"Marine Le Pen to run for French presidency despite losing court appeal | CNN","publisher":"CNN","url":"https://www.cnn.com/2026/07/07/europe/marine-le-pen-france-court-ruling-intl","publishedAt":"2026-07-07T12:08:50.000Z","kind":"reporting"},{"title":"France's Court of Appeal to rule on Le Pen conviction – what it's all about","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/7/frances-court-of-appeal-to-rule-on-le-pen-conviction-what-its-all-about","publishedAt":"2026-07-07T12:00:00Z","kind":"analysis"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/0nbnwuwa/20260707-203816-5.jpg","credit":"DR","alt":"Marine Le Pen, leader of France's National Rally, who announced a 2027 presidential bid after a Paris appeals court ruling on her embezzlement conviction","sourceUrl":"https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg"}},{"id":"nato-ankara-summit-procurement-july-2026-story","eventKey":"nato-ankara-summit-procurement-july-2026","materialFacts":["Tens of billions of euros in new NATO procurements revealed at the Ankara NATO Summit Defence Industry Forum (NSDIF)","A counter-drone push of about $40 billion at the summit","A PAC-3 MSE missile-maintenance facility in Europe signed by the US, Poland, Germany, Netherlands and Sweden","Nine EU states pressing to use a €90bn package for US air-defence missiles for Ukraine"],"section":"Forsvar","headline":"Tens of billions in new procurements revealed at the NATO Summit Defence Industry Forum in Ankara","primarySourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara","subheadline":"Ankara-topmødet omsætter oprustningen til konkrete indkøb — med Danmark blandt de mest fremskudte lande.","body":["På NATO's forsvarsindustri-forum i Ankara blev der afsløret indkøb for titusindvis af milliarder: et tiende A330 MRTT-tankfly, Triton-droner og Saab GlobalEye-varslingsfly. NATO søsatte samtidig »Drone Edge«, en flerårig satsning på både offensive droner og moddrone-systemer.","Fem lande — USA, Polen, Tyskland, Holland og Sverige — aftalte et europæisk vedligeholdelsesanlæg for PAC-3-missiler. Og ni EU-lande, heriblandt Danmark, pressede på for at bruge forsvarspakken på 90 mia. euro til amerikansk luftforsvar til Ukraine."],"whyItMatters":"Danmark meldte allerede i juni at have nået NATO's 5 %-mål ni år før tid, og Mette Frederiksen indgik 7. juli en droneaftale med Ukraine. Ankara viser, hvordan forpligtelserne bliver til en konkret indkøbspipeline.","analysis":"Detaljerne binder europæisk kapacitet sammen og reducerer dobbeltindkøb; for danske forsvarsleverandører er efterspørgslen nu struktureret og langsigtet.","topics":["forsvar","nato","indkøb","teknologisk suverænitet","ukraine","danmark"],"entities":["NATO","Mark Rutte","Danmark","Ukraine","Polen","Tyskland","Holland","Sverige","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":80,"novelty":70,"sourceQuality":88,"personalRelevance":84,"contrast":56},"claims":[{"text":"Tens of billions in new procurements revealed at the NATO Summit Defence Industry Forum in Ankara","sourceUrls":["https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara"],"confidence":"high"},{"text":"Tens of billions of euros in new NATO procurements revealed at the Ankara NATO Summit Defence Industry Forum (NSDIF)","sourceUrls":["https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara"],"confidence":"high"},{"text":"A counter-drone push of about $40 billion at the summit","sourceUrls":["https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara"],"confidence":"high"}],"sources":[{"title":"Tens of billions in new procurements revealed at the NATO Summit Defence Industry Forum in Ankara","publisher":"NATO","url":"https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara","publishedAt":"2026-07-07T12:00:00Z","kind":"primary"},{"title":"Five NATO Members Sign Historic Deal to Build Patriot PAC-3 Missile Facility in Europe","publisher":"UNITED24 Media","url":"https://united24media.com/world/five-nato-members-sign-historic-deal-to-build-patriot-pac-3-missile-facility-in-europe-20541","publishedAt":"2026-07-07T12:00:00Z","kind":"reporting"},{"title":"Nine EU Countries Push to Fund Patriot Missiles for Ukraine Using €90 Billion Defense Package","publisher":"UNITED24 Media","url":"https://united24media.com/war-in-ukraine/nine-eu-countries-push-to-fund-patriot-missiles-for-ukraine-using-eur90-billion-defense-package-20534","publishedAt":"2026-07-07T12:00:00Z","kind":"reporting"},{"title":"Forsvarsminister: Danmark har nået Natos målsætning","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/forsvarsminister-danmark-har-naaet-natos-maalsaetning","publishedAt":"2026-06-22T12:00:00Z","kind":"reporting"},{"title":"Frederiksen efter aftale med Zelenskyj: Ukraine er afgørende for Europas forsvar","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/frederiksen-efter-aftale-med-zelenskyj-ukraine-er-afgoerende-europas-forsvar","publishedAt":"2026-07-07T12:00:00Z","kind":"reporting"}],"image":{"url":"https://www.nato.int/content/dam/nato/webready/news/2020-2029/2026/07/07/summit-nsdif/summit-nsdif-reveal/20260707_summit-nsdif-reveal_0027.jpg","credit":"NATO","alt":"NATO Secretary General Mark Rutte speaking at the NATO Summit Defence Industry Forum in Ankara, 7 July 2026","sourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara"}},{"id":"proxima-fusion-411m-story","eventKey":"proxima-fusion-411m","materialFacts":["Round amount is €411 million","Valuation is €2.4 billion (approx. $2.7 billion)","Largest European private fusion round on record","Google's first European fusion investment"],"section":"Deeptech","headline":"Google backs Proxima Fusion in €411m raise","primarySourceUrl":"https://sifted.eu/articles/google-proxima-fusion-411m-raise","subheadline":"Den tyske fusionsstartup lander Europas største private fusionsrunde — og Googles første europæiske fusionsvæddemål.","body":["Tyske Proxima Fusion har rejst 411 mio. euro — den største private fusionsrunde i Europa til dato. Runden løfter værdien til 2,4 mia. euro og er Googles første investering i europæisk fusionsenergi.","Runden blev ledet af XTX Ventures (Storbritannien) og East X Ventures, med RWE, KfW Capital, det statslige SPRIND — alle tyske — og Google blandt investorerne. Proxima udspringer af Max Planck-instituttet, ligger i München og satser på en stellarator-tilgang."],"whyItMatters":"Fusion er gået fra laboratoriedrøm til kapitalvæddeløb. En runde med både industriel (RWE) og statslig (SPRIND, KfW) medfinansiering viser, at europæisk deeptech kan tiltrække kapital i den skala, kommerciel fusion kræver.","analysis":"Pointen er ikke, at fusion er løst, men at Europa nu har en kontinental kandidat — og Googles indtræden signalerer, at amerikansk kapital ser europæisk fusion som investerbar.","topics":["deeptech","fusionsenergi","venturekapital","teknologisk suverænitet","energi","europa"],"entities":["Proxima Fusion","Google","RWE","KfW Capital","SPRIND","XTX Ventures","Tyskland"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":80,"novelty":84,"sourceQuality":86,"personalRelevance":90,"contrast":66},"claims":[{"text":"Google backs Proxima Fusion in €411m raise","sourceUrls":["https://sifted.eu/articles/google-proxima-fusion-411m-raise"],"confidence":"high"},{"text":"Round amount is €411 million","sourceUrls":["https://www.proximafusion.com/press-news/proxima-fusion-raises-eu411-million-to-build-europes-commercial-fusion-champion"],"confidence":"high"},{"text":"Valuation is €2.4 billion (approx. $2.7 billion)","sourceUrls":["https://www.businesswire.com/news/home/20260707899566/en/Proxima-Fusion-Raises-%E2%82%AC411-Million-at-a-%E2%82%AC2.4B-Valuation-to-Build-Europes-Commercial-Fusion-Champion"],"confidence":"high"}],"sources":[{"title":"Google backs Proxima Fusion in €411m raise","publisher":"Sifted","url":"https://sifted.eu/articles/google-proxima-fusion-411m-raise","publishedAt":"2026-07-07T06:05:00.000Z","kind":"reporting"},{"title":"Proxima Fusion Raises €411 Million at a €2.4B Valuation to Build Europe's Commercial Fusion Champion","publisher":"Business Wire","url":"https://www.businesswire.com/news/home/20260707899566/en/Proxima-Fusion-Raises-%E2%82%AC411-Million-at-a-%E2%82%AC2.4B-Valuation-to-Build-Europes-Commercial-Fusion-Champion","publishedAt":"2026-07-07T06:05:00.000Z","kind":"primary"},{"title":"Proxima Fusion Raises €411 Million to Build Europe's Commercial Fusion Champion","publisher":"Proxima Fusion","url":"https://www.proximafusion.com/press-news/proxima-fusion-raises-eu411-million-to-build-europes-commercial-fusion-champion","publishedAt":"2026-07-07T06:05:00.000Z","kind":"primary"}],"image":{"url":"https://images.sifted.eu/wp-content/uploads/2024/12/16135651/Proxima-CEO-Francesco-Sciortino-e1767356934427.jpg?w=1740&h=1400&q=75&fit=crop&auto=compress,format","credit":"Sifted","alt":"Proxima Fusion co-founder and CEO Francesco Sciortino","sourceUrl":"https://sifted.eu/articles/google-proxima-fusion-411m-raise"},"primaryExcerpt":{"quote":"Europe is racing with the United States and China to get to the first fusion power plant. Proxima's financing demonstrates that Europe can not only invent breakthrough technologies, but also build globally competitive companies around them.","sourceUrl":"https://www.proximafusion.com/press-news/proxima-fusion-raises-eu411-million-to-build-europes-commercial-fusion-champion","sourceTitle":"Proxima Fusion Raises €411 Million to Build Europe's Commercial Fusion Champion"}},{"id":"story-nato-ankara-20260707","eventKey":"nato-ankara-summit-2026","materialFacts":["NATO's 32 stats- og regeringschefer mødes i Ankara 7.-8. juli 2026; generalsekretær Mark Rutte fremhæver tre prioriteter: forsvarsinvesteringer, transatlantisk forsvarsindustri og støtte til Ukraine.","Allierede ventes at fremlægge planer for det nye mål om 5 % af BNP til forsvar og sikkerhed i 2035 (3,5 % kerne + 1,5 % relateret); Europa og Canada er allerede på ca. 4 %.","Ifølge udkastet til slutdokument lover europæiske allierede og Canada Ukraine 70 mia. euro i militær støtte i 2026 — uden amerikansk bidrag."],"section":"NATO","headline":"NATO Secretary General previews the Ankara Summit, highlights progress on defence spending","primarySourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/06/nato-secretary-general-previews-the-ankara-summit-highlights-progress-on-defence-spending","subheadline":"NATO's 32 ledere mødes i Tyrkiet med et mål om 5 % af BNP til forsvar i 2035 — og europæiske allierede plus Canada ventes at love Ukraine 70 mia. euro, uden USA.","body":["NATO's generalsekretær Mark Rutte lagde 6. juli op til topmødet i Ankara den 7.-8. juli med tre prioriteter: forsvarsinvesteringer, transatlantisk forsvarsindustri og støtte til Ukraine. Allierede skal fremlægge planer for det nye mål om 5 % af BNP til forsvar i 2035.","Ifølge udkastet til slutdokument lover europæiske allierede og Canada Ukraine 70 mia. euro i militær støtte i 2026 — uden amerikansk bidrag. Beløbet er ikke alt sammen nye penge; det samler et tidligere tilsagn på ca. 40 mia. euro med ca. 30 mia. euro årligt fra EU's låneprogram."],"whyItMatters":"Topmødet viser, om Europa kan bære mere af egen sikkerhed, mens USA trækker sig. For Danmark er 5 %-sporet bindende for kommende forsvarsbudgetter.","analysis":"»Ironclad«-sproget om artikel 5 skal berolige østflanken, men uenigheden om at binde sig til 2027-støtte — hvor Italien bremser — afslører, at viljen til tilsagn er skrøbeligere end retorikken.","image":{"url":"https://www.nato.int/content/dam/nato/webready/news/2020-2029/2026/07/06/summit-pre-pc-sg/20260706_summit-pre-pc-sg_0007.jpg","credit":"Foto: NATO","alt":"NATO's generalsekretær Mark Rutte ved pressemødet forud for topmødet i Ankara.","sourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/06/nato-secretary-general-previews-the-ankara-summit-highlights-progress-on-defence-spending"},"top s-10b-acquisition","materialFacts":["Vertex will acquire Crinetics for approximately $10 billion (about $10.0 billion total equity value)","The price is $85.00 per share in cash","Crinetics is a San Diego, California-based endocrinology biotech","Vertex is headquartered in Boston, Massachusetts"],"section":"Biotek","headline":"Vertex to acquire Crinetics in $10B foray into endocrine disease drugs","primarySourceUrl":"https://www.biopharmadive.com/news/vertex-crinetics-acquire-deal-palsonify-acromegaly/824545/","subheadline":"Vertex køber Crinetics for cirka 10 mia. dollar og rykker for alvor ind i endokrine sygdomme.","body":["Amerikanske Vertex Pharmaceuticals opkøber biotekselskabet Crinetics for omkring 10 mia. dollar kontant. Handlen giver Vertex et kommercielt fodfæste i endokrinologi — hormonsygdomme — anført af Crinetics' middel mod akromegali, paltusotin (Palsonify).","Vertex, med hovedkvarter i Boston, har bygget sin forretning på cystisk fibrose og søger nye vækstben; San Diego-baserede Crinetics leverer et sent-fase produkt og en pipeline inden for endokrine lidelser."],"whyItMatters":"Opkøbet er en af årets største biotekhandler og et signal om, at kontantstærke lægemiddelvirksomheder igen betaler dyrt for kommercielt nære aktiver frem for tidlig forskning. For life science peger det på fornyet M&A-aktivitet efter en afdæmpet periode.","analysis":"Prisen afspejler, at Vertex køber diversificering væk fra cystisk fibrose, hvor selskabet er dominerende, men eksponeret — en satsning på, at endokrinologi kan blive næste søjle.","topics":["biotek","opkøb","life science","endokrinologi","pharma"],"entities":["Vertex Pharmaceuticals","Crinetics Pharmaceuticals","Palsonify","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":74,"novelty":70,"sourceQuality":86,"personalRelevance":66,"contrast":56},"claims":[{"text":"Vertex to acquire Crinetics in $10B foray into endocrine disease drugs","sourceUrls":["https://www.biopharmadive a siden 2007; udvalgets leder Mohammed al-Farra indgav sin afskedsbegæring.","Magten skal overdrages til et palæstinensisk teknokratudvalg, National Committee for the Administration of Gaza (NCAG), ledet af den Gaza-fødte ingeniør og tidligere PA-embedsmand Ali Shaath.","Hamas fremstiller skridtet som en indrømmelse for at fremme våbenhvileforhandlinger, men opgiver ikke sin politiske eller militære rolle."],"section":"Mellemøsten","headline":"Hamas announces dissolution of Gaza governing body","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/6/hamas-announces-dissolution-of-gaza-governing-body","subheadline":"Hamas opløser sit regeringsudvalg i Gaza og lover at overdrage civilstyret til et teknokratisk udvalg under FN- og USA-opsyn — et forsøg på at holde en skrøbelig våbenhvile i live.","body":["Hamas opløste mandag det Regeringsnødudvalg, der har styret Gaza siden magtovertagelsen i 2007, og udvalgets leder Mohammed al-Farra trådte tilbage. Civilstyret skal overgå til et teknokratisk udvalg, National Committee for the Administration of Gaza, ledet af den Gaza-fødte ingeniør Ali Shaath.","Bevægelsen kaldte det et skridt for at »fjerne påskud for besættelsen« og fremme våbenhvileforhandlinger. Udvalget skal genoprette basale ydelser under opsyn af FN og det USA-støttede Board of Peace, men Hamas opgiver ikke sin politiske eller militære rolle."],"whyItMatters":"Hvem der styrer Gaza efter krigen er selve knasten i våbenhvilen; et troværdigt teknokratisk styre er en forudsætning for genopbygning og arabisk deltagelse.","analysis":"At overdrage papirstyret, men beholde våben og politisk kontrol, er en velkendt manøvre: Hamas køber forhandlingsrum uden reelt at afgive magt.","image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/07/AFP__20260706__B9CZ8LV__v1__HighRes__PalestinianIsraelConflictGaza-1783339004.jpg?resize=1920%2C1440","credit":"Foto: AFP / Al Jazeera","alt":"Palæstinensere i Gaza; Hamas har meddelt, at bevægelsen opløser sit regeringsu       boot();
    }
  }
})();
</script>
</body>
