  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.feed-card-body { padding: 16px 16px 18px; }

ital.","sourceUrls":["https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"],"confidence":"high"}],"sources":[{"title":"PitchBook: US venture funding hits $412.7B in first half as AI deals dominate","publisher":"SiliconANGLE","url":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/","publishedAt":"2026-07-09T04:01:00.000Z","kind":"reporting"}]},{"id":"semiconductor-ai-capex-selloff-20260709","eventKey":"semiconductor-ai-capex-selloff-2026-07","materialFacts":["Et bredt frasalg af halvlederaktier barberede omkring 1.300 mia. dollar af markedsværdien 7.-8. juli 2026","Intel faldt over 20 procent, og Philadelphia-halvlederindekset (SOX) tabte cirka 10,8 procent","Udløseren var Samsungs foreløbige Q2-regnskab: driftsoverskud på ca. 58 mia. dollar, der slog overskudsforventningen, men med skuffende omsætning målt på de høje AI-forventninger","Hyperscalernes AI-kapitaludgifter er ifølge Forbes vokset 67 procent til omkring 650 mia. dollar"],"section":"Marked","headline":"Semiconductor Selloff Deepens As AI Spending Fears Hit Intel","primarySourceUrl":"https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/","subheadline":"Et frasalg på 1.300 mia. dollar rammer chipaktierne, da markedet for første gang for alvor tvivler på AI-investeringernes holdbarhed.","body":["Et bredt frasalg af halvlederaktier uddybede sig 7.-8. juli og barberede omkring 1.300 milliarder dollar af markedsværdien. Philadelphia-halvlederindekset (SOX) faldt cirka 10,8 procent, og Intel (USA) mistede over 20 procent på få dage.","Udløseren kom fra Sydkorea: Samsungs foreløbige Q2-regnskab viste et driftsoverskud på cirka 58 milliarder dollar — næsten en tyvedobling år-til-år — men omsætningen skuffede målt på de skyhøje AI-forventninger, og aktien faldt omkring 7 procent. Micron, AMD og Taiwans TSMC trak med ned."],"whyItMatters":"For en investeringsanalytiker er det første gang længe, at markedet for alvor tvivler på selve AI-investeringscyklussen. Hyperscalernes kapitaludgifter er ifølge Forbes vokset 67 procent til omkring 650 milliarder dollar, og frygten for overkapacitet rammer nu de aktier, optimismen hviler på.","analysis":"Nuancen er vigtig: Samsungs tal var et overskud, der slog forventningerne — det var omsætningen, ikke bunden, der skuffede. Markedet reagerer altså ikke på svag efterspørgsel, men på tvivl om, hvorvidt de enorme kapitaludgifter nogensinde tjenes hjem.","topics":["halvledere","marked","ai-capex","valuations","usa"],"entities":["Intel","Samsung Electronics","TSMC","Micron","AMD","SOX","USA","Sydkorea","Taiwan"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":82,"novelty":74,"sourceQuality":80,"personalRelevance":84,"contrast":60},"claims":[{"text":"Semiconductor Selloff Deepens As AI Spending Fears Hit Intel","sourceUrls":["https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/"],"confidence":"high"},{"text":"Frasalget barberede omkring 1.300 mia. dollar af halvledernes markedsværdi, og Intel faldt over 20 procent","sourceUrls":["https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/"],"confidence":"medium"}],"sources":[{"title":"Semiconductor Selloff Deepens As AI Spending Fears Hit Intel","publisher":"Forbes","url":"https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/","publishedAt":"2026-07-08T12:36:00.000Z","kind":"reporting"},{"title":"Chip stocks sell off after Samsung earnings fall short of high AI bar","publisher":"CNBC","url":"https://www.cnbc.com/2026/07/07/chip-stocks-ai-selloff-samsung.html","publishedAt":"2026-07-07T12:00:00.000Z","kind":"reporting"}],"image":{"url":"https://imageio.forbes.com/specials-images/imageserve/6a4e2f8f893918fde7214681/0x0.jpg?format=jpg&height=900&width=1600&fit=bounds","credit":"Kilde: Forbes","alt":"Illustration af halvlederchips og aktiemarkedet under juli-frasalget","sourceUrl":"https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/"}},{"id":"nato-ankara-greenland-denmark-20260708","eventKey":"nato-ankara-greenland-2026","materialFacts":["På NATO-topmødet i Ankara 7.-8. juli sagde statsminister Mette Frederiksen, at Danmark er parat til at forsvare hver centimeter af NATO, inklusive eget territorium","Frederiksen fastslog, at Grønland ikke er til salg","Donald Trump gentog på topmødet kravet om, at USA — ikke Danmark — bør kontrollere Grønland, og hævdede, at striden har skadet hans forhold til NATO","DIIS-forsker Mikkel Runge Olesen vurderer, at retorikken forblev aggressiv, men uden eksplicit militær trussel"],"section":"Geopolitik","headline":"Mette Frederiksen: Danmark er parat til at forsvare Grønland","primarySourceUrl":"https://www.dr.dk/nyheder/indland/mette-frederiksen-danmark-er-parat-til-forsvare-groenland","subheadline":"På NATO-topmødet i Ankara afviste statsministeren Trumps fornyede krav om amerikansk kontrol med Grønland.","body":["På NATO-topmødet i Ankara 7.-8. juli slog statsminister Mette Frederiksen (Danmark) fast, at Danmark er »parat til at forsvare hver eneste centimeter af NATO, inklusive vores eget territorium«, og at Grønland ikke er til salg. Udmeldingen kom, efter at Donald Trump igen krævede amerikansk kontrol med øen.","Trump hævdede, at striden om Grønland har »skadet mit forhold til NATO«. DIIS-forsker Mikkel Runge Olesen vurderer, at retorikken forblev aggressiv, men uden eksplicit militær trussel."],"whyItMatters":"Grønland er nu et fast omdrejningspunkt mellem Danmark og USA, og sagen tvinger Danmark til at omsætte suverænitetsretorik til konkret militær tilstedeværelse i Arktis.","analysis":"At uenigheden udspiller sig på et NATO-topmøde er bemærkelsesværdigt: alliancens største magt lægger åbent pres på et mindre medlem om territorium. For Danmark er balancen at holde alliancen og samtidig markere en grænse.","topics":["grønland","forsvar","nato","rigsfællesskab","arktis"],"entities":["Mette Frederiksen","Donald Trump","NATO","Grønland","Danmark","USA","DIIS"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":64,"novelty":66,"sourceQuality":85,"personalRelevance":80,"contrast":58},"claims":[{"text":"Mette Frederiksen: Danmark er parat til at forsvare Grønland","sourceUrls":["https://www.dr.dk/nyheder/indland/mette-frederiksen-danmark-er-parat-til-forsvare-groenland"],"confidence":"high"}],"sources":[{"title":"Mette Frederiksen: Danmark er parat til at forsvare Grønland","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/mette-frederiksen-danmark-er-parat-til-forsvare-groenland","publishedAt":"2026-07-08T05:42:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/dzxdlwpi/20260708-075304-4-1920x1371web_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Statsminister Mette Frederiksen ved NATO-topmødet i Ankara","sourceUrl":"https://www.dr.dk/nyheder/indland/mette-frederiksen-danmark-er-parat-til-forsvare-groenland"}},{"id":"deepseek-in-house-ai-chip-july-2026-story","eventKey":"deepseek-in-house-ai-chip-july-2026","materialFacts":["The chip DeepSeek is developing is designed for inference (running trained models) rather than for training new models.","DeepSeek is Hangzhou-based.","The in-house chip could reduce DeepSeek's reliance on Nvidia and Huawei chips.","The effort remains at an early stage, with DeepSeek reaching out to external partners (chip-design, foundry and memory firms)."],"section":"Teknologi","headline":"Exclusive-China's DeepSeek developing its own AI chip, sources say","primarySourceUrl":"https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/","subheadline":"Reuters: Kinas DeepSeek udvikler sin egen inferens-chip for at mindske afhængigheden af Nvidia og Huawei.","body":["Kinesiske DeepSeek udvikler sin egen AI-chip, skriver Reuters. Chippen er designet til inferens — at køre færdigtrænede modeller — ikke til træning, og målet er at mindske afhængigheden af Nvidia og Huawei.","Arbejdet er tidligt: DeepSeek er i dialog med chipdesign-, støberi- og hukommelsesfirmaer og har ansat flere chipdesignere. Det sker, samtidig med at Hangzhou-selskabet efter planen rejser sin første eksterne kapital på cirka 7 mia. dollar til en værdi på 52-59 mia. dollar."],"whyItMatters":"For DeepSeek er egen silicium et forsøg på at slippe fri af amerikanske eksportrestriktioner og Nvidias priser — samme vertikale integration nu på den kinesiske side.","analysis":"En inferens-chip er lettere at bygge end en trænings-chip, så ambitionen er realistisk, men usikker: kinesisk produktion er stadig bundet af SMIC's kapacitet. Lykkes det, bliver Kina mindre sårbar over for at få lukket for Nvidia.","topics":["ai","halvledere","teknologisk suverænitet","kina","nvidia"],"entities":["DeepSeek","Nvidia","Huawei","Reuters","SMIC","Kina"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":82,"novelty":86,"sourceQuality":82,"personalRelevance":92,"contrast":74},"claims":[{"text":"Exclusive-China's DeepSeek developing its own AI chip, sources say","sourceUrls":["https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"],"confidence":"high"},{"text":"The chip DeepSeek is developing is designed for inference (running trained models) rather than for training new models.","sourceUrls":["https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"],"confidence":"high"},{"text":"DeepSeek is Hangzhou-based.","sourceUrls":["https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"],"confidence":"high"}],"sources":[{"title":"Exclusive-China's DeepSeek developing its own AI chip, sources say","publisher":"Reuters (via KELO-AM)","url":"https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/","publishedAt":"2026-07-07T10:34:00.000Z","kind":"reporting"},{"title":"DeepSeek's AI chip plans","publisher":"Semafor","url":"https://www.semafor.com/article/07/07/2026/deepseeks-ai-chip-plans","publishedAt":"2026-07-07T23:38:00.000Z","kind":"analysis"},{"title":"Chinese AI Startup DeepSeek Developing Own AI Chip, Reuters Says","publisher":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-07-07/chinese-ai-startup-deepseek-developing-own-ai-chip-reuters-says","publishedAt":"2026-07-07T00:00:00.000Z","kind":"reporting"}],"image":{"url":"https://storage.googleapis.com/media.mwcradio.com/mimesis/2026-07/07/2026-07-07T103437Z_2_LYNXMPEM660IJ_RTROPTP_3_DEEPSEEK-CHINA.JPG","credit":"Reuters","alt":"The DeepSeek logo, representing the Hangzhou-based Chinese AI startup now developing its own inference chip.","sourceUrl":"https://kelo.com/2026/07/07/exclusive-chinas-deepseek-developing-its-own-ai-chip-sources-say/"}},{"id":"marine-le-pen-2027-candidacy-appeal-conviction-july-2026-story","eventKey":"marine-le-pen-2027-candidacy-appeal-conviction-july-2026","materialFacts":["Marine Le Pen declared on 2026-07-07 (Tuesday), via French TV channel TF1, that she will run in the 2027 French presidential election.","On 2026-07-07 a French appeals court (Paris) ruled on her embezzlement case (misuse of EU funds to pay National Rally assistants); the guilty conviction was upheld/confirmed on appeal, not overturned.","The appeals court structured the ineligibility (éligibilité) ban as 45 months with 30 months suspended; because roughly 15 months were already effectively counted, the ban does not bar her from the 2027 race, so she remains legally eligible to run.","She also received a three-year prison sentence (two years suspended, one year to be served under home detention with an electronic ankle monitor) and a 100,000-euro fine."],"section":"Verden","headline":"Marine Le Pen stiller op til næste præsidentvalg","primarySourceUrl":"https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg","subheadline":"En appeldomstol stadfæster Le Pens dom for misbrug af EU-midler — men lader hende alligevel stille op i 2027.","body":["Marine Le Pen meddelte 7. juli på TV1, at hun stiller op til det franske præsidentvalg i 2027. Samme dag stadfæstede en appeldomstol i Paris hendes dom for misbrug af EU-midler til aflønning af partiassistenter.","Domstolen strukturerede dog uvalgbarheden (45 måneder, heraf 30 betingede), så den ikke spærrer hende fra valget. Hun fik tre års fængsel — to betingede, ét med fodlænke — og en bøde på 100.000 euro, men appellerer nu til kassationsdomstolen, hvilket suspenderer straffen."],"whyItMatters":"Sagen er en prøve på balancen mellem retsstat og folkestyre: en domstol fastholder dommen mod en topkandidat, men afmåler sanktionen, så vælgerne alligevel får hende på stemmesedlen.","analysis":"Konstruktionen — dom stadfæstet, men uvalgbarhed gjort virkningsløs — vil blive læst som en tilbageholdenhed med at lade domstolene afgøre et valg. Den endelige afklaring ligger nu hos kassationsdomstolen.","topics":["politik","frankrig","retsstat","valg","europa"],"entities":["Marine Le Pen","Rassemblement National","Frankrig","EU","Kassationsdomstolen"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":84,"decisionValue":70,"novelty":74,"sourceQuality":86,"personalRelevance":46,"contrast":80},"claims":[{"text":"Marine Le Pen stiller op til næste præsidentvalg","sourceUrls":["https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg"],"confidence":"high"},{"text":"Marine Le Pen declared on 2026-07-07 (Tuesday), via French TV channel TF1, that she will run in the 2027 French presidential election.","sourceUrls":["https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg"],"confidence":"high"},{"text":"On 2026-07-07 a French appeals court (Paris) ruled on her embezzlement case (misuse of EU funds to pay National Rally assistants); the guilty conviction was upheld/confirmed on appeal, not overturned.","sourceUrls":["https://www.cnn.com/2026/07/07/europe/marine-le-pen-france-court-ruling-intl"],"confidence":"high"}],"sources":[{"title":"Marine Le Pen stiller op til næste præsidentvalg","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg","publishedAt":"2026-07-07T19:14:15.000Z","kind":"reporting"},{"title":"Marine Le Pen to run for French presidency despite losing court appeal | CNN","publisher":"CNN","url":"https://www.cnn.com/2026/07/07/europe/marine-le-pen-france-court-ruling-intl","publishedAt":"2026-07-07T12:08:50.000Z","kind":"reporting"},{"title":"France's Court of Appeal to rule on Le Pen conviction – what it's all about","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/7/frances-court-of-appeal-to-rule-on-le-pen-conviction-what-its-all-about","publishedAt":"2026-07-07T12:00:00Z","kind":"analysis"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/0nbnwuwa/20260707-203816-5.jpg","credit":"DR","alt":"Marine Le Pen, leader of France's National Rally, who announced a 2027 presidential bid after a Paris appeals court ruling on her embezzlement conviction","sourceUrl":"https://www.dr.dk/nyheder/udland/marine-le-pen-stiller-op-til-naeste-praesidentvalg"}},{"id":"nato-ankara-summit-procurement-july-2026-story","eventKey":"nato-ankara-summit-procurement-july-2026","materialFacts":["Tens of billions of euros in new NATO procurements revealed at the Ankara NATO Summit Defence Industry Forum (NSDIF)","A counter-drone push of about $40 billion at the summit","A PAC-3 MSE missile-maintenance facility in Europe signed by the US, Poland, Germany, Netherlands and Sweden","Nine EU states pressing to use a €90bn package for US air-defence missiles for Ukraine"],"section":"Forsvar","headline":"Tens of billions in new procurements revealed at the NATO Summit Defence Industry Forum in Ankara","primarySourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara","subheadline":"Ankara-topmødet omsætter oprustningen til konkrete indkøb — med Danmark blandt de mest fremskudte lande.","body":["På NATO's forsvarsindustri-forum i Ankara blev der afsløret indkøb for titusindvis af milliarder: et tiende A330 MRTT-tankfly, Triton-droner og Saab GlobalEye-varslingsfly. NATO søsatte samtidig »Drone Edge«, en flerårig satsning på både offensive droner og moddrone-systemer.","Fem lande — USA, Polen, Tyskland, Holland og Sverige — aftalte et europæisk vedligeholdelsesanlæg for PAC-3-missiler. Og ni EU-lande, heriblandt Danmark, pressede på for at bruge forsvarspakken på 90 mia. euro til amerikansk luftforsvar til Ukraine."],"whyItMatters":"Danmark meldte allerede i juni at have nået NATO's 5 %-mål ni år før tid, og Mette Frederiksen indgik 7. juli en droneaftale med Ukraine. Ankara viser, hvordan forpligtelserne bliver til en konkret indkøbspipeline.","analysis":"Detaljerne binder europæisk kapacitet sammen og reducerer dobbeltindkøb; for danske forsvarsleverandører er efterspørgslen nu struktureret og langsigtet.","topics":["forsvar","nato","indkøb","teknologisk suverænitet","ukraine","danmark"],"entities":["NATO","Mark Rutte","Danmark","Ukraine","Polen","Tyskland","Holland","Sverige","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":80,"novelty":70,"sourceQuality":88,"personalRelevance":84,"contrast":56},"claims":[{"text":"Tens of billions in new procurements revealed at the NATO Summit Defence Industry Forum in Ankara","sourceUrls":["https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-reve nde for Europas forsvar","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/frederiksen-efter-aftale-med-zelenskyj-ukraine-er-afgoerende-europas-forsvar","publishedAt":"2026-07-07T12:00:00Z","kind":"reporting"}],"image":{"url":"https://www.nato.int/content/dam/nato/webready/news/2020-2029/2026/07/07/summit-nsdif/summit-nsdif-reveal/20260707_summit-nsdif-reveal_0027.jpg","credit":"NATO","alt":"NATO Secretary General Mark Rutte speaking at the NATO Summit Defence Industry Forum in Ankara, 7 July 2026","sourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/07/tens-of-billions-in-new-procurements-revealed-at-the-nato-summit-defence-industry-forum-in-ankara"}},{"id":"openai-gpt56-broad-release-20260709","eventKey":"openai-gpt56-release-2026-07-09","materialFacts":["OpenAI (USA) åbner 9. juli for bred adgang til GPT-5.6-modellerne Sol, Terra og Luna efter en lukket forhåndsvisning fra 26. juni","Sol er flagskibet til ræsonnement og agent-opgaver; Terra rammer GPT-5.5-niveau til ca. halv pris; Luna er hurtigst og billigst","Den brede lancering fulgte et gennemsyn i det amerikanske handelsministerium og udvidet sikkerhedstest","Sol sætter ifølge OpenAI ny rekord på Terminal-Bench 2.1 og løser ExploitBench med omtrent en tredjedel af konkurrenternes output-tokens"],"section":"AI","headline":"Previewing GPT-5.6 Sol: a next-generation model","primarySourceUrl":"https://openai.com/index/previewing-gpt-5-6-sol/","subheadline":"OpenAI ruller i dag sin GPT-5.6-familie — Sol, Terra og Luna — bredt ud efter et amerikansk sikkerhedstjek.","body":["OpenAI (USA) åbner i dag, 9. juli, for bred adgang til GPT-5.6-modellerne Sol, Terra og Luna efter en lukket forhåndsvisning siden 26. juni. Sol er flagskibet til ræsonnement og agent-opgaver, Terra rammer GPT-5.5-niveau til cirka halv pris, og Luna er hurtigst og billigst.","Den brede lancering fulgte et gennemsyn i det amerikanske handelsministerium og en udvidet sikkerhedstest. Ifølge OpenAI sætter Sol ny rekord fusion-raises-eu411-million-to-build-europes-commercial-fusion-champion","sourceTitle":"Proxima Fusion Raises €411 Million to Build Europe's Commercial Fusion Champion"}},{"id":"eu-advanced-ai-cybersecurity-plan-20260707","eventKey":"eu-advanced-ai-cybersecurity-plan-2026","materialFacts":["Europa-Kommissionen fremlagde 7. juli 2026 en plan for avancerede AI-modellers risici og muligheder for cybersikkerhed i hele EU","Kommissionen vil opbygge en europæisk vurderingskapacitet, så modeller kan efterprøves af tredjepart under AI-forordningen","Sammen med ENISA udarbejdes et europæisk blueprint for »struktureret adgang« til stærke AI-modeller; ENISA og JRC bygger en sikker testplatform","Planen bygger på AI-forordningen, Cyber Resilience Act, NIS2 og Cyber Solidarity Act"],"section":"Teknologi","headline":"New EU plan to address the risks and opportunities of advanced AI for cybersecurity","primarySourceUrl":"https://commission.europa.eu/news-and-media/news/new-eu-plan-address-risks-and-opportunities-advanced-ai-cybersecurity-2026-07-07_en","subheadline":"Kommissionen vil teste avancerede AI-modeller for cyberrisici og opbygge europæisk vurderingskapacitet.","body":["Europa-Kommissionen fremlagde 7. juli en plan for både at udnytte og inddæmme avancerede AI-modellers betydning for cybersikkerhed i EU. De samme modeller, der kan beskytte kritisk infrastruktur, kan også misbruges til at automatisere og opskalere cyberangreb.","Kommissionen vil opbygge en europæisk vurderingskapacitet, så avancerede modeller kan efterprøves af tredjepart under AI-forordningen. Sammen med agenturet ENISA laves et blueprint for »struktureret adgang« til de stærkeste modeller."],"whyItMatters":"Planen binder tre af EIFO’s kerneområder sammen: AI, cybersikkerhed og teknologisk suverænitet. »Struktureret adgang« er reelt et forsøg på at give europæiske myndigheder indsigt i modeller, der i dag kontrolleres i USA og Kina.","analysis":"Det er en rammeplan, ikke lovgivning. Værdien afhænger af, om EU kan opbygge egen evaluerings- og compute-kapacitet gennem AI Factories og de planlagte Gigafactories.","topics":["ai","cybersikkerhed","regulering","teknologisk suverænitet","eu"],"entities":["Europa-Kommissionen","ENISA","JRC","AI-forordningen","EU"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":81,"decisionValue":76,"novelty":70,"sourceQuality":92,"personalRelevance":85,"contrast":50},"claims":[{"text":"New EU plan to address the risks and opportunities of advanced AI for cybersecurity","sourceUrls":["https://commission.europa.eu/news-and-media/news/new-eu-plan-address-risks-and-opportunities-advanced-ai-cybersecurity-2026-07-07_en"],"confidence":"high"}],"sources":[{"title":"New EU plan to address the risks and opportunities of advanced AI for cybersecurity","publisher":"European Commission","url":"https://commission.europa.eu/news-and-media/news/new-eu-plan-address-risks-and-opportunities-advanced-ai-cybersecurity-2026-07-07_en","publishedAt":"2026-07-07T12:00:00.000Z","kind":"primary"}],"image":{"url":"https://commission.europa.eu/sites/default/files/styles/ewcms_metatag_image/public/2026-07/GettyImages-1350230158_news%201.jpg?h=c3635fa2&itok=Srw4Nhw_","credit":"Kilde: Europa-Kommissionen","alt":"Illustration af cybersikkerhed og kunstig intelligens","sourceUrl":"https://commission.europa.eu/news-and-media/news/new-eu-plan-address-risks-and-opportunities-advanced-ai-cybersecurity-2026-07-07_en"}},{"id":"fomc-june-2026-minutes-rate-split-20260710","eventKey":"fomc-june-2026-minutes-rate-split","materialFacts":["Referatet fra Federal Reserves møde 16.-17. juni, offentliggjort 8. juli, viser en centralbank dybt splittet om renteretningen","Renten blev fastholdt enstemmigt i intervallet 3,5-3,75 procent, hvor den har ligget hele 2026","'Mange deltagere' ser årets renteniveau i eller lige under intervallet, mens 'mange andre' ser det højere; enkelte så et argument for en forhøjelse nu"],"section":"Makroøkonomi","headline":"Minutes of the Federal Open Market Committee, June 16-17, 2026","primarySourceUrl":"https://www.federalreserve.gov/monetarypolicy/fomcminutes20260617.htm","subheadline":"Renten blev holdt i ro med enstemmighed, men referatet afslører en usædvanligt splittet komité om, hvad der bør ske resten af året.","body":["Referatet fra den amerikanske centralbanks rentemøde 16.-17. juni, offentliggjort 8. juli, viser en Federal Reserve, der er dybt splittet om retningen. Renten blev fastholdt enstemmigt i intervallet 3,5-3,75 procent, hvor den har ligget hele 2026, men enigheden stopper der.","'Mange deltagere' ser årets renteniveau i eller lige under intervallet, mens 'mange andre' mener, det bør ligge højere. Enkelte så et argument for en forhøjelse nu, men bakkede op om at holde renten i ro. Inflationen ventes at aftage i andet halvår, mens kerneinflationen næppe ændrer sig."],"whyItMatters":"Det er ikke niveauet, men spredningen, der betyder noget: en komité, hvor lige mange trækker hver vej, giver ringe forudsigelighed — netop når AI-drevne aktievurderinger er rentefølsomme.","analysis":"Splittelsen giver nye inflationstal uforholdsmæssig vægt: en enkelt skuffende måling kan tippe balancen mod den fløj, der vil hæve.","primaryExcerpt":{"quote":"Many participants indicated that the appropriate level of the federal funds rate would be within or slightly below the current target range at the end of this year","sourceUrl":"https://www.federalreserve.gov/monetarypolicy/fomcminutes20260617.htm","sourceTitle":"Minutes of the Federal Open Market Committee, June 16-17, 2026"},"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Marriner_S._Eccles_Federal_Reserve_Board_Building.jpg/1280px-Marriner_S._Eccles_Federal_Reserve_Board_Building.jpg","credit":"Foto: Wikimedia Commons","alt":"Federal Reserves hovedsæde, Marriner S. Eccles-bygningen i Washington","sourceUrl":"https://www.federalreserve.gov/monetarypolicy/fomcminutes20260617.htm"},"topics":["makroøkonomi","renter","centralbank","inflation","usa"],"entities":["Federal Reserve","FOMC","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":84,"novelty":66,"sourceQuality":92,"personalRelevance":74,"contrast":58},"claims":[{"text":"FOMC fastholdt enstemmigt renten på 3,5-3,75 procent, men var splittet: mange deltagere så årets niveau i/under intervallet, mange andre over.","sourceUrls":["https://www.federalreserve.gov/monetarypolicy/fomcminutes20260617.htm"],"confidence":"high"}],"sources":[{"title":"Minutes of the Federal Open Market Committee, June 16-17, 2026","publisher":"Federal Reserve","url":"https://www.federalreserve.gov/monetarypolicy/fomcminutes20260617.htm","publishedAt":"2026-07-08T18:00:00.000Z","kind":"primary"}]},{"id":"story-nato-ankara-20260707","eventKey":"nato-ankara-summit-2026","materialFacts":["NATO's 32 stats- og regeringschefer mødes i Ankara 7.-8. juli 2026; generalsekretær Mark Rutte fremhæver tre prioriteter: forsvarsinvesteringer, transatlantisk forsvarsindustri og støtte til Ukraine.","Allierede ventes at fremlægge planer for det nye mål om 5 % af BNP til forsvar og sikkerhed i 2035 (3,5 % kerne + 1,5 % relateret); Europa og Canada er allerede på ca. 4 %.","Ifølge udkastet til slutdokument lover europæiske allierede og Canada Ukraine 70 mia. euro i militær støtte i 2026 — uden amerikansk bidrag."],"section":"NATO","headline":"NATO Secretary General previews the Ankara Summit, highlights progress on defence spending","primarySourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/06/nato-secretary-general-previews-the-ankara-summit-highlights-progress-on-defence-spending","subheadline":"NATO's 32 ledere mødes i Tyrkiet med et mål om 5 % af BNP til forsvar i 2035 — og europæiske allierede plus Canada ventes at love Ukraine 70 mia. euro, uden USA.","body":["NATO's generalsekretær Mark Rutte lagde 6. juli op til topmødet i Ankara den 7.-8. juli med tre prioriteter: forsvarsinvesteringer, transatlantisk forsvarsindustri og støtte til Ukraine. Allierede skal fremlægge planer for det nye mål om 5 % af BNP til forsvar i 2035.","Ifølge udkastet til slutdokument lover europæiske allierede og Canada Ukraine 70 mia. euro i militær støtte i 2026 — uden amerikansk bidrag. Beløbet er ikke alt sammen nye penge; det samler et tidligere tilsagn på ca. 40 mia. euro med ca. 30 mia. euro årligt fra EU's låneprogram."],"whyItMatters":"Topmødet viser, om Europa kan bære mere af egen sikkerhed, mens USA trækker sig. For Danmark er 5 %-sporet bindende for kommende forsvarsbudgetter.","analysis":"»Ironclad«-sproget om artikel 5 skal berolige østflanken, men uenigheden om at binde sig til 2027-støtte — hvor Italien bremser — afslører, at viljen til tilsagn er skrøbeligere end retorikken.","image":{"url":"https://www.nato.int/content/dam/nato/webready/news/2020-2029/2026/07/06/summit-pre-pc-sg/20260706_summit-pre-pc-sg_0007.jpg","credit":"Foto: NATO","alt":"NATO's generalsekretær Mark Rutte ved pressemødet forud for topmødet i Ankara.","sourceUrl":"https://www.nato.int/en/news-and-events/articles/news/2026/07/06/nato-secretary-general-previews-the-ankara-summit-highlights-progress-on-defence-spending"},"topics":["nato","forsvarsudgifter","ukraine","geopolitik","europa"],"entities":["NATO","Mark Rutte","Ankara","Tyrkiet","Ukraine","Canada","EU"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":68,"novelty":60,"sourceQuality":84,"personalRelevance":62,"contrast":48},"claims":[{"text":"NATO-allierede sigter mod et mål om 5 % af BNP til forsvar og sikkerhed i 2035, og Europa og Canada er allerede på ca. 4 %.","sourceUrls":["https://www.nato.int/en/news-and-events/articles/news/2026/07/06/nato-secretary-general-previews-the-ankara-summit-highlights-progress-on-defence-spending"],"confidence":"high"},{"text":"Europæiske allierede og Canada ventes at love Ukraine 70 mia. euro i militær støtte i 2026 uden amerikansk bidrag.","sourceUrls":["https://www.kyivpost.com/post/79692"
