  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

le":"Europe sees more than 1,300 excess deaths amid brutal heatwave, WHO says","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave","publishedAt":"2026-06-28T07:32:00Z","kind":"reporting"},{"title":"Fossil fuel emissions have rapidly worsened European heatwaves in just a few decades","publisher":"World Weather Attribution","url":"https://www.worldweatherattribution.org/fossil-fuel-emissions-have-rapidly-worsened-european-heatwaves-in-just-a-few-decades/","publishedAt":"2026-06-26T06:00:00Z","kind":"analysis"}]},{"id":"story-gpt56-sol-20260627","eventKey":"openai-gpt56-sol-preview-2026","materialFacts":["OpenAI offentliggjorde 26. juni en preview af GPT-5.6 i tre modeller: Sol, Terra og Luna","Sol topper coding, biologi og cybersikkerhed og lanceres som begrænset preview til betroede partnere delt med myndighederne","Adgangen styres med konto-review og misbrugsklassifikatorer på grund af dual-use-risiko"],"section":"Teknologi","headline":"OpenAI launches GPT-5.6 Sol preview for select partners","primarySourceUrl":"https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/","subheadline":"En ny frontier-familie på tre modeller kommer først ud bag en kontrolleret adgangsmur","body":["OpenAI offentliggjorde 26. juni en preview af GPT-5.6 – ikke én model, men tre: flagskibet Sol, det billigere Terra og den hurtige Luna. Sol er bygget til coding, biologi og cybersikkerhed og introducerer en 'max reasoning effort' og en 'ultra mode' med underagenter.","Lanceringen sker som en begrænset preview til betroede partnere, hvis deltagelse OpenAI har delt med myndighederne, før bredere adgang i ChatGPT og API om få uger. På grund af dual-use-risiko styres adgangen med konto-review, misbrugsklassifikatorer og differentierede niveauer – og kan give blokerede eller forsinkede svar i følsomme cyber-sammenhænge."],"whyItMatters":"GPT-5.6 viser to ting på én gang: kapaciteten rykker fortsat hurtigt i coding, biologi og cyber, mens adgangen reguleres som en kontrolleret ressource – samme trusted-access-logik, der ramte Anthropics modeller i juni.","analysis":"Den graduerede pris fra Luna til Sol er lige så vigtig som topmodellen: konkurrencen handler nu om pris per opgave, ikke kun ren ydeevne. For EIFO og Europa understreger det afhængigheden af få amerikanske udbydere, der sætter både kapabilitets- og adgangsvilkår.","counterpoint":"De fremhævede benchmark- og ydelsestal er OpenAIs egne og endnu ikke uafhængigt efterprøvet.","topics":["AI","teknologisk suverænitet","cybersikkerhed","regulering"],"entities":["OpenAI","GPT-5.6 Sol","ChatGPT"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":82,"novelty":84,"sourceQuality":80,"personalRelevance":92,"contrast":60},"claims":[{"text":"OpenAI offentliggjorde 26. juni 2026 en preview af GPT-5.6 i tre modeller (Sol, Terra, Luna), med Sol stærkest i coding, biologi og cybersikkerhed","sourceUrls":["https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/","https://deploymentsafety.openai.com/gpt-5-6-preview"],"confidence":"high"},{"text":"Udrulningen starter som begrænset preview til betroede partnere delt med myndighederne, med konto-review og misbrugsklassifikatorer på grund af dual-use-risiko","sourceUrls":["https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/"],"confidence":"medium"}],"sources":[{"title":"OpenAI launches GPT-5.6 Sol preview for select partners","publisher":"TestingCatalog","url":"https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/","publishedAt":"2026-06-26T15:00:00Z","kind":"reporting"},{"title":"GPT-5.6 Preview System Card","publisher":"OpenAI","url":"https://deploymentsafety.openai.com/gpt-5-6-preview","publishedAt":"2026-06-26T14:00:00Z","kind":"primary"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/OpenAI_Logo.svg/500px-OpenAI_Logo.svg.png","credit":"Foto: Wikimedia Commons","alt":"OpenAI-logo – illustration til lanceringen af GPT-5.6","sourceUrl":"https://www.testingcatalog.com/openai-launches-gpt-5-6-sol-preview-for-select-partners/"}},{"id":"story-dk-heat-record-20260628","eventKey":"dk-all-time-heat-record-37c-2026","materialFacts":["DMI målte 37,0 grader lørdag 28. juni i Beldringe nord for Odense og i Odum nord for Aarhus","Rekorden slår den hidtidige danmarksrekord på 36,4 grader fra august 1975","Ifølge AFP var knap 200 millioner europæere udsat for over 35 grader samme dag"],"section":"Klima","headline":"Denmark records hottest day on record at 37C: weather service","primarySourceUrl":"https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service","subheadline":"Danmark satte lørdag sin højeste temperatur nogensinde midt i en europæisk hedebølge","body":["Danmark satte lørdag den højeste temperatur, der er målt, siden de landsdækkende målinger begyndte i 1874. DMI registrerede 37,0 grader to steder – i Beldringe nord for Odense og i Odum nord for Aarhus. Den tidligere rekord var 36,4 grader fra august 1975. Meteorolog Rasmus Stoltze Hansen oplyste, at en første måling på 36,6 grader omkring middag kun holdt cirka en time, før rekorden faldt.","Rekorden er del af en bred europæisk hedebølge. Ifølge AFP var knap 200 millioner europæere udsat for over 35 grader samme dag, og der blev sat varmerekorder i blandt andet Schweiz, Tjekkiet og Storbritannien."],"whyItMatters":"37 grader er ikke bare en kuriositet. Danske byer, transport og sundhedsvæsen er bygget til et køligere klima, og varmen gav i denne uge problemer for metro, letbane og vandforsyning.","analysis":"En enkelt rekorddag beviser ikke klimaforandringer, men 1975-rekorden stod i 51 år, og juni 2026 har nu leveret både den varmeste juninat og den varmeste dag. TV 2's Peter Tanev vurderer, at 40 grader herhjemme kun er et spørgsmål om tid.","counterpoint":"DMI venter et mere normalt sommervejr de kommende dage; det er hyppigheden af ekstremer, ikke den enkelte dag, der tæller.","image":{"url":"https://apiwp.thelocal.com/wp-content/uploads/2026/06/javier-rincon-ItScuDBcZyc-unsplash-1.jpg","credit":"Foto: Unsplash/The Local","alt":"Sol og sommervarme over et dansk landskab","sourceUrl":"https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"},"topics":["klima","vejr","Danmark","hedebølge"],"entities":["DMI","Beldringe","Odum","Rasmus Stoltze Hansen","Danmark"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":60,"novelty":70,"sourceQuality":78,"personalRelevance":55,"contrast":60},"claims":[{"text":"DMI målte 37,0 grader i Beldringe og Odum 28. juni 2026 – Danmarks højeste temperatur nogensinde.","sourceUrls":["https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"],"confidence":"high"},{"text":"Den tidligere danmarksrekord var 36,4 grader fra august 1975.","sourceUrls":["https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"],"confidence":"high"},{"text":"Knap 200 millioner europæere var udsat for over 35 grader samme dag ifølge AFP.","sourceUrls":["https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"],"confidence":"medium"}],"sources":[{"title":"Denmark records hottest day on record at 37C: weather service","publisher":"The Local Denmark","url":"https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service","publishedAt":"2026-06-28T05:30:00Z","kind":"reporting"}]},{"id":"story-heatwave-france-20260624","eventKey":"europe-heatwave-france-record-2026-06-23","materialFacts":["Frankrigs nationale varmeindikator nåede 29,8 grader, den højeste siden 1947","43 grader blev målt i Les Herbiers, og 54 departementer var på rød alarm","Mindst 40 mennesker druknede, mens de søgte afkøling"],"section":"Udland","headline":"France records hottest-ever day as 40 drown trying to escape heatwave","primarySourceUrl":"https://www.aljazeera.com/news/2026/6/23/about-20-drown-in-france-trying-to-escape-heatwave-sweeping-much-of-europe","subheadline":"Frankrig satte tirsdag sin højeste nationale varmerekord siden 1947, mens hedebølgen kostede mindst 40 mennesker livet i druknulykker","body":["Frankrig oplevede tirsdag sin varmeste dag nogensinde, da den nationale varmeindikator – et gennemsnit af 30 målestationer – nåede 29,8 grader, det højeste siden målingerne begyndte i 1947. Lokalt blev der målt 43 grader i Les Herbiers i det sydvestlige Frankrig.","54 departementer var under rød varsling, Eiffeltårnet og Louvre indskrænkede åbningstiderne, og mindst 40 mennesker – ifølge premierminister Sebastien Lecornu primært unge – er druknet, mens de søgte afkøling."],"whyItMatters":"Hedebølgen er dagens største menneskelige hændelse i Europa og en konkret påmindelse om, at rekordvarme nu rammer tidligere på året og med dødelige følger.","analysis":"Mønsteret med stadig tidligere og hyppigere varmerekorder passer med klimamodellernes forudsigelser. De mange drukneulykker peger på en overset følgevirkning: dødeligheden flytter sig fra selve varmen til de måder, folk forsøger at undslippe den.","topics":["klima","vejr","Europa","katastrofe"],"entities":["Frankrig","Europa","Meteo France"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":84,"decisionValue":56,"novelty":70,"sourceQuality":78,"personalRelevance":40,"contrast":72},"claims":[{"text":"Frankrigs nationale varmeindikator nåede 29,8 grader, den højeste siden 1947, med 43 grader i Les Herbiers","sourceUrls":["https://www.aljazeera.com/news/2026/6/23/about-20-drown-in-france-trying-to-escape-heatwave-sweeping-much-of-europe","https://www.npr.org/2026/06/23/g-s1-129586/france-red-heat-wave-alert"],"confidence":"high"},{"text":"54 departementer var på rød alarm, og mindst 40 mennesker druknede under hedebølgen","sourceUrls":["https://www.aljazeera.com/news/2026/6/23/about-20-drown-in-france-trying-to-escape-heatwave-sweeping-much-of-europe"],"confidence":"medium"}],"sources":[{"title":"France records hottest-ever day as 40 drown trying to escape heatwave","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/23/about-20-drown-in-france-trying-to-escape-heatwave-sweeping-much-of-europe","publishedAt":"2026-06-23T18:00:00Z","kind":"reporting"},{"title":"France records its hottest day ever as Europe withers in heat wave","publisher":"NPR","url":"https://www.npr.org/2026/06/23/g-s1-129586/france-red-heat-wave-alert","publishedAt":"2026-06-23T16:00:00Z","kind":"reporting"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Heat_Wave.jpg/330px-Heat_Wave.jpg","credit":"Foto: Wikimedia Commons","alt":"Sol og ekstrem varme – illustration til hedebølge","sourceUrl":"https://en.wikipedia.org/wiki/Heat_wave"}},{"id":"story-eifo-scaleup-fund-20260629","eventKey":"eifo-eqt-scaleup-europe-fund-2026","materialFacts":["Danmarks EIFO forpligter 200 millioner euro som eneste statslige ankerinvestor i den ca. 5 milliarder euro store Scaleup Europe Fund","Fonden forvaltes af svenske EQT, og Europa-Kommissionen er største stifterinvestor med 1 milliard euro","Pengene skal i 30-40 europæiske vækstvirksomheder inden for AI, kvante, robotter, rumfart og biotek; første investering ventes i efteråret 2026"],"section":"Venturekapital","headline":"EIFO leads €200M anchor investment in EQT's €5B Scaleup Europe Fund","primarySourceUrl":"https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/","subheadline":"Danmarks eksport- og investeringsfond bliver eneste statslige ankerinvestor i EU's største vækstkapitalfond til dato","body":["Danmarks Eksport- og Investeringsfond, EIFO, forpligter 200 millioner euro – cirka 1,5 milliarder kroner – til den nye Scaleup Europe Fund på i alt omkring 5 milliarder euro. EIFO går ind som den eneste statslige fremmebank blandt ankerinvestorerne og på lige vilkår med de private.","Fonden forvaltes kommercielt af svenske EQT, mens Europa-Kommissionen er største stifter med 1 milliard euro – foran Novo Holdings, tyske Allianz og spanske Santander. Pengene skal i 30-40 europæiske vækstselskaber inden for AI, kvante, robotter, rumfart og biotek, med første investering ventet i efteråret 2026."],"whyItMatters":"Manglen på sen-fase-kapital er netop grunden til, at europæiske champions historisk er endt på amerikanske hænder. Her ankrer en dansk statslig fond EU's største forsøg på at lukke kløften til amerikansk og kinesisk vækstkapital.","analysis":"Konstruktionen er lige så vigtig som beløbet: en offentlig fond ankrer, men EQT forvalter, så kapitalen ikke bliver statsstyret. Den reelle prøve bliver, om fonden kan skrive checks store nok til at konkurrere fra Series B og frem – og om selskaberne forbliver europæiske, når de vokser.","counterpoint":"5 milliarder euro er stadig beskedent mod de store amerikanske vækstfonde.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Belgique_-_Bruxelles_-_Schuman_-_Berlaymont_-_01.jpg/960px-Belgique_-_Bruxelles_-_Schuman_-_Berlaymont_-_01.jpg","credit":"Foto: Wikimedia Commons","alt":"Europa-Kommissionens hovedkvarter Berlaymont i Bruxelles","sourceUrl":"https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/"},"topics":["venturekapital","teknologisk suverænitet","AI","scaleups","Danmark"],"entities":["EIFO","EQT","Europa-Kommissionen","Novo Holdings","Allianz"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":88,"novelty":78,"sourceQuality":80,"personalRelevance":95,"contrast":60},"claims":[{"text":"EIFO forpligter 200 mio. euro som eneste statslige ankerinvestor i Scaleup Europe Fund.","sourceUrls":["https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/","https://www.bloomberg.com/news/articles/2026-06-26/denmark-s-eifo-invests-200-million-in-eu-fund-for-tech-scale-up"],"confidence":"high"},{"text":"Fonden er på ca. 5 mia. euro, forvaltes af EQT, og Europa-Kommissionen er største stifter med 1 mia. euro.","sourceUrls":["https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/"],"confidence":"high"},{"text":"Fonden vil investere i 30-40 europæiske vækstvirksomheder med første investering i efteråret 2026.","sourceUrls":["https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/"],"confidence":"high"}],"sources":[{"title":"EIFO leads €200M anchor investment in EQT's €5B Scaleup Europe Fund","publisher":"Tech Funding News","url":"https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/","publishedAt":"2026-06-26T09:00:00Z","kind":"reporting"},{"title":"Denmark's EIFO Invests €200 Million in EU Fund for Tech Scale-Up","publisher":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-06-26/denmark-s-eifo-invests-200-million-in-eu-fund-for-tech-scale-up","publishedAt":"2026-06-26T08:00:00Z","kind":"reporting"}]},{"id":"story-openai-broadcom-20260626","eventKey":"openai-broadcom-jalapeno-chip-2026","materialFacts":["OpenAI og Broadcom præsenterede 24. juni Jalapeño, OpenAIs første egenudviklede inferens-chip","Chippen lover markant bedre ydeevne per watt; udrulning sigtes mod slutningen af 2026","Trækket reducerer OpenAIs afhængighed af Nvidia"],"section":"Teknologi","headline":"OpenAI unveils its first custom chip, built by Broadcom","primarySourceUrl":"https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/","subheadline":"Jalapeño er bygget fra bunden til inferens og skal sænke prisen per forespørgsel og afhængigheden af Nvidia","body":["OpenAI og Broadcom præsenterede 24. juni Jalapeño, OpenAIs første egenudviklede chip, bygget fra bunden til inferens – at køre færdige AI-modeller.","Tidlige tests viser markant bedre ydeevne per watt end nuværende løsninger. Første udrulning sigtes mod slutningen af 2026, mens træning fortsat ventes at køre på Nvidia-hardware."],"whyItMatters":"Inferens er den løbende driftsomkostning ved AI. Egen silicium kan sænke prisen per forespørgsel og gøre OpenAI mindre afhængig af Nvidia – samme træk, Google og Amazon har gjort.","analysis":"Pointen er vertikal integration: ejer OpenAI hele stakken fra model til chip, kan hvert lag optimeres mod samme mål. For Europa understreger det, hvor koncentreret AI-infrastrukturen er hos få amerikanske selskaber.","counterpoint":"Chippen er endnu på prototypestadiet, og de lovede ydelsestal er leverandørernes egne.","topics":["AI","halvledere","teknologisk suverænitet","infrastruktur"],"entities":["OpenAI","Broadcom","Jalapeño","Nvidia"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":80,"novelty":84,"sourceQuality":84,"personalRelevance":86,"contrast":70},"claims":[{"text":"OpenAI og Broadcom præsenterede 24. juni 2026 Jalapeño, OpenAIs første egenudviklede inferens-chip, med bedre ydeevne per watt og udrulning sigtet mod slutningen af 2026","sourceUrls":["https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/","https://www.cnbc.com/2026/06/24/openai-and-broadcom-reveal-jalapeno-first-ai-chip-in-partnership.html","https://openai.com/index/openai-broadcom-jalapeno-inference-chip/"],"confidence":"high"},{"text":"Trækket reducerer OpenAIs afhængighed af Nvidia og følger Google og Amazon, der har udviklet egne acceleratorer","sourceUrls":["https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/"],"confidence":"high"}],"sources":[{"title":"OpenAI unveils its first custom chip, built by Broadcom","publisher":"TechCrunch","url":"https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/","publishedAt":"2026-06-24T16:00:00Z","kind":"reporting"},{"title":"OpenAI unveils first chip as part of Broadcom deal in effort to 'build the full stack'","publisher":"CNBC","url":"https://www.cnbc.com/2026/06/24/openai-and-broadcom-reveal-jalapeno-first-ai-chip-in-partnership.html","publishedAt":"2026-06-24T15:00:00Z","kind":"reporting"},{"title":"OpenAI and Broadcom unveil LLM-optimized inference chip","publisher":"OpenAI","url":"https://openai.com/index/openai-broadcom-jalapeno-inference-chip/","publishedAt":"2026-06-24T14:00:00Z","kind":"primary"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Semiconductor_Wafer_of_Microelectronics.jpg/500px-Semiconductor_Wafer_of_Microelectronics.jpg","credit":"Foto: Wikimedia Commons","alt":"Halvlederwafer – illustration til OpenAIs egenudviklede inferens-chip","sourceUrl":"https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/"}},{"id":"story-burkina-france-20260627","eventKey":"burkina-faso-france-diplomatic-break-2026","materialFacts":["Burkina Fasos militærstyre afbrød 26. juni de diplomatiske forbindelser med Frankrig","Regeringen anklager Frankrig for 'nykoloniale ambitioner' og støtte til subversive netværk","Frankrig kalder beslutningen fjendtlig og grundløs og overvejer modforanstaltninger"],"section":"Udland","headline":"Burkina Faso cuts diplomatic ties with former colonial ruler France","primarySourceUrl":"https://www.aljazeera.com/news/2026/6/26/burkina-faso-cuts-diplomatic-ties-with-former-colonial-ruler-france","subheadline":"Endnu en Sahel-stat skubber Paris ud og drejer mod nye partnere","body":["Burkina Fasos militærstyre, ledet af kaptajn Ibrahim Traoré siden kuppet i 2022, afbrød 26. juni de diplomatiske forbindelser med Frankrig. Regeringen siger, at betingelserne for relationer baseret på gensidig respekt og ikke-indblanding ikke længere er til stede.","Styret anklager Frankrig for 'nykoloniale ambitioner' og for at støtte subversive netværk i Sahel. Bruddet vedrører kun statsforbindelserne, ikke de historiske og kulturelle bånd. Frankrig kalder beslutningen fjendtlig og grundløs og overvejer modforanstaltninger."],"whyItMatters":"Burkina Faso følger Mali og Niger i at skubbe Paris ud og dreje mod Rusland og Kina – og omtegner indflydelsen i en region, der er central for migration, uran og sikkerhed.","analysis":"Det reelle skifte er strategisk, ikke symbolsk: Sahel-juntaerne opbygger et alternativt partnerskabsnet. For Europa svækker det efterretningssamarbejde og adgang, mens ustabiliteten fortsætter.","topics":["geopolitik","Afrika","diplomati","Sahel"],"entities":["Burkina Faso","Ibrahim Traoré","Frankrig"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":80,"decisionValue":50,"novelty":78,"sourceQuality":84,"personalRelevance":28,"contrast":82},"claims":[{"text":"Burkina Fasos militærstyre under Ibrahim Traoré afbrød 26. juni 2026 de diplomatiske forbindelser med Frankrig og anklagede Paris for 'nykoloniale ambitioner'","sourceUrls":["https://www.aljazeera.com/news/2026/6/26/burkina-faso-cuts-diplomatic-ties-with-former-colonial-ruler-france","https://www.france24.com/en/africa/20260626-burkina-faso-ruling-junta-cuts-diplomatic-ties-with-ex-ruler-france"],"confidence":"high"},{"text":"Frankrig kaldte beslutningen 'fjendtlig og grundløs' og oplyste, at gensidige modforanstaltninger overvejes","sourceUrls":["https://www.france24.com/en/africa/20260626-burkina-faso-ruling-junta-cuts-diplomatic-ties-with-ex-ruler-france"],"confidence":"medium"}],"sources":[{"title":"Burkina Faso cuts diplomatic ties with former colonial ruler France","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/26/burkina-faso-cuts-diplomatic-ties-with-former-colonial-ruler-france","publishedAt":"2026-06-26T16:00:00Z","kind":"reporting"},{"title":"Burkina Faso ruling junta cuts diplomatic ties with ex-ruler France","publisher":"France 24","url":"https://www.france24.com/en/africa/20260626-burkina-faso-ruling-junta-cuts-diplomatic-ties-with-ex-ruler-france","publishedAt":"2026-06-26T15:00:00Z","kind":"reporting"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Capitaine_Ibrahim_TRAOR%C3%89_President_du_Faso%2C_Chef_de_l%27%C3%89tat.jpg/500px-Capitaine_Ibrahim_TRAOR%C3%89_President_du_Faso%2C_Chef_de_l%27%C3%89tat.jpg","credit":"Foto: Wikimedia Commons","alt":"Kaptajn Ibrahim Traoré, Burkina Fasos leder","sourceUrl":"https://www.aljazeera.com/news/2026/6/26/burkina-faso-cuts-diplomatic-ties-with-former-colonial-ruler-france"}},{"id":"story-oracle-ai-cuts-20260624","eventKey":"oracle-ai-workforce-reduction-2026","materialFacts":["Oracle reducerede arbejdsstyrken med cirka 21.000 stillinger til 141.000 ansatte over et år","Selskabet kobler i sin årsrapport eksplicit nedskæringerne til AI","Kapitaludgifterne steg 162 procent til 55,7 milliarder dollar"],"section":"Teknologi","headline":"Oracle cut 21,000 jobs as AI buildout continues","primarySourceUrl":"https://finance.yahoo.com/technology/article/oracle-cut-21000-jobs-as-ai-buildout-continues-125918523.html","subheadline":"Oracle skar næsten 13 procent af arbejdsstyrken på et år og peger selv på AI i regnskabet, mens investeringerne i datacentre eksploderer","body":["Oracle har skåret cirka 21.000 stillinger – næsten 13 procent af arbejdsstyrken – på et år, så koncernen ved udgangen af maj 2026 var nede på 141.000 fuldtidsansatte mod 162.000 året før. I sin årsrapport kobler selskabet direkte nedskæringerne til indførelsen af AI.","Samtidig accelererer investeringerne: kapitaludgifterne steg 162 procent til 55,7 milliarder dollar, og den frie pengestrøm var negativ 23,7 milliarder dollar. Omstruktureringen kostede 1,8 milliarder dollar mod 374 millioner året før."],"whyItMatters":"Det er et af de tydeligste eksempler til dato på en stor it-koncern, der både fyrer i tusindtal og selv peger på AI som en årsag – ikke som fremtidsscenarie, men i et regnskab.","analysis":"Tallene tegner en dyr satsning: Oracle brænder kontanter af på datacentre, mens aktien er faldet 10 procent i år. Spørgsmålet for en investor er, om AI-drevne effektiviseringer og skyordrer kan retfærdiggøre det negative cashflow. At fyringer og rekordinvesteringer sker samtidig, viser, at AI-omstillingen rammer både omkostnings- og udgiftssiden på én gang.","counterpoint":"En regnskabsformulering er ikke et bevis: en del af de 21.000 kan skyldes almindelig omstrukturering, og »AI« kan også være en bekvem forklaring.","primaryExcerpt":{"quote":"The adoption and deployment of AI technologies across our operations have resulted, and may continue to result, in reductions to our workforce.","sourceUrl":"https://www.cnbc.com/2026/06/23/oracle-ai-job-cuts-layoffs-21000.html","sourceTitle":"Oracle sheds 21,000 roles over the past year amid wave of AI layoffs from tech giants"},"topics":["AI","arbejdsmarked","teknologi","kapitaludgifter"],"entities":["Oracle","OpenAI"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":80,"novelty":78,"sourceQuality":78,"personalRelevance":84,"contrast":64},"claims":[{"text":"Oracle reducerede arbejdsstyrken med cirka 21.000 stillinger til 141.000 ansatte over et år","sourceUrls":["https://finance.yahoo.com/technology/article/oracle-cut-21000-jobs-as-ai-buildout-continues-125918523.html","https://www.cnbc.com/2026/06/23/oracle-ai-job-cuts-layoffs-21000.html"],"confidence":"high"},{"text":"Kapitaludgifterne steg 162 procent til 55,7 milliarder dollar, og fri pengestrøm var negativ 23,7 milliarder dollar","sourceUrls":["https://finance.yahoo.com/technology/article/oracle-cut-21000-jobs-as-ai-buildout-continues-125918523.html"],"confidence":"medium"}],"sources":[{"title":"Oracle cut 21,000 jobs as AI buildout continues","publisher":"Yahoo Finance","url":"https://finance.yahoo.com/technology/article/oracle-cut-21000-jobs-as-ai-buildout-continues-125918523.html","publishedAt":"2026-06-23T12:59:00Z","kind":"reporting"},{"title":"Oracle sheds 21,000 roles over the past year amid wave of AI layoffs from tech giants","publisher":"CNBC","url":"https://www.cnbc.com/2026/06/23/oracle-ai-job-cuts-layoffs-21000.html","publishedAt":"2026-06-23T11:00:00Z","kind":"reporting"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/ fra tankstationer – nu reagerer Putin","primarySourceUrl":"https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin","subheadline":"Ukraines angreb på russiske raffinaderier presser brændstofmarkedet så hårdt, at præsidenten nu erkender problemerne","body":["Vladimir Putin erkendte 28. juni offentligt, at Rusland har brændstofproblemer: \"Vi kan se problemerne, vi er klar over dem og reagerer på dem,\" sagde han om køer ved tankstationer og en trussel mod høsten. En sjælden indrømmelse fra Kreml.","Baggrunden er ukrainske langtrækkende angreb på russiske raffinaderier; senest blev anlæg i Slavjansk i Krasnodar og i Jaroslavl ramt. Dieselprisen nåede rekorden 77.177 rubler pr. ton på SPIMEX-børsen, 23 procent over april."],"whyItMatters":"Når Kreml indrømmer mangel ved pumperne, viser det, at Ukraines angreb på energiinfrastruktur dybt i Rusland nu rammer krigsøkonomien – ikke kun militære mål.","analysis":"Brændstof er Ruslands stærkeste eksportkort og samtidig en akilleshæl: rammes raffinaderierne, stiger priserne hjemme, mens eksportindtægterne falder. Kreml overvejer nu et dieseleksportforbud.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/2/3/e/23e0d1de-4ce4-49a3-8350-c1b2473ff9f8?ixlib=js-3.8.0&w=624&h=351&q=45&auto=format&fit=crop&rect64=NzQwLDQzOCwxNzAwLDk1NQ&s=f72baa02c56cef5eeb30337087e337d5","credit":"Kilde: TV 2","alt":"Tankstation i Rusland under brændstofmangel","sourceUrl":"https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin"},"topics":["forsvar","Ukraine","Rusland","energi"],"entities":["Vladimir Putin","Ukraine","Rusland","SPIMEX"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":60,"novelty":72,"sourceQuality":72,"personalRelevance":58,"contrast":64},"claims":[{"text":"Putin erkendte 28. juni russiske brændstofproblemer med køer ved tankstationer og trussel mod høsten.","sourceUrls":["https://nyheder.tv2.dk/u   function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".headline-link, .primary-source-link, .read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
