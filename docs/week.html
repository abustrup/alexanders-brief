  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

Key":"european-missile-defense-coalition-2026","materialFacts":["Danmark tilslutter sig en koalition af ti lande (Frankrig, Tyskland, Italien, Nederlandene, Norge, Spanien, Sverige, Storbritannien og Ukraine), der vil opbygge et integreret europæisk forsvar mod ballistiske missiler, præsenteret mandag i Paris under Mette Frederiksens besøg hos Emmanuel Macron","Danmarks bidrag er radarsystemer; radarvirksomheden Weibel Scientific fra Allerød deltog i mødet i Paris og skal være med til at udvikle systemet","Frederiksen forventer, at projektet går i gang inden udgangen af 2026, og erklærer som mål, at Europa selv skal producere kapaciteter frem for at være afhængig af USA","Ukraine tiltænkes en nøglerolle i arkitekturen"],"section":"Forsvar","headline":"Danmark går sammen med en række lande om at opbygge europæisk missilforsvar","primarySourceUrl":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","subheadline":"Ti lande – med Ukraine i en nøglerolle – vil bygge et fælles værn mod ballistiske missiler. Danmark bidrager med radarteknologi, og Weibel Scientific var med i Paris.","body":["Danmark tilslutter sig en koalition af ti lande, der vil opbygge et integreret europæisk forsvar mod ballistiske missiler. Beslutningen blev præsenteret mandag i Paris under Mette Frederiksens besøg hos Emmanuel Macron, og kredsen tæller også Tyskland, Storbritannien, Italien, Nederlandene, Norge, Spanien og Sverige – samt Ukraine i en nøglerolle.","Det danske bidrag er radarsystemer, og Allerød-virksomheden Weibel Scientific deltog i mødet i Paris og skal være med til at udvikle systemet. Statsministeren forventer, at projektet går i gang allerede i 2026, og formulerede målet direkte: Europa skal selv kunne producere de kapaciteter, som kontinentet i dag køber i USA."],"whyItMatters":"Missilforsvar er et af de områder, hvor Europas afhængighed af amerikansk teknologi er størst; en fælles arkitektur flytter efterspørgsel og udviklingsmidler til europæiske – herunder danske – leverandører.","analysis":"For dansk forsvarsindustri er signalværdien betydelig: Får Weibel en rolle i radarlaget af et europæisk missilskjold, rykker Danmark fra kunde til systemleverandør. Finansiering og kommandostruktur er endnu ikke offentliggjort – og det er erfaringsmæssigt dér, fælleseuropæiske forsvarsprojekter forsinkes.","topics":["forsvar","missilforsvar","teknologisk suverænitet","Europa"],"entities":["Danmark","Mette Frederiksen","Weibel Scientific","Frankrig","Ukraine"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":70,"novelty":78,"sourceQuality":85,"personalRelevance":90,"contrast":55},"claims":[{"text":"Danmark indgår i en koalition af ti lande – heriblandt Frankrig, Tyskland, Storbritannien og Ukraine – der vil opbygge et integreret europæisk missilforsvar, annonceret i Paris mandag den 13. juli 2026.","sourceUrls":["https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","https://www.euronews.com/my-europe/2026/07/13/nine-european-countries-and-ukraine-form-anti-ballistic-missile-coalition"],"confidence":"high"},{"text":"Danmarks bidrag er radarsystemer, og Weibel Scientific deltog i mødet i Paris; Mette Frederiksen forventer, at projektet starter i 2026.","sourceUrls":["https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar"],"confidence":"high"}],"sources":[{"title":"Danmark går sammen med en række lande om at opbygge europæisk missilforsvar","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","publishedAt":"2026-07-13T18:40:00.000Z","kind":"reporting"},{"title":"Nine European countries and Ukraine form anti-ballistic missile coalition","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/07/13/nine-european-countries-and-ukraine-form-anti-ballistic-missile-coalition","publishedAt":"2026-07-13T16:31:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/mmolxrv3/20260713-173821-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: DR","alt":"Mette Frederiksen ved mødet i Paris, hvor ti lande præsenterede planen om et fælles europæisk missilforsvar","sourceUrl":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar"}},{"id":"story-lindsey-graham-death-20260713","eventKey":"lindsey-graham-death-2026-07","materialFacts":["US Senator Lindsey Graham (Republican, South Carolina) died at age 71 on the night of Saturday, July 11, 2026, hours after returning from a trip to Ukraine where he had met President Volodymyr Zelenskyy; his office said he died from a 'brief and sudden illness.'","The preliminary cause of death, per medical examiner findings released July 12, 2026, is aortic dissection (a tear/rupture of the aortic wall) due to arteriosclerotic cardiovascular disease; EMS responded to a cardiac-arrest call at his Capitol Hill home.","Graham was first elected to the US Senate in 2002 (serving since 2003), had recently won his Republican primary, and was seeking a fifth term in the November 3, 2026 election.","Under South Carolina law, Republican Governor Henry McMaster appoints an interim replacement, who would serve until January 3, 2027."],"section":"Politik","headline":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","primarySourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","subheadline":"Den mangeårige republikanske senator fra South Carolina døde natten til søndag, kort efter en rejse til Ukraine.","body":["Senator Lindsey Graham (R-South Carolina) døde 71 år gammel natten til søndag den 11. juli, timer efter et besøg hos præsident Zelenskyj i Ukraine. Retsmedicinernes foreløbige konklusion 12. juli peger på en aortadissektion som følge af åreforkalkning efter et hjertestop i hjemmet.","Graham blev valgt til Senatet i 2002 og stillede op til en femte periode 3. november. Efter South Carolinas lov udpeger guvernør Henry McMaster (R) nu en midlertidig afløser frem til 3. januar 2027, hvorefter pladsen besættes ved midtvejsvalget."],"whyItMatters":"Grahams død fjerner en af Trumps mest markante udenrigspolitiske allierede i Senatet og udløser et opgør om en sikker republikansk plads.","analysis":"Med en snæver magtbalance kan selv én tom plads påvirke afstemninger, og nomineringskampen tester Trump-fløjens styrke i South Carolina.","topics":["politik","USA","Senatet","valg"],"entities":["Lindsey Graham","USA","South Carolina","Henry McMaster","Donald Trump"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":45,"novelty":88,"sourceQuality":88,"personalRelevance":40,"contrast":55},"claims":[{"text":"US Senator Lindsey Graham (R-South Carolina) died at 71 on the night of Saturday, July 11, 2026, confirmed by his office and multiple independent outlets.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies"],"confidence":"high"},{"text":"Preliminary medical examiner findings give the cause of death as aortic dissection due to arteriosclerotic cardiovascular disease.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/"],"confidence":"high"},{"text":"Graham died hours after returning from a trip to Ukraine and had been seeking a fifth Senate term in the November 3, 2026 election.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"],"confidence":"high"}],"sources":[{"title":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","publisher":"CBS News","url":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","publishedAt":"2026-07-13T00:51:00.000Z","kind":"reporting"},{"title":"Lindsey Graham dies of aortic dissection, preliminary medical report says","publisher":"The Washington Post","url":"https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"},{"title":"Sen. Lindsey Graham of South Carolina, Trump ally, dies at 71","publisher":"NPR","url":"https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"}],"image":{"url":"https://assets2.cbsnewsstatic.com/hub/i/r/2026/07/12/b382a83e-fc49-460b-9f9a-8c8e3539c038/thumbnail/620x413/92887803139a33088d75d95a066274f3/gettyimages-2259262756.jpg","credit":"Kilde: CBS News / Getty Images","alt":"Portræt i forbindelse med senator Lindsey Grahams død","sourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"}},{"id":"us-venture-h1-2026-ai-concentration-20260710","eventKey":"us-venture-h1-2026-ai-concentration","materialFacts":["Amerikansk venturekapital nåede 412,7 mia. dollar i første halvår af 2026 — knap 30 procent mere end hele 2025 tilsammen (PitchBook)","AI-selskaber lagde beslag på 355,9 mia. dollar, svarende til omkring 86 procent af hver venturedollar i perioden","Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital"],"section":"Marked","headline":"PitchBook: US venture funding hits $412.7B in first half as AI deals dominate","primarySourceUrl":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/","subheadline":"Venturekapitalen satte halvårsrekord — men næsten hver eneste dollar samlede sig om kunstig intelligens og de allerstørste runder.","body":["Amerikansk venturekapital nåede 412,7 mia. dollar i første halvår af 2026 — knap 30 procent mere end hele 2025 tilsammen, viser tal fra PitchBook. Men kapitalen samler sig: AI-selskaber tog 355,9 mia. dollar, omkring 86 procent af hver venturedollar i perioden.","Koncentrationen gælder også rundestørrelsen. Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital, mens de tidlige, brede væddemål måtte deles om resten. USA trækker næsten hele læsset."],"whyItMatters":"Når 86 procent af pengene ligger i store AI-runder, er markedet ekstremt eksponeret mod én tese og mod få meget store selskaber.","analysis":"Det er ikke et bredt opsving, men en satsning på, at agentisk AI og infrastruktur tjener de enorme runder hjem — og det efterlader seed, ikke-AI og Europa relativt kapitalfattige.","counterpoint":"PitchBook måler dollar, ikke afkast. Koncentrationen kan lige så vel afspejle, at de bedste muligheder faktisk ligger i AI, som at markedet overopheder.","image":{"url":"https://d15shllkswkct0.cloudfront.net/wp-content/blogs.dir/1/files/2020/10/sandhillroad.jpg","credit":"Kilde: SiliconANGLE","alt":"Sand Hill Road, det traditionelle centrum for amerikansk venturekapital","sourceUrl":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"},"topics":["venturekapital","marked","ai","koncentration","usa"],"entities":["PitchBook","USA","kunstig intelligens"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":88,"novelty":72,"sourceQuality":80,"personalRelevance":90,"contrast":58},"claims":[{"text":"Amerikansk venturekapital nåede 412,7 mia. dollar i H1 2026, og AI-selskaber tog 355,9 mia. dollar (ca. 86 procent).","sourceUrls":["https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"],"confidence":"high"},{"text":"Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital.","sourceUrls":["https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"],"confidence":"high"}],"sources":[{"title":"PitchBook: US venture funding hits $412.7B in first half as AI deals dominate","publisher":"SiliconANGLE","url":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/","publishedAt":"2026-07-09T04:01:00.000Z","kind":"reporting"}]},{"id":"khamenei-burial-mashhad-succession-20260711","eventKey":"khamenei-burial-mashhad-succession","materialFacts":["IRNA meldte tidligt fredag 10. juli, at Khamenei og fire familiemedlemmer er begravet ved Imam Reza-helligdommen i Mashhad","Begravelsen afsluttede en uges processioner gennem Teheran, Qom og de irakiske helligbyer Najaf og Karbala","Den udpegede efterfølger Mojtaba Khamenei har ikke vist sig offentligt siden angrebet 28. februar; iflg. Reuters-citerede kilder i Teheran blev han vansiret og skærmes af sikkerhedstjenesterne"],"section":"Geopolitik","headline":"Slain Supreme Leader Ali Khamenei buried at Iran’s holiest shrine","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies","subheadline":"Efter en uges processioner er Khamenei begravet i Mashhad — men Irans udpegede efterfølger er stadig ikke set offentligt siden angrebet i februar.","body":["Irans statslige nyhedsbureau IRNA meldte tidligt fredag, at ayatollah Ali Khamenei og fire familiemedlemmer er begravet ved Imam Reza-helligdommen i Mashhad, Irans helligste shiamuslimske sted, efter en uges processioner gennem Teheran, Qom, Najaf og Karbala.","Khamenei blev dræbt 28. februar i et amerikansk-israelsk luftangreb i Teheran — begivenheden, der udløste krigen. Efterfølgeren, sønnen Mojtaba, er ikke set offentligt siden; ifølge kilder i Teheran citeret af Reuters blev han vansiret og skærmes af sikkerhedstjenesterne. Oplysningen er ikke uafhængigt bekræftet."],"whyItMatters":"Uden en synlig øverste leder er det uklart, hvem der kan forpligte Iran i forhandlingerne om våbenhvile, sanktioner og uran.","analysis":"Magttomrummet gør Teherans signaler — fra Oman-forhandlinger til 'slyngel-elementer' — svære at læse som forpligtende; det er en selvstændig risiko oven i selve krigen.","image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/07/AFP__20260709__B9RE94Y__v1__HighRes__IranUsIsraelWarFuneral-1783648635.jpg?resize=1920%2C1440","credit":"Foto: AFP via Al Jazeera","alt":"Sørgeoptog under begravelsesceremonierne for Ali Khamenei","sourceUrl":"https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies"},"topics":["geopolitik","iran","mellemøsten","succession"],"entities":["Ali Khamenei","Mojtaba Khamenei","Iran","IRNA","Mashhad"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":48,"novelty":62,"sourceQuality":80,"personalRelevance":45,"contrast":55},"claims":[{"text":"Khamenei blev dræbt 28. februar 2026 i et amerikansk-israelsk luftangreb i Teheran, der udløste krigen; han og fire familiemedlemmer blev begravet ved Imam Reza-helligdommen i Mashhad, meldt af IRNA tidligt fredag 10. juli, efter en uges processioner.","sourceUrls":["https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies","https://www.haaretz.com/middle-east-news/iran/2026-07-09/ty-article/iran-buries-slain-leader-khamenei-after-days-long-funeral-procession/0000019f-4717-dc56-adff-6f77415d0000"],"confidence":"high"},{"text":"Mojtaba Khamenei er ikke set offentligt siden 28. februar og blev ifølge kilder i Teheran citeret af Reuters vansiret i angrebet; oplysningen er ikke uafhængigt bekræftet.","sourceUrls":["https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies","https://www.haaretz.com/middle-east-news/iran/2026-07-09/ty-article/iran-buries-slain-leader-khamenei-after-days-long-funeral-procession/0000019f-4717-dc56-adff-6f77415d0000"],"confidence":"low"}],"sources":[{"title":"Slain Supreme Leader Ali Khamenei buried at Iran’s holiest shrine","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/9/iran-prepares-to-bury-slain-leader-khamenei-after-mass-funeral-ceremonies","publishedAt":"2026-07-10T05:00:00.000Z","kind":"reporting"},{"title":"Iran Buries Slain Leader Khamenei After Days-long Funeral Procession","publisher":"Haaretz","url":"https://www.haaretz.com/middle-east-news/iran/2026-07-09/ty-article/iran-buries-slain-leader-khamenei-after-days-long-funeral-procession/0000019f-4717-dc56-adff-6f77415d0000","publishedAt":"2026-07-09T20:00:00.000Z","kind":"reporting"}]},{"id":"sk-hynix-nasdaq-record-ipo-20260711","eventKey":"sk-hynix-nasdaq-record-ipo","materialFacts":["SK Hynix rejste 26,5 mia. dollar den 10. juli — den største amerikanske børsnotering af et udenlandsk selskab nogensinde, foran Alibabas 25 mia. dollar fra 2014","177,9 mio. ADS'er prissat til 149 dollar; ca. 7x overtegnet; åbnede omkring 14 pct. over udbudskursen (ticker SKHYV, fra mandag SKHY)","Provenuet investeres i Sydkorea: ny fab i Yongin, pakkeanlæg i Cheongju og EUV-udstyr; SK Hynix har ca. 56 pct. af HBM-markedet","Handelsminister Lutnick siger, at han er 'i samtaler med Samsung og SK Hynix' om amerikanske fabrikker"],"section":"Marked","headline":"SK Hynix raises $26.5B in the biggest foreign IPO in US history, is urged to build new US fabs","primarySourceUrl":"https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/","subheadline":"AI-hukommelsens dominerende leverandør satte rekord på Nasdaq — og pengene bliver i Sydkorea, til Washingtons irritation.","body":["Sydkoreanske SK Hynix rejste fredag 26,5 mia. dollar på Nasdaq — den største amerikanske børsnotering af et udenlandsk selskab nogensinde, foran Alibabas 25 mia. fra 2014. Udbuddet var omkring syv gange overtegnet, og aktien åbnede cirka 14 pct. over kursen på 149 dollar.","Provenuet bliver i Sydkorea: ny fabrik i Yongin-klyngen, avanceret pakning i Cheongju og EUV-udstyr. Handelsminister Howard Lutnick pressede samtidig på for amerikanske fabrikker — han er 'allerede i samtaler med Samsung og SK Hynix'."],"whyItMatters":"SK Hynix sidder på ca. 56 pct. af HBM-markedet — hukommelsen bag Nvidias AI-acceleratorer; noteringen er en direkte temperaturmåling på AI-efterspørgslen.","analysis":"Rekorden landede i samme uge som chip-udsalget: Fysiske flaskehalse som HBM prissættes stadig aggressivt, mens tvivlen samler sig om softwarelaget. Aktien er steget 634 pct. på et år — skuffer AI-capex, står nykommeren forrest i faldet.","image":{"url":"https://techcrunch.com/wp-content/uploads/2026/07/SK-Hynix.jpg?resize=1200,675","credit":"Kilde: TechCrunch","alt":"SK Hynix-logo og chipproduktion","sourceUrl":"https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/"},"topics":["marked","halvledere","ai","sydkorea","usa"],"entities":["SK Hynix","Nasdaq","Samsung","Howard Lutnick","Sydkorea","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":76,"novelty":85,"sourceQuality":85,"personalRelevance":92,"contrast":62},"claims":[{"text":"SK Hynix rejste 26,5 mia. dollar — største udenlandske USA-notering nogensinde; 177,9 mio. ADS'er til 149 dollar, ca. 7x overtegnet, åbnede ca. 14 pct. over kursen.","sourceUrls":["https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/","https://www.cnn.com/2026/07/10/business/sk-hynix-us-listing-ai-chip-boom-intl-hnk"],"confidence":"high"},{"text":"Provenuet investeres i Sydkorea (Yongin, Cheongju, EUV); SK Hynix har ca. 56 pct. af HBM-markedet; Lutnick er i samtaler med Samsung og SK Hynix om amerikanske fabrikker.","sourceUrls":["https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/"],"confidence":"high"},{"text":"SK Hynix-aktien er steget 634 pct. over 12 måneder, og selskabets markedsværdi passerede 1.000 mia. dollar i maj 2026.","sourceUrls":["https://finance.yahoo.com/markets/stocks/articles/sk-hynix-nasdaq-debut-26-113118390.html"],"confidence":"medium"}],"sources":[{"title":"SK Hynix raises $26.5B in the biggest foreign IPO in US history, is urged to build new US fabs","publisher":"TechCrunch","url":"https://techcrunch.com/2026/07/10/sk-hynix-raises-26-5b-in-the-biggest-foreign-ipo-in-us-history-is-urged-to-build-new-us-fabs/","publishedAt":"2026-07-10T17:17:00.000Z","kind":"reporting"},{"title":"SK Hynix's blockbuster US listing shows the AI chip boom is far from over","publisher":"CNN","url":"https://www.cnn.com/2026/07/10/business/sk-hynix-us-listing-ai-chip-boom-intl-hnk","publishedAt":"2026-07-10T12:00:00.000Z","kind":"reporting"},{"title":"SK Hynix Nasdaq debut: $26.5 billion ADR listing sets record","publisher":"Quartz (via Yahoo Finance)","url":"https://finance.yahoo.com/markets/stocks/articles/sk-hynix-nasdaq-debut-26-113118390.html","publishedAt":"2026-07-10T11:31:00.000Z","kind":"reporting"}]},{"id":"semiconductor-ai-capex-selloff-20260709","eventKey":"semiconductor-ai-capex-selloff-2026-07","materialFacts":["Et bredt frasalg af halvlederaktier barberede omkring 1.300 mia. dollar af markedsværdien 7.-8. juli 2026","Intel faldt over 20 procent, og Philadelphia-halvlederindekset (SOX) tabte cirka 10,8 procent","Udløseren var Samsungs foreløbige Q2-regnskab: driftsoverskud på ca. 58 mia. dollar, der slog overskudsforventningen, men med skuffende omsætning målt på de høje AI-forventninger","Hyperscalernes AI-kapitaludgifter er ifølge Forbes vokset 67 procent til omkring 650 mia. dollar"],"section":"Marked","headline":"Semiconductor Selloff Deepens As AI Spending Fears Hit Intel","primarySourceUrl":"https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/","subheadline":"Et frasalg på 1.300 mia. dollar rammer chipaktierne, da markedet for første gang for alvor tvivler på AI-investeringernes holdbarhed.","body":["Et bredt frasalg af halvlederaktier uddybede sig 7.-8. juli og barberede omkring 1.300 milliarder dollar af markedsværdien. Philadelphia-halvlederindekset (SOX) faldt cirka 10,8 procent, og Intel (USA) mistede over 20 procent på få dage.","Udløseren kom fra Sydkorea: Samsungs foreløbige Q2-regnskab viste et driftsoverskud på cirka 58 milliarder dollar — næsten en tyvedobling år-til-år — men omsætningen skuffede målt på de skyhøje AI-forventninger, og aktien faldt omkring 7 procent. Micron, AMD og Taiwans TSMC trak med ned."],"whyItMatters":"For en investeringsanalytiker er det første gang længe, at markedet for alvor tvivler på selve AI-investeringscyklussen. Hyperscalernes kapitaludgifter er ifølge Forbes vokset 67 procent til omkring 650 milliarder dollar, og frygten for overkapacitet rammer nu de aktier, optimismen hviler på.","analysis":"Nuancen er vigtig: Samsungs tal var et overskud, der slog forventningerne — det var omsætningen, ikke bunden, der skuffede. Markedet reagerer altså ikke på svag efterspørgsel, men på tvivl om, hvorvidt de enorme kapitaludgifter nogensinde tjenes hjem.","topics":["halvledere","marked","ai-capex","valuations","usa"],"entities":["Intel","Samsung Electronics","TSMC","Micron","AMD","SOX","USA","Sydkorea","Taiwan"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":82,"novelty":74,"sourceQuality":80,"personalRelevance":84,"contrast":60},"claims":[{"text":"Semiconductor Selloff Deepens As AI Spending Fears Hit Intel","sourceUrls":["https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/"],"confidence":"high"},{"text":"Frasalget barberede omkring 1.300 mia. dollar af halvledernes markedsværdi, og Intel faldt over 20 procent","sourceUrls":["https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/"],"confidence":"medium"}],"sources":[{"title":"Semiconductor Selloff Deepens As AI Spending Fears Hit Intel","publisher":"Forbes","url":"https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/","publishedAt":"2026-07-08T12:36:00.000Z","kind":"reporting"},{"title":"Chip stocks sell off after Samsung earnings fall short of high AI bar","publisher":"CNBC","url":"https://www.cnbc.com/2026/07/07/chip-stocks-ai-selloff-samsung.html","publishedAt":"2026-07-07T12:00:00.000Z","kind":"reporting"}],"image":{"url":"https://imageio.forbes.com/specials-images/imageserve/6a4e2f8f893918fde7214681/0x0.jpg?format=jpg&height=900&width=1600&fit=bounds","credit":"Kilde: Forbes","alt":"Illustration af halvlederchips og aktiemarkedet under juli-frasalget","sourceUrl":"https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/"}},{"id":"story-uae-export-controls-20260713","eventKey":"us-uae-a5-export-controls-ai-chips-2026-07","materialFacts":["On July 10, 2026, the U.S. Commerce Department's Bureau of Industry and Security (BIS) removed the United Arab Emirates from EAR Country Groups D:3 and D:4 and reclassified it into Country Group A:5, citing the UAE's status as a U.S. Major Defense Partner and its support for U.S. interests, including Operation Epic Fury.","A:5 status gives the UAE government and approved commercial entities eligibility for license-free exports, reexports and in-country transfers under License Exception Strategic Trade Authorization (STA) of Commerce-controlled military items, certain commercial satellites and spacecraft, and dual-use items for oil and gas, desalination and civil nuclear power.","Consistent with the U.S.-UAE Artificial Intelligence Cooperation framework signed in May 2025, Commerce is approving the UAE government and certain companies to receive advanced computing items, including AI chips and servers, license-free; reporting (Reuters/Export Compliance Daily) identifies the two approved firms as Group 42 (G42) and Core42, which must become U.S. companies within 270 days (nine months) or reapply. The BIS release names no U.S. firms such as Amazon, Apple or xAI.","The regulatory changes are implemented via Federal Register notice 2026-14132."],"section":"Geopolitik","headline":"Department of Commerce Eases Export Controls for UAE","primarySourceUrl":"https://www.bis.gov/press-release/department-commerce-eases-export-controls-uae","subheadline":"USA fjerner De Forenede Arabiske Emirater fra de skærpede eksportlister og giver landet licensfri adgang til avancerede AI-chips.","body":["USA’s handelsministerium flyttede 10. juli De Forenede Arabiske Emirater fra eksportkontrollens strammeste landegrupper til den betroede gruppe A:5, med henvisning til Emiraternes status som amerikansk „Major Defense Partner“. Med A:5-status kan emiratiske myndigheder og godkendte firmaer nu modtage militært udstyr, satellitter og dual-use-varer licensfrit.","Vigtigst for teknologisektoren: i forlængelse af den amerikansk-emiratiske AI-ramme fra maj 2025 kan Emiraterne og udvalgte selskaber nu importere avancerede AI-chips og servere uden licens. Ifølge Reuters og Export Compliance Daily er de to godkendte firmaer G42 og Core42, der til gengæld skal omdannes til amerikanske selskaber inden for 270 dage."],"whyItMatters":"Adgang til Nvidia-klassens AI-chips er blevet et geopolitisk instrument; USA binder nu Emiraternes voksende datacenter-ambitioner til amerikansk frem for kinesisk teknologi.","analysis":"Kravet om, at G42 og Core42 skal blive amerikanske selskaber, er prisen for adgangen: marked mod kontrol. For Europa skærper det kampen om knappe AI-acceleratorer.","counterpoint":"Det primære BIS-dokument nævner hverken mængder eller navngivne selskaber; oplysningerne om G42 og Core42 stammer fra rapportering.","topics":["AI","teknologisk suverænitet","halvledere","geopolitik","eksportkontrol"],"entities":["USA","De Forenede Arabiske Emirater","Bureau of Industry and Security","G42","Core42"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":70,"novelty":82,"sourceQuality":96,"personalRelevance":82,"contrast":55},"claims":[{"text":"BIS removed the UAE from EAR Country Groups D:3 and D:4 and reclassified it into Country Group A:5, granting license-free access (under License Exception STA) to controlled military items, certain commercial satellites/spacecraft and dual-use goods, citing the UAE's Major Defense Partner status and Operation Epic Fury.","sourceUrls":["https://www.bis.gov/press-release/department-commerce-eases-export-controls-uae"],"confidence":"high"},{"text":"Consistent with the May 2025 U.S.-UAE AI Cooperation framework, Commerce approved the UAE government and certain companies to receive advanced computing items including AI chips and servers license-free; reporting names the two approved firms as G42 (Group 42) and Core42, which must become U.S. companies within 270 days or reapply.","sourceUrls":["https://www.bis.gov/press-release/department-commerce-eases-export-controls-uae","https://exportcompliancedaily.com/article/2026/07/13/bis-eases-export-controls-for-uae-including-for-advanced-chips-2607100033"],"confidence":"high"},{"text":"The changes are implemented via Federal Register notice 2026-14132, effective July 10, 2026.","sourceUrls":["https://www.bis.gov/press-release/department-commerce-eases-export-controls-uae","https://www.gulf-times.com/article/729012/international/us-makes-it-easier-to-export-certain-military-items-ai-chips-and-commercial-satellites-to-the-uae"],"confidence":"high"}],"sources":[{"title":"Department of Commerce Eases Export Controls for UAE","publisher":"U.S. Bureau of Industry and Security (BIS)","url":"https://www.bis.gov/press-release/department-commerce-eases-export-controls-uae","publishedAt":"2026-07-10T04:00:00.000Z","kind":"primary"},{"title":"BIS Eases Export Controls for UAE, Including for Advanced Chips","publisher":"Export Compliance Daily","url":"https://exportcompliancedaily.com/article/2026/07/13/bis-eases-export-controls-for-uae-including-for-advanced-chips-2607100033","publishedAt":"2026-07-13T04:00:00.000Z","kind":"reporting"},{"title":"US makes it easier to export certain military items, AI chips and commercial satellites to the UAE","publisher":"Gulf Times (Reuters)","url":"https://www.gulf-times.com/article/729012/international/us-makes-it-easier-to-export-certain-military-items-ai-chips-and-commercial-satellites-to-the-uae","publishedAt":"2026-07-10T04:00:00.000Z","kind":"reporting"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Semiconductor_Wafer_of_Microelectronics.jpg/1280px-Semiconductor_Wafer_of_Microelectronics.jpg","credit":"Foto: Wikimedia Commons","alt":"Semiconductorwafer – illustration af de avancerede AI-chips, som de nye amerikanske eksportregler omfatter","sourceUrl":"https://commons.wikimedia.org/wiki/File:Semiconductor_Wafer_of_Microelectronics.jpg"}},{"id":"nato-ankara-greenland-denmark-20260708","eventKey":"nato-ankara-greenland-2026","materialFacts":["På NATO-topmødet i Ankara 7.-8. juli sagde statsminister Mette Frederiksen, at Danmark er parat til at forsvare hver centimeter af NATO, inklusive eget territorium","Frederiksen fastslog, at Grønland ikke er til salg","Donald Trump gentog på topmødet kravet om, at USA — ikke Danmark — bør kontrollere Grønland, og hævdede, at striden har skadet hans forhold til NATO","DIIS-forsker Mikkel Runge Olesen vurderer, at retorikken forblev aggressiv, men uden eksplicit militær trussel"],"section":"Geopolitik","headline":"Mette Frederiksen: Danmark er parat til at forsvare Grønland","primarySourceUrl":"https://www.dr.dk/nyheder/indland/mette-frederiksen-danmark-er-parat-til-forsvare-groenland","subheadline":"På NATO-topmødet i Ankara afviste statsministeren Trumps fornyede krav om amerikansk kontrol med Grønland.","body":["På NATO-topmødet i Ankara 7.-8. juli slog statsminister Mette Frederiksen (Danmark) fast, at Danmark er »parat til at forsvare hver eneste centimeter af NATO, inklusive vores eget territorium«, og at Grønland ikke er til salg. Udmeldingen kom, efter at Donald Trump igen krævede amerikansk kontrol med øen.","Trump hævdede, at striden om Grønland har »skadet mit forhold til NATO«. DIIS-forsker Mikkel Runge Olesen vurderer, at retorikken forblev aggressiv, men uden eksplicit militær trussel."],"whyItMatters":"Grønland er nu et fast omdrejningspunkt mellem Danmark og USA, og sagen tvinger Danmark til at omsætte suverænitetsretorik til konkret militær tilstedeværelse i Arktis.","analysis":"At uenigheden udspiller sig på et NATO-topmøde er bemærkelsesværdigt: alliancens største magt lægger åbent pres på et mindre medlem om territorium. For Danmark er balancen at holde alliancen og samtidig markere en grænse.","topics":["grønland","forsvar","nato","rigsfællesskab","arktis"],"entities":["Mette Frederiksen","Donald Trump","NATO","Grønland","Danmark","USA","DIIS"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":64,"novelty":66,"sourceQuality":85,"personalRelevance":80,"contrast":58},"claims":[{"text":"Mette Frederiksen: Danmark er parat til at forsvare Grønland","sourceUrls":["https://www.dr.dk/nyheder/indland/mette-frederiksen-danmark-er-parat-til-forsvare-groenland"],"confidence":"high"}],"sources":[{"title":"Mette Frederiksen: Danmark er parat til at forsvare Grønland","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/mette-frederiksen-danmark-er-parat-til-forsvare-groenland","publishedAt":"2026-07-08T05:42:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/dzxdlwpi/20260708-075304-4-1920x1371web_crop001.jpg?im=AspectCrop%3D%281200%2C675%29%2 rked, hvor kinesiske open source-modeller allerede æder priserne nedefra.","topics":["ai","frontier-modeller","teknologisk suverænitet","cybersikkerhed","agenter"],"entities":["OpenAI","GPT-5.6","Sol","Terra","Luna","USA","Codex"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":78,"novelty":80,"sourceQuality":82,"personalRelevance":90,"contrast":55},"claims":[{"text":"Previewing GPT-5.6 Sol: a next-generation model","sourceUrls":["https://openai.com/index/previewing-gpt-5-6-sol/"],"confidence":"high"},{"text":"GPT-5.6-serien består af Sol, Terra og Luna og går bredt tilgængelig 9. juli 2026 efter et amerikansk gennemsyn","sourceUrls":["https://openai.com/index/previewing-gpt-5-6-sol/","https://www.neowin.net/news/openai-to-release-gpt-56-sol-terra-and-luna-on-july-9/"],"confidence":"medium"}],"sources":[{"title":"Previewing GPT-5.6 Sol: a next-generation model","publisher":"OpenAI","url":"https://openai.com/index/previewing-gpt-5-6-sol/","publishedAt":"2026-06-26T00:00:00.000Z","kind":"primary"},{"title":"OpenAI to release GPT-5.6 Sol, Terra and Luna on July 9","publisher":"Neowin","url":"https://www.neowin.net/news/openai-to-release-gpt-56-sol-terra-and-luna-on-july-9/","publishedAt":"2026-07-08T00:00:00.000Z","kind":"reporting"}],"image":{"url":"https://images.ctfassets.net/kftzwdyauwt9/48XpR5dxhE6jJQ03HTUnWZ/ac68fbfb7761fa72ac7442c6744dba56/_.png?w=1600&h=900&fit=fill","credit":"Kilde: OpenAI","alt":"OpenAIs officielle grafik for GPT-5.6 Sol","sourceUrl":"https://openai.com/index/previewing-gpt-5-6-sol/"}},{"id":"story-chai-discovery-series-c-20260715","eventKey":"chai-discovery-series-c-2026","materialFacts":["Chai Discovery (San Francisco, USA) rejste 14. juli 2026 en serie C på 400 mio. dollar, der næsten tredobler værdiansættelsen til 3,8 mia. dollar og bringer den samlede kapital op på cirka 630 mio. dollar","Runden er ledet af Index Ventures sammen med Kleiner Perkins, Sequoia Capital og Dimension; OpenAI er blandt de eksisterende investorer","Selskabet, grundlagt i 2024, bygger AI-modeller til at designe og forudsige molekylers binding, med antistoffer som kommerciel spydspids","Chais modeller bruges nu af Pfizer i en licensaftale, af Eli Lilly som kunde og af Novartis i et formelt samarbejde"],"section":"AI","headline":"Chai Discovery nabs $400M Series C as AI-designed antibodies reach Big Pharma","primarySourceUrl":"https://siliconangle.com/2026/07/14/chai-discovery-nabs-400m-series-c-ai-designed-antibodies-reach-big-pharma/","subheadline":"AI-selskabet Chai Discovery tredobler sin værdi til 3,8 mia. dollar, mens dets AI-designede antistoffer rykker ind hos Pfizer, Lilly og Novartis.","body":["Det San Francisco-baserede AI-selskab Chai Discovery (USA) har rejst 400 mio. dollar i en serie C-runde, der næsten tredobler værdiansættelsen til 3,8 mia. dollar og bringer den samlede kapital op på cirka 630 mio. dollar. Runden er ledet af Index Ventures sammen med Kleiner Perkins, Sequoia Capital og Dimension, og OpenAI er blandt de eksisterende investorer.","Chai bygger AI-modeller, der forudsiger og designer, hvordan molekyler binder sig til hinanden, med antistoffer som kommerciel spydspids. Selskabet, der blev grundlagt i 2024, oplyser, at dets modeller nu bruges af Pfizer i en licensaftale, af Eli Lilly som kunde og af Novartis i et formelt samarbejde."],"whyItMatters":"AI-designede lægemidler har længe været et løfte; her rykker de fra demonstration til aftaler med tre af verdens største medicinalselskaber.","analysis":"For en investor er de tre pharma-aftaler mere interessante end kapitalen: De validerer teknologien hos aftagere med hårde kvalitetskrav og udgør en indtægtssti, som få AI-biotekselskaber har vist.","counterpoint":"Endnu er ingen af Chais antistoffer godkendt eller i sen klinisk fase, og en licensaftale er ikke et færdigt lægemiddel – de fleste kandidater falder først i kliniske forsøg.","topics":["AI","bioteknologi","venturekapital","lægemidler"],"entities":["Chai Dis
