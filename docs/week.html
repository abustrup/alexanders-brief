","section":"Erhverv","isLead":false,"isOutsideProfile":false,"headline":"Stock Market Today, July 23: Tesla Drops 15%, Leading Tech Stock Slide","subheadline":"Alphabet leverede rekordvækst i skyen og blev straffet for at ville investere mere. Bag kursfaldet ligger et skift i, hvordan AI-udbygningen finansieres.","primarySourceUrl":"https://www.fool.com/coverage/stock-market-today/2026/07/23/stock-market-today-july-23-tesla-drops-15-leading-tech-stock-slide/","materialFacts":["Tesla faldt cirka 15 procent og Alphabet cirka 6-7 procent torsdag; Nasdaq lukkede ned 2,15 procent og S&P 500 ned 1,21 procent","Alphabet hævede capex-forventningen for 2026 til 195-205 milliarder dollar fra 180-190 milliarder trods 82 procents vækst i cloud-omsætningen","Andelen af hyperscalernes capex finansieret med ny gæld er steget fra 9 procent i FY24 til 32 procent","Tesla slog omsætningsforventningen, men leverede negativ fri pengestrøm på 1,09 milliarder dollar"],"body":["Tesla faldt torsdag cirka 15 procent og Alphabet cirka 6-7 procent, mens Nasdaq lukkede ned 2,15 procent. Alphabets kvartal var stærkt — 119,8 milliarder dollar i omsætning, 82 procents cloud-vækst — men capex-forventningen for 2026 blev hævet fra 180-190 til 195-205 milliarder dollar.","Teslas fald skyldtes ikke omsætningen, der slog forventningen med rekordleverancer på 480.126 biler, men marginer og en negativ fri pengestrøm på 1,09 milliarder dollar. Brent over 100 dollar og stigende renter trak samme vej."],"whyItMatters":"Markedet belønner ikke længere AI-investeringer per automatik; capex er blevet en risikofaktor.","analysis":"Skiftet under kurstallene er finansieringsformen: ifølge FactSet er andelen af hyperscalernes capex betalt med ny gæld steget fra 9 procent i 2024 til 32 procent.","counterpoint":"Epoch AI estimerer uafhængigt, at gruppens frie pengestrøm rammer nul i tredje kvartal 2026 — en fremskrivning, ikke et faktum.","topics":["marked","AI","investering","capex","USA"],"entities":["Tesla","Alphabet","Nasdaq","S&P 500","FactSet","Epoch AI","Amazon"],"scores":{"importance":84,"decisionValue":88,"novelty":74,"sourceQuality":76,"personalRelevance":90,"contrast":84},"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Nasdaq_Tower_May_2026.jpg/1280px-Nasdaq_Tower_May_2026.jpg","credit":"Foto: Nielsoncaetanosalmeron, CC BY 4.0, via Wikimedia Commons","alt":"Nasdaq-tårnet på Times Square i New York","sourceUrl":"https://www.fool.com/coverage/stock-market-today/2026/07/23/stock-market-today-july-23-tesla-drops-15-leading-tech-stock-slide/"},"claims":[{"text":"Tesla faldt cirka 15 procent og Alphabet cirka 6-7 procent torsdag 23. juli; Nasdaq lukkede ned 2,15 procent i 25.138 og S&P 500 ned 1,21 procent i 7.408.","sourceUrls":["https://www.fool.com/coverage/stock-market-today/2026/07/23/stock-market-today-july-23-tesla-drops-15-leading-tech-stock-slide/","https://spectrumlocalnews.com/nc/triad/business/2026/07/23/brent-oil--100-barrel"],"confidence":"high"},{"text":"Alphabet omsatte for 119,8 milliarder dollar i andet kvartal med 82 procents vækst i Google Cloud til 24,8 milliarder, og hævede capex-forventningen for 2026 til 195-205 milliarder dollar fra 180-190 milliarder.","sourceUrls":["https://finance.yahoo.com/technology/article/google-q2-earnings-top-expectations-cloud-revenue-grows-82-but-stock-falls-on-capex-growth-202407124.html"],"confidence":"high"},{"text":"Tesla slog omsætningsforventningen og satte leveringsrekord med 480.126 biler, men leverede negativ fri pengestrøm på 1,09 milliarder dollar — det første negative kvartal i over to år.","sourceUrls":["https://www.fool.com/coverage/stock-market-today/2026/07/23/stock-market-today-july-23-tesla-drops-15-leading-tech-stock-slide/"],"confidence":"medium"},{"text":"Andelen af hyperscalernes capex finansieret med ny gæld er ifølge FactSet steget fra 9 procent i FY24 til 32 procent; Alphabet rejste 84,75 milliarder dollar i aktier i juni 2026, og Amazon placerede en obligation på 25 mi ":"White House accuses Moonshot of distilling Anthropic’s Fable to build Kimi K3"},{"headline":"Stripe wants to own the toll booth between AI models, for ~$10bn","url":"https://thenextweb.com/news/stripe-openrouter-10-billion-ai-model-marketplace-acquisition","publisher":"The Next Web","section":"Teknologi","publishedAt":"2026-07-24T17:34:07.000Z","summary":"USA. Ifølge Wall Street Journal forhandler betalingsselskabet Stripe om at købe modelmarkedspladsen OpenRouter for omkring 10 milliarder dollar. OpenRouter, der giver udviklere adgang til hundredvis af sprogmodeller gennem ét interface, blev værdisat til 1,3 milliarder dollar i maj 2026. Handlen er ikke bekræftet.","text":"Stripe wants to own the toll booth between AI models, for ~$10bn"},{"headline":"Airbus anchors €500M European defence tech fund as E2D makes first investment in Alta Ares","url":"https://tech.eu/2026/07/21/airbus-anchors-500m-european-defence-tech-fund-as-e2d-makes-first-investment-in-alta-ares/","publisher":"Tech.eu","section":"Forsvar","publishedAt":"2026-07-21T13:44:59.000Z","summary":"Europa/Frankrig. Airbus går ind som ankerinvestor i E2D, forsvars- og dual-use-fonden fra AVP og Earlybird, hvis målsætning på 500 millioner euro blev meldt ud 18. juni. Første investering er i franske Alta Ares. Hverken beløbet for første lukning eller investeringens størrelse er oplyst.","text":"Airbus anchors €500M European defence tech fund as E2D makes first investment in Alta Ares"},{"headline":"AI materials science startup CuspAI raises $450M in funding","url":"https://siliconangle.com/2026/07/20/ai-materials-science-startup-cuspai-raises-450m-funding/","publisher":"SiliconANGLE","section":"Teknologi","publishedAt":"2026-07-20T22:56:04.000Z","summary":"Storbritannien/USA. Den britiske startup CuspAI har rejst 450 millioner dollar i en serie B ledet af amerikanske Kleiner Perkins og NEA med deltagelse af Bezos Expeditions, til en værdiansættelse på 2,6 milliarder dollar. Selskabet bruger AI til at designe nye materialer og lancerer konsortiet AI Materials Foundry med over 45 medlemmer, blandt andre Nvidia, Meta og Samsung.","text":"AI materials science startup CuspAI raises $450M in funding"},{"headline":"Travis Kalanick's robotics company raises $1.7B, led by a16z","url":"https://techcrunch.com/2026/07/22/travis-kalanicks-robotics-company-raises-1-7b-led-by-a16z/","publisher":"TechCrunch","section":"Erhverv","publishedAt":"2026-07-22T18:50:44.000Z","summary":"USA. Uber-stifteren Travis Kalanicks robot- og industri-AI-selskab Atoms, udsprunget af CloudKitchens, har rejst 1,7 milliarder dollar i en runde ledet af Andreessen Horowitz med deltagelse af Bain Capital og Fifth Wall. Ben Horowitz træder ind i bestyrelsen. Selskabet retter sig mod automatisering af produktion, minedrift og tung industri.","text":"Travis Kalanick's robotics company raises $1.7B, led by a16z"},{"headline":"Novo Nordisk takes action to stop multiple misleading national GLP-1 advertising campaigns by Eli Lilly","url":"https://www.globenewswire.com/news-release/2026/07/21/3330345/0/en/Novo-Nordisk-takes-action-to-stop-multiple-misleading-national-GLP-1-advertising-campaigns-by-Eli-Lilly.html","publisher":"GlobeNewswire (Novo Nordisk)","section":"Erhverv","publishedAt":"2026-07-21T11:35:00.000Z","summary":"Danmark/USA. Danske Novo Nordisk har anlagt sag mod Eli Lilly ved den føderale domstol i District of New Jersey for vildledende markedsføring. Novo mener, at Lillys reklamer for Zepbound og Mounjaro sammenligner egne maksimale doser med lavere doser af Wegovy og Ozempic og udelader den 7,2 mg Wegovy-dosis, FDA godkendte i marts 2026.","text":"Novo Nordisk takes action to stop multiple misleading national GLP-1 advertising campaigns by Eli Lilly"},{"headline":"Ida Auken bestormet af udenlandsk kritik","url":"https://nyheder.tv2.dk/politik/2026-07-23-ida-auken-bestormet-af-udenlandsk-kritik","publisher":"TV 2","section":"Indland","publishedAt":"2026-07-23T20:39:25.000Z","summary":"Danmark. Sundheds- og kirkeminister Ida Auken har ifølge TV 2 fået over 1.250 mails efter en kampagne fra den europæiske aktivistorganisation WeMove Europe, der kritiserer hendes deltagelse i Peter Thiels netværk Dialog. Kritikken går på, at Thiels selskab Palantir søger udvidet adgang til europæiske sundhedsdata. Auken oplyser, at hun aldrig har deltaget i konferencer med Thiel og ikke vil fremover.","text":"Ida Auken bestormet af udenlandsk kritik"},{"headline":"US House votes to limit Iran war for first time since ceasefire breakdown","url":"https://www.aljazeera.com/news/2026/7/23/us-house-votes-to-limit-iran-war-for-first-time-since-ceasefire-breakdown","publisher":"Al Jazeera","section":"Udland","publishedAt":"2026-07-23T16:12:43.000Z","summary":"USA. Repræsentanternes Hus vedtog torsdag med 214 mod 208 stemmer en krigsbeføjelsesresolution mod præsidentens militære operationer i Iran; fire republikanere stemte med demokraterne. Senatets tilsvarende forslag faldt dog 47-49, så afstemningen har ingen retlig virkning. Samme dag godkendte Huset et forsvarsbudget på 1,15 billioner dollar.","text":"US House votes to limit Iran war for first time since ceasefire breakdown"},{"headline":"Wildfires: More than 90,000 people flee as blazes spread in Cap Ferret and Spain","url":"https://www.irishtimes.com/world/europe/2026/07/24/wildfires-spain-declares-national-emergency-as-france-seeks-eu-help/","publisher":"The Irish Times","section":"Udland","publishedAt":"2026-07-24T18:12:00.000Z","summary":"Frankrig/Spanien. Over 90.000 mennesker er flygtet fra skovbrande: cirka 44.000 er evakueret fra Cap Ferret-halvøen i det sydvestlige Frankrig, hvor over 12.500 hektar er brændt, og 31.000 ved Biscarrosse. Spanien har erklæret national undtagelsestilstand, to brande er smeltet sammen uden for Madrid, og begge lande har aktiveret EU's civilbeskyttelsesmekanisme.","text":"Wildfires: More than 90,000 people flee as blazes spread in Cap Ferret and Spain"},{"headline":"Bangladesh President Mohamme
