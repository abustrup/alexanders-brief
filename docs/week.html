  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;

","erhverv","EU-regulering"],"entities":["Novo Nordisk","Wegovy","semaglutid","EU-Kommissionen","EMA"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":90,"decisionValue":86,"novelty":72,"sourceQuality":88,"personalRelevance":74,"contrast":55},"claims":[{"text":"EU-Kommissionen godkendte 15. juli 2026 en oral udgave af Wegovy med 25 mg semaglutid som den første GLP-1-vægttabspille i hele EU, samtidig med en ny 7,2 mg-pen.","sourceUrls":["https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu"],"confidence":"high"}],"sources":[{"title":"Novo Nordisk får grønt lys til vægttabspille i EU","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu","publishedAt":"2026-07-15T12:00:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/oujpen2a/317.png?im=AspectCrop%3D%28700%2C394%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%28700%2C394%29","credit":"Kilde: DR","alt":"Novo Nordisks vægttabsmiddel Wegovy – EU godkender nu en oral pilleudgave","sourceUrl":"https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu"}},{"id":"story-eu-google-agents-20260719","eventKey":"eu-dma-google-android-ai-agents-2026-07","section":"Teknologi","isLead":false,"isOutsideProfile":false,"headline":"Google must open Android to rival AI agents, EU orders","primarySourceUrl":"https://www.computerworld.com/article/4198420/google-must-open-android-to-rival-ai-agents-eu-orders.html","subheadline":"EU-Kommissionen kræver, at konkurrerende AI-assistenter får samme adgang til Androids funktioner som Googles egen Gemini.","materialFacts":["EU-Kommissionen udsendte 16. juli 2026 specifikationsvejledning efter Digital Markets Act, som pålægger Google (USA) at give konkurrerende AI-assistenter samme adgang til Androids enhedsfunktioner og operativsystemtjenester som Gemini","En anden afgørelse pålægger Google at dele Google Search-data i stor skala med konkurrerende søgemaskiner; ifølge omtalen begynder deling af anonymiserede søgedata i januar 2027","Google advarer om, at tiltagene 'risikerer at underminere afgørende beskyttelse af privatliv og sikkerhed for millioner af europæere'"],"body":["EU-Kommissionen udsendte 16. juli specifikationsvejledning under Digital Markets Act, som pålægger Google at give konkurrerende AI-assistenter samme adgang til Androids enhedsfunktioner som selskabets egen Gemini.","En parallel afgørelse pålægger Google at dele søgedata i stor skala med konkurrerende søgemaskiner fra januar 2027. Google svarer, at tiltagene risikerer at underminere beskyttelsen af privatliv og sikkerhed for millioner af europæere."],"whyItMatters":"Assistenten er ved at blive det lag, brugeren faktisk møder på en telefon. Kan Kommissionen tvinge det lag åbent, får europæiske AI-selskaber en distributionskanal, de ellers ikke kan købe sig til — markedsadgang frem for bøder.","analysis":"Vejledningen er forebyggende frem for straffende: Kommissionen beskriver kravet, inden overtrædelsen er konstateret. Det gør efterlevelsen hurtigere, men flytter Kommissionen tættere på at designe produktarkitektur.","topics":["AI","regulering","EU","teknologisk suverænitet","agenter"],"entities":["EU-Kommissionen","Google","Gemini","Henna Virkkunen","Digital Markets Act"],"scores":{"importance":86,"decisionValue":84,"novelty":74,"sourceQuality":82,"personalRelevance":85,"contrast":70},"primaryExcerpt":{"quote":"With today's measures, we want to support innovation and diversity in the European Union, enabling fair competition in the markets of AI.","sourceUrl":"https://digital-strategy.ec.europa.eu/en/news/commission-provides-guidance-google-ai-interoperability-android-and-sharing-google-search-data","sourceTitle":"Commission provides guidance to Google on AI interoperability on Android and sharing of Google Search data"},"image":{"url":"https://www.computerworld.com/wp-content/uploads/2026/07/4198420-0-34303800-1784299031-shutterstock_2548864541.jpg","credit":"Foto: Shutterstock via Computerworld","alt":"Logoer for AI-assistenter, blandt andre ChatGPT, Gemini, Copilot, Claude og Perplexity","sourceUrl":"https://www.computerworld.com/article/4198420/google-must-open-android-to-rival-ai-agents-eu-orders.html"},"claims":[{"text":"EU-Kommissionen udsendte 16. juli 2026 DMA-specifikationsvejledning, som pålægger Google at give konkurrerende AI-assistenter samme adgang til Androids funktioner som Gemini.","sourceUrls":["https://digital-strategy.ec.europa.eu/en/news/commission-provides-guidance-google-ai-interoperability-android-and-sharing-google-search-data","https://www.computerworld.com/article/4198420/google-must-open-android-to-rival-ai-agents-eu-orders.html"],"confidence":"high"},{"text":"En anden afgørelse pålægger Google at dele Google Search-data med konkurrerende søgemaskiner; deling af anonymiserede søgedata begynder efter det oplyste i januar 2027.","sourceUrls":["https://www.computerworld.com/article/4198420/google-must-open-android-to-rival-ai-agents-eu-orders.html"],"confidence":"medium"}],"sources":[{"title":"Google must open Android to rival AI agents, EU orders","publisher":"Computerworld","url":"https://www.computerworld.com/article/4198420/google-must-open-android-to-rival-ai-agents-eu-orders.html","publishedAt":"2026-07-17T07:00:00.000Z","kind":"reporting"},{"title":"Commission provides guidance to Google on AI interoperability on Android and sharing of Google Search data","publisher":"Europa-Kommissionen","url":"https://digital-strategy.ec.europa.eu/en/news/commission-provides-guidance-google-ai-interoperability-android-and-sharing-google-search-data","publishedAt":"2026-07-16T10:00:00.000Z","kind":"primary"}]},{"id":"story-sap-prior-labs-20260719","eventKey":"sap-prior-labs-acquisition-completed-2026-07","section":"Teknologi","isLead":false,"isOutsideProfile":false,"headline":"SAP acquires Prior Labs just 18 months after launch in €1B+ deal","primarySourceUrl":"https://tech.eu/2026/07/17/sap-acquires-prior-labs-just-18-months-after-launch-in-eur1b-deal","subheadline":"Tysklands største softwarehus lukker købet af en tysk grundmodel-startup og lover over en milliard euro til et europæisk frontier-laboratorium.","materialFacts":["SAP SE (Walldorf, Tyskland) bekræftede 17. juli 2026, at opkøbet af Prior Labs er gennemført; aftalen blev indgået i maj 2026, så dette er lukningen","SAP forpligter sig til at investere over 1 mia. euro i Prior Labs over fire år; laboratoriet i Freiburg beholder eget brand, ledelse, forskningsdagsorden og åben publicering","Prior Labs havde kun rejst 9 mio. euro i februar 2025 fra Balderton Capital (Storbritannien), Atlantic Labs (Tyskland) og XTX Ventures (Storbritannien); TabPFN-modellerne er publiceret i Nature og downloadet over 3 mio. gange"],"body":["SAP SE i Walldorf bekræftede fredag, at købet af Prior Labs er gennemført. Laboratoriet i Freiburg, grundlagt i 2024, bygger grundmodeller til tabeldata — regneark og databaser frem for tekst og billeder.","SAP lover over 1 mia. euro over fire år og beskriver ambitionen som et førende frontier-AI-laboratorium i Europa. Prior Labs beholder brand, ledelse og åben publicering. Selskabet havde rejst 9 mio. euro i februar 2025."],"whyItMatters":"Et europæisk deeptech-selskab går fra én runde på 9 mio. euro til et milliardudfald på cirka 15 måneder — det hurtige, store exit, europæisk venturekapital sjældent kan pege på.","analysis":"Det interessante er ikke prisen, men strukturen: SAP køber en forskningsfunktion og betaler for at lade den forblive selvstændig og åben. Tabeldata er samtidig det domæne, hvor SAP allerede sidder på kunderne. Modellen skal ikke slå ChatGPT, men den regressionsanalyse, en controller kører i dag.","topics":["venturekapital","AI","opkøb","teknologisk suverænitet","deeptech"],"entities":["SAP SE","Prior Labs","Frank Hutter","Balderton Capital","Tyskland"],"scores":{"importance":86,"decisionValue":85,"novelty":74,"sourceQuality" re og et kontekstvindue på 1 mio. tokens","Prisen er 0,30 dollar per mio. cache-hit-input-tokens, 3,00 dollar per mio. cache-miss-input-tokens og 15,00 dollar per mio. output-tokens; modellen scorer 67,3 på DeepSWE og ligger efter Claude Fable 5 og GPT-5.6 Sol i laboratoriets egne sammenligninger","Åbne modelvægte er varslet til 27. juli 2026; udgivelsen faldt sammen med et fald på cirka 1 procent i Nasdaq, hvor investorer solgte ud af chipproducenter, herunder Nvidia (USA)"],"body":["Moonshot AI i Kina offentliggjorde midt i sidste uge Kimi K3, en model på 2,8 billioner parametre med et kontekstvindue på 1 mio. tokens. Modelvægtene er varslet frigivet 27. juli, hvilket ville gøre K3 til den største åbent tilgængelige model til dato.","Moonshot placerer selv K3 efter Claude Fable 5 og GPT-5.6 Sol, med 67,3 på kodebenchmarken DeepSWE. Udgivelsen faldt sammen med et fald på cirka 1 procent i Nasdaq, hvor investorer solgte ud af chipproducenter."],"whyItMatters":"Frigives vægtene 27. juli, kan enhver europæisk virksomhed køre en model tæt på frontlinjen på egen infrastruktur. Det flytter teknologisk suverænitet fra adgang til beregningskraft.","analysis":"Benchmarktallene er selvrapporterede fra en leverandørblog. Det efterprøvbare er prislisten og datoen. Moonshot indrømmer at ligge efter de amerikanske modeller og udgiver alligevel — konkurrenceparameteren er pris og åbenhed, ikke førstepladsen.","topics":["AI","åbne modeller","Kina","teknologisk suverænitet","benchmarks"],"entities":["Moonshot AI","Kimi K3","Nvidia","Kina","OpenAI"],"scores":{"importance":84,"decisionValue":76,"novelty":82,"sourceQuality":68,"personalRelevance":88,"contrast":76},"image":{"url":"https://techcrunch.com/wp-content/uploads/2026/01/GettyImages-2254580342.jpg?w=1024","credit":"Foto: Getty Images via TechCrunch","alt":"Kimi-branding fra det kinesiske AI-laboratorium Moonshot AI","sourceUrl":"https://techcrunch.com/2026/07/18/kimi-threat-or-menace/"},"claims":[{"text":"Kimi K3 har 2,8 billioner parametre, 1 mio. tokens kontekst og scorer 67,3 på DeepSWE ifølge Moonshot AI's egen offentliggørelse; vægtene er varslet til 27. juli 2026.","sourceUrls":["https://www.kimi.com/blog/kimi-k3"],"confidence":"medium"},{"text":"Udgivelsen af Kimi K3 udløste et fald på cirka 1 procent i Nasdaq, hvor investorer solgte ud af chipproducenter, herunder Nvidia.","sourceUrls":["https://techcrunch.com/2026/07/18/kimi-threat-or-menace/"],"confidence":"medium"}],"sources":[{"title":"Kimi K3: Open Frontier Intelligence","publisher":"Moonshot AI","url":"https://www.kimi.com/blog/kimi-k3","publishedAt":"2026-07-17T02:00:00.000Z","kind":"primary"},{"title":"Kimi: Threat or menace?","publisher":"TechCrunch","url":"https://techcrunch.com/2026/07/18/kimi-threat-or-menace/","publishedAt":"2026-07-18T18:51:00.000Z","kind":"analysis"}]},{"id":"story-eu-missilforsvar-20260714","eventKey":"european-missile-defense-coalition-2026","materialFacts":["Danmark tilslutter sig en koalition af ti lande (Frankrig, Tyskland, Italien, Nederlandene, Norge, Spanien, Sverige, Storbritannien og Ukraine), der vil opbygge et integreret europæisk forsvar mod ballistiske missiler, præsenteret mandag i Paris under Mette Frederiksens besøg hos Emmanuel Macron","Danmarks bidrag er radarsystemer; radarvirksomheden Weibel Scientific fra Allerød deltog i mødet i Paris og skal være med til at udvikle systemet","Frederiksen forventer, at projektet går i gang inden udgangen af 2026, og erklærer som mål, at Europa selv skal producere kapaciteter frem for at være afhængig af USA","Ukraine tiltænkes en nøglerolle i arkitekturen"],"section":"Forsvar","headline":"Danmark går sammen med en række lande om at opbygge europæisk missilforsvar","primarySourceUrl":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","subheadline":"Ti lande – med Ukraine i en nøglerolle – vil bygge et fælles værn mod ballistiske missiler. Danmark bidrager med radarteknologi, og Weibel Scientific var med i Paris.","body":["Danmark tilslutter sig en koalition af ti lande, der vil opbygge et integreret europæisk forsvar mod ballistiske missiler. Beslutningen blev præsenteret mandag i Paris under Mette Frederiksens besøg hos Emmanuel Macron, og kredsen tæller også Tyskland, Storbritannien, Italien, Nederlandene, Norge, Spanien og Sverige – samt Ukraine i en nøglerolle.","Det danske bidrag er radarsystemer, og Allerød-virksomheden Weibel Scientific deltog i mødet i Paris og skal være med til at udvikle systemet. Statsministeren forventer, at projektet går i gang allerede i 2026, og formulerede målet direkte: Europa skal selv kunne producere de kapaciteter, som kontinentet i dag køber i USA."],"whyItMatters":"Missilforsvar er et af de områder, hvor Europas afhængighed af amerikansk teknologi er størst; en fælles arkitektur flytter efterspørgsel og udviklingsmidler til europæiske – herunder danske – leverandører.","analysis":"For dansk forsvarsindustri er signalværdien betydelig: Får Weibel en rolle i radarlaget af et europæisk missilskjold, rykker Danmark fra kunde til systemleverandør. Finansiering og kommandostruktur er endnu ikke offentliggjort – og det er erfaringsmæssigt dér, fælleseuropæiske forsvarsprojekter forsinkes.","topics":["forsvar","missilforsvar","teknologisk suverænitet","Europa"],"entities":["Danmark","Mette Frederiksen","Weibel Scientific","Frankrig","Ukraine"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":70,"novelty":78,"sourceQuality":85,"personalRelevance":90,"contrast":55},"claims":[{"text":"Danmark indgår i en koalition af ti lande – heriblandt Frankrig, Tyskland, Storbritannien og Ukraine – der vil opbygge et integreret europæisk missilforsvar, annonceret i Paris mandag den 13. juli 2026.","sourceUrls":["https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","https://www.euronews.com/my-europe/2026/07/13/nine-european-countries-and-ukraine-form-anti-ballistic-missile-coalition"],"confidence":"high"},{"text":"Danmarks bidrag er radarsystemer, og Weibel Scientific deltog i mødet i Paris; Mette Frederiksen forventer, at projektet starter i 2026.","sourceUrls":["https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar"],"confidence":"high"}],"sources":[{"title":"Danmark går sammen med en række lande om at opbygge europæisk missilforsvar","publisher":"DR","url":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar","publishedAt":"2026-07-13T18:40:00.000Z","kind":"reporting"},{"title":"Nine European countries and Ukraine form anti-ballistic missile coalition","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/07/13/nine-european-countries-and-ukraine-form-anti-ballistic-missile-coalition","publishedAt":"2026-07-13T16:31:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/mmolxrv3/20260713-173821-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Foto: DR","alt":"Mette Frederiksen ved mødet i Paris, hvor ti lande præsenterede planen om et fælles europæisk missilforsvar","sourceUrl":"https://www.dr.dk/nyheder/udland/danmark-gaar-sammen-med-en-raekke-lande-om-opbygge-europaeisk-missilforsvar"}},{"id":"story-lindsey-graham-death-20260713","eventKey":"lindsey-graham-death-2026-07","materialFacts":["US Senator Lindsey Graham (Republican, South Carolina) died at age 71 on the night of Saturday, July 11, 2026, hours after returning from a trip to Ukraine where he had met President Volodymyr Zelenskyy; his office said he died from a 'brief and sudden illness.'","The preliminary cause of death, per medical examiner findings released July 12, 2026, is aortic dissection (a tear/rupture of the aortic wall) due to arteriosclerotic cardiovascular disease; EMS responded to a cardiac-arrest call at his Capitol Hill home.","Graham was first elected to the US Senate in 2002 (serving since 2003), had recently won his Republican primary, and was seeking a fifth term in the November 3, 2026 election.","Under South Carolina law, Republican Governor Henry McMaster appoints an interim replacement, who would serve until January 3, 2027."],"section":"Politik","headline":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","primarySourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","subheadline":"Den mangeårige republikanske senator fra South Carolina døde natten til søndag, kort efter en rejse til Ukraine.","body":["Senator Lindsey Graham (R-South Carolina) døde 71 år gammel natten til søndag den 11. juli, timer efter et besøg hos præsident Zelenskyj i Ukraine. Retsmedicinernes foreløbige konklusion 12. juli peger på en aortadissektion som følge af åreforkalkning efter et hjertestop i hjemmet.","Graham blev valgt til Senatet i 2002 og stillede op til en femte periode 3. november. Efter South Carolinas lov udpeger guvernør Henry McMaster (R) nu en midlertidig afløser frem til 3. januar 2027, hvorefter pladsen besættes ved midtvejsvalget."],"whyItMatters":"Grahams død fjerner en af Trumps mest markante udenrigspolitiske allierede i Senatet og udløser et opgør om en sikker republikansk plads.","analysis":"Med en snæver magtbalance kan selv én tom plads påvirke afstemninger, og nomineringskampen tester Trump-fløjens styrke i South Carolina.","topics":["politik","USA","Senatet","valg"],"entities":["Lindsey Graham","USA","South Carolina","Henry McMaster","Donald Trump"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":45,"novelty":88,"sourceQuality":88,"personalRelevance":40,"contrast":55},"claims":[{"text":"US Senator Lindsey Graham (R-South Carolina) died at 71 on the night of Saturday, July 11, 2026, confirmed by his office and multiple independent outlets.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies"],"confidence":"high"},{"text":"Preliminary medical examiner findings give the cause of death as aortic dissection due to arteriosclerotic cardiovascular disease.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/"],"confidence":"high"},{"text":"Graham died hours after returning from a trip to Ukraine and had been seeking a fifth Senate term in the November 3, 2026 election.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"],"confidence":"high"}],"sources":[{"title":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","publisher":"CBS News","url":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","publishedAt":"2026-07-13T00:51:00.000Z","kind":"reporting"},{"title":"Lindsey Graham dies of aortic dissection, preliminary medical report says","publisher":"The Washington Post","url":"https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"},{"title":"Sen. Lindsey Graham of South Carolina, Trump ally, dies at 71","publisher":"NPR","url":"https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"}],"image":{"url":"https://assets2.cbsnewsstatic.com/hub/i/r/2026/07/12/b382a83e-fc49-460b-9f9a-8c8e3539c038/thumbnail/620x413/92887803139a33088d75d95a066274f3/gettyimages-2259262756.jpg","credit":"Kilde: CBS News / Getty Images","alt":"Portræt i forbindelse med senator Lindsey Grahams død","sourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"}},{"id":"story-thinking-machines-20260717","eventKey":"thinking-machines-inkling-open-model-2026-07","materialFacts":["Thinking Machines Lab, grundlagt af tidligere OpenAI-teknologidirektør Mira Murati, udgav 15. juli 2026 sin første egne model, Inkling","Inkling er open-weight og en mixture-of-experts med 975 mia. parametre, hvoraf kun ca. 41 mia. aktiveres per opgave, trænet på 45 billioner tokens tekst, billede, lyd og video","Udviklerne erkender, at Inkling ikke er den stærkeste samlede model, der findes i dag, åben eller lukket"],"section":"Teknologi","headline":"Thinking Machines amps up its bet against one-size-fits-all AI with its first open model, Inkling","primarySourceUrl":"https://techcrunch.com/2026/07/15/thinking-machines-amps-up-its-bet-against-one-size-fits-all-ai-with-its-first-open-model-inkling/","subheadline":"Mira Muratis hemmelighedsfulde AI-laboratorium satser på åbne vægte, hvor OpenAI og Anthropic holder deres modeller lukkede.","body":["Mira Muratis Thinking Machines Lab udgav 15. juli 2026 sin første egne model, Inkling. Den er open-weight og en mixture-of-experts med 975 mia. parametre, hvoraf kun ca. 41 mia. aktiveres per opgave. Modellen er trænet på 45 billioner tokens tekst, billede, lyd og video.","Selskabet lægger dermed sin strategi åbent frem, hvor OpenAI, Anthropic og Google holder deres stærkeste modeller lukkede. Murati erkender samtidig, at Inkling ikke er den stærkeste samlede model i dag – åben eller lukket."],"whyItMatters":"Det er det første konkrete produkt fra et af de mest fulgte navne i AI, og valget af åbne vægte placerer det midt i striden om, hvorvidt frontier-AI skal distribueres eller indhegnes.","analysis":"At modellen ikke er stærkest, men alligevel åben, er pointen: værdien ligger i distribution og økosystem, ikke topydelse. Men kan en åben strategi finansiere de næste dyre træningskørsler?","topics":["AI","open- parlamentsmedlemmer, herunder Villy Søvndal (SF) — har skrevet åbent brev til det danske værft Fayard i Munkebo og direktør Thomas Andersen","Fayard er ifølge brevet det sidste værft i EU, der servicerer Arc7-flåden, efter at Damen Shiprepair Brest i Frankrig stoppede i 2024; op til seks Arc7-tankere ventes at have brug for vedligehold, før EU's LNG-embargo træder i kraft i januar 2027","Hver tanker har i gennemsnit fragtet 5,3 mio. ton LNG til en anslået lastværdi omkring 4 mia. euro siden Ruslands invasion af Ukraine; Fayard svarer, at værftet efterlever EU-beslutninger, og at opgaverne ophører ved årets udgang"],"body":["101 parlamentarikere fra 16 lande — heriblandt Villy Søvndal (SF) — har skrevet åbent brev til det fynske værft Fayard i Munkebo. Kravet er, at værftet stopper med at servicere Arc7-tankerne, der fragter russisk arktisk LNG.","Ifølge brevet er Fayard det sidste værft i EU, der tager skibene, efter at franske Damen Shiprepair Brest holdt op i 2024. Op til seks tankere ventes at have brug for vedligehold, før EU's LNG-embargo træder i kraft i januar 2027."],"whyItMatters":"Sagen viser, hvor et sanktionsregime holder op med at være politik og bliver til driftsbeslutninger i én virksomhed. Embargoen gælder gassen fra januar 2027, ikke vedligeholdelsen i mellemtiden.","analysis":"Fayards svar — at værftet efterlever EU's beslutninger — er formelt korrekt: der er intet forbud at overtræde endnu. Men skal seks skibe gennem tungt vedligehold, før embargoen bider, afgør værftskapaciteten, om flåden er sejlklar bagefter.","topics":["sanktioner","russisk LNG","maritim industri","EU","Ukraine"],"entities":["Fayard","Thomas Andersen","Villy Søvndal","Danmark","Rusland"],"scores":{"importance":80,"decisionValue":74,"novelty":74,"sourceQuality":74,"personalRelevance":80,"contrast":78},"image":{"url":"https://static.euobserver.com/2026/07/11-17.jpg","credit":"Foto: EUobserver","alt":"Isforstærket Arc7-tankskib af den type, der fragter russisk arktisk LNG","sourc ing bill","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/15/french-parliament-approves-landmark-assisted-dying-bill","subheadline":"Efter årelang strid tillader Frankrig nu aktiv dødshjælp under betingelser.","body":["Frankrigs Nationalforsamling vedtog 15. juli 2026 den endelige tekst til en lov om aktiv dødshjælp efter årelang strid. Loven gør det under nærmere betingelser muligt for voksne med en alvorlig, uhelbredelig lidelse at få hjælp til at dø.","Vedtagelsen afslutter en af de mest følelsesladede processer i nyere fransk politik, hvor spørgsmålet har delt partier, lægestand og kirke. Modstandere advarer om pres på sårbare patienter; tilhængere fremhæver retten til en værdig død."],"whyItMatters":"Frankrig slutter sig til en mindre gruppe europæiske lande, der tillader en form for aktiv dødshjælp, og flytter en central etisk grænse i et af EU's største lande.","analysis":"Loven viser, hvordan et sekulært samfund gradvist omdefinerer forholdet mellem individuel autonomi og statens beskyttelse af livet. Den reelle prøve bliver implementeringen: sikkerhedsmekanismer, der forhindrer misbrug uden at gøre retten illusorisk.","topics":["etik","Frankrig","sundhed","lovgivning"],"entities":["Frankrig","Nationalforsamlingen","aktiv dødshjælp"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":82,"decisionValue":66,"novelty":74,"sourceQuality":84,"personalRelevance":58,"contrast":78},"claims":[{"text":"Frankrigs Nationalforsamling vedtog 15. juli 2026 den endelige tekst til en lov, der under betingelser tillader aktiv dødshjælp for voksne med en alvorlig og uhelbredelig lidelse.","sourceUrls":["https://www.aljazeera.com/news/2026/7/15/french-parliament-approves-landmark-assisted-dying-bill","https://www.france24.com/en/france/20260715-france-expected-to-pass-final-vote-on-assisted-dying-after-years-of-debate"],"confidence":"high"}],"sources":[{"title":"French Parliament approves landmark assisted-dying bill","publisher":"Al Jazeera","url":"https:/   function renderWeekly(brief) {

  // src/web/renderArchive.js
  function weekLabel(weekId) {
    const match = /^\d{4}-W(\d{2})$/.exec(weekId ?? "");
    return match ? `Uge ${Number(match[1])}` : weekId ?? "";
  }
  function periodEntry(entry, label) {
    if (entry.frozen) {
      const link = element("a", "archive-entry archive-entry-link", label);
      link.href = `${entry.id}.html`;
      link.addEventListener("click", (event) => event.stopPropagation());
      return link;
    }
    const span = element("span", "archive-entry archive-entry-empty", label);
    span.setAttribute("aria-disabled", "true");
    return span;
  }
  function renderMonth(month) {
    const box = element("details", "archive-month");
    const summary = element("summary", "archive-month-summary");
    summary.append(periodEntry(month, monthLabelFor(month.id)));
    box.append(summary);
    const weeks = element("ul", "archive-weeks");
    for (const week of month.weeks) {
      const item = element("li", "archive-week");
      item.append(periodEntry(week, weekLabel(week.id)));
      weeks.append(item);
    }
    box.append(weeks);
    return box;
  }
  function renderArchiveBrowser(index) {
    const root = element("div", "archive-browser");
    const years = index?.years ?? [];
    if (years.length === 0) {
      root.append(element("p", "archive-empty", "Arkivet er tomt indtil videre."));
      return root;
    }
    years.forEach((year, yearIndex) => {
      const box = element("details", "archive-year");
      if (yearIndex === 0) box.open = true;
      const summary = element("summary", "archive-year-summary");
      summary.append(periodEntry({ id: year.id, frozen: year.frozen }, String(year.year)));
      box.append(summary);
      for (const month of year.months) {
        box.append(renderMonth(month));
      }
      root.append(box);
    });
    return root;
  }

  // src/web/app.js
  function renderBrief(brief) {

    document.querySelector("#brief-reading-time").textContent = `${brief.readingMinutes} minutters l\xE6sning`;
    document.querySelector("#brief-title").textContent = BRAND;
    document.querySelector("#brief-dek").textContent = brief.dek;
    const keyNumberSlot = document.querySelector("#key-number-slot");
    if (keyNumberSlot) {

      keyNumberSlot.replaceChildren(...keyNumberPanel ? [keyNumberPanel] : []);
      keyNumberSlot.hidden = !keyNumberPanel;
    }

    const storyGrid2 = document.querySelector("#story-grid");
    const leadSignals = document.querySelector("#lead-signals");
    const shortNews = document.querySelector("#short-news");
    const shortNewsSection = document.querySelector("#short-news-section");
    leadContainer.replaceChildren();
    storyGrid2.replaceChildren();
    leadSignals.replaceChildren(element("h2", "signals-title", "Morgenens signaler"));
    shortNews.replaceChildren();
    for (const story of brief.stories) {
      (story.isLead ? leadContainer : storyGrid2).append(renderStory(story));
    }
    for (const signal of brief.signals.slice(0, 4)) {
      leadSignals.append(renderSignal(signal));
    }
    const remainingSignals = brief.signals.slice(4);
    for (const signal of remainingSignals) shortNews.append(renderSignal(signal));
    shortNewsSection.hidden = remainingSignals.length === 0;
    renderRecommendations(brief.recommendations);
    renderQualityFooter(brief.quality);
  }
  async function sendFeedback(button, transport, reason) {
    const article = button.closest("article");
    const direction = button.dataset.direction ?? article.querySelector('[aria-pressed="true"]')?.dataset.direction;
    const isRecommendation = article.dataset.contentType === "recommendation";
    const payload = {
      storyId: article.dataset.storyId,
      browserId: getBrowserId(),
      direction,
      ...isRecommendation ? { contentType: "recommendation" } : {},
      ...reason ? { reason } : {},

    const applyState = (active) => {

        control.classList.toggle("is-selected", pressed);
      });
    };

    const reasonsPanel = article.querySelector(".feedback-reasons");
    if (reasonsPanel) reasonsPanel.hidden = false;
    localStorage.setItem(
      feedbackStorageKey(payload.storyId, payload.contentType),
      direction

    const status = document.querySelector("#feedback-status");
    if (status) status.textContent = "Feedback gemt";
    if (direction === "more" && !isRecommendation) {
      const headlineLink = article.querySelector(".headline-link");
      if (headlineLink) {
        recordSaved({
          id: article.dataset.storyId,
          headline: headlineLink.textContent,
          url: headlineLink.href
        });
      }
    }
    try {
      await transport(payload);
    } catch (error) {
      applyState(false);
      if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      throw error;
    }
    return payload;
  }
  function appsScriptTransport(payload) {
    if (!globalThis.google?.script?.run) {

    return new Promise((resolve, reject) => {
      globalThis.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveFeedback(payload);
    });
  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {
    const response = await fetcher(feedbackUrl(), {

      redirect: "follow",

  function defaultFeedbackTransport() {

    return () => Promise.resolve({ status: "saved-local" });
  }
  function bindFeedback(transport = defaultFeedbackTransport()) {
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-direction], button[data-reason]");
      if (!button) return;
      try {
        const directionButton = button.dataset.direction ? button : button.closest("article").querySelector('[data-direction][aria-pressed="true"]');
        if (!directionButton) return;
        await sendFeedback(directionButton, transport, button.dataset.reason);
      } catch {
        document.querySelector("#feedback-status").textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".headline-link, .primary-source-link, .read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);

  }
  function pickDanishVoice(synth) {

  }

  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";

      toggleButton.setAttribute("aria-pressed", String(active));

  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }

  }
  function boot(brief = globalThis.__BRIEF_DATA__) {

    applyLayout();
    if (kind === "weekly") {
