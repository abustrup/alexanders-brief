<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.edition-tab,
.layout-tab {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;

issions have rapidly worsened European heatwaves in just a few decades","publisher":"World Weather Attribution","url":"https://www.worldweatherattribution.org/fossil-fuel-emissions-have-rapidly-worsened-european-heatwaves-in-just-a-few-decades/","publishedAt":"2026-06-26T06:00:00Z","kind":"analysis"}]},{"id":"story-russia-fuel-crisis-20260629","eventKey":"russia-fuel-crisis-ukraine-refinery-strikes-2026-06","materialFacts":["Putin erkendte 28. juni russiske brændstofforsyningsproblemer med køer ved tankstationer og trussel mod høsten","Dieselprisen ramte rekord 77.177 rubler pr. ton på SPIMEX-børsen, en stigning på 23 procent siden april","Ukraine angreb to russiske raffinaderier i Slavjansk i Krasnodar og i Jaroslavl"],"section":"Sikkerhed","headline":"Russere kører tomhændede fra tankstationer – nu reagerer Putin","primarySourceUrl":"https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin","subheadline":"Ukraines angreb på russiske raffinaderier presser brændstofmarkedet så hårdt, at præsidenten nu erkender problemerne","body":["Vladimir Putin erkendte 28. juni offentligt, at Rusland har brændstofproblemer: \"Vi kan se problemerne, vi er klar over dem og reagerer på dem,\" sagde han om køer ved tankstationer og en trussel mod høsten. En sjælden indrømmelse fra Kreml.","Baggrunden er ukrainske langtrækkende angreb på russiske raffinaderier; senest blev anlæg i Slavjansk i Krasnodar og i Jaroslavl ramt. Dieselprisen nåede rekorden 77.177 rubler pr. ton på SPIMEX-børsen, 23 procent over april."],"whyItMatters":"Når Kreml indrømmer mangel ved pumperne, viser det, at Ukraines angreb på energiinfrastruktur dybt i Rusland nu rammer krigsøkonomien – ikke kun militære mål.","analysis":"Brændstof er Ruslands stærkeste eksportkort og samtidig en akilleshæl: rammes raffinaderierne, stiger priserne hjemme, mens eksportindtægterne falder. Kreml overvejer nu et dieseleksportforbud.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/ed kere stiller spørgsmål ved elforbrug og nettilslutning"],"section":"Teknologi","headline":"Ministerium skjuler investor bag kæmpe datacenter: Big tech titter frem i papirerne","primarySourceUrl":"https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik","subheadline":"Et stort datacenter i Vestjylland er omgivet af mystik, mens myndighederne holder den udenlandske ejer skjult","body":["Et planlagt hyperscale-datacenter ved Stovstrup i Ringkøbing-Skjern Kommune er omgærdet af usædvanlig hemmelighed. Ifølge Version2 hemmeligholder et ministerium den reelle investors identitet, men spor i dokumenterne peger på en stor amerikansk techvirksomhed.","Sagen rejser to spørgsmål: hvem der reelt ejer kritisk infrastruktur på dansk jord, og hvad den koster på elnettet. Kritikere spørger, hvorfor strømslugende anlæg får gunstige vilkår, mens forbrugerne mærker pres på elpriserne."],"whyItMatters":"Skjult udenlandsk ejerskab af digital infrastruktur rammer direkte ind i debatten om teknologisk suverænitet – og om, hvor meget dansk strøm der skal gå til andre landes databehov.","analysis":"Når en myndighed afskærmer en investors navn, kolliderer ønsket om at tiltrække investeringer med offentlighedens ret til at vide, hvem der ejer kritisk infrastruktur – og det presser både transparens og energiplanlægning.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Utah_Data_Center_Panorama_%28cropped%29.jpg/960px-Utah_Data_Center_Panorama_%28cropped%29.jpg","credit":"Foto: Wikimedia Commons","alt":"Stort hyperscale-datacenter set udefra (arkivfoto)","sourceUrl":"https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik"},"topics":["teknologi","datacentre","energi","teknologisk suverænitet","Danmark"],"entities":["Ringkøbing-Skjern Kommune","Stovstrup","Energinet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":62,"novelty":68,"sourceQuality":72,"personalRelevance":78,"contrast":60},"claims":[{"text":"Dokumenter peger på et stort amerikansk hyperscale-datacenter ved Stovstrup i Ringkøbing-Skjern Kommune.","sourceUrls":["https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik"],"confidence":"medium"},{"text":"Et ministerium hemmeligholder den reelle investors identitet.","sourceUrls":["https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik"],"confidence":"high"}],"sources":[{"title":"Ministerium skjuler investor bag kæmpe datacenter: Big tech titter frem i papirerne","publisher":"Version2","url":"https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik","publishedAt":"2026-06-26T10:15:00Z","kind":"reporting"}]},{"id":"story-dk-handshake-ruling-20260629","eventKey":"dk-supreme-court-handshake-ruling-2026","materialFacts":["Højesteret fastslog, at religiøst begrundet afvisning af håndtryk ikke kan begrunde en fyring","Blå blok vil hurtigt ændre loven; Messerschmidt siger, Højesteret har vendt danske værdier ryggen","Regeringen ved Morten Bødskov vil afvente en fuld juridisk vurdering"],"section":"Politik","headline":"Højesteretsdom udløser værdikamp i Folketinget: Blå partier vil stille krav om håndtryk med lovændring","primarySourceUrl":"https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk","subheadline":"En afgørelse om en nægtet håndhilsen genåbner en af Danmarks mest betændte integrationsstrider","body":["Højesteret har afgjort, at en medarbejder ikke lovligt kan fyres alene for af religiøse grunde at afvise at give hånd. Dommen vender op og ned på en årelang strid og udløste prompte en værdikamp i Folketinget.","Blå blok kræver en hurtig lovændring. Dansk Folkepartis Morten Messerschmidt erklærede, at \"Højesteret har vendt danske værdier ryggen,\" og vil gøre håndtryk til et ansættelseskrav. Regeringen ved Morten Bødskov vil se en juridisk vurdering først."],"whyItMatters":"Sagen handler kun overfladisk om et håndtryk. Den tvinger den nye regering til at vælge mellem en symbolsk stram udlændingelinje og respekten for en dom om religionsfrihed.","analysis":"At lovgive sig ud af en højesteretsdom er muligt, men risikabelt: et håndtrykskrav kan kollidere med menneskerettighedskonventionen og arbejdsretten. Striden bliver en tidlig prøve på regeringens værdipolitik.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Christiansborg_Slot_Copenhagen_2014_01.jpg/960px-Christiansborg_Slot_Copenhagen_2014_01.jpg","credit":"Foto: Wikimedia Commons","alt":"Christiansborg, hvor Folketinget og Højesteret holder til","sourceUrl":"https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk"},"topics":["politik","integration","retspolitik","Danmark"],"entities":["Højesteret","Morten Messerschmidt","Dansk Folkeparti","Morten Bødskov"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":62,"decisionValue":52,"novelty":66,"sourceQuality":72,"personalRelevance":55,"contrast":64},"claims":[{"text":"Højesteret fastslog, at religiøst begrundet afvisning af håndtryk ikke kan begrunde en fyring.","sourceUrls":["https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk"],"confidence":"high"},{"text":"Messerschmidt og blå blok kræver lovændring med håndtrykskrav; regeringen ved Bødskov afventer juridisk vurdering.","sourceUrls":["https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk"],"confidence":"high"}],"sources":[{"title":"Højesteretsdom udløser værdikamp i Folketinget: Blå partier vil stille krav om håndtryk med lovændring","publisher":"Altinget","url":"https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk","publishedAt":"2026-06-28T00:00:00Z","kind":"reporting"}]},{"id":"story-nasa-swift-boost-20260629","eventKey":"nasa-swift-boost-robotic-rescue-2026","materialFacts":["NASA gør klar til at sende en robotservicer for at redde det 22 år gamle Swift-observatorium fra at falde ned","Servicerobotten LINK fra Katalyst Space skal gribe og hæve Swift over flere måneder","Det bliver første gang, en ikke-servicerbar amerikansk statssatellit reddes på den måde; opsendelse tidligst 30. juni"],"section":"Videnskab","headline":"Partners, NASA Ready for June Launch of Swift Boost Mission","primarySourceUrl":"https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/","subheadline":"For første gang vil en robot gribe og redde en aldrende NASA-satellit, der aldrig var bygget til at blive serviceret","body":["NASA er klar til at forsøge noget hidtil ugjort: at sende en robot op for at gribe og redde det 22 år gamle rumteleskop Neil Gehrels Swift Observatory, før det falder ned. Øget solaktivitet har bremset satellitten, og uden indgreb ville den styrte i 2026. Opsendelsen sker tidligst 30. juni fra Kwajalein-atollen.","Servicerobotten LINK fra Katalyst Space vejer omkring 400 kilo og skal med tre robotarme og ionmotorer gribe Swift og over måneder løfte den i en højere bane. Satellitten fra 2004 var aldrig bygget til servicering."],"whyItMatters":"Lykkes det, sætter missionen præcedens for at forlænge levetiden på satellitter, der aldrig var tænkt til reparation – med betydning for rumaffald og en ny servicebranche i kredsløb.","analysis":"Swift Boost tester kommerciel robotservicering på værdifulde aktiver i kredsløb. En succes ville gøre on-orbit-servicering til en forretning, ikke bare en demonstration.","image":{"url":"https://assets.science.nasa.gov/dynamicimage/assets/science/missions/swift-observatory/news/2026/launch-preview/NE201566_2611x1654.jpg","credit":"Kilde: NASA","alt":"Illustration af robotservicer, der nærmer sig Swift-satellitten","sourceUrl":"https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/"},"topics":["videnskab","rumfart","satellit-servicering"],"entities":["NASA","Katalyst Space","Neil Gehrels Swift Observatory"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":58,"decisionValue":44,"novelty":76,"sourceQuality":84,"personalRelevance":55,"contrast":72},"claims":[{"text":"NASA vil sende robotserviceren LINK (Katalyst Space) for at gribe og hæve det aldrende Swift-observatorium; opsendelse tidligst 30. juni.","sourceUrls":["https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/"],"confidence":"high"},{"text":"Det bliver første redning af en amerikansk statssatellit, der ikke var bygget til at blive serviceret.","sourceUrls":["https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/"],"confidence":"high"}],"sources":[{"title":"Partners, NASA Ready for June Launch of Swift Boost Mission","publisher":"NASA","url":"https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/","publishedAt":"2026-06-26T16:00:00Z","kind":"primary"}]},{"id":"story-se3-spatial-ai-20260629","eventKey":"se3-spatial-ai-defence-bundeswehr-2026","materialFacts":["Den tyske TU München-spinout SE3 lancerer en spatial-AI-platform til autonome droner og robotter i GPS-nægtede miljøer","Selskabet er allerede under kontrakt med den tyske Bundeswehr og har vundet flere forsvarskontrakter","Investorerne omfatter Lakestar, Seedcamp, EWOR og Sequoia Scout Fund; finansieringsbeløbet er ikke oplyst"],"section":"Forsvar","headline":"Backed by Lakestar, Seedcamp and EWOR, SE3 unveils spatial AI platform for autonomous systems","primarySourceUrl":"https://tech.eu/2026/06/26/backed-by-lakestar-seedcamp-and-ewor-se3-unveils-spatial-ai-platform-for-autonomous-systems/","subheadline":"Endnu en tysk forsvars-AI-startup træder frem med Bundeswehr-kontrakter og europæiske venturefonde i ryggen","body":["Den tyske startup SE3, en spinout fra Technische Universität München, er trådt frem af stealth med en platform for \"spatial AI\" – navigation og perception, der lader droner og robotter operere selvstændigt uden GPS. Selskabet er allerede under kontrakt med Bundeswehr.","Bag SE3 står kendte europæiske investorer: Lakestar, Seedcamp, EWOR og Sequoia Scout Fund. Beløbet er ikke offentliggjort. Medstifter Daniel Cremers leder computer vision og AI på TU München."],"whyItMatters":"SE3 forstærker en tysk-europæisk klynge af forsvars-AI-selskaber – Helsing, Stark, Quantum Systems – der kappes om at levere autonomi til militæret. Et signal om, hvor europæisk forsvarskapital søger hen.","analysis":"Værdien i autonome systemer flytter fra hardware til software: den, der løser pålidelig navigation uden GPS, vinder. At SE3 går i kontrakt med Bundeswehr før en offentlig runde, viser, at efterspørgslen trækker teknologien.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Quadcopter_camera_drone_in_flight.jpg/960px-Quadcopter_camera_drone_in_flight.jpg","credit":"Foto: Wikimedia Commons","alt":"Autonom drone i flyvning (arkivfoto)","sourceUrl":"https://tech.eu/2026/06/26/backed-by-lakestar-seedcamp-and-ewor-se3-unveils-spatial-ai-platform-for-autonomous-systems/"},"topics":["defence-tech","AI","venturekapital","Tyskland"],"entities":["SE3","Lakestar","Seedcamp","EWOR","Bundeswehr"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":64,"novelty":70,"sourceQuality":72,"personalRelevance":82,"contrast":56},"claims":[{"text":"SE3, en TU München-spinout, lancerer en spatial-AI-platform til autonome systemer og er under kontrakt med Bundeswehr.","sourceUrls":["https://tech.eu/2026/06/26/backed-by-lakestar-seedcamp-and-ewor-se3-unveils-spatial-ai-platform-for-autonomous-systems/"],"confidence":"high"},{"text":"Investorerne omfatter Lakestar, Seedcamp, EWOR og Sequoia Scout Fund; beløbet er ikke oplyst.","sourceUrls":["https://tech.eu/2026/06/26/backed-by-lakestar-seedcamp-and-ewor-se3-unveils-spatial-ai-platform-for-autonomous-systems/"],"confidence":"high"}],"sources":[{"title":"Backed by Lakestar, Seedcamp and EWOR, SE3 unveils spatial AI platform for autonomous systems","publisher":"Tech.eu","url":"https://tech.eu/2026/06/26/backed-by-lakestar-seedcamp-and-ewor-se3-unveils-spatial-ai-platform-for-autonomous-systems/","publishedAt":"2026-06-26T09:00:00Z","kind":"reporting"}]},{"id":"story-graz-kpo-20260629","eventKey":"austria-graz-kpo-landslide-2026","materialFacts":["Kommunisterne KPÖ vandt kommunalvalget i Graz med ca. 35,8 procent, en fremgang på 7,0 point","ÖVP fik 25,2 procent; KPÖ har 18 af 48 mandater og beholder borgmesterposten med Elke Kahr","Stemmeprocenten var 53,4"],"section":"Udland","headline":"KPÖ gewinnt und legt weiter zu","primarySourceUrl":"https://steiermark.orf.at/stories/3360365/","subheadline":"I Østrigs næststørste by konsoliderer et kommunistisk parti magten i et af Vesteuropas mest opsigtsvækkende lokalresultater","body":["Det kommunistiske parti KPÖ vandt søndag kommunalvalget i Graz, Østrigs næststørste by, med omkring 35,8 procent – en fremgang på 7,0 point. Det konservative ÖVP fik 25,2 procent. KPÖ tager nu 18 af byrådets 48 mandater.","Borgmester Elke Kahr fra KPÖ fortsætter dermed i spidsen sammen med De Grønne og SPÖ; stemmeprocenten var 53,4. Partiet har bygget sin position på en nøgtern boligprofil, hvor lokale folkevalgte giver dele af deres løn videre til borgere i nød."],"whyItMatters":"Et kommunistisk parti, der udbygger magten i en stor vesteuropæisk by, bryder med fortællingen om, at protestvælgere kun søger mod højrefløjen – et modeksempel midt i en europæisk højredrejning.","analysis":"Graz-resultatet handler mindre om ideologi end om levering: KPÖ har vundet på synlig, lokal velfærd – især boliger. Det minder om, at konkret materiel politik kan slå identitetspolitik, uanset partifarve.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Einweihung_Advent_in_Graz_2023.2_%28cropped%29.jpg/960px-Einweihung_Advent_in_Graz_2023.2_%28cropped%29.jpg","credit":"Foto: Wikimedia Commons","alt":"KPÖ's Elke Kahr, borgmester i Graz","sourceUrl":"https://steiermark.orf.at/stories/3360365/"},"topics":["udland","valg","Østrig","Europa"],"entities":["KPÖ","Elke Kahr","Graz","ÖVP"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":52,"decisionValue":40,"novelty":72,"sourceQuality":70,"personalRelevance":40,"contrast":78},"claims":[{"text":"KPÖ vandt Graz-valget med ca. 35,8 pct. (+7,0 point); ÖVP fik 25,2 pct.; KPÖ har 18 af 48 mandater.","sourceUrls":["https://steiermark.orf.at/stories/3360365/"],"confidence":"high"},{"text":"Elke Kahr (KPÖ) beholder borgmesterposten; stemmeprocenten var 53,4.","sourceUrls":["https://steiermark.orf.at/stories/3360365/"],"confidence":"high"}],"sources":[{"title":"KPÖ gewinnt und legt weiter zu","publisher":"ORF","url":"https://steiermark.orf.at/stories/3360365/","publishedAt":"2026-06-28T17:00:00Z","kind":"reporting"}]}],"signals":[{"headline":"US launches second night of strikes on Iran after ship hit by drone","url":"https://www.aljazeera.com/news/2026/6/27/us-launches-second-night-of-strikes-against-iran-after-ship-struck-by-drone","publisher":"Al Jazeera","section":"Udland","publishedAt":"2026-06-27T12:00:00Z","summary":"USA angreb anden nat i træk mål i det sydlige Iran efter et droneangreb på en tanker i Hormuzstrædet. Trump truede med, at Iran 'ikke længere vil eksistere', hvis angrebene fortsætter.","text":"US launches second night of strikes on Iran after ship hit by drone"},{"headline":"Sjælden grib med vingefang på op til tre meter spottet i Danmark","url":"https://nyheder.tv2.dk/samfund/2026-06-28-sjaelden-grib-   }
  function renderPeriod(brief, opts) {

  }
  function renderWeekly(brief) {
    renderPeriod(brief, {
      rangeLabel: weekRangeLabel,
      selectors: {
        range: "#brief-range",
        readingTime: "#brief-reading-time",
        title: "#brief-title",
        dek: "#brief-dek",
        featuredGrid: "#featured-grid",

        moreGrid: "#more-week-grid",

  }

  // src/web/renderMonthly.js
  function monthRangeLabel(brief) {
    const match = /^(\d{4})-(\d{2})$/.exec(brief.monthId ?? "");
    if (!match) return brief.monthId ?? "";
    const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, 1));
    const label = new Intl.DateTimeFormat("da-DK", {
      month: "long",
      year: "numeric",
      timeZone: "UTC"
    }).format(date);
    return label.charAt(0).toUpperCase() + label.slice(1);
  }
  function renderMonthly(brief) {
    renderPeriod(brief, {
      rangeLabel: monthRangeLabel,
      selectors: {
        range: "#brief-range",
        readingTime: "#brief-reading-time",
        title: "#brief-title",
        dek: "#brief-dek",
        featuredGrid: "#featured-grid",
        threads: "#threads",
        moreGrid: "#more-month-grid",
        numbers: "#month-numbers",

        shortNews: "#short-news"

    });
  }

  // src/web/app.js
  function renderBrief(brief) {
    document.querySelector("#brief-date").textContent = formatDate(brief.date);
    document.querySelector("#brief-reading-time").textContent = `${brief.readingMinutes} minutters l\xE6sning`;
    document.querySelector("#brief-title").textContent = BRAND;
    document.querySelector("#brief-dek").textContent = brief.dek;

      keyNumberSlot.replaceChildren(...keyNumberPanel ? [keyNumberPanel] : []);
      keyNumberSlot.hidden = !keyNumberPanel;
    }

    const storyGrid2 = document.querySelector("#story-grid");
    const leadSignals = document.querySelector("#lead-signals");
    const shortNews = document.querySelector("#short-news");
    const shortNewsSection = document.querySelector("#short-news-section");
    leadContainer.replaceChildren();
    storyGrid2.replaceChildren();
    leadSignals.replaceChildren(element("h2", "signals-title", "Morgenens signaler"));
    shortNews.replaceChildren();
    for (const story of brief.stories) {
      (story.isLead ? leadContainer : storyGrid2).append(renderStory(story));
    }
    for (const signal of brief.signals.slice(0, 4)) {
      leadSignals.append(renderSignal(signal));
    }
    const remainingSignals = brief.signals.slice(4);
    for (const signal of remainingSignals) shortNews.append(renderSignal(signal));
    shortNewsSection.hidden = remainingSignals.length === 0;

    renderQualityFooter(brief.quality);
  }
  async function sendFeedback(button, transport, reason) {

    const isRecommendation = article.dataset.contentType === "recommendation";
    const payload = {
      storyId: article.dataset.storyId,
      browserId: getBrowserId(),
      direction,
      ...isRecommendation ? { contentType: "recommendation" } : {},
      ...reason ? { reason } : {},

    const applyState = (active) => {
      directionButtons.forEach((control, index) => {
        const pressed = active ? control.dataset.direction === direction : previousPressed[index] === "true";

        control.classList.toggle("is-selected", pressed);
      });
    };
    applyState(true);
    const reasonsPanel = article.querySelector(".feedback-reasons");
    if (reasonsPanel) reasonsPanel.hidden = false;
    localStorage.setItem(
      feedbackStorageKey(payload.storyId, payload.contentType),
      direction

    const status = document.querySelector("#feedback-status");
    if (status) status.textContent = "Feedback gemt";
    if (direction === "more" && !isRecommendation) {
      const headlineLink = article.querySelector(".headline-link");
      if (headlineLink) {
        recordSaved({
          id: article.dataset.storyId,
          headline: headlineLink.textContent,
          url: headlineLink.href
        });
      }
    }
    try {
      await transport(payload);
    } catch (error) {
      applyState(false);
      if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      throw error;
    }
    return payload;
  }
  function appsScriptTransport(payload) {
    if (!globalThis.google?.script?.run) {

    }
    return new Promise((resolve, reject) => {
      globalThis.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveFeedback(payload);
    });
  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {
    const response = await fetcher(feedbackUrl(), {
      method: "POST",
      redirect: "follow",
      headers: { "content-type": "text/plain;charset=utf-8" },

  function defaultFeedbackTransport() {

    if (url) return (payload) => httpFeedbackTransport(payload);
    if (globalThis.google?.script?.run) return appsScriptTransport;
    return () => Promise.resolve({ status: "saved-local" });
  }
  function bindFeedback(transport = defaultFeedbackTransport()) {
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-direction], button[data-reason]");
      if (!button) return;
      try {
        const directionButton = button.dataset.direction ? button : button.closest("article").querySelector('[data-direction][aria-pressed="true"]');
        if (!directionButton) return;
        await sendFeedback(directionButton, transport, button.dataset.reason);
      } catch {
        document.querySelector("#feedback-status").textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".headline-link, .primary-source-link, .read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);

  }
  function pickDanishVoice(synth) {

  }

  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {

      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));

  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":

      default:
        return renderBrief(brief);
    }
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
