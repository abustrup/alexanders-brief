<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-horizon {
  margin: 0 0 12px;
  color: var(--teal);
  font-family: var(--sans);
  font-size: 0.66rem;
  font-weight: 750;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

/* The last reading of the same quantity, when there was one. This line is the
   difference between a figure and a measurement, so it sits directly under the
   number rather than down with the source. */
.key-number-previous {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
}

.key-number-change {
  color: var(--teal);
  font-weight: 750;
  letter-spacing: 0.02em;
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

/* The recommendations top mirrors the front page's lead layout: the featured
   pick reads like the lead story and the shortlist sits in a rail beside it,
   exactly as "Morgenens signaler" does. Before this the featured card ran the
   full section width, so its 3:2 image was the largest picture on the page and
   dwarfed the news it followed. Scoped to .recs-layout so Magasin and Feed,
   which build their own recommendation DOM, keep the standalone block. */
.recs-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recs-layout > .recommendation-featured {
  flex: 1 1 540px;
  min-width: 0;
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: 0;
}

.recs-layout > .recommendation-shortlist {
  flex: 1 1 290px;
  min-width: 0;
  margin: 0;
  border-top: 0;
}

/* When the rail wraps under the featured pick it grows a separating rule,
   matching .lead-signals at the same breakpoint. */
@media (max-width: 860px) {
  .recs-layout > .recommendation-shortlist {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

/* Same landscape crop as the front-page hero, so the featured pick and the lead
   story present at the same size and shape. */
.recs-layout .recommendation-featured-card .recommendation-media {
  aspect-ratio: 16 / 9;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

/* The shortlist: many links, one line each. Deliberately typographic and dense
   next to the featured card above it, so the difference in depth is visible
   before a word is read. */
.recommendation-shortlist {
  margin: 4px 0 0;
  border-top: 1px solid var(--rule);
}

/* Mirrors .signals-title on the news rail. */
.recommendation-shortlist-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.recommendation-short {
  padding: 13px 0 12px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-head {
  margin: 0;
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.4;
}

.recommendation-short-link {
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-link:hover,
.recommendation-short-link:focus-visible {
  color: var(--red);
  border-bottom-color: currentColor;
}

.recommendation-short-meta {
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.73rem;
  letter-spacing: 0.01em;
}

.recommendation-short-note {
  margin: 3px 0 0;
  max-width: 68ch;
  color: var(--body-soft, var(--muted));
  font-family: var(--serif);
  font-size: 0.9rem;
  line-height: 1.5;
}

.recommendation-short .feedback-panel {
  margin-top: 8px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;

.read-later-list {

  border: 1px solid var(--rule);

  color: var(--ink);
  font-size: 0.74rem;

  <script>globalThis.__BRIEF_DATA__ = {"schemaVersion":1,"kind":"daily","runId":"brief-2026-08-26-ci","date":"2026-08-26","generatedAt":"2026-08-26T04:30:00Z","readingMinutes":11,"title":"Alexanders Brief - 26. august 2026","dek":"Værnepligtige på Grønland, et lækket Venstre-udspil, dansk datacenter-kapital, AI-markedsdata, en CIA-chef i Moskva, en toldkrig mellem Canada og USA, japansk kvantecomputing og en sukkerfabriks sidste kampagne.","profileWeights":{"importance":25,"decisionValue":20,"novelty":15,"sourceQuality":15,"personalRelevance":15,"contrast":10},"stories":[{"id":"story-dk-vaernepligt-groenland","eventKey":"dk-vaernepligt-groenland-arctic-endurance","materialFacts":["Værnepligtige indgår for første gang i nyere tid i en øvelse i Grønland","Holdet er det første på Danmarks nye 11-måneders værnepligtsmodel","Øvelsen hedder Arctic Endurance og involverer samarbejde med grønlandske kolleger"],"section":"Danmark","headline":"Værnepligtige soldater på øvelse i Grønland","primarySourceUrl":"https://www.forsvaret.dk/da/nyheder/2026/varnepligtige-soldater-pa-ovelse-i-gronland/","subheadline":"For første gang i nyere tid indgår værnepligtige i en øvelse på grønlandsk jord, som led i Danmarks nye 11-måneders værnepligt","body":["Et hold værnepligtige fra Slesvigske Fodregiment er i august rejst til Grønland for at deltage i øvelsen Arctic Endurance sammen med grønlandske kolleger. Det er første gang i nyere tid, at værnepligtige indgår i en øvelse på grønlandsk jord, og holdet er samtidig det første på Danmarks nye, forlængede værnepligt på elleve måneder.","Forsvarsminister Jeppe Bruus siger, at den nye værnepligt skal sikre, at værnepligtige kan bidrage til Forsvarets operationer, herunder i Grønland, og dermed styrke sikkerhed og afskrækkelse. De skal løse opgaver på linje med andre udsendte enheder i et terræn, ingen af dem kender hjemmefra."],"whyItMatters":"At sende værnepligtige til Grønland er en praktisk test af, om den forlængede værnepligt giver Forsvaret flere hænder til en mere permanent tilstedeværelse i Arktis, mens USA's interesse for Grønland gør dansk tilstedeværelse til et politisk såvel som militært spørgsmål.","analysis":"Øvelsen løser ikke alene Forsvarets bemandingsproblem i Grønland, men viser en vej: kan værnepligtige indgå i operativ tjeneste dér, bliver rotationsbyrden på de faste besætninger mindre afhængig af frivillige. Om modellen holder, ses først, når flere hold har gennemført et helt rotationsår.","topics":["forsvar","danmark","grønland","værnepligt","arktis"],"entities":["Forsvaret","Slesvigske Fodregiment","Grønland","Jeppe Bruus"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":55,"novelty":82,"sourceQuality":70,"personalRelevance":80,"contrast":40},"claims":[{"text":"Et hold værnepligtige fra Slesvigske Fodregiment deltager for første gang i nyere tid i en øvelse i Grønland (Arctic Endurance)","sourceUrls":["https://www.forsvaret.dk/da/nyheder/2026/varnepligtige-soldater-pa-ovelse-i-gronland/"],"confidence":"high"},{"text":"De deltagende værnepligtige er det første hold på Danmarks nye 11-måneders værnepligtsmodel, indledt februar 2026","sourceUrls":["https://www.forsvaret.dk/da/nyheder/2026/varnepligtige-soldater-pa-ovelse-i-gronland/"],"confidence":"high"}],"sources":[{"title":"Værnepligtige soldater på øvelse i Grønland","publisher":"Forsvaret","url":"https://www.forsvaret.dk/da/nyheder/2026/varnepligtige-soldater-pa-ovelse-i-gronland/","publishedAt":"2026-06-23T17:00:00Z","kind":"primary"}],"image":{"url":"https://www.forsvaret.dk/globalassets/fko---forsvaret/billeder/billeder-til-nyheder/artikel/2026/06-juni/artikel/-fsvdkuntitled0f4a4886-2026-artikel.jpg","credit":"Kilde: Forsvaret","alt":"Værnepligtige soldater på øvelse i Grønland","sourceUrl":"https://www.forsvaret.dk/da/nyheder/2026/varnepligtige-soldater-pa-ovelse-i-gronland/"}},{"id":"story-venstre-statsborgerskab","eventKey":"venstre-statsborgerskab-forslag","materialFacts":["Venstre overvejede internt et årligt loft på ca. 250 statsborgerskaber til ansøgere med ikke-vestlig baggrund","Partiet droppede forslaget før det officielle udspil ved sommergruppemødet","Et separat 'karaktervidne'-forslag blev også droppet"],"section":"Danmark","headline":"Kontroversielt forslag havnede ved en fejl hos DR: Venstre skrottede to vidtgående strammer-forslag","primarySourceUrl":"https://www.dr.dk/nyheder/politik/kontroversielt-forslag-havnede-ved-en-fejl-hos-dr-venstre-skrottede-vidtgaaende-strammer-forslag","subheadline":"Interne dokumenter viser, at Venstre overvejede et årligt loft på 250 statsborgerskaber til ansøgere med ikke-vestlig baggrund, før forslaget blev droppet","body":["DR fik ved en fejl et internt Venstre-dokument, partiet ville slette inden sit udspil om statsborgerskab. Det viser, Venstre har diskuteret et loft på ca. 250 årlige statsborgerskaber til ansøgere med ikke-vestlig baggrund.","Et andet forkastet forslag var 'karaktervidner': danske statsborgere, der med underskrift skulle bekræfte, at en ansøger støtter Danmark, før pas kunne udstedes. Gruppeformand Morten Dahlin kalder forslagene 'ikke færdigbehandlede'."],"whyItMatters":"At et regeringsbærende parti har haft et etnicitetsbaseret loft på bordet, selvom det blev droppet, viser hvor bredt strammerdiskussionen i blå blok rækker internt - og rejser spørgsmålet om, hvad der ellers sorteres fra.","analysis":"Sagen siger mindre om Venstres endelige politik, stadig ukendt, og mere om at den interne diskussion er bredere end det, der når en pressekonference. Hvor meget der er skrottet, ses først, når udspillet ligger færdigt.","topics":["indland","politik","udlændingepolitik","danmark"],"entities":["Venstre","Morten Dahlin","Troels Lund Poulsen","DR"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":72,"decisionValue":50,"novelty":75,"sourceQuality":75,"personalRelevance":25,"contrast":55},"claims":[{"text":"Venstre overvejede internt et loft på ca. 250 statsborgerskaber om året for ansøgere med ikke-vestlig baggrund, men forslaget blev droppet før partiets officielle udspil","sourceUrls":["https://www.dr.dk/nyheder/politik/kontroversielt-forslag-havnede-ved-en-fejl-hos-dr-venstre-skrottede-vidtgaaende-strammer-forslag"],"confidence":"medium"}],"sources":[{"title":"Kontroversielt forslag havnede ved en fejl hos DR: Venstre skrottede to vidtgående strammer-forslag","publisher":"DR","url":"https://www.dr.dk/nyheder/politik/kontroversielt-forslag-havnede-ved-en-fejl-hos-dr-venstre-skrottede-vidtgaaende-strammer-forslag","publishedAt":"2026-08-24T18:00:00Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/2kfbgyza/20260821-133738-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","credit":"Kilde: DR","alt":"Kontroversielt forslag havnede ved en fejl hos DR: Venstre skrottede to vidtgående strammer-forslag","sourceUrl":"https://www.dr.dk/nyheder/politik/kontroversielt-forslag-havnede-ved-en-fejl-hos-dr-venstre-skrottede-vidtgaaende-strammer-forslag"}},{"id":"story-ddc1-datacenter-esbjerg","eventKey":"ddc1-datacenter-esbjerg","materialFacts":["Byggeriet af det danskejede datacenter DDC1 i Esbjerg er begyndt","Ejerkredsen er PensionDanmark, Thylander og CIP","Overskudsvarme skal indgå i det lokale fjernvarmenet via DIN Forsyning"],"section":"Erhverv","headline":"CIP and Thylander start construction of energy-integrated data centre in Denmark backed by PensionDanmark","primarySourceUrl":"https://www.manilatimes.net/2026/08/13/tmt-newswire/globenewswire/cip-and-thylander-start-construction-of-energy-integrated-data-centre-in-denmark-backed-by-pensiondanmark/2405091","subheadline":"Byggeriet af det danskejede Dansk Data Center 1 i Esbjerg er i gang, med overskudsvarme til det lokale fjernvarmenet","body":["Copenhagen Infrastructure Partners, Thylander og PensionDanmark bygger Dansk Data Center 1 (DDC1) i Esbjerg - et af de første større datacentre, der er helt dansk ejet. Thylander driver anlægget, PensionDanmark er ledende investor.","Projektet skal gøre centret til en del af energisystemet, ikke blot en stor forbruger: udviklerne samarbejder med DIN Forsyning om overskudsvarme til fjernvarmen."],"whyItMatters":"Datacentre driver presset på det danske elnet - Energinet har sat nye nettilslutninger på pause, fordi ansøgninger langt overstiger nettets kapacitet. DDC1 viser, hvordan et anlæg kan bygges ind i lokal infrastruktur frem for at stå uden for den.","analysis":"At det er dansk pensionskapital og ikke en amerikansk hyperscaler, der ejer anlægget, betyder, at beslutninger om varmegenbrug træffes i Danmark. Om modellen kan skaleres til AI-efterspørgslens kapacitet, ses først, når flere anlæg er bygget.","topics":["energi","datacenter","investering","danmark","infrastruktur"],"entities":["Copenhagen Infrastructure Partners","Thylander Group","PensionDanmark","DIN Forsyning"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":62,"decisionValue":65,"novelty":60,"sourceQuality":60,"personalRelevance":85,"contrast":30},"claims":[{"text":"Byggeriet af et helt danskejet datacenter (DDC1) i Esbjerg er i gang, ejet af PensionDanmark, Thylander og CIP","sourceUrls":["https://www.manilatimes.net/2026/08/13/tmt-newswire/globenewswire/cip-and-thylander-start-construction-of-energy-integrated-data-centre-in-denmark-backed-by-pensiondanmark/2405091"],"confidence":"high"}],"sources":[{"title":"CIP and Thylander start construction of energy-integrated data centre in Denmark backed by PensionDanmark","publisher":"Manila Times / GlobeNewswire","url":"https://www.manilatimes.net/2026/08/13/tmt-newswire/globenewswire/cip-and-thylander-start-construction-of-energy-integrated-data-centre-in-denmark-backed-by-pensiondanmark/2405091","publishedAt":"2026-08-13T09:00:00Z","kind":"reporting"}],"image":{"url":"https://manilatimes.net/manilatimes/uploads/images/2026/08/13/1176172.png","credit":"Kilde: Manila Times / GlobeNewswire","alt":"CIP and Thylander start construction of energy-integrated data centre in Denmark backed by PensionDanmark","sourceUrl":"https://www.manilatimes.net/2026/08/13/tmt-newswire/globenewswire/cip-and-thylander-start-construction-of-energy-integrated-data-centre-in-denmark-backed-by-pensiondanmark/2405091"}},{"id":"story-anthropic-openai-marketshare","eventKey":"anthropic-openai-enterprise-market-share","materialFacts":["Ramp-data viser Anthropics andel af amerikansk virksomheds-AI-forbrug steg fra 41% til ca. 44% maj-juli","OpenAI steg fra 39% til ca. 40% i samme periode, men vokser hurtigere i Q3","Andelen af Ramp-kunder der betaler for AI-tjenester nåede knap 56% i juli"],"section":"Teknologi","headline":"OpenAI is gaining on Anthropic with business users, new data indicates","primarySourceUrl":"https://techcrunch.com/2026/08/20/openai-is-gaining-on-anthropic-with-business-users-new-data-indicates/","subheadline":"Nye data fra betalingsplatformen Ramp viser, at OpenAI vokser hurtigere end Anthropic blandt amerikanske virksomhedskunder i tredje kvartal","body":["Ramp, der behandler betalinger for 70.000 amerikanske virksomheder, målte Anthropics andel af AI-forbruget stige fra 41 til ca. 44 procent fra maj til juli, mens OpenAI gik fra 39 til ca. 40 procent - men vokser hurtigere i indeværende kvartal.","Andelen af Ramps kunder, der betaler for AI-tjenester, steg fra over 50 procent i marts til knap 56 procent i juli. Ramp-økonom Ara Kharazian peger på OpenAIs GPT-5.6 Sol som drivkraft, mens Anthropics Fable 5 ifølge ham 'skuffede i udbredelse'."],"whyItMatters":"Ramps tal er ikke officiel opgørelse, men et granulært billede af, hvordan virksomheder fordeler AI-forbrug mellem udbyderne - et signal, ingen af selskaberne selv offentliggør.","analysis":"At Anthropic stadig fører, men vokser langsommere, er værd at følge: holder mønstret et par kvartaler mere, vender rækkefølgen. Om Fable 5 underpræsterer, eller Ramps kunder ikke er repræsentative, afgøres ikke af ét datapunkt.","topics":["AI","venturekapital","usa","teknologi"],"entities":["Anthropic","OpenAI","Ramp"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":72,"novelty":58,"sourceQuality":65,"personalRelevance":90,"contrast":35},"claims":[{"text":"Ramp-data viser Anthropics andel af amerikansk virksomheds-AI-forbrug steg fra 41% i maj til ca. 44% i juli 2026, mens OpenAI steg fra 39% til ca. 40%, men vokser hurtigere i Q3","sourceUrls":["https://techcrunch.com/2026/08/20/openai-is-gaining-on-anthropic-with-business-users-new-data-indicates/"],"confidence":"medium"}],"image":{"url":"https://techcrunch.com/wp-content/uploads/2025/09/GettyImages-2214107176.jpg?resize=1200,800","credit":"Alex Wong/Getty Images via TechCrunch","alt":"Illustration med Anthropics og OpenAIs logoer side om side","sourceUrl":"https://techcrunch.com/2026/08/20/openai-is-gaining-on-anthropic-with-business-users-new-data-indicates/"},"sources":[{"title":"OpenAI is gaining on Anthropic with business users, new data indicates","publisher":"TechCrunch","url":"https://techcrunch.com/2026/08/20/openai-is-gaining-on-anthropic-with-business-users-new-data-indicates/","publishedAt":"2026-08-20T22:36:00Z","kind":"reporting"}]},{"id":"story-ratcliffe-moskva-besoeg","eventKey":"ratcliffe-moscow-ukraine-strikes-pause","materialFacts":["CIA-direktør John Ratcliffe rejste til Moskva den 25. august","Washington bad ifølge Axios/CBS Ukraine suspendere angreb mod Moskva under besøget","Kreml afviste offentligt at der var planlagte forhandlinger"],"section":"Verden","headline":"Kremlin denies US talks amid reports CIA Director Ratcliffe in Russia","primarySourceUrl":"https://www.aljazeera.com/news/2026/8/25/kremlin-denies-planned-talks-with-us-envoys-amid-reports-cia-head-in-russia","subheadline":"USA bad ifølge flere medier Ukraine om at sætte angreb på Moskva i bero, mens CIA-chefen var i byen - Kreml afviser planlagte forhandlinger","body":["CIA-direktør John Ratcliffe fløj tirsdag fra Riga til Moskva - ifølge flytrackingdata det højeste besøg af en Trump-embedsmand i Rusland siden januar. Kreml afviste, at der var planlagte forhandlinger med amerikanske udsendinge.","Ifølge Axios og CBS News bad Washington forud Ukraine suspendere angreb mod Moskva og nordlige russiske byer, mens delegationen var i landet. Ratcliffe har tidligere haft en central rolle i fangeudvekslinger mellem USA og Rusland."],"whyItMatters":"Et uannonceret besøg af USA's øverste efterretningschef i Moskva, sammen med en anmodning om at sætte ukrainske angreb i bero, er et tegn på kontakt mellem Washington og Kreml, uanset hvad begge parter siger offentligt.","analysis":"At Kreml afviser 'planlagte forhandlinger' snarere end besøget selv, kan dække over uformelle samtaler. Det bliver først klart, hvis besøget følges op af synlige skridt - en fangeudveksling eller en pause i angreb.","topics":["geopolitik","ukraine","rusland","usa","diplomati"],"entities":["John Ratcliffe","CIA","Kreml","Dmitry Peskov","Ukraine"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":60,"novelty":70,"sourceQuality":68,"personalRelevance":35,"contrast":45},"claims":[{"text":"CIA-direktør John Ratcliffe rejste til Moskva den 25. august 2026, det højeste besøg af en Trump-embedsmand i Rusland siden januar","sourceUrls":["https://www.aljazeera.com/news/2026/8/25/kremlin-denies-planned-talks-with-us-envoys-amid-reports-cia-head-in-russia"],"confidence":"medium"},{"text":"Washington bad Ukraine suspendere angreb mod Moskva og andre nordlige russiske byer under besøget","sourceUrls":["https://www.aljazeera.com/news/2026/8/25/kremlin-denies-planned-talks-with-us-envoys-amid-reports-cia-head-in-russia"],"confidence":"medium"}],"sources":[{"title":"Kremlin denies US talks amid reports CIA Director Ratcliffe in Russia","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/25/kremlin-denies-planned-talks-with-us-envoys-amid-reports-cia-head-in-russia","publishedAt":"2026-08-25T00:00:00Z","kind":"reporting"}],"image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/08/2026-07-31T200758Z_16775392_RC27PMAYEP67_RTRMADP_3_USA-TRUMP-1787674505.jpg?resize=1920%2C1440","credit":"Kilde: Al Jazeera","alt":"Kremlin denies US talks amid reports CIA Director Ratcliffe in Russia","sourceUrl":"https://www.aljazeera.com/news/2026/8/25/kremlin-denies-planned-talks-with-us-envoys-amid-reports-cia-head-in-russia"}},{"id":"story-canada-us-toldkrig","eventKey":"canada-us-tariff-retaliation","materialFacts":["USA indførte 50% told på ca. 20 mia. dollars canadiske varer","Canada svarer igen fra 8. september med told for op mod 20 mia. dollars amerikanske varer","Tre dages forhandlinger brød sammen ved fristens udløb"],"section":"Økonomi","headline":"Carney: Canada will enact retaliatory US tariffs starting September 8","primarySourceUrl":"https://www.aljazeera.com/news/2026/8/22/carney-canada-will-enact-retaliatory-us-tariffs-starting-september-8","subheadline":"Canada svarer igen med told for op mod 20 milliarder dollars, efter forhandlinger med USA brød sammen ved fristens udløb","body":["USA indførte i sidste uge 50 procents told på ca. 20 milliarder dollars canadiske varer. Canada svarer fra 8. september igen med told for op mod 20 milliarder dollars amerikanske varer - 'dollar for dollar', sagde premierminister Mark Carney.","Modtolden rammer stål, mejeriprodukter, hvidevarer, landbrugsudstyr, papir og elektronik. Forhandlingerne brød sammen, og Carney sagde, USA 'forlangte for meget, tilbød for lidt'. Canada fordobler tolden på stål og aluminium til 50 procent."],"whyItMatters":"Canada er USA's tætteste handelspartner. Optrapningen viser, at Trump-administrationens tarifpolitik også rammer traditionelle allierede - med direkte konsekvenser for priser på begge sider af grænsen.","analysis":"At forhandlingerne brød sammen, tyder på reel afstand mellem parterne. Konfliktens varighed afhænger af, om smerten hos amerikanske delstater med canadisk ek y":["Japans Institute for Molecular Science har sat landets første neutral-atom kvantecomputer, Shunkai, i drift med ca. 50 qubits. Hitachi byggede softwaren, Infleqtion leverede processoren, og IMS samlede systemet under Japans Moonshot-program.","Shunkai bruger laserstyrede neutrale atomer og kører, modsat superledende computere, ved stuetemperatur uden nedkøling. Planen er 10.000 qubits med fejlkorrektion inden 2031, gjort tilgængeligt undervejs for eksterne forskere."],"whyItMatters":"Infleqtion var den eneste udenlandske partner, Japans videnskabsagentur JST udvalgte til Moonshot-programmet - et tegn på, at Japan bevidst henter udenlandsk teknologi ind i en national satsning frem for at bygge alt selv.","analysis":"Neutral-atom er én af flere konkurrerende kvanteveje, og Shunkais betydning afhænger af, om skaleringen til tusindvis af qubits med fejlkorrektion lykkes inden 2031 - ikke af at systemet kører med 50 nu.","topics":["kvante","teknologi","japan","forskning","deeptech"],"entities":["Institute for Molecular Science","Hitachi","Infleqtion","Japan Moonshot R&D Program"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":58,"decisionValue":40,"novelty":78,"sourceQuality":60,"personalRelevance":65,"contrast":30},"claims":[{"text":"Japans Institute for Molecular Science har sat landets første fuld-stak neutral-atom kvantecomputer 'Shunkai' i drift med ca. 50 qubits, udviklet med Hitachi og Infleqtion","sourceUrls":["https://thequantuminsider.com/2026/08/24/japans-full-stack-neutral-atom-quantum-computer-is-operational/","https://infleqtion.com/infleqtion-collaboration-with-japan-moonshot-program-achieves-major-milestone-shunkai-neutral-atom-quantum-computer-now-operational/"],"confidence":"high"}],"sources":[{"title":"Japan's Full-Stack Neutral-Atom Quantum Computer is Operational","publisher":"The Quantum Insider","url":"https://thequantuminsider.com/2026/08/24/japans-full-stack-neutral-atom-quantum-computer-is-operational/","publishedAt":"2026-0
