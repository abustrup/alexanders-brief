/* THE LEAD, ONE CARD ACROSS THE WHOLE WIDTH [2026-09-14]. It used to share the top
   of the page with the "Morgenens signaler" rail, and Alexander moved the signals
   down to just above Klummen and asked for the lead to be laid out like the
   closing card of the story grid he liked that morning ("EU to propose law curbing
   social media for children Thursday"): picture left, text right, filling the
   width. The two columns are the story grid's two columns, so the lead's seam is
   the seam every card below it hangs off. */
.lead-layout {
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.story {
  min-width: 0;
}

/* Stacked below 900px (picture above text), and the weekly featured grid keeps its
   own flex layout. */
.story-lead { display: block; }

/* Below 900px the lead is stacked and its picture is drawn in exactly the 4:3 frame
   host:images crops it to (src/editorial/slotFrame.ts, pinned by
   test/editorial/slotFrame.test.ts). Side by side, from 900px, the frame is the
   text's height instead: see the shared block under the story grid. */
.lead-layout .story-lead .story-media {
  aspect-ratio: 4 / 3;
  margin: 0 0 16px;
}

.expanded-news,
.signals-section,
.short-news-section {
  margin-top: 26px;
}

/* ONE section label for the whole page. "Dagens vigtigste historier" used to be
   a centred 12px uppercase label on a 1px rule spanning all 1180px, while the
   rail headings beside and below it were left-aligned 19px serif on a 3px rule
   spanning 448px. Neither the alignment, the family, the size nor the rule
   weight was shared, so the centred label's ink landed 125px off the seam it
   sat directly above and its hairline crossed the gutter it was meant to
   organise [measured 2026-09-05]. The left-aligned serif won because it is the
   stronger object and because left is the one edge every column on the page
   already shares: masthead, lead, first card, first signal. Each rule now spans
   exactly the block its label names, and nothing on the page is optically
   centred against tracking any more. */
.section-heading,
.recommendation-shortlist-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--font-display);
  font-size: 1.18rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.1;
  text-align: left;
  text-transform: none;
}

/* 2 columns on desktop, 1 below. The template is explicit rather than the old
   repeat(auto-fit, minmax(min(100%, 400px), 1fr)) because the orphan rule below
   has to know how many columns there are, and auto-fit resolves inside the
   layout engine where CSS cannot ask it. That is how seven cards in two columns
   shipped with a 573x1071px dead cell in the right-hand track, immediately
   before "Kort fortalt" [measured 2026-09-05]. One breakpoint, two rules, and
   they can never disagree about the column count. */
.story-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  column-gap: var(--col-gap);
  /* Not the default `stretch`. A grid row is as tall as its taller card, and
     .feedback-panel's margin-top:auto pushed the shorter card's controls to that
     borrowed bottom — so the shorter card showed a hole between its last
     sentence and its thumbs: 123px on one card of today's brief, 26px on two
     more [measured 2026-09-05]. Each card now ends where its own content ends.
     The cost is that the two columns' closing rules no longer line up across a
     row, which is a smaller loss than a hole in the middle of a card. */
  align-items: start;
}

@media (min-width: 900px) {
  .story-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* A wide card takes the whole row. Which cards are wide is decided in
     render/storyGrid.js from which cards have a picture: an odd card at the end,
     every card with no picture, and a card that would otherwise be left alone in
     its row by one. Until 2026-09-14 this was one :nth-child(odd) rule for the
     last card, which could not see pictures. */
  .story-grid > .story-card.story-wide { grid-column: 1 / -1; }

  /* THE LEAD AND EVERY WIDE PICTURE CARD: PICTURE LEFT, TEXT RIGHT, ENDING
     TOGETHER [2026-09-15]. Until this date the picture kept its crop frame (4:3
     lead, 3:2 card) and rode sticky beside the text. On 2026-09-14's shortened
     stories (500-600 characters, the length from 2026-09-15) that left an empty
     column under the picture of 326px (lead) and 104px (card) at 1440px, and
     543px and 377px at 900px, measured in headless Chrome by
     scripts/check-geometry.mjs. Shorter stories did not close it: the text column
     carries the headline, the article AND the controls.
     So the picture now fills its side. It is stretched to the height of the
     text and cut to it with object-fit: cover, around the focal point host:images
     stores with the file (image.focus, set as --focus by render/media.js). Its
     frame is the floor: min-height holds it at the crop frame, so the page only
     ever trims the SIDES of the hosted file, never its top or bottom, and what the
     editor saw across the middle of the preview is always on the page.
     The controls (Læs originalen, Gem, Dokumentation, the thumbs) sit in
     .story-footer. On a wide card (1100px and up, the 1440px page) they stay under
     the text and the picture runs the full height, the shape of the EU card
     Alexander praised on 2026-09-14. On a narrower card they run across the whole
     card under both columns: in a 406px column the text alone made the lead's
     picture 0.48:1, a sliver, and without the controls it is 0.63:1. The rows are
     named by class because the head has up to eight parts and the picture must
     span exactly those. */
  .lead-layout .story-lead,
  .story-grid > .story-card.story-wide {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    /* eight head rows, one flexible row that takes up any slack, the footer */
    grid-template-rows: repeat(8, auto) 1fr auto;
    column-gap: var(--col-gap);
    align-items: start;
    container-type: inline-size;
  }

  .lead-layout .story-lead > *,
  .story-grid > .story-card.story-wide > * { grid-column: 2; }
  .lead-layout .story-lead > .story-eyebrow,
  .story-grid > .story-card.story-wide > .story-eyebrow { grid-row: 1; }
  .lead-layout .story-lead > .story-byline,
  .story-grid > .story-card.story-wide > .story-byline { grid-row: 2; }
  .lead-layout .story-lead > .story-headline,
  .story-grid > .story-card.story-wide > .story-headline { grid-row: 3; }
  .lead-layout .story-lead > .story-subheadline,
  .story-grid > .story-card.story-wide > .story-subheadline { grid-row: 4; }
  .lead-layout .story-lead > .story-body,
  .story-grid > .story-card.story-wide > .story-body { grid-row: 5; }
  .lead-layout .story-lead > .editorial-continuation,
  .story-grid > .story-card.story-wide > .editorial-continuation { grid-row: 6; }
  .lead-layout .story-lead > .counterpoint-box,
  .story-grid > .story-card.story-wide > .counterpoint-box { grid-row: 7; }
  .lead-layout .story-lead > .primary-excerpt-box,
  .story-grid > .story-card.story-wide > .primary-excerpt-box { grid-row: 8; }
  .lead-layout .story-lead > .story-footer,
  .story-grid > .story-card.story-wide > .story-footer { grid-row: 10; align-self: end; }

  .lead-layout .story-lead > .story-media,
  .story-grid > .story-card.story-wide > .story-media {
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: stretch;
    aspect-ratio: auto;
    margin: 0;
    /* the crop frame as a floor: half the card less the gap, at 3:2 */
    min-height: calc((100cqi - var(--col-gap)) / 2 * 2 / 3);
  }

  .lead-layout .story-lead > .story-media {
    min-height: calc((100cqi - var(--col-gap)) / 2 * 3 / 4);
  }

  @container (max-width: 1099px) {
    .lead-layout .story-lead > .story-media,
    .story-grid > .story-card.story-wide > .story-media { grid-row: 1 / 10; }
    .lead-layout .story-lead > .story-footer,
    .story-grid > .story-card.story-wide > .story-footer { grid-column: 1 / -1; }
  }

  /* The controls in reading order: the source button and Gem, then Dokumentation
     and Fundet via on the same line when they fit, then the thumbs. The thumbs
     keep their reserved ruler (flex-basis, as everywhere), so they share the
     line only in a footer wide enough for all of it, the full-width footer of a
     narrower card or of a text card, and wrap to a line of their own under the
     text of a 573px column. */
  .lead-layout .story-lead .story-footer,
  .story-grid > .story-card.story-wide .story-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 24px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  .lead-layout .story-lead .story-footer > .story-actions,
  .lead-layout .story-lead .story-footer > .story-sources,
  .lead-layout .story-lead .story-footer > .story-discovery,
  .story-grid > .story-card.story-wide .story-footer > .story-actions,
  .story-grid > .story-card.story-wide .story-footer > .story-sources,
  .story-grid > .story-card.story-wide .story-footer > .story-discovery { margin: 0; }
  .lead-layout .story-lead .story-footer > .feedback-panel,
  .story-grid > .story-card.story-wide .story-footer > .feedback-panel { flex: 1 1 420px; margin: 0; padding-top: 0; }

  /* With the picture hidden the split would leave an empty left column, so the
     text takes the full width and leans on the measure cap on .story-body. */
  :root[data-images="off"] .lead-layout .story-lead > *,
  :root[data-images="off"] .story-grid > .story-card.story-wide > * {
    grid-column: 1 / -1;
  }

  /* NO PICTURE, NO EMPTY COLUMN [2026-09-14]. A wide card with no picture has no
     figure at all (render/media.js), so its text is set across both columns: the
     headline block across the top, the article in two newspaper columns under it,
     and the controls across the full width at the bottom.
     WHY THE CONTROLS SPAN [2026-09-15]. Until this date the buttons, the sources
     and the thumbs were in the columns too, and a box that cannot split across a
     column made the two columns end 76-105px apart on 2026-09-14's shortened
     stories at 1440px (headless Chrome). Now only text is balanced, and text can
     break between lines, so the columns end within a line of each other. */
  .lead-layout .story-lead.story-text-only,
  .story-grid > .story-card.story-wide.story-text-only {
    display: block;
    columns: 2;
    column-gap: var(--col-gap);
  }

  .story-text-only > .story-eyebrow,
  .story-text-only > .story-byline,
  .story-text-only > .story-headline,
  .story-text-only > .story-subheadline,
  .story-text-only > .story-footer {
    column-span: all;
  }

  .story-text-only > .counterpoint-box,
  .story-text-only > .primary-excerpt-box { break-inside: avoid; }
  /* One line may stand alone at a column's top or foot. With the default two, Chrome could not
     balance 2026-09-14's shortened Swedish-election card closer than 39px at 1440px; with one it
     balances to 26px, a single line (scripts/check-geometry.mjs). */
  .story-text-only > .story-body > p,
  .story-text-only > .editorial-continuation > p { orphans: 1; widows: 1; }
  .story-text-only > .story-body > p:first-child { margin-top: 0; }
}

/* Everywhere else the footer is not a box at all: its controls lay out exactly as
   they did as direct children of the article (the Magasin reading column, a card
   in the two-up grid, every width under 900px). */
.story-footer { display: contents; }

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: var(--focus, 50% 50%);
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

/* The nudge is a hover affordance, not a focus indicator: 1.2% on a photograph
   is invisible, so a keyboard reader could not tell the picture link was
   focused. What makes it visible is the shared ring near the top of this file;
   the nudge stays as the flourish. */

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

/* pretty, not balance: these run several lines, and balance would even them at
   the cost of the measure. pretty only refuses to leave one word alone on the
   last line, which is the defect actually visible on the page. */
.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  text-wrap: pretty;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

/* The klumme caps its measure at 62ch and the grid cards land near 65 by their
   own width, but the lead article had no cap at all and ran the full 698px
   column — the page's most-read prose was its widest [measured 2026-09-05].
   68ch, so the lead reads at the same rhythm as everything around it and the
   ragged right it leaves in the lead column is a broadsheet, not an error. */
.story-body,
.editorial-continuation,
.recommendation-flow {
  max-width: 68ch;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  /* One height for every control the reader can press, taken from --tap-min,
     which was declared in :root and used nowhere while the page carried four
     different button heights. The card's control stack now reads 44 / 44 / 44
     instead of 40 / 40 / 44 [measured 2026-09-05], and the two buttons here
     share a type size as well: at 0.77rem against the save button's 0.74rem the
     0.5px difference read as a mistake rather than a hierarchy. Weight and
     border carry the difference between primary and secondary; the square-
     against-pill shape carries the rest. */
  min-height: var(--tap-min);
  padding: 0 16px;
  border: 1px solid var(--ink);
  font-size: 0.74rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover {
  background: var(--ink);
  color: var(--paper);
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

/* ==========================================================================
   The feedback control — two struck marks and a ruled measure.

   The thumbs and the optional 1-10 "udbytte" are ONE object in one 44px band,
   not two widgets stacked. The measure replaces the ten "Hvorfor" chips: those
   produced a reason on one vote in ten (11 of 108 recovered votes), a number on
   every vote is worth more, and a ruled measure is furniture this page already
   owns — a hairline, a graduation, an ink mark — where a chip row was a form.
   AT REST THE ROW IS TWO THUMBS [2026-09-06, Alexander]. The measure comes out
   when a thumb is pressed, which is how the chips behaved — but the chips grew
   the card 115px under the reader's finger doing it, and that is what got them
   deleted. The ruler is held back with `visibility` instead, so its box is there
   the whole time and the panel is the same height before and after the press.
   Below ~410px of control width that matters absolutely: the ruler wraps onto
   its own line, and taking it out of layout would move the panel between 44px
   and 98px (measured in Chrome, 2026-09-06).
   ========================================================================== */

.feedback-panel {
  margin-top: auto;   /* pins the control to the card bottom so the cards in a
                         grid row align. Removing this de-aligns the grid. */
  padding-top: 17px;
}

/* The one row. It wraps as a unit on a phone rather than letting each half find
   its own rhythm. */
.feedback-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 12px;
}

.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  /* Learned on .reason-chip and never generalised until now: without these iOS
     paints a grey box over the press and holds the tap for 300ms. The chip was
     the only control on the page that had them, and it is being deleted. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background-color 140ms ease, color 140ms ease,
              border-color 140ms ease, transform 90ms ease;
}

/* Outline at rest, solid when pressed: state carried by the drawing itself. The
   page holds ~26 thumbs, so outline is what keeps them from shouting, and the
   outline-to-solid jump is far more readable while scrolling than the old
   grey-solid-to-white-solid was. */
.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}

.feedback-button[aria-pressed="true"] svg,
.feedback-button.is-selected svg { fill: currentColor; }

/* Split from :focus-visible on purpose. They shared one block, so a mouse hover
   painted the keyboard focus ring — ~26 of them on one page. */
.feedback-button:hover { border-color: var(--ink); }

.feedback-button:focus-visible { border-color: var(--ink); }

.feedback-button:active { transform: scale(0.93); }

/* The stamp: the button takes the press and settles, then the glyph punches in
   40ms behind it. `both` holds the glyph at 0.82 through the delay so the punch
   reads as a delay rather than a jump. The 3% overshoot is the only new easing
   on the page, and it is 3%, not a bounce. */
@keyframes fb-stamp {
  0%   { transform: scale(0.93); }
  55%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes fb-punch {
  from { transform: scale(0.82); }
  to   { transform: scale(1); }
}
.feedback-button.is-stamping     { animation: fb-stamp 240ms cubic-bezier(0.2, 0.8, 0.3, 1); }
.feedback-button.is-stamping svg { animation: fb-punch 200ms cubic-bezier(0.2, 0.8, 0.3, 1) 40ms both; }

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

/* --------------------------------------------------------------------------
   The measure — the optional 1-10 udbytte.
   No colour lives here at all: the mark is ink, and green and red stay on the
   thumb. Fifteen coloured fill-bars down the card column would read as a
   dashboard sitting under a newspaper.
   -------------------------------------------------------------------------- */

/* One token, extending the --fb-* family rather than inventing a palette, and
   now one value per direction because each direction paints its own paper.
   Inheriting --rule put the whole measure — spine and graduation — at 1.57:1
   (editorial), 1.69 (Magasin), 1.57 (Feed) and 1.84 (dark) against that paper,
   under WCAG 1.4.11's 3:1 for the marks that identify a control. A ruler you
   have to look for is not a ruler.
   Every value below is the LIGHTEST that clears 3:1 on the ground its own
   direction actually puts behind a card: editorial 3.06:1 on #f6efe4, Magasin
   3.05:1 on #fbf7f0, Feed 3.05:1 on the white .feed-card, dark 3.06:1 on
   #14110d. Minimum on purpose, and check-layout.mjs re-computes all four: about
   fifteen of these lines run down one morning's page, so every tenth of a point
   above 3:1 is paid for fifteen times. It also keeps the rule quieter than the
   numerals standing on it (--muted, 4.8-5.5:1), which is the whole reason the
   ruler reads as a measure and not as a dashboard. Do NOT round up to a "safe"
   4:1, and do not raise the numerals to match — they already pass. */
:root                         { --rating-rule: #928878; }
:root[data-layout="magazine"] { --rating-rule: #998d7c; }
:root[data-layout="dark"]     { --rating-rule: #6a6055; }
:root[data-layout="feed"]     { --rating-rule: #8f949c; }

/* HELD BACK UNTIL A THUMB IS PRESSED. `visibility`, not `display: none` and not
   the `hidden` attribute — measured, not preferred. The ruler and the thumbs are
   one flex row, but only while the row is wide enough to hold both: at 400px and
   under it wraps, and the panel is 98px instead of 44px. Removing the ruler from
   layout there shortens the card by 54px, so pressing a thumb would shove
   everything below it down under the reader's own finger. That is precisely how
   the "Hvorfor" chips behaved, and it is why they are gone.

   visibility keeps the box and gives up nothing an accessible hide needs: a
   visibility:hidden subtree is out of the tab order and out of the accessibility
   tree, which `opacity: 0` and `pointer-events: none` are NOT. The cost is a
   reserved empty band under the thumbs on a phone-width card, which is invisible
   ink; the alternative is a moving page, which is not.

   Written as [data-revealed="false"] rather than :not([data-revealed="true"]) so
   a scale that reaches the page carrying neither value is a bug that SHOWS,
   rather than a control that silently disappears. */
.rating-scale[data-revealed="false"] { visibility: hidden; }

/* flex-basis rather than a viewport media query: the control lives in a 573px
   card, a 698px lead and a 448px recommendation rail, so it has to key off the
   container it is actually in. */
.rating-scale {
  position: relative;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  flex: 1 1 300px;
  min-width: 0;
  max-width: 460px;
  height: var(--fb-size);   /* one band with the thumbs */
  /* Hands the horizontal axis to the scrub in app.js and keeps everything else
     with the browser. NOT `none`: a vertical swipe that happens to start on the
     ruler still belongs to the page, and fifteen rulers down a column would
     otherwise be fifteen scroll traps — the browser takes the pan and hands the
     scrub a pointercancel, which discards it without voting. `pinch-zoom` is
     named explicitly because dropping it would quietly cancel the zoom the
     viewport meta deliberately allows; between them the two keywords also
     suppress double-tap zoom, which is what .rating-step's `manipulation` was
     buying and why that declaration can stay as it is. */
  touch-action: pan-y pinch-zoom;
}

/* The line of the scale. A ::before rather than a border so each step keeps the
   full 44px of height, and so the mark can sit ON the line it cancels. 10px up
   from the bottom puts the scale's optical centre on the thumbs' centre. */
.rating-scale::before {
  content: "";
  position: absolute;
  right: 0;
  bottom: 10px;
  left: 0;
  height: 1px;
  background: var(--rating-rule);
}

.rating-step {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  height: 100%;
  padding: 0 0 22px;   /* sets the figure on the rule with 12px of air */
  border: 0;
  background: transparent;
  /* Every figure carries the page's own muted-text colour. Holding the seven
     minors back to 55% was tried and measured first — it read beautifully and
     landed at 2.0-2.3:1 against the ground in all four directions, which is
     under the floor for the label of a control someone has to tap. The ruler
     rhythm is carried by the graduation instead (5px minors, 9px at 1/5/10),
     which costs no legibility at all.
     If thirteen scales still read busy on the page, the retreat is one rule and
     no restructuring: hide the seven minor figures and keep their ticks, leaving
     a bare ruler numbered 1, 5, 10. Never hide them on hover — that is dead on
     touch. */
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.72rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: color 120ms ease, transform 90ms ease;
}

/* The graduation. The taller majors at 1, 5 and 10 are what make ten digits read
   as a measure instead of a row of buttons. They count on .rating-mark being the
   LAST child of the scale. */
.rating-step::after {
  content: "";
  position: absolute;
  bottom: 10px;
  left: 50%;
  width: 1px;
  height: 5px;
  margin-left: -0.5px;
  background: var(--rating-rule);
  transition: height 90ms ease, background-color 120ms ease;
}
.rating-step:nth-child(1)::after,
.rating-step:nth-child(5)::after,
.rating-step:nth-child(10)::after { height: 9px; }

.rating-step:hover { color: var(--ink); }
.rating-step:hover::after { height: 9px; background: var(--ink); }

/* The one place the house ring goes inward: the cells are contiguous, so an
   outward ring would sit on its neighbours. Same ring, negated offset. */
.rating-step:focus-visible {
  outline: var(--focus-ring);
  outline-offset: calc(-1 * var(--focus-ring-offset));
  color: var(--ink);
}

.rating-step:active { transform: translateY(1px); }

.rating-step[aria-checked="true"] {
  color: var(--ink);
  font-weight: 800;
}
/* The mark cancels the graduation it lands on. */
.rating-step[aria-checked="true"]::after { background: transparent; }

/* The mark: one 3px ink bar — the weight .section-heading already uses for a
   section rule — that travels along the line to the figure you chose, so a
   changed mind is one movement instead of a collapse and a redraw. The transform
   IS its position, which is why the reduced-motion block below must not null it. */
.rating-mark {
  position: absolute;
  bottom: 10px;
  left: 0;
  width: 10%;
  height: 3px;
  background: var(--ink);
  opacity: 0;
  transform: translateX(0) scaleX(0.2);
  transform-origin: center bottom;
  pointer-events: none;
  transition: transform 190ms cubic-bezier(0.2, 0.8, 0.3, 1), opacity 110ms ease;
}
.rating-scale[data-rating] .rating-mark {
  opacity: 1;
  transform: translateX(calc(var(--rating-index) * 100%)) scaleX(1);
}

/* The opening. A measure being laid down beside the thumbs: the ruler rises 4px
   and fades while its spine draws out from the left. Short and editorial rather
   than bouncy — no overshoot, the page's own easing, and nothing that paints
   outside the box it already occupies, because this can fire on any of thirteen
   to nineteen panels in one session. The class is removed when the animation
   ends (see revealRatingScale in app.js), so it never sits on the element. */
@keyframes rating-reveal {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}
@keyframes rating-spine {
  from { transform: scaleX(0.12); }
  to   { transform: scaleX(1); }
}
.rating-scale.is-revealing { animation: rating-reveal 200ms cubic-bezier(0.2, 0.8, 0.3, 1); }
.rating-scale.is-revealing::before {
  transform-origin: left center;
  animation: rating-spine 280ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

/* --------------------------------------------------------------------------
   The phone half of the measure — everything below exists only while a finger
   is down, and a mouse never reaches any of it (see the pointerType gate in
   bindRatingScrub). The desktop control is unchanged.

   The arithmetic that forces this: ten 44px targets need 440px, and the widest
   phone this control ever gets is 394px, so a cell is 30-38px however it is
   drawn. Accuracy therefore cannot come from where the finger LANDS. It comes
   from where the finger LIFTS: land anywhere, read the number off the bubble
   above the row, slide until it is the one you meant, then let go. Nothing is
   sent until the release, so a mis-landing costs a small movement instead of a
   wrong number in the sheet — and the 5/6 slip, which flips the thumb and the
   only field the weekly topic loop reads, stops being silent.
   -------------------------------------------------------------------------- */

/* Positioned with the same width:10% + translateX(index * 100%) arithmetic as
   .rating-mark, so the bubble and the mark can never disagree about where a
   number lives. Above the row because the finger is on it: the receipt has to
   be somewhere the hand is not. It sits over the thumbs when the finger is at
   the low end — deliberate; it is gone before the release stamps one. */
.rating-bubble {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 10%;
  height: 34px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 1.15rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  /* The one declaration that must never be lost: the bubble is inside the
     scale, so if it took pointer events it would eat the finger that is
     steering it the moment the scrub reached its own column. */
  pointer-events: none;
  transform: translateX(calc(var(--rating-preview) * 100%));
  /* Like .rating-mark, the transform IS its position — the global reduced-motion
     rule nulls `transition`, which is the correct half to kill here. */
  transition: transform 90ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

/* The previewed figure borrows the hover treatment, which is dead on touch
   anyway. Nothing here paints outside .is-scrubbing, so the resting ruler on any
   device is byte-identical to what it was. */
.rating-scale.is-scrubbing .rating-step[data-preview="true"] {
  color: var(--ink);
  font-weight: 800;
}
.rating-scale.is-scrubbing .rating-step[data-preview="true"]::after {
  height: 9px;
  background: var(--ink);
}

/* The global reduced-motion rule kills `transition` but NOT `animation`, and it
   must not null the mark's transform. Both halves are handled here. */
@media (prefers-reduced-motion: reduce) {
  .feedback-button.is-stamping,
  .feedback-button.is-stamping svg { animation: none !important; }
  /* The reveal is a state change, not decoration, so it still happens — it just
     happens instantly. Both halves are named because `animation` on the element
     says nothing about the pseudo-element's. */
  .rating-scale.is-revealing,
  .rating-scale.is-revealing::before { animation: none !important; }
  .feedback-button:active,
  .rating-step:active { transform: none; }
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* THE SIGNAL'S RATING, since 2026-09-14. The story's own control, thumbs and
   ruler, every size and colour unchanged — the 44px touch floor and the 3:1 edge
   are accessibility, not decoration, so they are not what gets cut. What changes
   is only where it sits, because nine to thirteen of them share one section:

   - ONE ROW, never two. A story card lets the ruler wrap under the thumbs when
     it is narrow, and holds that second line invisibly at rest so the press moves
     nothing. Under a signal that reserve was a 54px empty band in every item
     (Chrome, 2026-09-14, 376px card), the part of the section that read as a wall.
     nowrap keeps the ruler beside the thumbs at every width; it shrinks instead,
     and a phone reader corrects a narrow cell with the finger scrub.
   - PINNED TO THE ITEM'S FOOT, so the controls in one grid row stand on one line
     instead of stepping with each summary's length.
   - a smaller glyph inside the same 44px circle, which is where "quiet at rest"
     can be bought without shrinking anything a finger or an eye needs. */
.signal-item {
  display: flex;
  flex-direction: column;
}
.signal-item .feedback-panel {
  margin-top: auto;
  padding-top: 10px;
}
.signal-item .feedback-controls { flex-wrap: nowrap; }
.signal-item .rating-scale { flex: 1 1 0; }
.signal-item .feedback-button svg {
  width: 18px;
  height: 18px;
}

/* "Morgenens signaler" (and the period pages' "Kort fra ugen/måneden/året"; the
   daily grid was called "Kort fortalt" until 2026-09-14): three items to a row on
   desktop, two at tablet, one below.
   Laid on six tracks rather than three so the last row can always be filled —
   with three tracks, five signals left a 376x149px empty third cell, the same
   defect as the story grid one section up [measured 2026-09-05]. Six tracks of
   a shared gutter give exactly the old widths (span 2 = 376px at 1180px), and
   a half-row of two can widen to span 3 each instead of orphaning a track. */
.short-news,
.mag-signals-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  column-gap: var(--col-gap);
}

@media (min-width: 720px) {
  .short-news,
  .mag-signals-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .short-news > .signal-item,
  .mag-signals-grid > .signal-item { grid-column: span 3; }
}

/* The two-per-row band, 720 to 899. It needs its own orphan rule and cannot
   borrow the desktop one: at two items to a row there is no half-row-of-two
   case, and the 3n+1 selectors below are arithmetic for three tracks, so at
   800px an odd count left the last item alone with a 393px dead cell beside it
   — exactly the defect item 5 names, measured on the real 2026-09-05 brief.
   Bounded at the top on purpose: an unbounded `:nth-child(odd):last-child`
   would leak into desktop and widen, say, a ninth item that closes its row
   perfectly well there. */
@media (min-width: 720px) and (max-width: 899.98px) {
  .short-news > .signal-item:nth-child(odd):last-child,
  .mag-signals-grid > .signal-item:nth-child(odd):last-child { grid-column: span 6; }
}

@media (min-width: 900px) {
  .short-news > .signal-item,
  .mag-signals-grid > .signal-item { grid-column: span 2; }

  /* A last row holding two items: both widen to half the section. The selector
     reads "starts a row AND is second from last", which is only true when
     exactly two items remain. */
  .short-news > .signal-item:nth-child(3n + 1):nth-last-child(2),
  .short-news > .signal-item:nth-child(3n + 1):nth-last-child(2) ~ .signal-item,
  .mag-signals-grid > .signal-item:nth-child(3n + 1):nth-last-child(2),
  .mag-signals-grid > .signal-item:nth-child(3n + 1):nth-last-child(2) ~ .signal-item {
    grid-column: span 3;
  }

  /* A last row holding one item: it takes the whole width. */
  .short-news > .signal-item:nth-child(3n + 1):last-child,
  .mag-signals-grid > .signal-item:nth-child(3n + 1):last-child { grid-column: span 6; }
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 14px;
}

/* Heading and subtitle are one block here, so the rule sits under the pair
   rather than between them — but it is the same 3px rule every other section
   label gets, on the same left edge. */
.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0;
  padding-bottom: 9px;
  border-bottom: 3px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: left;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

/* The recommendations top mirrors the front page's lead layout: the featured
   pick reads like the lead story and the shortlist sits in a rail beside it, as
   "Morgenens signaler" did beside the lead until 2026-09-14. Before this the featured card ran the
   full section width, so its 3:2 image was the largest picture on the page and
   dwarfed the news it followed. Scoped to .recs-layout so Magasin and Feed,
   which build their own recommendation DOM, keep the standalone block. */
.recs-layout {
  display: flex;
  flex-wrap: wrap;
  gap: var(--col-gap);
  align-items: flex-start;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recs-layout > .recommendation-featured {
  flex: 1 1 540px;
  min-width: 0;
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: 0;
}

.recs-layout > .recommendation-shortlist {
  flex: 1 1 290px;
  min-width: 0;
  margin: 0;
  border-top: 0;
}

/* When the rail wraps under the featured pick it grows a separating rule. */
@media (max-width: 860px) {
  .recs-layout > .recommendation-shortlist {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

/* Same landscape crop as the front-page hero, so the featured pick and the lead
   story present at the same size and shape. */
.recs-layout .recommendation-featured-card .recommendation-media {
  aspect-ratio: 16 / 9;
}

/* Unless the picture is a portrait — which, in this section, means a book cover.
   The 16:9 hero showed 37% of one: a horizontal band across its middle, from a
   329px source stretched to 698px [measured 2026-09-05]. A cover should be shown
   whole and at its own pixels. No stylesheet can know a picture's shape, so the
   image says so once it has loaded (renderRecommendationMedia), and the card
   re-lays itself around the answer. */
.recommendation-media[data-orientation="portrait"],
.recs-layout .recommendation-featured-card .recommendation-media[data-orientation="portrait"] {
  /* Both selectors on purpose: the featured rule above is three classes deep, so
     a single-class override loses to it and the cover keeps the 16:9 crop. */
  aspect-ratio: auto;
  max-width: min(100%, 320px);
  background: transparent;
}

.recommendation-media[data-orientation="portrait"] img {
  height: auto;
  object-fit: contain;
}

.recommendation-media[data-orientation="portrait"] .recommendation-media-link {
  height: auto;
}

/* Beside the text rather than above it, once there is room for both: a cover
   sitting over a 698px measure leaves the card top-heavy and half empty. 240px
   is chosen from what the text column then has left — 424px, which is the width
   at which the thumbs and the 1-10 measure still sit on one row, the way they do
   in every other panel on the page [measured 2026-09-05]. */
@media (min-width: 900px) {
  .recs-layout .recommendation-featured-card[data-media-orientation="portrait"] {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    column-gap: var(--col-gap);
    align-items: start;
  }

  .recs-layout .recommendation-featured-card[data-media-orientation="portrait"] .recommendation-media {
    max-width: 100%;
    margin: 0;
  }
}

/* Same shape and the same orphan rule as .story-grid. Normally empty in the
   editorial layout, where every non-featured pick is a shortlist row — and it
   is hidden outright in that case (src/web/render/recommendation.js), because
   an empty div left in the DOM is a box waiting for someone to give it padding. */
.recommendation-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  column-gap: var(--col-gap);
  align-items: start;
}

@media (min-width: 900px) {
  .recommendation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .recommendation-grid > .recommendation:last-child:nth-child(odd) { grid-column: 1 / -1; }
}

/* The shortlist: many links, one line each. Deliberately typographic and dense
   next to the featured card above it, so the difference in depth is visible
   before a word is read. */
.recommendation-shortlist {
  margin: 4px 0 0;
  border-top: 1px solid var(--rule);
}

/* Shape and spacing only: the type is shared with .section-heading above, so
   every label on the page is one object. */

.recommendation-short {
  padding: 13px 0 12px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-head {
  margin: 0;
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.4;
}

.recommendation-short-link {
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-link:hover,
.recommendation-short-link:focus-visible {
  color: var(--red);
  border-bottom-color: currentColor;
}

.recommendation-short-meta {
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.73rem;
  letter-spacing: 0.01em;
}

.recommendation-short-note {
  margin: 3px 0 0;
  max-width: 68ch;
  color: var(--body-soft, var(--muted));
  font-family: var(--serif);
  font-size: 0.9rem;
  line-height: 1.5;
}

.recommendation-short .feedback-panel {
  margin-top: 8px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  text-wrap: pretty;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: var(--tap-min);
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover {
  background: var(--ink);
  color: var(--paper);
}

.page-footer {
  /* Same edge as the top bar and the shell — see --gutter. */
  padding: 27px max(var(--gutter), calc((100% - var(--shell)) / 2));
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
  /* The status now has a lifetime (setFeedbackStatus clears it after 4s), so it
     fades out instead of snapping away mid-sentence. */
  transition: opacity 180ms ease;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  /* The shell's own side margin, so the bar's CONTENT BOX ends exactly where the
     news column does and the strip never runs wider than the page. The pills
     themselves are centred inside it (justify-content above), the way the
     masthead and the footer are centred — so the bar's first pill does NOT sit
     on the lead story's left edge, and the claim that it does was wrong when it
     was written here [corrected 2026-09-06, measured: shell edge 130.0px, first
     pill 322.9px at 1440px]. Chrome is centred, content is left-aligned; that is
     the composition, not an alignment bug. max() keeps a gutter when the
     viewport is narrower than the shell (a scrollbar-inflated 100vw). */
  padding: 9px max(var(--gutter), calc((100% - var(--shell)) / 2));
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  /* --tap-min, like every other control the reader presses. These were 36px —
     below the touch floor the token was written to enforce, on the device he
     actually reads on. */
  min-height: var(--tap-min);
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

/* On a phone the bar wrapped to five rows and 205px [measured 2026-09-05 at
   375px]: a quarter of the screen was navigation before the brand appeared, and
   the wrap orphaned single pills — "Arkiv" alone on row two, "Mørk" alone on row
   five. One row that scrolls sideways instead. Nothing is ever alone on a line,
   the masthead starts at the top of the page, and no pill has to shrink below
   the touch floor to fit. */
@media (max-width: 700px) {
  .top-bar {
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    gap: 4px 10px;
  }

  .top-bar::-webkit-scrollbar { display: none; }

  .edition-nav,
  .top-bar > div,
  .layout-nav { flex: 0 0 auto; flex-wrap: nowrap; }

  .top-bar-divider { flex: 0 0 auto; }

  .edition-tab,
  .layout-tab,
  .archive-link,
  .layout-nav-label { white-space: nowrap; }

  .edition-tab,
  .layout-tab,
  .archive-link { padding: 5px 11px; }
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  /* Same edge as every other section. It was min(1180px, 100% - 24px) — a
     fourth outer margin on a page that now has one. */
  width: var(--shell);
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
/* 100%, not var(--shell): this box lives INSIDE .page-shell, and --shell is a
   percentage of whatever reads it, so var(--shell) here would inset it by a
   second gutter. Editorial and dark only — Magasin and Feed replace the shell's
   children outright, so this section does not exist there. */
.read-later {
  width: 100%;
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover {
  background: var(--paper);
  border-color: var(--ink);
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

/* Wider than --shell on purpose (Magasin breaks out of the centred column), but
   off the SAME gutter, so the two directions share an outer edge. */
.mag-inner {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: var(--focus, center);
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
/* FROM 900PX THE PICTURE TAKES THE RIGHT 60% AND THE HEADLINE THE DARK LEFT [2026-09-15]. Full
   bleed, the hero's headline (16ch at up to 5.6rem, about 650px from the left edge) sat across the
   middle of a 1440x729 picture, and on the 2026-09-14 replay that was Dario Amodei's face: a
   single portrait's subject stands in the middle, exactly where the headline was. With the picture
   in a right-hand panel the middle of the picture is at 70% of the width, clear of the headline,
   and inside the panel the picture is placed by its stored focus. The scrim fades the panel's left
   edge into the ink ground so the headline's last letters still stand on dark.
   scripts/check-geometry.mjs measures the focus point against the headline in headless Chrome. */
@media (min-width: 900px) {
  .mag-hero-media { left: 40%; }
  .mag-hero-scrim {
    background:
      linear-gradient(to right, var(--ink) 40%, rgba(12, 9, 6, 0.6) 52%, rgba(12, 9, 6, 0) 72%),
      linear-gradient(to top, rgba(12, 9, 6, 0.7) 0%, rgba(12, 9, 6, 0) 45%);
  }
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

@media (min-width: 900px) and (max-width: 1199px) {
  /* Narrower, the headline's 16ch at 7vw still reached 533px of a 900px hero and crossed the
     picture's middle (scripts/check-geometry.mjs, 2026-09-15): the picture takes the right 54%
     and the headline is held to the left 44% at a size that fits it. */
  .mag-hero-media { left: 46%; }
  .mag-hero-scrim {
    background:
      linear-gradient(to right, var(--ink) 46%, rgba(12, 9, 6, 0.6) 56%, rgba(12, 9, 6, 0) 72%),
      linear-gradient(to top, rgba(12, 9, 6, 0.7) 0%, rgba(12, 9, 6, 0) 45%);
  }
  .mag-hero-headline { max-width: 44vw; font-size: clamp(2.4rem, 5vw, 3.6rem); }
  .mag-hero-sub { max-width: 44vw; }
}
.mag-reading {
  width: min(720px, calc(100% - 2 * var(--gutter)));
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
/* Column behaviour (and the orphan rules) are shared with .short-news above —
   it is the same three-up list of signals, so it gets the same last row. */
.mag-signals-grid {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto;
}

.mag-stories,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
