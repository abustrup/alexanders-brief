<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  /* One gutter for the page's outer edge. Before 2026-09-05 the shell used 94vw
     while the top bar and the footer each hard-coded 16px, so the page had three
     different left edges — and the mismatch flipped sign as the window narrowed:
     at 1280px the footer started 27px INSIDE the news column, at 375px 5px
     outside it. 94vw is also only 11px of gutter on a phone, which put the
     reading column against the bezel. Every left edge on the page now derives
     from this one number. Deliberately a percentage and not 100vw: 100vw
     includes the scrollbar, so on a desktop with classic scrollbars a vw-based
     shell sits 7px off the padding that is supposed to match it. */
  --gutter: clamp(18px, 3vw, 30px);
  --container: min(1180px, calc(100% - 2 * var(--gutter)));
  /* One gutter for every column system on the page. Before 2026-09-05 the story
     grid used 34px, "Kort fortalt" 26px and the Magasin bands 30px, so no two
     sections shared a vertical edge and no full-width rule landed on one. */
  --col-gap: 34px;
  --tap-min: 44px;
  /* One focus ring for the whole page. There were four teals at three alphas,
     and six rules painted the ring on :hover as well — a keyboard indicator
     drawn by a mouse. The house rule is now: ring on focus, fill on hover,
     never the reverse, and never both from one selector list. */
  --focus-ring: 2px solid var(--teal);
  --focus-ring-offset: 2px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  /* The thumbs' only boundary at rest, and since 2026-09-06 the ONLY drawn thing
     on a story that has not been voted on — the ruler is held back until a thumb
     is pressed. It inherited --rule and sat at 1.58:1 (editorial), 1.69
     (Magasin) and 1.84 (dark) against the paper behind it, which is under WCAG
     1.4.11's 3:1 and left the optional measure drawn HEAVIER than the primary
     control. It now takes the ruler's own value, so the two are one weight and
     both are the lightest thing that clears 3:1 on the ground their direction
     paints. Feed overrides it because its thumb is a filled chip, so its
     boundary has a second, lighter neighbour to clear (see that block). */
  --fb-border-color: var(--rating-rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  /* --fb-border-color deliberately absent: :root's var(--rating-rule) resolves
     to this direction's own #6a6055, which is 3.06:1 on #14110d. The #4a3f33 it
     used to hold was 1.84:1. */
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  /* The keyboard ring, one shade darker than the direction's green, and the
     only place Feed departs from --teal. #18a06b clears 3:1 on the white card
     a Feed control usually sits on (3.34:1) and does NOT clear it on the page
     itself (2.93:1) — which is where the skip link and the app-bar chips live.
     #0f8f5f is 4.11:1 on the card and 3.60:1 on the page, so the ring holds
     wherever the control stands. Found on 2026-09-06, the day the focus check
     started grading rings for contrast instead of only counting them. */
  --focus-ring: 2px solid #0f8f5f;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  /* The one direction whose thumb is a filled chip rather than an outline, and
     until 2026-09-06 the one with no drawn boundary at all: width 0, colour
     transparent, so the whole control was a #f1f2f4 chip on a white card at
     1.12:1. Its ring has TWO neighbours — the chip it encloses and the card
     around it — so it is graded against the lighter one: #888c94 is 3.01:1 on
     the #f1f2f4 fill and 3.37:1 on the white card. It is darker than this
     direction's --rating-rule (#8f949c) for that reason alone; the spine only
     ever touches the card. */
  --fb-border-color: #888c94;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

/* ==========================================================================
   Controls — what everything the reader can press or focus shares
   --------------------------------------------------------------------------
   Three properties, one ring, one press. All of it was learned on .reason-chip
   and never generalised until that control was deleted (2026-09-05): without
   -webkit-tap-highlight-color iOS paints a grey box over every press, without
   touch-action it holds the tap 300ms, and a control with no :active is
   visually dead under a finger, because :hover never fires on touch.
   .feedback-button and .rating-step keep their own copies — they animate
   differently and that block is deliberately self-contained.
   ========================================================================== */
.skip-link,
.audio-button,
.primary-source-link,
.save-later-button,
.recommendation-cta,
.read-later-dismiss,
.edition-tab,
.layout-tab,
.archive-link,
.feed-chip,
.feed-cta {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.audio-button:active,
.primary-source-link:active,
.save-later-button:active,
.recommendation-cta:active,
.read-later-dismiss:active,
.edition-tab:active,
.layout-tab:active,
.archive-link:active,
.feed-chip:active,
.feed-cta:active { transform: scale(0.97); }

/* ONE ring, on every focusable thing the page renders. Six controls had no
   :focus-visible rule at all and fell back to the UA ring, and the two picture
   links had only a 1.2% image scale, which reads as nothing. Ring on focus,
   fill on hover — see --focus-ring. */
.skip-link:focus-visible,
.audio-button:focus-visible,
.primary-source-link:focus-visible,
.save-later-button:focus-visible,
.recommendation-cta:focus-visible,
.read-later-dismiss:focus-visible,
.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible,
.feedback-button:focus-visible,
.headline-link:focus-visible,
.story-media-link:focus-visible,
.recommendation-media-link:focus-visible,
.recommendation-headline-link:focus-visible,
.recommendation-short-link:focus-visible,
.signal-link:focus-visible,
.klumme-source:focus-visible,
.key-number-source:focus-visible,
.primary-excerpt-source:focus-visible,
.image-credit:focus-visible,
.read-later-link:focus-visible,
.archive-entry-link:focus-visible,
.source-link:focus-visible,
.feed-chip:focus-visible,
.feed-cta:focus-visible {
  outline: var(--focus-ring);
  outline-offset: var(--focus-ring-offset);
}

/* The exceptions, and the only ones: these links sit on an inverted band, where
   the teal ring all but disappears. Same 2px, same offset. The Magasin hero is
   the third of them — its headline sits on var(--ink), where the teal ring came
   out at 2.80:1, under the 3:1 floor — and it was found on 2026-09-06, the day
   the focus check started grading rings for contrast instead of only counting
   them. */
.mag-keynumber-source:focus-visible,
.feed-keynumber-source:focus-visible,
.mag-hero .headline-link:focus-visible {
  outline: 2px solid #fff;
  outline-offset: var(--focus-ring-offset);
}

/* The global reduced-motion rule kills `transition`, not `transform`, so a press
   set outside a transition still moves. Null it here the way the feedback block
   nulls its own. */
@media (prefers-reduced-motion: reduce) {
  .audio-button:active,
  .primary-source-link:active,
  .save-later-button:active,
  .recommendation-cta:active,
  .read-later-dismiss:active,
  .edition-tab:active,
  .layout-tab:active,
  .archive-link:active,
  .feed-chip:active,
  .feed-cta:active { transform: none; }
}

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

/* text-wrap: balance evens the dek's two lines. Without it the 2026-09-05 dek
   split a proper noun across them ("...New / Zealand kalder historisk"). */
.masthead-dek {
  text-wrap: balance;
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: var(--tap-min);
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

/* Hover fills, focus rings. They shared one selector list, so a mouse hover
   painted the keyboard focus indicator — see --focus-ring. */
.audio-button:hover {
  border-color: var(--ink);
  background: color-mix(in srgb, var(--ink) 7%, transparent);
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  /* Center, not baseline. Baseline aligned the two controls by their text, which
     left a 44px box and a 30px pill sitting 12px off-centre from each other and
     5px off in the row [measured 2026-09-03]. They are a pair and should read as
     one row of controls. */
  align-items: center;
  margin: 16px 0 0;
}

.save-later-button {
  /* Matched to .primary-source-link: same height, same optical padding, so the pair
     sits on one line with equal weight. It keeps the pill shape and the lighter rule
     because it is the secondary action, and that difference should be the ONLY one.
     Padding is symmetric and measures symmetric: 12px of space each side of the ink
     at every one of the twelve buttons on the page [measured 2026-09-03]. What made
     it look wrong was the height and baseline mismatch above, not this box. */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap-min);
  padding: 0 16px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  /* Letter-spacing adds a trailing space after the last glyph, which shifts centred
     text visibly left. Compensate so the ink is optically centred, not just boxed. */
  letter-spacing: 0.01em;
  text-indent: 0.01em;
  transition: border-color 140ms ease, color 140ms ease, background-color 140ms ease;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  text-wrap: pretty;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

/* The thesis is the claim; the body is only its reason. At 1.04rem against a
   0.95rem paragraph it was 9% larger and the two read as one block of prose,
   with the title at 1.5rem doing all the hierarchy on its own. 1.20rem makes
   the step visible: 24 / 19.2 / 15.2px.
   max-width moves WITH the font-size and is not a separate tweak — ch scales
   with the element's own size, so 60ch at 1.20rem would push this block 83px
   past the .klumme-body block underneath it and break a flush right edge the
   two are deliberately holding (566px against 570px) [verified 2026-09-05]. */
.klumme-thesis {
  margin: 0 0 14px;
  max-width: 52ch;
  font-family: var(--serif);
  font-size: 1.20rem;
  font-style: italic;
  line-height: 1.44;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

/* Same step as editorial, one notch bolder because Magasin is display-driven:
   36.8 / 21.1 / 16px. No max-width here — the thesis inherits the band's 70ch. */
.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.32rem;
  font-style: italic;
  line-height: 1.42;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

/* Feed's title is only 1.3rem, so the thesis stops at 1.14rem: any bigger and
   the claim starts competing with the headline above it instead of following it. */
.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1.14rem;
  font-style: italic;
  line-height: 1.44;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);

}

.key-number-value {

}

.key-number-sparkline {

}

.sparkline-line {

  vector-effect: non-scaling-stroke;
}

.sparkline-dot {

}

/* The last reading of the same quantity, when there was one. This line is the
   difference between a figure and a measurement, so it sits directly under the
   number rather than down with the source. */
.key-number-previous {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
}

.key-number-change {

}

.key-number-asof {
