<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8eddf">
  <title>Alexanders Brief</title>
  <style>:root {
  color-scheme: light;
  /* Frozen reading column: constant width on desktop, capped to the viewport
     on small screens. The composition never reflows, so type uses fixed sizes
     (no vw units) and stays identical when the browser is zoomed out. */
  --shell: min(720px, calc(100% - 24px));
  --ink: #181714;
  --muted: #6e675f;
  --paper: #f8eddf;
  --paper-deep: #f0dfcc;
  --rule: #b9aa99;
  --red: #a82942;
  --teal: #0b6769;
  --green: #255d49;
  --blue: #263d5c;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--serif);
  font-size: 3.5rem;
  font-weight: 700;
  letter-spacing: -0.055em;
  line-height: 0.94;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 1.06rem;
  line-height: 1.35;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--red);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.lead-layout {
  display: block;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.story {
  min-width: 0;
}

/* Lead is always stacked: image on top, text below, signals beneath. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-align: center;
  text-transform: uppercase;
}

.story-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 28px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-grid .story-card:nth-child(odd) {
  padding-right: 28px;
  border-right: 1px solid var(--rule);
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  background: #d8cabb;
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, rgba(11, 103, 105, 0.14), transparent 55%),
    repeating-linear-gradient(0deg, #decfbe 0 1px, #eadccc 1px 8px);
}

.media-fallback-label {
  max-width: 90%;
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--red);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 2.5rem;
  font-weight: 700;
  hyphens: auto;
  letter-spacing: -0.04em;
  line-height: 0.99;
}

.story-card .story-headline {
  font-size: 1.55rem;
  line-height: 1.02;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: #443f39;
  font-family: var(--serif);
  font-size: 1.04rem;
  line-height: 1.34;
}

.story-body,
.editorial-continuation {
  font-size: 0.93rem;
  line-height: 1.55;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: #403c37; }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

.feedback-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.feedback-button,
.reason-chip {
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

.feedback-button {
  font-size: 0.74rem;
  font-weight: 700;
}

.feedback-button:hover,
.feedback-button:focus-visible,
.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--paper-deep);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected { background: var(--green); color: #fff; }
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected { background: var(--red); color: #fff; }

.feedback-reasons { margin-top: 9px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 34px;
  margin: 0 4px 5px 0;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 0.71rem;
}

.lead-signals {
  min-width: 0;
  margin-top: 19px;
  padding-top: 19px;
  border-top: 1px solid var(--ink);
}

/* Signal rows: meta on its own line, then headline | summary side by side. */
.lead-signals .signal-item {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  column-gap: 18px;
}

.lead-signals .signal-meta { grid-column: 1 / -1; }

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--red);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: #4e4943;
  font-size: 0.79rem;
  line-height: 1.4;
}

.short-news {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.short-news .signal-item {
  padding: 18px 20px 18px 0;
}

.short-news .signal-item:not(:nth-child(3n + 1)) {
  padding-left: 20px;
  border-left: 1px solid var(--rule);
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 28px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-grid .recommendation-card:nth-child(odd) {
  padding-right: 28px;
  border-right: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: #d8cabb;
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--red);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--red);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-size: 0.93rem;
  line-height: 1.55;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: #403c37; }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-meta">
      <p id="brief-date"></p>
      <p id="brief-reading-time"></p>
    </div>
    <h1 id="brief-title">Alexanders Brief</h1>
    <p id="brief-dek" class="masthead-dek"></p>
    <div id="audio-controls" class="audio-controls" aria-label="Lydoplæsning" hidden></div>
  </header>
  <main class="page-shell">
    <section class="lead-layout" aria-label="Tophistorie og vigtigste signaler">
      <div id="lead-story"></div>
      <aside id="lead-signals" class="lead-signals" aria-label="Morgenens signaler"></aside>
    </section>
    <section class="expanded-news" aria-labelledby="story-grid-heading">
      <h2 id="story-grid-heading" class="section-heading">Dagens vigtigste historier</h2>
      <div id="story-grid" class="story-grid"></div>
    </section>
    <section id="short-news-section" class="short-news-section" aria-labelledby="short-news-heading">
      <h2 id="short-news-heading" class="section-heading">Kort fortalt</h2>
      <div id="short-news" class="short-news"></div>
    </section>
    <div id="key-number-slot" class="key-number-slot" hidden></div>
    <section id="recommendations-section" class="recommendations-section" aria-labelledby="recommendations-heading" hidden>
      <header class="recommendations-header">
        <h2 id="recommendations-heading" class="section-heading">AI-redaktørens valg</h2>
        <p class="recommendations-subtitle">Se · læs · lyt · oplev · prøv</p>
      </header>
      <div id="recommendation-featured" class="recommendation-featured"></div>
      <div id="recommendation-grid" class="recommendation-grid"></div>
    </section>
  </main>
  <footer class="page-footer">
    <p>Fakta, fortolkning og kilder er samlet i et læsbart flow.</p>

  <script>globalThis.__BRIEF_DATA__ = {"schemaVersion":1,"runId":"2026-06-28-v1","date":"2026-06-28","generatedAt":"2026-06-28T04:05:00Z","readingMinutes":11,"title":"Alexanders Brief","dek":"Danmark satte varmerekord, Iran og USA udvekslede angreb i Golfen, og Vučić bebudede sin afgang – plus talentflugt fra Google DeepMind.","profileWeights":{"importance":25,"decisionValue":20,"novelty":15,"sourceQuality":15,"personalRelevance":15,"contrast":10},"stories":[{"id":"story-dk-heat-record-20260628","eventKey":"dk-all-time-heat-record-37c-2026","materialFacts":["DMI målte 37,0 grader lørdag 28. juni i Beldringe nord for Odense og i Odum nord for Aarhus","Rekorden slår den hidtidige danmarksrekord på 36,4 grader fra august 1975","Ifølge AFP var knap 200 millioner europæere udsat for over 35 grader samme dag"],"section":"Klima","headline":"Denmark records hottest day on record at 37C: weather service","primarySourceUrl":"https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service","subheadline":"Danmark satte lørdag sin højeste temperatur nogensinde midt i en europæisk hedebølge","body":["Danmark satte lørdag den højeste temperatur, der er målt, siden de landsdækkende målinger begyndte i 1874. DMI registrerede 37,0 grader to steder – i Beldringe nord for Odense og i Odum nord for Aarhus. Den tidligere rekord var 36,4 grader fra august 1975. Meteorolog Rasmus Stoltze Hansen oplyste, at en første måling på 36,6 grader omkring middag kun holdt cirka en time, før rekorden faldt.","Rekorden er del af en bred europæisk hedebølge. Ifølge AFP var knap 200 millioner europæere udsat for over 35 grader samme dag, og der blev sat varmerekorder i blandt andet Schweiz, Tjekkiet og Storbritannien."],"whyItMatters":"37 grader er ikke bare en kuriositet. Danske byer, transport og sundhedsvæsen er bygget til et køligere klima, og varmen gav i denne uge problemer for metro, letbane og vandforsyning.","analysis":"En enkelt rekorddag beviser ikke klimaforandringer, men 1975-rekorden stod i 51 år, og juni 2026 har nu leveret både den varmeste juninat og den varmeste dag. TV 2's Peter Tanev vurderer, at 40 grader herhjemme kun er et spørgsmål om tid.","counterpoint":"DMI venter et mere normalt sommervejr de kommende dage; det er hyppigheden af ekstremer, ikke den enkelte dag, der tæller.","image":{"url":"https://apiwp.thelocal.com/wp-content/uploads/2026/06/javier-rincon-ItScuDBcZyc-unsplash-1.jpg","credit":"Foto: Unsplash/The Local","alt":"Sol og sommervarme over et dansk landskab","sourceUrl":"https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"},"topics":["klima","vejr","Danmark","hedebølge"],"entities":["DMI","Beldringe","Odum","Rasmus Stoltze Hansen","Danmark"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":60,"novelty":70,"sourceQuality":78,"personalRelevance":55,"contrast":60},"claims":[{"text":"DMI målte 37,0 grader i Beldringe og Odum 28. juni 2026 – Danmarks højeste temperatur nogensinde.","sourceUrls":["https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"],"confidence":"high"},{"text":"Den tidligere danmarksrekord var 36,4 grader fra august 1975.","sourceUrls":["https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"],"confidence":"high"},{"text":"Knap 200 millioner europæere var udsat for over 35 grader samme dag ifølge AFP.","sourceUrls":["https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service"],"confidence":"medium"}],"sources":[{"title":"Denmark records hottest day on record at 37C: weather service","publisher":"The Local Denmark","url":"https://www.thelocal.dk/20260628/denmark-records-hottest-day-on-record-at-37c-weather-service","publishedAt":"2026-06-28T05:30:00Z","kind":"reporting"}]},{"id":"story-us-iran-hormuz-20260628","eventKey":"us-iran-strikes-hormuz-bahrain-kuwait-2026-06","materialFacts":["Irans Revolutionsgarde affyrede missiler og droner mod den amerikanske base Ali Al Salem i Kuwait og mod 5. flådes hovedkvarter i Bahrain","USA bombede for anden dag i træk iranske mål ved Sirik, Bandar-e Lengeh og Qeshm","Ingen amerikanske tab er meldt, mens olieprisen samtidig faldt til det laveste siden februar"],"section":"Sikkerhed","headline":"Iran war day 121: Iran attacks Bahrain, Kuwait as US strikes near Hormuz","primarySourceUrl":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz","subheadline":"Iran ramte amerikanske baser i Golfen, efter at USA for anden dag bombede mål nær Hormuzstrædet","body":["USA og Iran eskalerede voldsomt i weekenden. Irans Revolutionsgarde affyrede missiler og droner mod den amerikanske base Ali Al Salem i Kuwait og mod USA's 5. flådes hovedkvarter i Bahrain. Bahrain aktiverede luftalarmer, og Kuwait sit luftforsvar. USA meldte ingen tab.","Angrebene fulgte, efter at USA for anden dag bombede iranske mål ved Sirik, Bandar-e Lengeh og Qeshm. Udløseren var ifølge centralkommandoen et iransk droneangreb mod et handelsskib nær Hormuzstrædet."],"whyItMatters":"Direkte iranske angreb på amerikanske baser i Golfen er en markant eskalation af en ellers skrøbelig våbenhvile. Golfstaterne huser tusindvis af amerikanske soldater.","analysis":"Markederne reagerede modsat: Trods angrebene faldt Brent fredag til omkring 72 dollar – det laveste siden 27. februar – fordi trafikken gennem Hormuz blev genoptaget. For dansk inflation betyder strædets åbenhed mere end antallet af angreb.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/1/16/Strait_of_Hormuz_and_Musandam_Peninsula_%28MODIS_2018-12-10%29.jpg","credit":"Foto: NASA/Wikimedia Commons","alt":"Satellitbillede af Hormuzstrædet og Musandam-halvøen","sourceUrl":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"},"topics":["sikkerhed","Mellemøsten","energi","geopolitik"],"entities":["USA","Iran","Bahrain","Kuwait","IRGC","Hormuzstrædet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":62,"novelty":64,"sourceQuality":76,"personalRelevance":40,"contrast":66},"claims":[{"text":"IRGC angreb den amerikanske base Ali Al Salem i Kuwait og 5. flådes hovedkvarter i Bahrain med missiler og droner.","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"],"confidence":"high"},{"text":"USA bombede for anden dag i træk iranske mål ved Sirik, Bandar-e Lengeh og Qeshm.","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"],"confidence":"high"},{"text":"Brent faldt til omkring 72 dollar, det laveste siden 27. februar, da trafikken gennem Hormuz blev genoptaget.","sourceUrls":["https://www.cnbc.com/2026/06/27/tanker-struck-in-strait-of-hormuz-as-us-iran-tensions-escalate.html"],"confidence":"medium"}],"sources":[{"title":"Iran war day 121: Iran attacks Bahrain, Kuwait as US strikes near Hormuz","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz","publishedAt":"2026-06-28T04:00:00Z","kind":"reporting"},{"title":"Tanker struck in Strait of Hormuz as U.S.-Iran tensions escalate","publisher":"CNBC","url":"https://www.cnbc.com/2026/06/27/tanker-struck-in-strait-of-hormuz-as-us-iran-tensions-escalate.html","publishedAt":"2026-06-27T12:00:00Z","kind":"reporting"}]},{"id":"story-serbia-vucic-20260628","eventKey":"serbia-vucic-resignation-snap-elections-2026","materialFacts":["Aleksandar Vučić bebudede ved et regeringsmøde i Beograd 27. juni, at han træder tilbage som præsident inden for få uger","Han udskriver tidlige præsident- og parlamentsvalg, godt et år før mandatet udløber i midten af 2027","Udmeldingen følger 18 måneders studenterledede protester efter ulykken på Novi Sads banegård i november 2024"],"section":"Politik","headline":"Serbia's President Vučić will step down within a few weeks and calls for early elections","primarySourceUrl":"https://www.euronews.com/my-europe/2026/06/27/serbias-president-vucic-will-step-down-within-a-few-weeks-and-calls-for-early-elections","subheadline":"Serbiens stærke mand bøjer sig efter halvandet års protester og udskriver tidlige valg","body":["Serbiens præsident Aleksandar Vučić meddelte ved et regeringsvenligt stævne i Beograd lørdag, at han træder tilbage inden for få uger og udskriver tidlige præsident- og parlamentsvalg. \"Jeg vil kun være præsident i et par uger, og så træder jeg tilbage,\" sagde han. Vučić har domineret serbisk politik i omkring 14 år, og mandatet udløb først i midten af 2027.","Tilbagetrædelsen kommer efter halvandet års overvejende studenterledede protester. Bevægelsen opstod, da et betontag på banegården i Novi Sad styrtede sammen i november 2024 og dræbte 16 mennesker."],"whyItMatters":"Vučić har stået i centrum af et centraliseret styre på EU's dørtærskel og balancerer Serbien mellem EU, Rusland og Kina.","analysis":"Afgangen er en sejr for en vedholdende protestbevægelse, men ikke nødvendigvis et systemskifte. Vučić vil fortsat støtte sit parti SNS, og spørgsmålet er, om valget afholdes på vilkår, oppositionen anerkender som frie.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/6/65/Aleksandar_Vu%C4%8Di%C4%87_2025_%28cropped%29.jpg","credit":"Foto: Wikimedia Commons","alt":"Serbiens præsident Aleksandar Vučić","sourceUrl":"https://www.euronews.com/my-europe/2026/06/27/serbias-president-vucic-will-step-down-within-a-few-weeks-and-calls-for-early-elections"},"topics":["politik","Serbien","Balkan","demokrati"],"entities":["Aleksandar Vučić","Serbien","Novi Sad","SNS"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":74,"decisionValue":50,"novelty":72,"sourceQuality":74,"personalRelevance":30,"contrast":64},"claims":[{"text":"Vučić sagde ved et stævne i Beograd 27. juni, at han træder tilbage inden for få uger og udskriver tidlige valg.","sourceUrls":["https://www.euronews.com/my-europe/2026/06/27/serbias-president-vucic-will-step-down-within-a-few-weeks-and-calls-for-early-elections"],"confidence":"high"},{"text":"Protestbevægelsen opstod efter at et tag på Novi Sads banegård styrtede sammen i november 2024 og dræbte 16 mennesker.","sourceUrls":["https://www.aljazeera.com/news/2026/6/27/serbias-president-aleksandar-vucic-says-will-resign-within-weeks"],"confidence":"high"}],"sources":[{"title":"Serbia's President Vučić will step down within a few weeks and calls for early elections","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/06/27/serbias-president-vucic-will-step-down-within-a-few-weeks-and-calls-for-early-elections","publishedAt":"2026-06-27T18:00:00Z","kind":"reporting"},{"title":"Serbia's President Aleksandar Vucic says will resign within 'weeks'","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/27/serbias-president-aleksandar-vucic-says-will-resign-within-weeks","publishedAt":"2026-06-27T17:00:00Z","kind":"reporting"}]},{"id":"story-russia-baltics-20260628","eventKey":"russia-hybrid-provocation-baltics-poland-warning-2026","materialFacts":["Lettlands efterretningstjeneste og endnu et NATO-land advarer om, at Rusland forbereder militære eller hybride provokationer mod Baltikum eller Polen","Provokationerne ventes at være begrænsede – missiler, droner eller lignende – snarere end et fuldt angreb","Formålet vurderes at være at teste NATO's sammenhold og svække den vestlige støtte til Ukraine"],"section":"Forsvar","headline":"Fears Russia is planning 'military provocations' against the Baltic States or Poland","primarySourceUrl":"https://www.irishtimes.com/world/europe/2026/06/26/fears-of-russian-provocation-in-baltic-region-as-pressure-mounts-on-kremlin/","subheadline":"Lettisk efterretning advarer om begrænsede russiske aktioner, der skal teste alliancens enhed","body":["To lande på NATO's østflanke melder om tegn på, at Rusland forbereder provokationer mod de baltiske lande eller Polen. \"Vi ser indikationer på, at Rusland forbereder militære provokationer mod de baltiske lande eller Polen,\" lyder det fra Lettlands efterretningstjeneste ifølge The Irish Times.","Der er ifølge avisen ikke tale om et fuldskala-angreb, men om begrænsede hybride aktioner – missiler, droner eller lignende. Keir Giles fra Chatham House vurderer, at Moskva vil søge at forstyrre udviklingen \"gennem horisontal eskalering.\""],"whyItMatters":"En bevidst provokation mod et NATO-land kan udløse artikel 5-diskussioner. For Danmark, der har styrket sit nærvær i Baltikum, er truslen direkte relevant.","analysis":"Advarslen skal ses i lyset af, at Ukraines langtrækkende angreb presser Kreml, mens fronten står stille. En begrænset aktion mod NATO ville flytte fokus uden at krydse tærsklen til åben krig.","image":{"url":"https://www.irishtimes.com/resizer/v2/XT54RJECPGM6IMHBFVK4D62EB4.jpg?auth=b4f34735da136739cbebf6d39ef2932f7fc63c34cb19572bc882b13bfb321458&smart=true&width=1024&height=669","credit":"Kilde: The Irish Times","alt":"NATO-soldater under øvelse på alliancens østflanke","sourceUrl":"https://www.irishtimes.com/world/europe/2026/06/26/fears-of-russian-provocation-in-baltic-region-as-pressure-mounts-on-kremlin/"},"topics":["forsvar","sikkerhed","Rusland","NATO","hybridtrussel"],"entities":["Rusland","Letland","Polen","NATO","Keir Giles"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":58,"novelty":60,"sourceQuality":70,"personalRelevance":58,"contrast":58},"claims":[{"text":"Lettlands efterretningstjeneste advarer om, at Rusland forbereder militære provokationer mod Baltikum eller Polen.","sourceUrls":["https://www.irishtimes.com/world/europe/2026/06/26/fears-of-russian-provocation-in-baltic-region-as-pressure-mounts-on-kremlin/"],"confidence":"high"},{"text":"Aktionerne ventes at være begrænsede hybride handlinger som missiler eller droner, ikke et fuldt angreb.","sourceUrls":["https://www.irishtimes.com/world/europe/2026/06/26/fears-of-russian-provocation-in-baltic-region-as-pressure-mounts-on-kremlin/"],"confidence":"medium"}],"sources":[{"title":"Fears Russia is planning 'military provocations' against the Baltic States or Poland","publisher":"The Irish Times","url":"https://www.irishtimes.com/world/europe/2026/06/26/fears-of-russian-provocation-in-baltic-region-as-pressure-mounts-on-kremlin/","publishedAt":"2026-06-26T16:00:00Z","kind":"reporting"}]},{"id":"story-google-deepmind-talent-20260628","eventKey":"google-deepmind-talent-exodus-2026-06","materialFacts":["Mindst fem seniorforskere forlod Google DeepMind på en uge til OpenAI og Anthropic","Noam Shazeer (medskaber af Transformer-arkitekturen) går til OpenAI, mens nobelpristager John Jumper går til Anthropic","Alphabet-aktien faldt omkring 7 procent 22. juni og tabte cirka 270 milliarder dollar i markedsværdi over to handelsdage"],"section":"Teknologi","headline":"AI researchers continue to leave Google for its rivals","primarySourceUrl":"https://techcrunch.com/2026/06/24/ai-researchers-continue-to-leave-google-for-its-rivals/","subheadline":"En usædvanlig talentflugt fra DeepMind ramte Alphabet-aktien og rejser tvivl om Googles AI-forspring","body":["Google DeepMind mistede på en uge mindst fem seniorforskere til OpenAI og Anthropic. Noam Shazeer, medlead på Gemini og medforfatter til Transformer-artiklen, skifter til OpenAI. John Jumper, der ledede AlphaFold og delte nobelprisen i kemi i 2024, går til Anthropic.","Afgangene faldt sammen med et kursfald: Alphabet tabte omkring 7 procent 22. juni og cirka 270 milliarder dollar i markedsværdi over to dage. DeepMind-chef Demis Hassabis nedtonede sagen og fremhævede Googles \"brede forskningsbænk.\""],"whyItMatters":"Talent er den knappeste ressource i AI-kapløbet. Når arkitekterne bag teknologien skifter til konkurrenterne, handler det om, hvem der bygger de næste modeller.","analysis":"Bevægelsen drives af Anthropics førbørs-aktier og strid om computerkraft hos Google. Signalet er tvetydigt: Det kan svække Googles eksekvering, men koncentrerer spidskompetencerne hos rivalerne.","image":{"url":"https://techcrunch.com/wp-content/uploads/2023/02/glitched-google-logo.jpg?w=1024","credit":"Kilde: TechCrunch","alt":"Googles logo","sourceUrl":"https://techcrunch.com/2026/06/24/ai-researchers-continue-to-leave-google-for-its-rivals/"},"topics":["AI","teknologi","venturekapital","talent"],"entities":["Google DeepMind","Noam Shazeer","John Jumper","Anthropic","OpenAI","Alphabet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":70,"decisionValue":66,"novelty":58,"sourceQuality":72,"personalRelevance":80,"contrast":50},"claims":[{"text":"Noam Shazeer skifter til OpenAI, og John Jumper, Jonas Adler og Alexander Pritzel går til Anthropic.","sourceUrls":["https://techcrunch.com/2026/06/24/ai-researchers-continue-to-leave-google-for-its-rivals/"],"confidence":"high"},{"text":"Alphabet-aktien faldt omkring 7 procent 22. juni og tabte cirka 270 milliarder dollar i markedsværdi over to handelsdage.","sourceUrls":["https://www.cnbc.com/2026/06/22/alphabet-goog-stock-ai-departures.html"],"confidence":"medium"}],"sources":[{"title":"AI researchers continue to leave Google for its rivals","publisher":"TechCrunch","url":"https://techcrunch.com/2026/06/24/ai-researchers-continue-to-leave-google-for-its-rivals/","publishedAt":"2026-06-24T18:00:00Z","kind":"reporting"},{"title":"Alphabet paces for worst day in a year after AI talent exits","publisher":"CNBC","url":"https://www.cnbc.com/2026/06/22/alphabet-goog-stock-ai-departures.html","publishedAt":"2026-06-22T20:00:00Z","kind":"reporting"}]},{"id":"story-australia-bigtech-fines-20260628","eventKey":"australia-social-media-ban-fines-doubled-2026","materialFacts":["Australien fordobler den maksimale bøde for systematiske brud fra 49,5 til 99 millioner australske dollar","Mere end fe
