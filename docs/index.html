<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  /* One gutter for the page's outer edge. Before 2026-09-05 the shell used 94vw
     while the top bar and the footer each hard-coded 16px, so the page had three
     different left edges — and the mismatch flipped sign as the window narrowed:
     at 1280px the footer started 27px INSIDE the news column, at 375px 5px
     outside it. 94vw is also only 11px of gutter on a phone, which put the
     reading column against the bezel. Every left edge on the page now derives
     from this one number. Deliberately a percentage and not 100vw: 100vw
     includes the scrollbar, so on a desktop with classic scrollbars a vw-based
     shell sits 7px off the padding that is supposed to match it. */
  --gutter: clamp(18px, 3vw, 30px);
  --container: min(1180px, calc(100% - 2 * var(--gutter)));
  /* One gutter for every column system on the page. Before 2026-09-05 the story
     grid used 34px, "Kort fortalt" 26px and the Magasin bands 30px, so no two
     sections shared a vertical edge and no full-width rule landed on one. */
  --col-gap: 34px;
  --tap-min: 44px;
  /* One focus ring for the whole page. There were four teals at three alphas,
     and six rules painted the ring on :hover as well — a keyboard indicator
     drawn by a mouse. The house rule is now: ring on focus, fill on hover,
     never the reverse, and never both from one selector list. */
  --focus-ring: 2px solid var(--teal);
  --focus-ring-offset: 2px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  /* The thumbs' only boundary at rest, and since 2026-09-06 the ONLY drawn thing
     on a story that has not been voted on — the ruler is held back until a thumb
     is pressed. It inherited --rule and sat at 1.58:1 (editorial), 1.69
     (Magasin) and 1.84 (dark) against the paper behind it, which is under WCAG
     1.4.11's 3:1 and left the optional measure drawn HEAVIER than the primary
     control. It now takes the ruler's own value, so the two are one weight and
     both are the lightest thing that clears 3:1 on the ground their direction
     paints. Feed overrides it because its thumb is a filled chip, so its
     boundary has a second, lighter neighbour to clear (see that block). */
  --fb-border-color: var(--rating-rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  /* --fb-border-color deliberately absent: :root's var(--rating-rule) resolves
     to this direction's own #6a6055, which is 3.06:1 on #14110d. The #4a3f33 it
     used to hold was 1.84:1. */
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  /* The keyboard ring, one shade darker than the direction's green, and the
     only place Feed departs from --teal. #18a06b clears 3:1 on the white card
     a Feed control usually sits on (3.34:1) and does NOT clear it on the page
     itself (2.93:1) — which is where the skip link and the app-bar chips live.
     #0f8f5f is 4.11:1 on the card and 3.60:1 on the page, so the ring holds
     wherever the control stands. Found on 2026-09-06, the day the focus check
     started grading rings for contrast instead of only counting them. */
  --focus-ring: 2px solid #0f8f5f;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  /* The one direction whose thumb is a filled chip rather than an outline, and
     until 2026-09-06 the one with no drawn boundary at all: width 0, colour
     transparent, so the whole control was a #f1f2f4 chip on a white card at
     1.12:1. Its ring has TWO neighbours — the chip it encloses and the card
     around it — so it is graded against the lighter one: #888c94 is 3.01:1 on
     the #f1f2f4 fill and 3.37:1 on the white card. It is darker than this
     direction's --rating-rule (#8f949c) for that reason alone; the spine only
     ever touches the card. */
  --fb-border-color: #888c94;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

/* ==========================================================================
   Controls — what everything the reader can press or focus shares
   --------------------------------------------------------------------------
   Three properties, one ring, one press. All of it was learned on .reason-chip
   and never generalised until that control was deleted (2026-09-05): without
   -webkit-tap-highlight-color iOS paints a grey box over every press, without
   touch-action it holds the tap 300ms, and a control with no :active is
   visually dead under a finger, because :hover never fires on touch.
   .feedback-button and .rating-step keep their own copies — they animate
   differently and that block is deliberately self-contained.
   ========================================================================== */
.skip-link,
.audio-button,
.primary-source-link,
.save-later-button,
.recommendation-cta,
.read-later-dismiss,
.edition-tab,
.layout-tab,
.archive-link,
.feed-chip,
.feed-cta {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.audio-button:active,
.primary-source-link:active,
.save-later-button:active,
.recommendation-cta:active,
.read-later-dismiss:active,
.edition-tab:active,
.layout-tab:active,
.archive-link:active,
.feed-chip:active,
.feed-cta:active { transform: scale(0.97); }

/* ONE ring, on every focusable thing the page renders. Six controls had no
   :focus-visible rule at all and fell back to the UA ring, and the two picture
   links had only a 1.2% image scale, which reads as nothing. Ring on focus,
   fill on hover — see --focus-ring. */
.skip-link:focus-visible,
.audio-button:focus-visible,
.primary-source-link:focus-visible,
.save-later-button:focus-visible,
.recommendation-cta:focus-visible,
.read-later-dismiss:focus-visible,
.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible,
.feedback-button:focus-visible,
.headline-link:focus-visible,
.story-media-link:focus-visible,
.recommendation-media-link:focus-visible,
.recommendation-headline-link:focus-visible,
.recommendation-short-link:focus-visible,
.signal-link:focus-visible,
.klumme-source:focus-visible,
.key-number-source:focus-visible,
.primary-excerpt-source:focus-visible,
.image-credit:focus-visible,
.read-later-link:focus-visible,
.archive-entry-link:focus-visible,
.source-link:focus-visible,
.feed-chip:focus-visible,
.feed-cta:focus-visible {
  outline: var(--focus-ring);
  outline-offset: var(--focus-ring-offset);
}

/* The exceptions, and the only ones: these links sit on an inverted band, where
   the teal ring all but disappears. Same 2px, same offset. The Magasin hero is
   the third of them — its headline sits on var(--ink), where the teal ring came
   out at 2.80:1, under the 3:1 floor — and it was found on 2026-09-06, the day
   the focus check started grading rings for contrast instead of only counting
   them. */
.mag-keynumber-source:focus-visible,
.feed-keynumber-source:focus-visible,
.mag-hero .headline-link:focus-visible {
  outline: 2px solid #fff;
  outline-offset: var(--focus-ring-offset);
}

/* The global reduced-motion rule kills `transition`, not `transform`, so a press
   set outside a transition still moves. Null it here the way the feedback block
   nulls its own. */
@media (prefers-reduced-motion: reduce) {
  .audio-button:active,
  .primary-source-link:active,
  .save-later-button:active,
  .recommendation-cta:active,
  .read-later-dismiss:active,
  .edition-tab:active,
  .layout-tab:active,
  .archive-link:active,
  .feed-chip:active,
  .feed-cta:active { transform: none; }
}

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

/* text-wrap: balance evens the dek's two lines. Without it the 2026-09-05 dek
   split a proper noun across them ("...New / Zealand kalder historisk"). */
.masthead-dek {
  text-wrap: balance;
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: var(--tap-min);
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

/* Hover fills, focus rings. They shared one selector list, so a mouse hover
   painted the keyboard focus indicator — see --focus-ring. */
.audio-button:hover {
  border-color: var(--ink);
  background: color-mix(in srgb, var(--ink) 7%, transparent);
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  /* Center, not baseline. Baseline aligned the two controls by their text, which
     left a 44px box and a 30px pill sitting 12px off-centre from each other and
     5px off in the row [measured 2026-09-03]. They are a pair and should read as
     one row of controls. */
  align-items: center;
  margin: 16px 0 0;
}

.save-later-button {
  /* Matched to .primary-source-link: same height, same optical padding, so the pair
     sits on one line with equal weight. It keeps the pill shape and the lighter rule
     because it is the secondary action, and that difference should be the ONLY one.
     Padding is symmetric and measures symmetric: 12px of space each side of the ink
     at every one of the twelve buttons on the page [measured 2026-09-03]. What made
     it look wrong was the height and baseline mismatch above, not this box. */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap-min);
  padding: 0 16px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  /* Letter-spacing adds a trailing space after the last glyph, which shifts centred
     text visibly left. Compensate so the ink is optically centred, not just boxed. */
  letter-spacing: 0.01em;
  text-indent: 0.01em;
  transition: border-color 140ms ease, color 140ms ease, background-color 140ms ease;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  text-wrap: pretty;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

/* The thesis is the claim; the body is only its reason. At 1.04rem against a
   0.95rem paragraph it was 9% larger and the two read as one block of prose,
   with the title at 1.5rem doing all the hierarchy on its own. 1.20rem makes
   the step visible: 24 / 19.2 / 15.2px.
   max-width moves WITH the font-size and is not a separate tweak — ch scales
   with the element's own size, so 60ch at 1.20rem would push this block 83px
   past the .klumme-body block underneath it and break a flush right edge the
   two are deliberately holding (566px against 570px) [verified 2026-09-05]. */
.klumme-thesis {
  margin: 0 0 14px;
  max-width: 52ch;
  font-family: var(--serif);
  font-size: 1.20rem;
  font-style: italic;
  line-height: 1.44;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

/* Same step as editorial, one notch bolder because Magasin is display-driven:
   36.8 / 21.1 / 16px. No max-width here — the thesis inherits the band's 70ch. */
.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.32rem;
  font-style: italic;
  line-height: 1.42;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

/* Feed's title is only 1.3rem, so the thesis stops at 1.14rem: any bigger and
   the claim starts competing with the headline above it instead of following it. */
.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1.14rem;
  font-style: italic;
  line-height: 1.44;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;

  vector-effect: non-scaling-stroke;
}

.sparkline-dot {

}

/* The last reading of the same quantity, when there was one. This line is the
   difference between a figure and a measurement, so it sits directly under the
   number rather than down with the source. */
.key-number-previous {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0 0;
  color: var(--muted);

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: var(--col-gap);
  /* Not the default `stretch`. Stretching gave the signals rail the lead
     article's full 1312px height, so a 592px rail was drawn as a box with 720px
     of enclosed emptiness inside it, closed off by the section's own double
     rule. The rail now ends where its last signal ends; app.js fills it to the
     lead's height from content, which is the other half of the same fix. */
  align-items: flex-start;
  /* The 28px between the last signal and the double rule below is these two
     lines, and it is the designed closing gap — not dead space. Worth writing
     down, because the "83px of emptiness below Morgenens signaler" reported on
     2026-09-06 is not below the rail at all: measured in real Chrome at 1440px
     across the nine briefs 2026-08-29 to 09-06, the space under the rail was
     exactly 28.0px on seven of them, and the 83px was the RAIL running that far
     PAST the lead article — so the hole is on the LEFT, under the reaction row.
     The 1-10 measure is not implicated either way: removing it from the live
     page changes the lead column's height by 0.0px, because it shares its row
     with the thumbs and both are 44px.
     Two of those nine days invert it — 2026-09-03 left 108px under the rail,
     09-04 left 285px — and no reshuffle of signals can close either.
     balanceSignalRail has one lever, moving items DOWN, which only ever makes
     the rail shorter, and on both days every signal already fitted inside the
     lead's height. If that recurs, the levers are upstream (fewer signals when
     the lead runs long, which is an editorial decision) or here (this rule
     stopping short of both columns), never in the mover. */
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 26px;
}

/* ONE section label for the whole page. "Dagens vigtigste historier" used to be
   a centred 12px uppercase label on a 1px rule spanning all 1180px, while the
   rail headings beside and below it were left-aligned 19px serif on a 3px rule
   spanning 448px. Neither the alignment, the family, the size nor the rule
   weight was shared, so the centred label's ink landed 125px off the seam it
   sat directly above and its hairline crossed the gutter it was meant to
   organise [measured 2026-09-05]. The left-aligned serif won because it is the
   stronger object and because left is the one edge every column on the page
   already shares: masthead, lead, first card, first signal. Each rule now spans
   exactly the block its label names, and nothing on the page is optically
   centred against tracking any more. */
.section-heading,
.signals-title,
.recommendation-shortlist-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--font-display);
  font-size: 1.18rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.1;
  text-align: left;
  text-transform: none;
}

/* 2 columns on desktop, 1 below. The template is explicit rather than the old
   repeat(auto-fit, minmax(min(100%, 400px), 1fr)) because the orphan rule below
   has to know how many columns there are, and auto-fit resolves inside the
   layout engine where CSS cannot ask it. That is how seven cards in two columns
   shipped with a 573x1071px dead cell in the right-hand track, immediately
   before "Kort fortalt" [measured 2026-09-05]. One breakpoint, two rules, and
   they can never disagree about the column count. */
.story-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  column-gap: var(--col-gap);
  /* Not the default `stretch`. A grid row is as tall as its taller card, and
     .feedback-panel's margin-top:auto pushed the shorter card's controls to that
     borrowed bottom — so the shorter card showed a hole between its last
     sentence and its thumbs: 123px on one card of today's brief, 26px on two
     more [measured 2026-09-05]. Each card now ends where its own content ends.
     The cost is that the two columns' closing rules no longer line up across a
     row, which is a smaller loss than a hole in the middle of a card. */
  align-items: start;
}

@media (min-width: 900px) {
  .story-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* An odd number of cards leaves the last row half empty, so the last card
     takes the whole width instead and becomes the section's closing story:
     picture left, text right, at the same 573px measure as every other card.
     Holds for any story count — the brief targets 7-13, i.e. 6-12 cards — and
     an even count matches nothing, so the grid is untouched. */
  .story-grid > .story-card:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: var(--col-gap);
    align-content: start;
  }

  .story-grid > .story-card:last-child:nth-child(odd) > * { grid-column: 2; }

  /* The picture spans every row the text makes, so the wide card cannot grow a
     hole of its own under a fixed-ratio image. span 99 is "all of them": the
     extra rows are implicit, empty and zero-height, and row-gap is 0. */
  .story-grid > .story-card:last-child:nth-child(odd) > .story-media {
    grid-column: 1;
    grid-row: 1 / span 99;
    align-self: stretch;
    aspect-ratio: auto;
    margin: 0;
  }

  /* With the picture hidden the split would leave an empty left column, so the
     text takes the full width and leans on the measure cap on .story-body. */
  :root[data-images="off"] .story-grid > .story-card:last-child:nth-child(odd) > * {
    grid-column: 1 / -1;
  }
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

/* The nudge is a hover affordance, not a focus indicator: 1.2% on a photograph
   is invisible, so a keyboard reader could not tell the picture link was
   focused. What makes it visible is the shared ring near the top of this file;
   the nudge stays as the flourish. */

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

/* pretty, not balance: these run several lines, and balance would even them at
   the cost of the measure. pretty only refuses to leave one word alone on the
   last line, which is the defect actually visible on the page. */
.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  text-wrap: pretty;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

/* The klumme caps its measure at 62ch and the grid cards land near 65 by their
   own width, but the lead article had no cap at all and ran the full 698px
   column — the page's most-read prose was its widest [measured 2026-09-05].
   68ch, so the lead reads at the same rhythm as everything around it and the
   ragged right it leaves in the lead column is a broadsheet, not an error. */
.story-body,
.editorial-continuation,
.recommendation-flow {
  max-width: 68ch;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  /* One height for every control the reader can press, taken from --tap-min,
     which was declared in :root and used nowhere while the page carried four
     different button heights. The card's control stack now reads 44 / 44 / 44
     instead of 40 / 40 / 44 [measured 2026-09-05], and the two buttons here
     share a type size as well: at 0.77rem against the save button's 0.74rem the
     0.5px difference read as a mistake rather than a hierarchy. Weight and
     border carry the difference between primary and secondary; the square-
     against-pill shape carries the rest. */
  min-height: var(--tap-min);
  padding: 0 16px;
  border: 1px solid var(--ink);
  font-size: 0.74rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover {
  background: var(--ink);
  color: var(--paper);
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

/* ==========================================================================
   The feedback control — two struck marks and a ruled measure.

   The thumbs and the optional 1-10 "udbytte" are ONE object in one 44px band,
   not two widgets stacked. The measure replaces the ten "Hvorfor" chips: those
   produced a reason on one vote in ten (11 of 108 recovered votes), a number on
   every vote is worth more, and a ruled measure is furniture this page already
   owns — a hairline, a graduation, an ink mark — where a chip row was a form.
   AT REST THE ROW IS TWO THUMBS [2026-09-06, Alexander]. The measure comes out
   when a thumb is pressed, which is how the chips behaved — but the chips grew
   the card 115px under the reader's finger doing it, and that is what got them
   deleted. The ruler is held back with `visibility` instead, so its box is there
   the whole time and the panel is the same height before and after the press.
   Below ~410px of control width that matters absolutely: the ruler wraps onto
   its own line, and taking it out of layout would move the panel between 44px
   and 98px (measured in Chrome, 2026-09-06).
   ========================================================================== */

.feedback-panel {
  margin-top: auto;   /* pins the control to the card bottom so the cards in a
                         grid row align. Removing this de-aligns the grid. */
  padding-top: 17px;
}

/* The one row. It wraps as a unit on a phone rather than letting each half find
   its own rhythm. */
.feedback-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 12px;
}

.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  /* Learned on .reason-chip and never generalised until now: without these iOS
     paints a grey box over the press and holds the tap for 300ms. The chip was
     the only control on the page that had them, and it is being deleted. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background-color 140ms ease, color 140ms ease,
              border-color 140ms ease, transform 90ms ease;
}

/* Outline at rest, solid when pressed: state carried by the drawing itself. The
   page holds ~26 thumbs, so outline is what keeps them from shouting, and the
   outline-to-solid jump is far more readable while scrolling than the old
   grey-solid-to-white-solid was. */
.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}

.feedback-button[aria-pressed="true"] svg,
.feedback-button.is-selected svg { fill: currentColor; }

/* Split from :focus-visible on purpose. They shared one block, so a mouse hover
   painted the keyboard focus ring — ~26 of them on one page. */
.feedback-button:hover { border-color: var(--ink); }

.feedback-button:focus-visible { border-color: var(--ink); }

.feedback-button:active { transform: scale(0.93); }

/* The stamp: the button takes the press and settles, then the glyph punches in
   40ms behind it. `both` holds the glyph at 0.82 through the delay so the punch
   reads as a delay rather than a jump. The 3% overshoot is the only new easing
   on the page, and it is 3%, not a bounce. */
@keyframes fb-stamp {
  0%   { transform: scale(0.93); }
  55%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes fb-punch {
  from { transform: scale(0.82); }
  to   { transform: scale(1); }
}
.feedback-button.is-stamping     { animation: fb-stamp 240ms cubic-bezier(0.2, 0.8, 0.3, 1); }
.feedback-button.is-stamping svg { animation: fb-punch 200ms cubic-bezier(0.2, 0.8, 0.3, 1) 40ms both; }

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

/* --------------------------------------------------------------------------
   The measure — the optional 1-10 udbytte.
   No colour lives here at all: the mark is ink, and green and red stay on the
   thumb. Fifteen coloured fill-bars down the card column would read as a
   dashboard sitting under a newspaper.
   -------------------------------------------------------------------------- */

/* One token, extending the --fb-* family rather than inventing a palette, and
   now one value per direction because each direction paints its own paper.
   Inheriting --rule put the whole measure — spine and graduation — at 1.57:1
   (editorial), 1.69 (Magasin), 1.57 (Feed) and 1.84 (dark) against that paper,
   under WCAG 1.4.11's 3:1 for the marks that identify a control. A ruler you
   have to look for is not a ruler.
   Every value below is the LIGHTEST that clears 3:1 on the ground its own
   direction actually puts behind a card: editorial 3.06:1 on #f6efe4, Magasin
   3.05:1 on #fbf7f0, Feed 3.05:1 on the white .feed-card, dark 3.06:1 on
   #14110d. Minimum on purpose, and check-layout.mjs re-computes all four: about
   fifteen of these lines run down one morning's page, so every tenth of a point
   above 3:1 is paid for fifteen times. It also keeps the rule quieter than the
   numerals standing on it (--muted, 4.8-5.5:1), which is the whole reason the
   ruler reads as a measure and not as a dashboard. Do NOT round up to a "safe"
   4:1, and do not raise the numerals to match — they already pass. */
:root                         { --rating-rule: #928878; }
:root[data-layout="magazine"] { --rating-rule: #998d7c; }
:root[data-layout="dark"]     { --rating-rule: #6a6055; }
:root[data-layout="feed"]     { --rating-rule: #8f949c; }

/* HELD BACK UNTIL A THUMB IS PRESSED. `visibility`, not `display: none` and not
   the `hidden` attribute — measured, not preferred. The ruler and the thumbs are
   one flex row, but only while the row is wide enough to hold both: at 400px and
   under it wraps, and the panel is 98px instead of 44px. Removing the ruler from
   layout there shortens the card by 54px, so pressing a thumb would shove
   everything below it down under the reader's own finger. That is precisely how
   the "Hvorfor" chips behaved, and it is why they are gone.

   visibility keeps the box and gives up nothing an accessible hide needs: a
   visibility:hidden subtree is out of the tab order and out of the accessibility
   tree, which `opacity: 0` and `pointer-events: none` are NOT. The cost is a
   reserved empty band under the thumbs on a phone-width card, which is invisible
   ink; the alternative is a moving page, which is not.

   Written as [data-revealed="false"] rather than :not([data-revealed="true"]) so
   a scale that reaches the page carrying neither value is a bug that SHOWS,
   rather than a control that silently disappears. */
.rating-scale[data-revealed="false"] { visibility: hidden; }

/* flex-basis rather than a viewport media query: the control lives in a 573px
   card, a 698px lead and a 448px recommendation rail, so it has to key off the
   container it is actually in. */
.rating-scale {
  position: relative;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  flex: 1 1 300px;
  min-width: 0;
  max-width: 460px;
  height: var(--fb-size);   /* one band with the thumbs */
  /* Hands the horizontal axis to the scrub in app.js and keeps everything else
     with the browser. NOT `none`: a vertical swipe that happens to start on the
     ruler still belongs to the page, and fifteen rulers down a column would
     otherwise be fifteen scroll traps — the browser takes the pan and hands the
     scrub a pointercancel, which discards it without voting. `pinch-zoom` is
     named explicitly because dropping it would quietly cancel the zoom the
     viewport meta deliberately allows; between them the two keywords also
     suppress double-tap zoom, which is what .rating-step's `manipulation` was
     buying and why that declaration can stay as it is. */
  touch-action: pan-y pinch-zoom;
}

/* The line of the scale. A ::before rather than a border so each step keeps the
   full 44px of height, and so the mark can sit ON the line it cancels. 10px up
   from the bottom puts the scale's optical centre on the thumbs' centre. */
.rating-scale::before {
  content: "";
  position: absolute;
  right: 0;
  bottom: 10px;
  left: 0;
  height: 1px;
  background: var(--rating-rule);
}

.rating-step {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  height: 100%;
  padding: 0 0 22px;   /* sets the figure on the rule with 12px of air */
  border: 0;
  background: transparent;
  /* Every figure carries the page's own muted-text colour. Holding the seven
     minors back to 55% was tried and measured first — it read beautifully and
     landed at 2.0-2.3:1 against the ground in all four directions, which is
     under the floor for the label of a control someone has to tap. The ruler
     rhythm is carried by the graduation instead (5px minors, 9px at 1/5/10),
     which costs no legibility at all.
     If thirteen scales still read busy on the page, the retreat is one rule and
     no restructuring: hide the seven minor figures and keep their ticks, leaving
     a bare ruler numbered 1, 5, 10. Never hide them on hover — that is dead on
     touch. */
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.72rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: color 120ms ease, transform 90ms ease;
}

/* The graduation. The taller majors at 1, 5 and 10 are what make ten digits read
   as a measure instead of a row of buttons. They count on .rating-mark being the
   LAST child of the scale. */
.rating-step::after {
  content: "";
  position: absolute;
  bottom: 10px;
  left: 50%;
  width: 1px;
  height: 5px;
  margin-left: -0.5px;
  background: var(--rating-rule);
  transition: height 90ms ease, background-color 120ms ease;
}
.rating-step:nth-child(1)::after,
.rating-step:nth-child(5)::after,
.rating-step:nth-child(10)::after { height: 9px; }

.rating-step:hover { color: var(--ink); }
.rating-step:hover::after { height: 9px; background: var(--ink); }

/* The one place the house ring goes inward: the cells are contiguous, so an
   outward ring would sit on its neighbours. Same ring, negated offset. */
.rating-step:focus-visible {
  outline: var(--focus-ring);
  outline-offset: calc(-1 * var(--focus-ring-offset));
  color: var(--ink);
}

.rating-step:active { transform: translateY(1px); }

.rating-step[aria-checked="true"] {
  color: var(--ink);
  font-weight: 800;
}
/* The mark cancels the graduation it lands on. */
.rating-step[aria-checked="true"]::after { background: transparent; }

/* The mark: one 3px ink bar — the weight .signals-title already uses for a
   section rule — that travels along the line to the figure you chose, so a
   changed mind is one movement instead of a collapse and a redraw. The transform
   IS its position, which is why the reduced-motion block below must not null it. */
.rating-mark {
  position: absolute;
  bottom: 10px;
  left: 0;
  width: 10%;
  height: 3px;
  background: var(--ink);
  opacity: 0;
  transform: translateX(0) scaleX(0.2);
  transform-origin: center bottom;
  pointer-events: none;
  transition: transform 190ms cubic-bezier(0.2, 0.8, 0.3, 1), opacity 110ms ease;
}
.rating-scale[data-rating] .rating-mark {
  opacity: 1;
  transform: translateX(calc(var(--rating-index) * 100%)) scaleX(1);
}

/* The opening. A measure being laid down beside the thumbs: the ruler rises 4px
   and fades while its spine draws out from the left. Short and editorial rather
   than bouncy — no overshoot, the page's own easing, and nothing that paints
   outside the box it already occupies, because this can fire on any of thirteen
   to nineteen panels in one session. The class is removed when the animation
   ends (see revealRatingScale in app.js), so it never sits on the element. */
@keyframes rating-reveal {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}
@keyframes rating-spine {
  from { transform: scaleX(0.12); }
  to   { transform: scaleX(1); }
}
.rating-scale.is-revealing { animation: rating-reveal 200ms cubic-bezier(0.2, 0.8, 0.3, 1); }
.rating-scale.is-revealing::before {
  transform-origin: left center;
  animation: rating-spine 280ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

/* --------------------------------------------------------------------------
   The phone half of the measure — everything below exists only while a finger
   is down, and a mouse never reaches any of it (see the pointerType gate in
   bindRatingScrub). The desktop control is unchanged.

   The arithmetic that forces this: ten 44px targets need 440px, and the widest
   phone this control ever gets is 394px, so a cell is 30-38px however it is
   drawn. Accuracy therefore cannot come from where the finger LANDS. It comes
   from where the finger LIFTS: land anywhere, read the number off the bubble
   above the row, slide until it is the one you meant, then let go. Nothing is
   sent until the release, so a mis-landing costs a small movement instead of a
   wrong number in the sheet — and the 5/6 slip, which flips the thumb and the
   only field the weekly topic loop reads, stops being silent.
   -------------------------------------------------------------------------- */

/* Positioned with the same width:10% + translateX(index * 100%) arithmetic as
   .rating-mark, so the bubble and the mark can never disagree about where a
   number lives. Above the row because the finger is on it: the receipt has to
   be somewhere the hand is not. It sits over the thumbs when the finger is at
   the low end — deliberate; it is gone before the release stamps one. */
.rating-bubble {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 10%;
  height: 34px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 1.15rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  /* The one declaration that must never be lost: the bubble is inside the
     scale, so if it took pointer events it would eat the finger that is
     steering it the moment the scrub reached its own column. */
  pointer-events: none;
  transform: translateX(calc(var(--rating-preview) * 100%));
  /* Like .rating-mark, the transform IS its position — the global reduced-motion
     rule nulls `transition`, which is the correct half to kill here. */
  transition: transform 90ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

/* The previewed figure borrows the hover treatment, which is dead on touch
   anyway. Nothing here paints outside .is-scrubbing, so the resting ruler on any
   device is byte-identical to what it was. */
.rating-scale.is-scrubbing .rating-step[data-preview="true"] {
  color: var(--ink);
  font-weight: 800;
}
.rating-scale.is-scrubbing .rating-step[data-preview="true"]::after {
  height: 9px;
  background: var(--ink);
}

/* The global reduced-motion rule kills `transition` but NOT `animation`, and it
   must not null the mark's transform. Both halves are handled here. */
@media (prefers-reduced-motion: reduce) {
  .feedback-button.is-stamping,
  .feedback-button.is-stamping svg { animation: none !important; }
  /* The reveal is a state change, not decoration, so it still happens — it just
     happens instantly. Both halves are named because `animation` on the element
     says nothing about the pseudo-element's. */
  .rating-scale.is-revealing,
  .rating-scale.is-revealing::before { animation: none !important; }
  .feedback-button:active,
  .rating-step:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;

.signal-link:hover,
.signal-link:focus-visible {

  text-decoration: underline;

}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": three items to a row on desktop, two at tablet, one below.
   Laid on six tracks rather than three so the last row can always be filled —
   with three tracks, five signals left a 376x149px empty third cell, the same
   defect as the story grid one section up [measured 2026-09-05]. Six tracks of
   a shared gutter give exactly the old widths (span 2 = 376px at 1180px), and
   a half-row of two can widen to span 3 each instead of orphaning a track. */
.short-news,
.mag-signals-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  column-gap: var(--col-gap);
}

@media (min-width: 720px) {
  .short-news,
  .mag-signals-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .short-news > .signal-item,
  .mag-signals-grid > .signal-item { grid-column: span 3; }
}

/* The two-per-row band, 720 to 899. It needs its own orphan rule and cannot
   borrow the desktop one: at two items to a row there is no half-row-of-two
   case, and the 3n+1 selectors below are arithmetic for three tracks, so at
   800px an odd count left the last item alone with a 393px dead cell beside it
   — exactly the defect item 5 names, measured on the real 2026-09-05 brief.
   Bounded at the top on purpose: an unbounded `:nth-child(odd):last-child`
   would leak into desktop and widen, say, a ninth item that closes its row
   perfectly well there. */
@media (min-width: 720px) and (max-width: 899.98px) {
  .short-news > .signal-item:nth-child(odd):last-child,
  .mag-signals-grid > .signal-item:nth-child(odd):last-child { grid-column: span 6; }
}

@media (min-width: 900px) {
  .short-news > .signal-item,
  .mag-signals-grid > .signal-item { grid-column: span 2; }

  /* A last row holding two items: both widen to half the section. The selector
     reads "starts a row AND is second from last", which is only true when
     exactly two items remain. */
  .short-news > .signal-item:nth-child(3n + 1):nth-last-child(2),
  .short-news > .signal-item:nth-child(3n + 1):nth-last-child(2) ~ .signal-item,
  .mag-signals-grid > .signal-item:nth-child(3n + 1):nth-last-child(2),
  .mag-signals-grid > .signal-item:nth-child(3n + 1):nth-last-child(2) ~ .signal-item {
    grid-column: span 3;
  }

  /* A last row holding one item: it takes the whole width. */
  .short-news > .signal-item:nth-child(3n + 1):last-child,
  .mag-signals-grid > .signal-item:nth-child(3n + 1):last-child { grid-column: span 6; }
}

.short-news .signal-item {
  padding: 18px 0;

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 14px;
}

/* Heading and subtitle are one block here, so the rule sits under the pair
   rather than between them — but it is the same 3px rule every other section
   label gets, on the same left edge. */
.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0;
  padding-bottom: 9px;
  border-bottom: 3px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: left;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

/* The recommendations top mirrors the front page's lead layout: the featured
   pick reads like the lead story and the shortlist sits in a rail beside it,
   exactly as "Morgenens signaler" does. Before this the featured card ran the
   full section width, so its 3:2 image was the largest picture on the page and
   dwarfed the news it followed. Scoped to .recs-layout so Magasin and Feed,
   which build their own recommendation DOM, keep the standalone block. */
.recs-layout {
  display: flex;
  flex-wrap: wrap;
  gap: var(--col-gap);
  align-items: flex-start;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recs-layout > .recommendation-featured {
  flex: 1 1 540px;
  min-width: 0;
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: 0;
}

.recs-layout > .recommendation-shortlist {
  flex: 1 1 290px;
  min-width: 0;
  margin: 0;
  border-top: 0;
}

/* When the rail wraps under the featured pick it grows a separating rule,
   matching .lead-signals at the same breakpoint. */
@media (max-width: 860px) {
  .recs-layout > .recommendation-shortlist {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

/* Same landscape crop as the front-page hero, so the featured pick and the lead
   story present at the same size and shape. */
.recs-layout .recommendation-featured-card .recommendation-media {
  aspect-ratio: 16 / 9;
}

/* Unless the picture is a portrait — which, in this section, means a book cover.
   The 16:9 hero showed 37% of one: a horizontal band across its middle, from a
   329px source stretched to 698px [measured 2026-09-05]. A cover should be shown
   whole and at its own pixels. No stylesheet can know a picture's shape, so the
   image says so once it has loaded (renderRecommendationMedia), and the card
   re-lays itself around the answer. */
.recommendation-media[data-orientation="portrait"],
.recs-layout .recommendation-featured-card .recommendation-media[data-orientation="portrait"] {
  /* Both selectors on purpose: the featured rule above is three classes deep, so
     a single-class override loses to it and the cover keeps the 16:9 crop. */
  aspect-ratio: auto;
  max-width: min(100%, 320px);
  background: transparent;
}

.recommendation-media[data-orientation="portrait"] img {
  height: auto;
  object-fit: contain;
}

.recommendation-media[data-orientation="portrait"] .recommendation-media-link {
  height: auto;
}

/* Beside the text rather than above it, once there is room for both: a cover
   sitting over a 698px measure leaves the card top-heavy and half empty. 240px
   is chosen from what the text column then has left — 424px, which is the width
   at which the thumbs and the 1-10 measure still sit on one row, the way they do
   in every other panel on the page [measured 2026-09-05]. */
@media (min-width: 900px) {
  .recs-layout .recommendation-featured-card[data-media-orientation="portrait"] {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    column-gap: var(--col-gap);
    align-items: start;
  }

  .recs-layout .recommendation-featured-card[data-media-orientation="portrait"] .recommendation-media {
    max-width: 100%;
    margin: 0;
  }
}

/* Same shape and the same orphan rule as .story-grid. Normally empty in the
   editorial layout, where every non-featured pick is a shortlist row — and it
   is hidden outright in that case (src/web/render/recommendation.js), because
   an empty div left in the DOM is a box waiting for someone to give it padding. */
.recommendation-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  column-gap: var(--col-gap);
  align-items: start;
}

@media (min-width: 900px) {
  .recommendation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .recommendation-grid > .recommendation:last-child:nth-child(odd) { grid-column: 1 / -1; }
}

/* The shortlist: many links, one line each. Deliberately typographic and dense
   next to the featured card above it, so the difference in depth is visible
   before a word is read. */
.recommendation-shortlist {
  margin: 4px 0 0;
  border-top: 1px solid var(--rule);
}

/* Shape and spacing only: the type is shared with .section-heading above, so
   every label on the page is one object. */

.recommendation-short {
  padding: 13px 0 12px;
  border-bottom: 1px solid var(--rule);
}

}

}

}

.recommendation-short-meta {

}

.recommendation-short-note {

.recommendation-short .feedback-panel {

}

.recommendation-card {

  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {

}

}

}

.recommendation-media-link:hover img,

.recommendation-text {

}

}

.recommendation-headline-link:hover,

.page-footer {

}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */

  left: -9999px;

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  /* The shell's own side margin, so the bar's CONTENT BOX ends exactly where the
     news column does and the strip never runs wider than the page. The pills
     themselves are centred inside it (justify-content above), the way the
     masthead and the footer are centred — so the bar's first pill does NOT sit
     on the lead story's left edge, and the claim that it does was wrong when it
     was written here [corrected 2026-09-06, measured: shell edge 130.0px, first
     pill 322.9px at 1440px]. Chrome is centred, content is left-aligned; that is
     the composition, not an alignment bug. max() keeps a gutter when the
     viewport is narrower than the shell (a scrollbar-inflated 100vw). */
  padding: 9px max(var(--gutter), calc((100% - var(--shell)) / 2));
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  /* --tap-min, like every other control the reader presses. These were 36px —
     below the touch floor the token was written to enforce, on the device he
     actually reads on. */
  min-height: var(--tap-min);
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

/* On a phone the bar wrapped to five rows and 205px [measured 2026-09-05 at
   375px]: a quarter of the screen was navigation before the brand appeared, and
   the wrap orphaned single pills — "Arkiv" alone on row two, "Mørk" alone on row
   five. One row that scrolls sideways instead. Nothing is ever alone on a line,
   the masthead starts at the top of the page, and no pill has to shrink below
   the touch floor to fit. */
@media (max-width: 700px) {
  .top-bar {
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    gap: 4px 10px;
  }

  .top-bar::-webkit-scrollbar { display: none; }

  .edition-nav,
  .top-bar > div,
  .layout-nav { flex: 0 0 auto; flex-wrap: nowrap; }

  .top-bar-divider { flex: 0 0 auto; }

  .edition-tab,
  .layout-tab,
  .archive-link,
  .layout-nav-label { white-space: nowrap; }

  .edition-tab,
  .layout-tab,
  .archive-link { padding: 5px 11px; }
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  /* Same edge as every other section. It was min(1180px, 100% - 24px) — a
     fourth outer margin on a page that now has one. */
  width: var(--shell);
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
/* 100%, not var(--shell): this box lives INSIDE .page-shell, and --shell is a
   percentage of whatever reads it, so var(--shell) here would inset it by a
   second gutter. Editorial and dark only — Magasin and Feed replace the shell's
   children outright, so this section does not exist there. */
.read-later {
  width: 100%;
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: var(--tap-min);
  min-height: var(--tap-min);
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover {
  background: var(--paper);
  border-color: var(--ink);
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

/* Wider than --shell on purpose (Magasin breaks out of the centred column), but
   off the SAME gutter, so the two directions share an outer edge. */
.mag-inner {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, calc(100% - 2 * var(--gutter)));
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
/* Column behaviour (and the orphan rules) are shared with .short-news above —
   it is the same three-up list of signals, so it gets the same last row. */
.mag-signals-grid {
  width: min(1240px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;

  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, calc(100% - 2 * var(--gutter)));

  padding: 10px 0;
}
.feed-logo {

  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
