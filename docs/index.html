  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, calc(100% - 2 * var(--gutter)));
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, calc(100% - 2 * var(--gutter)));
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(20, 23, 28, 0.78);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.feed-card-body { padding: 16px 16px 18px; }
.feed-pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 9px;
}
.feed-pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: #f1f2f4;
  color: var(--accent-ink);
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.feed-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: #eef0f3;
  color: #6b7280;
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.feed-card-headline { margin: 0; font-family: var(--font-display); font-weight: 800; line-height: 1.12; letter-spacing: -0.025em; }
.feed-hero .feed-card-headline { font-size: 1.5rem; }
.feed-card:not(.feed-hero) .feed-card-headline { font-size: 1.22rem; }
.feed-card-headline .headline-link { text-decoration: none; }
.feed-card-sub { margin: 8px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.4; }
.feed-why { margin: 12px 0 0; padding: 12px; border-radius: 14px; background: #f6f7f9; }
.feed-why-label {
  display: block;
  margin-bottom: 4px;
  color: var(--accent-ink);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.feed-why p { margin: 0; font-size: 0.92rem; line-height: 1.45; color: #2c323b; }
.feed-cta {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin-top: 12px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.feed-cta:hover { background: #000; }

.feed-card .feedback-panel { margin-top: 14px; padding-top: 0; }
.feed-card .story-sources { margin-top: 12px; }

.feed-list { padding: 16px 16px 6px; }
.feed-list-title {
  margin: 0 0 10px;
  font-family: var(--font-label);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.feed-list .signal-item { padding: 12px 0; border-bottom: 1px solid #f1f2f4; }
.feed-list .signal-item:last-child { border-bottom: 0; }
.feed-list .signal-link { font-family: var(--font-display); font-size: 1rem; font-weight: 700; }

.feed-keynumber { padding: 20px; background: linear-gradient(150deg, #14171c, #26303b); color: #fff; }
.feed-keynumber-kicker {
  display: block;
  color: #7fd1c9;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.feed-keynumber-figure { margin: 6px 0 0; font-family: var(--font-display); }
.feed-keynumber-value { font-size: 3.4rem; font-weight: 800; letter-spacing: -0.03em; }
.feed-keynumber-unit { margin-left: 8px; color: #9aa1ac; font-size: 1rem; font-weight: 700; }
.feed-keynumber-label { margin: 6px 0 0; font-size: 1rem; }
.feed-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.78); font-size: 0.85rem; }
.feed-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-size: 0.74rem; font-weight: 700; }

.feed-recs { display: flex; flex-direction: column; gap: 14px; }
.feed-section-label {
  margin: 6px 0 0;
  font-family: var(--font-label);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.feed-rec { padding: 14px; }

me-grebet-om-kriminelle-familier-og-bander/","subheadline":"Lovforslag sidestiller kriminelle familier med bander og skærper straf for at bruge børn til bestillingskriminalitet","body":["Justitsminister Nicolai Wammen har sendt et lovforslag i høring, der sidestiller kriminelle familier med bander i straffelovens § 81 a og skærper straffen for bagmænd, der bruger børn og unge til bestillingskriminalitet. Loven skal træde i kraft 1. januar 2027.","Fra april 2024 til juli 2026 har NSK registreret 316 sigtelser fordelt på 88 sagskomplekser, der vurderes at handle om 'volds-som-en-service'."],"whyItMatters":"Forslaget udvider en kategori, der hidtil kun dækkede organiserede bander, til også at kunne bruges mod familienetværk – med konsekvenser for, hvordan politiet kan efterforske og retsforfølge.","analysis":"At bruge bandeværktøjer på familier anerkender, at kriminalitetsstrukturerne har ændret sig hurtigere end lovgivningen – ikke hvorfor de ændrede sig.","topics":["danmark","politik","retspolitik"],"entities":["Nicolai Wammen","Justitsministeriet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":50,"decisionValue":55,"novelty":60,"sourceQuality":70,"personalRelevance":15,"contrast":30},"claims":[{"text":"Wammen sent a bill to hearing equating criminal families with gangs under section 81a, effective 1 January 2027; NSK recorded 316 charges across 88 case numbers on 'violence-as-a-service' April 2024-July 2026.","sourceUrls":["https://sydnyt.dk/nyt-lovforslag-justitsminister-nicolai-wammen-vil-stramme-grebet-om-kriminelle-familier-og-bander/"],"confidence":"high"}],"sources":[{"title":"Nyt lovforslag: Justitsminister Nicolai Wammen vil stramme grebet om kriminelle familier og bander","publisher":"Sydnyt.dk","url":"https://sydnyt.dk/nyt-lovforslag-justitsminister-nicolai-wammen-vil-stramme-grebet-om-kriminelle-familier-og-bander/","publishedAt":"2026-09-14T06:00:00.000Z","kind":"reporting"},{"title":"Justitsministeren vil bruge bandeværktøj på kriminell
