<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-horizon {
  margin: 0 0 12px;
  color: var(--teal);
  font-family: var(--sans);
  font-size: 0.66rem;
  font-weight: 750;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

/* The last reading of the same quantity, when there was one. This line is the
   difference between a figure and a measurement, so it sits directly under the
   number rather than down with the source. */
.key-number-previous {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
}

.key-number-change {
  color: var(--teal);
  font-weight: 750;
  letter-spacing: 0.02em;
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 90ms ease;
  /* Suppress the grey flash iOS paints over a tapped button, which otherwise
     competes with the :active state below, and remove the 300ms tap delay. */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}
/* A tap must feel like a press. :hover and :focus-visible never fire on a touch
   tap, so before this the chip was visually inert on a phone and the reader had
   no way to tell the click had registered. :active gives the immediate press,
   .is-selected gives the lasting answer, matching .feedback-button above. */
.reason-chip:active {
  background: color-mix(in srgb, var(--ink) 12%, transparent);
  transform: scale(0.96);
}
.reason-chip.is-selected {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.reason-chip.is-selected:hover,
.reason-chip.is-selected:focus-visible {
  background: color-mix(in srgb, var(--ink) 86%, var(--paper));
}
@media (prefers-reduced-motion: reduce) {
  .reason-chip { transition: none; }
  .reason-chip:active { transform: none; }
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

/* The shortlist: many links, one line each. Deliberately typographic and dense
   next to the featured card above it, so the difference in depth is visible
   before a word is read. */
.recommendation-shortlist {
  margin: 4px 0 0;
  border-top: 1px solid var(--rule);
}

.recommendation-short {
  padding: 13px 0 12px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-head {
  margin: 0;
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.4;
}

.recommendation-short-link {
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-link:hover,
.recommendation-short-link:focus-visible {
  color: var(--red);
  border-bottom-color: currentColor;
}

.recommendation-short-meta {
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.73rem;
  letter-spacing: 0.01em;
}

.recommendation-short-note {
  margin: 3px 0 0;
  max-width: 68ch;
  color: var(--body-soft, var(--muted));
  font-family: var(--serif);
  font-size: 0.9rem;
  line-height: 1.5;
}

.recommendation-short .feedback-panel {
  margin-top: 8px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band

gnende problemer, selskabet ikke kender til.","sourceUrls":["https://www.anthropic.com/aug-2026-risk-report","https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf"],"confidence":"high"},{"text":"En efterfølgende gennemgang markerede 1.197 samtaler med muligt skadeligt biologisk indhold, hvoraf 757 stammede fra intern red teaming.","sourceUrls":["https://thenextweb.com/news/anthropic-risk-report-bio-classifiers-human-feedback-gap"],"confidence":"medium"}],"sources":[{"title":"Anthropic ran 133 million contractor chats with its bioweapon filters off","publisher":"The Next Web","url":"https://thenextweb.com/news/anthropic-risk-report-bio-classifiers-human-feedback-gap","publishedAt":"2026-08-15T00:00:00.000Z","kind":"reporting"},{"title":"Risk Report: August 2026","publisher":"Anthropic","url":"https://www.anthropic.com/aug-2026-risk-report","publishedAt":"2026-08-14T00:00:00.000Z","kind":"primary"},{"title":"Redacted Risk Report August 2026","publisher":"Anthropic","url":"https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf","publishedAt":"2026-08-14T00:00:00.000Z","kind":"primary"}]},{"id":"story-thrive-ai-euphoria-2026-08-16","eventKey":"thrive-capital-lp-letter-2026-08","section":"Venturekapital","headline":"Thrive's Joshua Kushner chides Silicon Valley VCs over AI euphoria","primarySourceUrl":"https://techcrunch.com/2026/08/14/thrives-joshua-kushner-chides-silicon-valley-vcs-over-ai-euphoria/","subheadline":"En af de største investorer i AI-runderne advarer sine egne kapitalejere mod stemningen omkring dem — og oplyser tal, der forklarer hvorfor han har råd til det.","materialFacts":["Thrive Capital oplyser 60 milliarder dollar under forvaltning og 41 procent brutto-IRR, 33 procent netto","Fonden fra 2022 på 516 millioner dollar er opskrevet til over 3,7 milliarder dollar pr. juni 2026","Cirka 90 procent af hver fond ligger i de 15 største investeringer"],"body":["Thrive Capital i New York har været med i nogle af de største AI-runder overhovedet, blandt andet OpenAI og Stripe. I et brev til kapitalejerne, omtalt af TechCrunch 14. august, advarer medstifter Joshua Kushner mod den stemning, hans egne investeringer skaber: en alvorlig fejl at lade begejstring svække disciplinen.","Selskabets egne tal forklarer hvorfor. 60 milliarder dollar under forvaltning, 41 procent brutto- og 33 procent nettoafkast, og en fond fra 2022 på 516 millioner dollar opskrevet til over 3,7 milliarder ved udgangen af juni. Omkring 90 procent af hver fond ligger i 15 investeringer."],"whyItMatters":"Over tolv måneder har Thrive returneret mere end en milliard dollar til investorerne — realiseret likviditet, ikke opskrivninger.","analysis":"Værdiansættelserne er selskabets egne og ikke reviderede. Pointen holder: ekstrem koncentration er den modsatte lære af, hvad de fleste AI-fonde gør.","image":{"url":"https://techcrunch.com/wp-content/uploads/2026/02/GettyImages-2184416821.jpg?w=1024","credit":"Kilde: TechCrunch / Getty Images","alt":"Arkivfoto af Joshua Kushner, medstifter af Thrive Capital","sourceUrl":"https://techcrunch.com/2026/08/14/thrives-joshua-kushner-chides-silicon-valley-vcs-over-ai-euphoria/"},"topics":["venturekapital","ai","erhverv","usa"],"entities":["Thrive Capital","Joshua Kushner","OpenAI","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":74,"novelty":76,"sourceQuality":80,"personalRelevance":86,"contrast":84},"claims":[{"text":"Thrive Capital oplyser 60 milliarder dollar under forvaltning samt 41 procent brutto-IRR og 33 procent netto-IRR på tværs af fondene; 2022-fonden på 516 millioner dollar er opskrevet til over 3,7 milliarder dollar pr. juni 2026.","sourceUrls":["https://techcrunch.com/2026/08/14/thrives-joshua-kushner-chides-silicon-valley-vcs-over-ai-euphoria/"],"confidence":"medium"},{"text":"Thrive har returneret over en milliard dollar i likviditet til sine kapitalejere de seneste tolv måneder, og cirka 90 procent af hver fond ligger i de 15 største investeringer.","sourceUrls":["https://techcrunch.com/2026/08/14/thrives-joshua-kushner-chides-silicon-valley-vcs-over-ai-euphoria/"],"confidence":"medium"}],"sources":[{"title":"Thrive's Joshua Kushner chides Silicon Valley VCs over AI euphoria","publisher":"TechCrunch","url":"https://techcrunch.com/2026/08/14/thrives-joshua-kushner-chides-silicon-valley-vcs-over-ai-euphoria/","publishedAt":"2026-08-14T19:33:00.000Z","kind":"reporting"}]},{"id":"story-dk-datacentre-varme-2026-08-16","eventKey":"datacenter-waste-heat-utilisation-2026-08","section":"Energi","headline":"Datacentre mangler at udnytte overskud af varme","primarySourceUrl":"https://www.dr.dk/nyheder/indland/datacentre-mangler-udnytte-overskud-af-varme","subheadline":"Fire ud af 50 danske datacentre bruger deres spildvarme, oplyser Energistyrelsen. Genanvendelsen var det løfte, udbygningen blev solgt på.","materialFacts":["Kun 4 ud af 50 danske datacentre udnytter deres overskudsvarme ifølge Energistyrelsen","Brancheforeningen Datacenterindustrien opgør tallet til 7","En lovændring i 2022 gav mulighed for afgiftsfritagelse via aftale med Energistyrelsen"],"body":["Da den danske hyperscale-udbygning begyndte for omkring ti år siden, var lokal fjernvarme fra spildvarmen et bærende argument for at give plads. Energistyrelsen opgør nu, at fire ud af 50 danske datacentre gør det. Brancheforeningen Datacenterindustrien mener syv.","Årsagen er ikke teknik, men pris: afgifter og prislofter gjorde forretningsmodellen urentabel, og en lovændring i 2022 om afgiftsfritagelse ændrede ikke meget. EU-retningslinjer ventes at flytte noget."],"whyItMatters":"Spildvarmen var modydelsen, kommuner og naboer fik for at afgive strøm, areal og nettilslutning.","analysis":"Tallet er værd at huske ved næste kapacitetsansøgning: Danmark diskuterer datacentre i gigawatt, mens den lovede lokale gevinst er indfriet fire steder.","counterpoint":"Kapacitetstal bør læses med rabat. Wood Mackenzie opgør, at amerikanske AI-datacentre har ansøgt om 1.066 GW nettilslutning, men vurderer, at kun cirka 28 procent godkendes.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/sjcmjjuo/000_8x49y8.jpg?im=AspectCrop%3D%28720%2C480%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%28720%2C480%29","credit":"Kilde: DR","alt":"Arkivfoto af et datacenter af den type, DR's artikel handler om","sourceUrl":"https://www.dr.dk/nyheder/indland/datacentre-mangler-udnytte-overskud-af-varme"},"topics":["danmark","energi","datacentre","regulering"],"entities":["Energistyrelsen","Datacenterindustrien","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":68,"decisionValue":64,"novelty":72,"sourceQuality":84,"personalRelevance":86,"contrast":64},"claims":[{"text":"Energistyrelsen opgør, at 4 ud af 50 danske datacentre udnytter deres overskudsvarme; brancheforeningen Datacenterindustrien mener tallet er 7.","sourceUrls":["https://www.dr.dk/nyheder/indland/datacentre-mangler-udnytte-overskud-af-varme"],"confidence":"high"},{"text":"Amerikanske AI-datacentre har ansøgt om 1.066 GW nettilslutning, og Wood Mackenzie vurderer, at cirka 28 procent bliver godkendt.","sourceUrls":["https://shifter.no/nyheter/to-av-tre-gigawatt-til-ai-datasentre-finnes-bare-pa-papiret/472627"],"confidence":"medium"}],"sources":[{"title":"Datacentre mangler at udnytte overskud af varme","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/datacentre-mangler-udnytte-overskud-af-varme","publishedAt":"2026-08-15T08:37:00.000Z","kind":"reporting"},{"title":"To av tre gigawatt til AI-datasentre finnes bare på papiret","publisher":"Shifter","url":"https://shifter.no/nyheter/to-av-tre-gigawatt-til-ai-datasentre-finnes-bare-pa-papiret/472627","publishedAt":"2026-08-14T05:20:00.000Z","kind":"analysis"}]},{"id":"story-ceuta-schengen-2026-08-16","eventKey":"ceuta-migration-crisis-2026-08","section":"Europa","headline":"Morocco detains dozens of migrants trying to cross into Ceuta - reports","primarySourceUrl":"https://www.bbc.com/news/articles/ckg44x2ey1ro","subheadline":"Italien har suspenderet Schengen-samarbejdet med Spanien og indført grænsekontrol. Danmark og Finland bakker op.","materialFacts":["Marokkanske sikkerhedskilder oplyser 111 tilbageholdte ved Fnideq cirka 3 km fra Ceuta","Italien suspenderede Schengen-fri bevægelighed med Spanien og indførte grænsekontrol; Danmark og Finland bakkede op","Tjekkiet har opfordret til midlertidigt at suspendere Spaniens Schengen-medlemskab"],"body":["Marokko tilbageholdt lørdag 111 mennesker i og omkring byen Fnideq, cirka tre kilometer fra grænsen til den spanske enklave Ceuta i Nordafrika, oplyser marokkanske sikkerhedskilder. Marokko har indsat hærofficerer, flådefartøjer og droner; Madrid har sendt over 1.500 sikkerhedsfolk.","Vigtigere er, hvad episoden for fjorten dage siden allerede har udløst i EU. Italien suspenderede den frie bevægelighed under Schengen med Spanien og indførte grænsekontrol. Danmark og Finland bakkede op, og Tjekkiet foreslog at suspendere Spaniens medlemskab midlertidigt."],"whyItMatters":"Pedro Sánchez' modargument er juridisk: Ceuta ligger ikke i Schengen-området, så de ankomne var ikke nået til det spanske fastland.","analysis":"Indre grænsekontrol bruges her af flere medlemslande mod ét andet som pressionsmiddel frem for beskyttelse. Danmark står på den side, der bruger værktøjet.","image":{"url":"https://ichef.bbci.co.uk/news/1024/branded_news/2b64/live/5894c3c0-98d0-11f1-9687-fb984065014d.jpg","credit":"Kilde: BBC News","alt":"Grænseområdet ved den spanske enklave Ceuta i Nordafrika","sourceUrl":"https://www.bbc.com/news/articles/ckg44x2ey1ro"},"topics":["europa","migration","grænser","spanien","danmark"],"entities":["Ceuta","Marokko","Spanien","Italien","Danmark","Pedro Sánchez"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":40,"novelty":70,"sourceQuality":90,"personalRelevance":44,"contrast":74},"claims":[{"text":"Marokkanske sikkerhedskilder oplyser, at 111 mennesker blev tilbageholdt i eller omkring Fnideq cirka tre kilometer fra Ceuta; Madrid har indsat over 1.500 sikkerhedsfolk.","sourceUrls":["https://www.bbc.com/news/articles/ckg44x2ey1ro"],"confidence":"medium"},{"text":"Italien suspenderede Schengen-samarbejdet om fri bevægelighed med Spanien og indførte grænsekontrol, bakket op af Finland og Danmark, mens Tjekkiet opfordrede til midlertidigt at suspendere Spaniens medlemskab.","sourceUrls":["https://www.bbc.com/news/articles/ckg44x2ey1ro"],"confidence":"high"}],"sources":[{"title":"Morocco detains dozens of migrants trying to cross into Ceuta - reports","publisher":"BBC News","url":"https://www.bbc.com/news/articles/ckg44x2ey1ro","publishedAt":"2026-08-15T19:16:40.000Z","kind":"reporting"}]},{"id":"story-germany-intel-2026-08-16","eventKey":"germany-intelligence-law-reform-2026-08","section":"Sikkerhed","headline":"German spies to get offensive powers, breaking post-Cold War taboo on 'secret police'","primarySourceUrl":"https://euobserver.com/232465/german-spies-to-get-offensive-powers-breaking-post-cold-war-taboo-on-secret-police/","subheadline":"Et lovudkast på over 700 sider vil give de tyske tjenester lov til at handle, ikke kun indsamle. Adskillelsen har stået siden efterkrigstiden.","materialFacts":["Lovudkastet fylder over 700 sider og giver BND, BfV og BAMAD operative beføjelser","BfV skal kunne omdirigere cyberangreb, manipulere forsyningskæder og fodre angribere med falsk information","Udløseren er en sprængladning fundet på en drone ved Leipzig lufthavn i begyndelsen af august 2026"],"body":["Tyskland har siden efterkrigstiden holdt efterretningstjenester og politi adskilt: tjenesterne måtte indsamle information, ikke handle på den. Et lovudkast fra indenrigsminister Alexander Dobrindt på over 700 sider ophæver den grænse for alle tre tjenester, BND, BfV og militærets BAMAD.","Konkret skal den indenlandske BfV kunne omdirigere cyberangreb, manipulere forsyningskæder, fodre angribere med falsk information og gøre tekniske instruktioner ubrugelige. BND får færre begrænsninger på skjulte operationer i udlandet, og begge får udvidet dataindsamling og AI-understøttet analyse."],"whyItMatters":"Anledningen er en sprængladning fundet på en drone ved Leipzig lufthavn i august 2026, mistænkt for russisk oprindelse.","analysis":"Adskillelsen er en af de lærer, Tyskland selv drog af Gestapo og Stasi. At den falder som svar på en drone frem for efter en forfatningsdebat er det, der bør følges.","image":{"url":"https://static.euobserver.com/2026/08/2019-08-30BNDZentraleBerlinOK0344-2400x1539.jpg","credit":"Kilde: EUobserver","alt":"BND's hovedkvarter i Berlin","sourceUrl":"https://euobserver.com/232465/german-spies-to-get-offensive-powers-breaking-post-cold-war-taboo-on-secret-police/"},"topics":["tyskland","efterretning","cybersikkerhed","regulering"],"entities":["Alexander Dobrindt","BND","BfV","Tyskland","Rusland"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":58,"novelty":74,"sourceQuality":70,"personalRelevance":58,"contrast":74},"claims":[{"text":"Et tysk lovudkast på over 700 sider vil give BND, BfV og BAMAD operative beføjelser, herunder at omdirigere cyberangreb og manipulere forsyningskæder.","sourceUrls":["https://euobserver.com/232465/german-spies-to-get-offensive-powers-breaking-post-cold-war-taboo-on-secret-police/"],"confidence":"medium"},{"text":"Anledningen er en sprængladning fundet på en drone ved Leipzig lufthavn i begyndelsen af august 2026, med mistanke om russisk oprindelse.","sourceUrls":["https://euobserver.com/232465/german-spies-to-get-offensive-powers-breaking-post-cold-war-taboo-on-secret-police/"],"confidence":"medium"}],"sources":[{"title":"German spies to get offensive powers, breaking post-Cold War taboo on 'secret police'","publisher":"EUobserver","url":"https://euobserver.com/232465/german-spies-to-get-offensive-powers-breaking-post-cold-war-taboo-on-secret-police/","publishedAt":"2026-08-14T00:00:00.000Z","kind":"reporting"}]},{"id":"story-uss-lincoln-2026-08-16","eventKey":"us-carrier-rotation-middle-east-2026-08","section":"Forsvar","headline":"US aircraft carrier expected to relieve USS Lincoln in Middle East","primarySourceUrl":"https://www.aljazeera.com/news/2026/8/15/us-aircraft-carrier-expected-to-relieve-uss-lincoln-in-middle-east","subheadline":"USS Abraham Lincoln har været udsendt i over 266 dage uden havneophold. Afløseren kommer fra Stillehavet, som nu står uden amerikansk hangarskib.","materialFacts":["USS George Washington forlod Da Nang i Vietnam lørdag 15. august for at afløse USS Abraham Lincoln","USS Abraham Lincoln har været udsendt i over 266 dage uden havneophold, en amerikansk flåderekord","Ingen amerikanske hangarskibe er tilbage i Stillehavet"],"body":["USS George Washington sejlede lørdag 15. august fra Da Nang i Vietnam for at afløse USS Abraham Lincoln i Mellemøsten. Dermed står Stillehavet uden amerikansk hangarskib. Lincoln forlod San Diego i november 2025, skulle have været hjemme i maj og har nu været udsendt i over 266 dage uden et eneste havneophold.","Om bord er cirka 5.000 søfolk og marinesoldater. Efter rapporter om besætningsmedlemmer, der forsøgte at springe over bord, bekræftede embedsmænd, at et lille antal psykiske tilfælde var behandlet uden dødsfald, mens flådeministeren afviste beskrivelserne af forholdene."],"whyItMatters":"Pentagon erkender samtidig, at Iran-kampagnen har tæret på ammunitionsbeholdningerne.","analysis":"Prisen for en krig i Mellemøsten aflæses i en anden region. 266 dage uden havn er ikke en erklæring om kapacitet, men en operativ oplysning om, hvor tyndt en flåde med to samtidige prioriteter er strakt.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/d/db/USS_Abraham_Lincoln_%28CVN-72%29_underway_in_the_Atlantic_Ocean_on_30_January_2019_%28190130-N-PW716-1312%29.JPG","credit":"Foto: US Navy via Wikimedia Commons","alt":"Hangarskibet USS Abraham Lincoln (CVN-72) til søs","sourceUrl":"https://commons.wikimedia.org/wiki/File:USS_Abraham_Lincoln_(CVN-72)_underway_in_the_Atlantic_Ocean_on_30_January_2019_(190130-N-PW716-1312).JPG"},"topics":["usa","forsvar","geopolitik","kina"],"entities":["USS Abraham Lincoln","USS George Washington","USA","Iran","Vietnam"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":70,"novelty":85,"sourceQuality":78,"personalRelevance":60,"contrast":88},"claims":[{"text":"USS George Washington forlod Da Nang i Vietnam 15. august 2026 for at afløse USS Abraham Lincoln, hvorved der ikke er noget amerikansk hangarskib tilbage i Stillehavet.","sourceUrls":["https://www.aljazeera.com/news/2026/8/15/us-aircraft-carrier-expected-to-relieve-uss-lincoln-in-middle-east"],"confidence":"medium"},{"text":"USS Abraham Lincoln har været udsendt i over 266 dage uden havneophold og har cirka 5.000 søfolk og marinesoldater om bord.","sourceUrls":["https://www.aljazeera.com/news/2026/8/15/us-aircraft-carrier-expected-to-relieve-uss-lincoln-in-middle-east"],"confidence":"medium"}],"sources":[{"title":"US aircraft carrier expected to relieve USS Lincoln in Middle East","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/15/us-aircraft-carrier-expected-to-relieve-uss-lincoln-in-middle-east","publishedAt":"2026-08-15T00:00:00.000Z","kind":"reporting"}]},{"id":"story-rockwool-moskva-2026-08-16","eventKey":"rockwool-russia-counter-lawsuit-2026-08","section":"Erhverv","headline":"Først 'stjal' Putin danske milliard-fabrikker: Nu sagsøger russerne deres danske ejer for kæmpe millionbeløb","primarySourceUrl":"https://www.dr.dk/nyheder/penge/foerst-stjal-putin-danske-milliard-fabrikker-nu-sagsoeger-russerne-deres-danske-ejer-kaempe","subheadline":"Rockwools eksproprierede russiske datterselskab kræver 8,6 milliarder rubler af moderselskabet i Danmark ved en domstol i Moskva.","materialFacts":["Rockwool LLC sagsøger den danske moderkoncern ved en domstol i Moskva for 8,6 milliarder rubler, cirka 660 millioner kroner","Sagen udspringer af et internt koncernlån på 5 milliarder rubler fra 2020","Rockwool afviser at anerkende den russiske domstols myndighed"],"body":["Rockwool byggede fra 1998 fire fabrikker i Rusland med milliardomsætning. Kontrollen blev frataget koncernen ved dekret, og nu bruger det samme selskab, Rockwool LLC, de russiske domstole mod sin tidligere ejer: kravet i Moskva lyder på 8,6 milliarder rubler, omkring 660 millioner kroner.","Grundlaget er et internt koncernlån på 5 milliarder rubler fra 2020 — penge, den danske koncern selv sendte ind i sit eget datterselskab, før det blev overtaget. Rockwool oplyser at have hentet 400 millioner kroner ud af Rusland i 2020-2024."],"whyItMatters":"Rockwool afviser at anerkende domstolens myndighed, fordi Rusland efter koncernens opfattelse ikke er en retsstat. Det holder, indtil en russisk dom kan fuldbyrdes, hvor koncernen har aktiver.","analysis":"Sagen er en skabelon frem for en enkeltsag: danske koncerner, der forlod Rusland med interne lån efterladt, har nu et eksempel på, hvordan de forfølges bagefter.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/ynagvfog/20221123-124729-l_crop001.jpg?im=AspectCrop%3D%28720%2C405%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%28720%2C405%29","credit":"Kilde: DR","alt":"Arkivfoto knyttet til DR's dækning af Rockwool i Rusland","sourceUrl":"https://www.dr.dk/nyheder/penge/foerst-stjal-putin-danske-milliard-fabrikker-nu-sagsoeger-russerne-deres-danske-ejer-kaempe"},"topics":["danmark","erhverv","rusland","jura"],"entities":["Rockwool","Danmark","Rusland","Vladimir Putin"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":70,"decisionValue":56,"novelty":80,"sourceQuality":84,"personalRelevance":72,"contrast":74},"claims":[{"text":"Rockwools russiske datterselskab Rockwool LLC sagsøger den danske moderkoncern ved en domstol i Moskva for 8,6 milliarder rubler, cirka 6 ity of Cambridge analyserede satellitbilleder af et område på to kvadratmil, talte omkring 1.600 markrygge og modellerede arbejdsforbruget. Ét kanal-ryg-system kunne anlægges på under to måneder i en enkelt tørtid, og genopretning cirka én gang pr. generation krævede få dages årligt arbejde."],"whyItMatters":"Forfatterne mener, fundet bør indgå i Colombias vandforvaltning: området oversvømmes stadig, og den historiske løsning var decentral.","analysis":"Regnestykket rækker ud over arkæologien. Størrelsen af et anlæg siger intet om, hvor koncentreret magten bag det var, hvis arbejdet kan deles i små, uafhængige stykker.","image":{"url":"https://archaeology.org/wp-content/uploads/2026/08/News-20260814-Colombia-Canals-Header-1024x579.jpg","credit":"Kilde: Archaeology Magazine","alt":"Luftbillede af de forhistoriske kanal- og markanlæg i La Mojana i Colombia","sourceUrl":"https://archaeology.org/news/2026/08/14/pre-hispanic-farmers-built-vast-canal-network-in-colombia/"},"topics":["arkæologi","historie","landbrug","latinamerika"],"entities":["University of Cambridge","La Mojana","Colombia","ICANH"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":52,"decisionValue":20,"novelty":84,"sourceQuality":82,"personalRelevance":16,"contrast":90},"claims":[{"text":"Kanal- og markanlæggene i La Mojana i Colombia dækker cirka 500.000 hektar og var i brug fra de første århundreder f.Kr. til det 11. århundrede e.Kr.","sourceUrls":["https://archaeology.org/news/2026/08/14/pre-hispanic-farmers-built-vast-canal-network-in-colombia/","https://www.cam.ac.uk/research/news/no-bosses-no-problem-pre-hispanic-farmers-built-giant-water-system-bottom-up-archaeologists-reveal"],"confidence":"medium"},{"text":"Holdet kortlagde cirka 1.600 markrygge i et område på to kvadratmil og beregnede, at ét kanal-ryg-system kunne bygges på under to måneder i en enkelt tørtid.","sourceUrls":["https://archaeology.org/news/2026/08/14/pre-hispanic-farmers-built-vast-canal-network-in-colombia/"],"con         } catch (error) {
          rollbackReason?.();
          throw error;
        }
      } catch {
        const status = document.querySelector("#feedback-status");
        if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const save = event.target.closest("[data-save-story]");
      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl
        });
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
