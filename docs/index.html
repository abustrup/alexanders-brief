<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-horizon {
  margin: 0 0 12px;
  color: var(--teal);
  font-family: var(--sans);
  font-size: 0.66rem;
  font-weight: 750;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

/* The last reading of the same quantity, when there was one. This line is the
   difference between a figure and a measurement, so it sits directly under the
   number rather than down with the source. */
.key-number-previous {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
}

.key-number-change {
  color: var(--teal);
  font-weight: 750;
  letter-spacing: 0.02em;
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

/* The shortlist: many links, one line each. Deliberately typographic and dense
   next to the featured card above it, so the difference in depth is visible
   before a word is read. */
.recommendation-shortlist {
  margin: 4px 0 0;
  border-top: 1px solid var(--rule);
}

.recommendation-short {
  padding: 13px 0 12px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-head {
  margin: 0;
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.4;
}

.recommendation-short-link {
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-link:hover,
.recommendation-short-link:focus-visible {
  color: var(--red);
  border-bottom-color: currentColor;
}

.recommendation-short-meta {
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.73rem;
  letter-spacing: 0.01em;
}

.recommendation-short-note {
  margin: 3px 0 0;
  max-width: 68ch;
  color: var(--body-soft, var(--muted));
  font-family: var(--serif);
  font-size: 0.9rem;
  line-height: 1.5;
}

.recommendation-short .feedback-panel {
  margin-top: 8px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */

om/research/riemann-zeta"],"confidence":"high"}],"sources":[{"title":"Learning more about Claude's mathematical capabilities","publisher":"Anthropic","url":"https://www.anthropic.com/research/riemann-zeta","publishedAt":"2026-08-10T12:00:00Z","kind":"primary"}]},{"id":"story-2026-08-11-vaccine","eventKey":"trump-childhood-vaccine-schedule-eo-2026-08","materialFacts":["Trump underskrev 10. august 2026 et dekret om færre børnevacciner og om at dele MMR-vaccinen i tre separate doser ved separate besøg","Der findes ikke godkendte enkeltvacciner mod mæslinger, fåresyge og røde hunde i USA i dag","American Academy of Pediatrics vurderer, at hver enkelt komponent ville tage omkring ti år at få godkendt"],"section":"Sundhed og politik","headline":"Trump and RFK Jr. try again to upend vaccines for kids","primarySourceUrl":"https://www.npr.org/2026/08/10/nx-s1-5927313/trump-rfk-jr-vaccines-autism-executive-order","subheadline":"Dekretet beder om at dele MMR-vaccinen i tre - men de tre enkeltvacciner findes ikke, og at fremstille dem tager efter lægernes skøn omkring et årti.","isLead":false,"isOutsideProfile":false,"body":["Donald Trump underskrev mandag et dekret om færre vacciner til amerikanske børn, som specifikt ønsker MMR-vaccinen delt op i tre separate indsprøjtninger givet ved separate besøg.","Forhindringen er fysisk, ikke juridisk. Der findes ingen godkendte enkeltvacciner mod mæslinger, fåresyge og røde hunde i USA. Et selskab skulle gennem forsøg og godkendelse for hver komponent, og American Academy of Pediatrics vurderer, at det tager omkring ti år. Administrationen er før stoppet i retten, da den ville ændre planen."],"whyItMatters":"En anbefaling, der ikke kan efterleves, lader planen stå uden alternativ. Imens er det staternes sundhedsmyndigheder, forsikringsselskaberne og børnelægerne, der afgør, hvad der faktisk sker.","analysis":"Forskellen i hastighed er sagens indhold: et dekret virker straks, et vaccineprogram tager år. Effekten vil derfor kunne aflæses i vaccinationsdækningen længe før i et produktregister.","topics":["sundhed","politik","usa","videnskab"],"entities":["Donald Trump","Robert F. Kennedy Jr.","American Academy of Pediatrics","MMR","USA"],"scores":{"importance":88,"decisionValue":62,"novelty":80,"sourceQuality":85,"personalRelevance":45,"contrast":72},"image":{"url":"https://npr.brightspotcdn.com/dims3/default/strip/false/crop/7961x4478+0+444/resize/1400/quality/85/format/jpeg/?url=http%3A%2F%2Fnpr-brightspot.s3.amazonaws.com%2Fd1%2F99%2Fedacc7f444eabffaedb9a5cd1cb3%2Fgettyimages-2289371259.jpg","credit":"Foto: Getty Images via NPR","alt":"Præsident Donald Trump under fremlæggelsen af dekretet om børnevaccinationer","sourceUrl":"https://www.npr.org/2026/08/10/nx-s1-5927313/trump-rfk-jr-vaccines-autism-executive-order"},"claims":[{"text":"Trump underskrev 10. august 2026 et dekret om færre børnevacciner, herunder at MMR-vaccinen skal deles i tre separate doser givet ved separate besøg.","sourceUrls":["https://www.npr.org/2026/08/10/nx-s1-5927313/trump-rfk-jr-vaccines-autism-executive-order"],"confidence":"high"},{"text":"Der findes ikke godkendte enkeltvacciner mod mæslinger, fåresyge og røde hunde i USA, og American Academy of Pediatrics vurderer, at hver komponent ville tage omkring ti år at udvikle og godkende.","sourceUrls":["https://www.npr.org/2026/08/10/nx-s1-5927313/trump-rfk-jr-vaccines-autism-executive-order","https://www.axios.com/2026/08/10/trump-order-split-up-mmr-vaccine"],"confidence":"high"}],"sources":[{"title":"Trump and RFK Jr. try again to upend vaccines for kids","publisher":"NPR","url":"https://www.npr.org/2026/08/10/nx-s1-5927313/trump-rfk-jr-vaccines-autism-executive-order","publishedAt":"2026-08-10T20:00:00Z","kind":"reporting"},{"title":"Trump executive order would split up MMR vaccine","publisher":"Axios","url":"https://www.axios.com/2026/08/10/trump-order-split-up-mmr-vaccine","publishedAt":"2026-08-10T21:00:00Z","kind":"reporting"}]},{"id":"story-2026-08-11-colombia","eventKey":"colombia-choco-earthquake-2026-08","materialFacts":["Jordskælv af styrke 7,4 ramte 5 km syd for San José del Palmar i Chocó 10. august 2026 kl. 12.34 UTC på 110 km dybde","USGS gav rødt PAGER-varsel, systemets højeste niveau, med maksimal rystelsesintensitet MMI 8","FN opgjorde 10. august 1.575 beskadigede boliger, 61 kollapsede bygninger, 18 ramte sundhedscentre og 52 uddannelsesinstitutioner"],"section":"Verden","headline":"Magnitude 7.4 quake rocks western Colombia, killing at least 111 people","primarySourceUrl":"https://www.npr.org/2026/08/10/nx-s1-5927515/earthquake-western-colombia","subheadline":"Skælvet ramte Chocó på 110 kilometers dybde og udløste USGS' højeste varselsniveau. Redningsarbejdet fortsatte tirsdag, og dødstallet steg gennem døgnet.","isLead":false,"isOutsideProfile":true,"body":["Et jordskælv af styrke 7,4 ramte mandag klokken 12.34 UTC fem kilometer syd for San José del Palmar i Chocó i det vestlige Colombia. Hypocentret lå ifølge USGS 110 kilometer nede, og rystelserne nåede Cali, Pereira og Manizales.","USGS' PAGER-system gav rødt varsel, det højeste af fire niveauer. FN opgjorde mandag 1.575 beskadigede boliger, 61 kollapsede bygninger, 18 ramte sundhedscentre og 52 uddannelsesinstitutioner. Colombias geologiske tjeneste kalder det landets kraftigste skælv i dette århundrede."],"whyItMatters":"Dybden forklarer, hvorfor skaderne rækker så langt fra epicentret. Et skælv 110 kilometer nede river ikke jorden op lokalt, men fordeler energien bredt over flere provinser.","analysis":"Dødstallet steg gennem døgnet. De kilder, der er kontrolleret her, står på mindst 111 omkomne og 87 sårede opgjort mandag. Højere tal cirkulerede tirsdag og er udeladt, fordi de ikke er efterprøvet.","topics":["naturkatastrofe","latinamerika","beredskab"],"entities":["Colombia","San José del Palmar","Chocó","Cali","USGS","FN"],"scores":{"importance":92,"decisionValue":30,"novelty":88,"sourceQuality":92,"personalRelevance":20,"contrast":62},"image":{"url":"https://npr.brightspotcdn.com/dims3/default/strip/false/crop/3375x1898+0+176/resize/1400/quality/85/format/jpeg/?url=http%3A%2F%2Fnpr-brightspot.s3.amazonaws.com%2Fb1%2Fa5%2F784e9cd34d2cb0873ca1b63ee34d%2Fap26222743359122.jpg","credit":"Foto: AP via NPR","alt":"Redningsmandskab og frivillige arbejder i murbrokkerne efter jordskælvet i det vestlige Colombia","sourceUrl":"https://www.npr.org/2026/08/10/nx-s1-5927515/earthquake-western-colombia"},"claims":[{"text":"Jordskælvet målte 7,4, ramte 5 km syd for San José del Palmar 10. august 2026 kl. 12.34.28 UTC og lå på 110,3 km dybde.","sourceUrls":["https://earthquake.usgs.gov/earthquakes/eventpage/us6000tjl2"],"confidence":"high"},{"text":"USGS' PAGER-system gav rødt varsel med maksimal rystelsesintensitet MMI 8.","sourceUrls":["https://earthquake.usgs.gov/earthquakes/eventpage/us6000tjl2"],"confidence":"high"},{"text":"FN opgjorde 10. august 1.575 beskadigede boliger, 37 ødelagte, 61 kollapsede bygninger, 18 ramte sundhedscentre og 52 ramte uddannelsesinstitutioner samt mindst 111 omkomne og mindst 87 sårede.","sourceUrls":["https://news.un.org/en/story/2026/08/1168106"],"confidence":"high"}],"sources":[{"title":"Magnitude 7.4 quake rocks western Colombia, killing at least 111 people","publisher":"NPR","url":"https://www.npr.org/2026/08/10/nx-s1-5927515/earthquake-western-colombia","publishedAt":"2026-08-10T18:00:00Z","kind":"reporting"},{"title":"M 7.4 - 5 km S of San José del Palmar, Colombia","publisher":"USGS","url":"https://earthquake.usgs.gov/earthquakes/eventpage/us6000tjl2","publishedAt":"2026-08-10T12:34:28Z","kind":"primary"},{"title":"UN offers support to Colombia after magnitude 7.4 earthquake kills dozens","publisher":"UN News","url":"https://news.un.org/en/story/2026/08/1168106","publishedAt":"2026-08-10T22:00:00Z","kind":"primary"}]},{"id":"story-2026-08-11-solformoerkelse","eventKey":"europe-solar-eclipse-grid-2026-08-12","materialFacts":["Solformørkelsen 12. august 2026 ventes at fjerne op til 9,7 GW europæisk solproduktion mellem 19.15 og 21.30 CEST","Sol udgjorde omkring 13 procent af EU's elproduktion i 2025","ENTSO-E har aktiveret en taskforce, udskudt planlagte netudkoblinger og varslet markedsaktørerne"],"section":"Energi","headline":"Europa klar til solformørkelse: Rammer elnettet - også Energinet har regnet på effekt","primarySourceUrl":"https://ing.dk/artikel/europa-klar-til-solformoerkelse-rammer-elnettet-ogsaa-energinet-har-regnet-paa-effekt","subheadline":"Op til 9,7 gigawatt solproduktion forsvinder onsdag aften og kommer igen kort efter. Europas systemoperatører har regnet på det i forvejen.","isLead":false,"isOutsideProfile":false,"body":["Onsdag den 12. august trækker månen sig hen over solen, og i Danmark dækkes 80-85 procent af solskiven omkring klokken 20.04. For elsystemet er det en varslet belastningsprøve: ENTSO-E venter, at op til 9,7 gigawatt solproduktion forsvinder og vender tilbage mellem 19.15 og 21.30 CEST.","Faldet rammer skævt: de største udsving ventes i Tyskland og Spanien. Sol stod for omkring 13 procent af EU's elproduktion i 2025, og operatørerne har nedsat en taskforce, udskudt planlagte netudkoblinger og varslet markedsaktørerne."],"whyItMatters":"Det er en hændelse, systemet kan forberede sig præcist på, fordi tidspunktet har været kendt i århundreder. Rampen skal dækkes af noget andet på minutter, og prisen viser, hvor fleksibelt nettet er blevet.","analysis":"Solformørkelsen i 2015 var en prøve på et system med langt mindre sol i, så prøven bliver hårdere hver gang. Hold øje med balancemarkedets priser onsdag aften.","topics":["energi","elnet","infrastruktur","europa"],"entities":["ENTSO-E","Energinet","Tyskland","Spanien","Danmark"],"scores":{"importance":72,"decisionValue":78,"novelty":82,"sourceQuality":88,"personalRelevance":80,"contrast":76},"image":{"url":"https://ing.dk/sites/mi/files/styles/open_graph_image_16_9/public/2023-06/jongsun-lee-f-pszo_jee8-unsplash.jpg?itok=2d3n4zfH","credit":"Foto: Jongsun Lee/Unsplash via Ingeniøren","alt":"Arkivfoto af solceller, illustration til Ingeniørens artikel om solformørkelsens virkning på elnettet","sourceUrl":"https://ing.dk/artikel/europa-klar-til-solformoerkelse-rammer-elnettet-ogsaa-energinet-har-regnet-paa-effekt"},"primaryExcerpt":{"quote":"Under clear-sky conditions, photovoltaic (PV) output could decrease by up to 9.7 GW across Europe","sourceUrl":"https://www.entsoe.eu/news/2026/08/07/transmission-system-operators-prepare-for-solar-eclipse-to-ensure-secure-system-operation/","sourceTitle":"Transmission System Operators prepare for solar eclipse to ensure secure system operation"},"claims":[{"text":"Under skyfri himmel ventes solformørkelsen 12. august 2026 at fjerne op til 9,7 GW europæisk solproduktion i vinduet 19.15-21.30 CEST.","sourceUrls":["https://www.entsoe.eu/news/2026/08/07/transmission-system-operators-prepare-for-solar-eclipse-to-ensure-secure-system-operation/"],"confidence":"high"},{"text":"Sol udgjorde omkring 13 procent af EU's elproduktion i 2025, og Spanien og Tyskland ventes hårdest ramt.","sourceUrls":["https://www.entsoe.eu/news/2026/08/07/transmission-system-operators-prepare-for-solar-eclipse-to-ensure-secure-system-operation/"],"confidence":"high"},{"text":"I Danmark dækkes 80-85 procent af solskiven, med maksimum omkring klokken 20.04.","sourceUrls":["https://ing.dk/artikel/europa-klar-til-solformoerkelse-rammer-elnettet-ogsaa-energinet-har-regnet-paa-effekt"],"confidence":"medium"}],"sources":[{"title":"Europa klar til solformørkelse: Rammer elnettet - også Energinet har regnet på effekt","publisher":"Ingeniøren","url":"https://ing.dk/artikel/europa-klar-til-solformoerkelse-rammer-elnettet-ogsaa-energinet-har-regnet-paa-effekt","publishedAt":"2026-08-11T09:10:48Z","kind":"reporting"},{"title":"Transmission System Operators prepare for solar eclipse to ensure secure system operation","publisher":"ENTSO-E","url":"https://www.entsoe.eu/news/2026/08/07/transmission-system-operators-prepare-for-solar-eclipse-to-ensure-secure-system-operation/","publishedAt":"2026-08-07T10:00:00Z","kind":"primary"}]},{"id":"story-2026-08-11-afis","eventKey":"dk-politi-fingeraftryksregister-fejl-2026-08","materialFacts":["En fejl i migreringen til politiets nye fingeraftryksregister har ramt spor fra gerningssteder i tusindvis af straffesager","En stikprøve på 574 sager gav match mellem personer og fingeraftryk i 35 straffesager","Stikprøven omfattede kun sager, der ikke er forældede"],"section":"Danmark","headline":"Omfattende fejl i politiets fingeraftryksregister - gerningsmænd kan være gået fri","primarySourceUrl":"https://www.version2.dk/artikel/omfattende-fejl-i-politiets-fingeraftryksregister-gerningsmaend-kan-vaere-gaaet-fri","subheadline":"En fejl i migreringen til politiets nye AFIS-register har ramt spor fra tusindvis af sager. En stikprøve på 574 gav 35 match, der ikke blev fundet dengang.","isLead":false,"isOutsideProfile":false,"body":["Fingeraftryk sikret på gerningssteder i tusindvis af danske straffesager er ramt af en fejl i migreringen til politiets nye register, AFIS. Det fremgår af aktindsigt hos NSK og Rigspolitiet, som Version2 og Ingeniøren har fået.","Omfanget begynder at kunne aflæses. NSK gennemgik en stikprøve på 574 ikke-forældede sager og fandt i 35 af dem et match mellem en person og et fingeraftryk fra et gerningssted. De match blev ikke fundet, da sagerne var aktuelle."],"whyItMatters":"574 sager med 35 match er ikke en anekdote, men en rate. Lagt på et grundlag i tusindvis peger den på langt flere end 35 - og hver enkelt er en efterforskning, der løb ud i sandet på et forkert grundlag.","analysis":"Bemærk hvad der fejlede. Ikke en algoritme, der traf en dårlig beslutning, men en dataflytning mellem to systemer - den mest rutineprægede opgave i offentlig it. Fejlen råbte ikke op; den gav blot færre svar, end den skulle.","topics":["danmark","offentlig it","retssikkerhed","digitalisering"],"entities":["Rigspolitiet","NSK","AFIS","Version2","Ingeniøren"],"scores":{"importance":80,"decisionValue":70,"novelty":90,"sourceQuality":82,"personalRelevance":72,"contrast":70},"image":{"url":"https://www.version2.dk/sites/mi/files/2026-08/tabte-spor-16-9.gif?itok=ALTChUHw","credit":"Illustration: Anders Reinbothe/Version2","alt":"Version2's illustration af fingeraftryk til artikelserien om tabte spor i politiets register","sourceUrl":"https://www.version2.dk/artikel/omfattende-fejl-i-politiets-fingeraftryksregister-gerningsmaend-kan-vaere-gaaet-fri"},"claims":[{"text":"NSK's stikprøve på 574 ikke-forældede sager gav match mellem personer og fingeraftryk fra gerningssteder i 35 straffesager.","sourceUrls":["https://ing.dk/artikel/efter-afsloering-af-it-fejl-hos-politiet-stikproeve-gav-match-i-35-straffesager"],"confidence":"high"},{"text":"Fejlen stammer fra migreringen til politiets nye fingeraftryksregister og er dokumenteret gennem aktindsigt hos NSK og Rigspolitiet.","sourceUrls":["https://www.version2.dk/artikel/omfattende-fejl-i-politiets-fingeraftryksregister-gerningsmaend-kan-vaere-gaaet-fri"],"confidence":"medium"}],"sources":[{"title":"Omfattende fejl i politiets fingeraftryksregister - gerningsmænd kan være gået fri","publisher":"Version2","url":"https://www.version2.dk/artikel/omfattende-fejl-i-politiets-fingeraftryksregister-gerningsmaend-kan-vaere-gaaet-fri","publishedAt":"2026-08-11T03:00:00Z","kind":"reporting"},{"title":"Efter afsløring af it-fejl hos politiet: Stikprøve gav match i 35 straffesager","publisher":"Ingeniøren","url":"https://ing.dk/artikel/efter-afsloering-af-it-fejl-hos-politiet-stikproeve-gav-match-i-35-straffesager","publishedAt":"2026-08-11T10:04:49Z","kind":"reporting"}]},{"id":"story-2026-08-11-museglimmer","eventKey":"meta-muse-glimmer-open-weights-2026-08","materialFacts":["Meta udgav 10. august 2026 Muse Glimmer på 30 milliarder parametre under Apache 2.0","Modellen fylder under 20 GB efter 4-bit-kvantisering mod 55 GB i fuld præcision","Spekulativ afkodning giver 3,1x hastighed på RTX 5090, 1,8x på M5 Max og 1,5x på M4 Max"],"section":"AI","headline":"Introducing Muse Glimmer: An Open Agentic Model That Runs on Your Device","primarySourceUrl":"https://research.meta.ai/blog/introducing-muse-glimmer-open-agentic-model","subheadline":"Meta lægger en agentmodel på 30 milliarder parametre ud under Apache 2.0. Den fylder under 20 gigabyte og kører på ét forbrugergrafikkort.","isLead":false,"isOutsideProfile":false,"body":["Meta Superintelligence Labs udgav mandag Muse Glimmer, en model på 30 milliarder parametre bygget til agentarbejde lokalt, og lagde vægtene ud under Apache 2.0.","Tallene handler om, hvad der kan være på én maskine. Modellen fylder 55 gigabyte i fuld præcision og under 20 efter 4-bit-kvantisering, og Meta oplyser, at spekulativ afkodning giver 3,1 gange hastigheden på et RTX 5090 og 1,8 på en M5 Max. Vægtene ligger på Hugging Face."],"whyItMatters":"En agentmodel på én maskine under en licens uden brugsbegrænsninger flytter grænsen for, hvad en organisation kan lade en model se. Data, der ikke må forlade huset, kan behandles i huset. Det er en indkøbsbeslutning, ikke en holdning.","analysis":"Retningen er værd at bemærke hos netop Meta, der det seneste år har strammet licensvilkårene på sine største modeller.","counterpoint":"Tallene er Metas egne, og hastighed målt på navngivet hardware ser typisk bedst ud hos afsenderen.","topics":["ai","open source","modeller","hardware"],"entities":["Meta","Meta Superintelligence Labs","Muse Glimmer","Hugging Face"],"scores":{"importance":74,"decisionValue":82,"novelty":80,"sourceQuality":84,"personalRelevance":88,"contrast":66},"discoveredVia":{"name":"AINews","url":"https://news.smol.ai/"},"image":{"url":"https://lookaside.fbsbx.com/elementpath/media/?media_id=2272911630133843&version=1786289182","credit":"Kilde: Meta AI Research","alt":"Metas eget delebillede til annonceringen af agentmodellen Muse Glimmer","sourceUrl":"https://research.meta.ai/blog/introducing-muse-glimmer-open-agentic-model"},"c l-have-kina-fri-vindenergi-til-18-millioner-danskere-derfor-er-det-naermest-umuligt","publisher":"Version2","section":"Energi","publishedAt":"2026-08-10T03:00:00Z","summary":"Suverænitetskravet møder leverandørkæden, og leverandørkæden vinder indtil videre."},{"text":"New Pass-ta-key attack reveals all the things we didn't know about passkeys","headline":"New Pass-ta-key attack reveals all the things we didn't know about passkeys","url":"https://arstechnica.com/security/2026/08/heres-why-the-new-pass-ta-key-attack-is-mostly-a-nothingburger/","publisher":"Ars Technica","section":"Cybersikkerhed","publishedAt":"2026-08-11T11:30:08Z","summary":"Artiklens egen konklusion er, at angrebet betyder lidt - men den blotlægger antagelser i passkey-modellen, som ikke var alment kendte."},{"text":"Australien vil vaccinere udsatte arter mod fugleinfluenza","headline":"Australien vil vaccinere udsatte arter mod fugleinfluenza","url":"https://www.dr.dk/nyheder/seneste/australien-vil-vaccinere-udsatte-arter-mod-fugleinfluenza","publisher":"DR","section":"Videnskab","publishedAt":"2026-08-11T08:28:25Z","summary":"Vaccination af vilde dyr som artsbevarelse er stadig sjældent og metodisk vanskeligt."},{"text":"Beijing kan få tredjedel af sin årlige nedbør i løbet af et døgn","headline":"Beijing kan få tredjedel af sin årlige nedbør i løbet af et døgn","url":"https://www.dr.dk/nyheder/seneste/beijing-kan-faa-tredjedel-af-sin-aarlige-nedboer-i-loebet-af-et-doegn","publisher":"DR","section":"Klima","publishedAt":"2026-08-11T04:58:01Z","summary":"Et års regn på en dag er en belastningsprøve, byens kloakering ikke er dimensioneret til."},{"text":"Liverpool fans seek clarity on Bezos bid to buy stake","headline":"Liverpool fans seek clarity on Bezos bid to buy stake","url":"https://www.aljazeera.com/sports/2026/8/11/liverpool-fans-seek-clarity-on-bezos-bid-to-buy-stake","publisher":"Al Jazeera","section":"Sport og erhverv","publishedAt":"2026-08-11T13:36:26Z","summary":"Fanejerskab mod kapital, i den mest sete udgave af den strid der findes."}],"column":{"authoredBy":"ai","slug":"prisen-paa-det-ai-ikke-kan","title":"AI's tydeligste prisvirkning bliver en dyrere blikkenslager","thesis":"Den mest målbare priseffekt af kunstig intelligens i Danmark bliver ikke billigere tænkearbejde, men at alt, der kræver et menneske til stede i rummet, bliver relativt dyrere.","horizon":"Frem mod 2031, aflæst i Danmarks Statistiks prisindeks PRIS01","body":["William Baumol beskrev i 1967 en ubehagelig mekanik: stiger produktiviteten ujævnt, stiger de relative priser der, hvor den ikke stiger. En strygekvartet kræver stadig fire mennesker i tres minutter.","Det er allerede sket i Danmark, uden AI. Fra juli 2016 til juli 2026 steg varer 17,3 procent og tjenester 28,8. Under tjenesterne: børnepasning 41,2 procent, frisør 31,2, håndværkerarbejde 26,1. Internetadgang steg 2,5.","Min påstand er ikke, at AI skaber mønstret, men at den accelererer det. Nedslaget er afstanden mellem varer og tjenester: 11,5 procentpoint over et årti, og jeg forventer, tallet er større i 2031. Én ting taler imod mig: finansielle tjenesteydelser steg 33,6 procent, hurtigere end håndværkere. Skillelinjen går ikke mellem hoved og hånd, men mellem det, der kan leveres uden at nogen er til stede, og alt andet."],"uncertainty":"Jeg tager fejl, hvis afstanden mellem tjenester og varer i PRIS01 i juli 2031 er uændret eller mindre end de 11,5 procentpoint, den er nu. Det svækker også tesen, hvis frisør, børnepasning og håndværkerarbejde holder op med at stige hurtigere end det samlede indeks tre år i træk.","topics":["økonomi","ai","priser","danmark"],"claims":[{"text":"Fra juli 2016 til juli 2026 steg det danske forbrugerprisindeks for varer 17,3 procent og for tjenester 28,8 procent; børnepasning steg 41,2 procent, restauranter 36,1, frisør 31,2, håndværkertjenester til boligen 26,1, software 10,0 og internetadgang 2,5 procent. Finansielle tjenesteydelser steg 33,6 procent.","sourceUrls":["https://www.s     bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
