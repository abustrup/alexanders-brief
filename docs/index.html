<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;

:"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","primarySourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","subheadline":"Den mangeårige republikanske senator fra South Carolina døde natten til søndag, kort efter en rejse til Ukraine.","body":["Senator Lindsey Graham (R-South Carolina) døde 71 år gammel natten til søndag den 11. juli, timer efter et besøg hos præsident Zelenskyj i Ukraine. Retsmedicinernes foreløbige konklusion 12. juli peger på en aortadissektion som følge af åreforkalkning efter et hjertestop i hjemmet.","Graham blev valgt til Senatet i 2002 og stillede op til en femte periode 3. november. Efter South Carolinas lov udpeger guvernør Henry McMaster (R) nu en midlertidig afløser frem til 3. januar 2027, hvorefter pladsen besættes ved midtvejsvalget."],"whyItMatters":"Grahams død fjerner en af Trumps mest markante udenrigspolitiske allierede i Senatet og udløser et opgør om en sikker republikansk plads.","analysis":"Med en snæver magtbalance kan selv én tom plads påvirke afstemninger, og nomineringskampen tester Trump-fløjens styrke i South Carolina.","topics":["politik","USA","Senatet","valg"],"entities":["Lindsey Graham","USA","South Carolina","Henry McMaster","Donald Trump"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":45,"novelty":88,"sourceQuality":88,"personalRelevance":40,"contrast":55},"claims":[{"text":"US Senator Lindsey Graham (R-South Carolina) died at 71 on the night of Saturday, July 11, 2026, confirmed by his office and multiple independent outlets.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies"],"confidence":"high"},{"text":"Preliminary medical examiner findings give the cause of death as aortic dissection due to arteriosclerotic cardiovascular disease.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/"],"confidence":"high"},{"text":"Graham died hours after returning from a trip to Ukraine and had been seeking a fifth Senate term in the November 3, 2026 election.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"],"confidence":"high"}],"sources":[{"title":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","publisher":"CBS News","url":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","publishedAt":"2026-07-13T00:51:00.000Z","kind":"reporting"},{"title":"Lindsey Graham dies of aortic dissection, preliminary medical report says","publisher":"The Washington Post","url":"https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"},{"title":"Sen. Lindsey Graham of South Carolina, Trump ally, dies at 71","publisher":"NPR","url":"https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies","publishedAt":"2026-07-12T04:00:00.000Z","kind":"reporting"}],"image":{"url":"https://assets2.cbsnewsstatic.com/hub/i/r/2026/07/12/b382a83e-fc49-460b-9f9a-8c8e3539c038/thumbnail/620x413/92887803139a33088d75d95a066274f3/gettyimages-2259262756.jpg","credit":"Kilde: CBS News / Getty Images","alt":"Portræt i forbindelse med senator Lindsey Grahams død","sourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/"}},{"id":"story-groenland-reform-20260713","eventKey":"groenland-offentlig-sektor-reformkommission-2026-07","materialFacts":["Greenland's public finances (the Landskassen) ran a deficit of roughly 400 million kroner in 2025 in the operating and capital account balance, prompting Naalakkersuisut to set up a reform commission to overhaul the public sector.","Greenland's government currently has 10 ministers and 11 departments, and the commission will examine whether that many departments are necessary, alongside possible privatisations and a unified benefits-payment system.","The commission, chaired by economist Johnny í Grótinum, meets physically for the first time in Nuuk in early September and must deliver a preliminary report early next year with concrete short-term initiatives.","Brain-drain is cited as a shared challenge for both Greenland and the Faroe Islands, whose young people leave to study in Denmark and too rarely return; Finance Minister Aqqaluaq B. Egede warns public spending will otherwise rise faster than revenue."],"section":"Rigsfællesskabet","headline":"Efter røde tal: Den offentlige sektor i Grønland skal have en overhaling","primarySourceUrl":"https://www.dr.dk/nyheder/indland/groenland/efter-roede-tal-den-offentlige-sektor-i-groenland-skal-have-en-overhaling","subheadline":"Et underskud i landskassen sender Grønland i gang med en gennemgribende reform af den offentlige sektor.","body":["Grønlands landskasse kom ud af 2025 med et underskud på op mod 400 millioner kroner, og Naalakkersuisut har nedsat en reformkommission for hele den offentlige sektor. Den skal bl.a. vurdere, om selvstyrets 10 ministre og 11 departementer er for mange.","Kommissionen ledes af økonomen Johnny í Grótinum og mødes fysisk første gang i Nuuk i september; en foreløbig rapport ventes tidligt næste år. Finansminister Aqqaluaq B. Egede advarer om, at udgifterne ellers stiger hurtigere end indtægterne, og peger på unge grønlænderes fraflytning til Danmark."],"whyItMatters":"Grønlands økonomiske robusthed er blevet et sikkerhedspolitisk spørgsmål; jo mere selvstyret bærer sig selv, jo stærkere står rigsfællesskabet i Arktis.","analysis":"Reformen handler mindre om sparepolitik end om demografi: uden unge, der vender hjem efter uddannelse, smuldrer skattegrundlaget for ydelserne.","topics":["rigsfællesskab","Arktis","offentlig økonomi","Grønland"],"entities":["Grønland","Naalakkersuisut","Johnny í Grótinum","Aqqaluaq B. Egede","Nuuk"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":48,"novelty":62,"sourceQuality":82,"personalRelevance":55,"contrast":50},"claims":[{"text":"Greenland's Landskassen ran a deficit of about 400 million kroner in 2025, prompting Naalakkersuisut to establish a reform commission to overhaul the public sector.","sourceUrls":["https://www.dr.dk/nyheder/indland/groenland/efter-roede-tal-den-offentlige-sektor-i-groenland-skal-have-en-overhaling"],"confidence":"high"},{"text":"Greenland's government has 10 ministers and 11 departments, and the commission will question whether so many departments are needed.","sourceUrls":["https://www.dr.dk/nyheder/indland/groenland/efter-roede-tal-den-offentlige-sektor-i-groenland-skal-have-en-overhaling"],"confidence":"high"},{"text":"The reform commission, chaired by economist Johnny í Grótinum, meets physically in Nuuk in early September and delivers a preliminary report early next year.","sourceUrls":["https://www.dr.dk/nyheder/indland/groenland/efter-roede-tal-den-offentlige-sektor-i-groenland-skal-have-en-overhaling","https://www.sermitsiaq.ag/samfund/okonom-skal-lede-naalakkersuisuts-reformkommission/2395719"],"confidence":"high"}],"sources":[{"title":"Efter røde tal: Den offentlige sektor i Grønland skal have en overhaling","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/groenland/efter-roede-tal-den-offentlige-sektor-i-groenland-skal-have-en-overhaling","publishedAt":"2026-07-12T19:53:00.000Z","kind":"reporting"},{"title":"Økonom skal lede Naalakkersuisuts reformkommission","publisher":"Sermitsiaq.AG","url":"https://www.sermitsiaq.ag/samfund/okonom-skal-lede-naalakkersuisuts-reformkommission/2395719","publishedAt":"2026-07-11T22:00:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/sh4ik5il/20260217-173940-3.jpg?im=AspectCrop=(1200,675),xPosition=.5,yPosition=.5;Resize=(1200,675)","credit":"Kilde: DR","alt":"Illustration til historien om reform af Grønlands offentlige sektor","sourceUrl":"https://www.dr.dk/nyheder/indland/groenland/efter-roede-tal-den-offentlige-sektor-i-groenland-skal-have-en-overhaling"}},{"id":"story-google-willow-quantum-20260713","eventKey":"google-willow-rl-error-correction-nature-2026-07","materialFacts":["Google Quantum AI (Santa Barbara, California, USA) published in Nature the paper 'Reinforcement learning control of quantum error correction,' describing an autonomous reinforcement-learning agent that unifies real-time calibration with active quantum error correction to stabilize logical qubits during uninterrupted execution on the Willow superconducting processor.","The system set a record average logical error per cycle of 7.72(9)x10^-4 for a distance-7 surface code (decoded via the AlphaQubit2 neural-network model) and 8.19(14)x10^-3 for a distance-5 colour code.","It delivered a 20% reduction in base logical error rates following expert calibration and a 3.5x improvement in logical stability under injected/targeted drift.","The agent managed O(1,000) live controls, with numerical simulations validating scaling to a distance-15 surface code governing roughly 40,000 control parameters."],"section":"Kvanteteknologi","headline":"Google Research Stabilizes \"Willow\" Quantum Processor Using Continuous Reinforcement Learning Control Layers","primarySourceUrl":"https://quantumcomputingreport.com/google-research-stabilizes-willow-quantum-processor-using-continuous-reinforcement-learning-control-layers/","subheadline":"En selvstyrende AI-agent holder Googles kvantechip stabil og sætter ny rekord for logisk fejlrate.","body":["Google Quantum AI har i Nature offentliggjort en metode, hvor en selvstyrende forstærkningslæringsagent samler realtidskalibrering og aktiv fejlkorrektion, så logiske qubits holdes stabile under uafbrudt drift på Willow-processoren i Santa Barbara, USA.","Systemet satte en rekordlav gennemsnitlig logisk fejl på 7,72×10⁻⁴ per cyklus for en distance-7-kode, en 20 procents lavere fejlrate efter kalibrering og 3,5 gange bedre stabilitet under bevidst drift. Simuleringer peger på skalering til cirka 40.000 parametre."],"whyItMatters":"Fejlkorrektion er den afgørende flaskehals mod nyttige kvantecomputere; lader man en AI overtage den løbende justering, bliver problemet skalerbart.","analysis":"Resultatet viser, at AI og kvanteteknologi forstærker hinanden: samme maskinlæring, der driver sprogmodeller, tæmmer nu støjen i hardwaren under dem.","topics":["kvantecomputing","AI","deeptech","fejlkorrektion"],"entities":["Google Quantum AI","Willow","Nature","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":74,"decisionValue":48,"novelty":86,"sourceQuality":84,"personalRelevance":86,"contrast":60},"claims":[{"text":"Google Quantum AI published in Nature an autonomous reinforcement-learning agent that stabilizes logical qubits by unifying real-time calibration with active quantum error correction on the Willow processor.","sourceUrls":["https://quantumcomputingreport.com/google-research-stabilizes-willow-quantum-processor-using-continuous-reinforcement-learning-control-layers/","https://www.nature.com/articles/s41586-026-10759-2"],"confidence":"high"},{"text":"The framework achieved a record average logical error per cycle of 7.72x10^-4 for a distance-7 surface code and 8.19x10^-3 for a distance-5 colour code.","sourceUrls":["https://quantumcomputingreport.com/google-research-stabilizes-willow-quantum-processor-using-continuous-reinforcement-learning-control-layers/","https://quantumzeitgeist.com/google-quantum-ai-surface-code-error/"],"confidence":"high"},{"text":"It delivered a 20% reduction in base logical error rates and a 3.5x improvement in logical stability under drift, with simulations scaling to a distance-15 code governing about 40,000 control parameters.","sourceUrls":["https://quantumcomputingreport.com/google-research-stabilizes-willow-quantum-processor-using-continuous-reinforcement-learning-control-layers/","https://quantumzeitgeist.com/google-quantum-ai-surface-code-error/"],"confidence":"high"}],"sources":[{"title":"Google Research Stabilizes \"Willow\" Quantum Processor Using Continuous Reinforcement Learning Control Layers","publisher":"Quantum Computing Report","url":"https://quantumcomputingreport.com/google-research-stabilizes-willow-quantum-processor-using-continuous-reinforcement-learning-control-layers/","publishedAt":"2026-07-10T16:00:00.000Z","kind":"reporting"},{"title":"Reinforcement learning control of quantum error correction","publisher":"Nature","url":"https://www.nature.com/articles/s41586-026-10759-2","publishedAt":"2026-07-08T00:00:00.000Z","kind":"primary"},{"title":"Google Cuts Surface Code Error Rate to 7.72 × 10−4 With RL","publisher":"Quantum Zeitgeist","url":"https://quantumzeitgeist.com/google-quantum-ai-surface-code-error/","publishedAt":"2026-07-08T00:00:00.000Z","kind":"reporting"}],"image":{"url":"https://quantumcomputingreport.com/wp-content/uploads/2026/07/image-139-1024x389.png","credit":"Kilde: Quantum Computing Report / Google Quantum AI","alt":"Illustration af Googles Willow-kvanteprocessor","sourceUrl":"https://quantumcomputingreport.com/google-research-stabilizes-willow-quantum-processor-using-continuous-reinforcement-learning-control-layers/"}},{"id":"story-jscrambler-npm-attack-20260713","eventKey":"jscrambler-npm-rust-infostealer-supply-chain-2026-07","materialFacts":["The official jscrambler npm package (~15,800 weekly downloads) was compromised via a stolen npm publishing credential; installing v8.14.0 executes a cross-platform Rust infostealer, one native binary each for Windows, macOS and Linux.","The malware sweeps for AWS, Azure and Google Cloud credentials, CI tokens, crypto wallets (MetaMask, Phantom, Exodus), password-manager vaults (Bitwarden), browser/messaging sessions, and config files for AI coding tools including Claude Desktop, Cursor, Windsurf, VS Code and Zed.","Socket tied five malicious versions to one actor pushed over about three hours (8.14.0, 8.16.0, 8.17.0, 8.18.0, 8.20.0) and flagged the first release six minutes after it was published; 8.22.0 is the recommended clean release.","From 8.18.0 the attacker moved the dropper from a preinstall hook into a self-executing function, defeating scanners that only inspect preinstall scripts and surviving npm install --ignore-scripts."],"section":"Cybersikkerhed","headline":"Compromised jscrambler 8.14.0 npm Release Drops Rust Infostealer During Install","primarySourceUrl":"https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html","subheadline":"En kapret npm-pakke installerede en tyvekode, der blandt andet jagter konfigurationsfiler til AI-kodeværktøjer.","body":["Den officielle npm-pakke jscrambler – omkring 15.800 ugentlige downloads – blev kompromitteret via en stjålet udgivelsesnøgle, så installation af version 8.14.0 kørte en Rust-tyvekode med binærer til Windows, macOS og Linux. Jscrambler er en portugisisk sikkerhedsleverandør.","Koden ledte efter nøgler til AWS, Azure og Google Cloud, kryptopunge, password managers og konfigurationsfiler til AI-kodeværktøjer som Claude Desktop, Cursor, VS Code og Zed. Ifølge Socket kom fem versioner på tre timer; den første blev fanget seks minutter efter udgivelsen, og 8.22.0 er den rene rettelse."],"whyItMatters":"Angrebet rammer, hvor udvikling er mest sårbar: den blinde tillid til pakker, der installeres automatisk – og AI-værktøjernes hemmeligheder var et selvstændigt mål.","analysis":"At koden fra 8.18.0 flyttede væk fra preinstall-scriptet viser en bevidst kamp mod scannere; „--ignore-scripts“ er ikke længere nogen garanti.","topics":["cybersikkerhed","forsyningskæde","AI-værktøjer","malware"],"entities":["jscrambler","npm","Socket","Claude Desktop","Cursor"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":66,"decisionValue":80,"novelty":80,"sourceQuality":84,"personalRelevance":84,"contrast":60},"claims":[{"text":"The jscrambler npm package (~15,800 weekly downloads) was compromised so that installing v8.14.0 runs a cross-platform Rust infostealer during install, via a stolen npm publishing credential.","sourceUrls":["https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html","https://socket.dev/blog/jscrambler-supply-chain-attack"],"confidence":"high"},{"text":"The infostealer targets AWS/Azure/Google Cloud credentials, crypto wallets, password managers, and config files for AI coding tools including Claude Desktop, Cursor, Windsurf, VS Code and Zed.","sourceUrls":["https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html","https://safedep.io/jscrambler-npm-supply-chain-compromise/"],"confidence":"high"},{"text":"Five malicious versions (8.14.0, 8.16.0, 8.17.0, 8.18.0, 8.20.0) shipped over about three hours; Socket flagged the first six minutes after publish, and 8.22.0 is the clean release.","sourceUrls":["https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html","https://socket.dev/blog/jscrambler-supply-chain-attack"],"confidence":"high"}],"sources":[{"title":"Compromised jscrambler 8.14.0 npm Release Drops Rust Infostealer During Install","publisher":"The Hacker News","url":"https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html","publishedAt":"2026-07-11T03:30:00.000Z","kind":"reporting"},{"title":"jscrambler npm Package Compromised in Supply Chain Attack","publisher":"Socket","url":"https://socket.dev/blog/jscrambler-supply-chain-attack","publishedAt":"2026-07-11T00:00:00.000Z","kind":"primary"},{"title":"Official jscrambler npm Package Compromised Across Multiple Releases","publisher":"SafeDep","url":"https://safedep.io/jscrambler-npm-supply-chain-compromise/","publishedAt":"2026-07-11T00:00:00.000Z","kind":"analysis"}],"image":{"url":"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhodiWPXDsex6YL7v4e2n_D5MJFMht76GRRmHTdiG61tfEmsoZyow4tkiS3ORACILDl2fNP27YQkw1XLSBKGcom-DhCVzzPDdkdSgeMGdxcVL_rgO70x5LqZcjxKAPTtFOquB8LwSBPWrSpflqCzns-cFZ_EVm0WZfV7wSoPM3S-7_IGtCT3AjxY0rfITU/s1700-e365/npm-js.jpg","credit":"Kilde: The Hacker News","alt":"Illustration af npm-forsyningskædeangrebet","sourceUrl":"https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html"}},{"id":"story-bornholm-ejendomsskat-20260713","eventKey":"bornholm-lejligheder-koebenhavn-beskatning-2026-07","materialFacts":["In Denmark, Vurderingsstyrelsen taxes Bornholm apartments using the price development of the capital region (Copenhagen, Frederiksberg and suburbs) because too few local apartment sales exist to calculate a real local price trend; as a result, property tax on Bornholm apartments is set to rise 18.9% next year, far more than the roughly 6% rise in local property values.","Bornholm resident Stig Johansen bought a 165 m2 apartment in Nexø for just over 1.1 million kroner (about a year ago) and now faces the 18.9% property-tax increase from next year.","Danish Tax and Growth Minister Jakob Engel-Schmidt (M) called the valuation model 'uacceptabel' and ordered Vurderingsstyrelsen to critically review the data foundation and methods used in areas with sparse local data.","Bornholm's mayor Frederik Tolstrup (Venstre) called the situation a big problem, saying the authority does not have a grip on reality everywhere and that it is 'enormt kritisk'."],"section":"Indland","headline":"Bornholmske lejligheder beskattes som i København – enormt kritisk, siger borgmester","primarySourceUrl":"https://nyheder.tv2.dk/samfund/2026-07-11-bornholmske-lejligheder-beskattes-som-i-koebenhavn-enormt-kritisk-siger-borgmester","subheadline":"Manglende lokale salgsdata får Vurderingsstyrelsen til at bruge hovedstadens prisudvikling på Bornholm – og skatten stiger næsten 19 procent.","body":["Fordi der sælges for få lejligheder på Bornholm til at beregne en lokal prisudvikling, bruger Vurderingsstyrelsen hovedstadsområdets udvikling, når grundskylden fastsættes. Derfor stiger ejendomsskatten på bornholmske lejligheder 18,9 procent til næste år, selvom de lokale værdier kun er steget omkring 6 procent.","Blandt de ramte er Stig Johansen, der købte en lejlighed på 165 kvadratmeter i Neksø for godt 1,1 million kroner. Borgmester Frederik Tolstrup (V) kalder det „enormt kritisk“, og skatteminister Jakob Engel-Schmidt (M) betegner modellen som „uacceptabel“ og har bedt styrelsen gennemgå metoden."],"whyItMatters":"Sagen viser, hvordan et vurderingssystem bygget på gennemsnit kan ramme skævt i tyndtbefolkede egne og nære følelsen af et skævvredet Danmark.","analysis":"Ministerens hurtige udmelding signalerer vilje, men problemet er strukturelt: uden nok lokale handler mangler modellen simpelthen data.","topics":["skat","bolig","indland","geografisk ulighed"],"entities":["Bornholm","Vurderingsstyrelsen","Jakob Engel-Schmidt","Frederik Tolstrup","Neksø"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":56,"decisionValue":55,"novelty":66,"sourceQuality":80,"personalRelevance":45,"contrast":62},"claims":[{"text":"Because too few apartment sales exist on Bornholm to compute a local price trend, Vurderingsstyrelsen applies the capital-region (Copenhagen area) price development, pushing property tax on Bornholm apartments up 18.9% next year versus only about 6% local value growth.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-07-11-bornholmske-lejligheder-beskattes-som-i-koebenhavn-enormt-kritisk-siger-borgmester","https://bornholm.nu/nyheder/skattefaelde-lurer-for-bornholmske-lejlighedsejere/139547"],"confidence":"high"},{"text":"Resident Stig Johansen bought a 165 m2 apartment in Nexø for just over 1.1 million kroner and faces the 18.9% property-tax jump from next year.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-07-11-bornholmske-lejligheder-beskattes-som-i-koebenhavn-enormt-kritisk-siger-borgmester"],"confidence":"high"},{"text":"Tax and Growth Minister Jakob Engel-Schmidt (M) called the valuation model 'uacceptabel' and ordered Vurderingsstyrelsen to critically review its data foundation and methods, while Bornholm mayor Frederik Tolstrup (Venstre) called it enormously critical.","sourceUrls":["https://nyheder.tv2.dk/samfund/2026-07-11-bornholmske-lejligheder-beskattes-som-i-koebenhavn-enormt-kritisk-siger-borgmester","https://www.tv2bornholm.dk/bornholm/bornholmske-lejligheder-beskattes-som-i-kobenhavn-enormt-kritisk-siger-borgmester-47d30"],"confidence":"high"}],"sources":[{"title":"Bornholmske lejligheder beskattes som i København – enormt kritisk, siger borgmester","publisher":"TV 2","url":"https://nyheder.tv2.dk/samfund/2026-07-11-bornholmske-lejligheder-beskattes-som-i-koebenhavn-enormt-kritisk-siger-borgmester","publishedAt":"2026-07-11T16:55:00.000Z","kind":"reporting"},{"title":"Bornholmske lejligheder beskattes som i København – enormt kritisk, siger borgmester","publisher":"TV2 Bornholm","url":"https://www.tv2bornholm.dk/bornholm/bornholmske-lejligheder-beskattes-som-i-kobenhavn-enormt-kritisk-siger-borgmester-47d30","publishedAt":"2026-07-11T16:55:00.000Z","kind":"reporting"},{"title":"Skattefælde lurer for bornholmske lejlighedsejere","publisher":"Bornholm.nu","url":"https://bornholm.nu/nyheder/skattefaelde-lurer-for-bornholmske-lejlighedsejere/139547","publishedAt":"2026-07-10T22:00:00.000Z","kind":"reporting"}],"image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/4/2/7/4275b104-0a62-42b0-8c1e-f5bdef9c4c02?ixlib=js-3.8.0&w=624&h=351&q=45&auto=format&fit=crop&rect64=MCwzOTksNzY3MCw0MzE0&s=02519b5a9b1480d52a2e90d51148bd3b","credit":"Kilde: TV 2","alt":"Boliger på Bornholm i forbindelse med sag om ejendomsskat","sourceUrl":"https://nyheder.tv2.dk/samfund/2026-07-11-bornholmske-lejligheder-beskattes-som-i-koebenhavn-enormt-kritisk-siger-borgmester"}},{"id":"story-folkekirke-ai-praediken-20260713","eventKey":"ai-praedikener-folkekirken-sognepraest-2026-07","materialFacts":["Henri Brorson, sognepræst in Skive (Denmark), warns that clergy who let AI author their sermons are digging the Danish folk church's (folkekirken) own grave, insisting worship must be genuine 'fra menneske til menneske, fra ånd til ånd'.","Brorson says: 'Jeg tror faktisk, at AI kan skrive en ganske glimrende prædiken på ti sekunder' — but adds that if it became known a sermon was AI-made, it would be 'folkekirkens død'.","Præsteforeningen (the Danish Priests' Association) launched an AI assistant, the 'Prædikenhjælper' (also referred to as Prædikehjælper), trained on the folk church's material including roughly 20 years of the association's sermon guidance and the church text series.","A referenced case describes a priest, Lisbeth, who delivered a ChatGPT-written sermon that her congregation did not detect as AI-generated."],"section":"Kultur","headline":"Sognepræst: Præster graver folkekirkens egen grav, hvis AI er forfatteren bag deres prædikener","primarySourceUrl":"https://www.dr.dk/nyheder/indland/sognepraest-praester-graver-folkekirkens-egen-grav-hvis-ai-er-forfatteren-bag-deres-praedikener","subheadline":"En sognepræst advarer mod AI-skrevne prædikener, mens Præsteforeningens eget AI-værktøj deler vandene.","body":["Sognepræst Henri Brorson fra Skive advarer om, at præster, der lader AI skrive deres prædikener, graver folkekirkens egen grav; gudstjenesten skal være ægte, „fra menneske til menneske“. Han anerkender pointen – „AI kan skrive en ganske glimrende prædiken på ti sekunder“ – men opdages det, vil det være „folkekirkens død“.","Debatten skærpes af, at Præsteforeningen selv har lanceret AI-værktøjet Prædikenhjælperen, trænet på folkekirkens materiale og årtiers vejledning. I et omtalt tilfælde holdt en præst en ChatGPT-skrevet prædiken, uden at menigheden opdagede det."],"whyItMatters":"Historien flytter AI-diskussionen til en af Danmarks mest tillidsbaserede institutioner: Hvad er værdien af et menneskeligt ord, når maskinen kan efterligne det?","analysis":"Præsteforeningens dilemma – at bygge værktøjet og frygte det – er et miniaturebillede af samfundets AI-forhold, hvor autenticiteten, ikke effektiviteten, er produktet.","topics":["AI","kultur","religion","autenticitet"],"entities":["Folkekirken","Præsteforeningen","Henri Brorson","Skive"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":45,"decisionValue":30,"novelty":82,"sourceQuality":80,"personalRelevance":55,"contrast":80},"claims":[{"text":"Sognepræst Henri Brorson (Skive) warns that if it becomes known that AI is the author behind clergy's sermons, it would be the folk church's death, saying AI can write an excellent sermon in ten seconds.","sourceUrls":["https://www.dr.dk/nyheder/indland/sognepraest-praester-graver-folkekirkens-egen-grav-hvis-ai-er-forfatteren-bag-deres-praedikener"],"confidence":"high"},{"text":"Præsteforeningen launched an AI sermon-writing assistant (Prædikenhjælper) trained on the Danish folk church's guidelines and years of sermon guidance, and later acknowledged they may have gone too far in demonstrating how to make it write full sermons.","sourceUrls":["https://www.dr.dk/nyheder/indland/praesteforening-har-lavet-en-ai-der-kan-skrive-praesternes-praedikener-dem-men","https://praesteforening.dk/praedikenhjaelperenai/"],"confidence":"high"},{"text":"A priest named Lisbeth delivered a ChatGPT-written sermon that her congregation did not detect as AI-generated.","sourceUrls":["https://www.dr.dk/nyheder/indland/sognepraest-praester-graver-folkekirkens-egen-grav-hvis-ai-er-forfatteren-bag-deres-praedikener"],"confidence":"medium"}],"sources":[{"title":"Sognepræst: Præster graver folkekirkens egen grav, hvis AI er forfatteren bag deres prædikener","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/sognepraest-praester-graver-folkekirkens-egen-grav-hvis-ai-er-forfatteren-bag-deres-praedikener","publishedAt":"2026-07-12T12:25:00.000Z","kind":"reporting"},{"title":"Præsteforening har lavet en AI, der kan skrive præsternes prædikener for dem – men erkender nu, at de er gået for langt","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/praesteforening-har-lavet-en-ai-der-kan-skrive-praesternes-praedikener-dem-men","publishedAt":"2026-07-11T22:00:00.000Z","kind":"reporting"},{"title":"Prædikenhjælperen (AI)","publisher":"Præsteforeningen","url":"https://praesteforening.dk/praedikenhjaelperenai/","publishedAt":"2024-12-31T23:00:00.000Z","kind":"primary"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/cmnp3ije/image-1_crop001.jpg?im=AspectCrop=(720,405),xPosition=.5,yPosition=.5;Resize=(720,405)","credit":"Kilde: DR","alt":"Illustration til historien om AI-skrevne prædikener i folkekirken","sourceUrl":"https://www.dr.dk/nyheder/indland/sognepraest-praester-graver-folkekirkens-egen-grav-hvis-ai-er-forfatteren-bag-deres-praedikener"}},{"id":"story-smartphone-bans-mental-health-20260713","eventKey":"school-smartphone-bans-mental-health-2026-07","materialFacts":["A cost-utility analysis within the SMART Schools study (University of Birmingham, published in BMJ Mental Health) drew on 815 pupils aged 12-15 across 20 secondary schools in England — 13 with restrictive smartphone policies and 7 permissive.","Restrictive schools showed no meaningful mental-health or quality-of-life advantage: incremental QALYs were 0.009 (95% CI -0.014 to 0.032) and MWALYs -0.004 (95% CI -0.044 to 0.036), both uncertain and effectively near zero.","Restrictive policies were slightly cheaper to enforce, costing about £94 less per pupil per school year (95% CI -£229 to £41), using roughly 3.1 full-time-equivalent staff versus 3.3 in permissive schools.","The findings counter the intuitive policy assumption that school phone bans deliver measurable wellbeing gains, though managing phones still consumes over three full-time staff salaries a year per school in England."],"section":"Psykologi","headline":"School smartphone bans save time but don’t improve student mental health, study finds","primarySourceUrl":"https://www.psypost.org/school-smartphone-bans-save-time-but-dont-improve-student-mental-health-study-finds/","subheadline":"Et britisk studie finder, at restriktive telefonpolitikker sparer tid, men ikke måleligt løfter elevernes trivsel.","body":["Et sundhedsøkonomisk studie fra University of Birmingham i BMJ Mental Health fulgte 815 elever på 12-15 år på 20 engelske skoler, 13 med restriktive telefonpolitikker og 7 tilladende. De restriktive skoler gav ingen meningsfuld gevinst i trivsel eller livskvalitet; effekterne var usikre og tæt på nul.","Til gengæld var de restriktive politikker lidt billigere – omkring 94 pund mindre per elev om året – men telefonhåndtering koster stadig over tre fuldtidsstillinger om året per skole."],"whyItMatters":"Telefonforbud er en populær mærkesag; studiet antyder, at de løser et ordensproblem, ikke den trivselskrise, de ofte sælges på.","analysis":"Fundet minder om at skelne mekanisme fra ønsketænkning: at fjerne telefonen frigør lærertid, men årsagerne til dårlig trivsel forsvinder ikke.","counterpoint":"Studiet måler skolepolitik, ikke samlet skærmtid; eleverne brugte stadig telefoner efter skole, så en effekt kan kræve bredere indgreb.","topics":["psykologi","uddannelse","skærmtid","trivsel"],"entities":["University of Birmingham","BMJ Mental Health","England"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":58,"decisionValue":45,"novelty":72,"sourceQuality":78,"personalRelevance":55,"contrast":88},"claims":[{"text":"A University of Birmingham SMART Schools analysis published in BMJ Mental Health used data from 815 pupils aged 12-15 across 20 English secondary schools (13 restrictive, 7 permissive).","sourceUrls":["https://www.psypost.org/school-smartphone-bans-save-time-but-dont-improve-student-mental-health-study-finds/","https://bmjgroup.com/school-restrictive-smartphone-policies-may-save-a-small-amount-of-money-by-reducing-staff-costs/"],"confidence":"high"},{"text":"Restrictive phone policies produced no meaningful gain in pupils' quality of life or mental wellbeing (QALY 0.009 and MWALY -0.004, both close to zero), despite the intuitive expectation that bans improve wellbeing.","sourceUrls":["https://www.psypost.org/school-smartphone-bans-save-time-but-dont-improve-student-mental-health-study-finds/","https://pubmed.ncbi.nlm.nih.gov/41667290/"],"confidence":"high"},{"text":"Restrictive policies cost roughly £94 less per pupil per school year and used slightly less staff time (3.1 vs 3.3 full-time-equivalent staff), so the only measurable benefit was a small cost saving, not better mental health.","sourceUrls":["https://bmjgroup.com/school-restrictive-smartphone-policies-may-save-a-small-amount-of-money-by-reducing-staff-costs/","https://www.psypost.org/school-smartphone-bans-save-time-but-dont-improve-student-mental-health-study-finds/"],"confidence":"high"}],"sources":[{"title":"School smartphone bans save time but don’t improve student mental health, study finds","publisher":"PsyPost","url":"https://www.psypost.org/school-smartphone-bans-save-time-but-dont-improve-student-mental-health-study-finds/","publishedAt":"2026-07-12T22:00:26.000Z","kind":"reporting"},{"title":"School restrictive smartphone policies may save a small amount of money by reducing staff costs","publisher":"BMJ Group","url":"https://bmjgroup.com/school-restrictive-smartphone-policies-may-save-a-small-amount-of-money-by-reducing-staff-costs/","publishedAt":"2026-02-10T00:00:00.000Z","kind":"primary"},{"title":"Health economics analysis of restrictive school smartphone policies in secondary schools in England (SMART Schools)","publisher":"BMJ Mental Health / PubMed","url":"https://pubmed.ncbi.nlm.nih.gov/41667290/","publishedAt":"2026-02-10T00:00:00.000Z","kind":"primary"}],"image":{"url":"https://www.psypost.org/wp-content/uploads/2026/07/teens-on-smartphones-at-school.jpg","credit":"Kilde: PsyPost
