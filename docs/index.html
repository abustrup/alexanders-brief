<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8eddf">
  <title>Alexanders Brief</title>
  <style>:root {
  color-scheme: light;
  /* Frozen reading column: constant width on desktop, capped to the viewport
     on small screens. The composition never reflows, so type uses fixed sizes
     (no vw units) and stays identical when the browser is zoomed out. */
  --shell: min(720px, calc(100% - 24px));
  --ink: #181714;
  --muted: #6e675f;
  --paper: #f8eddf;
  --paper-deep: #f0dfcc;
  --rule: #b9aa99;
  --red: #a82942;
  --teal: #0b6769;
  --green: #255d49;
  --blue: #263d5c;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--serif);
  font-size: 3.5rem;
  font-weight: 700;
  letter-spacing: -0.055em;
  line-height: 0.94;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 1.06rem;
  line-height: 1.35;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--red);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.lead-layout {
  display: block;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.story {
  min-width: 0;
}

/* Lead is always stacked: image on top, text below, signals beneath. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-align: center;
  text-transform: uppercase;
}

.story-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 28px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-grid .story-card:nth-child(odd) {
  padding-right: 28px;
  border-right: 1px solid var(--rule);
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  background: #d8cabb;
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, rgba(11, 103, 105, 0.14), transparent 55%),
    repeating-linear-gradient(0deg, #decfbe 0 1px, #eadccc 1px 8px);
}

.media-fallback-label {
  max-width: 90%;
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--red);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 2.5rem;
  font-weight: 700;
  hyphens: auto;
  letter-spacing: -0.04em;
  line-height: 0.99;
}

.story-card .story-headline {
  font-size: 1.55rem;
  line-height: 1.02;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: #443f39;
  font-family: var(--serif);
  font-size: 1.04rem;
  line-height: 1.34;
}

.story-body,
.editorial-continuation {
  font-size: 0.93rem;
  line-height: 1.55;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: #403c37; }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

.feedback-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.feedback-button,
.reason-chip {
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

.feedback-button {
  font-size: 0.74rem;
  font-weight: 700;
}

.feedback-button:hover,
.feedback-button:focus-visible,
.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--paper-deep);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected { background: var(--green); color: #fff; }
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected { background: var(--red); color: #fff; }

.feedback-reasons { margin-top: 9px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 34px;
  margin: 0 4px 5px 0;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 0.71rem;
}

.lead-signals {
  min-width: 0;
  margin-top: 19px;
  padding-top: 19px;
  border-top: 1px solid var(--ink);
}

/* Signal rows: meta on its own line, then headline | summary side by side. */
.lead-signals .signal-item {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  column-gap: 18px;
}

.lead-signals .signal-meta { grid-column: 1 / -1; }

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--red);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: #4e4943;
  font-size: 0.79rem;
  line-height: 1.4;
}

.short-news {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.short-news .signal-item {
  padding: 18px 20px 18px 0;
}

.short-news .signal-item:not(:nth-child(3n + 1)) {
  padding-left: 20px;
  border-left: 1px solid var(--rule);
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 28px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-grid .recommendation-card:nth-child(odd) {
  padding-right: 28px;
  border-right: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: #d8cabb;
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--red);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--red);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-size: 0.93rem;
  line-height: 1.55;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: #403c37; }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-meta">
      <p id="brief-date"></p>
      <p id="brief-reading-time"></p>
    </div>
    <h1 id="brief-title">Alexanders Brief</h1>
    <p id="brief-dek" class="masthead-dek"></p>
    <div id="audio-controls" class="audio-controls" aria-label="Lydoplæsning" hidden></div>
  </header>
  <main class="page-shell">
    <section class="lead-layout" aria-label="Tophistorie og vigtigste signaler">
      <div id="lead-story"></div>
      <aside id="lead-signals" class="lead-signals" aria-label="Morgenens signaler"></aside>
    </section>
    <section class="expanded-news" aria-labelledby="story-grid-heading">
      <h2 id="story-grid-heading" class="section-heading">Dagens vigtigste historier</h2>
      <div id="story-grid" class="story-grid"></div>
    </section>
    <section id="short-news-section" class="short-news-section" aria-labelledby="short-news-heading">
      <h2 id="short-news-heading" class="section-heading">Kort fortalt</h2>
      <div id="short-news" class="short-news"></div>
    </section>
    <div id="key-number-slot" class="key-number-slot" hidden></div>
    <section id="recommendations-section" class="recommendations-section" aria-labelledby="recommendations-heading" hidden>
      <header class="recommendations-header">
        <h2 id="recommendations-heading" class="section-heading">AI-redaktørens valg</h2>
        <p class="recommendations-subtitle">Se · læs · lyt · oplev · prøv</p>
      </header>
      <div id="recommendation-featured" class="recommendation-featured"></div>
      <div id="recommendation-grid" class="recommendation-grid"></div>
    </section>
  </main>
  <footer class="page-footer">
    <p>Fakta, fortolkning og kilder er samlet i et læsbart flow.</p>

  <script>globalThis.__BRIEF_DATA__ = {"schemaVersion":1,"runId":"2026-06-29-v1","date":"2026-06-29","generatedAt":"2026-06-29T04:05:00Z","readingMinutes":11,"title":"Alexanders Brief","dek":"EIFO ankrer EU's største vækstfond, en dødelig hedebølge ramte Europa, og Putin erkendte russisk brændstofkrise – plus en robot, der skal redde en NASA-satellit, og kommunistisk jordskredssejr i Graz.","profileWeights":{"importance":25,"decisionValue":20,"novelty":15,"sourceQuality":15,"personalRelevance":15,"contrast":10},"stories":[{"id":"story-eifo-scaleup-fund-20260629","eventKey":"eifo-eqt-scaleup-europe-fund-2026","materialFacts":["Danmarks EIFO forpligter 200 millioner euro som eneste statslige ankerinvestor i den ca. 5 milliarder euro store Scaleup Europe Fund","Fonden forvaltes af svenske EQT, og Europa-Kommissionen er største stifterinvestor med 1 milliard euro","Pengene skal i 30-40 europæiske vækstvirksomheder inden for AI, kvante, robotter, rumfart og biotek; første investering ventes i efteråret 2026"],"section":"Venturekapital","headline":"EIFO leads €200M anchor investment in EQT's €5B Scaleup Europe Fund","primarySourceUrl":"https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/","subheadline":"Danmarks eksport- og investeringsfond bliver eneste statslige ankerinvestor i EU's største vækstkapitalfond til dato","body":["Danmarks Eksport- og Investeringsfond, EIFO, forpligter 200 millioner euro – cirka 1,5 milliarder kroner – til den nye Scaleup Europe Fund på i alt omkring 5 milliarder euro. EIFO går ind som den eneste statslige fremmebank blandt ankerinvestorerne og på lige vilkår med de private.","Fonden forvaltes kommercielt af svenske EQT, mens Europa-Kommissionen er største stifter med 1 milliard euro – foran Novo Holdings, tyske Allianz og spanske Santander. Pengene skal i 30-40 europæiske vækstselskaber inden for AI, kvante, robotter, rumfart og biotek, med første investering ventet i efteråret 2026."],"whyItMatters":"Manglen på sen-fase-kapital er netop grunden til, at europæiske champions historisk er endt på amerikanske hænder. Her ankrer en dansk statslig fond EU's største forsøg på at lukke kløften til amerikansk og kinesisk vækstkapital.","analysis":"Konstruktionen er lige så vigtig som beløbet: en offentlig fond ankrer, men EQT forvalter, så kapitalen ikke bliver statsstyret. Den reelle prøve bliver, om fonden kan skrive checks store nok til at konkurrere fra Series B og frem – og om selskaberne forbliver europæiske, når de vokser.","counterpoint":"5 milliarder euro er stadig beskedent mod de store amerikanske vækstfonde.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Belgique_-_Bruxelles_-_Schuman_-_Berlaymont_-_01.jpg/960px-Belgique_-_Bruxelles_-_Schuman_-_Berlaymont_-_01.jpg","credit":"Foto: Wikimedia Commons","alt":"Europa-Kommissionens hovedkvarter Berlaymont i Bruxelles","sourceUrl":"https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/"},"topics":["venturekapital","teknologisk suverænitet","AI","scaleups","Danmark"],"entities":["EIFO","EQT","Europa-Kommissionen","Novo Holdings","Allianz"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":88,"novelty":78,"sourceQuality":80,"personalRelevance":95,"contrast":60},"claims":[{"text":"EIFO forpligter 200 mio. euro som eneste statslige ankerinvestor i Scaleup Europe Fund.","sourceUrls":["https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/","https://www.bloomberg.com/news/articles/2026-06-26/denmark-s-eifo-invests-200-million-in-eu-fund-for-tech-scale-up"],"confidence":"high"},{"text":"Fonden er på ca. 5 mia. euro, forvaltes af EQT, og Europa-Kommissionen er største stifter med 1 mia. euro.","sourceUrls":["https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/"],"confidence":"high"},{"text":"Fonden vil investere i 30-40 europæiske vækstvirksomheder med første investering i efteråret 2026.","sourceUrls":["https://techfundingnews.com/eqt-eifo-5b-scaleup-europe-fund/"],"confiden pen ikke når at køle af.","analysis":"Attributionsstudiet sætter tal på ansvaret: dagvarmen var cirka 10 og nattevarmen over 100 gange mere sandsynlig end for 20 år siden – et signal om infrastruktur bygget til et koldere klima.","image":{"url":"https://images.euronews.com/articles/stories/09/81/62/69/1536x864_cmsv2_38208c5d-8609-5ca5-b634-d9279147394a-9816269.jpg","credit":"Kilde: Euronews","alt":"Mennesker søger skygge og vand under den europæiske hedebølge","sourceUrl":"https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave"},"topics":["klima","hedebølge","sundhed","Europa"],"entities":["WHO","Frankrig","Spanien","Storbritannien","World Weather Attribution"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":86,"decisionValue":56,"novelty":66,"sourceQuality":80,"personalRelevance":55,"contrast":62},"claims":[{"text":"WHO opgør mere end 1.300 ekstra dødsfald i Europa siden 21. juni; Frankrig ca. 1.000 siden 24. juni (85 pct. 65+).","sourceUrls":["https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave"],"confidence":"high"},{"text":"Storbritannien satte junirekord med 37,3 grader i Suffolk, og Tyskland passerede 40 grader.","sourceUrls":["https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave"],"confidence":"high"},{"text":"Dagvarmen var ca. 10 gange og nattevarmen over 100 gange mere sandsynlig end i 2003 pga. fossil opvarmning.","sourceUrls":["https://www.worldweatherattribution.org/fossil-fuel-emissions-have-rapidly-worsened-european-heatwaves-in-just-a-few-decades/"],"confidence":"high"}],"sources":[{"title":"Europe sees more than 1,300 excess deaths amid brutal heatwave, WHO says","publisher":"Euronews","url":"https://www.euronews.com/my-europe/2026/06/28/france-sees-around-1000-excess-deaths-during-brutal-heatwave","publishedAt":"2026-06-28T07:32:00Z","kind":"reporting"},{"title":"Fossil fuel emissions have rapidly worsened European heatwaves in just a few decades","publisher":"World Weather Attribution","url":"https://www.worldweatherattribution.org/fossil-fuel-emissions-have-rapidly-worsened-european-heatwaves-in-just-a-few-decades/","publishedAt":"2026-06-26T06:00:00Z","kind":"analysis"}]},{"id":"story-russia-fuel-crisis-20260629","eventKey":"russia-fuel-crisis-ukraine-refinery-strikes-2026-06","materialFacts":["Putin erkendte 28. juni russiske brændstofforsyningsproblemer med køer ved tankstationer og trussel mod høsten","Dieselprisen ramte rekord 77.177 rubler pr. ton på SPIMEX-børsen, en stigning på 23 procent siden april","Ukraine angreb to russiske raffinaderier i Slavjansk i Krasnodar og i Jaroslavl"],"section":"Sikkerhed","headline":"Russere kører tomhændede fra tankstationer – nu reagerer Putin","primarySourceUrl":"https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin","subheadline":"Ukraines angreb på russiske raffinaderier presser brændstofmarkedet så hårdt, at præsidenten nu erkender problemerne","body":["Vladimir Putin erkendte 28. juni offentligt, at Rusland har brændstofproblemer: \"Vi kan se problemerne, vi er klar over dem og reagerer på dem,\" sagde han om køer ved tankstationer og en trussel mod høsten. En sjælden indrømmelse fra Kreml.","Baggrunden er ukrainske langtrækkende angreb på russiske raffinaderier; senest blev anlæg i Slavjansk i Krasnodar og i Jaroslavl ramt. Dieselprisen nåede rekorden 77.177 rubler pr. ton på SPIMEX-børsen, 23 procent over april."],"whyItMatters":"Når Kreml indrømmer mangel ved pumperne, viser det, at Ukraines angreb på energiinfrastruktur dybt i Rusland nu rammer krigsøkonomien – ikke kun militære mål.","analysis":"Brændstof er Ruslands stærkeste eksportkort og samtidig en akilleshæl: rammes raffinaderierne, stiger priserne hjemme, mens eksportindtægterne falder. Kreml overvejer nu et dieseleksportforbud.","image":{"url":"https://cdn-free.tv2i.dk/e/d/i/editorial/2/3/e/23e0d1de-4ce4-49a3-8350-c1b2473ff9f8?ixlib=js-3.8.0&w=624&h=351&q=45&auto=format&fit=crop&rect64=NzQwLDQzOCwxNzAwLDk1NQ&s=f72baa02c56cef5eeb30337087e337d5","credit":"Kilde: TV 2","alt":"Tankstation i Rusland under brændstofmangel","sourceUrl":"https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin"},"topics":["forsvar","Ukraine","Rusland","energi"],"entities":["Vladimir Putin","Ukraine","Rusland","SPIMEX"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":60,"novelty":72,"sourceQuality":72,"personalRelevance":58,"contrast":64},"claims":[{"text":"Putin erkendte 28. juni russiske brændstofproblemer med køer ved tankstationer og trussel mod høsten.","sourceUrls":["https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin"],"confidence":"high"},{"text":"Dieselprisen ramte rekord 77.177 rubler pr. ton på SPIMEX, +23 pct. siden april; Kreml overvejer dieseleksportforbud.","sourceUrls":["https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin"],"confidence":"high"},{"text":"Ukraine angreb to russiske raffinaderier i Slavjansk (Krasnodar) og Jaroslavl.","sourceUrls":["https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin"],"confidence":"medium"}],"sources":[{"title":"Russere kører tomhændede fra tankstationer – nu reagerer Putin","publisher":"TV 2","url":"https://nyheder.tv2.dk/udland/2026-06-28-russere-koerer-tomhaendede-fra-tankstationer-nu-reagerer-putin","publishedAt":"2026-06-28T20:25:00Z","kind":"reporting"}]},{"id":"story-dk-datacenter-secret-20260629","eventKey":"dk-hidden-investor-datacenter-stovstrup-2026","materialFacts":["Dokumenter peger på et stort amerikansk hyperscale-datacenter ved Stovstrup i Ringkøbing-Skjern Kommune","Et ministerium hemmeligholder den reelle investors identitet","Projektet lover job i 30+ år, mens kritikere stiller spørgsmål ved elforbrug og nettilslutning"],"section":"Teknologi","headline":"Ministerium skjuler investor bag kæmpe datacenter: Big tech titter frem i papirerne","primarySourceUrl":"https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik","subheadline":"Et stort datacenter i Vestjylland er omgivet af mystik, mens myndighederne holder den udenlandske ejer skjult","body":["Et planlagt hyperscale-datacenter ved Stovstrup i Ringkøbing-Skjern Kommune er omgærdet af usædvanlig hemmelighed. Ifølge Version2 hemmeligholder et ministerium den reelle investors identitet, men spor i dokumenterne peger på en stor amerikansk techvirksomhed.","Sagen rejser to spørgsmål: hvem der reelt ejer kritisk infrastruktur på dansk jord, og hvad den koster på elnettet. Kritikere spørger, hvorfor strømslugende anlæg får gunstige vilkår, mens forbrugerne mærker pres på elpriserne."],"whyItMatters":"Skjult udenlandsk ejerskab af digital infrastruktur rammer direkte ind i debatten om teknologisk suverænitet – og om, hvor meget dansk strøm der skal gå til andre landes databehov.","analysis":"Når en myndighed afskærmer en investors navn, kolliderer ønsket om at tiltrække investeringer med offentlighedens ret til at vide, hvem der ejer kritisk infrastruktur – og det presser både transparens og energiplanlægning.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Utah_Data_Center_Panorama_%28cropped%29.jpg/960px-Utah_Data_Center_Panorama_%28cropped%29.jpg","credit":"Foto: Wikimedia Commons","alt":"Stort hyperscale-datacenter set udefra (arkivfoto)","sourceUrl":"https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik"},"topics":["teknologi","datacentre","energi","teknologisk suverænitet","Danmark"],"entities":["Ringkøbing-Skjern Kommune","Stovstrup","Energinet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":60,"decisionValue":62,"novelty":68,"sourceQuality":72,"personalRelevance":78,"contrast":60},"claims":[{"text":"Dokumenter peger på et stort amerikansk hyperscale-datacenter ved Stovstrup i Ringkøbing-Skjern Kommune.","sourceUrls":["https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik"],"confidence":"medium"},{"text":"Et ministerium hemmeligholder den reelle investors identitet.","sourceUrls":["https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik"],"confidence":"high"}],"sources":[{"title":"Ministerium skjuler investor bag kæmpe datacenter: Big tech titter frem i papirerne","publisher":"Version2","url":"https://www.version2.dk/artikel/big-tech-titter-frem-i-papirerne-stort-vestjysk-datacenter-er-omgivet-af-mystik","publishedAt":"2026-06-26T10:15:00Z","kind":"reporting"}]},{"id":"story-dk-handshake-ruling-20260629","eventKey":"dk-supreme-court-handshake-ruling-2026","materialFacts":["Højesteret fastslog, at religiøst begrundet afvisning af håndtryk ikke kan begrunde en fyring","Blå blok vil hurtigt ændre loven; Messerschmidt siger, Højesteret har vendt danske værdier ryggen","Regeringen ved Morten Bødskov vil afvente en fuld juridisk vurdering"],"section":"Politik","headline":"Højesteretsdom udløser værdikamp i Folketinget: Blå partier vil stille krav om håndtryk med lovændring","primarySourceUrl":"https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk","subheadline":"En afgørelse om en nægtet håndhilsen genåbner en af Danmarks mest betændte integrationsstrider","body":["Højesteret har afgjort, at en medarbejder ikke lovligt kan fyres alene for af religiøse grunde at afvise at give hånd. Dommen vender op og ned på en årelang strid og udløste prompte en værdikamp i Folketinget.","Blå blok kræver en hurtig lovændring. Dansk Folkepartis Morten Messerschmidt erklærede, at \"Højesteret har vendt danske værdier ryggen,\" og vil gøre håndtryk til et ansættelseskrav. Regeringen ved Morten Bødskov vil se en juridisk vurdering først."],"whyItMatters":"Sagen handler kun overfladisk om et håndtryk. Den tvinger den nye regering til at vælge mellem en symbolsk stram udlændingelinje og respekten for en dom om religionsfrihed.","analysis":"At lovgive sig ud af en højesteretsdom er muligt, men risikabelt: et håndtrykskrav kan kollidere med menneskerettighedskonventionen og arbejdsretten. Striden bliver en tidlig prøve på regeringens værdipolitik.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Christiansborg_Slot_Copenhagen_2014_01.jpg/960px-Christiansborg_Slot_Copenhagen_2014_01.jpg","credit":"Foto: Wikimedia Commons","alt":"Christiansborg, hvor Folketinget og Højesteret holder til","sourceUrl":"https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk"},"topics":["politik","integration","retspolitik","Danmark"],"entities":["Højesteret","Morten Messerschmidt","Dansk Folkeparti","Morten Bødskov"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":62,"decisionValue":52,"novelty":66,"sourceQuality":72,"personalRelevance":55,"contrast":64},"claims":[{"text":"Højesteret fastslog, at religiøst begrundet afvisning af håndtryk ikke kan begrunde en fyring.","sourceUrls":["https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk"],"confidence":"high"},{"text":"Messerschmidt og blå blok kræver lovændring med håndtrykskrav; regeringen ved Bødskov afventer juridisk vurdering.","sourceUrls":["https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk"],"confidence":"high"}],"sources":[{"title":"Højesteretsdom udløser værdikamp i Folketinget: Blå partier vil stille krav om håndtryk med lovændring","publisher":"Altinget","url":"https://www.altinget.dk/artikel/hoejesteretsdom-udloeser-vaerdikamp-i-folketinget-blaa-partier-vil-stille-krav-om-haandtryk","publishedAt":"2026-06-28T00:00:00Z","kind":"reporting"}]},{"id":"story-nasa-swift-boost-20260629","eventKey":"nasa-swift-boost-robotic-rescue-2026","materialFacts":["NASA gør klar til at sende en robotservicer for at redde det 22 år gamle Swift-observatorium fra at falde ned","Servicerobotten LINK fra Katalyst Space skal gribe og hæve Swift over flere måneder","Det bliver første gang, en ikke-servicerbar amerikansk statssatellit reddes på den måde; opsendelse tidligst 30. juni"],"section":"Videnskab","headline":"Partners, NASA Ready for June Launch of Swift Boost Mission","primarySourceUrl":"https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/","subheadline":"For første gang vil en robot gribe og redde en aldrende NASA-satellit, der aldrig var bygget til at blive serviceret","body":["NASA er klar til at forsøge noget hidtil ugjort: at sende en robot op for at gribe og redde det 22 år gamle rumteleskop Neil Gehrels Swift Observatory, før det falder ned. Øget solaktivitet har bremset satellitten, og uden indgreb ville den styrte i 2026. Opsendelsen sker tidligst 30. juni fra Kwajalein-atollen.","Servicerobotten LINK fra Katalyst Space vejer omkring 400 kilo og skal med tre robotarme og ionmotorer gribe Swift og over måneder løfte den i en højere bane. Satellitten fra 2004 var aldrig bygget til servicering."],"whyItMatters":"Lykkes det, sætter missionen præcedens for at forlænge levetiden på satellitter, der aldrig var tænkt til reparation – med betydning for rumaffald og en ny servicebranche i kredsløb.","analysis":"Swift Boost tester kommerciel robotservicering på værdifulde aktiver i kredsløb. En succes ville gøre on-orbit-servicering til en forretning, ikke bare en demonstration.","image":{"url":"https://assets.science.nasa.gov/dynamicimage/assets/science/missions/swift-observatory/news/2026/launch-preview/NE201566_2611x1654.jpg","credit":"Kilde: NASA","alt":"Illustration af robotservicer, der nærmer sig Swift-satellitten","sourceUrl":"https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/"},"topics":["videnskab","rumfart","satellit-servicering"],"entities":["NASA","Katalyst Space","Neil Gehrels Swift Observatory"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":58,"decisionValue":44,"novelty":76,"sourceQuality":84,"personalRelevance":55,"contrast":72},"claims":[{"text":"NASA vil sende robotserviceren LINK (Katalyst Space) for at gribe og hæve det aldrende Swift-observatorium; opsendelse tidligst 30. juni.","sourceUrls":["https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/"],"confidence":"high"},{"text":"Det bliver første redning af en amerikansk statssatellit, der ikke var bygget til at blive serviceret.","sourceUrls":["https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/"],"confidence":"high"}],"sources":[{"title":"Partners, NASA Ready for June Launch of Swift Boost Mission","publisher":"NASA","url":"https://science.nasa.gov/missions/swift/swift-boost-mission/partners-nasa-ready-for-june-launch-of-swift-boost-mission/","publishedAt":"2026-06-26T16:00:00Z","kind":"primary"}]},{"id":"story-se3-spatial-ai-20260629","eventKey":"se3-spatial-ai-defence-bundeswehr-2026","materialFacts":["Den tyske TU München-spinout SE3 lancerer en spatial-AI-platform til autonome droner og robotter i GPS-nægtede miljøer","Selskabet er allerede under kontrakt med den tyske Bundeswehr og har vundet flere forsvarskontrakter","Investorerne omfatter Lakestar, Seedcamp, EWOR og Sequoia Scout Fund; finansieringsbeløbet er ikke oplyst"],"section":"Forsvar","headline":"Backed by Lakestar, Seedcamp and EWOR, SE3 unveils spatial AI platform for autonomous systems","primarySourceUrl":"https://tech.eu/2026
