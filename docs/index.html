<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;

/monumental-secures-32m-series-b-to-accelerate-construction-automation/","publishedAt":"2026-07-15T08:00:00.000Z","kind":"reporting"}],"image":{"url":"https://cdn.tech.eu/uploads/2026/07/monumental-featured-632.png","credit":"Foto: Tech.eu/Monumental","alt":"Monumentals autonome murerrobot på en byggeplads","sourceUrl":"https://tech.eu/2026/07/15/monumental-secures-32m-series-b-to-accelerate-construction-automation/"}},{"id":"story-skat-whistleblower-20260717","eventKey":"skat-globaleaks-whistleblower-datamanipulation-2026-07","materialFacts":["I Skats GlobaLeaks-whistleblowerportal stod ni HR-medarbejdere fra skattemyndighedernes administrations- og serviceenhed (ADST) oprindeligt som modtagere af en fortrolig 300-siders whistleblowersag","En HR-medarbejder forsvandt fra modtagerlisten, uden at systemets aktivitetslog blev opdateret","Whistlebloweren, en tidligere Skat-medarbejder, vurderer, at der er foregået datamanipulation"],"section":"Cybersikkerhed","headline":"»Inhabil« medarbejder forsvandt sporløst fra whistleblowerportal: »Med min erfaring er der foregået datamanipulation«","primarySourceUrl":"https://www.version2.dk/artikel/inhabil-medarbejder-forsvandt-sporloest-fra-whistleblowerportal-med-min-erfaring-er-der-foregaaet","subheadline":"En medarbejder forsvandt fra modtagerlisten i skattemyndighedernes fortrolige portal – uden spor i loggen.","body":["I Skats GlobaLeaks-whistleblowerportal stod ni HR-medarbejdere fra skattemyndighedernes serviceenhed ADST oprindeligt som modtagere af en fortrolig whistleblowersag på 300 sider. Efterfølgende forsvandt en af dem fra modtagerlisten – uden at systemets aktivitetslog registrerede ændringen.","Whistlebloweren, der selv har it-erfaring, vurderer, at der er foregået datamanipulation. Sagen rejser spørgsmål om, hvem der kunne ændre en fortrolig sags modtagerkreds uden at efterlade spor."],"whyItMatters":"Whistleblowerportaler skal garantere sporbarhed og fortrolighed, når borgere anmelder magtmisbrug. Kan en modtagerliste ændres uden aftryk i loggen, undermineres troværdigheden i en stor statslig myndighed.","analysis":"Sagen handler mindre om den enkelte medarbejder end om integriteten af offentlig it: en log, der kan omgås, er ikke en log. Uden en uafhængig revision står påstand mod påstand.","topics":["cybersikkerhed","whistleblower","offentlig it","dataintegritet"],"entities":["Skattestyrelsen","ADST","GlobaLeaks","Danmark"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":74,"decisionValue":70,"novelty":82,"sourceQuality":80,"personalRelevance":70,"contrast":72},"claims":[{"text":"I Skats GlobaLeaks-whistleblowerportal forsvandt en HR-medarbejder fra modtagerlisten på en fortrolig 300-siders sag, uden at systemloggen blev opdateret; whistlebloweren vurderer, at der er sket datamanipulation.","sourceUrls":["https://www.version2.dk/artikel/inhabil-medarbejder-forsvandt-sporloest-fra-whistleblowerportal-med-min-erfaring-er-der-foregaaet"],"confidence":"medium"}],"sources":[{"title":"»Inhabil« medarbejder forsvandt sporløst fra whistleblowerportal: »Med min erfaring er der foregået datamanipulation«","publisher":"Version2","url":"https://www.version2.dk/artikel/inhabil-medarbejder-forsvandt-sporloest-fra-whistleblowerportal-med-min-erfaring-er-der-foregaaet","publishedAt":"2026-07-14T11:01:00.000Z","kind":"reporting"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Flag_of_the_Faroe_Island_at_the_Danish_Tax_Agency_01.jpg/1280px-Flag_of_the_Faroe_Island_at_the_Danish_Tax_Agency_01.jpg","credit":"Foto: Wikimedia Commons","alt":"Skattestyrelsen – whistleblowersag i skattemyndighedernes portal","sourceUrl":"https://www.version2.dk/artikel/inhabil-medarbejder-forsvandt-sporloest-fra-whistleblowerportal-med-min-erfaring-er-der-foregaaet"}},{"id":"story-tariff-refunds-20260717","eventKey":"usa-tariff-refunds-dk-exporters-2026-07","materialFacts":["USA har indtil videre tilbagebetalt ca. 81 mia. dollar (530 mia. kr.) i told, efter at den amerikanske højesteret i februar 2026 underkendte store dele af Trumps toldsatser","Den danske virksomhed Grafisk Maskinfabrik i Birkerød har indtil videre fået refunderet 830.000 kr.","Virksomhedens direktør kalder tilbagebetalingen en meget langsom proces, hvor den amerikanske administration gør modstand"],"section":"Erhverv","headline":"USA har betalt over 500 milliarder kroner tilbage i told","primarySourceUrl":"https://www.dr.dk/nyheder/penge/usa-har-betalt-over-500-milliarder-kroner-tilbage-i-told","subheadline":"Danske eksportører får penge tilbage, efter at en højesteretsdom underkendte Trumps told – men processen er sej.","body":["USA har indtil videre tilbagebetalt omkring 81 mia. dollar – 530 mia. kr. – i told, efter at den amerikanske højesteret i februar 2026 underkendte store dele af præsident Trumps ekstra toldsatser. Pengene går til virksomheder, der blev ramt af de nu ugyldige afgifter.","Blandt dem er danske Grafisk Maskinfabrik i Birkerød, der indtil videre har fået 830.000 kr. refunderet. Direktøren kalder tilbagebetalingen en meget langsom proces, hvor den amerikanske administration gør modstand."],"whyItMatters":"For danske eksportører er det konkrete penge tilbage og et sjældent eksempel på, at en retsafgørelse ruller en handelspolitik tilbage – relevant for prissætningen af told-risiko.","analysis":"Selv en underkendt toldpolitik efterlader et efterslæb: pengene er skyldige, men udbetalingen trækkes i langdrag. Det er en likviditetsomkostning, der består længe efter, at afgiften er kendt ulovlig.","topics":["handel","told","eksport","USA","erhverv"],"entities":["USA","Danmark","Grafisk Maskinfabrik","Højesteret"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":82,"novelty":74,"sourceQuality":82,"personalRelevance":80,"contrast":60},"claims":[{"text":"USA har tilbagebetalt ca. 81 mia. dollar (530 mia. kr.) i told efter en højesteretsdom i februar 2026; den danske virksomhed Grafisk Maskinfabrik i Birkerød har fået 830.000 kr. refunderet og kalder processen meget langsom.","sourceUrls":["https://www.dr.dk/nyheder/penge/usa-har-betalt-over-500-milliarder-kroner-tilbage-i-told"],"confidence":"high"}],"sources":[{"title":"USA har betalt over 500 milliarder kroner tilbage i told","publisher":"DR","url":"https://www.dr.dk/nyheder/penge/usa-har-betalt-over-500-milliarder-kroner-tilbage-i-told","publishedAt":"2026-07-15T03:14:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/qrbcyuqm/20260402-152723-2_crop001.jpg?im=AspectCrop%3D%28720%2C405%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%28720%2C405%29","credit":"Kilde: DR","alt":"Containere og handel – USA tilbagebetaler told efter højesteretsdom","sourceUrl":"https://www.dr.dk/nyheder/penge/usa-har-betalt-over-500-milliarder-kroner-tilbage-i-told"}},{"id":"story-fedorov-20260717","eventKey":"zelensky-fires-fedorov-2026-07","materialFacts":["Præsident Volodymyr Zelenskyj afskedigede forsvarsminister Mykhailo Fedorov efter en konflikt med den øverstbefalende Oleksandr Syrskyj","Fedorov var en drivkraft bag Ukraines dronekrig og »logistics lockdown«-kampagnen mod russiske styrker","Indenrigsminister Ihor Klymenko ventes at overtage posten; tusindvis demonstrerede i Kyiv og andre byer mod afskedigelsen"],"section":"Udland","headline":"Zelensky dismisses Defense Minister Fedorov, deepening turmoil in Ukraine's military leadership","primarySourceUrl":"https://kyivindependent.com/defense-minister-fedorov-set-to-leave-post-senior-official-confirms/","subheadline":"Ukraines dronefokuserede forsvarsminister fjernes midt i krigen – og folk går på gaden i protest.","body":["Ukraines præsident Volodymyr Zelenskyj har afskediget forsvarsminister Mykhailo Fedorov efter en konflikt med den øverstbefalende, general Oleksandr Syrskyj. Fedorov var en drivkraft bag Ukraines dronekrig og »logistics lockdown«-kampagnen mod russiske forsyningslinjer.","Indenrigsminister Ihor Klymenko, en tidligere politigeneral, ventes at overtage posten. Afskedigelsen udløste protester, hvor tusindvis samledes i Kyiv og andre byer."],"whyItMatters":"Fedorov var ansigtet på den teknologidrevne del af Ukraines forsvar, som Danmark og europæiske partnere har investeret i. At fjerne ham midt i krigen – mod åben protest – signalerer reel spænding i ledelsen.","analysis":"Striden mellem en innovationsminister og en klassisk øverstbefalende handler om, hvem der styrer den moderne krig. En politigeneral kan give mere central kontrol, men risikerer at bremse den decentrale droneudvikling.","topics":["politik","Ukraine","forsvar","droner"],"entities":["Volodymyr Zelenskyj","Mykhailo Fedorov","Oleksandr Syrskyj","Ukraine"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":66,"novelty":80,"sourceQuality":80,"personalRelevance":70,"contrast":72},"claims":[{"text":"Zelenskyj afskedigede forsvarsminister Mykhailo Fedorov efter en konflikt med den øverstbefalende Syrskyj; Ihor Klymenko ventes at overtage, og tusindvis demonstrerede.","sourceUrls":["https://kyivindependent.com/defense-minister-fedorov-set-to-leave-post-senior-official-confirms/"],"confidence":"high"}],"sources":[{"title":"Zelensky dismisses Defense Minister Fedorov, deepening turmoil in Ukraine's military leadership","publisher":"The Kyiv Independent","url":"https://kyivindependent.com/defense-minister-fedorov-set-to-leave-post-senior-official-confirms/","publishedAt":"2026-07-15T18:15:00.000Z","kind":"reporting"}],"image":{"url":"https://assets.kyivindependent.com/content/images/2026/01/GettyImages-2256401930-1.jpg","credit":"Foto: The Kyiv Independent","alt":"Mykhailo Fedorov – afskediget som Ukraines forsvarsminister","sourceUrl":"https://kyivindependent.com/defense-minister-fedorov-set-to-leave-post-senior-official-confirms/"}},{"id":"story-beta-pictoris-20260717","eventKey":"jwst-beta-pictoris-d-exoplanet-2026-07","materialFacts":["James Webb-teleskopet har direkte afbildet en ny planet, Beta Pictoris d, med mindst to gange Jupiters masse i en bane ca. 30 AU fra stjernen 63 lysår væk","Det er den svageste exoplanet, der nogensinde er direkte afbildet, og den første fundet primært via moderat-opløst spektroskopi (en CO-signatur) med NIRSpec","Studiet med hovedforfatter Aidan Gibbs fra UC San Diego er offentliggjort i Astrophysical Journal Letters"],"section":"Videnskab","headline":"NASA's Webb Discovers Hidden Planet in Famous Star System","primarySourceUrl":"https://science.nasa.gov/missions/webb/nasas-webb-discovers-hidden-planet-in-famous-star-system/","subheadline":"En ny detektionsmetode afslører den svageste direkte afbildede exoplanet nogensinde.","body":["James Webb-teleskopet har direkte afbildet en ny planet, Beta Pictoris d, i stjernesystemet 63 lysår fra Jorden. Planeten har mindst to gange Jupiters masse og kredser ca. 30 astronomiske enheder fra sin stjerne – den mindste af systemets tre kendte planeter.","Det bemærkelsesværdige er metoden: den er den svageste direkte afbildede exoplanet nogensinde og den første fundet primært via moderat-opløst spektroskopi – ved en kulilte-signatur målt med NIRSpec. Studiet ledes af Aidan Gibbs (UC San Diego) i Astrophysical Journal Letters."],"whyItMatters":"Metoden – at finde en planet på dens kemiske fingeraftryk frem for lyset alene – kan udvide, hvor svage verdener astronomer kan opdage i støjfyldte systemer.","analysis":"Direkte billeddannelse har hidtil favoriseret store, lyse planeter. At Webb kan trække en svag planet frem via spektroskopi, flytter grænsen for det opdagelige.","topics":["videnskab","rumfart","exoplaneter","astronomi"],"entities":["NASA","James Webb-teleskopet","Beta Pictoris","Aidan Gibbs"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":70,"decisionValue":52,"novelty":86,"sourceQuality":88,"personalRelevance":56,"contrast":82},"claims":[{"text":"JWST har direkte afbildet Beta Pictoris d (mindst 2x Jupiters masse, ~30 AU, 63 lysår), den svageste direkte afbildede exoplanet, fundet primært via moderat-opløst spektroskopi (CO) med NIRSpec; publiceret i Astrophysical Journal Letters.","sourceUrls":["https://science.nasa.gov/missions/webb/nasas-webb-discovers-hidden-planet-in-famous-star-system/"],"confidence":"high"}],"sources":[{"title":"NASA's Webb Discovers Hidden Planet in Famous Star System","publisher":"NASA","url":"https://science.nasa.gov/missions/webb/nasas-webb-discovers-hidden-planet-in-famous-star-system/","publishedAt":"2026-07-15T12:00:00.000Z","kind":"primary"}],"image":{"url":"https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2026/07/STScI-01KX448CEBRHBBJW579AG64G0H.jpg?w=1280&h=720&fit=clip","credit":"Foto: NASA, ESA, CSA, STScI","alt":"Beta Pictoris-systemet afbildet af James Webb-teleskopet","sourceUrl":"https://science.nasa.gov/missions/webb/nasas-webb-discovers-hidden-planet-in-famous-star-system/"}}],"signals":[{"headline":"Kontroversiel klimaforsker Henrik Svensmark fyret fra DTU","url":"https://ing.dk/artikel/kontroversiel-klimaforsker-henrik-svensmark-fyret-fra-dtu","publisher":"Ingeniøren","section":"Videnskab","publishedAt":"2026-07-16T08:03:00.000Z","summary":"Danmark. Klima- og rumforskeren Henrik Svensmark (68) er afskediget fra DTU. Han kalder det et »dødsstød« til sin omstridte teori om kosmisk stråling som klimadriver, der bredt anses som ude af trit med mainstream-klimaforskning.","text":"Kontroversiel klimaforsker Henrik Svensmark fyret fra DTU"},{"headline":"US says new strikes on Iran aimed at protecting vessels in Strait of Hormuz","url":"https://www.cnn.com/2026/07/15/world/live-news/iran-war-trump","publisher":"CNN","section":"Udland","publishedAt":"2026-07-16T22:00:00.000Z","summary":"USA/Iran. USA og Iran udvekslede ild på sjette dag i træk; CENTCOM meldte en ny stor angrebsbølge, og USA ramte en tanker, der forsøgte at omgå blokaden. Juni-våbenhvilen (MoU) er reelt kollapset omkring verdens vigtigste olietransitrute.","text":"US says new strikes on Iran aimed at protec
