<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-horizon {
  margin: 0 0 12px;
  color: var(--teal);
  font-family: var(--sans);
  font-size: 0.66rem;
  font-weight: 750;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

/* The last reading of the same quantity, when there was one. This line is the
   difference between a figure and a measurement, so it sits directly under the
   number rather than down with the source. */
.key-number-previous {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.74rem;
  font-variant-numeric: tabular-nums;
}

.key-number-change {
  color: var(--teal);
  font-weight: 750;
  letter-spacing: 0.02em;
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

/* The shortlist: many links, one line each. Deliberately typographic and dense
   next to the featured card above it, so the difference in depth is visible
   before a word is read. */
.recommendation-shortlist {
  margin: 4px 0 0;
  border-top: 1px solid var(--rule);
}

.recommendation-short {
  padding: 13px 0 12px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-head {
  margin: 0;
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.4;
}

.recommendation-short-link {
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.recommendation-short-link:hover,
.recommendation-short-link:focus-visible {
  color: var(--red);
  border-bottom-color: currentColor;
}

.recommendation-short-meta {
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.73rem;
  letter-spacing: 0.01em;
}

.recommendation-short-note {
  margin: 3px 0 0;
  max-width: 68ch;
  color: var(--body-soft, var(--muted));
  font-family: var(--serif);
  font-size: 0.9rem;
  line-height: 1.5;
}

.recommendation-short .feedback-panel {
  margin-top: 8px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */

a 70 procent og skal dække forbruget hos mindst 1,8 millioner husstande."],"whyItMatters":"Det lovfæstede støtteloft er 55,2 milliarder kroner inklusive moms. Med de vindende bud vurderer eksperter i Ingeniøren, at den faktiske udbetaling kan ende tæt på nul.","analysis":"Det afgørende er ikke prisen, men hvem der satte den. Udbuddet i 2024 fik nul bud på seks parker. To år senere byder et svensk statsejet selskab under de danske. Danmark får kapaciteten, og en fremmed stat får ejerskabet af den.","counterpoint":"Nordsøen Midt fik kun to bud. En pris fastsat af to bydende er ikke uden videre en markedspris, og den tredje park, Nordsøen Syd, har først budfrist i oktober 2028.","image":{"url":"https://ing.dk/sites/mi/files/styles/automatic_crop_16_9/public/2026-08/1d778042-9cb3-4dd9-b862-08dddfd3f2fb.png","credit":"Kilde: Ingeniøren","alt":"Havvindmøller i dansk farvand. Arkivfoto brugt af Ingeniøren til artiklen om udbuddet af Nordsøen Midt og Hesselø.","sourceUrl":"https://ing.dk/artikel/eksperter-jubler-over-ny-havvind-staten-slipper-billigere-end-frygtet"},"topics":["energi","havvind","udbud","danmark","infrastruktur"],"entities":["Energistyrelsen","Vattenfall","Ørsted","Copenhagen Infrastructure Partners","Nordsøen Midt","Hesselø"],"isLead":true,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":84,"novelty":82,"sourceQuality":90,"personalRelevance":78,"contrast":72},"claims":[{"text":"Energistyrelsen tildelte 4. august 2026 både Nordsøen Midt og Hesselø til Vattenfall Vindkraft A/S, med vindende bud på henholdsvis 504 og 542 kr./MWh garanteret i 20 år.","sourceUrls":["https://ens.dk/presse/danmark-faar-nye-havvindmoelleparker","https://ing.dk/artikel/eksperter-jubler-over-ny-havvind-staten-slipper-billigere-end-frygtet"],"confidence":"high"},{"text":"Det lovfæstede støtteloft for udbuddet er 55,2 milliarder kroner inklusive moms, og eksperter citeret af Ingeniøren vurderer, at den faktiske statslige udbetaling kan blive tæt på nul.","sourceUrls":["https://ing.dk/artikel/eksperter-jubler-over-ny-havvind-staten-slipper-billigere-end-frygtet"],"confidence":"medium"}],"sources":[{"title":"Eksperter jubler over ny havvind: Staten slipper billigere end frygtet","publisher":"Ingeniøren","url":"https://ing.dk/artikel/eksperter-jubler-over-ny-havvind-staten-slipper-billigere-end-frygtet","publishedAt":"2026-08-04T10:42:00.000Z","kind":"reporting"},{"title":"Danmark får to nye havvindmølleparker","publisher":"Energistyrelsen","url":"https://ens.dk/presse/danmark-faar-nye-havvindmoelleparker","publishedAt":"2026-08-04T07:16:42.000Z","kind":"primary"}]},{"id":"story-hormuz-genaabning-20260805","eventKey":"hormuz-reopening-talks-2026-08","materialFacts":["Marco Rubio sagde 4. august 2026, at der er gjort fremskridt i forhandlingerne om Hormuzstrædet, men at der ikke findes en endelig aftale.","Irans udenrigsministerium kalder samtalerne med Oman om en midlertidig sikker skibskorridor positive; åbne punkter er driftsmekanisme, afgifter og sikkerhedsprotokoller.","Brent for oktober-levering lukkede 4. august i 79,36 dollar per tønde, ned 5,3 procent og laveste lukning i tre uger.","Cirka 130 skibe passerede strædet dagligt før krigen; søndag 2. august passerede ni."],"section":"Udland","headline":"US says deal on reopening Hormuz close as Iran, Oman hold ‘positive’ talks","primarySourceUrl":"https://www.aljazeera.com/news/2026/8/4/us-says-deal-on-reopening-hormuz-close-as-iran-oman-hold-positive-talks","subheadline":"USA siger, at en genåbning af Hormuzstrædet er tæt på. Olieprisen er allerede faldet, som om den var underskrevet.","body":["USA's udenrigsminister Marco Rubio sagde 4. august, at forhandlingerne om at genåbne Hormuzstrædet er rykket, men at der ikke findes en endelig aftale. Finansminister Scott Bessent sagde, at en aftale kunne lande samme dag eller dagen efter. Iran kalder sine samtaler med Oman om en midlertidig sikker skibskorridor positive.","Markedet har taget forskud. Brent for oktober-levering lukkede 4. august i 79,36 dollar per tønde, ned 5,3 procent og laveste lukning i tre uger. Før krigen passerede omkring 130 skibe strædet dagligt. Søndag den 2. august passerede ni."],"whyItMatters":"Prisen er faldet på en aftale, der endnu ikke findes. Driftsmekanisme, afgifter og sikkerhedsprotokoller er stadig åbne punkter.","analysis":"Mønsteret har holdt hele sommeren: markedet handler på diplomatiske signaler frem for på faktiske transitter. Ni skibe om dagen er ikke en genåbning, og afstanden fra fremskridt til underskrift er risikoen.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/f/f5/Strait_of_Hormuz_%28MODIS_2020-12-04%29.jpg","credit":"Foto: NASA/MODIS via Wikimedia Commons","alt":"Satellitbillede af Hormuzstrædet mellem Iran og Oman, det stræde forhandlingerne handler om.","sourceUrl":"https://commons.wikimedia.org/wiki/File:Strait_of_Hormuz_(MODIS_2020-12-04).jpg"},"topics":["geopolitik","energi","iran","markeder","diplomati"],"entities":["Marco Rubio","Scott Bessent","Iran","Oman","Hormuzstrædet","Brent"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":92,"decisionValue":80,"novelty":68,"sourceQuality":82,"personalRelevance":46,"contrast":60},"claims":[{"text":"Marco Rubio oplyste 4. august 2026, at der er gjort fremskridt i Hormuz-forhandlingerne, men at ingen endelig aftale findes, og Scott Bessent sagde, at en aftale kunne komme samme dag eller dagen efter.","sourceUrls":["https://www.aljazeera.com/news/2026/8/4/us-says-deal-on-reopening-hormuz-close-as-iran-oman-hold-positive-talks"],"confidence":"high"},{"text":"Brent for oktober-levering lukkede 4. august 2026 i 79,36 dollar per tønde, et fald på 5,3 procent og den laveste lukning i tre uger.","sourceUrls":["https://www.rigzone.com/news/wire/brent_settles_at_threeweek_low-04-aug-2026-184295-article/"],"confidence":"high"}],"sources":[{"title":"US says deal on reopening Hormuz close as Iran, Oman hold ‘positive’ talks","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/4/us-says-deal-on-reopening-hormuz-close-as-iran-oman-hold-positive-talks","publishedAt":"2026-08-04T00:00:00.000Z","kind":"reporting"},{"title":"Brent Settles At Three-Week Low","publisher":"Rigzone","url":"https://www.rigzone.com/news/wire/brent_settles_at_threeweek_low-04-aug-2026-184295-article/","publishedAt":"2026-08-04T00:00:00.000Z","kind":"reporting"}]},{"id":"story-anthropic-volta-norge-20260805","eventKey":"anthropic-volta-norway-compute-2026-08","materialFacts":["Anthropic (USA) har indgået en seksårig aftale til 10 milliarder dollar om cloud-compute med Volta, en AI-cloud-startup grundlagt i 2026.","Kapaciteten ligger i et datacenter på 133 MW i Norge, bygget sammen med kryptominefirmaet Bitdeer og med Nvidia Vera Rubin-systemer.","Volta er del af Nvidias Cloud Partner-program, og aftalen kommer oven på Anthropics nylige compute-aftaler med SpaceX og Amazon."],"section":"Teknologi","headline":"Anthropic signs $10B deal with AI cloud startup Volta","primarySourceUrl":"https://techcrunch.com/2026/08/04/anthropic-signs-10-billion-deal-with-ai-cloud-startup-volta/","subheadline":"Et amerikansk frontier-laboratorium binder ti milliarder dollar til norsk strøm i seks år. Køberen er et selskab, der ikke fandtes sidste år.","body":["Anthropic har indgået en seksårig aftale til 10 milliarder dollar med Volta om cloud-compute. Kapaciteten ligger i et datacenter på 133 MW i Norge, bygget sammen med kryptominefirmaet Bitdeer og kørende på Nvidias Vera Rubin-systemer. Volta blev grundlagt tidligere i 2026 og er del af Nvidias Cloud Partner-program.","Aftalen lægger sig oven på Anthropics compute-aftaler med SpaceX og Amazon. Ingen af de tre leverandører er en klassisk hyperscaler."],"whyItMatters":"Norsk vandkraft er nu kontraktbundet til amerikansk modeltræning i seks år. Det er nordisk energi solgt som compute, ikke som strøm.","analysis":"Det interessante er køberens valg af sælger. Et laboratorium med adgang til alle tre hyperscalere binder i stedet et årti af kapacitet til et selskab uden historik og et kryptominefirma. Flaskehalsen er ikke længere cloud-kompetence, men strøm og tilladelser, og der taber de etablerede.","image":{"url":"https://techcrunch.com/wp-content/uploads/2026/06/Claude-photo.jpg","credit":"Kilde: TechCrunch","alt":"Anthropics Claude-logo. Arkivbillede brugt af TechCrunch til artiklen om aftalen med Volta.","sourceUrl":"https://techcrunch.com/2026/08/04/anthropic-signs-10-billion-deal-with-ai-cloud-startup-volta/"},"topics":["ai","datacentre","compute","kapital","norden"],"entities":["Anthropic","Volta","Bitdeer","Nvidia","Norge"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":82,"decisionValue":86,"novelty":88,"sourceQuality":76,"personalRelevance":94,"contrast":72},"claims":[{"text":"Anthropic har indgået en seksårig aftale til 10 milliarder dollar med AI-cloud-startuppen Volta om kapacitet i et datacenter på 133 MW i Norge, bygget med Bitdeer og baseret på Nvidia Vera Rubin-systemer.","sourceUrls":["https://techcrunch.com/2026/08/04/anthropic-signs-10-billion-deal-with-ai-cloud-startup-volta/"],"confidence":"high"}],"sources":[{"title":"Anthropic signs $10B deal with AI cloud startup Volta","publisher":"TechCrunch","url":"https://techcrunch.com/2026/08/04/anthropic-signs-10-billion-deal-with-ai-cloud-startup-volta/","publishedAt":"2026-08-04T19:48:00.000Z","kind":"reporting"}]},{"id":"story-texas-datacenter-stop-20260805","eventKey":"texas-datacenter-audit-halt-2026-08","materialFacts":["Guvernør Greg Abbott har bestemt, at alle nye datacenterprojekter i Texas skal revideres af Public Utility Commission of Texas og netoperatøren ERCOT, før de kan gå videre.","ERCOT's tilslutningskø voksede fra 233 GW i januar 2026 til 474 GW i august 2026 — mere end fem gange delstatens samlede spidsbelastning. Omkring 90 procent af køen er datacentre.","Beslutningen kom efter en frivillig rundspørge, som de fleste operatører ikke svarede på. Netstabilitet, elpriser, vandforbrug samt støj- og lysforurening er de angivne grunde."],"section":"Teknologi","headline":"Texas halts new data centers as governor calls for audits","primarySourceUrl":"https://techcrunch.com/2026/08/04/texas-halts-new-data-centers-as-governor-calls-for-audits/","subheadline":"Den mest tilladelsesvillige delstat i USA sætter nu alle nye datacentre på pause. Køen til nettet er fem gange delstatens eget spidsforbrug.","body":["Guvernør Greg Abbott har bestemt, at alle nye datacenterprojekter i Texas skal revideres af delstatens Public Utility Commission og netoperatøren ERCOT, før de kan gå videre. Beslutningen fulgte en frivillig rundspørge, som de fleste operatører ikke besvarede.","Tallet bag beslutningen er køen. ERCOT's tilslutningskø voksede fra 233 GW i januar 2026 til 474 GW i august — mere end fem gange delstatens spidsbelastning. Omkring 90 procent af projekterne er datacentre. Netstabilitet, elpriser, vandforbrug samt støj og lys er de angivne grunde."],"whyItMatters":"Texas har været den mest tilladelsesvillige store jurisdiktion i USA for AI-udbygning. Det er den første hårde bremse dér.","analysis":"Læst sammen med Anthropics norske aftale peger dagens to nyheder samme vej: kapaciteten flytter derhen, hvor strøm og tilladelser er lettest. Texas var det sted. Nu er køen blevet et politisk problem frem for et salgsargument.","image":{"url":"https://techcrunch.com/wp-content/uploads/2025/05/GettyImages-2205417979.jpg?w=1024","credit":"Kilde: TechCrunch","alt":"Datacenteranlæg. Arkivfoto brugt af TechCrunch til artiklen om Texas' stop for nye datacentre.","sourceUrl":"https://techcrunch.com/2026/08/04/texas-halts-new-data-centers-as-governor-calls-for-audits/"},"topics":["ai","datacentre","energi","regulering","usa"],"entities":["Greg Abbott","ERCOT","Public Utility Commission of Texas","Texas"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":82,"novelty":86,"sourceQuality":74,"personalRelevance":88,"contrast":88},"claims":[{"text":"Greg Abbott har pålagt Public Utility Commission of Texas og ERCOT at revidere alle nye datacenterprojekter, før de kan gå videre.","sourceUrls":["https://techcrunch.com/2026/08/04/texas-halts-new-data-centers-as-governor-calls-for-audits/"],"confidence":"high"},{"text":"ERCOT's tilslutningskø voksede fra 233 GW i januar 2026 til 474 GW i august 2026, og omkring 90 procent af de køende projekter er datacentre.","sourceUrls":["https://techcrunch.com/2026/08/04/texas-halts-new-data-centers-as-governor-calls-for-audits/"],"confidence":"medium"}],"sources":[{"title":"Texas halts new data centers as governor calls for audits","publisher":"TechCrunch","url":"https://techcrunch.com/2026/08/04/texas-halts-new-data-centers-as-governor-calls-for-audits/","publishedAt":"2026-08-04T15:42:00.000Z","kind":"reporting"}]},{"id":"story-npm-orm-claudecode-20260805","eventKey":"npm-keyv-shaihulud-worm-2026-08","materialFacts":["En selvspredende orm fra Shai-Hulud-familien kompromitterede npm-registret fra 4. august 2026 via GitHub-kontoen bag biblioteket keyv, der har omkring 127 millioner ugentlige downloads.","SafeDep har verificeret 353 forgiftede versioner fordelt på 79 pakker; bredere optællinger når 868 pakker og 1.381 versioner.","Nyt i denne variant: det kompromitterede repository indeholdt en .claude/settings.json og en .vscode/tasks.json, som skaber sekundære eksekveringsveje, når en udvikler åbner projektet i Claude Code eller VS Code.","En preinstall-hook henter legitimationsoplysninger fra npm, GitHub, AWS, GCP, Azure, Stripe, Kubernetes og Vault og genudgiver bagdørte versioner med stjålne publiceringstokens."],"section":"Cybersikkerhed","headline":"Keyv-Linked npm Worm Poisons Hundreds of Packages, Plants Claude Code and VS Code Hooks","primarySourceUrl":"https://thehackernews.com/2026/08/keyv-linked-npm-worm-poisons-hundreds.html","subheadline":"Ormen stjæler nøgler som før. Det nye er, at den lægger konfigurationsfiler, som udløses, når udvikleren åbner projektet i sin AI-editor.","body":["En selvspredende orm fra Shai-Hulud-familien ramte npm-registret fra 4. august via GitHub-kontoen bag keyv, et bibliotek med omkring 127 millioner ugentlige downloads. SafeDep har verificeret 353 forgiftede versioner på tværs af 79 pakker.","Kernen er kendt: en preinstall-hook henter legitimationsoplysninger fra npm, GitHub, AWS, Azure, Stripe og Vault og genudgiver bagdørte versioner med stjålne tokens. Det nye er de to konfigurationsfiler, .claude/settings.json og .vscode/tasks.json."],"whyItMatters":"De to filer udløses, når en udvikler blot åbner projektet i Claude Code eller VS Code. Begge værktøjers workspace trust-kontroller skal forhindre netop det.","analysis":"Forsyningskædeangreb har hidtil ramt byggeprocessen. Her flytter angrebsfladen ind i editoren, fordi AI-værktøjer læser projektets egne konfigurationsfiler som instruktioner. Den, der åbner et fremmed repository i en agent, er selv et led i kæden.","image":{"url":"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjAb0f5sNdFs0uLbgh9_rBZ-SaCrUjv3c4mL7OLF7pFPxH5pusnFJyInc_7S-QqgMa0DsEm2fId6v2sWX7hJcaA0eHTHngKBXGOA3ysg7NYz1CyMAgwsrWnJ3FA1HGFkzglgj5pGsXeLWzXjCUhNGi5ecEsqIu2oOzz_koXsQAAC0EV5HkuAJGtAVvWotE/s1700-e365/npmnpm.jpg","credit":"Kilde: The Hacker News","alt":"Illustration af npm-logoet, brugt af The Hacker News til artiklen om keyv-ormen.","sourceUrl":"https://thehackernews.com/2026/08/keyv-linked-npm-worm-poisons-hundreds.html"},"topics":["cybersikkerhed","ai","forsyningskæde","open source"],"entities":["npm","keyv","Shai-Hulud","SafeDep","Claude Code","VS Code","GitHub"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":80,"decisionValue":92,"novelty":88,"sourceQuality":78,"personalRelevance":90,"contrast":74},"claims":[{"text":"SafeDep har verificeret 353 forgiftede versioner på tværs af 79 npm-pakker efter kompromitteringen af GitHub-kontoen bag keyv.","sourceUrls":["https://safedep.io/keyv-npm-supply-chain-compromise/","https://thehackernews.com/2026/08/keyv-linked-npm-worm-poisons-hundreds.html"],"confidence":"high"},{"text":"Det kompromitterede repository indeholdt en .claude/settings.json og en .vscode/tasks.json, som skaber sekundære eksekveringsveje ved åbning af projektet i Claude Code eller VS Code.","sourceUrls":["https://thehackernews.com/2026/08/keyv-linked-npm-worm-poisons-hundreds.html"],"confidence":"high"}],"sources":[{"title":"Keyv-Linked npm Worm Poisons Hundreds of Packages, Plants Claude Code and VS Code Hooks","publisher":"The Hacker News","url":"https://thehackernews.com/2026/08/keyv-linked-npm-worm-poisons-hundreds.html","publishedAt":"2026-08-04T00:00:00.000Z","kind":"reporting"},{"title":"Keyv npm supply chain compromise","publisher":"SafeDep","url":"https://safedep.io/keyv-npm-supply-chain-compromise/","publishedAt":"2026-08-04T00:00:00.000Z","kind":"primary"}]},{"id":"story-datatilsynet-copilot-20260805","eventKey":"dk-copilot-authority-access-case-2026-08","materialFacts":["Ingeniørens Radar har fået aktindsigt i Datatilsynets sagsakter om bruddet hos Sundhedsdatastyrelsen.","Akterne viser, at adgangen for Copilot blev slået til af en automatisk Microsoft-opdatering i myndighedens Outlook-miljø — ikke af en beslutning truffet af en medarbejder.","It-sikkerhedsspecialist i Datatilsynet Allan Frank siger, at sagen viser, at myndigheder ikke har reel driftskontrol over de AI-systemer, der allerede kører i deres egne miljøer."],"section":"Indland","headline":"Data-sag viser AI-hovedbrud på tværs af offentlige myndigheder","primarySourceUrl":"https://ing.dk/artikel/data-sag-viser-ai-hovedbrud-paa-tvaers-af-offentlige-myndigheder","subheadline":"Aktindsigt viser, at det ikke var en medarbejder, der gav Copilot adgang til sundhedsdata. Det var en automatisk opdatering.","body":["Ingeniørens Radar har fået aktindsigt i Datatilsynets sagsakter om databruddet hos Sundhedsdatastyrelsen. Akterne viser, at Copilots adgang blev slået til af en automatisk Microsoft-opdatering i myndighedens Outlook-miljø. Ingen medarbejder traf beslutningen.","It-sikkerhedsspecialist i Datatilsynet Allan Frank siger, at myndigheder ikke har reel driftskontrol over de AI-systemer, der allerede kører i deres egne miljøer, og at følsomme sundhedsdata kan være eksponeret."],"whyItMatters":"Sagen skifter karakter. Den var en enkelt myndigheds fejl. Nu er den et vilkår for alle myndigheder, der køber software som en løbende tjeneste.","analysis":"Digital suverænitet diskuteres normalt som et spørgsmål om, hvor data ligger. Her ligger data det rigtige sted, og kontrollen forsvinder alligevel, fordi funktionaliteten ændrer sig uden for kundens beslutningsvej. Det er en indkøbsjuridisk pointe, ikke en serverpointe.","image":{"url":"https://ing.dk/sites/mi/files/styles/open_graph_image_16_9/public/2022-03/dsc0132.jpg?itok=HllQe7Wa","credit":"Kilde: Ingeniøren","alt":"Arkivfoto brugt af Ingeniøren til artiklen om Datatilsynets sag mod Sundhedsdatastyrelsen.","sourceUrl":"https://ing.dk/artikel/data-sag-viser-ai-hovedbrud-paa-tvaers-af-offentlige-myndigheder"},"topics":["ai","databeskyttelse","digital suverænitet","danmark","offentlig sektor"],"entities":["Datatilsynet","Sundhedsdatastyrelsen","Microsoft","Copilot","Allan Frank","Ingeniøren"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":76,"decisionValue":84,"novelty":80,"sourceQuality":84,"personalRelevance":88,"contrast":66},"claims":[{"text":"Datatilsynets sagsakter, som Ingeniørens Radar har fået aktindsigt i, viser, at Copilots adgang i Sundhedsdatastyrelsens Outlook-miljø blev aktiveret af en automatisk Microsoft-opdatering.","sourceUrls":["https://ing.dk/artikel/data-sag-viser-ai-hovedbrud-paa-tvaers-af-offentlige-myndigheder"],"confidence":"high"}],"sources":[{"title":"Data-sag viser AI-hovedbrud på tværs af offentlige myndigheder","publisher":"Ingeniøren","url":"https://ing.dk/artikel/data-sag-viser-ai-hovedbrud-paa-tvaers-af-offentlige-myndigheder","publishedAt":"2026-08-04T08:55:00.000Z","kind":"reporting"}]},{"id":"story-novo-nordisk-q2-20260805","eventKey":"novo-nordisk-q2-2026-guidance","materialFacts":["Novo Nordisk offentliggjorde 4. august 2026 et justeret driftsresultat på 33.389 millioner kroner for andet kvartal, en vækst på 11 procent i lokal valuta.","Justeret omsætning var 78.488 millioner kroner, plus 7 procent i lokal valuta. Rapporteret driftsresultat var 27.061 millioner kroner.","Forventningerne til 2026 blev hævet til 0 til minus 6 procent i justeret vækst mod tidligere minus 4 til minus 12 procent.","Wegovy-pillen passerede 265.000 ugentlige recepter i USA i ugen, der sluttede 17. juli 2026."],"section":"Erhverv","headline":"Novo Nordisk øger indtjeningen og opjusterer forventningerne til 2026","primarySourceUrl":"https://www.dr.dk/nyheder/indland/novo-nordisk-oeger-indtjeningen-og-opjusterer-forventningerne-til-2026","subheadline":"Justeret driftsresultat på 33,4 milliarder kroner i andet kvartal, og et forventningsinterval, der er flyttet opad. Væksten er stadig negativ i toppen.","body":["Novo Nordisk offentliggjorde 4. august et justeret driftsresultat på 33.389 millioner kroner for andet kvartal, en fremgang på 11 procent i lokal valuta. Justeret omsætning var 78.488 millioner kroner, plus 7 procent. Rapporteret driftsresultat var 27.061 millioner kroner.","Selskabet hævede forventningerne til 2026 til mellem 0 og minus 6 procent i justeret vækst mod tidligere minus 4 til minus 12 procent. Wegovy-pillen passerede 265.000 ugentlige recepter i USA i ugen, der sluttede 17. juli."],"whyItMatters":"Opjusteringen er den første efter halvandet år, hvor guidance kun er gået den anden vej. Intervallet er stadig negativt i den øvre ende.","analysis":"Forskellen mellem justeret og rapporteret resultat er over seks milliarder kroner i kvartalet. Det er der, historien ligger: tallet, der bærer opjusteringen, er ikke det tal, regnskabet aflægger. Recepttallet for pillen er den underliggende variabel at følge.","image":{"url":"https://asset.dr.dk/drdk/umbraco-images/rxndgnru/20250205-145942-l.jpg","credit":"Kilde: DR","alt":"Novo Nordisks anlæg. Arkivfoto brugt af DR til artiklen om kvartalsregnskabet.","sourceUrl":"https://www.dr.dk/nyheder/indland/novo-nordisk-oeger-indtjeningen-og-opjusterer-forventningerne-til-2026"},"topics":["danmark","medicinal","glp-1","regnskab","erhverv"],"entities":["Novo Nordisk","Wegovy","USA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":78,"decisionValue":74,"novelty":72,"sourceQuality":88,"personalRelevance":70,"contrast":56},"claims":[{"text":"Novo Nordisk rapporterede for andet kvartal 2026 et justeret driftsresultat på 33.389 millioner kroner og en justeret omsætning på 78.488 millioner kroner, og hævede forventningerne til 2026 til 0 til minus 6 procent i justeret vækst.","sourceUrls":["https://www.novonordisk.com/content/nncorp/global/en/news-and-media/news-and-ir-materials/news-details.html?id=916590","https://www.dr.dk/nyheder/indland/novo-nordisk-oeger-indtjeningen-og-opjusterer-forventningerne-til-2026"],"confidence":"high"}],"sources":[{"title":"Novo Nordisk øger indtjeningen og opjusterer forventningerne til 2026","publisher":"DR","url":"https://www.dr.dk/nyheder/indland/novo-nordisk-oeger-indtjeningen-og-opjusterer-forventningerne-til-2026","publishedAt":"2026-08-04T17:07:00.000Z","kind":"reporting"},{"title":"Novo Nordisk reports adjusted operating profit of DKK 33,389 million for Q2 2026 and raises full-year outlook","publisher":"Novo Nordisk","url":"https://www.novonordisk.com/content/nncorp/global/en/news-and-media/news-and-ir-materials/news-details.html?id=916590","publishedAt":"2026-08-04T05:30:00.000Z","kind":"primary"}]},{"id":"story-gilead-duty-innovate-20260805","eventKey":"california-supreme-court-gilead-duty-innovate-2026-08","materialFacts":["Californiens højesteret gav 3. august 2026 Gilead Sciences medhold med 6 mod 1 og ophævede en appelretsafgørelse fra to år tidligere.","Appelretsafgørelsen havde antydet en retlig pligt til at innovere — at en producent kunne holdes ansvarlig for ikke at have bragt et sikrere alternativ på markedet tidligere.","Mere end 24.000 patienter havde sagsøgt Gilead med påstand om nyreskader og knogletab fra en ældre hiv-medicin med TDF, mens selskabet allerede havde en sikrere efterfølger klar."],"section":"Sundhed","headline":"California Supreme Court sides with Gilead in ‘duty’ to innovate case","primarySourceUrl":"https://www.statnews.com/pharmalot/2026/08/03/california-supreme-court-sides-with-gilead-in-duty-to-innovate-case/","subheadline":"Kan en producent holdes ansvarlig for ikke at have udviklet det sikrere produkt hurtigere? Californiens højesteret svarer nej, seks mod en.","body":["Californiens højesteret gav 3. august Gilead Sciences medhold med 6 mod 1 og ophævede en afgørelse fra delstatens appelret to år tidligere. Mere end 24.000 patienter havde sagsøgt selskabet for nyreskader og knogletab fra en ældre hiv-medicin med stoffet TDF, mens Gilead efter deres opfattelse allerede havde en sikrere efterfølger klar.","Appelrettens afgørelse havde antydet en retlig pligt til at innovere: at en producent kunne holdes ansvarlig for rækkefølgen i sin egen udvikling. Den mulighed er nu lukket."],"whyItMatters":"Californien er den største biotek-jurisdiktion i USA. Afgørelsen fjerner risikoen for, at rækkefølgen i en pipeline bliver et retligt spørgsmål.","analysis":"Begge sider har en reel pointe. En pligt til at innovere gør udviklingsrækkefølge til noget, en domstol bedømmer bagefter. Uden den er der ingen konsekvens ved at holde et sikrere produkt tilbage. Retten valgte den første risiko.","image":{"url":"https://www.statnews.com/wp-content/uploads/2024/07/GettyImages-1221879709-645x645.jpg","credit":"Kilde: STAT","alt":"Gilead Sciences. Arkivfoto brugt af STAT til artiklen om afgørelsen ved Californiens højesteret.","sourceUrl":"https://www.statnews.com/pharmalot/2026/08/03/california-supreme-court-sides-with-gilead-in-duty-to-innovate-case/"},"topics":["jura","medicinalindustri","innovation","usa"],"entities":["Gilead Sciences","Californiens højesteret","TDF","Californien"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":74,"decisionValue":66,"novelty":80,"sourceQuality":82,"personalRelevance":34,"contrast":86},"claims":[{"text":"Californiens højesteret afgjorde 3. august 2026 med 6 mod 1 til fordel for Gilead Sciences og ophævede en appelretsafgørelse, der havde åbnet for en retlig pligt til at innovere.","sourceUrls":["https://www.statnews.com/pharmalot/2026/08/03/california-supreme-court-sides-with-gilead-in-duty-to-innovate-case/"],"confidence":"high"}],"sources":[{"title":"California Supreme Court sides with Gilead in ‘duty’ to innovate case","publisher":"STAT","url":"https://www.statnews.com/pharmalot/2026/08/03/california-supreme-court-sides-with-gilead-in-duty-to-innovate-case/","publishedAt":"2026-08-03T00:00:00.000Z","kind":"reporting"}]},{"id":"story-ebola-drc-1700-20260805","eventKey":"drc-bundibugyo-ebola-2026-08","materialFacts":["Dødstallet i Den Demokratiske Republik Congo står 4. august 2026 på 1.707 døde ud af 3.802 tilfælde.","Africa CDC's generaldirektør Jean Kaseya siger, at kontaktopsporingen ikke virker.","Omkring 60-70 procent af nye tilfælde opstår nu ved smitte i lokalsamfundet frem for blandt opsporede kontakter.","Ituri-provinsen står for næsten 90 procent af tilfældene. Udbruddet blev erklæret 15. maj 2026 og skyldes Bundibugyo-virus, som der hverken findes godkendt vaccine eller behandling mod."],"section":"Global sundhed","headline":"Ebola kills 1,700 in eastern Congo as the fastest-growing outbreak surges","primarySourceUrl":"https://www.statnews.com/2026/08/04/ebola-1700-deaths-eastern-congo-fastest-growing-outbreak/","subheadline":"1.707 døde ud af 3.802 tilfælde. Africa CDC's generaldirektør siger nu rent ud, at kontaktopsporingen ikke virker.","body":["Dødstallet i Den Demokratiske Republik Congo står 4. august på 1.707 døde ud af 3.802 tilfælde. Africa CDC's generaldirektør Jean Kaseya siger, at kontaktopsporingen ikke virker. Omkring 60 til 70 procent af nye tilfælde opstår nu ved smitte i lokalsamfundet frem for blandt opsporede kontakter.","Ituri-provinsen står for næsten 90 procent af tilfældene, og smitte er bekræftet i seks provinser. Udbruddet blev erklæret 15. maj og skyldes Bundibugyo-virus, som der hverken findes godkendt vaccine eller behandling mod."],"whyItMatters":"Det er nu det næststørste ebolaudbrud nogensinde efter epidemien i Vestafrika i 2014-2016. Smittekæden er i vid udstrækning usynlig for beredskabet.","analysis":"Forskellen på et udbrud, der lukkes ned, og et, der vokser, er hvor stor en del af de nye tilfælde der kommer fra en kendt kontakt. To ud af tre gør det ikke her. Det er tallet, der forklarer kurven.","image":{"url":"https://www.statnews.com/wp-content/uploads/2026/08/AP26170587534280-645x645.jpg","credit":"Kilde: STAT/AP","alt":"Sundhedspersonale i beskyttelsesdragt under ebolaudbruddet i Den Demokratiske Republik Congo.","sourceUrl":"https://www.statnews.com/2026/08/04/ebola-1700-deaths-eastern-congo-fastest-growing-outbreak/"},"topics":["epidemi","global sundhed","afrika","beredskab"],"entities":["Den Demokratiske Republik Congo","Africa CDC","Jean Kaseya","WHO","Ituri","Uganda"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":84,"decisionValue":58,"novelty":72,"sourceQuality":86,"personalRelevance":30,"contrast":64},"claims":[{"text":"Dødstallet i ebolaudbruddet i Den Demokratiske Republik Congo stod 4. august 2026 på 1.707 døde ud af 3.802 tilfælde, og omkring 60-70 procent af nye tilfælde stammer fra smitte i lokalsamfundet frem for fra opsporede kontakter.","sourceUrls":["https://www.statnews.com/2026/08/04/ebola-1700-deaths-eastern-congo-fastest-growing-outbreak/","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"],"confidence":"high"}],"sources":[{"title":"Ebola kills 1,700 in eastern Congo as the fastest-growing outbreak surges","publisher":"STAT"         for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
