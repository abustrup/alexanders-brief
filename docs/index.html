      globalThis.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveFeedback(payload);
    });
  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {
    const response = await fetcher(feedbackUrl(), {
      method: "POST",
      redirect: "follow",
      headers: { "content-type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "feedback", ...payload })
    });
    if (!response.ok) {
      throw new Error(`Feedback request failed: ${response.status}`);
    }
    return response.json();
  }
  function defaultFeedbackTransport() {
    const url = feedbackUrl();
    if (url) return (payload) => httpFeedbackTransport(payload);
    if (globalThis.google?.script?.run) return appsScriptTransport;
    return () => Promise.resolve({ status: "saved-local" });
  }
  function stampButton(button) {
    if (!button) return;
    button.classList.remove("is-stamping");
    void button.offsetWidth;
    button.classList.add("is-stamping");
    const clear = () => button.classList.remove("is-stamping");
    button.addEventListener("animationend", clear, { once: true });
    setTimeout(clear, 400);
  }
  function articleContent(article) {
    return {
      storyId: article?.dataset.storyId,
      contentType: article?.dataset.contentType === "recommendation" ? "recommendation" : "story"
    };
  }
  function revealRatingScale(button) {
    const scale = button.closest(".feedback-panel")?.querySelector(".rating-scale");
    if (!scale || scale.dataset.revealed === "true") return false;
    setRatingRevealed(scale, true);
    scale.classList.remove("is-revealing");
    void scale.offsetWidth;
    scale.classList.add("is-revealing");
    const clear = () => scale.classList.remove("is-revealing");
    scale.addEventListener("animationend", clear, { once: true });
    setTimeout(clear, 500);
    return true;
  }
  function ratingRevealedMessage(button) {
    const what = contentNoun(button.closest("article")?.dataset.contentType);
    return `Du kan nu give ${what} et udbytte fra 1 til 10.`;
  }
  async function selectRating(step, transport) {
    const scale = step.closest(".rating-scale");
    const article = step.closest("article");
    if (!scale || !article) return;
    const { storyId, contentType } = articleContent(article);
    if (!storyId) return;
    const value = Number(step.dataset.rating);
    const previous = readSavedRating(storyId, contentType);
    const next = previous === value ? null : value;
    applyRatingState(scale, next);
    if (next) rememberRating(storyId, contentType, next);
    else forgetRating(storyId, contentType);
    const rollback = () => applyRatingState(scale, previous);
    if (next) {
      const thumb = article.querySelector(`button[data-direction="${ratingDirection(next)}"]`);
      if (!thumb) return;
      const alreadyPressed = thumb.getAttribute("aria-pressed") === "true";
      if (!alreadyPressed) stampButton(thumb);
      try {
        await sendFeedback(thumb, transport, next);
      } catch (error) {
        rollback();
        if (previous) rememberRating(storyId, contentType, previous);
        else forgetRating(storyId, contentType);
        throw error;
      }
      return;
    }
    const pressed = article.querySelector('button[data-direction][aria-pressed="true"]');
    if (pressed) {
      try {
        await sendFeedback(pressed, transport, null);
      } catch (error) {
        rollback();
        if (previous) rememberRating(storyId, contentType, previous);
        throw error;
      }
    }
    setFeedbackStatus("Udbytte fjernet.");
  }
  function stepsOf(scale) {
    return [...scale.querySelectorAll(".rating-step")];
  }
  function focusStep(scale, value) {
    const steps = stepsOf(scale);
    const clamped = Math.min(RATING_MAX, Math.max(RATING_MIN, value));
    for (const step of steps) step.tabIndex = Number(step.dataset.rating) === clamped ? 0 : -1;
    steps.find((step) => Number(step.dataset.rating) === clamped)?.focus();
  }
  var suppressNextRatingClick = false;
  function bindRatingScrub(transport) {
    let scrub = null;
    const cells = RATING_MAX - RATING_MIN + 1;
    const valueAt = (scale, clientX) => {
      const rect = scale.getBoundingClientRect();
      if (!rect.width) return RATING_MIN;
      const slot = Math.floor((clientX - rect.left) / rect.width * cells);
      return Math.min(RATING_MAX, Math.max(RATING_MIN, slot + RATING_MIN));
    };
    const preview = (value) => {
      scrub.value = value;
      scrub.scale.style.setProperty("--rating-preview", String(value - RATING_MIN));
      scrub.bubble.textContent = String(value);
      for (const step of stepsOf(scrub.scale)) {
        step.dataset.preview = String(Number(step.dataset.rating) === value);
      }
    };
    document.addEventListener("pointerdown", (event) => {
      suppressNextRatingClick = false;
      if (event.pointerType === "mouse" || scrub) return;
      const scale = event.target.closest?.(".rating-scale");
      if (!scale) return;
      const bubble = element("span", "rating-bubble");
      bubble.setAttribute("aria-hidden", "true");
      scale.classList.add("is-scrubbing");
      scrub = { scale, bubble, value: null, pointerId: event.pointerId };
      preview(valueAt(scale, event.clientX));
      scale.append(bubble);
      scale.setPointerCapture?.(event.pointerId);
    });
    document.addEventListener("pointermove", (event) => {
      if (!scrub || event.pointerId !== scrub.pointerId) return;
      preview(valueAt(scrub.scale, event.clientX));
    });
    const finish = (commit) => (event) => {
      if (!scrub || event.pointerId !== scrub.pointerId) return;
      const { scale, bubble, value } = scrub;
      scrub = null;
      bubble.remove();
      scale.classList.remove("is-scrubbing");
      scale.style.removeProperty("--rating-preview");
      for (const step2 of stepsOf(scale)) delete step2.dataset.preview;
      if (!commit) return;
      suppressNextRatingClick = true;
      setTimeout(() => {
        suppressNextRatingClick = false;
      }, 400);
      const step = stepsOf(scale).find((candidate) => Number(candidate.dataset.rating) === value);
      if (step) {
        selectRating(step, transport).catch(() => setFeedbackStatus("Feedback kunne ikke gemmes \u2013 pr\xF8v igen"));
      }
    };
    document.addEventListener("pointerup", finish(true));
    document.addEventListener("pointercancel", finish(false));
  }
  function bindFeedback(transport = defaultFeedbackTransport()) {
    suppressNextRatingClick = false;
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-direction], button[data-rating]");
      if (!button) return;
      try {
        if (button.dataset.rating) {
          if (suppressNextRatingClick) {
            suppressNextRatingClick = false;
            return;
          }
          await selectRating(button, transport);
          return;
        }
        const revealed = revealRatingScale(button);
        stampButton(button);
        try {
          await sendFeedback(button, transport);
        } catch {
          setFeedbackStatus("Feedback kunne ikke gemmes \u2013 pr\xF8v igen");
        }
        if (revealed) appendFeedbackStatus(ratingRevealedMessage(button));
      } catch {
        setFeedbackStatus("Feedback kunne ikke gemmes \u2013 pr\xF8v igen");
      }
    });
    document.addEventListener("keydown", (event) => {
      const step = event.target.closest?.(".rating-step");
      if (!step) return;
      const scale = step.closest(".rating-scale");
      if (!scale) return;
      const current = Number(step.dataset.rating);
      if (event.key === "ArrowRight" || event.key === "ArrowDown") {
        event.preventDefault();
        focusStep(scale, current + 1);
      } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        event.preventDefault();
        focusStep(scale, current - 1);
      } else if (event.key === "Home") {
        event.preventDefault();
        focusStep(scale, RATING_MIN);
      } else if (event.key === "End") {
        event.preventDefault();
        focusStep(scale, RATING_MAX);
      } else if (event.key === "Escape") {
        const marked = stepsOf(scale).find((candidate) => candidate.getAttribute("aria-checked") === "true");
        if (marked) {
          event.preventDefault();
          marked.click();
        }
      } else if (/^[0-9]$/.test(event.key)) {
        event.preventDefault();
        const value = event.key === "0" ? RATING_MAX : Number(event.key);
        stepsOf(scale).find((candidate) => Number(candidate.dataset.rating) === value)?.click();
      }
    });
    bindRatingScrub(transport);
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const save = event.target.closest("[data-save-story]");
      if (save) {
        toggleSaved({
          id: save.dataset.saveStory,
          headline: save.dataset.saveHeadline,
          url: save.dataset.saveUrl
        });
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        syncSaveButtons();
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    flushRatingOutbox().catch(() => {
    });
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
