<!doctype html>
<html lang="da" data-edition="daily">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe4">
  <title>Alexanders Nyheder</title>
  <script>
    // Apply the persisted visual direction before first paint so the page never
    // flashes the default theme. Mirrors readLayout() in src/web/layout.js.
    (function () {
      try {
        var valid = ["editorial", "magazine", "feed", "dark"];
        var saved = localStorage.getItem("brief-layout");
        document.documentElement.dataset.layout = valid.indexOf(saved) >= 0 ? saved : "editorial";
      } catch (e) {
        document.documentElement.dataset.layout = "editorial";
      }
    })();
  </script>
  <!-- Fonts load async (non-render-blocking): the page paints immediately with
       the inlined structural CSS + system fallback, then swaps to the webfonts. -->
  <link rel="preload" href="fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="fonts.css"></noscript>
  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);
}

.mag-reading {
  width: min(720px, 92vw);
  margin: clamp(28px, 4vw, 48px) auto 0;
}
.mag-reading-article { display: block; }

.mag-band { margin-top: clamp(36px, 5vw, 64px); padding: clamp(30px, 4vw, 52px) 0; }
.mag-signals { background: var(--surface); }
.mag-band-title {
  width: min(1240px, 94vw);
  margin: 0 auto 18px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
}
.mag-signals-grid {
  width: min(1240px, 94vw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 30px;
}

.mag-stories,
.mag-shortnews,
.mag-recs { margin-top: clamp(36px, 5vw, 64px); }
.mag-stories .section-heading,
.mag-shortnews .section-heading,
.mag-recs .section-heading {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 400;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.mag-featured { margin: 18px 0 30px; }
.mag-featured .story-card { padding-bottom: 30px; }
.mag-featured .story-card .story-headline { font-size: clamp(2rem, 3.6vw, 3rem); }
.mag-featured .story-card .story-media { aspect-ratio: 4 / 3; }

.mag-keynumber { background: var(--ink); color: #fff; }
.mag-keynumber .mag-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: clamp(20px, 4vw, 56px);
}
.mag-keynumber-figure { font-family: var(--font-display); line-height: 0.86; }
.mag-keynumber-value { font-size: clamp(4rem, 11vw, 8rem); letter-spacing: -0.02em; }
.mag-keynumber-unit { margin-left: 10px; font-family: var(--font-label); font-size: 1rem; color: #f4a08f; }
.mag-keynumber-kicker {
  display: block;
  color: #f4a08f;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.mag-keynumber-label { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(1.4rem, 2.6vw, 2rem); }
.mag-keynumber-caption { margin: 8px 0 0; color: rgba(255, 255, 255, 0.8); font-family: var(--font-label); font-size: 0.9rem; }
.mag-keynumber-source { display: inline-block; margin-top: 10px; color: #fff; font-family: var(--font-label); font-size: 0.74rem; font-weight: 700; }

/* ==========================================================================
   Feed — mobile app: sticky app bar + filter chips over a single card column
   ========================================================================== */
/* Daily-only: Feed replaces the masthead with its own app bar and uses a single
   card column. On weekly/monthly the masthead/edition-nav must stay (there is no
   Feed app bar there), so only the Feed palette + type apply to their structure. */
:root[data-edition="daily"][data-layout="feed"] .masthead { display: none; }
:root[data-edition="daily"][data-layout="feed"] .page-shell { width: 100%; max-width: none; margin: 0; }

.feed-appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: 100%;
  background: rgba(238, 240, 243, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #e1e4e9;
}
.feed-appbar-top {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 10px 0;
}
.feed-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  font-family: var(--font-label);
  font-weight: 800;
  font-size: 0.9rem;
}
.feed-identity { flex: 1 1 auto; min-width: 0; }
.feed-app-title { margin: 0; font-family: var(--font-label); font-weight: 800; font-size: 1.06rem; letter-spacing: -0.02em; }
.feed-app-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.72rem; }
.feed-appbar .audio-controls { margin: 0; flex: 0 0 auto; }
:root[data-layout="feed"] .audio-stop { display: none; }
:root[data-layout="feed"] .audio-button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
}
:root[data-layout="feed"] .audio-toggle[aria-pressed="true"] { background: var(--teal); color: #fff; }

.feed-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  width: min(480px, 94vw);
  margin: 0 auto;
  padding: 0 0 10px;
}
.feed-chips::-webkit-scrollbar { display: none; }
.feed-chip {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e1e4e9;
  border-radius: 999px;
  background: #fff;
  color: #4b5563;
  font-family: var(--font-label);
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.feed-chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

.feed-column {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(480px, 94vw);
  margin: 16px auto 60px;
}
.feed-stories { display: flex; flex-direction: column; gap: 14px; }

.feed-card {
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 6px 18px rgba(20, 23, 28, 0.05);
  overflow: hidden;
}
.feed-card-media { position: relative; aspect-ratio: 16 / 9; background: #dfe3e8; overflow: hidden; }
.feed-hero .feed-card-media { aspect-ratio: 16 / 10; }
.feed-card-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.feed-badge {
  position: absolute;
  left: 12px;

r en velkendt manøvre: Hamas køber forhandlingsrum uden reelt at afgive magt.","image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/07/AFP__20260706__B9CZ8LV__v1__HighRes__PalestinianIsraelConflictGaza-1783339004.jpg?resize=1920%2C1440","credit":"Foto: AFP / Al Jazeera","alt":"Palæstinensere i Gaza; Hamas har meddelt, at bevægelsen opløser sit regeringsudvalg.","sourceUrl":"https://www.aljazeera.com/news/2026/7/6/hamas-announces-dissolution-of-gaza-governing-body"},"topics":["mellemøsten","gaza","hamas","våbenhvile","styring"],"entities":["Hamas","Gaza","Mohammed al-Farra","Ali Shaath","NCAG","FN","Board of Peace"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":80,"decisionValue":55,"novelty":72,"sourceQuality":80,"personalRelevance":40,"contrast":62},"claims":[{"text":"Hamas opløste 6. juli 2026 sit Regeringsnødudvalg, der har styret Gaza siden 2007, og vil overdrage civilstyret til teknokratudvalget NCAG ledet af Ali Shaath.","sourceUrls":["https://www.aljazeera.com/news/2026/7/6/hamas-announces-dissolution-of-gaza-governing-body","https://www.pbs.org/newshour/world/hamas-says-it-has-dissolved-its-government-in-gaza-to-transfer-power-to-a-un-backed-committee"],"confidence":"high"}],"sources":[{"title":"Hamas announces dissolution of Gaza governing body","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/6/hamas-announces-dissolution-of-gaza-governing-body","publishedAt":"2026-07-06T00:00:00Z","kind":"reporting"},{"title":"Hamas says it has dissolved its government in Gaza to transfer power to a UN-backed committee","publisher":"PBS NewsHour","url":"https://www.pbs.org/newshour/world/hamas-says-it-has-dissolved-its-government-in-gaza-to-transfer-power-to-a-un-backed-committee","publishedAt":"2026-07-06T00:00:00Z","kind":"reporting"},{"title":"Hamas dissolves Gaza government ahead of eventual transfer of power to technocrats","publisher":"The Times of Israel","url":"https://www.timesofisrael.com/hamas-dissolves-gaza-gov ng til 5-9 % med henvisning til Hormuz-relaterede leveringsforsinkelser."],"whyItMatters":"Hormuz er nåleøjet for en femtedel af verdens olie- og gashandel; ét angreb kan flytte energipriser helt ned til en dansk delebilsflåde.","analysis":"OPEC+' produktionsløft dæmper prischokket og viser, at kartellet vil generobre markedsandele frem for at forsvare prisen — men Irans afviselige angreb lægger en risikopræmie på transit.","image":{"url":"https://images.euronews.com/articles/stories/09/82/76/44/1536x864_cmsv2_8c2a4f08-6806-568d-99fa-f08da9486c0c-9827644.jpg","credit":"Foto: Euronews","alt":"Hormuzstrædet, hvor et LNG-tankskib blev ramt af et projektil og brød i brand.","sourceUrl":"https://www.euronews.com/2026/07/07/oil-tanker-hit-by-unknown-projectile-in-strait-of-hormuz-british-military-says"},"topics":["energi","hormuz","olie","opec","danmark"],"entities":["Hormuzstrædet","Oman","Qatar","Iran","UKMTO","OPEC+","GreenMobility"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":76,"decisionValue":70,"novelty":66,"sourceQuality":78,"personalRelevance":58,"contrast":60},"claims":[{"text":"Et LNG-tankskib med qatarsk gas blev 7. juli 2026 ramt af et projektil i Hormuzstrædet nær Oman og brød i brand; Iran antydede ansvar uden officiel bekræftelse.","sourceUrls":["https://www.euronews.com/2026/07/07/oil-tanker-hit-by-unknown-projectile-in-strait-of-hormuz-british-military-says","https://www.npr.org/2026/07/07/g-s1-132265/tanker-attack-strait-of-hormuz"],"confidence":"high"},{"text":"Syv OPEC+-lande besluttede 5. juli 2026 at hæve produktionen med 188.000 tønder/dag fra august.","sourceUrls":["https://www.opec.org/pr-detail/1835609-5-july-2026.html"],"confidence":"high"}],"sources":[{"title":"Oil tanker hit by 'unknown projectile' in Strait of Hormuz, British military says","publisher":"Euronews","url":"https://www.euronews.com/2026/07/07/oil-tanker-hit-by-unknown-projectile-in-strait-of-hormuz-british-military-says","publishedAt":"2026-07-07T00:00:00Z","k  investor Tencent.","Selskabets satsning er kamerafri briller med waveguide-optik, der viser diskret information i synsfeltet uden konstant optagelse — positioneret som privatlivsalternativ til Metas kameramodeller. Kapitalen skal finansiere næste platformgeneration og AI-integration."],"whyItMatters":"Kampen om AI'ens fysiske form flytter til ansigtet, og en kinesisk aktør med Apple-DNA og Tencent-Meituan-kapital viser, at Meta ikke får markedet forærende.","analysis":"At sælge på fravær af kamera er et skarpt væddemål: privatliv bliver et differentieringsparameter, netop som modstanden mod always-on-optagelse vokser — men uden kamera skæres AI-funktioner væk.","image":{"url":"https://techcrunch.com/wp-content/uploads/2026/07/Even-G2-and-R1-with-HUD.jpeg?resize=1200,675","credit":"Foto: Even Realities / TechCrunch","alt":"Even Realities' kamerafri smart-briller med diskret head-up-display.","sourceUrl":"https://techcrunch.com/2026/07/06/smart-glasses-maker-even-realities-hits-1b-valuation-with-150m-funding-led-by-meituan-tencent/"},"topics":["deeptech","venturekapital","smart-briller","kina","ai-hardware"],"entities":["Even Realities","Meituan","Tencent","Shenzhen","Kina","Meta","Apple"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":62,"decisionValue":66,"novelty":74,"sourceQuality":76,"personalRelevance":78,"contrast":58},"claims":[{"text":"Even Realities (Shenzhen, Kina) rejste 150 mio. dollar i en pre-Series B til en værdiansættelse på 1 mia. dollar, ledet af Meituan med Tencent.","sourceUrls":["https://techcrunch.com/2026/07/06/smart-glasses-maker-even-realities-hits-1b-valuation-with-150m-funding-led-by-meituan-tencent/","https://siliconangle.com/2026/07/06/smart-glasses-startup-even-realities-raises-150m/"],"confidence":"high"}],"sources":[{"title":"Smart glasses maker Even Realities hits $1B valuation with $150M funding led by Meituan, Tencent","publisher":"TechCrunch","url":"https://techcrunch.com/2026/07/06/smart-glasses-maker-even-realities-hits-1b-valuation-with-150m-funding-led-by-meituan-tencent/","publishedAt":"2026-07-06T00:00:00Z","kind":"reporting"},{"title":"Apple veteran's Chinese smart-glasses firm becomes unicorn as Tencent, Meituan fund rival to Meta","publisher":"CNBC","url":"https://www.cnbc.com/2026/07/06/apple-veteran-takes-on-meta-with-1-billion-smart-glasses-maker.html","publishedAt":"2026-07-06T00:00:00Z","kind":"reporting"},{"title":"Smart glasses startup Even Realities raises $150M","publisher":"SiliconANGLE","url":"https://siliconangle.com/2026/07/06/smart-glasses-startup-even-realities-raises-150m/","publishedAt":"2026-07-06T00:00:00Z","kind":"reporting"}]},{"id":"story-genmab-tepkinly-20260706","eventKey":"genmab-tepkinly-ec-follicular-2026","materialFacts":["EU-Kommissionen godkendte 6. juli 2026 Genmabs TEPKINLY (epcoritamab) i kombination med lenalidomid og rituximab til voksne med recidiverende eller refraktært follikulært lymfom i anden linje.","Godkendelsen bygger på fase 3-studiet EPCORE FL-1, der viste 79 % reduktion i risiko for sygdomsprogression eller død (HR 0,21; 95 % CI 0,13-0,33; p\u003c0,0001).","Samlet responsrate var 96 % mod 81 %, og komplet respons 74 % mod 43 %; epcoritamab er udviklet af Genmab (Danmark) sammen med AbbVie (USA)."],"section":"Biotek","headline":"Genmab Announces TEPKINLY® (epcoritamab) in Combination with Lenalidomide and Rituximab is Approved by the European Commission for the Treatment of Relapsed or Refractory Follicular Lymphoma","primarySourceUrl":"https://www.globenewswire.com/news-release/2026/07/06/3322680/0/en/genmab-announces-tepkinly-epcoritamab-in-combination-with-lenalidomide-and-rituximab-is-approved-by-the-european-commission-for-the-treatment-of-relapsed-or-refractory-follicular-l.html","subheadline":"Københavnske Genmab får endnu en EU-godkendelse til kræftmidlet epcoritamab — denne gang som kemofri kombinationsbehandling mod follikulært lymfom.","body":["Genmab fik 6. juli EU-Kommissionens godkendelse af TEPKINLY (epcoritamab) med lenalidomid og rituximab til voksne med recidiverende/refraktært follikulært lymfom i anden linje — ifølge selskabet den første kemofri, bispecifik-baserede mulighed i denne EU-indikation.","Godkendelsen hviler på fase 3-studiet EPCORE FL-1, hvor kombinationen reducerede risikoen for sygdomsprogression eller død med 79 % (HR 0,21). Den samlede responsrate var 96 % mod 81 %, og 74 % opnåede komplet respons mod 43 %. Midlet er udviklet med amerikanske AbbVie."],"whyItMatters":"Godkendelsen udvider markedet for Genmabs vigtigste egenudviklede aktiv i Europa og styrker en af Danmarks få biotekvirksomheder i verdensklasse — med en kemofri behandling.","analysis":"En hazard ratio på 0,21 er usædvanlig stærk og gør epcoritamab til en reel andenlinjestandard. For Genmab flytter det økonomien fra enkeltindikation mod en bredere lymfomfranchise.","image":{"url":"https://ml-eu.globenewswire.com/Resource/Download/368a5dab-dfc5-4e1d-bfa6-2af5e5216fce","credit":"Kilde: Genmab","alt":"Genmabs pressemeddelelse om EU-godkendelsen af TEPKINLY (epcoritamab).","sourceUrl":"https://www.globenewswire.com/news-release/2026/07/06/3322680/0/en/genmab-announces-tepkinly-epcoritamab-in-combination-with-lenalidomide-and-rituximab-is-approved-by-the-european-commission-for-the-treatment-of-relapsed-or-refractory-follicular-l.html"},"topics":["biotek","onkologi","lymfom","regulatorisk","genmab"],"entities":["Genmab","TEPKINLY","epcoritamab","EU-Kommissionen","AbbVie","København"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":66,"decisionValue":62,"novelty":64,"sourceQuality":82,"personalRelevance":70,"contrast":46},"claims":[{"text":"EU-Kommissionen godkendte 6. juli 2026 Genmabs epcoritamab i kombination med lenalidomid og rituximab til follikulært lymfom; fase 3 EPCORE FL-1 viste 79 % risikoreduktion (HR 0,21) og 96 % responsrate.","sourceUrls":["https://www.globenewswire.com/news-release/2026/07/06/3322680/0/en/genmab-announces-tepkinly-epcoritamab-in-combination-w 7-06T00:00:00Z","kind":"reporting"},{"title":"European Commission Approves Tepkinly Plus R2 as First Bispecific-Based Therapy for Relapsed or Refractory Follicular Lymphoma","publisher":"BioPharm International","url":"https://www.biopharminternational.com/view/european-commission-approves-tepkinly-plus-r2-as-first-bispecific-based-therapy-for-relapsed-or-refractory-follicular-lymphoma","publishedAt":"2026-07-06T00:00:00Z","kind":"reporting"}]},{"id":"story-drc-ebola-20260706","eventKey":"drc-ebola-500-deaths-2026","materialFacts":["DR Congos 17. ebolaepidemi, erklæret 15. maj 2026 og forårsaget af Bundibugyo-virus, havde pr. 5. juli 2026 1.561 bekræftede tilfælde og 506 bekræftede dødsfald.","Ituri-provinsen er hårdest ramt; nabolandet Uganda har registreret 20 tilfælde og to dødsfald.","Der findes ingen godkendt vaccine eller behandling mod stammen; WHO har igangsat et klinisk forsøg med to kandidatbehandlinger, mens sundhedspersonale truer med strejke."],"section":"Verden","headline":"Death toll from DR Congo Ebola outbreak passes 500 as healthcare workers threaten strike","primarySourceUrl":"https://www.france24.com/en/africa/20260706-death-toll-from-dr-congo-ebola-outbreak-passes-500-as-healthcare-workers-threaten-strike","subheadline":"Dødstallet i DR Congos ebolaudbrud passerer 500 — en sjælden virusstamme uden godkendt vaccine, mens udmattet sundhedspersonale truer med at nedlægge arbejdet.","body":["Dødstallet i DR Congos 17. ebolaepidemi er passeret 500: pr. 5. juli 1.561 bekræftede tilfælde og 506 dødsfald. Udbruddet, erklæret 15. maj, skyldes den sjældne Bundibugyo-virus, som der ikke findes godkendt vaccine eller behandling mod. Ituri er hårdest ramt, og Uganda har registreret 20 tilfælde og to dødsfald.","WHO har igangsat et forsøg med to kandidatbehandlinger og nødgodkendt den første diagnostiske test for stammen. Samtidig truer sundhedspersonale med at strejke."],"whyItMatters":"En hurtigt voksende epidemi med en vaccineløs virusstamme og strejketruende personale kan tippe fra kontrolleret udbrud til regional krise, med spredningen til Uganda som varsel.","analysis":"At virussen er Bundibugyo og ikke den velkendte Zaire-stamme er afgørende: eksisterende ebolavacciner virker ikke sikkert her. Responsen hviler derfor på gammeldags inddæmning — mens de, der skal udføre den, mister tålmodigheden.","image":{"url":"https://s.france24.com/media/display/04765c96-7953-11f1-bd13-005056a90284/w:1280/p:16x9/000-B4QX2ZJ.jpg","credit":"Foto: AFP / France 24","alt":"Sundhedsarbejdere under ebolaudbruddet i DR Congo, hvor dødstallet er passeret 500.","sourceUrl":"https://www.france24.com/en/africa/20260706-death-toll-from-dr-congo-ebola-outbreak-passes-500-as-healthcare-workers-threaten-strike"},"topics":["sundhed","ebola","epidemi","afrika","who"],"entities":["DR Congo","Ituri","Uganda","WHO","Bundibugyo-virus"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":74,"decisionValue":48,"novelty":60,"sourceQuality":82,"personalRelevance":30,"contrast":68},"claims":[{"text":"DR Congos 17. ebolaepidemi (Bundibugyo-virus, ingen godkendt vaccine) havde pr. 5. juli 2026 1.561 bekræftede tilfælde og 506 dødsfald; Uganda har 20 tilfælde og to dødsfald.","sourceUrls":["https://www.france24.com/en/africa/20260706-death-toll-from-dr-congo-ebola-outbreak-passes-500-as-healthcare-workers-threaten-strike","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON612"],"confidence":"high"}],"sources":[{"title":"Death toll from DR Congo Ebola outbreak passes 500 as healthcare workers threaten strike","publisher":"France 24","url":"https://www.france24.com/en/africa/20260706-death-toll-from-dr-congo-ebola-outbreak-passes-500-as-healthcare-workers-threaten-strike","publishedAt":"2026-07-06T00:00:00Z","kind":"reporting"},{"title":"Ebola death toll in DR Congo surpasses 500","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/6/ebola-death-toll-in-dr-congo-surpasses-500","publishedAt":"2026-07-06T00:00:00Z","k sts","url":"https://www.euronews.com/my-europe/2026/07/05/thousands-swarm-the-streets-of-tirana-in-major-pink-flamingo-anti-government-protests","headline":"Thousands swarm the streets of Tirana in major 'Pink Flamingo' anti-government protests","summary":"I Albaniens hovedstad Tirana demonstrerede titusinder i de såkaldte 'Pink Flamingo'-protester mod premierminister Edi Rama og et luksusresortprojekt knyttet til Ivanka Trump og Jared Kushner — bevægelsens største demonstration hidtil.","publisher":"Euronews","section":"Verden","publishedAt":"2026-07-05T00:00:00Z"},{"text":"Ørsted advarer mod byggeriet af Microsofts datacenter: Olieledning løber gennem området","url":"https://ing.dk/artikel/oersted-advarer-mod-byggeriet-af-microsofts-datacenter-olieledning-loeber-gennem-omraadet","headline":"Ørsted advarer mod byggeriet af Microsofts datacenter: Olieledning løber gennem området","summary":"Ørsted advarer mod Microsofts planlagte datacenter i Varde-området, fordi en Ørsted-drevet olieledning løber gennem grunden og kan give risiko for spændinger og korrosion; kommunen kræver kompensation af Microsoft.","publisher":"Ingeniøren","section":"Energi","publishedAt":"2026-07-07T00:00:00Z"},{"text":"Danish climate VC Climentum Capital launches Fund II with €60 million first close","url":"https://www.eu-startups.com/2026/07/danish-climate-vc-climentum-capital-launches-fund-ii-with-e60-million-first-close/","headline":"Danish climate VC Climentum Capital launches Fund II with €60 million first close","summary":"Den københavnske klima-venturefond Climentum Capital lukkede et første close på 60 mio. euro af Fund II (mål: 100 mio.), med 40 mio. fra EIF, 15 mio. fra danske EIFO og 5 mio. fra IDA, til europæisk klima-hardtech.","publisher":"EU-Startups","section":"Venturekapital","publishedAt":"2026-07-03T00:00:00Z"}],"keyNumber":{"label":"Global venturefinansiering satte rekord med 510 mia. dollar i første halvår 2026","value":"510","unit":"mia. USD","asOf":"1. halvår 2026","caption":"Mere end hele 2025 (440 mia.); OpenAI og Anthropic lagde beslag på 217 mia. (43 %), og ca. 70 % af Q2-kapitalen gik til AI — samme uge som Microsoft skærer 4.800 job.","sourceUrl":"https://news.crunchbase.com/venture/global-startup-exits-ipo-ma-soar-ai-q2-h1-2026/","sourceTitle":"Crunchbase Data: Global Startup Investment Hit Record $510B In H1 2026 As AI Boom Accelerates Funding And Exits","series":[{"label":"2025 (helår)","value":440},{"label":"H1 2026","value":510}]},"recommendations":[{"id":"rec-world-eaters-20260707","mode":"read","kind":"bog (sagprosa)","status":"available","title":"World Eaters: How Venture Capital Is Cannibalizing the Economy","creator":"Catherine Bracy","provider":"Dutton (Penguin Random House)","url":"https://www.penguinrandomhouse.com/books/723091/world-eaters-by-catherine-bracy/","availability":"Udgivet; fås som hardcover (~30 USD), e-bog og lydbog, bredt distribueret globalt. Ingen betalingsmur på forlagssiden.","commitment":"272 sider (~6-7 t)","description":"Civilteknolog Catherine Bracy argumenterer for, at venturekapitalens model — blitzscaling, power-law-væddemål, tvungne exits — er strukturelt forkert for de fleste startups og nu spreder sine incitamenter til sundhed, fødevarer, arbejde og boliger. Bygget på interviews med stiftere, fondsforvaltere og gig-arbejdere.","rationale":"En sjælden indefra-kritik af netop den maskine, Alexander arbejder i på EIFO. Den giver det stærkeste steel man-argument mod power-law-tesen — brugbart til at trykprøve fondens mandat og se, hvor VC-logikken fejlallokerer kapital i de sektorer, han screener. Provokation, ikke bekræftelse.","topics":["venturekapital","fonde","teknologiøkonomi","startup-incitamenter","kritik"],"isFeatured":true,"image":{"url":"https://images2.penguinrandomhouse.com/cover/9780593473481","credit":"Omslag: Dutton / Penguin Random House","alt":"Bogomslag: World Eaters af Catherine Bracy.","sourceUrl":"https://www.penguinrandomhouse.com/books/723091/world-eaters-by-catherine-bracy/"}},{"id":"rec-dwarkesh-3b1b-20260707","mode":"listen","kind":"podcastinterview","status":"new","title":"Grant Sanderson (3Blue1Brown) – AI and the future of math","creator":"Dwarkesh Patel & Grant Sanderson","provider":"Dwarkesh Podcast","url":"https://www.youtube.com/watch?v=TfyPshgMbug","availability":"Gratis på YouTube, Spotify og Apple Podcasts; fuld transskription på dwarkesh.com. Ingen regionslås.","commitment":"~93 min","description":"Dwarkesh Patel og 3Blue1Browns Grant Sanderson gennemgår, hvorfor AI's fremskridt i matematik er ujævne: IMO-geometri løses på sekunder, mens kombinatorik fejler. De hævder, at det reelle mål ikke er bevisførelse, men at generere formodninger og definitioner — og hvad det betyder for automatisering af vidensarbejde.","rationale":"For en analytiker, der forudser AI's rækkevidde, er matematik det reneste tidlige signal for, hvor automatisering af ekspertræsonnement lander først. Sandersons pointe om, at en IMO-guldmedalje ikke var et AGI-øjeblik, giver en konkret, ikke-hypet model til at score AI-evner opgave for opgave frem for på overskrifter.","topics":["ai","matematik","agi-tidslinjer","automatisering","evaluering"],"isFeatured":false},{"id":"rec-dear-tomorrow-20260707","mode":"watch","kind":"dokumentar","status":"new","title":"Dear Tomorrow: Inside Japan's Loneliness Crisis","creator":"Kaspar Astrup Schrøder","provider":"Al Jazeera (Witness)","url":"https://www.aljazeera.com/video/witness/2026/2/8/dear-tomorrow-inside-japans-loneliness-crisis","availability":"Gratis at streame nu på Al Jazeera Witness — ingen betalingsmur, ingen regionslås.","commitment":"~47 min","description":"Den danske instruktør Kaspar Astrup Schrøder følger to isolerede mennesker i Japan, der søger kontakt og mening via en frivilligdrevet online-chattjeneste for mental sundhed, 'A Place for You'. 47 minutters Al Jazeera Witness-dokumentar fra februar 2026.","rationale":"En dansk filmskabers blik på ensomhedsepidemien og teknologimedieret nærvær — midt i Alexanders interesse for psykologi, relationer og menneskelig adfærd, og en nyttig modvægt til teknologioptimismen om AI-ledsagelse. Gratis, kort og direkte tilgængelig: høj signalværdi per minut.","topics":["ensomhed","psykologi","japan","mental sundhed","digital kontakt"],"isFeatured":false},{"id":"rec-turrell-aros-20260707","mode":"experience","kind":"kunstinstallation / immersiv oplevelse","status":"new","title":"As Seen Below – The Dome: a Skyspace by James Turrell","creator":"James Turrell","provider":"ARoS Aarhus Kunstmuseum","url":"https://www.aros.dk/en/aros-collection/as-seen-below-the-dome-a-skyspace-by-james-turrell/","availability":"Åben nu; indgår i almindelig ARoS-entré. Twilight-tilstand ved solop-/nedgang kræver forudbestilling. I Aarhus — dagstur fra København.","commitment":"45-90 min på stedet","description":"Turrells 100. og hidtil største museums-Skyspace: et 16 meter højt, 40 meter bredt underjordisk kuppelrum med en åbning mod himlen, åbnet 19. juni 2026. Tilstande omfatter Open Sky, timevis Colour Shift (maj-aug) og reservationskrævende Twilight, hvor det indre lys skifter i takt med solen.","rationale":"En sjælden mulighed i Danmark for at opleve selve sansningen som medie — Turrell fjerner referencepunkter, til himlen læses som ren farve. En bevidst modvægt til skærmbaseret AI: for en, der interesserer sig for perceptionspsykologi og æstetik, er en time her et direkte studie i, hvordan syn konstrueres.","topics":["perception","lyskunst","fænomenologi","arkitektur","kontemplation"],"isFeatured":false}],"quality":{"editorialConfidence":86,"sourceQuality":88,"outsideProfile":84,"diversity":87,"novelty":82}};</script>

    const status = document.querySelector("#feedback-status");
    if (status) status.textContent = "Feedback gemt";
    if (direction === "more" && !isRecommendation) {
      const headlineLink = article.querySelector(".headline-link");
      if (headlineLink) {
        recordSaved({
          id: article.dataset.storyId,
          headline: headlineLink.textContent,
          url: headlineLink.href
        });
      }
    }
    try {
      await transport(payload);
    } catch (error) {
      applyState(false);
      if (status) status.textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      throw error;
    }
    return payload;
  }
  function appsScriptTransport(payload) {
    if (!globalThis.google?.script?.run) {
      return Promise.resolve({ status: "saved-local" });
    }
    return new Promise((resolve, reject) => {
      globalThis.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveFeedback(payload);
    });
  }
  async function httpFeedbackTransport(payload, fetcher = globalThis.fetch) {
    const response = await fetcher(feedbackUrl(), {
      method: "POST",
      redirect: "follow",
      headers: { "content-type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "feedback", ...payload })
    });
    if (!response.ok) {
      throw new Error(`Feedback request failed: ${response.status}`);
    }
    return response.json();
  }
  function defaultFeedbackTransport() {
    const url = feedbackUrl();
    if (url) return (payload) => httpFeedbackTransport(payload);
    if (globalThis.google?.script?.run) return appsScriptTransport;
    return () => Promise.resolve({ status: "saved-local" });
  }
  function bindFeedback(transport = defaultFeedbackTransport()) {
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-direction], button[data-reason]");
      if (!button) return;
      try {
        const directionButton = button.dataset.direction ? button : button.closest("article").querySelector('[data-direction][aria-pressed="true"]');
        if (!directionButton) return;
        await sendFeedback(directionButton, transport, button.dataset.reason);
      } catch {
        document.querySelector("#feedback-status").textContent = "Feedback kunne ikke gemmes \u2013 pr\xF8v igen";
      }
    });
  }
  function bindReadLater() {
    const panel = document.querySelector("#read-later");
    document.addEventListener("click", (event) => {
      const dismiss = event.target.closest("[data-readlater-dismiss]");
      if (dismiss) {
        clearSaved(dismiss.dataset.readlaterDismiss);
        renderReadLater(panel);
        return;
      }
      const link = event.target.closest(".headline-link, .primary-source-link, .read-later-link");
      if (link?.href) {
        markOpened(link.href);
      }
    });
  }
  function buildNarrationSegments(brief) {
    const segments = [];
    if (brief.title) segments.push(brief.title);
    if (brief.dek) segments.push(brief.dek);
    const ordered = [...brief.stories].sort((a, b) => Number(b.isLead) - Number(a.isLead));
    for (const story of ordered) {
      if (story.headline) segments.push(story.headline);
      if (story.subheadline) segments.push(story.subheadline);
      if (Array.isArray(story.body)) {
        for (const paragraph of story.body) segments.push(paragraph);
      }
      if (story.whyItMatters) segments.push(story.whyItMatters);
      if (story.analysis) segments.push(story.analysis);
    }
    return segments.filter((segment) => typeof segment === "string" && segment.trim().length > 0);
  }
  function pickDanishVoice(synth) {
    const voices = synth.getVoices?.() ?? [];
    return voices.find((voice) => voice.lang === "da-DK") ?? voices.find((voice) => voice.lang?.toLowerCase().startsWith("da")) ?? null;
  }
  function createNarrator(brief, synth = globalThis.speechSynthesis) {
    if (!synth || typeof globalThis.SpeechSynthesisUtterance !== "function") return null;
    const segments = buildNarrationSegments(brief);
    if (!segments.length) return null;
    let index = 0;
    let playing = false;
    const speakFrom = (start) => {
      synth.cancel();
      index = start;
      const voice = pickDanishVoice(synth);
      for (let i = start; i < segments.length; i += 1) {
        const utterance = new globalThis.SpeechSynthesisUtterance(segments[i]);
        utterance.lang = "da-DK";
        if (voice) utterance.voice = voice;
        utterance.rate = 1.05;
        utterance.onstart = () => {
          index = i;
        };
        if (i === segments.length - 1) {
          utterance.onend = () => {
            playing = false;
            api.onstatechange?.("stopped");
          };
        }
        synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
