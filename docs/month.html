uakes","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/2026_Venezuela_earthquakes","publishedAt":"2026-06-26T06:00:00Z","kind":"reporting"},{"title":"Venezuela struck by back-to-back earthquakes, high casualties feared","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/25/venezuela-struck-by-back-to-back-earthquakes-high-casualties-feared","publishedAt":"2026-06-25T10:00:00Z","kind":"reporting"}],"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Caracas_-_La_Candelaria_Amanece.jpg/500px-Caracas_-_La_Candelaria_Amanece.jpg","credit":"Foto: Wikimedia Commons","alt":"Caracas, Venezuela – illustration til jordskælvskatastrofen","sourceUrl":"https://www.cbsnews.com/news/7-1-magnitude-earthquake-venezuela-tsunami-advisory-puerto-rico-virgin-islands/"}},{"id":"story-ebola-update-20260620","eventKey":"bundibugyo-ebola-drc-uganda-2026","materialFacts":["DR Congo har nu 933 bekræftede tilfælde og 245 dødsfald","Africa CDC følger 35.000 mistænkte kontakter","Uganda har registreret 19 tilfælde og to dødsfald"],"section":"Sundhed","headline":"Mourners bury a 6-month-old Ebola victim in the Congo outbreak’s 3rd orphanage death","primarySourceUrl":"https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e","subheadline":"Bundibugyo-udbruddet er vokset til 933 bekræftede tilfælde, og kontaktsporingen omfatter 35.000 mennesker","body":["DR Congos sundhedsminister oplyser nu 933 bekræftede tilfælde og 245 dødsfald. Mere end 90 procent ligger i Ituri. Uganda har 19 tilfælde og to dødsfald, mens Africa CDC følger 35.000 mistænkte kontakter.","Tallene er væsentligt højere end i gårsdagens brief. Konflikt, modstand mod sikre begravelser og mangel på beskyttelsesudstyr hæmmer responsen. Varianten har ingen godkendt specifik vaccine eller behandling, og manglende tidlig testning lod smitten brede sig."],"whyItMatters":"35.000 kontakter gør udbruddet til et logistisk problem. Hver forsinket test øger behovet for personale, isolation og grænsekoordination.","analysis":"Acceleration under svag statskapacitet er nøglesignalet. Gratis behandling og højere bonus kan hjælpe bemandingen, men løser ikke mistillid og usikkerhed.","image":{"url":"https://dims.apnews.com/dims4/default/9bcc5e5/2147483647/strip/true/crop/6434x4287+0+1/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2Ff3%2Fad%2F5bc5c1d30109dd0710913a0f83ca%2Fa7cbd0bf2ddb471281a6392537f4b1a1","credit":"AP Photo/Moses Sawasawa","alt":"Begravelse af et seks måneder gammelt Ebola-offer i Bunia","sourceUrl":"https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e"},"topics":["global sundhed","Ebola","beredskab","bioteknologi"],"entities":["DR Congo","Uganda","WHO","Africa CDC"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":94,"decisionValue":82,"novelty":90,"sourceQuality":93,"personalRelevance":70,"contrast":84},"claims":[{"text":"DR Congo har 933 bekræftede tilfælde og 245 dødsfald.","sourceUrls":["https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e","https://www.dr.dk/nyheder/seneste/250-personer-er-doede-af-ebola-i-dr-congo"],"confidence":"high"},{"text":"Africa CDC følger 35.000 mistænkte kontakter, og Uganda har 19 tilfælde og to dødsfald.","sourceUrls":["https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e"],"confidence":"high"},{"text":"Udbruddet skyldes Bundibugyo Ebola-virus.","sourceUrls":["https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON602"],"confidence":"high"}],"sources":[{"title":"Mourners bury a 6-month-old Ebola victim in the Congo outbreak’s 3rd orphanage death","publisher":"Associated Press","url":"https://apnews.com/article/congo-ebola-bundibugyo-8eb4d2a8e23a8ff3c4cb77c8facb925e","publishedAt":"2026-06-19T18:14:48Z","kind":"reporting"},{"title":"245 personer er døde af Ebola i DR Congo","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/250-personer-er-doede-af-ebola-i-dr-congo","publishedAt":"2026-06-20T02:08:41Z","kind":"reporting"},{"title":"Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo & Uganda","publisher":"WHO","url":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON602","publishedAt":"2026-05-17T00:00:00Z","kind":"primary"}]},{"id":"story-usmca-joint-review-2026","eventKey":"usmca-joint-review-not-renewed-2026","materialFacts":["USA nægtede 1. juli 2026 at forny USMCA i dens nuværende form","Aftalen forbliver i kraft; bilaterale forhandlinger med Mexico genoptages ugen omkring 20. juli","Ikke-fornyelsen udløser en tilbagevendende årlig revisionsproces"],"section":"Handel & geopolitik","headline":"Ambassador Greer Issues Statement on the USMCA Joint Review","primarySourceUrl":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review","subheadline":"USA nægtede ved fælles-gennemgangen 1. juli at forny frihandelsaftalen med Canada og Mexico »i dens nuværende form« — aftalen består, men glider nu ind i årlige revisioner.","body":["USA's handelsrepræsentant Jamieson Greer meddelte 1. juli, at USA ved den obligatoriske fælles-gennemgang af USMCA ikke vil forny aftalen »i dens nuværende form«. Frihandelsaftalen mellem USA, Mexico og Canada — der siden 2020 afløste NAFTA og dækker varehandel for ca. 2 billioner dollar årligt — ophæves ikke, men glider ind i årlige gennemgange.","USA lægger op til bilaterale spor: næste runde med Mexico er berammet til ugen omkring 20. juli, mens Canada håndteres særskilt. Uden en forlængelse aktiverer aftalens egne regler en årlig revisionsmekanisme frem mod udløbsklausulen i 2036."],"whyItMatters":"For virksomheder med forsyningskæder på tværs af den nordamerikanske grænse erstattes USMCA's langsigtede regelsikkerhed af årlig usikkerhed om told og oprindelsesregler.","analysis":"Signalet til investorer er, at nordamerikansk handelspolitik nu må prissættes som en årligt genforhandlet variabel, ikke en fast ramme — det hæver risikopræmien på grænseoverskridende investeringer.","counterpoint":"USTR understreger selv, at aftalen fortsat er i kraft: en ikke-fornyelse »i nuværende form« er ikke en opsigelse og kan ende i en revideret aftale lige så vel som i sammenbrud.","primaryExcerpt":{"quote":"The United States did not agree to renew the USMCA in its current form.","sourceUrl":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review","sourceTitle":"Ambassador Greer Issues Statement on the USMCA Joint Review"},"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/b/bb/Official_portrait_of_U.S._Trade_Representative_Jamieson_Greer_%28cropped_2%29.jpg","credit":"Foto: Office of the U.S. Trade Representative / Wikimedia Commons","alt":"USA's handelsrepræsentant Jamieson Greer","sourceUrl":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review"},"topics":["handel","told","usmca","nordamerika","geopolitik"],"entities":["USTR","Jamieson Greer","USMCA","Canada","Mexico","USA"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":92,"decisionValue":88,"novelty":80,"sourceQuality":90,"personalRelevance":55,"contrast":70},"claims":[{"text":"USA nægtede ved USMCA-gennemgangen 1. juli 2026 at forny aftalen i dens nuværende form.","sourceUrls":["https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review"],"confidence":"high"},{"text":"USA mødes med Mexico ugen omkring 20. juli til en tredje runde bilaterale forhandlinger.","sourceUrls":["https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review"],"confidence":"high"}],"sources":[{"title":"Ambassador Greer Issues Statement on the USMCA Joint Review","publisher":"Office of the United States Trade Representative","url":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review","publishedAt":"2026-07-01T00:00:00Z","kind":"primary"}]},{"id":"story-scotus-humphreys-executor-2026","eventKey":"scotus-humphreys-executor-firing-power-2026","materialFacts":["Højesteret omstødte med 6-3 Humphrey's Executor-præcedensen fra 1935 og udvidede præsidentens fyringsret over uafhængige myndigheder","Retten stadfæstede fyringen af FTC-kommissær Rebecca Slaughter","En separat 5-4-afgørelse blokerede fyringen af centralbankdirektør Lisa Cook og beskyttede Federal Reserve"],"section":"USA & institutioner","headline":"US Supreme Court hands Trump 3-1 defeat in key rulings: What we know","primarySourceUrl":"https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know","subheadline":"Højesteret omstødte den 90 år gamle Humphrey's Executor-præcedens og udvidede præsidentens ret til at fyre ledere i uafhængige myndigheder — men skærmede samtidig centralbanken.","body":["USA's højesteret gik samlet Trump imod på tre af fire punkter, men den principielt tungeste gik hans vej: med 6-3 omstødte retten Humphrey's Executor-præcedensen fra 1935 og fastslog, at præsidenten kan fyre ledere i uafhængige forbundsmyndigheder uden grund. Retten stadfæstede fyringen af FTC-kommissær Rebecca Slaughter.","I en separat 5-4-afgørelse blokerede retten fyringen af centralbankdirektør Lisa Cook og skar en undtagelse ud for Federal Reserve. Chief Justice John Roberts skrev, at »the appearance of independence is key to the Federal Reserve's design«."],"whyItMatters":"Humphrey's Executor har i næsten et århundrede skærmet uafhængige regulatorer mod politisk kontrol; dommen flytter magt til Det Hvide Hus.","analysis":"Fed-undtagelsen er det mest markedsrelevante: centralbankens uafhængighed behandles nu som et forfatningsmæssigt særtilfælde, mens resten af apparatet trækkes mod tættere præsidentiel styring.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/USSupremeCourtWestFacade.JPG/1280px-USSupremeCourtWestFacade.JPG","credit":"Foto: Wikimedia Commons","alt":"USA's højesteretsbygning i Washington D.C.","sourceUrl":"https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know"},"topics":["usa","højesteret","magtdeling","federal-reserve","regulering"],"entities":["U.S. Supreme Court","Donald Trump","Rebecca Slaughter","Lisa Cook","Federal Reserve","John Roberts"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":90,"decisionValue":78,"novelty":82,"sourceQuality":78,"personalRelevance":60,"contrast":72},"claims":[{"text":"Højesteret omstødte med 6-3 Humphrey's Executor og udvidede præsidentens fyringsret over uafhængige myndigheder.","sourceUrls":["https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know"],"confidence":"high"},{"text":"En separat 5-4-afgørelse blokerede fyringen af Fed-direktør Lisa Cook og beskyttede centralbankens uafhængighed.","sourceUrls":["https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know"],"confidence":"high"}],"sources":[{"title":"US Supreme Court hands Trump 3-1 defeat in key rulings: What we know","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know","publishedAt":"2026-06-30T00:00:00Z","kind":"reporting"}]},{"id":"story-cuba-reforms-20260620","eventKey":"cuba-176-market-reforms-2026","materialFacts":["Cuba har vedtaget en pakke med 176 økonomiske tiltag","Pakken åbner for privat bankdrift, direkte handel og diaspora-investeringer","Myndighederne advarer om langsom implementering og fortsatte sanktionsbarrierer"],"section":"Økonomi","headline":"Cuba pushes through sweeping free-market reforms in biggest economic shift since the revolution","primarySourceUrl":"https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795","subheadline":"176 tiltag udfordrer statens handelsmonopol, men amerikanske sanktioner og cubansk bureaukrati kan bremse effekten","body":["Cuba har vedtaget 176 tiltag med private banker, direkte import og eksport, friere ansættelser og investeringer fra cubanere i udlandet. Observatører kalder det øens største markedsskifte siden revolutionen.","Reformen følger fem års forværring og lange strømafbrydelser. Regeringen advarer om langsom implementering. Uden adgang til dollarbetalinger, brændstof og kapital kan flere elementer forblive juridiske muligheder uden volumen."],"whyItMatters":"Cuba flytter grænsen for privat koordinering. Det kan ændre ejerskab, prissignaler og diasporakapital i en statsstyret økonomi.","analysis":"Pakken ligner en kontrolleret kinesisk-vietnamesisk åbning uden samme kapitaladgang. Testen er, om banker får licenser, virksomheder får valuta, og staten afgiver kontrol.","counterpoint":"Tidligere reformer er strandet i bureaukrati, mens sanktioner fortsat begrænser finansiering og energi.","image":{"url":"https://dims.apnews.com/dims4/default/c3aae9d/2147483647/strip/true/crop/4001x2666+0+1/resize/980x653!/quality/90/?url=https%3A%2F%2Fassets.apnews.com%2F98%2Fe5%2Fb17b08a1412831c025d3c442d2cc%2F79ab658237c14220a7add2ec1f59188c","credit":"Kilde: Associated Press","alt":"Cubanske parlamentarikere under behandlingen af den økonomiske reformpakke","sourceUrl":"https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795"},"topics":["økonomi","Latinamerika","reformer","geopolitik"],"entities":["Cuba","Miguel Díaz-Canel","USA"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":91,"decisionValue":80,"novelty":96,"sourceQuality":90,"personalRelevance":45,"contrast":98},"claims":[{"text":"Cuba har vedtaget 176 økonomiske tiltag med privat bankdrift, direkte handel, friere ansættelser og diaspora-investeringer.","sourceUrls":["https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795","https://elpais.com/us/2026-06-19/cuba-se-abre-al-capitalismo-y-aprueba-su-mayor-reforma-en-decadas-banca-privada-mercado-de-cambios-y-fin-de-los-subsidios.html"],"confidence":"high"},{"text":"Cubanske myndigheder advarer om langsom implementering, og amerikanske sanktioner begrænser kapital- og energiadgang.","sourceUrls":["https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795"],"confidence":"high"}],"sources":[{"title":"Cuba pushes through sweeping free-market reforms in biggest economic shift since the revolution","publisher":"Associated Press","url":"https://apnews.com/article/cuba-economic-reforms-us-embargo-diaz-canel-trump-rubio-b6b8d4319d4291dde47084baa624c795","publishedAt":"2026-06-19T22:56:22Z","kind":"reporting"},{"title":"Cuba se abre al capitalismo y aprueba su mayor reforma en décadas: banca privada, mercado de cambios y fin de los subsidios","publisher":"El País","url":"https://elpais.com/us/2026-06-19/cuba-se-abre-al-capitalismo-y-aprueba-su-mayor-reforma-en-decadas-banca-privada-mercado-de-cambios-y-fin-de-los-subsidios.html","publishedAt":"2026-06-19T16:36:23Z","kind":"reporting"}]},{"id":"story-quantum-systems-series-d-20260703","eventKey":"quantum-systems-series-d","materialFacts":["Series D på cirka 1,2 mia. dollar til en værdiansættelse på 8 mia. dollar (op fra ca. 3 mia. euro i nov. 2025).","Ledet af Blackstone (US), Advent (US), Airbus (Frankrig) og Noteus (Europa); Bond, Fidelity og Elephant Lake deltog.","Ifølge selskabet Europas største forsvarsteknologiske finansieringsrunde til dato; HQ i München, Tyskland."],"headline":"Quantum Systems raises $1.2BN at $8BN valuation","primarySourceUrl":"https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","subheadline":"Blackstone, Advent og Airbus fordobler Quantum Systems til 8 mia. dollar i Europas største forsvarsteknologiske runde — medstifter lufter Stark-fusion og humanoider.","body":["Den tyske dronegigant Quantum Systems fra München har lukket en Series D på cirka 1,2 mia. dollar til en værdiansættelse på 8 mia. dollar — ifølge selskabet den største forsvarsteknologiske runde i Europa til dato og mere end en fordobling fra 3 mia. euro i november 2025.","Runden er ledet af amerikanske Blackstone og Advent, franske Airbus og europæiske Noteus, med Bond, Fidelity og Elephant Lake som deltagere. Quantum, der laver autonome luft-, land- og søbaserede droner, kalder sig profitabelt og har nu over 1,2 mia. dollar i »dry powder« til ekspansion, opkøb og opskalering af produktionen."],"whyItMatters":"Runden viser, at europæisk forsvarsteknologi nu tiltrækker amerikansk storkapital i milliardklassen — Blackstone og Advent side om side med Airbus — mens Europa opruster.","analysis":"Fordoblingen på under otte måneder afspejler både reel indtjening og skarp konkurrence om europæisk autonomi. Medstifter Florian Seibel peger nu på robotter og humanoider som næste skridt.","topics":["forsvarsteknologi","venturekapital","droner","deeptech","europæisk suverænitet","autonome systemer"],"entities":["Quantum Systems","Florian Seibel","Blackstone","Advent International","Airbus","Noteus","Stark","München","Tyskland","EIFO"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":78,"novelty":72,"sourceQuality":82,"personalRelevance":92,"contrast":55},"claims":[{"text":"Quantum Systems rejste cirka 1,2 mia. dollar i en Series D til en værdiansættelse på 8 mia. dollar, mere end en fordobling fra 3 mia. euro i november 2025.","sourceUrls":["https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark"],"confidence":"high"},{"text":"Runden blev ledet i fællesskab af Blackstone, Advent, Airbus og Noteus, med Bond, Fidelity og Elephant Lake blandt deltagerne.","sourceUrls":["https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/"],"confidence":"high"},{"text":"Medstifter Florian Seibel luftede en mulig fusion med den bevæbnede dronemager Stark, som Stark afviste, og nævnte robotter og humanoider som næste skridt.","sourceUrls":["https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark","https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/"],"confidence":"high"},{"text":"Selskabet kalder sig profitabelt og siger nu at have over 1,2 mia. dollar i »dry powder« til ekspansion, opkøb og produktion.","sourceUrls":["https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/"],"confidence":"high"}],"sources":[{"title":"Quantum Systems raises $1.2BN at $8BN valuation","publisher":"Tech.eu","url":"https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","publishedAt":"2026-07-02T00:00:00Z","kind":"reporting"},{"title":"Drone maker Quantum Systems raises $1.2bn, eyes humanoids","publisher":"Sifted","url":"https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark","publishedAt":"2026-07-02T00:00:00Z","kind":"reporting"},{"title":"Quantum Systems Raises $1.2Bn Series D to Accelerate Growth and Scale Software-Defined Autonomous Systems Across Air, Land and Sea","publisher":"Quantum Systems","url":"https://quantum-systems.com/us/news/quantum-systems-raises-1-2bn-series-d-to-accelerate-growth-and-scale-software-defined-autonomous-systems-across-air-land-and-sea/","publishedAt":"2026-07-02T00:00:00Z","kind":"primary"},{"title":"Quantum Systems More Than Doubles Valuation to $8 Billion in New Round","publisher":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-07-02/quantum-systems-more-than-doubles-valuation-to-8-billion-in-new-round","publishedAt":"2026-07-02T00:00:00Z","kind":"reporting"}],"counterpoint":"Stark afviser kategorisk en fusion (»Der er ingen planer om at fusionere med Quantum Systems«), og Quantum siger selv, der ingen køreplan er — så Seibels sammenlægningstanke er indtil videre spekulation, ikke en aftale.","primaryExcerpt":{"quote":"We are profitable, deployed around the world and with the latest financing round we now have more than $1.2Bn of dry powder to execute.","sourceUrl":"https://tech.eu/2026/07/02/quantum-systems-raises-12bn-at-8bn-valuation/","sourceTitle":"Quantum Systems raises $1.2BN at $8BN valuation"},"image":{"url":"https://images.sifted.eu/wp-content/uploads/2025/05/13133934/QS_Florian-Seibel-1-e1756712413500.png?w=1110&h=876&q=75&fit=crop&auto=compress,format","credit":"Sifted / Quantum Systems","alt":"Quantum Systems-medstifter Florian Seibel, hvis selskab rejste 1,2 mia. dollar til en værdiansættelse på 8 mia. dollar.","sourceUrl":"https://sifted.eu/articles/quantum-systems-fundraise-humanoids-merger-stark"},"section":"Forsvarsteknologi & kapital"},{"id":"story-us-iran-hormuz-20260628","eventKey":"us-iran-strikes-hormuz-bahrain-kuwait-2026-06","materialFacts":["Irans Revolutionsgarde affyrede missiler og droner mod den amerikanske base Ali Al Salem i Kuwait og mod 5. flådes hovedkvarter i Bahrain","USA bombede for anden dag i træk iranske mål ved Sirik, Bandar-e Lengeh og Qeshm","Ingen amerikanske tab er meldt, mens olieprisen samtidig faldt til det laveste siden februar"],"section":"Sikkerhed","headline":"Iran war day 121: Iran attacks Bahrain, Kuwait as US strikes near Hormuz","primarySourceUrl":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz","subheadline":"Iran ramte amerikanske baser i Golfen, efter at USA for anden dag bombede mål nær Hormuzstrædet","body":["USA og Iran eskalerede voldsomt i weekenden. Irans Revolutionsgarde affyrede missiler og droner mod den amerikanske base Ali Al Salem i Kuwait og mod USA's 5. flådes hovedkvarter i Bahrain. Bahrain aktiverede luftalarmer, og Kuwait sit luftforsvar. USA meldte ingen tab.","Angrebene fulgte, efter at USA for anden dag bombede iranske mål ved Sirik, Bandar-e Lengeh og Qeshm. Udløseren var ifølge centralkommandoen et iransk droneangreb mod et handelsskib nær Hormuzstrædet."],"whyItMatters":"Direkte iranske angreb på amerikanske baser i Golfen er en markant eskalation af en ellers skrøbelig våbenhvile. Golfstaterne huser tusindvis af amerikanske soldater.","analysis":"Markederne reagerede modsat: Trods angrebene faldt Brent fredag til omkring 72 dollar – det laveste siden 27. februar – fordi trafikken gennem Hormuz blev genoptaget. For dansk inflation betyder strædets åbenhed mere end antallet af angreb.","image":{"url":"https://upload.wikimedia.org/wikipedia/commons/1/16/Strait_of_Hormuz_and_Musandam_Peninsula_%28MODIS_2018-12-10%29.jpg","credit":"Foto: NASA/Wikimedia Commons","alt":"Satellitbillede af Hormuzstrædet og Musandam-halvøen","sourceUrl":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"},"topics":["sikkerhed","Mellemøsten","energi","geopolitik"],"entities":["USA","Iran","Bahrain","Kuwait","IRGC","Hormuzstrædet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":62,"novelty":64,"sourceQuality":76,"personalRelevance":40,"contrast":66},"claims":[{"text":"IRGC angreb den amerikanske base Ali Al Salem i Kuwait og 5. flådes hovedkvarter i Bahrain med missiler og droner.","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"],"confidence":"high"},{"text":"USA bombede for anden dag i træk iranske mål ved Sirik, Bandar-e Lengeh og Qeshm.","sourceUrls":["https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz"],"confidence":"high"},{"text":"Brent faldt til omkring 72 dollar, det laveste siden 27. februar, da trafikken gennem Hormuz blev genoptaget.","sourceUrls":["https://www.cnbc.com/2026/06/27/tanker-struck-in-strait-of-hormuz-as-us-iran-tensions-escalate.html"],"confidence":"medium"}],"sources":[{"title":"Iran war day 121: Iran attacks Bahrain, Kuwait as US strikes near Hormuz","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/28/iran-war-day-121-iran-attacks-bahrain-kuwait-as-us-strikes-near-hormuz","publishedAt":"2026-06-28T04:00:00Z","kind":"reporting"},{"title":"Tanker struck in Strait of Hormuz as U.S.-Iran tensions escalate","publisher":"CNBC","url":"https://www.cnbc.com/2026/06/27/tanker-struck-in-strait-of-hormuz-as-us-iran-tensions-escalate.html","publishedAt":"2026-06-27T12:00:00Z","kind":"reporting"}]},{"id":"bf-20260623-iran","eventKey":"us-iran-nuclear-deal","materialFacts":["USA's vicepræsident JD Vance meldte om markant fremgang i atomforhandlingerne med Iran","Forhandlingerne i Schweiz involverede mæglere fra Qatar og Pakistan","Iran indvilligede i at lade atominspektører vende tilbage til landet","Parterne enedes om en køreplan mod en endelig aftale inden for 60 dage","USA fastholder, at Iran har accepteret at lade FN-inspektører vende tilbage — trods iranske benægtelser","Parterne henviser til et aftalememorandum om at ophæve blokaden og genåbne Hormuzstrædet","Iran lukkede ifølge egne udmeldinger strædet igen med henvisning til israelske angreb i Libanon","Et 60-dages forhandlingsvindue om atomprogrammet løber fortsat"],"section":"Verden","headline":"Iran-aftalen knager: uenighed om inspektører og Hormuzstrædet","primarySourceUrl":"https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis","subheadline":"Washington og Teheran er uenige om, hvad der blev aftalt, mens israelske angreb i Libanon presser våbenhvilen","body":["Dagen efter meldingerne om fremgang i Schweiz trækker den amerikansk-iranske aftale i flere retninger. USA fastholder, at Iran har accepteret at lade FN-inspektører vende tilbage, mens Teheran benægter at have givet et sådant tilsagn.","Parterne henviser til et aftalememorandum, hvor USA ophæver blokaden af iranske havne, mens Iran genåbner Hormuzstrædet i en periode. Men Iran har ifølge egne udmeldinger lukket strædet igen med henvisning til fortsatte israelske angreb i det sydlige Libanon, som Teheran kalder et brud på aftalen.","Et 60-dages vindue til at forhandle om atomprogrammet løber fortsat, men de modstridende udlægninger viser, hvor skrøbelig nedtrapningen er."],"whyItMatters":"Hvis våbenhvilen brydes, kan det igen lukke Hormuzstrædet, presse oliepriserne og trække konflikten i Libanon med ind i en bredere optrapning.","analysis":"Mønstret gentager sig: hver delaftale afhænger af forhold, parterne ikke fuldt kontrollerer — her Israels handlinger i Libanon. Uenigheden om inspektører er ikke et teknisk detaljespørgsmål, men kernen i, om verifikation overhovedet kan bære en endelig aftale.","topics":["geopolitik","iran","usa"],"entities":["USA","Iran","Israel","Libanon"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":84,"decisionValue":62,"novelty":66,"sourceQuality":80,"personalRelevance":48,"contrast":58},"claims":[{"text":"USA fastholder iransk tilsagn om inspektører, mens Iran benægter og melder strædet lukket igen","sourceUrls":["https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis","https://www.pbs.org/newshour/show/june-23-2026-pbs-news-hour-full-episode"],"confidence":"medium"}],"sources":[{"title":"2026 Strait of Hormuz crisis","publisher":"Wikipedia","url":"https://en.wikipedia.org/wiki/2026_Strait_of_Hormuz_crisis","publishedAt":"2026-06-23T08:00:00.000Z","kind":"reporting"},{"title":"June 23, 2026 - PBS News Hour full episode","publisher":"PBS NewsHour","url":"https://www.pbs.org/newshour/show/june-23-2026-pbs-news-hour-full-episode","publishedAt":"2026-06-23T22:00:00.000Z","kind":"reporting"}]},{"id":"us-venture-h1-2026-ai-concentration-20260710","eventKey":"us-venture-h1-2026-ai-concentration","materialFacts":["Amerikansk venturekapital nåede 412,7 mia. dollar i første halvår af 2026 — knap 30 procent mere end hele 2025 tilsammen (PitchBook)","AI-selskaber lagde beslag på 355,9 mia. dollar, svarende til omkring 86 procent af hver venturedollar i perioden","Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital"],"section":"Marked","headline":"PitchBook: US venture funding hits $412.7B in first half as AI deals dominate","primarySourceUrl":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/","subheadline":"Venturekapitalen satte halvårsrekord — men næsten hver eneste dollar samlede sig om kunstig intelligens og de allerstørste runder.","body":["Amerikansk venturekapital nåede 412,7 mia. dollar i første halvår af 2026 — knap 30 procent mere end hele 2025 tilsammen, viser tal fra PitchBook. Men kapitalen samler sig: AI-selskaber tog 355,9 mia. dollar, omkring 86 procent af hver venturedollar i perioden.","Koncentrationen gælder også rundestørrelsen. Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital, mens de tidlige, brede væddemål måtte deles om resten. USA trækker næsten hele læsset."],"whyItMatters":"Når 86 procent af pengene ligger i store AI-runder, er markedet ekstremt eksponeret mod én tese og mod få meget store selskaber.","analysis":"Det er ikke et bredt opsving, men en satsning på, at agentisk AI og infrastruktur tjener de enorme runder hjem — og det efterlader seed, ikke-AI og Europa relativt kapitalfattige.","counterpoint":"PitchBook måler dollar, ikke afkast. Koncentrationen kan lige så vel afspejle, at de bedste muligheder faktisk ligger i AI, som at markedet overopheder.","image":{"url":"https://d15shllkswkct0.cloudfront.net/wp-content/blogs.dir/1/files/2020/10/sandhillroad.jpg","credit":"Kilde: SiliconANGLE","alt":"Sand Hill Road, det traditionelle centrum for amerikansk venturekapital","sourceUrl":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"},"topics":["venturekapital","marked","ai","koncentration","usa"],"entities":["PitchBook","USA","kunstig intelligens"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":86,"decisionValue":88,"novelty":72,"sourceQuality":80,"personalRelevance":90,"contrast":58},"claims":[{"text":"Amerikansk venturekapital nåede 412,7 mia. dollar i H1 2026, og AI-selskaber tog 355,9 mia. dollar (ca. 86 procent).","sourceUrls":["https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"],"confidence":"high"},{"text":"Mega-runder på 100 mio. dollar og derover stod for 87,5 procent af al udbetalt kapital.","sourceUrls":["https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/"],"confidence":"high"}],"sources":[{"title":"PitchBook: US venture funding hits $412.7B in first half as AI deals dominate","publisher":"SiliconANGLE","url":"https://siliconangle.com/2026/07/09/pitchbook-us-venture-funding-hits-412-7b-first-half-ai-deals-dominate/","publishedAt":"2026-07-09T04:01:00.000Z","kind":"reporting"}]},{"id":"bf-20260622-starmer","eventKey":"uk-starmer-resignation","materialFacts":["Keir Starmer meddelte mandag 22. juni 2026 sin afgang som premierminister og Labour-leder","Det bliver Storbritanniens syvende regeringschef på et årti","Greater Manchester-borgmester Andy Burnham peges på som favorit til at overtage","Nomineringer til ledervalget åbner 9. juli; Starmer bliver siddende indtil valget er afgjort"],"section":"Verden","headline":"Starmer trækker sig som britisk premierminister","primarySourceUrl":"https://www.cnn.com/2026/06/22/world/live-news/keir-starmer-uk-pm","subheadline":"Måneders pres fra egne rækker og Reform UK's fremmarch vælter Labour-lederen mindre end to år inde i mandatet","body":["Keir Starmer meddelte mandag, at han træder tilbage som premierminister og leder af Labour. Beslutningen følger måneders pres fra Labour-parlamentarikere og ministre, der har været stadig mere bekymrede for partiets valgudsigter efter elendige lokalvalg i maj og det højrenationale Reform UK's hurtige fremmarch.","Starmer vandt stort ved valget i 2024 på et løfte om stabilitet efter de konservatives kaos, men kaster nu håndklædet i ringen mindre end to år inde i regeringsperioden. Analytikere venter, at afgangen baner vej for Greater Manchester-borgmester Andy Burnham; tidligere sundhedsminister Wes Streeting har meddelt, at han bakker Burnham op og dermed trækker sig som mulig rival.","Starmer har bedt Labours hovedbestyrelse om at fastlægge tidsplanen for valget af en efterfølger. Nomineringer åbner 9. juli, og processen skal være afsluttet inden sommerferien. Indtil da forbliver Starmer i embedet."],"whyItMatters":"En af EU's vigtigste nabolande får sin syvende regeringschef på ti år midt i en højredrejning, der kan ændre britisk politik og forholdet til kontinentet.","analysis":"Skiftet handler mindre om én fejl end om en akkumuleret tillidskrise: et stort flertal uden tydeligt projekt, der eroderede, da Reform UK satte dagsordenen. En Burnham-ledelse vil blive læst som et venstresving i stil og retorik, men de strukturelle problemer — vækst, velfærdsfinansiering, migration — venter uændret på efterfølgeren.","topics":["britisk politik","europa"],"entities":["Keir Starmer","Labour","Andy Burnham","Reform UK"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":60,"novelty":80,"sourceQuality":90,"personalRelevance":55,"contrast":50},"claims":[{"text":"Starmer meddelte 22. juni 2026 sin afgang som premierminister og Labour-leder","sourceUrls":["https://www.cnn.com/2026/06/22/world/live-news/keir-starmer-uk-pm","https://www.npr.org/2026/06/22/nx-s1-5866231/keir-starmer-resigns"],"confidence":"high"},{"text":"Andy Burnham peges på som favorit til at efterfølge Starmer","sourceUrls":["https://www.aljazeera.com/news/2026/6/22/why-has-keir-starmer-resigned-as-uk-prime-minister-and-who-will-take-over"],"confidence":"medium"}],"sources":[{"title":"June 22, 2026: Keir Starmer resignation, UK to get sixth PM in seven years, as Andy Burnham likely to replace him","publisher":"CNN","url":"https://www.cnn.com/2026/06/22/world/live-news/keir-starmer-uk-pm","publishedAt":"2026-06-22T11:00:00.000Z","kind":"reporting"},{"title":"Keir Starmer has resigned, paving way for a 7th U.K. prime minister in 10 years","publisher":"NPR","url":"https://www.npr.org/2026/06/22/nx-s1-5866231/keir-starmer-resigns","publishedAt":"2026-06-22T12:30:00.000Z","kind":"reporting"},{"title":"Why has Keir Starmer resigned as UK prime minister, and who will take over?","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/6/22/why-has-keir-starmer-resigned-as-uk-prime-minister-and-who-will-take-over","publishedAt":"2026-06-22T14:00:00.000Z","kind":"analysis"}]},{"id":"story-lindsey-graham-death-20260713","eventKey":"lindsey-graham-death-2026-07","materialFacts":["US Senator Lindsey Graham (Republican, South Carolina) died at age 71 on the night of Saturday, July 11, 2026, hours after returning from a trip to Ukraine where he had met President Volodymyr Zelenskyy; his office said he died from a 'brief and sudden illness.'","The preliminary cause of death, per medical examiner findings released July 12, 2026, is aortic dissection (a tear/rupture of the aortic wall) due to arteriosclerotic cardiovascular disease; EMS responded to a cardiac-arrest call at his Capitol Hill home.","Graham was first elected to the US Senate in 2002 (serving since 2003), had recently won his Republican primary, and was seeking a fifth term in the November 3, 2026 election.","Under South Carolina law, Republican Governor Henry McMaster appoints an interim replacement, who would serve until January 3, 2027."],"section":"Politik","headline":"Sen. Lindsey Graham dies at 71 from aortic dissection, according to medical examiner's preliminary findings","primarySourceUrl":"https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","subheadline":"Den mangeårige republikanske senator fra South Carolina døde natten til søndag, kort efter en rejse til Ukraine.","body":["Senator Lindsey Graham (R-South Carolina) døde 71 år gammel natten til søndag den 11. juli, timer efter et besøg hos præsident Zelenskyj i Ukraine. Retsmedicinernes foreløbige konklusion 12. juli peger på en aortadissektion som følge af åreforkalkning efter et hjertestop i hjemmet.","Graham blev valgt til Senatet i 2002 og stillede op til en femte periode 3. november. Efter South Carolinas lov udpeger guvernør Henry McMaster (R) nu en midlertidig afløser frem til 3. januar 2027, hvorefter pladsen besættes ved midtvejsvalget."],"whyItMatters":"Grahams død fjerner en af Trumps mest markante udenrigspolitiske allierede i Senatet og udløser et opgør om en sikker republikansk plads.","analysis":"Med en snæver magtbalance kan selv én tom plads påvirke afstemninger, og nomineringskampen tester Trump-fløjens styrke i South Carolina.","topics":["politik","USA","Senatet","valg"],"entities":["Lindsey Graham","USA","South Carolina","Henry McMaster","Donald Trump"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":85,"decisionValue":45,"novelty":88,"sourceQuality":88,"personalRelevance":40,"contrast":55},"claims":[{"text":"US Senator Lindsey Graham (R-South Carolina) died at 71 on the night of Saturday, July 11, 2026, confirmed by his office and multiple independent outlets.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.npr.org/2026/07/12/nx-s1-5890790/us-sen-lindsey-graham-dies"],"confidence":"high"},{"text":"Preliminary medical examiner findings give the cause of death as aortic dissection due to arteriosclerotic cardiovascular disease.","sourceUrls":["https://www.cbsnews.com/news/senator-lindsey-graham-dies-after-brief-and-sudden-illness/","https://www.washingtonpost.com/politics/2026/07/12/lindsey-graham-longtime-south-carolina-senator-dies-71/"],"confidence":"high"},         synth.speak(utterance);
      }
      playing = true;
      api.onstatechange?.("playing");
    };
    const api = {
      onstatechange: null,
      play() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
          return;
        }
        speakFrom(0);
      },
      pause() {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          playing = false;
          api.onstatechange?.("paused");
        }
      },
      resume() {
        if (synth.paused) {
          synth.resume();
          playing = true;
          api.onstatechange?.("playing");
        }
      },
      toggle() {
        if (synth.speaking && !synth.paused) {
          api.pause();
        } else if (synth.paused) {
          api.resume();
        } else {
          speakFrom(0);
        }
      },
      stop() {
        synth.cancel();
        index = 0;
        playing = false;
        api.onstatechange?.("stopped");
      },
      get isPlaying() {
        return playing;
      }
    };
    return api;
  }
  function bindAudio(brief, synth = globalThis.speechSynthesis) {
    const slot = document.querySelector("#audio-controls");
    if (!slot) return null;
    const narrator = createNarrator(brief, synth);
    if (!narrator) {
      slot.hidden = true;
      return null;
    }
    slot.hidden = false;
    const toggleButton = element("button", "audio-button audio-toggle", "H\xF8r briefen");
    toggleButton.type = "button";
    toggleButton.setAttribute("aria-pressed", "false");
    const stopButton = element("button", "audio-button audio-stop", "Stop");
    stopButton.type = "button";
    stopButton.disabled = true;
    narrator.onstatechange = (state) => {
      const active = state === "playing";
      toggleButton.textContent = active ? "Pause" : state === "paused" ? "Forts\xE6t" : "H\xF8r briefen";
      toggleButton.setAttribute("aria-pressed", String(active));
      stopButton.disabled = state === "stopped";
    };
    toggleButton.addEventListener("click", () => narrator.toggle());
    stopButton.addEventListener("click", () => narrator.stop());
    globalThis.addEventListener?.("beforeunload", () => narrator.stop());
    slot.replaceChildren(toggleButton, stopButton);
    return narrator;
  }
  function renderDaily(brief) {
    switch (readLayout()) {
      case "magazine":
        return renderMagazineDaily(brief);
      case "feed":
        return renderFeedDaily(brief);
      default:
        return renderBrief(brief);
    }
  }
  function bootArchive(index = globalThis.__BRIEF_DATA__) {
    applyLayout();
    const root = document.querySelector("#archive-root");
    if (root) {
      root.replaceChildren(renderArchiveBrowser(index ?? { years: [] }));
    }
    bindEditionNav("archive");
    bindLayoutNav();
  }
  function boot(brief = globalThis.__BRIEF_DATA__) {
    if (!brief) return;
    const kind = brief.kind === "weekly" || brief.kind === "monthly" || brief.kind === "yearly" ? brief.kind : "daily";
    applyLayout();
    if (kind === "weekly") {
      renderWeekly(brief);
    } else if (kind === "monthly") {
      renderMonthly(brief);
    } else if (kind === "yearly") {
      renderYearly(brief);
    } else {
      renderDaily(brief);
    }
    bindFeedback();
    bindAudio(brief);
    bindEditionNav(kind);
    bindLayoutNav();
    renderReadLater(document.querySelector("#read-later"));
    bindReadLater();
  }
  if (typeof document !== "undefined") {
    if (document.querySelector("#archive-root")) {
      bootArchive();
    } else if (document.querySelector("#lead-story") || document.querySelector("#featured-grid")) {
      boot();
    }
  }
})();
</script>
</body>
</html>
