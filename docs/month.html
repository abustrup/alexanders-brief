  <style>/* ==========================================================================
   Design tokens — four reader-selectable directions
   --------------------------------------------------------------------------
   The brief ships four visual directions (editorial · magazine · feed · dark),
   chosen with the "Vis som" switcher and persisted per device. Each direction
   only needs to override the canonical tokens below; every component rule reads
   them (directly, or through the legacy aliases that the original daily/weekly/
   monthly CSS already used). Custom properties resolve at substitution time, so
   overriding e.g. --bg inside a [data-layout] block re-skins every rule that
   reads var(--paper) without touching the rule itself.
   Values are taken verbatim from the design handoff prototypes.
   ========================================================================== */
:root {
  color-scheme: light;

  /* Structural constants shared by every direction. */
  --container: min(1180px, 94vw);
  --tap-min: 44px;
  --fb-size: 44px;
  --fb-radius: 50%;
  --fb-border-width: 1.5px;

  /* Canonical theme tokens — default values are the Editorial direction. */
  --bg: #f6efe4;
  --surface: #efe4d3;
  --ink: #1b1714;
  --muted: #6b6358;
  --body-soft: #403c37;
  --rule: #cdbfa9;
  --accent: #a3122c;
  /* AA-safe accent for small text/pills on light backgrounds (the vibrant
     magazine/feed accents fail contrast at label sizes; editorial/dark pass). */
  --accent-ink: var(--accent);
  --teal: #0b6769;
  --green: #2f6b4f;
  --blue: #2a3f59;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --media-filter: none;
  --media-radius: 0;

  /* Feedback control palette (see .feedback-button). */
  --fb-more: #2f6b4f;
  --fb-less: var(--accent);
  --fb-icon: var(--muted);
  --fb-icon-active: #fff;
  --fb-bg: transparent;
  --fb-border-color: var(--rule);

  /* Legacy aliases — the original component CSS (and weekly/monthly) read these. */
  --shell: var(--container);
  --paper: var(--bg);
  --paper-deep: var(--surface);
  --red: var(--accent);
  --serif: var(--font-display);
  --sans: var(--font-label);
}

/* ---- Mørk (dark) : same document structure as Editorial, dark palette ---- */
:root[data-layout="dark"] {
  color-scheme: dark;
  --bg: #14110d;
  --surface: #1c1813;
  --ink: #ece6db;
  --muted: #8a8073;
  --body-soft: #c4bcae;
  --rule: #322c24;
  --accent: #e0a955;
  --teal: #54b9ab;
  --green: #54b9ab;
  --blue: #54b9ab;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --media-filter: brightness(0.9);
  --media-radius: 3px;
  --fb-more: #54b9ab;
  --fb-less: #e0726f;
  --fb-icon: #8a8073;
  --fb-icon-active: #14110d;
  --fb-bg: transparent;
  --fb-border-color: #4a3f33;
}

/* ---- Magasin (magazine) : bold serif, image-forward (see [data-layout=magazine] rules) ---- */
:root[data-layout="magazine"] {
  --bg: #fbf7f0;
  --surface: #efe7d8;
  --ink: #16120e;
  --muted: #6b6358;
  --rule: #cdbfa9;
  --accent: #e1452b;
  --accent-ink: #b3122e;
  --teal: #0b6769;
  --green: #1f6f55;
  --blue: #16120e;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-label: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-label);
  --fb-more: #1f6f55;
  --fb-less: var(--accent);
  --fb-size: 46px;
}

/* ---- Feed : mobile app, single card column (see [data-layout=feed] rules) ---- */
:root[data-layout="feed"] {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #6b7280;
  --rule: #f1f2f4;
  --accent: #e23b46;
  --accent-ink: #c41230;
  --teal: #18a06b;
  --green: #18a06b;
  --blue: #14171c;
  --font-display: "Manrope", system-ui, sans-serif;
  --font-label: "Manrope", system-ui, sans-serif;
  --font-body: var(--font-label);
  --media-radius: 14px;
  --fb-more: #18a06b;
  --fb-less: var(--accent);
  --fb-icon: #3f4651;
  --fb-icon-active: #fff;
  --fb-bg: #f1f2f4;
  --fb-border-width: 0;
  --fb-border-color: transparent;
}

/* showImages=false → text-only brief (the prototypes' second tweakable prop). */
:root[data-images="off"] .story-media,
:root[data-images="off"] .recommendation-media,
:root[data-images="off"] .mag-hero-media,
:root[data-images="off"] .feed-card-media { display: none !important; }

/* ---- Mørk signature details (low-light reading) ---- */
:root[data-layout="dark"] .masthead {
  border-bottom: 0;
  padding-bottom: 24px;
}
:root[data-layout="dark"] .masthead::after {
  content: "";
  display: block;
  width: 64px;
  height: 2px;
  margin: 22px auto 0;
  background: var(--accent);
  box-shadow: 0 0 18px rgba(224, 169, 85, 0.55);
}
:root[data-layout="dark"] .key-number-value {
  text-shadow: 0 0 26px rgba(224, 169, 85, 0.32);
}
:root[data-layout="dark"] .story-media,
:root[data-layout="dark"] .recommendation-media {
  box-shadow: inset 0 0 0 1px rgba(236, 230, 219, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--paper); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.52;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }
button { font: inherit; }

.masthead {
  width: var(--shell);
  margin: 0 auto;
  padding: 18px 0 15px;
  border-bottom: 5px double var(--ink);
  text-align: center;
}

.masthead-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.masthead-meta p { margin: 0; }

.masthead h1 {
  margin: 12px 0 2px;
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.92;
}

.masthead-dek {
  max-width: 760px;
  margin: 11px auto 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1rem, 1.5vw, 1.18rem);
  line-height: 1.4;
}

.audio-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 13px 0 1px;
}

.audio-button {
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.audio-toggle[aria-pressed="true"] {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

.audio-button:hover,
.audio-button:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.4);
  outline-offset: 2px;
}

.audio-button:disabled {
  border-color: var(--rule);
  color: var(--muted);
  cursor: default;
  opacity: 0.55;
}

.page-shell {
  width: var(--shell);
  margin: 24px auto 64px;
}

/* Moved below the news, just above the recommendations. */
/* Klummen — the AI editor's own column. Styled to be unmistakable as NOT
   reported news within three seconds, before a word is read: no image, no
   photo frame, a hairline bracket instead of the news rules, an italic serif
   voice the news column never uses, and an inset that visibly steps out of
   the story grid. That legibility is a disclosure requirement, not taste.
   Spec: docs/superpowers/specs/2026-07-25-klummen-design.md */
/* The explicit save control sits with the primary-source link: both are things
   the reader DOES with an article, as opposed to the feedback panel below, which
   is a judgement about it. Saving must never look like voting. */
/* Discovery credit — visually a quiet aside, NOT a source chip. It must not read
   as evidence: no border, no chip shape, smaller and lighter than the
   "Dokumentation" row it sits beneath. */
.story-discovery {
  margin: 8px 0 0;
  font-size: 0.7rem;
  letter-spacing: 0.01em;
  opacity: 0.72;
}

.story-discovery-label {
  margin-right: 6px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.6rem;
}

.story-discovery-link {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.story-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: baseline;
  margin: 14px 0 0;
}

.save-later-button {
  padding: 5px 11px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 0.74rem;
  letter-spacing: 0.01em;
}

.save-later-button:hover {
  border-color: var(--ink);
}

.save-later-button[aria-pressed="true"] {
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 700;
}

.read-later-item.is-opened .read-later-link {
  opacity: 0.62;
}

.klumme-slot {
  margin: 30px 0 0;
}

.klumme {
  display: block;
  padding: 22px 26px 24px;
  border-left: 3px solid var(--accent);
  background: transparent;
}

.klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.01em;
}

.klumme-byline {
  margin: 8px 0 14px;
  max-width: 52ch;
  color: var(--muted, var(--ink));
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0.78;
}

.klumme-thesis {
  margin: 0 0 12px;
  max-width: 60ch;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-style: italic;
  line-height: 1.5;
}

.klumme-body {
  max-width: 62ch;
}

.klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.62;
}

.klumme-uncertainty {
  margin: 16px 0 0;
  padding: 12px 14px;
  max-width: 62ch;
  border: 1px dashed var(--rule);
}

.klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.88rem;
  line-height: 1.55;
}

.klumme-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: baseline;
  margin: 14px 0 0;
}

.klumme-sources-label {
  color: var(--accent);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.klumme-source {
  font-size: 0.76rem;
}

/* Magasin: a full-width band, but never the inverted mag-keynumber treatment —
   that block's authority belongs to a sourced figure, not to opinion. */
.mag-klumme .mag-inner {
  max-width: 70ch;
}

.mag-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.mag-klumme-title {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-style: italic;
  font-weight: 600;
  line-height: 1.12;
}

.mag-klumme-byline {
  margin: 10px 0 18px;
  font-size: 0.74rem;
  line-height: 1.45;
  opacity: 0.75;
}

.mag-klumme-thesis {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 1.12rem;
  font-style: italic;
  line-height: 1.5;
}

.mag-klumme-paragraph {
  margin: 0 0 12px;
  font-size: 1rem;
  line-height: 1.66;
}

.mag-klumme-uncertainty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px dashed var(--rule);
}

.mag-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.92rem;
  line-height: 1.55;
}

/* Feed: a card that deliberately breaks the card rhythm — no media block, no
   feedback row, an accent spine instead of the story border. */
.feed-klumme {
  border-left: 3px solid var(--accent);
}

.feed-klumme-kicker {
  display: block;
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.feed-klumme-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 600;
  line-height: 1.2;
}

.feed-klumme-byline {
  margin: 8px 0 12px;
  font-size: 0.7rem;
  line-height: 1.45;
  opacity: 0.75;
}

.feed-klumme-thesis {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1rem;
  font-style: italic;
  line-height: 1.5;
}

.feed-klumme-paragraph {
  margin: 0 0 10px;
  font-size: 0.94rem;
  line-height: 1.6;
}

.feed-klumme-uncertainty {
  margin: 14px 0 0;
  padding: 12px 14px;
  border: 1px dashed var(--rule);
}

.feed-klumme-uncertainty-text {
  margin: 6px 0 0;
  font-size: 0.86rem;
  line-height: 1.55;
}

.key-number-slot {
  margin: 26px 0 6px;
}

.key-number {
  display: block;
  padding: 16px 20px 18px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--teal);
  background: var(--paper-deep);
}

.key-number-kicker {
  display: block;
  color: var(--teal);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.key-number-label {
  margin: 6px 0 2px;
  font-family: var(--serif);
  font-size: 1.04rem;
  font-weight: 700;
  line-height: 1.2;
}

.key-number-figure-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  margin: 4px 0 2px;
}

.key-number-figure {
  margin: 0;
  font-family: var(--serif);
  line-height: 1;
}

.key-number-value {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.key-number-unit {
  margin-left: 7px;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 0.92rem;
  font-weight: 700;
}

.key-number-sparkline {
  width: 132px;
  height: 40px;
  margin-bottom: 4px;
}

.sparkline-line {
  stroke: var(--teal);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.sparkline-dot {
  fill: var(--red);
}

.key-number-asof {
  margin: 4px 0 0;
  color: var(--accent-ink);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.key-number-caption {
  margin: 7px 0 0;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 0.92rem;
  font-style: italic;
  line-height: 1.34;
}

.key-number-source {
  display: inline-block;
  margin-top: 9px;
  font-size: 0.74rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

/* Editorial broadsheet: the lead article and the signals rail sit side by side
   and wrap to one column on narrow viewports (intrinsic, no media query). */
.lead-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 34px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

#lead-story { flex: 1 1 540px; min-width: 0; }

.story {
  min-width: 0;
}

/* Lead is stacked internally: image on top, then the full article body. */
.story-lead { display: block; }

/* Front-page hero image stays decisively landscape at every width, so a wide
   source photo is never cropped into a tall portrait slice. */
.story-lead .story-media {
  aspect-ratio: 16 / 9;
  margin: 0 0 16px;
}

.expanded-news,
.short-news-section {
  margin-top: 14px;
}

.section-heading {
  margin: 0;
  padding: 11px 0 9px;
  border-bottom: 1px solid var(--ink);
  font-family: var(--font-label);
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
}

/* Story grid is intrinsically responsive: 2 columns on desktop, 1 below ~900px
   (handoff: auto-fit, minmax(min(100%, 400px), 1fr)). */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.story-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}

.story-media {
  position: relative;
  aspect-ratio: 3 / 2;
  margin: 0 0 15px;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.story-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.story-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.story-media-link:hover img,
.story-media-link:focus-visible img { transform: scale(1.012); }

.media-fallback {
  display: grid;
  place-items: end start;
  padding: 18px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--teal) 16%, transparent), transparent 55%),
    var(--surface);
}

.media-fallback-label {
  max-width: 90%;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1;
}

.image-credit {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 1;
  max-width: calc(100% - 14px);
  padding: 2px 5px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.66);
  color: #fff;
  font-size: 0.62rem;
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.image-credit:hover,
.image-credit:focus-visible { text-decoration: underline; }

.story-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin: 0 0 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.outside-profile {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--blue);
}

.story-byline,
.signal-meta {
  margin: 0 0 7px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.story-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 2.9rem);
  font-weight: 800;
  hyphens: auto;
  letter-spacing: -0.035em;
  line-height: 1;
}

.story-card .story-headline {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.06;
}

.headline-link { text-decoration: none; }

.headline-link:hover,
.headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.story-subheadline {
  margin: 10px 0 12px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(1.1rem, 1.7vw, 1.32rem);
  line-height: 1.34;
}

.story-card .story-subheadline {
  font-size: 1.04rem;
}

.story-body,
.editorial-continuation {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.story-body p,
.editorial-continuation p { margin: 0 0 0.78em; }

.editorial-continuation { margin-top: 0.1rem; }
.story-interpretation { color: var(--body-soft); }

.counterpoint-box {
  margin-top: 0.3rem;
  padding: 0.72rem 0 0.05rem;
  border-top: 1px solid var(--teal);
  font-size: 0.88rem;
}

.insight-label,
.source-label {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.insight-label { color: var(--teal); }
.counterpoint-box p { margin: 3px 0 0.65em; }

.primary-excerpt-box {
  margin-top: 0.55rem;
  padding: 0.7rem 0.85rem 0.75rem;
  border-left: 3px solid var(--blue);
  background: rgba(38, 61, 92, 0.05);
  font-size: 0.88rem;
}

.primary-excerpt-label { color: var(--blue); }

.primary-excerpt-quote {
  margin: 5px 0 0;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-style: italic;
  line-height: 1.4;
}

.primary-excerpt-quote::before { content: "\201C"; }
.primary-excerpt-quote::after { content: "\201D"; }

.primary-excerpt-source {
  display: inline-block;
  margin-top: 7px;
  font-size: 0.72rem;
  font-weight: 700;
  text-underline-offset: 2px;
}

.primary-source-link {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 5px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.primary-source-link:hover,
.primary-source-link:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.story-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.72rem;
}

.source-link { text-underline-offset: 2px; }

.feedback-panel {
  margin-top: auto;
  padding-top: 17px;
}

/* Two round icon buttons (thumb up / thumb down), per the handoff. The icon and
   active colours come from the theme tokens, so each direction recolours them. */
.feedback-actions {
  display: flex;
  gap: 10px;
}

.feedback-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--fb-size);
  height: var(--fb-size);
  padding: 0;
  border: var(--fb-border-width) solid var(--fb-border-color);
  border-radius: var(--fb-radius);
  background: var(--fb-bg);
  color: var(--fb-icon);
  cursor: pointer;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}

.feedback-button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  pointer-events: none;
}

.feedback-button:hover,
.feedback-button:focus-visible {
  border-color: var(--ink);
  outline: 2px solid color-mix(in srgb, var(--teal) 40%, transparent);
  outline-offset: 2px;
}

.feedback-more[aria-pressed="true"],
.feedback-more.is-selected {
  background: var(--fb-more);
  border-color: var(--fb-more);
  color: var(--fb-icon-active);
}
.feedback-less[aria-pressed="true"],
.feedback-less.is-selected {
  background: var(--fb-less);
  border-color: var(--fb-less);
  color: var(--fb-icon-active);
}

.feedback-reasons { margin-top: 11px; }

.reason-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 0.7rem;
}

.reason-chip {
  min-height: 36px;
  margin: 0 4px 5px 0;
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.71rem;
  cursor: pointer;
}

.reason-chip:hover,
.reason-chip:focus-visible {
  background: var(--surface);
  outline: 2px solid color-mix(in srgb, var(--teal) 38%, transparent);
  outline-offset: 2px;
}

.lead-signals {
  flex: 1 1 290px;
  min-width: 0;
}

/* When the rail wraps under the lead it grows a separating rule on top. */
@media (max-width: 860px) {
  .lead-signals {
    margin-top: 19px;
    padding-top: 19px;
    border-top: 1px solid var(--ink);
  }
}

.signals-title {
  margin: 0;
  padding: 0 0 9px;
  border-bottom: 3px solid var(--ink);
  font-family: var(--serif);
  font-size: 1.18rem;
  line-height: 1.1;
}

.signal-item {
  min-width: 0;
  padding: 13px 0 14px;
  border-bottom: 1px solid var(--rule);
}

.signal-meta { margin-bottom: 4px; }

.signal-link {
  display: inline;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 700;
  hyphens: auto;
  line-height: 1.18;
  text-decoration: none;
}

.signal-link:hover,
.signal-link:focus-visible {
  color: var(--accent-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.signal-summary {
  margin: 7px 0 0;
  color: var(--body-soft);
  font-size: 0.79rem;
  line-height: 1.4;
}

/* "Kort fortalt": up to 3 columns, fewer as width drops (handoff:
   auto-fit, minmax(min(100%, 300px), 1fr)). */
.short-news {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  column-gap: 26px;
}

.short-news .signal-item {
  padding: 18px 0;
}

.recommendations-section {
  margin-top: 30px;
  padding-top: 4px;
  border-top: 4px double var(--ink);
}

.recommendations-header {
  margin-bottom: 10px;
}

.recommendations-section .section-heading {
  border-bottom: 0;
  padding-bottom: 2px;
}

.recommendations-subtitle {
  margin: 0 0 9px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--ink);
  color: var(--teal);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-align: center;
  text-transform: uppercase;
}

.recommendation {
  min-width: 0;
}

.recommendation-featured {
  margin-bottom: 22px;
  padding-bottom: 24px;
  border-bottom: 4px double var(--ink);
}

.recommendation-featured-card { display: block; }

.recommendation-featured-card .recommendation-media {
  margin: 0 0 16px;
}

.recommendation-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  column-gap: 34px;
}

.recommendation-card {
  display: flex;
  flex-direction: column;
  padding: 22px 0 28px;
  border-bottom: 1px solid var(--rule);
}

.recommendation-card .recommendation-media {
  margin: 0 0 14px;
}

.recommendation-media {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: var(--media-radius);
  background: var(--surface);
}

.recommendation-media-link {
  display: block;
  width: 100%;
  height: 100%;
}

.recommendation-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: var(--media-filter);
  transition: transform 180ms ease;
}

.recommendation-media-link:hover img,
.recommendation-media-link:focus-visible img { transform: scale(1.012); }

.recommendation-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.recommendation-card .recommendation-text {
  flex: 1 1 auto;
}

.recommendation-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 5px;
  color: var(--teal);
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.085em;
  text-transform: uppercase;
}

.recommendation-status {
  padding: 1px 5px;
  border: 1px solid currentColor;
  color: var(--accent-ink);
}

.recommendation-headline {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 700;
  hyphens: manual;
  letter-spacing: -0.03em;
  line-height: 1.02;
}

.recommendation-featured-card .recommendation-headline {
  font-size: 2.15rem;
}

.recommendation-card .recommendation-headline {
  font-size: 1.5rem;
}

.recommendation-headline-link { text-decoration: none; }

.recommendation-headline-link:hover,
.recommendation-headline-link:focus-visible {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.recommendation-meta {
  margin: 7px 0 9px;
  color: var(--accent-ink);
  font-size: 0.69rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.recommendation-flow {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.62;
}

.recommendation-flow p { margin: 0 0 0.78em; }
.recommendation-rationale { color: var(--body-soft); }

.recommendation-cta {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  min-height: 44px;
  margin: 3px 0 0;
  padding: 0 13px;
  border: 1px solid var(--ink);
  font-size: 0.77rem;
  font-weight: 750;
  text-decoration: none;
}

.recommendation-cta:hover,
.recommendation-cta:focus-visible {
  background: var(--ink);
  color: var(--paper);
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.page-footer {
  padding: 27px 16px;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  text-align: center;
  font-size: 0.75rem;
}

.sr-status {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 10;
  transform: translateX(-50%);
  min-width: 1px;
  margin: 0;
  padding: 8px 12px;
  background: var(--ink);
  color: #fff;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
}

.sr-status:not(:empty) { opacity: 1; }

/* Skip-to-content link: off-screen until focused, then pinned top-left. */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-label);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ==========================================================================
   Top bar — a single light, theme-matching strip where the reader picks both
   the edition (I dag / Ugen / Måneden) and the visual direction ("Vis som").
   Replaces the old dark switcher bar + the boxed edition nav.
   ========================================================================== */
.top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 16px;
  width: 100%;
  padding: 9px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}

.top-bar-divider {
  width: 1px;
  height: 22px;
  background: var(--rule);
}

.edition-nav,
.layout-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.layout-nav-label {
  margin-right: 4px;
  color: var(--muted);
  font-family: var(--font-label);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* The "Arkiv" entry is a sibling of the edition tabs and must read identically —
   same label font, casing, size and pill states — not as a plain underlined link. */
.edition-tab,
.layout-tab,
.archive-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 5px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}

.edition-tab:hover,
.layout-tab:hover,
.archive-link:hover {
  background: color-mix(in srgb, var(--ink) 9%, transparent);
}

.edition-tab:focus-visible,
.layout-tab:focus-visible,
.archive-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* Active = a calm, neutral pill (ink on its own bg), not the brand accent — the
   chrome stays quiet so the news is the eye-catching thing. */
.edition-tab.is-active,
.layout-tab.is-active,
.archive-link.is-active {
  background: var(--ink);
  color: var(--bg);
}

/* Footer quality line ("Redaktionel sikkerhed N · Kildebredde N"). */
.quality-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 16px;
  margin: 0;
}

.quality-metric { white-space: nowrap; }
.quality-value { font-weight: 800; color: var(--ink); }

/* ==========================================================================
   Weekly edition
   Shares the daily design tokens (--paper, --ink, --serif, accents). Only the
   top composition differs: a segmented edition nav, a grid of co-equal
   featured stories (no single hero), boxed thread cards and a small grid of
   week-in-numbers panels. Mobile-first; columns are added at wider widths.
   ========================================================================== */

/* (edition-nav / edition-tab are styled in the Top bar section above.) */

/* The weekly shell is wider than the frozen daily reading column so the
   co-equal featured grid can open up to 2–3 columns on desktop. It stays
   mobile-first: capped to the viewport on small screens, no horizontal
   scroll at 320/375/430. The daily shell is untouched. */
.page-shell-weekly,
.page-shell-monthly,
.page-shell-yearly {
  width: min(1180px, calc(100% - 24px));
}

.page-shell-weekly > section + section,
.page-shell-monthly > section + section,
.page-shell-yearly > section + section {
  margin-top: 30px;
}

/* Ugens vigtigste: co-equal featured cards, never one dominant hero. */
.featured-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 26px;
  margin-top: 14px;
}

.featured-grid .story-lead {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 0;
}

/* Cap the hero image so three featured stories stay visually equal and a
   single one never dominates the page. */
.featured-grid .story-lead .story-media {
  aspect-ratio: 16 / 9;
  max-height: 220px;
  margin: 0 0 14px;
}

.featured-grid .story-lead .story-headline {
  font-size: 1.7rem;
  line-height: 1.04;
}

/* Ugens forløb: distinct boxed thread cards. */
.threads-section {
  margin-top: 30px;
}

.threads {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  margin-top: 14px;
}

.thread-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 18px 20px 20px;
  border: 1px solid var(--ink);
  border-top: 4px solid var(--blue);
  background: var(--paper-deep);
}

.thread-kicker {
  color: var(--blue);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thread-title {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.06;
}

.thread-summary {
  margin: 9px 0 0;
  color: var(--body-soft);
  font-size: 0.92rem;
  line-height: 1.5;
}

.thread-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.topic-tag {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.thread-sources {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--rule);
}

.thread-sources .story-sources {
  margin-top: 0;
}

/* Ugen i tal: a small grid of key-number panels. */
.week-numbers-section {
  margin-top: 30px;
}

.week-numbers {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  margin-top: 14px;
}

/* Tablet and up: pair the featured stories, threads and numbers. */
@media (min-width: 720px) {
  .featured-grid,
  .threads,
  .week-numbers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Wide desktop: three co-equal featured columns so no story dominates. */
@media (min-width: 1100px) {
  .featured-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .week-numbers {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* The composition is intentionally frozen: the column width and every grid
   stay constant at all viewport widths and zoom levels, so there are no
   width breakpoints. Only motion preference is honoured below. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* "Gemt til senere": a subtle boxed list of stories the reader marked to revisit.
   Stays out of the way until there is something pending. */
.read-later {
  width: var(--shell);
  margin: 28px auto 0;
  padding: 16px 18px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--paper-deep);
}

.read-later-title {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 0.74rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--muted);
}

.read-later-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}

.read-later-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.read-later-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.read-later-link {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 600;
  text-decoration: none;
}

.read-later-link:hover { text-decoration: underline; }

.read-later-link:focus-visible {
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

.read-later-meta {
  grid-column: 1;
  margin: 2px 0 0;
  font-size: 0.7rem;
  color: var(--muted);
}

.read-later-dismiss {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
}

.read-later-dismiss:hover,
.read-later-dismiss:focus-visible {
  background: var(--paper);
  outline: 2px solid rgba(11, 103, 105, 0.38);
  outline-offset: 2px;
}

/* ==========================================================================
   Magasin — full-bleed hero, promoted featured story, dark number band
   The daily Magasin builder (render/magazine.js) replaces the page-shell with
   these sections; bands break out of the centred column, content re-constrains
   via .mag-inner.
   ========================================================================== */
/* Daily-only: the Magasin full-bleed shell assumes the daily DOM. On weekly/
   monthly only the Magasin palette + typography apply (their own structure). */
:root[data-edition="daily"][data-layout="magazine"] .page-shell {
  width: 100%;
  max-width: none;
  margin: 0 auto 64px;
}
:root[data-layout="magazine"] .masthead {
  width: min(1240px, 94vw);
  border-bottom: 2px solid var(--ink);
}
:root[data-layout="magazine"] .masthead h1 {
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 0.9;
}
:root[data-layout="magazine"] .masthead-dek {
  max-width: 44ch;
  font-size: clamp(1.2rem, 2.2vw, 1.85rem);
  line-height: 1.18;
}
/* DM Serif Display ships a single 400 weight. */
:root[data-layout="magazine"] .story-headline,
:root[data-layout="magazine"] .recommendation-headline,
:root[data-layout="magazine"] .signal-link { font-weight: 400; }

.mag-inner {
  width: min(1240px, 94vw);
  margin: 0 auto;
}

.mag-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  min-height: clamp(440px, 72vh, 780px);
  margin-top: 6px;
  overflow: hidden;
  background: var(--ink);
}
.mag-hero-media {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.mag-hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12, 9, 6, 0.94) 2%, rgba(12, 9, 6, 0.55) 42%, rgba(12, 9, 6, 0.12) 100%);
}
.mag-hero-credit { right: 10px; bottom: 8px; }
.mag-hero-inner {
  position: relative;
  width: min(1240px, 94vw);
  margin: 0 auto;
  padding: 0 0 clamp(30px, 5vw, 68px);
  color: #fff;
}
.mag-hero-eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.mag-hero-chip {
  padding: 4px 11px;
  background: var(--accent-ink);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.mag-hero-tag {
  padding: 4px 11px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #fff;
  font-family: var(--font-label);
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mag-hero-headline {
  margin: 0;
  max-width: 16ch;
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 7vw, 5.6rem);
  font-weight: 400;
  line-height: 0.96;
}
.mag-hero-headline .headline-link { color: #fff; text-decoration: none; }
.mag-hero-sub {
  margin: 16px 0 0;
  max-width: 48ch;
  font-family: var(--font-label);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.92);

line":"Houthi-angreb på to saudiske tankskibe i Rødehavet sendte Brent over 100 dollar for første gang siden maj. Med både Hormuz og Bab al-Mandeb ramt samtidig findes der ingen billig omvej.","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/23/oil-surges-past-100-in-a-first-since-may-as-middle-east-conflicts-rage","materialFacts":["Brent lukkede torsdag 23. juli i 100,69 dollar per tønde, op 6,62 dollar eller cirka syv procent — højeste slutkurs siden 22. maj","Kun ét tankskib passerede Hormuzstrædet torsdag mod tre dagen før, det laveste siden 7. maj ifølge Kpler-data","USA gennemførte natten til fredag sin 13. angrebsnat i træk mod iranske mål","Brent var fredag formiddag faldet tilbage til 97,04 dollar"],"body":["Brent lukkede torsdag i 100,69 dollar per tønde, op cirka syv procent og højest siden 22. maj. Udløseren var houthiernes angreb på to saudiske tankskibe i Rødehavet, efter at bevægelsen 20. juli erklærede blokade mod saudisk skibsfart.","Samtidig er trafikken gennem Hormuzstrædet nærmest ophørt. Kun ét tankskib passerede torsdag mod tre dagen før — det laveste siden 7. maj ifølge Kpler-data. Irans Revolutionsgarde kalder strædet »fuldstændig lukket«, mens USA fastholder, at farvandet er åbent. Lastningen i Den Persiske Golf er ifølge Reuters faldet til 2,5 millioner tønder om dagen mod seks millioner de foregående 30 dage.","USA gennemførte natten til fredag sin 13. angrebsnat i træk. Fredag klokken 11.35 dansk tid stod Brent i 97,04 dollar."],"whyItMatters":"Bab al-Mandeb og Hormuz bærer tilsammen hovedparten af Golfens søbårne olie, og forstyrres begge samtidig, findes ingen billig omvej. Goldman Sachs ser Brent over 120 dollar i fjerde kvartal, hvis det varer ved.","analysis":"Tilbagefaldet fredag er ikke et fredssignal, men et marked, der har indregnet en lang konflikt. Afgørende er ikke spidsen på 102 dollar, men om niveauet omkring 100 holder — dét sætter sig i inflationen og i centralbankernes reaktion.","topics":["energi","geopolitik","Mellemøsten","olie","makroøkonomi"],"entities":["Brent","Houthierne","Saudi-Arabien","Iran","Hormuzstrædet","Rødehavet","Goldman Sachs","Donald Trump"],"scores":{"importance":92,"decisionValue":86,"novelty":78,"sourceQuality":84,"personalRelevance":78,"contrast":66},"image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/05/AP26118432578042-1777867046.jpg?resize=1920%2C1440","credit":"Foto: AP, via Al Jazeera","alt":"Olietankskib til søs — illustration til artikel om oliepriser og skibsfart i Golfen","sourceUrl":"https://www.aljazeera.com/news/2026/7/23/oil-surges-past-100-in-a-first-since-may-as-middle-east-conflicts-rage"},"claims":[{"text":"Brent lukkede torsdag 23. juli i 100,69 dollar per tønde, op 6,62 dollar eller cirka syv procent — den højeste slutkurs siden 22. maj, med en intradag-top på 102 dollar.","sourceUrls":["https://finance.yahoo.com/news/oil-prices-rise-six-week-004039779.html","https://spectrumlocalnews.com/nc/triad/business/2026/07/23/brent-oil--100-barrel"],"confidence":"high"},{"text":"Houthierne angreb to saudiske tankskibe i Rødehavet, efter at bevægelsen 20. juli erklærede blokade mod saudisk skibsfart.","sourceUrls":["https://www.aljazeera.com/news/2026/7/22/yemens-houthis-claim-attack-on-two-saudi-oil-tankers","https://www.aljazeera.com/news/2026/7/23/oil-surges-past-100-in-a-first-since-may-as-middle-east-conflicts-rage"],"confidence":"high"},{"text":"Kun ét tankskib passerede Hormuzstrædet 23. juli mod tre dagen før — det laveste siden 7. maj ifølge Kpler-data. Irans Revolutionsgarde erklærer strædet fuldstændig lukket, mens USA fastholder, at det er åbent.","sourceUrls":["https://www.thenationalnews.com/news/mena/2026/07/24/hormuz-tanker-crossings-fall-to-lowest-level-in-more-than-two-months-data-shows/","https://www.cbsnews.com/live-updates/iran-war-us-trump-strait-hormuz-oil-prices-red-sea-houthis/"],"confidence":"high"},{"text":"Goldman Sachs vurderer, at Brent kan overstige 120 dollar i fjerde kvartal og gennemsnitligt 10 isher":"CBS News","url":"https://www.cbsnews.com/live-updates/iran-war-us-trump-strait-hormuz-oil-prices-red-sea-houthis/","publishedAt":"2026-07-24T10:12:00.000Z","kind":"reporting"},{"title":"Yemen’s Houthis claim attack on two Saudi oil tankers","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/22/yemens-houthis-claim-attack-on-two-saudi-oil-tankers","publishedAt":"2026-07-22T22:26:14.000Z","kind":"reporting"},{"title":"Current price of oil as of July 24, 2026","publisher":"Fortune","url":"https://fortune.com/article/price-of-oil-07-24-2026/","publishedAt":"2026-07-24T09:35:26.000Z","kind":"reporting"}]},{"id":"story-us-iran-halt-20260726","eventKey":"us-iran-war-halt-13-days","materialFacts":["Iran meldte 26. juli om ingen angreb natten over efter 13 nætter i træk med gensidig beskydning om Hormuzstrædet","Houthi-styrker affyrede 26. juli missiler og droner mod saudiske Aramco-anlæg ved Jizan og Yanbu","Ukraine oplyser at have ramt et iransk fartøj med militærlast i Det Kaspiske Hav"],"section":"Verden","headline":"US, Iran appear to halt strikes after 13 days of mutual attacks","primarySourceUrl":"https://www.timesofisrael.com/us-iran-appear-to-halt-strikes-after-13-days-of-mutual-attacks/","subheadline":"Efter 13 nætters gensidige angreb om Hormuzstrædet melder Iran om en rolig nat — men krigen flytter sig snarere end at stoppe.","body":["USA og Iran ser ud til at have indstillet de direkte angreb efter 13 nætter i træk med gensidig beskydning om kontrollen med Hormuzstrædet. Iran meldte søndag om »ingen angreb natten over«, mens Trump ifølge Times of Israel sagde, at han »ikke har besluttet« større angreb, og at Teheran »bliver mere og mere seriøs« i sonderingerne.","Men våbnene er ikke tavse. Houthi-styrker i Yemen affyrede søndag missiler og droner mod saudiske Aramco-anlæg ved Jizan og Yanbu, og olieprisen er steget. Sideløbende har Ukraine ramt et iransk fartøj med militærlast i Det Kaspiske Hav."],"whyItMatters":"Hormuzstrædet fører omkring en femtedel af verdens olie. En pause i de direkte slag dæmper krigsrisikoen, men den houthi-saudiske eskalation og blokaden holder energimarkederne — og dermed europæisk inflation og forsyning — nervøse.","analysis":"Signalet er ikke »overstået«, men »flytter sig«: staterne trapper ned, mens stedfortræderne trapper op. En rolig nat i Teheran og et brændende raffinaderi i Yanbu kan være sande samme dag.","counterpoint":"Modsyn: en pause efter 13 nætter kan lige så godt være genforsyning som begyndelsen på en afvikling. Trump har efter eget udsagn intet besluttet.","image":{"url":"https://static-cdn.toi-media.com/www/uploads/2026/07/AP26206331001927.jpg","credit":"Foto: AP/The Times of Israel","alt":"Arkivfoto (AP) knyttet til konflikten mellem USA og Iran","sourceUrl":"https://www.timesofisrael.com/us-iran-appear-to-halt-strikes-after-13-days-of-mutual-attacks/"},"topics":["geopolitik","energi","mellemøsten","usa","iran"],"entities":["USA","Iran","Saudi-Arabien","Houthi","Ukraine","Hormuzstrædet"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":90,"decisionValue":62,"novelty":74,"sourceQuality":80,"personalRelevance":60,"contrast":66},"claims":[{"text":"Iran og USA ser ud til at have indstillet de direkte angreb efter 13 nætter med gensidig beskydning om Hormuzstrædet; Iran meldte om ingen angreb natten over.","sourceUrls":["https://www.timesofisrael.com/us-iran-appear-to-halt-strikes-after-13-days-of-mutual-attacks/"],"confidence":"high"},{"text":"Houthi-styrker ramte 26. juli saudiske Aramco-anlæg ved Jizan og Yanbu, og olieprisen steg.","sourceUrls":["https://www.aljazeera.com/news/2026/7/26/new-front-in-us-iran-war-escalates-as-houthis-fire-at-saudi-oil-facilities"],"confidence":"high"},{"text":"Ukraine oplyser at have ramt et iransk fartøj med militærlast i Det Kaspiske Hav og dræbt ét besætningsmedlem.","sourceUrls":["https://kyivindependent.com/ukraine-strikes-iranian-vessel-used-for-military-cargo-transport-in-caspian-sea/"],"confidence":"medium"}],"sources":[{"title":"US, Iran appear to halt strikes after 13 days of mutual attacks","publisher":"The Times of Israel","url":"https://www.timesofisrael.com/us-iran-appear-to-halt-strikes-after-13-days-of-mutual-attacks/","publishedAt":"2026-07-25T11:16:00Z","kind":"reporting"},{"title":"New front in US-Iran war escalates as Houthis fire at Saudi oil facilities","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/26/new-front-in-us-iran-war-escalates-as-houthis-fire-at-saudi-oil-facilities","publishedAt":"2026-07-26T06:00:00Z","kind":"reporting"},{"title":"Ukraine strikes Iranian vessel used for military cargo transport in Caspian Sea","publisher":"The Kyiv Independent","url":"https://kyivindependent.com/ukraine-strikes-iranian-vessel-used-for-military-cargo-transport-in-caspian-sea/","publishedAt":"2026-07-26T02:08:00Z","kind":"reporting"}]},{"id":"story-ebola-bundibugyo-20260719","eventKey":"who-ebola-bundibugyo-don613-2026-07","section":"Sundhed","isLead":false,"isOutsideProfile":false,"headline":"Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo & Uganda","primarySourceUrl":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613","subheadline":"WHO opgør udbruddet til 2.145 bekræftede tilfælde og 830 døde. Frankrig og Tyskland har hver registreret ét importeret tilfælde.","materialFacts":["WHO's Disease Outbreak News af 17. juli 2026 opgør udbruddet af Bundibugyo-virus til 2.145 bekræftede tilfælde og 830 døde: 2.124 tilfælde og 828 døde i DR Congo, 20 tilfælde og 2 døde i Uganda","Ugandas seneste patient blev udskrevet 16. juli 2026, hvilket starter en nedtælling på 42 dage — det dobbelte af den maksimale inkubationstid — før udbruddet kan erklæres slut i Uganda; smitten fortsætter i DR Congo","Frankrig har registreret ét raskmeldt tilfælde og Tyskland ét tilfælde hos en nødhjælpsarbejder i stabil tilstand"],"body":["WHO opgjorde 17. juli udbruddet af ebola forårsaget af Bundibugyo-virus til 2.145 bekræftede tilfælde og 830 døde i alt, heraf 2.124 tilfælde og 828 døde i Den Demokratiske Republik Congo. Frankrig og Tyskland har hver registreret ét importeret tilfælde.","Ugandas seneste patient blev udskrevet 16. juli. Det starter en nedtælling på 42 dage, før udbruddet kan erklæres afsluttet i landet. I DR Congo fortsætter smitten."],"whyItMatters":"Der findes ikke en godkendt vaccine mod Bundibugyo-arten, som der gør mod Zaire-ebola. Over 2.000 bekræftede tilfælde med smitte båret til to EU-lande er derfor et andet beredskabsproblem end de foregående udbrud.","analysis":"De to europæiske tilfælde er den vigtigste oplysning — ikke som smitterisiko, men fordi udbruddet har nået en størrelse, hvor nødhjælpsarbejdere bringer det med hjem. Bemærk en uafklarethed: WHO's generaldirektør angav dagen før 2.273 tilfælde og 796 døde.","topics":["global sundhed","epidemiologi","biosikkerhed","udbrud"],"entities":["WHO","Bundibugyo-virus","DR Congo","Uganda","Frankrig","Tyskland"],"scores":{"importance":90,"decisionValue":70,"novelty":70,"sourceQuality":96,"personalRelevance":55,"contrast":64},"image":{"url":"https://global.unitednations.entermediadb.net/assets/mediadb/services/module/asset/downloads/preset/Collections/Embargoed/2026/06/19-06-2026-WHO-DR-Congo-ebola-02.jpg/image1170x530cropped.jpg","credit":"Foto: UN News / WHO","alt":"WHO's ebolaindsats i Den Demokratiske Republik Congo","sourceUrl":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613"},"claims":[{"text":"WHO opgør 17. juli 2026 udbruddet af Bundibugyo-virus til 2.145 bekræftede tilfælde og 830 døde, heraf 2.124 tilfælde og 828 døde i DR Congo.","sourceUrls":["https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613"],"confidence":"high"},{"text":"Ugandas seneste patient blev udskrevet 16. juli 2026, hvilket indleder en 42-dages nedtælling, før udbruddet kan erklæres slut i landet.","sourceUrls":["https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613"],"confidence":"high"},{"text":"WHO's generaldirektør angav 16. juli 2026 tal på 2.273 tilfælde og 796 døde, som ikke er forenelige med DON'ens opgørelse dagen efter.","sourceUrls":["https://news.un.org/en/story/2026/07/1167959","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613"],"confidence":"low"}],"sources":[{"title":"Ebola disease caused by Bundibugyo virus, Democratic Republic of the Congo & Uganda","publisher":"World Health Organization","url":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613","publishedAt":"2026-07-17T12:00:00.000Z","kind":"primary"},{"title":"Ebola outbreak in DR Congo and Uganda","publisher":"UN News","url":"https://news.un.org/en/story/2026/07/1167959","publishedAt":"2026-07-16T12:00:00.000Z","kind":"reporting"}]},{"id":"story-usmca-joint-review-2026","eventKey":"usmca-joint-review-not-renewed-2026","materialFacts":["USA nægtede 1. juli 2026 at forny USMCA i dens nuværende form","Aftalen forbliver i kraft; bilaterale forhandlinger med Mexico genoptages ugen omkring 20. juli","Ikke-fornyelsen udløser en tilbagevendende årlig revisionsproces"],"section":"Handel & geopolitik","headline":"Ambassador Greer Issues Statement on the USMCA Joint Review","primarySourceUrl":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review","subheadline":"USA nægtede ved fælles-gennemgangen 1. juli at forny frihandelsaftalen med Canada og Mexico »i dens nuværende form« — aftalen består, men glider nu ind i årlige revisioner.","body":["USA's handelsrepræsentant Jamieson Greer meddelte 1. juli, at USA ved den obligatoriske fælles-gennemgang af USMCA ikke vil forny aftalen »i dens nuværende form«. Frihandelsaftalen mellem USA, Mexico og Canada — der siden 2020 afløste NAFTA og dækker varehandel for ca. 2 billioner dollar årligt — ophæves ikke, men glider ind i årlige gennemgange.","USA lægger op til bilaterale spor: næste runde med Mexico er berammet til ugen omkring 20. juli, mens Canada håndteres særskilt. Uden en forlængelse aktiverer aftalens egne regler en årlig revisionsmekanisme frem mod udløbsklausulen i 2036."],"whyItMatters":"For virksomheder med forsyningskæder på tværs af den nordamerikanske grænse erstattes USMCA's langsigtede regelsikkerhed af årlig usikkerhed om told og oprindelsesregler.","analysis":"Signalet til investorer er, at nordamerikansk handelspolitik nu må prissættes som en årligt genforhandlet variabel, ikke en fast ramme — det hæver risikopræmien på grænseoverskridende investeringer.","counterpoint":"USTR understreger selv, at aftalen fortsat er i kraft: en ikke-fornyelse »i nuværende form« er ikke en opsigelse og kan ende i en revideret aftale lige så vel som i sammenbrud.","primaryExcerpt":{"quote":"The United States did not agree to renew the USMCA in its current form.","sourceUrl":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review","sourceTitle":"Ambassador Greer Issues Statement on the USMCA Joint Review"},"image":{"url":"https://upload.wikimedia.org/wikipedia/commons/b/bb/Official_portrait_of_U.S._Trade_Representative_Jamieson_Greer_%28cropped_2%29.jpg","credit":"Foto: Office of the U.S. Trade Representative / Wikimedia Commons","alt":"USA's handelsrepræsentant Jamieson Greer","sourceUrl":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review"},"topics":["handel","told","usmca","nordamerika","geopolitik"],"entities":["USTR","Jamieson Greer","USMCA","Canada","Mexico","USA"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":92,"decisionValue":88,"novelty":80,"sourceQuality":90,"personalRelevance":55,"contrast":70},"claims":[{"text":"USA nægtede ved USMCA-gennemgangen 1. juli 2026 at forny aftalen i dens nuværende form.","sourceUrls":["https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review"],"confidence":"high"},{"text":"USA mødes med Mexico ugen omkring 20. juli til en tredje runde bilaterale forhandlinger.","sourceUrls":["https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review"],"confidence":"high"}],"sources":[{"title":"Ambassador Greer Issues Statement on the USMCA Joint Review","publisher":"Office of the United States Trade Representative","url":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ambassador-greer-issues-statement-usmca-joint-review","publishedAt":"2026-07-01T00:00:00Z","kind":"primary"}]},{"id":"story-novo-wegovy-oral-eu-20260716","eventKey":"novo-wegovy-oral-pill-eu-approval-2026-07","materialFacts":["EU-Kommissionen godkendte 15. juli 2026 en oral udgave af Wegovy (daglig pille med 25 mg semaglutid) til voksne med svær overvægt eller overvægt med mindst én følgesygdom","Det er den første GLP-1-vægttabspille godkendt i hele EU; hidtil fandtes Wegovy kun som injektionspen","Kommissionen godkendte samtidig en ny, klar-til-brug 7,2 mg-pen; CHMP anbefalede godkendelsen 22. maj 2026"],"section":"Erhverv","headline":"Novo Nordisk får grønt lys til vægttabspille i EU","primarySourceUrl":"https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu","subheadline":"Kommissionen godkender den første orale GLP-1-vægttabspille i hele EU – og en ny, stærkere pen.","body":["EU-Kommissionen godkendte 15. juli 2026 en oral udgave af Novo Nordisks vægttabsmiddel Wegovy – en daglig pille med 25 mg semaglutid til voksne med svær overvægt eller overvægt med mindst én følgesygdom. Det er den første GLP-1-vægttabspille godkendt i hele EU; hidtil fandtes Wegovy kun som injektionspen.","Kommissionen godkendte samtidig en ny, stærkere 7,2 mg-pen, der er klar til brug. Pillen sælges i forvejen i USA, Storbritannien og De Forenede Arabiske Emirater, og godkendelsen følger, efter at lægemiddeludvalget CHMP anbefalede den 22. maj 2026."],"whyItMatters":"Novo Nordisk er Danmarks største virksomhed og en tung post i både statens skatteindtægter og danskernes pensionsopsparing. En pille er lettere at masseproducere og distribuere end en injektion og udvider markedet til de patienter, der viger tilbage for nåle.","analysis":"Godkendelsen løser ikke selskabets grundproblem – konkurrencen fra Eli Lillys tabletter og presset på priserne – men den giver Novo et forsvarsværk i Europa, netop som investorer har frygtet, at væksten i GLP-1-markedet flader ud. Det afgørende bliver nu produktionskapacitet og pris, ikke om produktet findes.","topics":["pharma","GLP-1","erhverv","EU-regulering"],"entities":["Novo Nordisk","Wegovy","semaglutid","EU-Kommissionen","EMA"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":90,"decisionValue":86,"novelty":72,"sourceQuality":88,"personalRelevance":74,"contrast":55},"claims":[{"text":"EU-Kommissionen godkendte 15. juli 2026 en oral udgave af Wegovy med 25 mg semaglutid som den første GLP-1-vægttabspille i hele EU, samtidig med en ny 7,2 mg-pen.","sourceUrls":["https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu"],"confidence":"high"}],"sources":[{"title":"Novo Nordisk får grønt lys til vægttabspille i EU","publisher":"DR","url":"https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu","publishedAt":"2026-07-15T12:00:00.000Z","kind":"reporting"}],"image":{"url":"https://asset.dr.dk/drdk/umbraco-images/oujpen2a/317.png?im=AspectCrop%3D%28700%2C394%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%28700%2C394%29","credit":"Kilde: DR","alt":"Novo Nordisks vægttabsmiddel Wegovy – EU godkender nu en oral pilleudgave","sourceUrl":"https://www.dr.dk/nyheder/seneste/novo-nordisk-faar-groent-lys-til-vaegttabspille-i-eu"}},{"id":"story-nvidia-openai-ohio-20260727","eventKey":"nvidia-250bn-guarantee-openai-ohio-2026-07","materialFacts":["Wall Street Journal skrev 26. juli 2026, at Nvidia forhandler om at stille en garanti på omkring 250 mia. dollar bag OpenAIs leje af et datacenterprojekt i Pike County, Ohio, USA","Anlægget er på 10 gigawatt og udvikles af SoftBanks energiselskab SB Energy på grunden efter det tidligere Portsmouth-uranberigningsanlæg ved Piketon","Energiministeriet i USA oplyste 25. februar 2026, at SB Energy og AEP Ohio bygger 10 GW ny elproduktion, heraf 9,2 GW gaskraft, finansieret med 33,3 mia. dollar japanske midler","Nvidia, OpenAI og det amerikanske handelsministerium ville ikke kommentere over for Reuters, som selv skriver, at nyheden ikke kunne verificeres uafhængigt"],"section":"Teknologi","headline":"Nvidia in talks to guarantee $250 billion for mega Ohio data center, WSJ reports","primarySourceUrl":"https://www.dispatch.com/story/business/energy-resource/2026/07/26/nvidia-in-talks-with-openai-for-ohio-data-center-financing-wsj-reports/91058613007/","subheadline":"Chipproducenten skal efter sigende garantere OpenAIs leje af et 10 GW-anlæg i Ohio. Beløbet svarer omtrent til hele SoftBanks børsværdi.","body":["Nvidia forhandler ifølge Wall Street Journal om at garantere cirka 250 mia. dollar, så OpenAI kan leje sig ind i et 10 GW-datacenter i Pike County i Ohio, USA. Anlægget bygges af SB Energy, energiselskabet i japanske SoftBank, på grunden efter det nedlagte Portsmouth-uranberigningsanlæg. Strømmen kontrolleres af den amerikanske stat og betales af Japan under en handelsaftale.","Nvidia bygger altså ikke og køber ikke, men stiller sig bag en lejeforpligtelse, kunden ellers ikke kunne bære. Hverken Nvidia, OpenAI eller handelsministeriet vil kommentere, og Reuters skriver, at man ikke selv har kunnet verificere oplysningerne."],"whyItMatters":"Regnestykket bag AI-udbygningen holder kun, hvis nogen bærer risikoen for, at kapaciteten bliver brugt. Når leverandøren garanterer kundens leje, flytter den risiko tilbage til chipproducenten.","analysis":"Beløbet er selv målestokken: 250 mia. dollar er omtrent hele SoftBanks børsværdi i midten af juni. Garantien er dermed en kreditvurdering, Nvidia foretager af sin egen efterspørgsel.","primaryExcerpt":{"quote":"Japan has committed to invest $550 billion across America. With this historic trade deal we are reindustrializing the country through critical projects like this $33 billion dollar power project in Portsmouth, Ohio.","sourceUrl":"https://www.energy.gov/articles/energy-department-announces-partnership-ensure-affordable-energy-and-power-americas-ai","sourceTitle":"Energy Department Announces Partnership to Ensure Affordable Energy and Power America’s AI Future"},"image":{"url":"https://www.gannett-cdn.com/authoring/authoring-images/2026/03/20/NCOD/89246274007-img-primary-news-ceb-new-1-1-8-j-15-vnu-8-a-l-2163102613.JPG?auto=webp&crop=2999,1688,x0,y12&format=pjpg&width=1200","credit":"Foto: The Columbus Dispatch/USA TODAY Network","alt":"Arkivfoto fra datacenterprojektet ved Piketon i Pike County, Ohio","sourceUrl":"https://www.dispatch.com/story/business/energy-resource/2026/07/26/nvidia-in-talks-with-openai-for-ohio-data-center-financing-wsj-reports/91058613007/"},"topics":["AI","datacentre","energi","USA","infrastruktur"],"entities":["Nvidia","OpenAI","SoftBank","SB Energy","AEP Ohio","Howard Lutnick","Masayoshi Son"],"isLead":false,"isOutsideProfile":false,"scores":{"importance":88,"decisionValue":82,"novelty":84,"sourceQuality":70,"personalRelevance":92,"contrast":72},"claims":[{"text":"Nvidia forhandler om at stille en garanti på omkring 250 mia. dollar for OpenAIs leje af et datacenterprojekt i Pike County, Ohio.","sourceUrls":["https://www.dispatch.com/story/business/energy-resource/2026/07/26/nvidia-in-talks-with-openai-for-ohio-data-center-financing-wsj-reports/91058613007/"],"confidence":"medium"},{"text":"SB Energy og AEP Ohio bygger 10 GW ny elproduktion, heraf 9,2 GW gaskraft, ved Portsmouth-grunden, finansieret med 33,3 mia. dollar japanske midler.","sourceUrls":["https://www.energy.gov/articles/energy-department-announces-partnership-ensure-affordable-energy-and-power-americas-ai"],"confidence":"high"},{"text":"Masayoshi Son talte ved rejsegildet 20. marts 2026 i Piketon om mindst 500 mia. dollar investeret i én campus.","sourceUrls":["https://apnews.com/article/ai-data-center-ohio-uranium-enrichment-4667fa1442ec1c652228337ab4eb68ee"],"confidence":"high"},{"text":"Lokale og delstatslige embedsmænd i Ohio har ikke kunnet bekræfte investeringstallene, og senator Jon Husted har kaldt dem muligvis aspirational.","sourceUrls":["https://www.dispatch.com/story/business/manufacturing/2026/06/17/questions-about-massive-plant-data-center-campus-in-pike-county/90570370007/"],"confidence":"high"}],"sources":[{"title":"Nvidia in talks to guarantee $250 billion for mega Ohio data center, WSJ reports","publisher":"The Columbus Dispatch","url":"https://www.dispatch.com/story/business/energy-resource/2026/07/26/nvidia-in-talks-with-openai-for-ohio-data-center-financing-wsj-reports/91058613007/","publishedAt":"2026-07-27T00:46:11.000Z","kind":"reporting"},{"title":"Energy Department Announces Partnership to Ensure Affordable Energy and Power America’s AI Future","publisher":"U.S. Department of Energy","url":"https://www.energy.gov/articles/energy-department-announces-partnership-ensure-affordable-energy-and-power-americas-ai","publishedAt":"2026-02-25T14:16:37.000Z","kind":"primary"},{"title":"Trump officials announce 10-gigawatt data center, gas plants for former Ohio uranium site","publisher":"The Associated Press","url":"https://apnews.com/article/ai-data-center-ohio-uranium-enrichment-4667fa1442ec1c652228337ab4eb68ee","publishedAt":"2026-03-20T20:04:20.000Z","kind":"reporting"},{"title":"A half-trillion dollars for Pike County? Many questions linger on mega data project","publisher":"The Columbus Dispatch","url":"https://www.dispatch.com/story/business/manufacturing/2026/06/17/questions-about-massive-plant-data-center-campus-in-pike-county/90570370007/","publishedAt":"2026-06-17T10:06:03.000Z","kind":"analysis"}],"counterpoint":"Modsyn: The Columbus Dispatch dokumenterede 17. juni, at lokalpolitikere i Ohio ikke kunne bekræfte tallene om campussen. Alt om de 250 mia. stammer fra anonyme WSJ-kilder."},{"id":"story-burnham-labour-20260719","eventKey":"uk-burnham-labour-leader-pm-2026-07","section":"Udland","isLead":false,"isOutsideProfile":false,"headline":"Burnham confirmed as leader of UK's governing Labour Party, headed for PM","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/17/burnham-confirmed-as-leader-of-uks-governing-labour-party-headed-for-pm","subheadline":"Storbritannien får sin syvende premierminister på ti år, når den tidligere Manchester-borgmester efterfølger Keir Starmer mandag.","materialFacts":["Andy Burnham, tidligere borgmester i Greater Manchester, blev fredag 17. juli 2026 bekræftet som leder af Labour i Storbritannien og udnævnes til premierminister mandag 20. juli som afløser for Keir Starmer","Burnham var eneste opstillingsberettigede kandidat og fik 379 nomineringer, svarende til omkring 94 procent af Labours parlamentsmedlemmer","Han bliver Storbritanniens syvende premierminister på ti år og overtager en leveomkostningskrise, krigene i Mellemøsten og Ukraine samt en voksende udfordring fra Reform UK"],"body":["Andy Burnham blev fredag bekræftet som leder af Labour og udnævnes mandag til premierminister i Storbritannien efter Keir Starmer. Han var eneste kandidat og fik 379 nomineringer, omkring 94 procent af partiets parlamentsmedlemmer.","Burnham, tidligere borgmester i Greater Manchester, bliver Storbritanniens syvende premierminister på ti år. Han overtager en leveomkostningskrise, krigene i Mellemøsten og Ukraine og et voksende Reform UK."],"whyItMatters":"Et regeringsskifte i et G7-land og en NATO-atommagt træder i kraft dagen efter denne udgave. Storbritanniens linje i Iran-krigen og Ukraine afgøres fra mandag af en anden person.","analysis":"De 94 procent er både styrke og advarsel. Burnham overtager uden at have vundet en reel konkurrence: parlamentarisk ro fra dag ét, men intet prøvet mandat. Britiske partiledere, der indsættes frem for vælges, har historisk kort tid, før den første krise definerer dem.","topics":["politik","Storbritannien","Europa","regeringsskifte"],"entities":["Andy Burnham","Keir Starmer","Labour","Reform UK","Storbritannien"],"scores":{"importance":88,"decisionValue":74,"novelty":80,"sourceQuality":80,"personalRelevance":62,"contrast":58},"image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/07/afp_6a5a2180d0f7-1784291712.jpg","credit":"Foto: AFP via Al Jazeera","alt":"Andy Burnham efter at være bekræftet som leder af Labour","sourceUrl":"https://www.aljazeera.com/news/2026/7/17/burnham-confirmed-as-leader-of-uks-governing-labour-party-headed-for-pm"},"claims":[{"text":"Andy Burnham blev 17. juli 2026 bekræftet som leder af Labour og udnævnes til premierminister mandag 20. juli 2026.","sourceUrls":["https://www.aljazeera.com/news/2026/7/17/burnham-confirmed-as-leader-of-uks-governing-labour-party-headed-for-pm"],"confidence":"high"},{"text":"Burnham var eneste opstillingsberettigede kandidat og modtog 379 nomineringer, omkring 94 procent af Labours parlamentsmedlemmer.","sourceUrls":["https://www.aljazeera.com/news/2026/7/17/burnham-confirmed-as-leader-of-uks-governing-labour-party-headed-for-pm","https://www.pbs.org/newshour/world/andy-burnham-is-declared-leader-of-uks-labour-party-pledges-to-restore-hope"],"confidence":"medium"}],"sources":[{"title":"Burnham confirmed as leader of UK's governing Labour Party, headed for PM","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/17/burnham-confirmed-as-leader-of-uks-governing-labour-party-headed-for-pm","publishedAt":"2026-07-17T14:00:00.000Z","kind":"reporting"},{"title":"Andy Burnham is declared leader of UK's Labour Party, pledges to restore hope","publisher":"PBS NewsHour","url":"https://www.pbs.org/newshour/world/andy-burnham-is-declar oplyste 24. juli, at første forsøgsgruppe har fået en eksperimentel vaccine"],"section":"Sundhed","headline":"Ebola infections in DR Congo surge to 3,200, with 1,405 deaths","primarySourceUrl":"https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths","subheadline":"Tusind nye tilfælde på ti dage i DR Congo. Uganda har til gengæld ikke set et nyt tilfælde siden 21. juni.","body":["DR Congos regering opgjorde søndag udbruddet af Bundibugyo-ebola til 3.200 smittede og mindst 1.405 døde — cirka 1.000 flere tilfælde på ti dage. WHO talte 17. juli 2.124 bekræftede tilfælde og 828 døde i DR Congo, en dødelighed på 39 procent.","Uganda, med 20 tilfælde og to dødsfald, har ikke set et nyt tilfælde siden 21. juni og er begyndt den 42 dages nedtælling, før udbruddet kan erklæres slut."],"whyItMatters":"Der findes hverken godkendt vaccine eller behandling mod Bundibugyo-stammen. Oxford oplyste 24. juli, at den første forsøgsgruppe har fået en eksperimentel vaccine — verdens første forsøg af sin art, og stadig fase 1.","analysis":"Forskellen mellem de to lande er den egentlige oplysning. Uganda stoppede sit udbrud ved 20 tilfælde; DR Congo har 46 ramte sundhedszoner. Kurven følger administrativ kapacitet.","primaryExcerpt":{"quote":"As of 15 July 2026, a total of 2124 confirmed cases, including 828 deaths (crude case fatality ratio [CFR] 39%) have been reported in the Democratic Republic of Congo.","sourceUrl":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613","sourceTitle":"Ebola disease caused by Bundibugyo virus – Democratic Republic of the Congo and Uganda"},"image":{"url":"https://www.aljazeera.com/wp-content/uploads/2026/07/2026-07-16T023821Z_683881990_RC24WLA839ZS_RTRMADP_3_HEALTH-EBOLA-USA-TRAVEL-1784784426.jpg?resize=1920%2C1440","credit":"Foto: Gradel Muyisa Mumbere/Reuters","alt":"Sundhedsarbejder i beskyttelsesdragt i lejren for internt fordrevne i Bunia i det østlige DR Congo","sourceUrl":"https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths"},"topics":["sundhed","epidemi","Afrika","DR Congo","vaccine"],"entities":["DR Congo","Uganda","WHO","Bundibugyo","Ituri","University of Oxford"],"isLead":false,"isOutsideProfile":true,"scores":{"importance":86,"decisionValue":48,"novelty":72,"sourceQuality":84,"personalRelevance":34,"contrast":60},"claims":[{"text":"DR Congos regering opgjorde 26. juli 2026 udbruddet til 3.200 smittede og mindst 1.405 døde, en stigning på cirka 1.000 på ti dage.","sourceUrls":["https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths"],"confidence":"medium"},{"text":"WHO opgjorde 17. juli 2026 2.124 bekræftede tilfælde og 828 døde i DR Congo med en dødelighed på 39 procent, samt 20 tilfælde og to døde i Uganda.","sourceUrls":["https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613"],"confidence":"high"},{"text":"Der findes ingen godkendt vaccine mod Bundibugyo-virus, og Oxford oplyste 24. juli 2026, at den første forsøgsgruppe har modtaget en eksperimentel vaccine.","sourceUrls":["https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths"],"confidence":"medium"}],"sources":[{"title":"Ebola infections in DR Congo surge to 3,200, with 1,405 deaths","publisher":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths","publishedAt":"2026-07-27T01:59:02.000Z","kind":"reporting"},{"title":"Ebola disease caused by Bundibugyo virus – Democratic Republic of the Congo and Uganda","publisher":"World Health Organization","url":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613","publishedAt":"2026-07-17T12:00:00.000Z","kind":"primary"},{"title":"DR Congo says the number of confirmed Ebola cases has surpassed 3000","publisher":"Africanews","url":"https://www.africanews.com/2026/07/26/dr-congo-says-the-number-of-confirme
