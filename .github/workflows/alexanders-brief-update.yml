# Alexanders Brief – midday and afternoon updates. The morning workflow writes the edition; this one
# may ADD two to four stories to it at 12:04 and 17:04 Copenhagen and may change nothing else. Every
# decision is an engine script, the same rule as the daily: the YAML is order, conditions and
# parameters only.
#
# EXPIRES 2026-11-25. That date is also passed to the guard, so after it every run is red with
# "renew or delete" and nothing is spent. A routine nobody is watching fails by going unnoticed;
# this one goes red instead. Renew by moving the date in BOTH places, or delete this file.
# Renewed 2026-10-25 by Alexander's request ("make sure it is working"): the date had passed on
# 2026-10-16 and every run since was red with "This update routine expired" (17 of 34 runs between 10-17
# and 10-25), so the 12:04 and 17:04 updates had stopped landing. It moved by 30 days, from 2026-10-16.
#
# WHICH SLOT [2026-10-25]. GitHub delivered all 152 update crons of this repo 139-582 minutes late
# (median 283, none within 2 hours; measured 2026-10-25), and the slot used to be read from the hour the
# run ARRIVED: the 12:xx crons arrived at 15-21 h and were named "afternoon", the 17:xx crons arrived at
# 19:47-00:24 and fell in no window, and midday never landed (0 of 76). A scheduled run now names its slot
# from the cron that fired it: github.event.schedule goes to the guard and the cap as BRIEF_EVENT_SCHEDULE
# and into the run name as sched=[...], and the engine reads the HOUR field of that string. The exact text
# GitHub sends for a timezone-keyed cron was not known when this was written, so the guard prints the raw
# string on every run; read it in the first scheduled run's log and tell the engine if it differs.
#
# THE PROMISE: nothing already on the page changes. Not a word of a morning story, not a picture, not
# the signals, Klummen, the key number or the recommendations. `merge:update --finalize` compares the
# merged edition against the published one field by field and exits 1 on any other difference, and
# the publish step below it never runs on a non-zero exit.

name: Alexanders Brief – update

# The run's name carries the slot, because the runs API will not show a past run's dispatch inputs
# any other way and `ci-attempt-cap.sh --slot` reads it to count one agent run per slot per day.
# A dispatch writes slot=midday or slot=afternoon. A scheduled run writes slot=cron and, after it,
# sched=[<the cron string that fired it>]: the cap reads the slot of a scheduled run from that string
# (github.event.schedule), because the hour the run started says nothing when GitHub delivers a
# 12:04 cron at 21:00. `slot=` stays before `sched=`: the cap reads the first one that names a slot.
run-name: "Alexanders Brief – update · slot=${{ inputs.slot || 'cron' }}${{ github.event.schedule && format(' · sched=[{0}]', github.event.schedule) || '' }}${{ inputs.dry_run && ' · dry run' || '' }}"

on:
  schedule:
    # Copenhagen, the same timezone key the daily proves works. :04 is the run, :36 the retry; the
    # retry finds the slot already recorded in the archive and ends green in seconds. The slot of a
    # scheduled run is read from the hour field of the cron that fired it (12 midday, 17 afternoon),
    # which both crons of each pair share, and not from the hour the run arrives: see the header.
    - cron: "4 12 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "36 12 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "4 17 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "36 17 * * *"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:
    inputs:
      slot:
        description: "Which update run. Blank on a schedule, where the cron that fired the run decides."
        required: false
        type: choice
        options: ["midday", "afternoon"]
      date:
        description: "Edition date YYYY-MM-DD. Blank = today in Europe/Copenhagen."
        required: false
        type: string
      engine_ref:
        description: "Engine branch to run. Blank = the live branch. Use to trial a change."
        required: false
        type: string
      dry_run:
        description: "Produce the additions and stop. Publishes nothing; uploads them for review."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

# The daily's group, deliberately: an update must never run while the morning is being written, and a
# 12:36 retry must queue behind the 12:04 run rather than race it for the same archive.
concurrency:
  group: alexanders-brief-daily
  cancel-in-progress: false

env:
  TZ: Europe/Copenhagen
  ENGINE_REPO: abustrup/alexanders-brief-source
  ENGINE_REF: ${{ inputs.engine_ref || 'feature/news-brief-mvp' }}
  SITE_URL: https://abustrup.github.io/alexanders-brief
  PROMPT_PATH: docs/routines/backup-from-claude-dir/brief-update.SKILL.md
  BRIEF_LABEL: alexanders-brief-update
  # Written here and read by the guard. Both must move together; see the header.
  # Renewed 2026-10-25 by Alexander's request "make sure it is working" (was 2026-10-16): REVIEW 2026-11-25.
  UPDATE_EXPIRES: "2026-11-25"
  # Pinned, as the daily pins it: an overnight release must not break an unattended run.
  CLAUDE_CLI_VERSION: "2.1.228"
  # PAGES_REPO_DIR is set only on the steps that need the website checkout, never job-wide, so the
  # agent's environment cannot resolve a publish target. Structure, not a rule it could reread.

jobs:
  update:
    runs-on: ubuntu-latest
    # 120, was 110 (and 90 until 2026-10-25), and the arithmetic matters: the liveness proof is the LAST
    # step, and a job that dies during it kills a run that has already published — the reader has the new
    # page and the run is red with no proof either way. The capped steps are the agent (35), the picture
    # desk on the additions (stage cap 25, step cap 29), the gate (15) and liveness (20) = 99, leaving 21
    # minutes for checkout, npm ci, the rest of the picture pass, the merge and the publish, which together
    # (the picture desk aside) have never run past 10. So liveness cannot be the step that
    # exhausts the job: its own cap expires first, and a timed-out liveness step is a red with a
    # published page rather than a cancelled job with no record at all. [Round 2, 2026-10-25: the desk's
    # stage cap went from 18 to 25 minutes so that a second pass, which the stage now sends whenever the
    # first was stopped, has room after a first pass of 8 minutes and two resolver runs.]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: engine

    steps:
      - name: Check out the engine (read-only deploy key)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
          path: engine

      # Its own step rather than four lines added to scripts/ci-preflight.sh: that preflight is shared
      # with Thomas' branch, which gets none of this, and a file it required there would red his
      # morning for a routine he does not have.
      - name: Preflight – update scripts present
        run: |
          missing=0
          for f in scripts/ci-update-mode.sh scripts/ci-attempt-cap.sh scripts/ci-compose-prompt.sh \
                   scripts/ci-update-pictures.mjs scripts/ci-agent-cost.mjs scripts/ci-gate.sh \
                   scripts/ci-publish.sh scripts/brief-liveness.sh src/cli/mergeUpdate.ts \
                   "$PROMPT_PATH"; do
            if [ -f "$f" ]; then printf '  ok   %s\n' "$f"
            else printf '::error::%s is missing on %s, so this update run could not work. Nothing was spent.\n' "$f" "$ENGINE_REF"; missing=$((missing + 1)); fi
          done
          for s in merge:update update:pictures resolve:images prune:images validate:draft check:draft publish:pages; do
            if node -e 'const p=require("./package.json");process.exit(p.scripts&&p.scripts[process.argv[1]]?0:1)' "$s"; then
              printf '  ok   npm run %s\n' "$s"
            else printf '::error::the npm script "%s" does not exist on %s.\n' "$s" "$ENGINE_REF"; missing=$((missing + 1)); fi
          done
          [ "$missing" = "0" ] || exit 1

      # UPDATE / DONE / NOT_PUBLISHED / EXPIRED / UNKNOWN. Red on the last two, with nothing spent.
      # The expiry reaches the guard as --expires=$UPDATE_EXPIRES (renewed to 2026-11-25 on 2026-10-25, see the
      # header), checked before the slot. The slot is the dispatch input when there is one, otherwise the hour
      # field of BRIEF_EVENT_SCHEDULE, the cron string GitHub says fired this run, otherwise the Copenhagen
      # clock. A scheduled run that arrives at Copenhagen hour 0-10 is yesterday's cron delivered late and
      # ends green as NOT_PUBLISHED without touching the network.
      - name: Guard – is today out, and has this slot added to it yet?
        id: guard
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SLOT: ${{ inputs.slot }}
          BRIEF_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_SLOT" ]; then
            bash scripts/ci-update-mode.sh "$SITE_URL" "$INPUT_DATE" "--slot=$INPUT_SLOT" "--expires=$UPDATE_EXPIRES"
          else
            bash scripts/ci-update-mode.sh "$SITE_URL" "$INPUT_DATE" "--expires=$UPDATE_EXPIRES"
          fi

      # One place decides whether the rest of this job runs, so twelve `if:` lines cannot drift apart.
      #
      # It branches on the guard's VERDICT, not on its mode. The guard folds two different
      # situations into mode=done — DONE (this slot has already added to today) and NOT_PUBLISHED
      # (there is no edition to add to at all) — and only the first of them is a sensible dry run.
      # Reading the mode alone sent a dry run on an unpublished day past a warning about a slot
      # that had "already added", and it then died at the base copy with an error about a missing
      # archive. A day whose morning never published has nothing to trial: stop cleanly, in
      # seconds, spending nothing, exactly as a real run does.
      - name: Plan
        id: plan
        env:
          VERDICT: ${{ steps.guard.outputs.verdict }}
          MODE: ${{ steps.guard.outputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          GO=false
          if [ "$MODE" = "update" ]; then
            GO=true
          elif [ "$DRY_RUN" = "true" ] && [ "$VERDICT" = "DONE" ]; then
            # A dry run publishes nothing, and the whole point of dispatching one is to see what
            # this desk would produce on a slot that has already run.
            printf '::warning::dry run: the %s slot has already added to %s, but a dry run publishes nothing, so it proceeds to produce an artifact.\n' \
              "${{ steps.guard.outputs.slot }}" "${{ steps.guard.outputs.date }}"
            GO=true
          elif [ "$DRY_RUN" = "true" ] && [ "$VERDICT" = "NOT_PUBLISHED" ]; then
            printf 'plan: %s has no published edition, so there is nothing for a dry run to add to either. Stopping; nothing was spent.\n' \
              "${{ steps.guard.outputs.date }}"
          fi
          printf 'go=%s\n' "$GO" >> "$GITHUB_OUTPUT"
          printf 'plan: verdict=%s mode=%s dry_run=%s -> go=%s\n' "$VERDICT" "$MODE" "${DRY_RUN:-false}" "$GO"

      # Full history: the push rebases onto whatever the Mac routines and the morning pushed here.
      - name: Check out the website repo
        if: steps.plan.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          path: pages

      - name: Node
        if: steps.plan.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: engine/.nvmrc
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Dependencies
        if: steps.plan.outputs.go == 'true'
        run: npm ci

      # The base. draft.json is what the agent appends to and what every check downstream reads;
      # published.json is the same bytes kept beside it, because the agent is told not to read the
      # website checkout and `update:pictures` needs to know where the published stories end.
      # The merge's own --base is the website checkout's copy, not this one: a base inside the
      # engine is a base the agent could edit.
      - name: Copy today's published edition in as the base
        if: steps.plan.outputs.go == 'true'
        env:
          DATE: ${{ steps.guard.outputs.date }}
          ARCHIVE: ${{ github.workspace }}/pages/data/${{ steps.guard.outputs.date }}.json
        run: |
          [ -s "$ARCHIVE" ] || { printf '::error::the published edition %s is not in the website checkout, so there is nothing to add to.\n' "$ARCHIVE"; exit 1; }
          mkdir -p "data/$DATE"
          cp "$ARCHIVE" "data/$DATE/draft.json"
          cp "$ARCHIVE" "data/$DATE/published.json"
          node -e 'const b=require(process.argv[1]);console.log(`base: ${b.stories.length} stories, runId ${b.runId}`)' "$(pwd)/data/$DATE/published.json"

      # Advisory, as on the daily: a dead backend costs the dedup memory, not the update.
      - name: Editorial context (advisory)
        if: steps.plan.outputs.go == 'true'
        continue-on-error: true
        env:
          BRIEF_API_URL: ${{ secrets.BRIEF_API_URL }}
          BRIEF_PUBLISH_TOKEN: ${{ secrets.BRIEF_PUBLISH_TOKEN }}
        run: npm run context

      # ONE agent run per slot per day. A failed update costs the additions, never the morning, so
      # there is no retry budget here: the reader keeps the page he already has.
      - name: Attempt cap
        id: cap
        if: steps.plan.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_FULL_ATTEMPTS: ${{ inputs.dry_run && '9' || '1' }}
          # The guard has already named the slot, so this run's own slot never needs it; the cap reads the
          # same cron string from the NAMES of earlier runs (sched=[...]) to tell which slot each one was.
          BRIEF_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: bash scripts/ci-attempt-cap.sh "${{ steps.guard.outputs.date }}" "--slot=${{ steps.guard.outputs.slot }}"

      # TOKEN DIET [2026-10-08]. Input is 99.6% of what a run costs (cost = turns x context size), so what
      # the agent used to fetch and carry through ~120 turns is now packed by plain code before it starts:
      # recent.md / recent-full.md (the last 30 days, for the repeat check) and taste.md (the reader's votes
      # as a few lines), read from the sibling pages checkout. --include-today because an update ADDS to
      # today's edition: what the morning already carries must count as recent, or the update would
      # offer it again. Fails open, and fails TO THE OLD BEHAVIOUR: if the script errors or is absent from
      # this engine ref, the lines below delete whatever it left half-written and write NOTHING. The prompt
      # header only switches to the pack when recent.md exists; with no file it keeps the three WebFetch
      # dedup URLs, which are then the only repeat check there is (context.json carries no history). A
      # placeholder file here would switch the header over and take that check away, with the run still
      # green [fixed 2026-10-09].
      - name: Pack the 30-day memory and the reader's taste
        if: steps.cap.outputs.proceed == 'true'
        continue-on-error: true
        env:
          DATE: ${{ steps.guard.outputs.date }}
        run: |
          if ! npm run --silent ci:context-pack -- "$DATE" --include-today --archive="${{ github.workspace }}/pages/data"; then
            # Only the pack's own outputs; context.json stays. Globs, so a file the engine adds later
            # (columns.md) is covered without an edit here.
            rm -f "data/$DATE"/recent*.md "data/$DATE"/columns*.md "data/$DATE"/taste*.md
            printf '::warning::the context pack failed on engine %s; no pack files were left behind, so the prompt falls back to the three-edition WebFetch text.\n' "$ENGINE_REF"
          fi
          PACKED="$(find "data/$DATE" -maxdepth 1 \( -name 'recent*.md' -o -name 'columns*.md' -o -name 'taste*.md' \) 2>/dev/null | sort || true)"
          if [ -n "$PACKED" ]; then ls -l $PACKED; else echo "no pack files for $DATE"; fi

      - name: Install the agent, compose the prompt
        if: steps.cap.outputs.proceed == 'true'
        env:
          PROMPT_KIND: update
          BRIEF_UPDATE_SLOT: ${{ steps.guard.outputs.slot }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
        run: |
          npm i -g "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION"
          bash scripts/ci-compose-prompt.sh "${{ steps.guard.outputs.date }}" > "$RUNNER_TEMP/run-prompt.md"
          printf 'composed %s bytes\n' "$(wc -c < "$RUNNER_TEMP/run-prompt.md" | tr -d ' ')"

      # Named exactly as the daily names it: scripts/ci-attempt-cap.sh counts a run as having spent
      # model time by finding a step whose name matches /editorial agent/i. RENAMING IT DISABLES THE CAP.
      # stdout is the CLI's own stream of events, kept whole in agent.stream; the step after this one
      # pulls its final result object into agent.json, which is the only record of what this run cost.
      # A non-zero exit is a warning; the merge and the gate decide.
      - name: Run the editorial agent
        if: steps.cap.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 35
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # EFFORT LOWERED TO medium, 2026-09-30, at Alexander's request to spend fewer tokens. The model
          # here is claude-sonnet-5, whose default is high [docs: code.claude.com/docs/en/model-config],
          # so this is a real reduction. What it does and does not buy: measured on 11 update runs, about
          # two thirds of a run's cost is re-reading the conversation on each of ~120 steps, and only
          # ~14% is output, so expect a modest saving, not a halving. Judge it by updateRuns[].cost.
          # REVERT: delete the --effort line. To go further, low; to restore, high.
          #
          # STREAM, NOT ONE JSON OBJECT [2026-10-08]. The whole transcript goes to a file and the log stays
          # short: it is what `npm run ci:profile` reads to say where the tokens went. The final result
          # object is the same one `--output-format json` printed, and the step below keeps it as agent.json
          # so the limit check, the cost line and the desk report read exactly what they always read.
          # stderr (the CLI's own diagnostics, login and limit messages) still reaches the log.
          status=0
          # LEAN LOAD, 2026-10-09. Every turn re-reads the whole conversation, so what is loaded before the
          # first turn is paid for ~120 times. Measured in this runner (CLI 2.1.228, one trivial call):
          # base context 32,092 tokens with the default tool list and system prompt, 19,054 with --tools
          # restricted to what the run uses, 11,024 with config/agent-system-prompt.md instead of Claude
          # Code's default prompt. The tool smoke test passed under exactly these flags (all tools called
          # and landed). An engine ref without the file keeps the default prompt. REVERT: delete LEAN.
          LEAN=(--tools "Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch" --disable-slash-commands)
          if [ -s config/agent-system-prompt.md ]; then LEAN+=(--system-prompt "$(cat config/agent-system-prompt.md)"); fi
          claude -p "$(cat "$RUNNER_TEMP/run-prompt.md")" "${LEAN[@]}" \
            --output-format stream-json --verbose --no-session-persistence --permission-mode acceptEdits --effort medium \
            --allowedTools Read Write Edit Glob Grep WebSearch WebFetch "Bash(npm run *)" "Bash(node *)" "Bash(wc *)" "Bash(date *)" \
            --disallowedTools "Bash(npm run publish*)" "Bash(git *)" "Bash(gh *)" "Bash(curl *)" "Bash(ssh *)" Task \
            > "$RUNNER_TEMP/agent.stream" 2> "$RUNNER_TEMP/agent.err" || status=$?
          cat "$RUNNER_TEMP/agent.err" >&2
          exit "$status"

      # The last `result` event of the stream, as the one JSON object the next steps read. No result
      # event (the CLI died mid-run) falls back to the last JSON line, so the limit check below still
      # sees whatever the CLI said last. Named so the attempt cap does not mistake it for the agent.
      - name: Keep the final result of the run
        if: ${{ always() && steps.cap.outputs.proceed == 'true' }}
        continue-on-error: true
        run: |
          node -e '
            const fs = require("fs");
            let result = "", lastJson = "";
            for (const line of fs.readFileSync(process.argv[1], "utf8").split("\n")) {
              if (!line.startsWith("{")) continue;
              try { const event = JSON.parse(line); lastJson = line; if (event && event.type === "result") result = line; } catch {}
            }
            const keep = result || lastJson;
            if (keep) fs.writeFileSync(process.argv[2], keep + "\n");
            console.log(result ? "final result kept" : keep ? "no result event; kept the last JSON line" : "the stream held no JSON at all");
          ' "$RUNNER_TEMP/agent.stream" "$RUNNER_TEMP/agent.json"

      # WHY THESE TWO STEPS EXIST [2026-10-03]. The 29 Sep - 2 Oct mornings went unpublished because a Pro
      # usage window runs out inside the run ("You've hit your session limit"), the agent exits with no
      # edition, and ci-attempt-cap.sh then counted that run as spent: two of them used up both attempts by
      # 06:10, and the runs GitHub fired after the 10:40 reset were refused. A run the account refused to
      # serve spent nothing worth counting. The first step looks; the second exists only so that the cap
      # (scripts/ci-attempt-cap.sh) can see, in the run's step list, that this one should not be counted.
      - name: Did a usage limit or login refusal stop the agent?
        id: limit
        if: steps.cap.outputs.proceed == 'true'
        continue-on-error: true
        run: |
          if grep -qiE 'hit your [a-z0-9 -]{0,20}limit|organization has disabled|failed to authenticate|credit balance is too low' "$RUNNER_TEMP/agent.json" 2>/dev/null; then
            echo "limit=true" >> "$GITHUB_OUTPUT"
            printf '::warning::The agent was stopped before it could add anything: %s\n' \
              "$(grep -ioE 'hit your [a-z0-9 -]{0,20}limit|organization has disabled[^"]{0,60}' "$RUNNER_TEMP/agent.json" | head -1)"
          else
            echo "limit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Agent stopped before it could work (usage limit or login)
        if: steps.limit.outputs.limit == 'true'
        run: echo "This run spent no model time worth counting. The retry cap will not count it, so the :36 retry can still add today."

      # The first place in this project a run's own cost is recorded. Never blocking: an accounting
      # field must not cost an edition, so the script exits 0 on everything and writes {} when it
      # found nothing. The numbers also travel into updateRuns[].cost in the merge step below.
      - name: What this run cost
        if: ${{ always() && steps.cap.outputs.proceed == 'true' }}
        continue-on-error: true
        run: |
          node scripts/ci-agent-cost.mjs "$RUNNER_TEMP/agent.json" --out="$RUNNER_TEMP/cost.json" \
            --label="${{ steps.guard.outputs.slot }} update ${{ steps.guard.outputs.date }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Where the tokens went [2026-10-08]: turns, context size, bulkiest tool results, files read twice.
      # Read from the whole transcript. Never blocking, like the cost line above it.
      #
      # WHAT THIS PRINTS IS PUBLIC [2026-10-09]: the log and the step summary of this repo are both readable
      # by anyone. ci:profile prints counts (turns, tokens, calls per tool) and, for the 8 bulkiest tool
      # results and the files read twice, the tool name, the target (a file path, a URL, a search query, the
      # start of a command) and the size in characters. It never prints a tool result, a file's content or
      # the agent's text. So it does reveal which files and pages the desk opened, what it searched for and
      # the first words of its commands, and nothing it read inside them. The filter after it is a second
      # lock that does not depend on the engine ref being the current one: every table cell is cut to 90
      # characters (the script cuts a target to 70) and every line to 1,000.
      - name: Where the tokens went (profile)
        if: ${{ always() && steps.cap.outputs.proceed == 'true' }}
        continue-on-error: true
        run: |
          FILTER='
            const MAX_CELL = 90, MAX_LINE = 1000;
            const clip = (t, n) => { const c = Array.from(t); return c.length > n ? c.slice(0, n - 1).join("") + "…" : t; };
            const rows = require("fs").readFileSync(0, "utf8").split("\n").map((line) => {
              if (line.startsWith("|")) line = line.split(/(?<!\\)\|/).map((cell) => clip(cell, MAX_CELL)).join("|");
              return clip(line, MAX_LINE);
            });
            process.stdout.write(rows.join("\n"));
          '
          npm run --silent ci:profile -- "$RUNNER_TEMP/agent.stream" | node -e "$FILTER" | tee -a "$GITHUB_STEP_SUMMARY"

      # The desk's own completion report. The result object carries only the agent's final text, not
      # the transcript, so this is the one place a run explains itself. Added after the first afternoon
      # run (35133285563, 2026-09-16) dropped a picture nothing in the log could account for.
      - name: What the desk said it did
        if: ${{ always() && steps.cap.outputs.proceed == 'true' }}
        continue-on-error: true
        run: node scripts/ci-desk-report.mjs "$RUNNER_TEMP/agent.json" >> "$GITHUB_STEP_SUMMARY"

      # NO TRANSCRIPT UPLOAD, ON PURPOSE [2026-10-09]. On 2026-10-08 a step here kept the whole stream as a
      # 7-day artifact after cutting out tokens. This repo is public and the artifacts of a public repo can
      # be downloaded by any signed-in GitHub user, while the stream holds the full text of every file the
      # agent Read, the private editorial profile among them. Cutting token-shaped strings does nothing for
      # that. The measurement lives on in the profile step above (counts, tool, target, size; no content).
      # Do not add an upload of agent.stream, agent.err or agent.json back; the only files this job uploads
      # are the dry-run draft, additions and pictures.

      # The picture desk and the final picture pass, on THIS RUN'S ADDITIONS ONLY. Measured on 2026-09-16
      # against the real published edition: `prune:images --final` over a whole update draft dropped two
      # morning pictures (their lookedAt stamps belong to the morning's preview manifest, which is gone), and
      # a plain resolver run rewrote 8 of 9 morning stories. Either would make the merge refuse the run.
      # So the additions are split out, judged, and joined back; the morning stories are never in the
      # file the resolver is handed. The merge still checks them afterwards — this is a fix, not a waiver.
      #
      # THE PICTURE DESK [2026-10-25] runs between the split and the final pass. Until then the pictures of
      # the additions were only a request inside the agent's last phase, which it skipped on the days it
      # skipped the morning's, and this step then only took pictures away. `npm run ci:picture-stage` is
      # the same stage the morning runs, on additions.json: the resolver fills, one picture-desk agent
      # looks and searches, the stage checks its own result. Same standard as the morning's pictures
      # (Alexander, 2026-09-16: "same quality and method as other pics if possible, if not possible just
      # forget it"): a story that gets no true picture runs as text. The stage never fails the run, and a
      # stage that is cut off by its time cap or absent from this engine ref leaves the explicit final
      # pass below to take away whatever nobody looked at, as it always did. Its name carries no "editorial
      # agent", which ci-attempt-cap.sh counts as an agent run. Time caps: 240 s per resolver run and 480 s
      # per desk pass inside the stage, 1,500 s for the whole stage from outside (1,080 until round 2 of
      # 2026-10-25: the stage now sends a second pass whenever the first was stopped, and two passes of 480 s
      # plus two resolver runs need 1,440 s). The desk's turn budget is the stage's default, 160.
      - name: Picture desk on the additions, then the final pass
        if: steps.cap.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 29
        env:
          DATE: ${{ steps.guard.outputs.date }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PICTURE_MECHANICAL_TIMEOUT_S: "240"
          PICTURE_DESK_TIMEOUT_S: "480"
          STAGE_TIMEOUT_S: "1500"
        run: |
          BASE="${{ github.workspace }}/pages/data/${DATE}.json"
          ADD="data/${DATE}/additions.json"
          npm run --silent update:pictures -- split --draft="data/${DATE}/draft.json" --base="$BASE" --out="$ADD"
          cp "$ADD" "$RUNNER_TEMP/additions.before-picture-desk.json"
          # STRICT, ALWAYS, on additions [2026-10-25]. The additions are extras on a page that already stands: Alexander
          # (2026-09-16) "same quality and method as other pics if possible, if not possible just forget it". So a
          # picture nobody looked at never ships here, whether the desk completed or not: the stage and the explicit
          # final pass below both run `--strict`. Only on an engine ref that has the stage: an older resolver would
          # refuse the unknown flag, and the final pass would not run at all.
          STRICT=""
          if node -e 'const p=require("./package.json");process.exit(p.scripts&&p.scripts["ci:picture-stage"]?0:1)'; then
            STRICT="--strict"
            stage_rc=0
            timeout --kill-after=60 "$STAGE_TIMEOUT_S" \
              npm run --silent ci:picture-stage -- "$ADD" --date="$DATE" $STRICT \
                --archive="${{ github.workspace }}/pages/data" --ledger=data/image-ledger.json \
                --preview-dir="data/${DATE}/image-previews" || stage_rc=$?
            if [ "$stage_rc" != "0" ]; then
              printf '::warning::picture desk: the stage ended with exit code %s (124 means it ran out of its %s seconds); what it left is checked below.\n' "$stage_rc" "$STAGE_TIMEOUT_S"
            fi
          else
            printf '::warning::picture desk: engine ref %s has no ci:picture-stage, so only the final pass runs on the additions.\n' "$ENGINE_REF"
          fi
          # A desk killed mid-edit must not hand the join a broken file; an empty list of stories is fine. The newest
          # readable copy comes back: the stage keeps one before each desk pass, then the one from before the desk.
          readable() { node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit(Array.isArray(d.stories)?0:1)' "$1" 2>/dev/null; }
          if ! readable "$ADD"; then
            for snap in $(ls -1r "data/${DATE}/picture-stage"/before-*.json 2>/dev/null) "$RUNNER_TEMP/additions.before-picture-desk.json"; do
              if readable "$snap"; then
                printf '::warning::picture desk: %s is not readable after the stage, so %s was put back.\n' "$ADD" "$(basename "$snap")"
                cp "$snap" "$ADD"
                break
              fi
            done
          fi
          # The quality gate refuses the WHOLE edition if any story picture lacks its alt text or its source page
          # (image-metadata-incomplete), and the stage is promised never to block a publish. A picture the desk
          # set by hand without them is taken out here, so one forgotten field costs a picture and not the update.
          # [2026-10-25: the rule lives in the engine, where it is tested (scripts/ci-picture-report.mjs net); an
          # engine ref without it keeps the block below, which is what this step always ran.]
          cat > "$RUNNER_TEMP/picture-net.js" <<'JS'
          const fs = require("fs");
          const file = process.argv[2];
          const raw = fs.readFileSync(file, "utf8");
          const brief = JSON.parse(raw);
          const out = [];
          (brief.stories || []).forEach((story, index) => {
            const image = story && story.image;
            if (image && (!image.alt || !image.sourceUrl)) { delete story.image; out.push(index + 1); }
          });
          if (out.length) {
            const indent = /^\{\r?\n(\s+)/.exec(raw);
            fs.writeFileSync(file + ".tmp", JSON.stringify(brief, null, indent ? indent[1].length : 2) + "\n");
            fs.renameSync(file + ".tmp", file);
            console.log("::warning::picture desk: the picture of added story " + out.join(", ") + " has no alt text or no source page, which the quality gate refuses for the whole edition, so it was taken out and the story runs as text");
          }
          JS
          if [ -f scripts/ci-picture-report.mjs ] && grep -q 'case "net"' scripts/ci-picture-report.mjs; then
            node scripts/ci-picture-report.mjs net "$ADD" --before="$RUNNER_TEMP/additions.before-picture-desk.json" --label="added story"
          else
            node "$RUNNER_TEMP/picture-net.js" "$ADD"
          fi
          npm run --silent prune:images -- "$ADD" --ledger=data/image-ledger.json --final $STRICT \
            --archive="${{ github.workspace }}/pages/data" --preview-dir="data/${DATE}/image-previews" --verbose
          npm run --silent update:pictures -- join --draft="data/${DATE}/draft.json" --base="$BASE" --additions="$ADD"

      # A dry run produces the additions and stops. They are the whole point of the run, so they are
      # uploaded rather than thrown away with the runner.
      - name: Keep the trial additions for review
        if: ${{ inputs.dry_run && steps.cap.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: update-trial-${{ steps.guard.outputs.slot }}
          path: |
            engine/data/${{ steps.guard.outputs.date }}/draft.json
            engine/data/${{ steps.guard.outputs.date }}/additions.json
            engine/data/${{ steps.guard.outputs.date }}/image-previews/
            engine/data/${{ steps.guard.outputs.date }}/picture-look.json
            engine/data/${{ steps.guard.outputs.date }}/picture-stage.json
          if-no-files-found: warn

      # A dry run runs the merge and the gate too, on purpose [2026-09-16]: the first cloud dry run
      # skipped both, so the artifact proved the desk and not the promise, and the promise had to be
      # proven by hand afterwards. Publish still never runs on a dry run.
      # THE PROMISE, enforced. Blocking on purpose: a non-zero exit here stops the publish, and a run
      # that added nothing still finalizes with added: 0 so the page can say "ingen nye historier".
      - name: Merge the additions into today's edition
        id: merge
        if: ${{ steps.cap.outputs.proceed == 'true' }}
        env:
          DATE: ${{ steps.guard.outputs.date }}
          SLOT: ${{ steps.guard.outputs.slot }}
        run: |
          COST=""
          [ -s "$RUNNER_TEMP/cost.json" ] && COST="--cost=$RUNNER_TEMP/cost.json"
          npm run --silent merge:update -- "data/${DATE}/draft.json" --finalize \
            --slot="$SLOT" \
            --run-id="run-${DATE}-u${SLOT}-r${GITHUB_RUN_NUMBER}" \
            --base="${{ github.workspace }}/pages/data/${DATE}.json" \
            $COST

      - name: Quality gate (blocking)
        id: gate
        if: ${{ steps.cap.outputs.proceed == 'true' }}
        timeout-minutes: 15
        env:
          REQUIRE_FLOOR: "true"
          REQUIRE_SOURCE_REACH: "true"
          REQUIRE_SOURCE_ECHO: "true"
        run: bash scripts/ci-gate.sh "${{ steps.guard.outputs.date }}"

      # The push credential enters here, after the agent has finished and been judged. BRIEF_UPDATE
      # turns off the republish restore: on an update that restore would copy the published morning
      # over the merged edition and then prove it published successfully.
      - name: Publish
        id: publish
        if: ${{ !inputs.dry_run && steps.cap.outputs.proceed == 'true' && steps.merge.outcome == 'success' && steps.gate.outcome == 'success' }}
        env:
          BRIEF_UPDATE: ${{ steps.guard.outputs.slot }}
          BRIEF_FEEDBACK_URL: ${{ secrets.BRIEF_API_URL }}
          GH_PUSH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
        run: bash scripts/ci-publish.sh "${{ steps.guard.outputs.date }}"

      - name: Ask GitHub Pages to build
        if: ${{ steps.publish.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

      # The judge of this run's colour: the merged edition carries a new runId, so this proves the
      # reader's page is the updated one and not the morning's.
      # Capped at 20 because check-liveness.sh polls: LIVENESS_POLLS 48 x LIVENESS_INTERVAL 15s is
      # 11m45s of sleeping, plus one page fetch (CURL_TIMEOUT 20s) and one Pages-build query per
      # poll, neither of which is otherwise bounded. 20 leaves the polling budget its full run and
      # still expires before the job's own 90 does, which is the point: a step that times out here
      # is a red run with the page already published and the whole log intact, where a job that
      # timed out would cancel with no verdict written at all.
      - name: Prove the reader is served
        id: served
        timeout-minutes: 20
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
          PUSHED_SHA: ${{ steps.publish.outputs.sha }}
        run: bash scripts/brief-liveness.sh "${{ steps.guard.outputs.date }}"

      # THERE IS DELIBERATELY NO LEDGER STEP HERE. The daily has one, and it must not be copied.
      # scripts/ci-record-ledger.sh does not append to the public ledger; it REBUILDS
      # data/ledger/indicators.json and column-claims.json from the engine checkout's own copies
      # and pushes the result. On a morning that is right: the agent has just written today's
      # indicator readings and Klummen's dated claim into that checkout. An update run writes
      # neither — it adds stories and nothing else — so its checkout carries only what is
      # committed on the engine branch, and running this step at 12:04 would push a ledger with
      # today's Klumme claim deleted, having proved the publish succeeded. The daily's step is left
      # byte-identical and the script is not made conditional: an update simply does not record a
      # memory it never formed.

      # From the workspace, not engine/, so a failed engine checkout still gets a summary.
      - name: Summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          VERDICT: ${{ steps.guard.outputs.verdict }}
          MODE: ${{ steps.guard.outputs.mode }}
          DATE: ${{ steps.guard.outputs.date }}
          SLOT: ${{ steps.guard.outputs.slot }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          SERVED: ${{ steps.served.outcome }}
          # The picture pass runs on exactly this condition, so the summary reports on exactly
          # this condition. Not on `mode`: a dry run dispatched against a slot that has already
          # run has mode=done and still looks at pictures.
          PROCEED: ${{ steps.cap.outputs.proceed }}
        run: |
          printf '### %s – %s %s\n\n- guard `%s` · mode `%s` · engine `%s` · expires %s\n- pushed `%s` · served `%s`\n' \
            "$BRIEF_LABEL" "${DATE:-unresolved}" "${SLOT:-no slot}" "${VERDICT:-none}" "${MODE:-none}" \
            "$ENGINE_REF" "$UPDATE_EXPIRES" "${PUBLISHED_SHA:-none}" "${SERVED:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          EDITION="engine/data/${DATE}/draft.json"
          if [ -n "${DATE:-}" ] && [ -f "$EDITION" ]; then
            node -e '
              const brief = require(process.argv[1]);
              const added = (brief.stories || []).filter((s) => s && s.addedBy && s.addedBy.slot === process.argv[2]);
              const runs = (brief.updateRuns || []).map((r) => `${r.slot} +${r.added}`).join(", ") || "none";
              console.log(`- added this run: ${added.length}${added.length ? " — " + added.map((s) => s.headline).join(" · ") : ""}`);
              console.log(`- update runs on this edition: ${runs}`);
            ' "$(pwd)/$EDITION" "${SLOT:-}" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          # Whether the editor looked at the added pictures. Copied from the daily, ELSE-BRANCH AND
          # ALL: a missing file means the final pass never ran (a refused flag, a step that failed
          # under continue-on-error), and that has to be as visible as a look that was skipped —
          # otherwise the one line that would have said so is simply absent from the summary.
          LOOK="engine/data/${DATE}/picture-look.json"
          if [ -n "${DATE:-}" ] && [ "${PROCEED:-}" = "true" ]; then
            if [ -f "$LOOK" ]; then
              node -e 'const l=require(process.argv[1]);console.log(`- picture look: ${l.looked?"done":"SKIPPED"} · ${l.matched??l.stamped}/${l.pictures} seen · dropped unseen ${l.droppedUnseen} · ${l.reason}`)' "$(pwd)/$LOOK" >> "$GITHUB_STEP_SUMMARY" || true
            else
              printf -- '- picture look: MISSING, the final picture pass did not run\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            # The stage's own block (per-story table, the desk's report) was written by the stage. This is the
            # one-line verdict, and the line that says so when the stage left no record at all.
            STAGE="engine/data/${DATE}/picture-stage.json"
            if [ -f "$STAGE" ]; then
              node -e 'const s=require(process.argv[1]);console.log(s.ran?`- picture desk: ${s.met?(s.metByRecordsOnly?"floor met BY RECORDS ONLY":"floor met"):"FLOOR MISSED"} · ${s.withPicture}/${s.stories} added stories with a picture (${Math.round(100*(s.coverage||0))}%, floor ${Math.round(100*(s.floor||0))}%) · ${s.passes} pass(es) · final ${s.strict?"strict":"lenient"}${(s.unlooked||[]).length?" · UNLOOKED "+s.unlooked.length:""}`:`- picture desk: did not run · ${s.reason||"no reason recorded"}`)' "$(pwd)/$STAGE" >> "$GITHUB_STEP_SUMMARY" || true
            else
              printf -- '- picture desk: NO RECORD, the stage did not run on this engine ref or was cut off\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
