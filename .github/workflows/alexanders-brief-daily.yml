# Alexanders Brief – unattended cloud publish. Order, conditions and parameters only; every decision is
# an engine script (ENGINE-CONTRACT.md) that must exist on BOTH engine branches – the rule whose absence
# meant Thomas' brief could never publish. Install: land the contract on both branches, dispatch a
# daylight run that reaches the push, then let the crons stand.

name: Alexanders Brief – daily

on:
  schedule:
    # Budget/attempt = 77 min delay tail + 145 min run = 222. 06:40 - 222 = 02:58 falls in the hour that
    # repeats each October, so the last usable start is 01:49 (+222 = 05:31). No :00/:30, none in 02:xx.
    # Three crons insure against a dropped trigger, not a slow run: a later cron queues behind it.
    - cron: "11 6 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "47 6 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "13 7 * * *"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date YYYY-MM-DD. Blank = today in Europe/Copenhagen."
        required: false
        type: string
      engine_ref:
        description: "Engine branch to run. Blank = the live branch. Use to trial a change."
        required: false
        type: string
      dry_run:
        description: "Produce the draft and stop. Publishes nothing; uploads it for review."
        required: false
        type: boolean
        default: false

# Declared here: default_workflow_permissions is read on all three repos. No issues:write – this file
# never opens one, and the watchdog living in this repo declares its own.
permissions:
  contents: write
  pages: write

concurrency:
  group: alexanders-brief-daily
  cancel-in-progress: false

env:
  TZ: Europe/Copenhagen
  ENGINE_REPO: abustrup/alexanders-brief-source
  ENGINE_REF: ${{ inputs.engine_ref || 'feature/news-brief-mvp' }}
  SITE_URL: https://abustrup.github.io/alexanders-brief
  PROMPT_PATH: docs/routines/backup-from-claude-dir/daily-news-brief.SKILL.md
  BRIEF_LABEL: alexanders-brief
  DEADLINE_CPH: "06:40"
  # Pinned: an overnight release must not break an unattended run. REVIEW 2026-11-01.
  CLAUDE_CLI_VERSION: "2.1.228"
  # count:length is advisory (step 10), so preflight warns rather than fails when absent.
  PREFLIGHT_ADVISORY_SCRIPTS: "count:length"
  # PAGES_REPO_DIR is set only on the publish/liveness/ledger steps, never job-wide, so publish:pages
  # cannot resolve a target inside the agent's environment. Structure, not a rule the agent could reread.

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: engine

    steps:
      # Engine first, so the guard and the parity check are scripts rather than inline YAML.
      - name: Check out the engine (read-only deploy key)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
          path: engine

      # Fails before one token of model time if this branch is missing anything used below.
      - name: Preflight – branch-parity contract
        run: bash scripts/ci-preflight.sh

      # done / republish / full, from two independent probes. done ends green in seconds.
      - name: Guard – is today already out?
        id: guard
        env:
          INPUT_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        # A dry run publishes nothing, so "today is already out" is not a reason to stop
        # it: the point is to see what the desk would produce. It still uses TODAY's date,
        # because the alternative is worse. Dating a trial in the future was tried on
        # 2026-09-03 and the agent correctly refused the whole run rather than label
        # September news as a December edition, which is exactly the integrity the brief
        # depends on and not something to work around.
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            D="${INPUT_DATE:-$(TZ=Europe/Copenhagen date +%F)}"
            printf 'dry run: not consulting the live site; nothing will publish\n'
            printf 'mode=full\ndate=%s\nwork=true\n' "$D" >> "$GITHUB_OUTPUT"
          else
            bash scripts/brief-mode.sh "$SITE_URL" "$INPUT_DATE"
          fi

      # Full history: the push rebases onto whatever the Mac routines pushed here.
      - name: Check out the website repo
        if: steps.guard.outputs.mode != 'done'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          path: pages

      - name: Node
        if: steps.guard.outputs.mode != 'done'
        uses: actions/setup-node@v7
        with:
          node-version-file: engine/.nvmrc
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Dependencies
        if: steps.guard.outputs.mode != 'done'
        run: npm ci

      # The publish token lives here and nowhere else. A dead backend costs feedback, not the morning.
      - name: Editorial context (advisory)
        if: steps.guard.outputs.mode == 'full'
        continue-on-error: true
        env:
          BRIEF_API_URL: ${{ secrets.BRIEF_API_URL }}
          BRIEF_PUBLISH_TOKEN: ${{ secrets.BRIEF_PUBLISH_TOKEN }}
        run: npm run context

      # Refuses a third full agent run on one date. Fails open: a cap that cannot count never blocks.
      - name: Attempt cap
        id: cap
        if: steps.guard.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-attempt-cap.sh "${{ steps.guard.outputs.date }}"

      # The header ci-compose-prompt.sh prepends is load-bearing: it relocates the Mac paths, forbids the
      # agent's own publish step (prompt step 9), and says these logs are public. See ENGINE-CONTRACT.md.
      - name: Install the agent, compose the prompt
        if: steps.cap.outputs.proceed == 'true'
        run: |
          npm i -g "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION"
          bash scripts/ci-compose-prompt.sh "${{ steps.guard.outputs.date }}" > "$RUNNER_TEMP/run-prompt.md"

      # No --bare: it ignores the OAuth token. A non-zero exit is a warning; the gate decides.
      - name: Run the editorial agent
        if: steps.cap.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 100
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat "$RUNNER_TEMP/run-prompt.md")" \
            --output-format text --no-session-persistence --permission-mode acceptEdits \
            --allowedTools Read Write Edit Glob Grep WebSearch WebFetch TodoWrite "Bash(npm run *)" "Bash(node *)" "Bash(wc *)" "Bash(date *)" \
            --disallowedTools "Bash(npm run publish*)" "Bash(git *)" "Bash(gh *)" "Bash(curl *)" "Bash(ssh *)" Task

      - name: Length report (advisory)
        if: steps.cap.outputs.proceed == 'true'
        continue-on-error: true
        run: npm run count:length -- "data/${{ steps.guard.outputs.date }}/draft.json"

      # Nothing below trusts the agent. A missing floor/reach/echo key is a red run – the old gate could
      # not tell "clean" from "never ran"; turning one off is a dated edit here, never a silent absence.
      # A dead image URL renders as an empty grey box. Prune before the gate so the
      # gate and the renderer both see known-good images. Never fails the run.
      - name: Resolve story images from their own articles
        if: steps.guard.outputs.mode == 'full'
        continue-on-error: true
        env:
          # DATE is not a job-wide variable in this workflow; every other step reads the
          # date from the guard's output. Using ${DATE} here resolved to "data//draft.json"
          # and the resolver no-opped silently on 2026-08-23, so no image work happened at
          # all on the brief it was written for.
          DATE: ${{ steps.guard.outputs.date }}
        run: npm run --silent prune:images -- "data/${DATE}/draft.json" --ledger=data/image-ledger.json

      # A trial run produces the edition and stops. The draft is the whole point of
      # the run, so it is uploaded rather than thrown away with the runner.
      - name: Keep the trial draft for review
        if: ${{ inputs.dry_run && steps.cap.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: trial-draft
          path: engine/data/${{ steps.guard.outputs.date }}/draft.json
          if-no-files-found: warn

      - name: Quality gate (blocking)
        if: steps.cap.outputs.proceed == 'true'
        timeout-minutes: 15
        env:
          REQUIRE_FLOOR: "true"
          REQUIRE_SOURCE_REACH: "true"
          REQUIRE_SOURCE_ECHO: "true"
        run: bash scripts/ci-gate.sh "${{ steps.guard.outputs.date }}"

      # The push credential enters here, after the agent has finished and been judged.
      - name: Publish
        id: publish
        if: ${{ !inputs.dry_run && (steps.guard.outputs.mode != 'done') }}
        env:
          BRIEF_FEEDBACK_URL: ${{ secrets.BRIEF_API_URL }}
          GH_PUSH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
        run: bash scripts/ci-publish.sh "${{ steps.guard.outputs.date }}"

      - name: Ask GitHub Pages to build
        if: ${{ !inputs.dry_run && (steps.guard.outputs.mode != 'done') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

      # The only judge of this run's colour, and it runs even when something above failed, because the
      # question it answers is whether the reader has today's brief.
      - name: Prove the reader is served
        id: served
        if: ${{ !inputs.dry_run && (always() && steps.guard.conclusion == 'success' && steps.guard.outputs.mode != 'done') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
          PUSHED_SHA: ${{ steps.publish.outputs.sha }}
        run: bash scripts/brief-liveness.sh "${{ steps.guard.outputs.date }}"

      # Cross-day memory, to the public pages repo: the engine key is read-only, and engine write access
      # would mean write access to tomorrow's prompt. Keyed on the push, not on the proof – the push makes
      # the edition real, and these appends exist only in this runner, so a CDN lag must not discard them.
      - name: Record the cross-day ledger
        if: ${{ !inputs.dry_run && (always() && steps.guard.outputs.mode == 'full' && steps.publish.outcome == 'success') }}
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
        run: bash scripts/ci-record-ledger.sh "${{ steps.guard.outputs.date }}"

      # From the workspace, not engine/, so a failed engine checkout still gets a summary.
      - name: Summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          MODE: ${{ steps.guard.outputs.mode }}
          DATE: ${{ steps.guard.outputs.date }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          SERVED: ${{ steps.served.outcome }}
        run: |
          printf '### %s – %s\n\n- mode `%s` · engine `%s` · deadline %s CPH\n- pushed `%s` · served `%s`\n' \
            "$BRIEF_LABEL" "${DATE:-unresolved}" "${MODE:-none}" "$ENGINE_REF" "$DEADLINE_CPH" \
            "${PUBLISHED_SHA:-none}" "${SERVED:-skipped}" >> "$GITHUB_STEP_SUMMARY"
