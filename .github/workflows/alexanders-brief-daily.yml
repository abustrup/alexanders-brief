# Alexanders Brief – unattended cloud publish. Order, conditions and parameters only; every decision is
# an engine script (ENGINE-CONTRACT.md) that must exist on BOTH engine branches – the rule whose absence
# meant Thomas' brief could never publish. Install: land the contract on both branches, dispatch a
# daylight run that reaches the push, then let the crons stand.
#
# PICTURES ARE A STAGE, NOT A PHASE [2026-10-25]. Until then a picture was only a request inside the
# editorial agent's last phase, and the agent skipped it on 10-07, 10-18 and 10-23 (0 of 7 and 0 of 9
# stories with a picture, both runs with 4-6 Read calls) while nothing in this file filled, demanded or
# checked one: the old "Resolve story images" step only took pictures away. The step "Picture desk
# (guaranteed stage)" now runs after the agent on every run, whatever the agent did, with its own short
# agent, and checks its own result from files. It never fails the run and never blocks the publish.
# Its name must NEVER contain "editorial agent": ci-attempt-cap.sh counts a run as having spent an
# agent run by finding a started step with that name, and the desk is not the second agent run.
#
# REPICTURE [2026-10-25]. Dispatch-only input repicture_today: today's PUBLISHED edition is taken as the
# draft (no editorial run, no research), its hosted pictures are put back to the publishers' addresses,
# the picture desk runs on it, and the result replaces the live edition under a new runId. A few
# dollars instead of a whole morning, and the repair tool for a day whose pictures came out thin.

name: Alexanders Brief – daily

on:
  schedule:
    # Budget/attempt = 77 min delay tail + 145 min run = 222. 06:40 - 222 = 02:58 falls in the hour that
    # repeats each October, so the last usable start is 01:49 (+222 = 05:31). No :00/:30, none in 02:xx.
    # Three crons insure against a dropped trigger, not a slow run: a later cron queues behind it.
    - cron: "11 6 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "47 6 * * *"
      timezone: "Europe/Copenhagen"
    - cron: "13 7 * * *"
      timezone: "Europe/Copenhagen"
    # AFTER THE USAGE WINDOW RESETS [2026-10-03]. A Pro window opened by the 05:45 run resets about 10:40, so a
    # morning killed by the limit can only succeed after that. The guard ends this run in seconds when
    # today is already out, so on a good day it costs nothing.
    - cron: "57 10 * * *"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date YYYY-MM-DD. Blank = today in Europe/Copenhagen."
        required: false
        type: string
      engine_ref:
        description: "Engine branch to run. Blank = the live branch. Use to trial a change."
        required: false
        type: string
      dry_run:
        description: "Produce the draft and stop. Publishes nothing; uploads it for review."
        required: false
        type: boolean
        default: false
      replace_today:
        description: "Replace TODAY's already-published edition with a fresh one. Hand-started only."
        required: false
        type: boolean
        default: false
      repicture_today:
        description: "Redo only the PICTURES of TODAY's published edition: no editorial run, the published stories stay word for word, the picture desk runs on them and the result replaces the live edition. A few dollars. Hand-started only. With dry_run it uploads the draft and the previews and publishes nothing."
        required: false
        type: boolean
        default: false

# Declared here: default_workflow_permissions is read on all three repos. No issues:write – this file
# never opens one, and the watchdog living in this repo declares its own.
permissions:
  contents: write
  pages: write

concurrency:
  group: alexanders-brief-daily
  cancel-in-progress: false

env:
  TZ: Europe/Copenhagen
  ENGINE_REPO: abustrup/alexanders-brief-source
  ENGINE_REF: ${{ inputs.engine_ref || 'feature/news-brief-mvp' }}
  SITE_URL: https://abustrup.github.io/alexanders-brief
  PROMPT_PATH: docs/routines/backup-from-claude-dir/daily-news-brief.SKILL.md
  BRIEF_LABEL: alexanders-brief
  DEADLINE_CPH: "06:40"
  # Pinned: an overnight release must not break an unattended run. REVIEW 2026-11-01.
  CLAUDE_CLI_VERSION: "2.1.228"
  # count:length is advisory (step 10), so preflight warns rather than fails when absent.
  PREFLIGHT_ADVISORY_SCRIPTS: "count:length"
  # PAGES_REPO_DIR is set only on the publish/liveness/ledger steps, never job-wide, so publish:pages
  # cannot resolve a target inside the agent's environment. Structure, not a rule the agent could reread.

jobs:
  brief:
    runs-on: ubuntu-latest
    # 220, was 180 until 2026-10-25 (round 2), and 150 before that. The capped steps are the agent (100), the
    # picture desk (stage cap 60 minutes, step cap 64) and the gate (15), plus liveness (about 15 of polling) =
    # 194, leaving 26 for checkout, npm ci, publish and the ledger. Liveness is the LAST step: a job that dies
    # during it kills a run that has already published, so the sum of the step caps, not the usual 55-minute
    # morning, is what this has to cover. Round 2 raised the desk from 30 to 60 minutes: its turn budget went
    # from 70 to 160 after a real dry run was stopped at 70, and two 25-minute passes plus the lead-only pass
    # have to fit; a normal run uses about 7 minutes per pass (71 turns took 401 s).
    timeout-minutes: 220
    defaults:
      run:
        shell: bash
        working-directory: engine

    steps:
      # Engine first, so the guard and the parity check are scripts rather than inline YAML.
      - name: Check out the engine (read-only deploy key)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false
          path: engine

      # Fails before one token of model time if this branch is missing anything used below.
      - name: Preflight – branch-parity contract
        run: bash scripts/ci-preflight.sh

      # done / republish / full, from two independent probes. done ends green in seconds.
      - name: Guard – is today already out?
        id: guard
        env:
          INPUT_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPLACE: ${{ inputs.replace_today }}
          REPICTURE: ${{ inputs.repicture_today }}
        # A dry run publishes nothing, so "today is already out" is not a reason to stop
        # it: the point is to see what the desk would produce. It still uses TODAY's date,
        # because the alternative is worse. Dating a trial in the future was tried on
        # 2026-09-03 and the agent correctly refused the whole run rather than label
        # September news as a December edition, which is exactly the integrity the brief
        # depends on and not something to work around.
        run: |
          if [ "$REPLACE" = "true" ] && [ "$REPICTURE" = "true" ]; then
            # Two different jobs: replace_today writes a whole new edition with the editorial agent,
            # repicture_today keeps the published stories and redoes only their pictures. Ticking both
            # would run the agent over a draft the repicture step then overwrites.
            printf '::error::choose replace_today (a whole new edition) or repicture_today (the same stories, new pictures), not both\n'; exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            D="${INPUT_DATE:-$(TZ=Europe/Copenhagen date +%F)}"
            printf 'dry run: not consulting the live site; nothing will publish\n'
            if [ "$REPICTURE" = "true" ]; then
              printf 'repicture dry run: the published stories of %s get a picture pass; the draft and the previews are uploaded\n' "$D"
            fi
            printf 'mode=full\ndate=%s\nwork=true\n' "$D" >> "$GITHUB_OUTPUT"
          elif [ "$REPICTURE" = "true" ]; then
            # Added 2026-10-25. Same rule as replace_today: TODAY only, because the result replaces the
            # live edition and a past date would rewrite the archive. Schedules carry no inputs, so this
            # can only be started by hand.
            D="$(TZ=Europe/Copenhagen date +%F)"
            if [ -n "$INPUT_DATE" ] && [ "$INPUT_DATE" != "$D" ]; then
              printf '::error::repicture_today redoes the pictures of today (%s) only, not %s\n' "$D" "$INPUT_DATE"; exit 1
            fi
            printf 'repicture: the pictures of the published %s edition will be redone and the result will replace it, if it passes the gate\n' "$D"
            printf 'mode=full\ndate=%s\nwork=true\n' "$D" >> "$GITHUB_OUTPUT"
          elif [ "$REPLACE" = "true" ]; then
            # Added 2026-09-14, when Alexander asked for a new edition of a day already published so
            # the site carried that day's shipped changes. TODAY only: replacing a past date would
            # rewrite the archive. Schedules carry no inputs, so this can only be started by hand.
            D="$(TZ=Europe/Copenhagen date +%F)"
            if [ -n "$INPUT_DATE" ] && [ "$INPUT_DATE" != "$D" ]; then
              printf '::error::replace_today replaces today (%s) only, not %s\n' "$D" "$INPUT_DATE"; exit 1
            fi
            printf 'replace: a new edition for %s will replace the published one, if it passes the gate\n' "$D"
            printf 'mode=full\ndate=%s\nwork=true\n' "$D" >> "$GITHUB_OUTPUT"
          else
            bash scripts/brief-mode.sh "$SITE_URL" "$INPUT_DATE"
          fi

      # Full history: the push rebases onto whatever the Mac routines pushed here.
      - name: Check out the website repo
        if: steps.guard.outputs.mode != 'done'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          path: pages

      - name: Node
        if: steps.guard.outputs.mode != 'done'
        uses: actions/setup-node@v7
        with:
          node-version-file: engine/.nvmrc
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Dependencies
        if: steps.guard.outputs.mode != 'done'
        run: npm ci

      # The publish token lives here and nowhere else. A dead backend costs feedback, not the morning.
      # Not on a repicture: nothing is written, so there is no recommendation to compare with history, and the
      # edition's own picks would only show up as repeats of themselves in the gate's advisory list.
      - name: Editorial context (advisory)
        if: ${{ steps.guard.outputs.mode == 'full' && !inputs.repicture_today }}
        continue-on-error: true
        env:
          BRIEF_API_URL: ${{ secrets.BRIEF_API_URL }}
          BRIEF_PUBLISH_TOKEN: ${{ secrets.BRIEF_PUBLISH_TOKEN }}
        run: npm run context

      # Refuses a third full agent run on one date. Fails open: a cap that cannot count never blocks.
      - name: Attempt cap
        id: cap
        if: steps.guard.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          # The cap exists to stop a broken morning burning three agent runs of the
          # weekly allowance. A dry run is a deliberate, hand-dispatched test, so it
          # is allowed past it; the allowance it spends is spent knowingly. The cap
          # still applies in full to every scheduled run, which is where it matters.
          # A replace is also hand-started and knowingly spent, but not unlimited: two more agent runs
          # on top of the morning's, so one failed replace can be retried once.
          # A repicture runs no editorial agent at all (its "Run the editorial agent" step is skipped, so
          # the count never sees it), so the cap has nothing to protect there and must not be what stops
          # a repair of a day that already used its attempts.
          MAX_FULL_ATTEMPTS: ${{ inputs.dry_run && '99' || (inputs.repicture_today && '99' || (inputs.replace_today && '4' || '2')) }}
        run: bash scripts/ci-attempt-cap.sh "${{ steps.guard.outputs.date }}"

      # TOKEN DIET [2026-10-08]. Input is 99.6% of what a run costs (cost = turns x context size), so what
      # the agent used to fetch and carry through ~120 turns is now packed by plain code before it starts:
      # recent.md / recent-full.md (the last 30 days, for the repeat check) and taste.md (the reader's votes
      # as a few lines). The archive is read from the sibling pages checkout. Fails open, and fails TO THE OLD
      # BEHAVIOUR: if the script errors or is absent from this engine ref, the lines below delete whatever it
      # left half-written and write NOTHING. The prompt header only switches to the pack when recent.md
      # exists; with no file it keeps the three WebFetch dedup URLs, which are then the only repeat check
      # there is (context.json carries no history). A placeholder file here would switch the header over
      # and take that check away, with the run still green [fixed 2026-10-09]. The day's own edition is
      # left out on purpose: a replace run must not be steered away from the news it is replacing.
      - name: Pack the 30-day memory and the reader's taste
        if: ${{ steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        env:
          DATE: ${{ steps.guard.outputs.date }}
        run: |
          if ! npm run --silent ci:context-pack -- "$DATE" --archive="${{ github.workspace }}/pages/data"; then
            # Only the pack's own outputs; context.json stays. Globs, so a file the engine adds later
            # (columns.md) is covered without an edit here.
            rm -f "data/$DATE"/recent*.md "data/$DATE"/columns*.md "data/$DATE"/taste*.md
            printf '::warning::the context pack failed on engine %s; no pack files were left behind, so the prompt falls back to the three-edition WebFetch text.\n' "$ENGINE_REF"
          fi
          PACKED="$(find "data/$DATE" -maxdepth 1 \( -name 'recent*.md' -o -name 'columns*.md' -o -name 'taste*.md' \) 2>/dev/null | sort || true)"
          if [ -n "$PACKED" ]; then ls -l $PACKED; else echo "no pack files for $DATE"; fi

      # The header ci-compose-prompt.sh prepends is load-bearing: it relocates the Mac paths, forbids the
      # agent's own publish step (prompt step 9), and says these logs are public. See ENGINE-CONTRACT.md.
      - name: Install the agent, compose the prompt
        if: ${{ steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        env:
          REPLACE: ${{ inputs.replace_today }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm i -g "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION"
          bash scripts/ci-compose-prompt.sh "${{ steps.guard.outputs.date }}" > "$RUNNER_TEMP/run-prompt.md"
          # The header below says today is not published and the prompt says never to publish a date
          # twice, so without this a replace run stops without a draft.
          if [ "$REPLACE" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            { cat <<'NOTE'
          # THIS RUN REPLACES TODAY'S EDITION — read this before anything below

          Alexander asked on 2026-09-14 for a new edition of today's brief to replace the one already
          published, so the site carries the changes shipped that day. Today's edition therefore DOES
          already exist on the site and in the archive. That is expected and is not a reason to stop:
          treat "is today already published?" as answered, do not run brief-mode.sh or
          check-published.sh, and produce a full new edition for today. Research today's news afresh
          rather than copying the published edition. The workflow assigns this edition's runId after
          you finish, so any runId you write is replaced. Everything below still applies, including
          that you never publish yourself.

          NOTE
              cat "$RUNNER_TEMP/run-prompt.md"; } > "$RUNNER_TEMP/run-prompt.replace.md"
            mv "$RUNNER_TEMP/run-prompt.replace.md" "$RUNNER_TEMP/run-prompt.md"
          fi

      # No --bare: it ignores the OAuth token. A non-zero exit is a warning; the gate decides.
      - name: Run the editorial agent
        if: ${{ steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        timeout-minutes: 100
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # EFFORT LOWERED TO medium, 2026-09-30, at Alexander's request to spend fewer tokens. The model
          # here is claude-sonnet-5, whose default is high [docs: code.claude.com/docs/en/model-config],
          # so this is a real reduction. What it does and does not buy: measured on 11 update runs, about
          # two thirds of a run's cost is re-reading the conversation on each of ~120 steps, and only
          # ~14% is output, so expect a modest saving, not a halving. Judge it by updateRuns[].cost.
          # REVERT: delete the --effort line. To go further, low; to restore, high.
          #
          # STREAM, NOT TEXT [2026-10-08]. The whole transcript goes to a file and the log stays short: it is
          # what `npm run ci:profile` reads to say where the tokens went, and the step below pulls the final
          # result object out of it so the cost, limit and desk-report steps read a file shaped exactly as
          # the update's. stderr (the CLI's own diagnostics, login and limit messages) still reaches the log.
          status=0
          # LEAN LOAD, 2026-10-09. Every turn re-reads the whole conversation, so what is loaded before the
          # first turn is paid for ~120 times. Measured in this runner (CLI 2.1.228, one trivial call):
          # base context 32,092 tokens with the default tool list and system prompt, 19,054 with --tools
          # restricted to what the run uses, 11,024 with config/agent-system-prompt.md instead of Claude
          # Code's default prompt. The tool smoke test passed under exactly these flags (all tools called
          # and landed). An engine ref without the file keeps the default prompt. REVERT: delete LEAN.
          LEAN=(--tools "Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch" --disable-slash-commands)
          if [ -s config/agent-system-prompt.md ]; then LEAN+=(--system-prompt "$(cat config/agent-system-prompt.md)"); fi
          claude -p "$(cat "$RUNNER_TEMP/run-prompt.md")" "${LEAN[@]}" \
            --output-format stream-json --verbose --no-session-persistence --permission-mode acceptEdits --effort medium \
            --allowedTools Read Write Edit Glob Grep WebSearch WebFetch "Bash(npm run *)" "Bash(node *)" "Bash(wc *)" "Bash(date *)" \
            --disallowedTools "Bash(npm run publish*)" "Bash(git *)" "Bash(gh *)" "Bash(curl *)" "Bash(ssh *)" Task \
            > "$RUNNER_TEMP/agent.stream" 2> "$RUNNER_TEMP/agent.err" || status=$?
          cat "$RUNNER_TEMP/agent.err" >&2
          exit "$status"

      # The last `result` event of the stream, as the one JSON object the cost and desk-report scripts read.
      # No result event (the CLI died mid-run) falls back to the last JSON line, so the limit check below
      # still sees whatever the CLI said last. Named so the attempt cap does not mistake it for the agent.
      - name: Keep the final result of the run
        if: ${{ always() && steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        run: |
          node -e '
            const fs = require("fs");
            let result = "", lastJson = "";
            for (const line of fs.readFileSync(process.argv[1], "utf8").split("\n")) {
              if (!line.startsWith("{")) continue;
              try { const event = JSON.parse(line); lastJson = line; if (event && event.type === "result") result = line; } catch {}
            }
            const keep = result || lastJson;
            if (keep) fs.writeFileSync(process.argv[2], keep + "\n");
            console.log(result ? "final result kept" : keep ? "no result event; kept the last JSON line" : "the stream held no JSON at all");
          ' "$RUNNER_TEMP/agent.stream" "$RUNNER_TEMP/agent.json"

      # WHY THESE TWO STEPS EXIST [2026-10-03]. The 29 Sep - 2 Oct mornings went unpublished because a Pro
      # usage window runs out inside the run ("You've hit your session limit"), the agent exits with no
      # edition, and ci-attempt-cap.sh then counted that run as spent: two of them used up both attempts by
      # 06:10, and the runs GitHub fired after the 10:40 reset were refused. A run the account refused to
      # serve spent nothing worth counting. The first step looks; the second exists only so that the cap
      # (scripts/ci-attempt-cap.sh) can see, in the run's step list, that this one should not be counted.
      # Since 2026-10-08 it looks at the final result and at stderr, the two places the text output of the
      # old step carried those messages, and not at the whole transcript, where a fetched page could say it.
      - name: Did a usage limit or login refusal stop the agent?
        id: limit
        if: ${{ steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        run: |
          WORDS='hit your [a-z0-9 -]{0,20}limit|organization has disabled|failed to authenticate|credit balance is too low'
          SHOW='hit your [a-z0-9 -]{0,20}limit|organization has disabled[^"]{0,60}|failed to authenticate[^"]{0,60}|credit balance is too low'
          if grep -qiE "$WORDS" "$RUNNER_TEMP/agent.json" "$RUNNER_TEMP/agent.err" 2>/dev/null \
             && [ ! -f "data/${{ steps.guard.outputs.date }}/draft.json" ]; then
            echo "limit=true" >> "$GITHUB_OUTPUT"
            FOUND="$(grep -ihoE "$SHOW" "$RUNNER_TEMP/agent.json" "$RUNNER_TEMP/agent.err" 2>/dev/null | head -1)" || true
            printf '::warning::The agent was stopped before it could produce an edition: %s\n' "$FOUND"
          else
            echo "limit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Agent stopped before it could work (usage limit or login)
        if: steps.limit.outputs.limit == 'true'
        run: echo "This run spent no model time worth counting. The retry cap will not count it, so a run after the limit resets can still publish today."

      # The daily now reports itself the way the update does [2026-10-08]. Never blocking: an accounting
      # line must not cost an edition, so each of these three can fail without anyone noticing but the
      # summary. The profile reads the whole transcript (where the tokens went, which results were bulky,
      # which files were read twice); the desk report is the agent's own account of what it did.
      - name: What this run cost
        if: ${{ always() && steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        run: |
          node scripts/ci-agent-cost.mjs "$RUNNER_TEMP/agent.json" \
            --label="daily ${{ steps.guard.outputs.date }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # WHAT THIS PRINTS IS PUBLIC [2026-10-09]: the log and the step summary of this repo are both readable
      # by anyone. ci:profile prints counts (turns, tokens, calls per tool) and, for the 8 bulkiest tool
      # results and the files read twice, the tool name, the target (a file path, a URL, a search query, the
      # start of a command) and the size in characters. It never prints a tool result, a file's content or
      # the agent's text. So it does reveal which files and pages the desk opened, what it searched for and
      # the first words of its commands, and nothing it read inside them. The filter after it is a second
      # lock that does not depend on the engine ref being the current one: every table cell is cut to 90
      # characters (the script cuts a target to 70) and every line to 1,000.
      - name: Where the tokens went (profile)
        if: ${{ always() && steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        run: |
          FILTER='
            const MAX_CELL = 90, MAX_LINE = 1000;
            const clip = (t, n) => { const c = Array.from(t); return c.length > n ? c.slice(0, n - 1).join("") + "…" : t; };
            const rows = require("fs").readFileSync(0, "utf8").split("\n").map((line) => {
              if (line.startsWith("|")) line = line.split(/(?<!\\)\|/).map((cell) => clip(cell, MAX_CELL)).join("|");
              return clip(line, MAX_LINE);
            });
            process.stdout.write(rows.join("\n"));
          '
          npm run --silent ci:profile -- "$RUNNER_TEMP/agent.stream" | node -e "$FILTER" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: What the desk said it did
        if: ${{ always() && steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        run: node scripts/ci-desk-report.mjs "$RUNNER_TEMP/agent.json" >> "$GITHUB_STEP_SUMMARY"

      # NO TRANSCRIPT UPLOAD, ON PURPOSE [2026-10-09]. On 2026-10-08 a step here kept the whole stream as a
      # 7-day artifact after cutting out tokens. This repo is public and the artifacts of a public repo can
      # be downloaded by any signed-in GitHub user, while the stream holds the full text of every file the
      # agent Read, the private editorial profile among them. Cutting token-shaped strings does nothing for
      # that. The measurement lives on in the profile step above (counts, tool, target, size; no content).
      # Do not add an upload of agent.stream, agent.err or agent.json back; the only files this job uploads
      # are the dry-run draft and its pictures.

      - name: Length report (advisory)
        if: ${{ steps.cap.outputs.proceed == 'true' && !inputs.repicture_today }}
        continue-on-error: true
        run: npm run count:length -- "data/${{ steps.guard.outputs.date }}/draft.json"

      # REPICTURE: today's published edition IS the draft [2026-10-25]. Nothing here writes a word: the
      # stories, sources, signals and recommendations stay exactly as published. Only the pictures are
      # worked on, and the resolver and the desk must work on the PUBLISHERS' addresses, because a picture
      # at our own address (img/<date>/NN-xxxxxxxx.jpg) says nothing about where it came from and cannot be
      # re-judged or swapped. So each hosted story picture goes back to image.originalUrl, which
      # host:images wrote when it hosted the file; the hosted address and its crop focus are kept in
      # repicture-hosted.json for the step after the desk. image.lookedAt stays: it is the editor's own
      # stamp from the morning, so a desk that is stopped by a limit leaves the published pictures as they
      # were instead of taking them away as unseen. The recommendations' pictures are not touched (neither
      # the resolver nor the desk works on them) and stay hosted.
      - name: Take today's published edition as the draft (repicture)
        id: repicture
        if: ${{ inputs.repicture_today && steps.cap.outputs.proceed == 'true' }}
        env:
          DATE: ${{ steps.guard.outputs.date }}
          ARCHIVE: ${{ github.workspace }}/pages/data/${{ steps.guard.outputs.date }}.json
        run: |
          [ -s "$ARCHIVE" ] || { printf '::error::the published edition %s is not in the website checkout, so there are no pictures to redo.\n' "$ARCHIVE"; exit 1; }
          mkdir -p "data/$DATE"
          cat > "$RUNNER_TEMP/repicture-restore.js" <<'JS'
          const fs = require("fs");
          const [archive, draft, sidecar, date, site] = process.argv.slice(2);
          const fail = (why) => { console.log("::error::" + why); process.exit(1); };
          const raw = fs.readFileSync(archive, "utf8");
          let edition;
          try { edition = JSON.parse(raw); } catch (e) { fail("the published edition is not readable as JSON, so there is nothing to redo the pictures of"); }
          if (!edition || edition.date !== date) fail("the published file says it is the edition of " + (edition && edition.date) + ", not " + date);
          if (!Array.isArray(edition.stories) || edition.stories.length === 0) fail("the published edition has no stories");
          const root = site.replace(/\/+$/, "") + "/img/";
          const restored = [];
          let noOrigin = 0, remote = 0, none = 0;
          edition.stories.forEach((story, index) => {
            const image = story && story.image;
            if (!image || typeof image.url !== "string" || !image.url) { none += 1; return; }
            if (!image.url.startsWith(root)) { remote += 1; return; }
            if (typeof image.originalUrl !== "string" || !/^https?:\/\//i.test(image.originalUrl)) { noOrigin += 1; return; }
            restored.push({ index, id: story.id, url: image.url, originalUrl: image.originalUrl, focus: image.focus });
            image.url = image.originalUrl;
            delete image.originalUrl;
            delete image.focus;
          });
          const indent = /^\{\r?\n(\s+)/.exec(raw);
          fs.writeFileSync(draft + ".tmp", JSON.stringify(edition, null, indent ? indent[1].length : 2) + "\n");
          fs.renameSync(draft + ".tmp", draft);
          fs.writeFileSync(sidecar, JSON.stringify({ date, runId: edition.runId, restored }, null, 2) + "\n");
          console.log("repicture: " + edition.stories.length + " stories, runId " + edition.runId + "; "
            + restored.length + " hosted pictures put back to the publisher's address, "
            + noOrigin + " hosted without a recorded original (left as they are), "
            + remote + " already at a publisher's address, " + none + " without a picture");
          JS
          node "$RUNNER_TEMP/repicture-restore.js" "$ARCHIVE" "data/$DATE/draft.json" "data/$DATE/repicture-hosted.json" "$DATE" "$SITE_URL"

      # Nothing below trusts the agent. A missing floor/reach/echo key is a red run – the old gate could
      # not tell "clean" from "never ran"; turning one off is a dated edit here, never a silent absence.
      #
      # THE PICTURE DESK [2026-10-25]. This step replaces "Resolve story images from their own articles",
      # which only ever took pictures away (prune:images --final), so a morning on which the agent skipped
      # its picture phase shipped without them: 0 of 7 on 10-18, 0 of 9 on 10-23, 4 of 12 on 10-20. It runs
      # npm run ci:picture-stage: the resolver fills what it can, ONE picture-desk agent (a short prompt,
      # fresh context, prompts/picture-desk.md) looks at every candidate and searches for the stories
      # without one, the final pass takes away what nobody looked at, and the stage checks the result from
      # files and not from the model's say-so, with one more pass on the missing stories if it falls short.
      # The final pass lives inside the stage now. This step then makes sure of three things around it:
      #   - a stage that is killed (the time cap below), ends non-zero, leaves no record of a finished run or
      #     is absent from this engine ref must not leave a picture nobody looked at, so the old final pass
      #     runs alone afterwards. A look file from an earlier pass of a killed stage is not proof: the pass
      #     that was cut off may have added pictures after it;
      #   - a desk killed mid-edit must not leave a broken draft, which the gate would refuse and cost the
      #     whole morning: an unreadable draft is put back as the stage's newest readable snapshot of it
      #     (it keeps one before each pass), or as it was before the desk;
      #   - the step is named so that ci-attempt-cap.sh does not count it as an agent run, and it never
      #     fails the run and never blocks the publish.
      # The engine ref may be an older branch that has no ci:picture-stage (engine_ref is an input): it then
      # runs the old final pass, exactly as this step did before, so this file can land before the engine.
      # Time caps: 480 s per resolver run, 1,500 s per desk pass inside the stage (two passes at most, and a
      # third, lead only, capped at 600 s by the stage itself), and 3,600 s for the whole stage from outside.
      # The runner's own step limit (64 minutes) is the second lock. [Round 2, 2026-10-25: 1,080 and 1,800 before.
      # A real dry run was stopped at its 70-turn limit after 401 s, so the desk's turn budget is 160 now (the
      # stage's default) and its per-pass time was raised in step; the time cap is the lock, not the budget.]
      # A dead image URL renders as an empty grey box. The final pass runs before the gate so the
      # gate and the renderer both see known-good images.
      - name: Picture desk (guaranteed stage)
        id: pictures
        if: ${{ steps.cap.outputs.proceed == 'true' }}
        continue-on-error: true
        timeout-minutes: 64
        env:
          # DATE is not a job-wide variable in this workflow; every other step reads the
          # date from the guard's output. Using ${DATE} here resolved to "data//draft.json"
          # and the resolver no-opped silently on 2026-08-23, so no image work happened at
          # all on the brief it was written for.
          DATE: ${{ steps.guard.outputs.date }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PICTURE_MECHANICAL_TIMEOUT_S: "480"
          PICTURE_DESK_TIMEOUT_S: "1500"
          STAGE_TIMEOUT_S: "3600"
          REPICTURE: ${{ inputs.repicture_today }}
        run: |
          F="data/${DATE}/draft.json"
          LOOK="data/${DATE}/picture-look.json"
          if [ ! -f "$F" ]; then
            printf '::warning::picture desk: %s does not exist (the editorial agent wrote no draft), so there are no pictures to make.\n' "$F"
            exit 0
          fi
          # The compose step installs the CLI; a repicture run skips that step, and so does a run whose
          # install failed. The stage copes with a missing program, but a desk that never starts is the
          # failure this step exists to remove.
          if ! command -v claude >/dev/null 2>&1; then
            npm i -g "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION" >/dev/null 2>&1 \
              || printf '::warning::picture desk: the claude program could not be installed, so the desk cannot run.\n'
          fi
          cp "$F" "$RUNNER_TEMP/draft.before-picture-desk.json"
          STAGE_RECORD="data/${DATE}/picture-stage.json"
          stage_rc=0
          # STRICT [2026-10-25]. The stage runs its final pass strict (a picture without a matching lookedAt stamp
          # goes, whatever its origin) once a desk pass has completed. A repicture asks for it always: the published
          # stories are the point of it, and an edition redone with a dead desk must keep only the pictures that were
          # looked at (the published ones carry their stamps), never add the resolver's unlooked ones to a story the
          # published edition deliberately left bare.
          STAGE_STRICT=""
          if [ "${REPICTURE:-}" = "true" ]; then STAGE_STRICT="--strict"; fi
          HAS_STAGE=0
          if node -e 'const p=require("./package.json");process.exit(p.scripts&&p.scripts["ci:picture-stage"]?0:1)'; then
            HAS_STAGE=1
            timeout --kill-after=60 "$STAGE_TIMEOUT_S" \
              npm run --silent ci:picture-stage -- "$F" --date="$DATE" $STAGE_STRICT \
                --archive="${{ github.workspace }}/pages/data" --ledger=data/image-ledger.json \
                --preview-dir="data/${DATE}/image-previews" || stage_rc=$?
            if [ "$stage_rc" != "0" ]; then
              printf '::warning::picture desk: the stage ended with exit code %s (124 means it ran out of its %s seconds); what it left is checked below.\n' "$stage_rc" "$STAGE_TIMEOUT_S"
            fi
          else
            stage_rc=127
            printf '::warning::picture desk: engine ref %s has no ci:picture-stage, so only the old final pass runs on this edition.\n' "$ENGINE_REF"
          fi
          readable() { node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit(Array.isArray(d.stories)&&d.stories.length?0:1)' "$1" 2>/dev/null; }
          if ! readable "$F"; then
            # The newest readable copy: the stage keeps one before each desk pass, then the one from before the desk.
            for snap in $(ls -1r "data/${DATE}/picture-stage"/before-*.json 2>/dev/null) "$RUNNER_TEMP/draft.before-picture-desk.json"; do
              if readable "$snap"; then
                printf '::warning::picture desk: %s is not a readable edition after the stage, so %s was put back.\n' "$F" "$(basename "$snap")"
                cp "$snap" "$F"
                break
              fi
            done
            stage_rc=125
          fi
          # Did the stage run to its end? Its record says so, and a killed stage leaves none that says ran=true.
          if ! node -e 'try{process.exit(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).ran===true?0:1)}catch(e){process.exit(1)}' "$STAGE_RECORD" 2>/dev/null; then
            stage_rc=126
          fi
          # The quality gate refuses the WHOLE edition if any story picture lacks its alt text or its source page
          # (image-metadata-incomplete) and, since the desk may replace a recommendation image by hand, if any
          # recommendation image lacks them or the featured pick has none (recommendation-image-incomplete,
          # recommendation-featured-image-missing). The stage is promised never to block a publish, so a picture
          # the desk set without them is taken out here: a story picture goes (the story runs as text), a
          # recommendation image goes back to the one from before the desk. One forgotten field costs a picture and
          # not the morning. [2026-10-25: recommendations added; the rule lives in the engine, where it is tested:
          # scripts/ci-picture-report.mjs net, test/scripts/ciPictureReport.test.ts.] An engine ref from before
          # that has no desk, so no desk-made recommendation image either: it keeps the old stories-only block.
          cat > "$RUNNER_TEMP/picture-net.js" <<'JS'
          const fs = require("fs");
          const file = process.argv[2];
          const raw = fs.readFileSync(file, "utf8");
          const brief = JSON.parse(raw);
          const out = [];
          (brief.stories || []).forEach((story, index) => {
            const image = story && story.image;
            if (image && (!image.alt || !image.sourceUrl)) { delete story.image; out.push(index + 1); }
          });
          if (out.length) {
            const indent = /^\{\r?\n(\s+)/.exec(raw);
            fs.writeFileSync(file + ".tmp", JSON.stringify(brief, null, indent ? indent[1].length : 2) + "\n");
            fs.renameSync(file + ".tmp", file);
            console.log("::warning::picture desk: the picture of story " + out.join(", ") + " has no alt text or no source page, which the quality gate refuses for the whole edition, so it was taken out and the story runs as text");
          }
          JS
          if [ -f scripts/ci-picture-report.mjs ] && grep -q 'case "net"' scripts/ci-picture-report.mjs; then
            node scripts/ci-picture-report.mjs net "$F" --before="$RUNNER_TEMP/draft.before-picture-desk.json"
          else
            node "$RUNNER_TEMP/picture-net.js" "$F"
          fi
          if [ "$stage_rc" != "0" ] || [ ! -f "$LOOK" ]; then
            # Strict when the stage left a record that a desk pass COMPLETED before it was cut off (or on a
            # repicture); lenient otherwise, which keeps a story's own article picture even though nobody looked
            # at it, as it always did, and says so. Never strict on an engine ref without the stage: its
            # resolver would refuse the unknown flag and the final pass would not run at all (HAS_STAGE, because
            # stage_rc is overwritten with 126 above when the stage record is absent).
            FALLBACK_STRICT=""
            if [ "$HAS_STAGE" = "1" ] && { [ "${REPICTURE:-}" = "true" ] || [ "$(node scripts/ci-picture-report.mjs completed --scr="data/${DATE}/picture-stage" 2>/dev/null)" = "true" ]; }; then
              FALLBACK_STRICT="--strict"
              printf '::warning::picture desk: the stage did not finish cleanly (code %s), but a desk pass had completed, so the final pass runs alone and strict: it takes away every picture without a matching look stamp, whatever its origin.\n' "$stage_rc"
            else
              printf '::warning::picture desk: the stage did not finish cleanly (code %s) and no desk pass is known to have completed, so the final pass runs alone and lenient: it takes away every picture nobody looked at EXCEPT a story'"'"'s own article picture, which stays unlooked.\n' "$stage_rc"
            fi
            rm -f "$LOOK"
            npm run --silent prune:images -- "$F" --ledger=data/image-ledger.json --final $FALLBACK_STRICT --archive="${{ github.workspace }}/pages/data" --preview-dir="data/${DATE}/image-previews" --verbose
          fi

      # REPICTURE, after the desk: a picture the desk left alone keeps its hosted copy [2026-10-25]. The
      # restore step above gave every hosted story picture back its publisher's address so the desk could
      # judge it. host:images, at publish, would download each kept one again, and a download that fails
      # keeps the hotlink AND deletes the hosted file nothing references any more: the permanent copy the
      # reader was promised would be gone because a publisher had a bad minute. So a picture whose address
      # is still the one that was put back, and whose hosted file is still in the website checkout, gets its
      # hosted address and crop focus back. A picture the desk changed or took out is left as the desk
      # left it, and publish hosts the new one.
      - name: Keep the hosted copy of every picture the desk left alone (repicture)
        if: ${{ inputs.repicture_today && steps.cap.outputs.proceed == 'true' && steps.repicture.outcome == 'success' }}
        # Soft on purpose: the file is written only at the very end, so a failure here leaves the publishers'
        # addresses in the draft, which publish hosts again, and costs nothing but the downloads.
        continue-on-error: true
        env:
          DATE: ${{ steps.guard.outputs.date }}
          IMG_DIR: ${{ github.workspace }}/pages/docs/img/${{ steps.guard.outputs.date }}
        run: |
          cat > "$RUNNER_TEMP/repicture-keep.js" <<'JS'
          const fs = require("fs");
          const path = require("path");
          const [draftPath, sidecarPath, imgDir] = process.argv.slice(2);
          const draft = JSON.parse(fs.readFileSync(draftPath, "utf8"));
          const { restored } = JSON.parse(fs.readFileSync(sidecarPath, "utf8"));
          let kept = 0, changed = 0, missing = 0;
          for (const entry of restored) {
            const story = (draft.stories || []).find((candidate) => candidate && candidate.id === entry.id);
            const image = story && story.image;
            if (!image || image.url !== entry.originalUrl) { changed += 1; continue; }
            const file = path.join(imgDir, path.basename(new URL(entry.url).pathname));
            if (!fs.existsSync(file)) { missing += 1; console.log("::warning::the hosted file " + path.basename(file) + " is not in the website checkout, so that picture is hosted again at publish"); continue; }
            image.url = entry.url;
            image.originalUrl = entry.originalUrl;
            if (entry.focus) image.focus = entry.focus;
            kept += 1;
          }
          const indent = /^\{\r?\n(\s+)/.exec(fs.readFileSync(draftPath, "utf8"));
          fs.writeFileSync(draftPath + ".tmp", JSON.stringify(draft, null, indent ? indent[1].length : 2) + "\n");
          fs.renameSync(draftPath + ".tmp", draftPath);
          console.log("repicture: " + restored.length + " pictures had been put back to a publisher's address; " + kept + " unchanged by the desk and back at their hosted copy, "
            + changed + " changed or taken out by the desk, " + missing + " whose hosted file was missing");
          JS
          node "$RUNNER_TEMP/repicture-keep.js" "data/$DATE/draft.json" "data/$DATE/repicture-hosted.json" "$IMG_DIR"

      # A trial run produces the edition and stops. The draft is the whole point of
      # the run, so it is uploaded rather than thrown away with the runner.
      - name: Keep the trial draft for review
        if: ${{ inputs.dry_run && steps.cap.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: trial-draft
          path: |
            engine/data/${{ steps.guard.outputs.date }}/draft.json
            engine/data/${{ steps.guard.outputs.date }}/image-previews/
            engine/data/${{ steps.guard.outputs.date }}/picture-look.json
            engine/data/${{ steps.guard.outputs.date }}/picture-stage.json
          if-no-files-found: warn

      # A replace must carry its own runId: the publish check and the liveness proof both look for the
      # archive's runId on the page, so a reused one would pass on the old page still being served.
      # A repicture is a replace of the same kind (the stories are the published ones, the pictures are
      # new), so it takes the same step; its runId reads -p<run number> where a replace's reads -r<number>,
      # so the archive's history says which of the two made an edition.
      - name: Assign the replacement runId
        id: rid
        if: ${{ (inputs.replace_today || inputs.repicture_today) && !inputs.dry_run && steps.cap.outputs.proceed == 'true' }}
        env:
          DATE: ${{ steps.guard.outputs.date }}
          LIVE: ${{ github.workspace }}/pages/data/${{ steps.guard.outputs.date }}.json
          KIND: ${{ inputs.repicture_today && 'p' || 'r' }}
        run: |
          F="data/${DATE}/draft.json"
          [ -f "$F" ] || { printf '::error::no draft was written, so there is nothing to replace today with\n'; exit 1; }
          NEW="run-${DATE}-${KIND}${GITHUB_RUN_NUMBER}"
          OLD="$(node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).runId||""))}catch(e){}' "$LIVE")"
          [ "$NEW" != "$OLD" ] || { printf '::error::the replacement runId %s equals the published one\n' "$NEW"; exit 1; }
          node -e 'const fs=require("fs");const [f,id]=process.argv.slice(1);const d=JSON.parse(fs.readFileSync(f,"utf8"));d.runId=id;fs.writeFileSync(f,JSON.stringify(d,null,2)+"\n")' "$F" "$NEW"
          printf 'runId %s -> %s\n' "${OLD:-none}" "$NEW"

      - name: Quality gate (blocking)
        id: gate
        if: steps.cap.outputs.proceed == 'true'
        timeout-minutes: 15
        env:
          REQUIRE_FLOOR: "true"
          REQUIRE_SOURCE_REACH: "true"
          REQUIRE_SOURCE_ECHO: "true"
        run: bash scripts/ci-gate.sh "${{ steps.guard.outputs.date }}"

      # The push credential enters here, after the agent has finished and been judged.
      - name: Publish
        id: publish
        # For a replace, publishing requires the agent to have run, the runId to be new and the gate to
        # pass — explicitly, because a SKIPPED gate is not a failure and would otherwise let ci-publish
        # restore the old edition from the archive and report green. A repicture is held to the same
        # rule (its draft is the old edition, so a skipped gate would republish the old edition under
        # the old runId and call it a repair).
        if: ${{ !inputs.dry_run && (steps.guard.outputs.mode != 'done') && (!(inputs.replace_today || inputs.repicture_today) || (steps.cap.outputs.proceed == 'true' && steps.rid.outcome == 'success' && steps.gate.outcome == 'success')) }}
        env:
          # Empty on every other run, which leaves publish-pages.sh its own "brief: <date>".
          BRIEF_COMMIT_MESSAGE: "${{ inputs.repicture_today && format('brief: {0} · pictures redone', steps.guard.outputs.date) || '' }}"
          BRIEF_FEEDBACK_URL: ${{ secrets.BRIEF_API_URL }}
          GH_PUSH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
        run: bash scripts/ci-publish.sh "${{ steps.guard.outputs.date }}"

      - name: Ask GitHub Pages to build
        if: ${{ !inputs.dry_run && (steps.guard.outputs.mode != 'done') && (!(inputs.replace_today || inputs.repicture_today) || (steps.cap.outputs.proceed == 'true' && steps.rid.outcome == 'success' && steps.gate.outcome == 'success')) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

      # The only judge of this run's colour, and it runs even when something above failed, because the
      # question it answers is whether the reader has today's brief.
      - name: Prove the reader is served
        id: served
        if: ${{ !inputs.dry_run && (always() && steps.guard.conclusion == 'success' && steps.guard.outputs.mode != 'done') && (!(inputs.replace_today || inputs.repicture_today) || steps.publish.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
          PUSHED_SHA: ${{ steps.publish.outputs.sha }}
        run: bash scripts/brief-liveness.sh "${{ steps.guard.outputs.date }}"

      # Cross-day memory, to the public pages repo: the engine key is read-only, and engine write access
      # would mean write access to tomorrow's prompt. Keyed on the push, not on the proof – the push makes
      # the edition real, and these appends exist only in this runner, so a CDN lag must not discard them.
      # NOT ON A REPICTURE [2026-10-25]: the script rebuilds the ledger from this checkout's own copies,
      # which only the editorial agent updates. A repicture ran no agent, so its copies are the engine
      # branch's committed ones and the push would write the day's readings and Klummen's dated claim
      # out of the public ledger, the same hazard the update workflow describes where it has no ledger step.
      - name: Record the cross-day ledger
        if: ${{ !inputs.dry_run && !inputs.repicture_today && (always() && steps.guard.outputs.mode == 'full' && steps.publish.outcome == 'success') }}
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          PAGES_REPO_DIR: ${{ github.workspace }}/pages
        run: bash scripts/ci-record-ledger.sh "${{ steps.guard.outputs.date }}"

      # From the workspace, not engine/, so a failed engine checkout still gets a summary.
      - name: Summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          MODE: ${{ steps.guard.outputs.mode }}
          DATE: ${{ steps.guard.outputs.date }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          SERVED: ${{ steps.served.outcome }}
          REPICTURE: ${{ inputs.repicture_today }}
        run: |
          printf '### %s – %s\n\n- mode `%s` · engine `%s` · deadline %s CPH\n- pushed `%s` · served `%s`\n' \
            "$BRIEF_LABEL" "${DATE:-unresolved}" "${MODE:-none}" "$ENGINE_REF" "$DEADLINE_CPH" \
            "${PUBLISHED_SHA:-none}" "${SERVED:-skipped}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${REPICTURE:-}" = "true" ]; then
            printf -- '- repicture: the published stories were kept word for word and only their pictures were redone; no editorial agent ran\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Whether the editor looked at the pictures. A missing file means the final pass never ran
          # (a refused flag, a skipped step), which must be as visible as a look that was skipped.
          LOOK="engine/data/${DATE}/picture-look.json"
          if [ -n "${DATE:-}" ] && [ "${MODE:-}" = "full" ]; then
            if [ -f "$LOOK" ]; then
              node -e 'const l=require(process.argv[1]);console.log(`- picture look: ${l.looked?"done":"SKIPPED"} · ${l.matched??l.stamped}/${l.pictures} seen · dropped unseen ${l.droppedUnseen} · ${l.reason}`)' "$(pwd)/$LOOK" >> "$GITHUB_STEP_SUMMARY" || true
            else
              printf -- '- picture look: MISSING, the final picture pass did not run\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            # The stage's own block (per-story table, the desk's report) was written by the stage. This is the
            # one-line verdict, and the line that says so when the stage left no record at all.
            STAGE="engine/data/${DATE}/picture-stage.json"
            if [ -f "$STAGE" ]; then
              node -e 'const s=require(process.argv[1]);console.log(s.ran?`- picture desk: ${s.met?(s.metByRecordsOnly?"floor met BY RECORDS ONLY":"floor met"):"FLOOR MISSED"} · ${s.withPicture}/${s.stories} stories with a picture (${Math.round(100*(s.coverage||0))}%, floor ${Math.round(100*(s.floor||0))}%) · lead ${s.leadHasPicture?"has one":s.leadRecorded?"none, search recorded":"NONE"} · ${s.passes} pass(es) · final ${s.strict?"strict":"lenient"}${(s.unlooked||[]).length?" · UNLOOKED "+s.unlooked.length:""}`:`- picture desk: did not run · ${s.reason||"no reason recorded"}`)' "$(pwd)/$STAGE" >> "$GITHUB_STEP_SUMMARY" || true
            else
              printf -- '- picture desk: NO RECORD, the stage did not run on this engine ref or was cut off\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
